const DATA={"modules":[{"id":0,"title":"Handbook introduction","chapters":[{"title":"Introduction","html":"<h1>Staff Engineer Career Transformation Handbook<\/h1>\n<h2>A Complete 18-Month Roadmap<\/h2>\n<blockquote>\n<p><em>From Senior Backend Engineer → Staff Engineer / Backend Architect / Technical Lead<\/em>\n<em>Target Compensation: ₹60 LPA → ₹1 Crore+<\/em><\/p>\n<\/blockquote>\n<hr />\n<h1>TABLE OF CONTENTS<\/h1>\n<ul>\n<li><a href=\"#part-1--career-strategy\">Part 1 – Career Strategy<\/a><\/li>\n<li><a href=\"#part-2--dsa-mastery\">Part 2 – DSA Mastery<\/a><\/li>\n<li><a href=\"#part-3--advanced-python\">Part 3 – Advanced Python<\/a><\/li>\n<li><a href=\"#part-4--backend-engineering-excellence\">Part 4 – Backend Engineering Excellence<\/a><\/li>\n<li><a href=\"#part-5--postgresql-mastery\">Part 5 – PostgreSQL Mastery<\/a><\/li>\n<li><a href=\"#part-6--distributed-systems\">Part 6 – Distributed Systems<\/a><\/li>\n<li><a href=\"#part-7--system-design-mastery\">Part 7 – System Design Mastery<\/a><\/li>\n<li><a href=\"#part-8--cloud-engineering\">Part 8 – Cloud Engineering<\/a><\/li>\n<li><a href=\"#part-9--kubernetes-mastery\">Part 9 – Kubernetes Mastery<\/a><\/li>\n<li><a href=\"#part-10--observability\">Part 10 – Observability<\/a><\/li>\n<li><a href=\"#part-11--security\">Part 11 – Security<\/a><\/li>\n<li><a href=\"#part-12--testing-excellence\">Part 12 – Testing Excellence<\/a><\/li>\n<li><a href=\"#part-13--go-roadmap\">Part 13 – Go Roadmap<\/a><\/li>\n<li><a href=\"#part-14--kafka--event-streaming\">Part 14 – Kafka &amp; Event Streaming<\/a><\/li>\n<li><a href=\"#part-15--technical-leadership\">Part 15 – Technical Leadership<\/a><\/li>\n<li><a href=\"#part-16--communication-mastery\">Part 16 – Communication Mastery<\/a><\/li>\n<li><a href=\"#part-17--technical-writing\">Part 17 – Technical Writing<\/a><\/li>\n<li><a href=\"#part-18--business-thinking\">Part 18 – Business Thinking<\/a><\/li>\n<li><a href=\"#part-19--interview-preparation\">Part 19 – Interview Preparation<\/a><\/li>\n<li><a href=\"#part-20--execution-blueprint\">Part 20 – Execution Blueprint<\/a><\/li>\n<\/ul>\n<hr />\n","text":"# Staff Engineer Career Transformation Handbook\n## A Complete 18-Month Roadmap\n\n> *From Senior Backend Engineer → Staff Engineer / Backend Architect / Technical Lead*\n> *Target Compensation: ₹60 LPA → ₹1 Crore+*\n\n---\n\n# TABLE OF CONTENTS\n\n- [Part 1 – Career Strategy](#part-1--career-strategy)\n- [Part 2 – DSA Mastery](#part-2--dsa-mastery)\n- [Part 3 – Advanced Python](#part-3--advanced-python)\n- [Part 4 – Backend Engineering Excellence](#part-4--backend-engineering-excellence)\n- [Part 5 – PostgreSQL Mastery](#part-5--postgresql-mastery)\n- [Part 6 – Distributed Systems](#part-6--distributed-systems)\n- [Part 7 – System Design Mastery](#part-7--system-design-mastery)\n- [Part 8 – Cloud Engineering](#part-8--cloud-engineering)\n- [Part 9 – Kubernetes Mastery](#part-9--kubernetes-mastery)\n- [Part 10 – Observability](#part-10--observability)\n- [Part 11 – Security](#part-11--security)\n- [Part 12 – Testing Excellence](#part-12--testing-excellence)\n- [Part 13 – Go Roadmap](#part-13--go-roadmap)\n- [Part 14 – Kafka & Event Streaming](#part-14--kafka--event-streaming)\n- [Part 15 – Technical Leadership](#part-15--technical-leadership)\n- [Part 16 – Communication Mastery](#part-16--communication-mastery)\n- [Part 17 – Technical Writing](#part-17--technical-writing)\n- [Part 18 – Business Thinking](#part-18--business-thinking)\n- [Part 19 – Interview Preparation](#part-19--interview-preparation)\n- [Part 20 – Execution Blueprint](#part-20--execution-blueprint)\n\n---\n\n"}]},{"id":1,"title":"Career Strategy","chapters":[{"title":"Introduction","html":"<h1>PART 1 – CAREER STRATEGY<\/h1>\n<hr />\n","text":"# PART 1 – CAREER STRATEGY\n\n---\n\n"},{"title":"Chapter 1.1 – Senior Engineer vs Staff Engineer","html":"<h2>Chapter 1.1 – Senior Engineer vs Staff Engineer<\/h2>\n<h3>Why This Topic Matters<\/h3>\n<p>Most engineers plateau at Senior because they optimize for <em>depth<\/em> rather than <em>scope<\/em>. The Senior-to-Staff transition is the single hardest career leap in software engineering — harder than Junior to Mid, harder than Mid to Senior. It requires a fundamental identity shift: from being the best individual executor on a team to being the person who makes an entire team, organization, or technical domain significantly more effective.<\/p>\n<p>For an engineer with 6+ years of backend experience, a team lead history, and proven delivery of production systems at scale, the raw technical foundation is mostly there. The gap is <strong>leverage<\/strong> — how to amplify impact beyond your own keyboard.<\/p>\n<h3>Current Level Assessment<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Dimension<\/th>\n  <th>Senior (Current)<\/th>\n  <th>Evidence<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Technical Depth<\/td>\n  <td>✅ Strong<\/td>\n  <td>Distributed AI/ML platform, 1M node systems<\/td>\n<\/tr>\n<tr>\n  <td>Ownership Scope<\/td>\n  <td>✅ Team-level<\/td>\n  <td>Leading 5-6 engineers<\/td>\n<\/tr>\n<tr>\n  <td>Architectural Thinking<\/td>\n  <td>✅ Present<\/td>\n  <td>Multi-tenant identity, GitOps<\/td>\n<\/tr>\n<tr>\n  <td>Cross-team Influence<\/td>\n  <td>⚠️ Developing<\/td>\n  <td>Limited to own team<\/td>\n<\/tr>\n<tr>\n  <td>Technical Narrative<\/td>\n  <td>❌ Weak<\/td>\n  <td>Identified as weakness<\/td>\n<\/tr>\n<tr>\n  <td>Business Impact Framing<\/td>\n  <td>❌ Weak<\/td>\n  <td>Identified as weakness<\/td>\n<\/tr>\n<tr>\n  <td>Public Technical Voice<\/td>\n  <td>❌ Absent<\/td>\n  <td>No writing/speaking<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Target Level Assessment (Staff Engineer)<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Dimension<\/th>\n  <th>Staff Engineer Target<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Technical Depth<\/td>\n  <td>Deep in 2-3 domains, broad across all<\/td>\n<\/tr>\n<tr>\n  <td>Ownership Scope<\/td>\n  <td>Multiple teams, entire product area, or platform<\/td>\n<\/tr>\n<tr>\n  <td>Architectural Thinking<\/td>\n  <td>Drives org-level technical direction<\/td>\n<\/tr>\n<tr>\n  <td>Cross-team Influence<\/td>\n  <td>Defines standards, shapes roadmaps across teams<\/td>\n<\/tr>\n<tr>\n  <td>Technical Narrative<\/td>\n  <td>Can explain complex systems to engineers, product, execs<\/td>\n<\/tr>\n<tr>\n  <td>Business Impact Framing<\/td>\n  <td>Connects technical decisions to revenue, risk, cost<\/td>\n<\/tr>\n<tr>\n  <td>Public Technical Voice<\/td>\n  <td>Recognized internally and ideally externally<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>The Staff Engineer Archetypes<\/h3>\n<p>Different companies define &quot;Staff Engineer&quot; differently. Know which archetype you're optimizing for:<\/p>\n<table>\n<thead>\n<tr>\n  <th>Archetype<\/th>\n  <th>Description<\/th>\n  <th>Best Fit For You?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><strong>Tech Lead<\/strong><\/td>\n  <td>Leads a team's technical direction<\/td>\n  <td>✅ Natural fit — already doing this<\/td>\n<\/tr>\n<tr>\n  <td><strong>Solver<\/strong><\/td>\n  <td>Digs into hard, ambiguous org problems<\/td>\n  <td>✅ Possible with system design depth<\/td>\n<\/tr>\n<tr>\n  <td><strong>Architect<\/strong><\/td>\n  <td>Owns org-wide technical vision<\/td>\n  <td>🎯 18-month target<\/td>\n<\/tr>\n<tr>\n  <td><strong>Right Hand<\/strong><\/td>\n  <td>Partners with eng manager/VP<\/td>\n  <td>Possible but political<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Your strongest path: <strong>Tech Lead → Architect<\/strong> archetype, targeting product companies with backend-heavy platforms.<\/p>\n<h3>The Core Difference in Daily Work<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Activity<\/th>\n  <th>Senior Engineer<\/th>\n  <th>Staff Engineer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Coding<\/td>\n  <td>50-70% of time<\/td>\n  <td>20-40% of time<\/td>\n<\/tr>\n<tr>\n  <td>Reviews<\/td>\n  <td>Reviews PRs on own team<\/td>\n  <td>Sets review standards org-wide<\/td>\n<\/tr>\n<tr>\n  <td>Design<\/td>\n  <td>Designs features, services<\/td>\n  <td>Designs systems and platforms<\/td>\n<\/tr>\n<tr>\n  <td>Meetings<\/td>\n  <td>Attends standups, planning<\/td>\n  <td>Drives architecture reviews, strategy<\/td>\n<\/tr>\n<tr>\n  <td>Writing<\/td>\n  <td>Code comments, PR descriptions<\/td>\n  <td>RFCs, ADRs, technical strategy docs<\/td>\n<\/tr>\n<tr>\n  <td>Mentoring<\/td>\n  <td>Helps junior/mid engineers<\/td>\n  <td>Grows senior engineers into staff<\/td>\n<\/tr>\n<tr>\n  <td>Influence<\/td>\n  <td>Persuades teammates<\/td>\n  <td>Persuades leadership<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>The Promotion Trap<\/h3>\n<p>Most engineers try to get promoted by being a &quot;better Senior Engineer.&quot; This almost never works. You must demonstrate Staff-level impact <em>before<\/em> you receive the Staff title. This means:<\/p>\n<ol>\n<li><strong>Take on Staff-scope projects<\/strong> while still a Senior<\/li>\n<li><strong>Build visibility<\/strong> across teams, not just within your team<\/li>\n<li><strong>Solve problems that nobody asked you to solve<\/strong> but that clearly matter<\/li>\n<li><strong>Write things down<\/strong> — the leverage multiplier for influence at scale<\/li>\n<\/ol>\n<h3>Practical Exercises<\/h3>\n<p><strong>Exercise 1.1.1 – Staff Engineer Gap Analysis (Week 1)<\/strong>\nWrite a 2-page doc answering:<\/p>\n<ul>\n<li>What are the 3 biggest technical problems in your current organization that nobody is solving?<\/li>\n<li>Which of those could you own for the next 6 months?<\/li>\n<li>Who are the stakeholders? What's the business impact?<\/li>\n<\/ul>\n<p><strong>Exercise 1.1.2 – Scope Expansion Audit (Week 2)<\/strong>\nMap out every team in your company/org:<\/p>\n<ul>\n<li>What do they build?<\/li>\n<li>What are their pain points?<\/li>\n<li>Where do your systems intersect with theirs?<\/li>\n<li>Where could you add value beyond your charter?<\/li>\n<\/ul>\n<p><strong>Exercise 1.1.3 – Write your Staff Engineer Promo Doc (Month 1)<\/strong>\nEven if promotion is 18 months away, write the document now. Include:<\/p>\n<ul>\n<li>Technical scope and impact<\/li>\n<li>Cross-team projects<\/li>\n<li>Mentoring contributions<\/li>\n<li>What would need to be true to be promoted?<\/li>\n<\/ul>\n<hr />\n","text":"## Chapter 1.1 – Senior Engineer vs Staff Engineer\n\n### Why This Topic Matters\n\nMost engineers plateau at Senior because they optimize for *depth* rather than *scope*. The Senior-to-Staff transition is the single hardest career leap in software engineering — harder than Junior to Mid, harder than Mid to Senior. It requires a fundamental identity shift: from being the best individual executor on a team to being the person who makes an entire team, organization, or technical domain significantly more effective.\n\nFor an engineer with 6+ years of backend experience, a team lead history, and proven delivery of production systems at scale, the raw technical foundation is mostly there. The gap is **leverage** — how to amplify impact beyond your own keyboard.\n\n### Current Level Assessment\n\n| Dimension | Senior (Current) | Evidence |\n|---|---|---|\n| Technical Depth | ✅ Strong | Distributed AI/ML platform, 1M node systems |\n| Ownership Scope | ✅ Team-level | Leading 5-6 engineers |\n| Architectural Thinking | ✅ Present | Multi-tenant identity, GitOps |\n| Cross-team Influence | ⚠️ Developing | Limited to own team |\n| Technical Narrative | ❌ Weak | Identified as weakness |\n| Business Impact Framing | ❌ Weak | Identified as weakness |\n| Public Technical Voice | ❌ Absent | No writing/speaking |\n\n### Target Level Assessment (Staff Engineer)\n\n| Dimension | Staff Engineer Target |\n|---|---|\n| Technical Depth | Deep in 2-3 domains, broad across all |\n| Ownership Scope | Multiple teams, entire product area, or platform |\n| Architectural Thinking | Drives org-level technical direction |\n| Cross-team Influence | Defines standards, shapes roadmaps across teams |\n| Technical Narrative | Can explain complex systems to engineers, product, execs |\n| Business Impact Framing | Connects technical decisions to revenue, risk, cost |\n| Public Technical Voice | Recognized internally and ideally externally |\n\n### The Staff Engineer Archetypes\n\nDifferent companies define \"Staff Engineer\" differently. Know which archetype you're optimizing for:\n\n| Archetype | Description | Best Fit For You? |\n|---|---|---|\n| **Tech Lead** | Leads a team's technical direction | ✅ Natural fit — already doing this |\n| **Solver** | Digs into hard, ambiguous org problems | ✅ Possible with system design depth |\n| **Architect** | Owns org-wide technical vision | 🎯 18-month target |\n| **Right Hand** | Partners with eng manager/VP | Possible but political |\n\nYour strongest path: **Tech Lead → Architect** archetype, targeting product companies with backend-heavy platforms.\n\n### The Core Difference in Daily Work\n\n| Activity | Senior Engineer | Staff Engineer |\n|---|---|---|\n| Coding | 50-70% of time | 20-40% of time |\n| Reviews | Reviews PRs on own team | Sets review standards org-wide |\n| Design | Designs features, services | Designs systems and platforms |\n| Meetings | Attends standups, planning | Drives architecture reviews, strategy |\n| Writing | Code comments, PR descriptions | RFCs, ADRs, technical strategy docs |\n| Mentoring | Helps junior/mid engineers | Grows senior engineers into staff |\n| Influence | Persuades teammates | Persuades leadership |\n\n### The Promotion Trap\n\nMost engineers try to get promoted by being a \"better Senior Engineer.\" This almost never works. You must demonstrate Staff-level impact *before* you receive the Staff title. This means:\n\n1. **Take on Staff-scope projects** while still a Senior\n2. **Build visibility** across teams, not just within your team\n3. **Solve problems that nobody asked you to solve** but that clearly matter\n4. **Write things down** — the leverage multiplier for influence at scale\n\n### Practical Exercises\n\n**Exercise 1.1.1 – Staff Engineer Gap Analysis (Week 1)**\nWrite a 2-page doc answering:\n- What are the 3 biggest technical problems in your current organization that nobody is solving?\n- Which of those could you own for the next 6 months?\n- Who are the stakeholders? What's the business impact?\n\n**Exercise 1.1.2 – Scope Expansion Audit (Week 2)**\nMap out every team in your company/org:\n- What do they build?\n- What are their pain points?\n- Where do your systems intersect with theirs?\n- Where could you add value beyond your charter?\n\n**Exercise 1.1.3 – Write your Staff Engineer Promo Doc (Month 1)**\nEven if promotion is 18 months away, write the document now. Include:\n- Technical scope and impact\n- Cross-team projects\n- Mentoring contributions\n- What would need to be true to be promoted?\n\n---\n\n"},{"title":"Chapter 1.2 – Staff vs Principal vs Architect","html":"<h2>Chapter 1.2 – Staff vs Principal vs Architect<\/h2>\n<h3>The Seniority Ladder in Modern Tech Companies<\/h3>\n<pre><code>Junior (L3)\n    ↓\nMid-Level (L4)\n    ↓\nSenior (L5) ← You are here\n    ↓\nStaff (L6)  ← 18-month target\n    ↓\nPrincipal (L7)\n    ↓\nDistinguished (L8)\n    ↓\nFellow (L9)\n<\/code><\/pre>\n<p><em>(Levels vary by company. Amazon uses SDE I/II/III/Principal. Google uses L3-L10. Meta uses E3-E9.)<\/em><\/p>\n<h3>Scope Comparison<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Level<\/th>\n  <th>Typical Scope<\/th>\n  <th>Primary Currency<\/th>\n  <th>Timescale<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Senior<\/td>\n  <td>Team / Service<\/td>\n  <td>Execution<\/td>\n  <td>Sprints / Quarters<\/td>\n<\/tr>\n<tr>\n  <td>Staff<\/td>\n  <td>Team cluster / Product area<\/td>\n  <td>Influence + Execution<\/td>\n  <td>Quarters / Years<\/td>\n<\/tr>\n<tr>\n  <td>Principal<\/td>\n  <td>Organization / Division<\/td>\n  <td>Direction setting<\/td>\n  <td>Years<\/td>\n<\/tr>\n<tr>\n  <td>Distinguished<\/td>\n  <td>Company-wide<\/td>\n  <td>Vision / Industry<\/td>\n  <td>3-5 years<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>What Gets You from Staff to Principal<\/h3>\n<p>Once you achieve Staff, the next leap is:<\/p>\n<ul>\n<li>You stop solving <em>given<\/em> problems and start <em>finding<\/em> the right problems<\/li>\n<li>You write fewer technical specs and more technical <em>strategy<\/em><\/li>\n<li>Your scope includes product roadmap, hiring strategy, org design<\/li>\n<li>You represent the company at conferences, open source, standards bodies<\/li>\n<\/ul>\n<p><strong>For your 18-month goal: Focus entirely on Staff.<\/strong> Principal comes naturally after 2-4 years at Staff.<\/p>\n<h3>Compensation Ranges (India Market, 2024-2025)<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Level<\/th>\n  <th>Indian Product Companies<\/th>\n  <th>Remote US/EU Startups<\/th>\n  <th>FAANG India<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Senior (5-7 yr)<\/td>\n  <td>₹25-40 LPA<\/td>\n  <td>$80-120K (~₹65-100 LPA)<\/td>\n  <td>₹40-60 LPA<\/td>\n<\/tr>\n<tr>\n  <td>Staff (7-10 yr)<\/td>\n  <td>₹50-80 LPA<\/td>\n  <td>$130-180K (~₹110-150 LPA)<\/td>\n  <td>₹80-120 LPA<\/td>\n<\/tr>\n<tr>\n  <td>Principal (10+ yr)<\/td>\n  <td>₹80-150 LPA<\/td>\n  <td>$180-250K (~₹150-210 LPA)<\/td>\n  <td>₹120-200 LPA<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>Your target of ₹60 LPA to ₹1 Crore is achievable at Staff level in remote-first US/EU companies or at Principal level in top Indian product companies.<\/p>\n<\/blockquote>\n<hr />\n","text":"## Chapter 1.2 – Staff vs Principal vs Architect\n\n### The Seniority Ladder in Modern Tech Companies\n\n```\nJunior (L3)\n    ↓\nMid-Level (L4)\n    ↓\nSenior (L5) ← You are here\n    ↓\nStaff (L6)  ← 18-month target\n    ↓\nPrincipal (L7)\n    ↓\nDistinguished (L8)\n    ↓\nFellow (L9)\n```\n\n*(Levels vary by company. Amazon uses SDE I/II/III/Principal. Google uses L3-L10. Meta uses E3-E9.)*\n\n### Scope Comparison\n\n| Level | Typical Scope | Primary Currency | Timescale |\n|---|---|---|---|\n| Senior | Team / Service | Execution | Sprints / Quarters |\n| Staff | Team cluster / Product area | Influence + Execution | Quarters / Years |\n| Principal | Organization / Division | Direction setting | Years |\n| Distinguished | Company-wide | Vision / Industry | 3-5 years |\n\n### What Gets You from Staff to Principal\n\nOnce you achieve Staff, the next leap is:\n- You stop solving *given* problems and start *finding* the right problems\n- You write fewer technical specs and more technical *strategy*\n- Your scope includes product roadmap, hiring strategy, org design\n- You represent the company at conferences, open source, standards bodies\n\n**For your 18-month goal: Focus entirely on Staff.** Principal comes naturally after 2-4 years at Staff.\n\n### Compensation Ranges (India Market, 2024-2025)\n\n| Level | Indian Product Companies | Remote US/EU Startups | FAANG India |\n|---|---|---|---|\n| Senior (5-7 yr) | ₹25-40 LPA | $80-120K (~₹65-100 LPA) | ₹40-60 LPA |\n| Staff (7-10 yr) | ₹50-80 LPA | $130-180K (~₹110-150 LPA) | ₹80-120 LPA |\n| Principal (10+ yr) | ₹80-150 LPA | $180-250K (~₹150-210 LPA) | ₹120-200 LPA |\n\n> Your target of ₹60 LPA to ₹1 Crore is achievable at Staff level in remote-first US/EU companies or at Principal level in top Indian product companies.\n\n---\n\n"},{"title":"Chapter 1.3 – How Compensation Scales","html":"<h2>Chapter 1.3 – How Compensation Scales<\/h2>\n<h3>The Three Levers<\/h3>\n<ol>\n<li><strong>Level<\/strong> — The biggest jump. Going from Senior to Staff often means 40-80% compensation increase.<\/li>\n<li><strong>Company<\/strong> — A Staff at Zepto pays differently than a Staff at Atlassian or Stripe.<\/li>\n<li><strong>Location<\/strong> — Remote US/EU roles pay 2-4x Indian market rates for same level.<\/li>\n<\/ol>\n<h3>Compensation Components<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Component<\/th>\n  <th>Indian Role<\/th>\n  <th>Remote US Role<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Base Salary<\/td>\n  <td>₹45-60 LPA<\/td>\n  <td>$120-150K<\/td>\n<\/tr>\n<tr>\n  <td>Stock (RSUs)<\/td>\n  <td>₹5-15 LPA (vesting)<\/td>\n  <td>$30-60K/yr (vesting)<\/td>\n<\/tr>\n<tr>\n  <td>Bonus<\/td>\n  <td>10-20%<\/td>\n  <td>10-20%<\/td>\n<\/tr>\n<tr>\n  <td>Total<\/td>\n  <td>₹55-80 LPA<\/td>\n  <td>$165-210K ≈ ₹140-175 LPA<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>How to Maximize Compensation<\/h3>\n<p><strong>Strategy 1 – Competing Offers<\/strong>\nThe most reliable way to get a 30-50% raise is to have a competing offer. Start interviewing at 12 months into this roadmap, even if you don't want to leave.<\/p>\n<p><strong>Strategy 2 – Target Companies with High EV/Employee Ratios<\/strong>\nCompanies like Stripe, Datadog, Notion, Linear, Vercel, and well-funded Series B/C startups pay Staff engineers disproportionately because each engineer has high revenue leverage.<\/p>\n<p><strong>Strategy 3 – Target Infrastructure / Platform Roles<\/strong>\nCompanies hiring Staff Engineers for data infrastructure, developer platforms, or ML platforms pay a premium. Your AI/ML platform experience is directly marketable.<\/p>\n<p><strong>Strategy 4 – Build Public Signal<\/strong>\nA GitHub with quality OSS contributions, or a technical blog with 10K+ monthly readers, gives you leverage that pure interview performance cannot.<\/p>\n<hr />\n","text":"## Chapter 1.3 – How Compensation Scales\n\n### The Three Levers\n\n1. **Level** — The biggest jump. Going from Senior to Staff often means 40-80% compensation increase.\n2. **Company** — A Staff at Zepto pays differently than a Staff at Atlassian or Stripe.\n3. **Location** — Remote US/EU roles pay 2-4x Indian market rates for same level.\n\n### Compensation Components\n\n| Component | Indian Role | Remote US Role |\n|---|---|---|\n| Base Salary | ₹45-60 LPA | $120-150K |\n| Stock (RSUs) | ₹5-15 LPA (vesting) | $30-60K/yr (vesting) |\n| Bonus | 10-20% | 10-20% |\n| Total | ₹55-80 LPA | $165-210K ≈ ₹140-175 LPA |\n\n### How to Maximize Compensation\n\n**Strategy 1 – Competing Offers**\nThe most reliable way to get a 30-50% raise is to have a competing offer. Start interviewing at 12 months into this roadmap, even if you don't want to leave.\n\n**Strategy 2 – Target Companies with High EV/Employee Ratios**\nCompanies like Stripe, Datadog, Notion, Linear, Vercel, and well-funded Series B/C startups pay Staff engineers disproportionately because each engineer has high revenue leverage.\n\n**Strategy 3 – Target Infrastructure / Platform Roles**\nCompanies hiring Staff Engineers for data infrastructure, developer platforms, or ML platforms pay a premium. Your AI/ML platform experience is directly marketable.\n\n**Strategy 4 – Build Public Signal**\nA GitHub with quality OSS contributions, or a technical blog with 10K+ monthly readers, gives you leverage that pure interview performance cannot.\n\n---\n\n"},{"title":"Chapter 1.4 – How Promotions Actually Happen","html":"<h2>Chapter 1.4 – How Promotions Actually Happen<\/h2>\n<h3>The Hidden Promotion Game<\/h3>\n<p>Promotions are decided by calibration committees, not by your manager alone. Your manager <em>advocates<\/em> for you, but the committee uses evidence. Your job is to generate evidence.<\/p>\n<h3>The Promotion Equation<\/h3>\n<pre><code>Promotion = Sustained Performance + Scope Expansion + Visibility + Advocacy\n<\/code><\/pre>\n<p><strong>Sustained Performance<\/strong> — Delivering at Staff scope for 2-4 quarters consistently.<\/p>\n<p><strong>Scope Expansion<\/strong> — Your impact clearly extends beyond your immediate team.<\/p>\n<p><strong>Visibility<\/strong> — Decision-makers know your name and associate it with impact.<\/p>\n<p><strong>Advocacy<\/strong> — At least 2-3 senior people who will go to bat for you in calibration.<\/p>\n<h3>The 90-Day Sponsor Strategy<\/h3>\n<p>Identify the most influential Staff/Principal/Director in your org. Your goal is to work with them directly on something meaningful in the next 90 days. This creates natural advocacy.<\/p>\n<p>How:<\/p>\n<ul>\n<li>Ask to be on their next cross-team initiative<\/li>\n<li>Volunteer to write the RFC for a problem they care about<\/li>\n<li>Review their technical proposals with thoughtful feedback<\/li>\n<\/ul>\n<h3>Promotion Anti-Patterns to Avoid<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Anti-Pattern<\/th>\n  <th>Why It Fails<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>&quot;I've been here long enough&quot;<\/td>\n  <td>Tenure is not impact<\/td>\n<\/tr>\n<tr>\n  <td>Waiting to be asked<\/td>\n  <td>Staff engineers self-direct<\/td>\n<\/tr>\n<tr>\n  <td>Only impressing your direct team<\/td>\n  <td>Calibration panels need broader signal<\/td>\n<\/tr>\n<tr>\n  <td>Building things without documentation<\/td>\n  <td>Invisible work gets no credit<\/td>\n<\/tr>\n<tr>\n  <td>Saying &quot;yes&quot; to everything<\/td>\n  <td>Dilutes focus, reduces impact per project<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n","text":"## Chapter 1.4 – How Promotions Actually Happen\n\n### The Hidden Promotion Game\n\nPromotions are decided by calibration committees, not by your manager alone. Your manager *advocates* for you, but the committee uses evidence. Your job is to generate evidence.\n\n### The Promotion Equation\n\n```\nPromotion = Sustained Performance + Scope Expansion + Visibility + Advocacy\n```\n\n**Sustained Performance** — Delivering at Staff scope for 2-4 quarters consistently.\n\n**Scope Expansion** — Your impact clearly extends beyond your immediate team.\n\n**Visibility** — Decision-makers know your name and associate it with impact.\n\n**Advocacy** — At least 2-3 senior people who will go to bat for you in calibration.\n\n### The 90-Day Sponsor Strategy\n\nIdentify the most influential Staff/Principal/Director in your org. Your goal is to work with them directly on something meaningful in the next 90 days. This creates natural advocacy.\n\nHow:\n- Ask to be on their next cross-team initiative\n- Volunteer to write the RFC for a problem they care about\n- Review their technical proposals with thoughtful feedback\n\n### Promotion Anti-Patterns to Avoid\n\n| Anti-Pattern | Why It Fails |\n|---|---|\n| \"I've been here long enough\" | Tenure is not impact |\n| Waiting to be asked | Staff engineers self-direct |\n| Only impressing your direct team | Calibration panels need broader signal |\n| Building things without documentation | Invisible work gets no credit |\n| Saying \"yes\" to everything | Dilutes focus, reduces impact per project |\n\n---\n\n"},{"title":"Chapter 1.5 – Building a Career Moat","html":"<h2>Chapter 1.5 – Building a Career Moat<\/h2>\n<h3>What Is a Career Moat?<\/h3>\n<p>A career moat is a defensible, accumulating set of advantages that makes you increasingly valuable over time and increasingly difficult to replace. It consists of:<\/p>\n<ol>\n<li><strong>Technical Depth<\/strong> — Deep expertise in 2-3 high-demand areas<\/li>\n<li><strong>System-Building Track Record<\/strong> — Provable impact at scale<\/li>\n<li><strong>Network<\/strong> — Relationships that generate opportunities<\/li>\n<li><strong>Public Signal<\/strong> — Reputation that precedes you<\/li>\n<\/ol>\n<h3>Building your Career Moat<\/h3>\n<p>Given your background in distributed systems, AI/ML platforms, and Python backend engineering, the highest-value moat combination is:<\/p>\n<pre><code>Distributed Backend Systems (Deep) \n    + AI/ML Infrastructure (Unique differentiator)\n    + Python Platform Engineering (Execution credibility)\n    + Technical Writing (Reputation multiplier)\n<\/code><\/pre>\n<p>This positions you for roles like:<\/p>\n<ul>\n<li>Staff Backend Engineer at AI-first companies<\/li>\n<li>Platform Engineering Lead at ML infrastructure companies<\/li>\n<li>Backend Architect at high-growth SaaS companies<\/li>\n<\/ul>\n<h3>Moat-Building Activities (Ongoing, Throughout 18 Months)<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Activity<\/th>\n  <th>Time Investment<\/th>\n  <th>Moat Contribution<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Technical blog (1 post/month)<\/td>\n  <td>4-6 hrs/month<\/td>\n  <td>Public reputation<\/td>\n<\/tr>\n<tr>\n  <td>OSS contributions (1-2/quarter)<\/td>\n  <td>8-12 hrs/quarter<\/td>\n  <td>Credibility + network<\/td>\n<\/tr>\n<tr>\n  <td>Internal RFCs and design docs<\/td>\n  <td>Part of normal work<\/td>\n  <td>Visibility + advocacy signal<\/td>\n<\/tr>\n<tr>\n  <td>Conference talk (1/year)<\/td>\n  <td>20-30 hrs prep<\/td>\n  <td>Network + public signal<\/td>\n<\/tr>\n<tr>\n  <td>Twitter/LinkedIn technical posts<\/td>\n  <td>1-2 hrs/week<\/td>\n  <td>Audience building<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Milestone Checkpoints<\/h3>\n<ul>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Month 3: Write first public technical blog post<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Month 6: Lead first cross-team technical initiative<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Month 9: First external conference or internal tech talk<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Month 12: Have competed offers from at least 2 companies<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Month 18: Promoted to Staff or have accepted Staff-level offer<\/li>\n<\/ul>\n<hr />\n","text":"## Chapter 1.5 – Building a Career Moat\n\n### What Is a Career Moat?\n\nA career moat is a defensible, accumulating set of advantages that makes you increasingly valuable over time and increasingly difficult to replace. It consists of:\n\n1. **Technical Depth** — Deep expertise in 2-3 high-demand areas\n2. **System-Building Track Record** — Provable impact at scale\n3. **Network** — Relationships that generate opportunities\n4. **Public Signal** — Reputation that precedes you\n\n### Building your Career Moat\n\nGiven your background in distributed systems, AI/ML platforms, and Python backend engineering, the highest-value moat combination is:\n\n```\nDistributed Backend Systems (Deep) \n    + AI/ML Infrastructure (Unique differentiator)\n    + Python Platform Engineering (Execution credibility)\n    + Technical Writing (Reputation multiplier)\n```\n\nThis positions you for roles like:\n- Staff Backend Engineer at AI-first companies\n- Platform Engineering Lead at ML infrastructure companies\n- Backend Architect at high-growth SaaS companies\n\n### Moat-Building Activities (Ongoing, Throughout 18 Months)\n\n| Activity | Time Investment | Moat Contribution |\n|---|---|---|\n| Technical blog (1 post/month) | 4-6 hrs/month | Public reputation |\n| OSS contributions (1-2/quarter) | 8-12 hrs/quarter | Credibility + network |\n| Internal RFCs and design docs | Part of normal work | Visibility + advocacy signal |\n| Conference talk (1/year) | 20-30 hrs prep | Network + public signal |\n| Twitter/LinkedIn technical posts | 1-2 hrs/week | Audience building |\n\n### Milestone Checkpoints\n\n- [ ] Month 3: Write first public technical blog post\n- [ ] Month 6: Lead first cross-team technical initiative\n- [ ] Month 9: First external conference or internal tech talk\n- [ ] Month 12: Have competed offers from at least 2 companies\n- [ ] Month 18: Promoted to Staff or have accepted Staff-level offer\n\n---\n\n"}]},{"id":2,"title":"DSA Mastery","chapters":[{"title":"Introduction","html":"<h1>PART 2 – DSA MASTERY<\/h1>\n<hr />\n","text":"# PART 2 – DSA MASTERY\n\n---\n\n"},{"title":"Chapter 2.1 – Why DSA Matters for Staff Engineers","html":"<h2>Chapter 2.1 – Why DSA Matters for Staff Engineers<\/h2>\n<h3>The Uncomfortable Truth<\/h3>\n<p>Most Staff Engineers don't write LeetCode-style algorithms at work. But every FAANG and top product company uses algorithmic interviews as a <em>proxy<\/em> for:<\/p>\n<ul>\n<li>Problem decomposition skills<\/li>\n<li>Ability to think under pressure<\/li>\n<li>Communication while solving<\/li>\n<li>Understanding of time/space complexity<\/li>\n<\/ul>\n<p>For remote US/EU roles — Your primary compensation target — algorithmic interviews are essentially mandatory at Senior+ levels. At Staff level, interviews are harder, not easier.<\/p>\n<h3>Current Level Assessment<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Area<\/th>\n  <th>Current<\/th>\n  <th>Evidence<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Arrays / Strings<\/td>\n  <td>⚠️ Moderate<\/td>\n  <td>General programming experience<\/td>\n<\/tr>\n<tr>\n  <td>Binary Search<\/td>\n  <td>⚠️ Moderate<\/td>\n  <td>Applied in production systems<\/td>\n<\/tr>\n<tr>\n  <td>Trees / Graphs<\/td>\n  <td>❌ Weak<\/td>\n  <td>Self-identified weakness<\/td>\n<\/tr>\n<tr>\n  <td>Dynamic Programming<\/td>\n  <td>❌ Weak<\/td>\n  <td>Self-identified weakness<\/td>\n<\/tr>\n<tr>\n  <td>System Design (coding)<\/td>\n  <td>✅ Strong<\/td>\n  <td>Direct professional experience<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Target Level Assessment<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Area<\/th>\n  <th>Target<\/th>\n  <th>Standard<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Easy problems<\/td>\n  <td>Solve in 10-15 min<\/td>\n  <td>Reflexive, no thinking required<\/td>\n<\/tr>\n<tr>\n  <td>Medium problems<\/td>\n  <td>Solve in 25-35 min<\/td>\n  <td>Optimal solution first try<\/td>\n<\/tr>\n<tr>\n  <td>Hard problems<\/td>\n  <td>Solve in 45-60 min or recognize pattern<\/td>\n  <td>Demonstrate thought process clearly<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n","text":"## Chapter 2.1 – Why DSA Matters for Staff Engineers\n\n### The Uncomfortable Truth\n\nMost Staff Engineers don't write LeetCode-style algorithms at work. But every FAANG and top product company uses algorithmic interviews as a *proxy* for:\n- Problem decomposition skills\n- Ability to think under pressure\n- Communication while solving\n- Understanding of time/space complexity\n\nFor remote US/EU roles — Your primary compensation target — algorithmic interviews are essentially mandatory at Senior+ levels. At Staff level, interviews are harder, not easier.\n\n### Current Level Assessment\n\n| Area | Current | Evidence |\n|---|---|---|\n| Arrays / Strings | ⚠️ Moderate | General programming experience |\n| Binary Search | ⚠️ Moderate | Applied in production systems |\n| Trees / Graphs | ❌ Weak | Self-identified weakness |\n| Dynamic Programming | ❌ Weak | Self-identified weakness |\n| System Design (coding) | ✅ Strong | Direct professional experience |\n\n### Target Level Assessment\n\n| Area | Target | Standard |\n|---|---|---|\n| Easy problems | Solve in 10-15 min | Reflexive, no thinking required |\n| Medium problems | Solve in 25-35 min | Optimal solution first try |\n| Hard problems | Solve in 45-60 min or recognize pattern | Demonstrate thought process clearly |\n\n---\n\n"},{"title":"Chapter 2.2 – Complete DSA Syllabus","html":"<h2>Chapter 2.2 – Complete DSA Syllabus<\/h2>\n<h3>Topic 1: Arrays &amp; Two Pointers<\/h3>\n<p><strong>Core concepts:<\/strong><\/p>\n<ul>\n<li>In-place modification<\/li>\n<li>Two-pointer patterns (converging, diverging, same-direction)<\/li>\n<li>Prefix sums<\/li>\n<li>Dutch national flag problem (3-way partition)<\/li>\n<li>Kadane's algorithm (maximum subarray)<\/li>\n<\/ul>\n<p><strong>Must-know patterns:<\/strong><\/p>\n<pre><code>Two Sum → HashMap approach\nTrapping Rain Water → Two pointers from both ends\nContainer With Most Water → Greedy two pointers\nRotate Array → Reversal technique\n<\/code><\/pre>\n<p><strong>Practice Problems (Arrays):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n  <th>#<\/th>\n  <th>Problem<\/th>\n  <th>Difficulty<\/th>\n  <th>Pattern<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>1<\/td>\n  <td>Two Sum<\/td>\n  <td>Easy<\/td>\n  <td>HashMap<\/td>\n<\/tr>\n<tr>\n  <td>2<\/td>\n  <td>Best Time to Buy Stock<\/td>\n  <td>Easy<\/td>\n  <td>Single pass<\/td>\n<\/tr>\n<tr>\n  <td>3<\/td>\n  <td>Contains Duplicate<\/td>\n  <td>Easy<\/td>\n  <td>HashSet<\/td>\n<\/tr>\n<tr>\n  <td>4<\/td>\n  <td>Product of Array Except Self<\/td>\n  <td>Medium<\/td>\n  <td>Prefix/Suffix<\/td>\n<\/tr>\n<tr>\n  <td>5<\/td>\n  <td>Maximum Subarray<\/td>\n  <td>Medium<\/td>\n  <td>Kadane<\/td>\n<\/tr>\n<tr>\n  <td>6<\/td>\n  <td>Maximum Product Subarray<\/td>\n  <td>Medium<\/td>\n  <td>DP-like<\/td>\n<\/tr>\n<tr>\n  <td>7<\/td>\n  <td>Find Min in Rotated Sorted Array<\/td>\n  <td>Medium<\/td>\n  <td>Binary Search<\/td>\n<\/tr>\n<tr>\n  <td>8<\/td>\n  <td>Search in Rotated Sorted Array<\/td>\n  <td>Medium<\/td>\n  <td>Modified BS<\/td>\n<\/tr>\n<tr>\n  <td>9<\/td>\n  <td>3Sum<\/td>\n  <td>Medium<\/td>\n  <td>Two Pointers<\/td>\n<\/tr>\n<tr>\n  <td>10<\/td>\n  <td>Container With Most Water<\/td>\n  <td>Medium<\/td>\n  <td>Two Pointers<\/td>\n<\/tr>\n<tr>\n  <td>11<\/td>\n  <td>Trapping Rain Water<\/td>\n  <td>Hard<\/td>\n  <td>Two Pointers<\/td>\n<\/tr>\n<tr>\n  <td>12<\/td>\n  <td>Merge k Sorted Lists (array variant)<\/td>\n  <td>Hard<\/td>\n  <td>Heap<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3>Topic 2: Strings<\/h3>\n<p><strong>Core concepts:<\/strong><\/p>\n<ul>\n<li>Character frequency maps<\/li>\n<li>Sliding window on strings<\/li>\n<li>String matching (KMP, Rabin-Karp conceptually)<\/li>\n<li>Palindrome techniques (expand from center, Manacher's)<\/li>\n<li>Anagram detection<\/li>\n<\/ul>\n<p><strong>Practice Problems (Strings):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n  <th>#<\/th>\n  <th>Problem<\/th>\n  <th>Difficulty<\/th>\n  <th>Pattern<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>13<\/td>\n  <td>Valid Anagram<\/td>\n  <td>Easy<\/td>\n  <td>Frequency map<\/td>\n<\/tr>\n<tr>\n  <td>14<\/td>\n  <td>Valid Palindrome<\/td>\n  <td>Easy<\/td>\n  <td>Two pointers<\/td>\n<\/tr>\n<tr>\n  <td>15<\/td>\n  <td>Longest Common Prefix<\/td>\n  <td>Easy<\/td>\n  <td>Vertical scanning<\/td>\n<\/tr>\n<tr>\n  <td>16<\/td>\n  <td>Valid Parentheses<\/td>\n  <td>Easy<\/td>\n  <td>Stack<\/td>\n<\/tr>\n<tr>\n  <td>17<\/td>\n  <td>Longest Substring Without Repeating<\/td>\n  <td>Medium<\/td>\n  <td>Sliding window<\/td>\n<\/tr>\n<tr>\n  <td>18<\/td>\n  <td>Longest Repeating Character Replacement<\/td>\n  <td>Medium<\/td>\n  <td>Sliding window<\/td>\n<\/tr>\n<tr>\n  <td>19<\/td>\n  <td>Minimum Window Substring<\/td>\n  <td>Hard<\/td>\n  <td>Sliding window<\/td>\n<\/tr>\n<tr>\n  <td>20<\/td>\n  <td>Group Anagrams<\/td>\n  <td>Medium<\/td>\n  <td>HashMap<\/td>\n<\/tr>\n<tr>\n  <td>21<\/td>\n  <td>Encode/Decode Strings<\/td>\n  <td>Medium<\/td>\n  <td>Length prefix<\/td>\n<\/tr>\n<tr>\n  <td>22<\/td>\n  <td>Palindromic Substrings<\/td>\n  <td>Medium<\/td>\n  <td>Expand center<\/td>\n<\/tr>\n<tr>\n  <td>23<\/td>\n  <td>Longest Palindromic Substring<\/td>\n  <td>Medium<\/td>\n  <td>Expand center<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3>Topic 3: Hash Maps &amp; Hash Sets<\/h3>\n<p><strong>Core concepts:<\/strong><\/p>\n<ul>\n<li>O(1) average lookup, insert, delete<\/li>\n<li>Collision handling (chaining vs open addressing)<\/li>\n<li>When to use HashMap vs Array<\/li>\n<li>Count frequency, find pairs, find duplicates<\/li>\n<\/ul>\n<p><strong>Practice Problems (Hash Maps):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n  <th>#<\/th>\n  <th>Problem<\/th>\n  <th>Difficulty<\/th>\n  <th>Pattern<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>24<\/td>\n  <td>Two Sum<\/td>\n  <td>Easy<\/td>\n  <td>HashMap<\/td>\n<\/tr>\n<tr>\n  <td>25<\/td>\n  <td>Group Anagrams<\/td>\n  <td>Medium<\/td>\n  <td>HashMap of lists<\/td>\n<\/tr>\n<tr>\n  <td>26<\/td>\n  <td>Top K Frequent Elements<\/td>\n  <td>Medium<\/td>\n  <td>HashMap + Heap<\/td>\n<\/tr>\n<tr>\n  <td>27<\/td>\n  <td>Encode and Decode<\/td>\n  <td>Medium<\/td>\n  <td>Design<\/td>\n<\/tr>\n<tr>\n  <td>28<\/td>\n  <td>Product of Array Except Self<\/td>\n  <td>Medium<\/td>\n  <td>No division trick<\/td>\n<\/tr>\n<tr>\n  <td>29<\/td>\n  <td>Longest Consecutive Sequence<\/td>\n  <td>Medium<\/td>\n  <td>HashSet<\/td>\n<\/tr>\n<tr>\n  <td>30<\/td>\n  <td>Four Sum II<\/td>\n  <td>Medium<\/td>\n  <td>HashMap pairs<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3>Topic 4: Sliding Window<\/h3>\n<p><strong>Core concepts:<\/strong><\/p>\n<ul>\n<li>Fixed-size window<\/li>\n<li>Variable-size window (expand/contract)<\/li>\n<li>Two-pointer as sliding window<\/li>\n<li>When to use: &quot;subarray/substring of length k with property X&quot;<\/li>\n<\/ul>\n<p><strong>The Sliding Window Template:<\/strong><\/p>\n<pre><code class=\"language-python\">def sliding_window(arr, k):\n    left = 0\n    window_state = {}  # or counter, sum, etc.\n    result = 0\n    \n    for right in range(len(arr)):\n        # Add arr[right] to window\n        window_state[arr[right]] = window_state.get(arr[right], 0) + 1\n        \n        # Shrink window if invalid\n        while not valid(window_state):\n            window_state[arr[left]] -= 1\n            if window_state[arr[left]] == 0:\n                del window_state[arr[left]]\n            left += 1\n        \n        # Update result\n        result = max(result, right - left + 1)\n    \n    return result\n<\/code><\/pre>\n<p><strong>Practice Problems (Sliding Window):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n  <th>#<\/th>\n  <th>Problem<\/th>\n  <th>Difficulty<\/th>\n  <th>Window Type<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>31<\/td>\n  <td>Maximum Average Subarray I<\/td>\n  <td>Easy<\/td>\n  <td>Fixed<\/td>\n<\/tr>\n<tr>\n  <td>32<\/td>\n  <td>Longest Substring Without Repeat<\/td>\n  <td>Medium<\/td>\n  <td>Variable<\/td>\n<\/tr>\n<tr>\n  <td>33<\/td>\n  <td>Longest Repeating Char Replacement<\/td>\n  <td>Medium<\/td>\n  <td>Variable<\/td>\n<\/tr>\n<tr>\n  <td>34<\/td>\n  <td>Permutation in String<\/td>\n  <td>Medium<\/td>\n  <td>Fixed<\/td>\n<\/tr>\n<tr>\n  <td>35<\/td>\n  <td>Find All Anagrams in String<\/td>\n  <td>Medium<\/td>\n  <td>Fixed<\/td>\n<\/tr>\n<tr>\n  <td>36<\/td>\n  <td>Minimum Window Substring<\/td>\n  <td>Hard<\/td>\n  <td>Variable<\/td>\n<\/tr>\n<tr>\n  <td>37<\/td>\n  <td>Sliding Window Maximum<\/td>\n  <td>Hard<\/td>\n  <td>Deque<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3>Topic 5: Binary Search<\/h3>\n<p><strong>Core concepts:<\/strong><\/p>\n<ul>\n<li>Classic binary search (find exact target)<\/li>\n<li>Finding left/right boundary<\/li>\n<li>Binary search on answer space<\/li>\n<li>Binary search on rotated arrays<\/li>\n<li>Fractional binary search (floating point)<\/li>\n<\/ul>\n<p><strong>The Binary Search Templates:<\/strong><\/p>\n<pre><code class=\"language-python\"># Template 1: Find exact target\ndef binary_search(arr, target):\n    left, right = 0, len(arr) - 1\n    while left &lt;= right:\n        mid = left + (right - left) // 2\n        if arr[mid] == target:\n            return mid\n        elif arr[mid] &lt; target:\n            left = mid + 1\n        else:\n            right = mid - 1\n    return -1\n\n# Template 2: Find leftmost position\ndef lower_bound(arr, target):\n    left, right = 0, len(arr)\n    while left &lt; right:\n        mid = left + (right - left) // 2\n        if arr[mid] &lt; target:\n            left = mid + 1\n        else:\n            right = mid\n    return left\n\n# Template 3: Binary search on answer\ndef min_max_problem(arr, k):\n    left, right = min(arr), sum(arr)\n    while left &lt; right:\n        mid = left + (right - left) // 2\n        if feasible(arr, mid, k):\n            right = mid\n        else:\n            left = mid + 1\n    return left\n<\/code><\/pre>\n<p><strong>Practice Problems (Binary Search):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n  <th>#<\/th>\n  <th>Problem<\/th>\n  <th>Difficulty<\/th>\n  <th>Type<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>38<\/td>\n  <td>Binary Search<\/td>\n  <td>Easy<\/td>\n  <td>Classic<\/td>\n<\/tr>\n<tr>\n  <td>39<\/td>\n  <td>Search a 2D Matrix<\/td>\n  <td>Medium<\/td>\n  <td>Classic<\/td>\n<\/tr>\n<tr>\n  <td>40<\/td>\n  <td>Koko Eating Bananas<\/td>\n  <td>Medium<\/td>\n  <td>Answer space<\/td>\n<\/tr>\n<tr>\n  <td>41<\/td>\n  <td>Find Min in Rotated Array<\/td>\n  <td>Medium<\/td>\n  <td>Rotated<\/td>\n<\/tr>\n<tr>\n  <td>42<\/td>\n  <td>Search in Rotated Array<\/td>\n  <td>Medium<\/td>\n  <td>Rotated<\/td>\n<\/tr>\n<tr>\n  <td>43<\/td>\n  <td>Time Based Key-Value Store<\/td>\n  <td>Medium<\/td>\n  <td>BS on value<\/td>\n<\/tr>\n<tr>\n  <td>44<\/td>\n  <td>Median of Two Sorted Arrays<\/td>\n  <td>Hard<\/td>\n  <td>Partition<\/td>\n<\/tr>\n<tr>\n  <td>45<\/td>\n  <td>Split Array Largest Sum<\/td>\n  <td>Hard<\/td>\n  <td>Answer space<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3>Topic 6: Trees<\/h3>\n<p><strong>Core concepts:<\/strong><\/p>\n<ul>\n<li>Tree traversals (inorder, preorder, postorder, BFS)<\/li>\n<li>Recursive vs iterative approaches<\/li>\n<li>BST properties and operations<\/li>\n<li>Lowest common ancestor<\/li>\n<li>Tree path problems<\/li>\n<li>Balanced binary tree<\/li>\n<li>Segment trees (for advanced)<\/li>\n<\/ul>\n<p><strong>The DFS Template:<\/strong><\/p>\n<pre><code class=\"language-python\">def dfs(node, state):\n    if not node:\n        return base_case\n    \n    left_result = dfs(node.left, state)\n    right_result = dfs(node.right, state)\n    \n    # Process node\n    current_result = compute(node.val, left_result, right_result)\n    \n    # Update global state if needed\n    state.update(current_result)\n    \n    return current_result\n<\/code><\/pre>\n<p><strong>Practice Problems (Trees):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n  <th>#<\/th>\n  <th>Problem<\/th>\n  <th>Difficulty<\/th>\n  <th>Pattern<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>46<\/td>\n  <td>Invert Binary Tree<\/td>\n  <td>Easy<\/td>\n  <td>DFS<\/td>\n<\/tr>\n<tr>\n  <td>47<\/td>\n  <td>Maximum Depth of Binary Tree<\/td>\n  <td>Easy<\/td>\n  <td>DFS<\/td>\n<\/tr>\n<tr>\n  <td>48<\/td>\n  <td>Same Tree<\/td>\n  <td>Easy<\/td>\n  <td>DFS<\/td>\n<\/tr>\n<tr>\n  <td>49<\/td>\n  <td>Subtree of Another Tree<\/td>\n  <td>Easy<\/td>\n  <td>DFS<\/td>\n<\/tr>\n<tr>\n  <td>50<\/td>\n  <td>Symmetric Tree<\/td>\n  <td>Easy<\/td>\n  <td>DFS<\/td>\n<\/tr>\n<tr>\n  <td>51<\/td>\n  <td>Level Order Traversal<\/td>\n  <td>Medium<\/td>\n  <td>BFS<\/td>\n<\/tr>\n<tr>\n  <td>52<\/td>\n  <td>Binary Tree Right Side View<\/td>\n  <td>Medium<\/td>\n  <td>BFS<\/td>\n<\/tr>\n<tr>\n  <td>53<\/td>\n  <td>Count Good Nodes<\/td>\n  <td>Medium<\/td>\n  <td>DFS with state<\/td>\n<\/tr>\n<tr>\n  <td>54<\/td>\n  <td>Validate BST<\/td>\n  <td>Medium<\/td>\n  <td>DFS with range<\/td>\n<\/tr>\n<tr>\n  <td>55<\/td>\n  <td>Kth Smallest in BST<\/td>\n  <td>Medium<\/td>\n  <td>Inorder<\/td>\n<\/tr>\n<tr>\n  <td>56<\/td>\n  <td>LCA of Binary Tree<\/td>\n  <td>Medium<\/td>\n  <td>DFS<\/td>\n<\/tr>\n<tr>\n  <td>57<\/td>\n  <td>Serialize/Deserialize Binary Tree<\/td>\n  <td>Hard<\/td>\n  <td>BFS/DFS<\/td>\n<\/tr>\n<tr>\n  <td>58<\/td>\n  <td>Binary Tree Max Path Sum<\/td>\n  <td>Hard<\/td>\n  <td>DFS<\/td>\n<\/tr>\n<tr>\n  <td>59<\/td>\n  <td>Construct from Preorder/Inorder<\/td>\n  <td>Medium<\/td>\n  <td>Divide &amp; conquer<\/td>\n<\/tr>\n<tr>\n  <td>60<\/td>\n  <td>Maximum Width of Binary Tree<\/td>\n  <td>Medium<\/td>\n  <td>BFS with indices<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3>Topic 7: Graphs<\/h3>\n<p><strong>Core concepts:<\/strong><\/p>\n<ul>\n<li>Adjacency list vs matrix<\/li>\n<li>DFS on graphs (with visited set)<\/li>\n<li>BFS on graphs (shortest path in unweighted)<\/li>\n<li>Topological sort (Kahn's algorithm, DFS approach)<\/li>\n<li>Union-Find (Disjoint Set Union)<\/li>\n<li>Dijkstra's algorithm (weighted shortest path)<\/li>\n<li>Bellman-Ford (negative weights)<\/li>\n<li>Cycle detection<\/li>\n<\/ul>\n<p><strong>Graph Traversal Templates:<\/strong><\/p>\n<pre><code class=\"language-python\"># BFS (shortest path in unweighted graph)\nfrom collections import deque\n\ndef bfs(graph, start, target):\n    visited = {start}\n    queue = deque([(start, 0)])\n    \n    while queue:\n        node, dist = queue.popleft()\n        if node == target:\n            return dist\n        for neighbor in graph[node]:\n            if neighbor not in visited:\n                visited.add(neighbor)\n                queue.append((neighbor, dist + 1))\n    return -1\n\n# Union-Find\nclass UnionFind:\n    def __init__(self, n):\n        self.parent = list(range(n))\n        self.rank = [0] * n\n    \n    def find(self, x):\n        if self.parent[x] != x:\n            self.parent[x] = self.find(self.parent[x])  # path compression\n        return self.parent[x]\n    \n    def union(self, x, y):\n        px, py = self.find(x), self.find(y)\n        if px == py:\n            return False\n        if self.rank[px] &lt; self.rank[py]:\n            px, py = py, px\n        self.parent[py] = px\n        if self.rank[px] == self.rank[py]:\n            self.rank[px] += 1\n        return True\n<\/code><\/pre>\n<p><strong>Practice Problems (Graphs):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n  <th>#<\/th>\n  <th>Problem<\/th>\n  <th>Difficulty<\/th>\n  <th>Algorithm<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>61<\/td>\n  <td>Number of Islands<\/td>\n  <td>Medium<\/td>\n  <td>DFS/BFS<\/td>\n<\/tr>\n<tr>\n  <td>62<\/td>\n  <td>Clone Graph<\/td>\n  <td>Medium<\/td>\n  <td>DFS + HashMap<\/td>\n<\/tr>\n<tr>\n  <td>63<\/td>\n  <td>Max Area of Island<\/td>\n  <td>Medium<\/td>\n  <td>DFS<\/td>\n<\/tr>\n<tr>\n  <td>64<\/td>\n  <td>Pacific Atlantic Water Flow<\/td>\n  <td>Medium<\/td>\n  <td>Multi-source BFS<\/td>\n<\/tr>\n<tr>\n  <td>65<\/td>\n  <td>Surrounded Regions<\/td>\n  <td>Medium<\/td>\n  <td>BFS from border<\/td>\n<\/tr>\n<tr>\n  <td>66<\/td>\n  <td>Rotting Oranges<\/td>\n  <td>Medium<\/td>\n  <td>Multi-source BFS<\/td>\n<\/tr>\n<tr>\n  <td>67<\/td>\n  <td>Walls and Gates<\/td>\n  <td>Medium<\/td>\n  <td>Multi-source BFS<\/td>\n<\/tr>\n<tr>\n  <td>68<\/td>\n  <td>Course Schedule<\/td>\n  <td>Medium<\/td>\n  <td>Topological sort<\/td>\n<\/tr>\n<tr>\n  <td>69<\/td>\n  <td>Course Schedule II<\/td>\n  <td>Medium<\/td>\n  <td>Topological sort<\/td>\n<\/t abels<\/td>\n  <td>Medium<\/td>\n  <td>Last occurrence<\/td>\n<\/tr>\n<tr>\n  <td>105<\/td>\n  <td>Valid Parenthesis String<\/td>\n  <td>Medium<\/td>\n  <td>Range tracking<\/td>\n<\/tr>\n<tr>\n  <td>106<\/td>\n  <td>Non-overlapping Intervals<\/td>\n  <td>Medium<\/td>\n  <td>Sort by end<\/td>\n<\/tr>\n<tr>\n  <td>107<\/td>\n  <td>Meeting Rooms II<\/td>\n  <td>Medium<\/td>\n  <td>Sort + heap<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3>Topic 10: Heaps / Priority Queues<\/h3>\n<p><strong>Core concepts:<\/strong><\/p>\n<ul>\n<li>Min-heap, max-heap operations<\/li>\n<li>Kth largest/smallest problems<\/li>\n<li>Merge k sorted lists<\/li>\n<li>Top K elements pattern<\/li>\n<li>Two heaps pattern (median of data stream)<\/li>\n<\/ul>\n<p><strong>Practice Problems (Heaps):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n  <th>#<\/th>\n  <th>Problem<\/th>\n  <th>Difficulty<\/th>\n  <th>Pattern<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>108<\/td>\n  <td>Kth Largest in Array<\/td>\n  <td>Medium<\/td>\n  <td>Min-heap of size k<\/td>\n<\/tr>\n<tr>\n  <td>109<\/td>\n  <td>Last Stone Weight<\/td>\n  <td>Easy<\/td>\n  <td>Max-heap<\/td>\n<\/tr>\n<tr>\n  <td>110<\/td>\n  <td>K Closest Points to Origin<\/td>\n  <td>Medium<\/td>\n  <td>Max-heap of size k<\/td>\n<\/tr>\n<tr>\n  <td>111<\/td>\n  <td>Kth Largest in Stream<\/td>\n  <td>Easy<\/td>\n  <td>Min-heap<\/td>\n<\/tr>\n<tr>\n  <td>112<\/td>\n  <td>Task Scheduler<\/td>\n  <td>Medium<\/td>\n  <td>Max-heap + cooldown<\/td>\n<\/tr>\n<tr>\n  <td>113<\/td>\n  <td>Design Twitter<\/td>\n  <td>Medium<\/td>\n  <td>Heap merge<\/td>\n<\/tr>\n<tr>\n  <td>114<\/td>\n  <td>Find Median from Data Stream<\/td>\n  <td>Hard<\/td>\n  <td>Two heaps<\/td>\n<\/tr>\n<tr>\n  <td>115<\/td>\n  <td>Merge k Sorted Lists<\/td>\n  <td>Hard<\/td>\n  <td>Min-heap<\/td>\n<\/tr>\n<tr>\n  <td>116<\/td>\n  <td>Top K Frequent Words<\/td>\n  <td>Medium<\/td>\n  <td>Min-heap<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3>Topic 11: Tries<\/h3>\n<p><strong>Core concepts:<\/strong><\/p>\n<ul>\n<li>Trie (prefix tree) construction<\/li>\n<li>Search and prefix matching<\/li>\n<li>Word dictionaries<\/li>\n<li>Auto-complete systems<\/li>\n<\/ul>\n<p><strong>Trie Implementation Template:<\/strong><\/p>\n<pre><code class=\"language-python\">class TrieNode:\n    def __init__(self):\n        self.children = {}\n        self.is_end = False\n\nclass Trie:\n    def __init__(self):\n        self.root = TrieNode()\n    \n    def insert(self, word):\n        node = self.root\n        for char in word:\n            if char not in node.children:\n                node.children[char] = TrieNode()\n            node = node.children[char]\n        node.is_end = True\n    \n    def search(self, word):\n        node = self.root\n        for char in word:\n            if char not in node.children:\n                return False\n            node = node.children[char]\n        return node.is_end\n    \n    def startsWith(self, prefix):\n        node = self.root\n        for char in prefix:\n            if char not in node.children:\n                return False\n            node = node.children[char]\n        return True\n<\/code><\/pre>\n<p><strong>Practice Problems (Tries):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n  <th>#<\/th>\n  <th>Problem<\/th>\n  <th>Difficulty<\/th>\n  <th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>117<\/td>\n  <td>Implement Trie<\/td>\n  <td>Medium<\/td>\n  <td>Core<\/td>\n<\/tr>\n<tr>\n  <td>118<\/td>\n  <td>Design Add and Search Words<\/td>\n  <td>Medium<\/td>\n  <td>Wildcard DFS<\/td>\n<\/tr>\n<tr>\n  <td>119<\/td>\n  <td>Word Search II<\/td>\n  <td>Hard<\/td>\n  <td>Trie + DFS<\/td>\n<\/tr>\n<tr>\n  <td>120<\/td>\n  <td>Prefix and Suffix Search<\/td>\n  <td>Hard<\/td>\n  <td>Double trie<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3>Topic 12: Backtracking<\/h3>\n<p><strong>Core concepts:<\/strong><\/p>\n<ul>\n<li>Decision tree exploration<\/li>\n<li>Pruning strategies<\/li>\n<li>Permutations and combinations<\/li>\n<li>Subsets<\/li>\n<li>Constraint satisfaction<\/li>\n<\/ul>\n<p><strong>Backtracking Template:<\/strong><\/p>\n<pre><code class=\"language-python\">def backtrack(state, choices, result):\n    if is_complete(state):\n        result.append(state[:])  # or process state\n        return\n    \n    for choice in choices:\n        if is_valid(state, choice):\n            state.append(choice)           # Choose\n            backtrack(state, next_choices, result)  # Explore\n            state.pop()                    # Unchoose\n<\/code><\/pre>\n<p><strong>Practice Problems (Backtracking):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n  <th>#<\/th>\n  <th>Problem<\/th>\n  <th>Difficulty<\/th>\n  <th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>121<\/td>\n  <td>Subsets<\/td>\n  <td>Medium<\/td>\n  <td>Classic<\/td>\n<\/tr>\n<tr>\n  <td>122<\/td>\n  <td>Combination Sum<\/td>\n  <td>Medium<\/td>\n  <td>With repetition<\/td>\n<\/tr>\n<tr>\n  <td>123<\/td>\n  <td>Permutations<\/td>\n  <td>Medium<\/td>\n  <td>Classic<\/td>\n<\/tr>\n<tr>\n  <td>124<\/td>\n  <td>Subsets II<\/td>\n  <td>Medium<\/td>\n  <td>Deduplication<\/td>\n<\/tr>\n<tr>\n  <td>125<\/td>\n  <td>Combination Sum II<\/td>\n  <td>Medium<\/td>\n  <td>Deduplication<\/td>\n<\/tr>\n<tr>\n  <td>126<\/td>\n  <td>Permutations II<\/td>\n  <td>Medium<\/td>\n  <td>Deduplication<\/td>\n<\/tr>\n<tr>\n  <td>127<\/td>\n  <td>Word Search<\/td>\n  <td>Medium<\/td>\n  <td>Grid backtrack<\/td>\n<\/tr>\n<tr>\n  <td>128<\/td>\n  <td>N-Queens<\/td>\n  <td>Hard<\/td>\n  <td>Constraint check<\/td>\n<\/tr>\n<tr>\n  <td>129<\/td>\n  <td>Palindrome Partitioning<\/td>\n  <td>Medium<\/td>\n  <td>Memoization<\/td>\n<\/tr>\n<tr>\n  <td>130<\/td>\n  <td>Letter Combinations<\/td>\n  <td>Medium<\/td>\n  <td>Classic<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3>Additional 20 Problems (Mixed Hard)<\/h3>\n<table>\n<thead>\n<tr>\n  <th>#<\/th>\n  <th>Problem<\/th>\n  <th>Difficulty<\/th>\n  <th>Chapter<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>131<\/td>\n  <td>LRU Cache<\/td>\n  <td>Medium<\/td>\n  <td>Design<\/td>\n<\/tr>\n<tr>\n  <td>132<\/td>\n  <td>LFU Cache<\/td>\n  <td>Hard<\/td>\n  <td>Design<\/td>\n<\/tr>\n<tr>\n  <td>133<\/td>\n  <td>Min Stack<\/td>\n  <td>Easy<\/td>\n  <td>Stack<\/td>\n<\/tr>\n<tr>\n  <td>134<\/td>\n  <td>Evaluate Reverse Polish<\/td>\n  <td>Medium<\/td>\n  <td>Stack<\/td>\n<\/tr>\n<tr>\n  <td>135<\/td>\n  <td>Daily Temperatures<\/td>\n  <td>Medium<\/td>\n  <td>Monotonic Stack<\/td>\n<\/tr>\n<tr>\n  <td>136<\/td>\n  <td>Car Fleet<\/td>\n  <td>Medium<\/td>\n  <td>Monotonic Stack<\/td>\n<\/tr>\n<tr>\n  <td>137<\/td>\n  <td>Largest Rectangle in Histogram<\/td>\n  <td>Hard<\/td>\n  <td>Monotonic Stack<\/td>\n<\/tr>\n<tr>\n  <td>138<\/td>\n  <td>Sliding Window Maximum<\/td>\n  <td>Hard<\/td>\n  <td>Deque<\/td>\n<\/tr>\n<tr>\n  <td>139<\/td>\n  <td>First Missing Positive<\/td>\n  <td>Hard<\/td>\n  <td>Index mapping<\/td>\n<\/tr>\n<tr>\n  <td>140<\/td>\n  <td>Merge Intervals<\/td>\n  <td>Medium<\/td>\n  <td>Sorting<\/td>\n<\/tr>\n<tr>\n  <td>141<\/td>\n  <td>Insert Interval<\/td>\n  <td>Medium<\/td>\n  <td>Interval<\/td>\n<\/tr>\n<tr>\n  <td>142<\/td>\n  <td>Non-overlapping Intervals<\/td>\n  <td>Medium<\/td>\n  <td>Greedy<\/td>\n<\/tr>\n<tr>\n  <td>143<\/td>\n  <td>Count of Smaller Numbers<\/td>\n  <td>Hard<\/td>\n  <td>Merge sort<\/td>\n<\/tr>\n<tr>\n  <td>144<\/td>\n  <td>Reverse Pairs<\/td>\n  <td>Hard<\/td>\n  <td>Merge sort<\/td>\n<\/tr>\n<tr>\n  <td>145<\/td>\n  <td>Longest Increasing Path in Matrix<\/td>\n  <td>Hard<\/td>\n  <td>DFS + memo<\/td>\n<\/tr>\n<tr>\n  <td>146<\/td>\n  <td>Maximal Square<\/td>\n  <td>Medium<\/td>\n  <td>2D DP<\/td>\n<\/tr>\n<tr>\n  <td>147<\/td>\n  <td>Maximal Rectangle<\/td>\n  <td>Hard<\/td>\n  <td>Stack<\/td>\n<\/tr>\n<tr>\n  <td>148<\/td>\n  <td>Sudoku Solver<\/td>\n  <td>Hard<\/td>\n  <td>Backtracking<\/td>\n<\/tr>\n<tr>\n  <td>149<\/td>\n  <td>Couples Holding Hands<\/td>\n  <td>Hard<\/td>\n  <td>Union-Find<\/td>\n<\/tr>\n<tr>\n  <td>150<\/td>\n  <td>Minimum Cost to Connect All Points<\/td>\n  <td>Medium<\/td>\n  <td>Prim's algorithm<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n","text":"## Chapter 2.2 – Complete DSA Syllabus\n\n### Topic 1: Arrays & Two Pointers\n\n**Core concepts:**\n- In-place modification\n- Two-pointer patterns (converging, diverging, same-direction)\n- Prefix sums\n- Dutch national flag problem (3-way partition)\n- Kadane's algorithm (maximum subarray)\n\n**Must-know patterns:**\n```\nTwo Sum → HashMap approach\nTrapping Rain Water → Two pointers from both ends\nContainer With Most Water → Greedy two pointers\nRotate Array → Reversal technique\n```\n\n**Practice Problems (Arrays):**\n\n| # | Problem | Difficulty | Pattern |\n|---|---|---|---|\n| 1 | Two Sum | Easy | HashMap |\n| 2 | Best Time to Buy Stock | Easy | Single pass |\n| 3 | Contains Duplicate | Easy | HashSet |\n| 4 | Product of Array Except Self | Medium | Prefix/Suffix |\n| 5 | Maximum Subarray | Medium | Kadane |\n| 6 | Maximum Product Subarray | Medium | DP-like |\n| 7 | Find Min in Rotated Sorted Array | Medium | Binary Search |\n| 8 | Search in Rotated Sorted Array | Medium | Modified BS |\n| 9 | 3Sum | Medium | Two Pointers |\n| 10 | Container With Most Water | Medium | Two Pointers |\n| 11 | Trapping Rain Water | Hard | Two Pointers |\n| 12 | Merge k Sorted Lists (array variant) | Hard | Heap |\n\n---\n\n### Topic 2: Strings\n\n**Core concepts:**\n- Character frequency maps\n- Sliding window on strings\n- String matching (KMP, Rabin-Karp conceptually)\n- Palindrome techniques (expand from center, Manacher's)\n- Anagram detection\n\n**Practice Problems (Strings):**\n\n| # | Problem | Difficulty | Pattern |\n|---|---|---|---|\n| 13 | Valid Anagram | Easy | Frequency map |\n| 14 | Valid Palindrome | Easy | Two pointers |\n| 15 | Longest Common Prefix | Easy | Vertical scanning |\n| 16 | Valid Parentheses | Easy | Stack |\n| 17 | Longest Substring Without Repeating | Medium | Sliding window |\n| 18 | Longest Repeating Character Replacement | Medium | Sliding window |\n| 19 | Minimum Window Substring | Hard | Sliding window |\n| 20 | Group Anagrams | Medium | HashMap |\n| 21 | Encode/Decode Strings | Medium | Length prefix |\n| 22 | Palindromic Substrings | Medium | Expand center |\n| 23 | Longest Palindromic Substring | Medium | Expand center |\n\n---\n\n### Topic 3: Hash Maps & Hash Sets\n\n**Core concepts:**\n- O(1) average lookup, insert, delete\n- Collision handling (chaining vs open addressing)\n- When to use HashMap vs Array\n- Count frequency, find pairs, find duplicates\n\n**Practice Problems (Hash Maps):**\n\n| # | Problem | Difficulty | Pattern |\n|---|---|---|---|\n| 24 | Two Sum | Easy | HashMap |\n| 25 | Group Anagrams | Medium | HashMap of lists |\n| 26 | Top K Frequent Elements | Medium | HashMap + Heap |\n| 27 | Encode and Decode | Medium | Design |\n| 28 | Product of Array Except Self | Medium | No division trick |\n| 29 | Longest Consecutive Sequence | Medium | HashSet |\n| 30 | Four Sum II | Medium | HashMap pairs |\n\n---\n\n### Topic 4: Sliding Window\n\n**Core concepts:**\n- Fixed-size window\n- Variable-size window (expand/contract)\n- Two-pointer as sliding window\n- When to use: \"subarray/substring of length k with property X\"\n\n**The Sliding Window Template:**\n```python\ndef sliding_window(arr, k):\n    left = 0\n    window_state = {}  # or counter, sum, etc.\n    result = 0\n    \n    for right in range(len(arr)):\n        # Add arr[right] to window\n        window_state[arr[right]] = window_state.get(arr[right], 0) + 1\n        \n        # Shrink window if invalid\n        while not valid(window_state):\n            window_state[arr[left]] -= 1\n            if window_state[arr[left]] == 0:\n                del window_state[arr[left]]\n            left += 1\n        \n        # Update result\n        result = max(result, right - left + 1)\n    \n    return result\n```\n\n**Practice Problems (Sliding Window):**\n\n| # | Problem | Difficulty | Window Type |\n|---|---|---|---|\n| 31 | Maximum Average Subarray I | Easy | Fixed |\n| 32 | Longest Substring Without Repeat | Medium | Variable |\n| 33 | Longest Repeating Char Replacement | Medium | Variable |\n| 34 | Permutation in String | Medium | Fixed |\n| 35 | Find All Anagrams in String | Medium | Fixed |\n| 36 | Minimum Window Substring | Hard | Variable |\n| 37 | Sliding Window Maximum | Hard | Deque |\n\n---\n\n### Topic 5: Binary Search\n\n**Core concepts:**\n- Classic binary search (find exact target)\n- Finding left/right boundary\n- Binary search on answer space\n- Binary search on rotated arrays\n- Fractional binary search (floating point)\n\n**The Binary Search Templates:**\n```python\n# Template 1: Find exact target\ndef binary_search(arr, target):\n    left, right = 0, len(arr) - 1\n    while left <= right:\n        mid = left + (right - left) // 2\n        if arr[mid] == target:\n            return mid\n        elif arr[mid] < target:\n            left = mid + 1\n        else:\n            right = mid - 1\n    return -1\n\n# Template 2: Find leftmost position\ndef lower_bound(arr, target):\n    left, right = 0, len(arr)\n    while left < right:\n        mid = left + (right - left) // 2\n        if arr[mid] < target:\n            left = mid + 1\n        else:\n            right = mid\n    return left\n\n# Template 3: Binary search on answer\ndef min_max_problem(arr, k):\n    left, right = min(arr), sum(arr)\n    while left < right:\n        mid = left + (right - left) // 2\n        if feasible(arr, mid, k):\n            right = mid\n        else:\n            left = mid + 1\n    return left\n```\n\n**Practice Problems (Binary Search):**\n\n| # | Problem | Difficulty | Type |\n|---|---|---|---|\n| 38 | Binary Search | Easy | Classic |\n| 39 | Search a 2D Matrix | Medium | Classic |\n| 40 | Koko Eating Bananas | Medium | Answer space |\n| 41 | Find Min in Rotated Array | Medium | Rotated |\n| 42 | Search in Rotated Array | Medium | Rotated |\n| 43 | Time Based Key-Value Store | Medium | BS on value |\n| 44 | Median of Two Sorted Arrays | Hard | Partition |\n| 45 | Split Array Largest Sum | Hard | Answer space |\n\n---\n\n### Topic 6: Trees\n\n**Core concepts:**\n- Tree traversals (inorder, preorder, postorder, BFS)\n- Recursive vs iterative approaches\n- BST properties and operations\n- Lowest common ancestor\n- Tree path problems\n- Balanced binary tree\n- Segment trees (for advanced)\n\n**The DFS Template:**\n```python\ndef dfs(node, state):\n    if not node:\n        return base_case\n    \n    left_result = dfs(node.left, state)\n    right_result = dfs(node.right, state)\n    \n    # Process node\n    current_result = compute(node.val, left_result, right_result)\n    \n    # Update global state if needed\n    state.update(current_result)\n    \n    return current_result\n```\n\n**Practice Problems (Trees):**\n\n| # | Problem | Difficulty | Pattern |\n|---|---|---|---|\n| 46 | Invert Binary Tree | Easy | DFS |\n| 47 | Maximum Depth of Binary Tree | Easy | DFS |\n| 48 | Same Tree | Easy | DFS |\n| 49 | Subtree of Another Tree | Easy | DFS |\n| 50 | Symmetric Tree | Easy | DFS |\n| 51 | Level Order Traversal | Medium | BFS |\n| 52 | Binary Tree Right Side View | Medium | BFS |\n| 53 | Count Good Nodes | Medium | DFS with state |\n| 54 | Validate BST | Medium | DFS with range |\n| 55 | Kth Smallest in BST | Medium | Inorder |\n| 56 | LCA of Binary Tree | Medium | DFS |\n| 57 | Serialize/Deserialize Binary Tree | Hard | BFS/DFS |\n| 58 | Binary Tree Max Path Sum | Hard | DFS |\n| 59 | Construct from Preorder/Inorder | Medium | Divide & conquer |\n| 60 | Maximum Width of Binary Tree | Medium | BFS with indices |\n\n---\n\n### Topic 7: Graphs\n\n**Core concepts:**\n- Adjacency list vs matrix\n- DFS on graphs (with visited set)\n- BFS on graphs (shortest path in unweighted)\n- Topological sort (Kahn's algorithm, DFS approach)\n- Union-Find (Disjoint Set Union)\n- Dijkstra's algorithm (weighted shortest path)\n- Bellman-Ford (negative weights)\n- Cycle detection\n\n**Graph Traversal Templates:**\n```python\n# BFS (shortest path in unweighted graph)\nfrom collections import deque\n\ndef bfs(graph, start, target):\n    visited = {start}\n    queue = deque([(start, 0)])\n    \n    while queue:\n        node, dist = queue.popleft()\n        if node == target:\n            return dist\n        for neighbor in graph[node]:\n            if neighbor not in visited:\n                visited.add(neighbor)\n                queue.append((neighbor, dist + 1))\n    return -1\n\n# Union-Find\nclass UnionFind:\n    def __init__(self, n):\n        self.parent = list(range(n))\n        self.rank = [0] * n\n    \n    def find(self, x):\n        if self.parent[x] != x:\n            self.parent[x] = self.find(self.parent[x])  # path compression\n        return self.parent[x]\n    \n    def union(self, x, y):\n        px, py = self.find(x), self.find(y)\n        if px == py:\n            return False\n        if self.rank[px] < self.rank[py]:\n            px, py = py, px\n        self.parent[py] = px\n        if self.rank[px] == self.rank[py]:\n            self.rank[px] += 1\n        return True\n```\n\n**Practice Problems (Graphs):**\n\n| # | Problem | Difficulty | Algorithm |\n|---|---|---|---|\n| 61 | Number of Islands | Medium | DFS/BFS |\n| 62 | Clone Graph | Medium | DFS + HashMap |\n| 63 | Max Area of Island | Medium | DFS |\n| 64 | Pacific Atlantic Water Flow | Medium | Multi-source BFS |\n| 65 | Surrounded Regions | Medium | BFS from border |\n| 66 | Rotting Oranges | Medium | Multi-source BFS |\n| 67 | Walls and Gates | Medium | Multi-source BFS |\n| 68 | Course Schedule | Medium | Topological sort |\n| 69 | Course Schedule II | Medium | Topological sort |\n| 70 | Redundant Connection | Medium | Union-Find |\n| 71 | Number of Connected Components | Medium | Union-Find |\n| 72 | Graph Valid Tree | Medium | Union-Find/DFS |\n| 73 | Word Ladder | Hard | BFS |\n| 74 | Alien Dictionary | Hard | Topological sort |\n| 75 | Cheapest Flights K Stops | Medium | Bellman-Ford |\n| 76 | Network Delay Time | Medium | Dijkstra |\n| 77 | Swim in Rising Water | Hard | Dijkstra/Binary Search |\n\n---\n\n### Topic 8: Dynamic Programming\n\n**Core concepts:**\n- Top-down (memoization)\n- Bottom-up (tabulation)\n- 1D DP (Fibonacci, climbing stairs, house robber)\n- 2D DP (grid, strings)\n- Interval DP\n- Knapsack variants\n- DP on trees\n\n**The DP Framework:**\n```\n1. Define the subproblem (what does dp[i] mean?)\n2. Identify the recurrence relation\n3. Identify base cases\n4. Determine evaluation order\n5. Optimize space if possible\n```\n\n**DP Pattern Reference:**\n\n| Pattern | Example Problem | State Definition |\n|---|---|---|\n| Linear DP | Climbing Stairs | dp[i] = ways to reach step i |\n| Kadane variant | Max Subarray | dp[i] = max subarray ending at i |\n| 0/1 Knapsack | Partition Equal Subset | dp[i][j] = can sum j with first i items |\n| Unbounded Knapsack | Coin Change | dp[i] = min coins to make amount i |\n| LCS | Longest Common Subsequence | dp[i][j] = LCS of s1[:i] and s2[:j] |\n| Edit Distance | Edit Distance | dp[i][j] = edits to convert s1[:i] to s2[:j] |\n| Palindrome DP | Longest Palindromic Subseq | dp[i][j] = LPS of s[i..j] |\n\n**Practice Problems (DP):**\n\n| # | Problem | Difficulty | Pattern |\n|---|---|---|---|\n| 78 | Climbing Stairs | Easy | Linear DP |\n| 79 | House Robber | Medium | Linear DP |\n| 80 | House Robber II | Medium | Linear DP circular |\n| 81 | Longest Palindromic Substring | Medium | 2D DP |\n| 82 | Palindromic Substrings | Medium | 2D DP |\n| 83 | Decode Ways | Medium | Linear DP |\n| 84 | Coin Change | Medium | Unbounded knapsack |\n| 85 | Maximum Product Subarray | Medium | Kadane variant |\n| 86 | Word Break | Medium | Linear DP |\n| 87 | Longest Increasing Subsequence | Medium | Patience sorting |\n| 88 | Partition Equal Subset Sum | Medium | 0/1 Knapsack |\n| 89 | Unique Paths | Medium | Grid DP |\n| 90 | Unique Paths II | Medium | Grid DP |\n| 91 | Minimum Path Sum | Medium | Grid DP |\n| 92 | Longest Common Subsequence | Medium | 2D DP |\n| 93 | Edit Distance | Hard | 2D DP |\n| 94 | Regular Expression Matching | Hard | 2D DP |\n| 95 | Burst Balloons | Hard | Interval DP |\n| 96 | Interleaving String | Hard | 2D DP |\n| 97 | Distinct Subsequences | Hard | 2D DP |\n\n---\n\n### Topic 9: Greedy Algorithms\n\n**Core concepts:**\n- When greedy is correct (exchange argument, matroid structure)\n- Interval scheduling / activity selection\n- Task scheduling with deadlines\n- Jump game variants\n- Gas station problem\n\n**Practice Problems (Greedy):**\n\n| # | Problem | Difficulty | Strategy |\n|---|---|---|---|\n| 98 | Maximum Subarray | Medium | Kadane |\n| 99 | Jump Game | Medium | Local max |\n| 100 | Jump Game II | Medium | Greedy BFS |\n| 101 | Gas Station | Medium | Running sum |\n| 102 | Hand of Straights | Medium | Greedy + HashMap |\n| 103 | Merge Triplets | Medium | Greedy condition |\n| 104 | Partition Labels | Medium | Last occurrence |\n| 105 | Valid Parenthesis String | Medium | Range tracking |\n| 106 | Non-overlapping Intervals | Medium | Sort by end |\n| 107 | Meeting Rooms II | Medium | Sort + heap |\n\n---\n\n### Topic 10: Heaps / Priority Queues\n\n**Core concepts:**\n- Min-heap, max-heap operations\n- Kth largest/smallest problems\n- Merge k sorted lists\n- Top K elements pattern\n- Two heaps pattern (median of data stream)\n\n**Practice Problems (Heaps):**\n\n| # | Problem | Difficulty | Pattern |\n|---|---|---|---|\n| 108 | Kth Largest in Array | Medium | Min-heap of size k |\n| 109 | Last Stone Weight | Easy | Max-heap |\n| 110 | K Closest Points to Origin | Medium | Max-heap of size k |\n| 111 | Kth Largest in Stream | Easy | Min-heap |\n| 112 | Task Scheduler | Medium | Max-heap + cooldown |\n| 113 | Design Twitter | Medium | Heap merge |\n| 114 | Find Median from Data Stream | Hard | Two heaps |\n| 115 | Merge k Sorted Lists | Hard | Min-heap |\n| 116 | Top K Frequent Words | Medium | Min-heap |\n\n---\n\n### Topic 11: Tries\n\n**Core concepts:**\n- Trie (prefix tree) construction\n- Search and prefix matching\n- Word dictionaries\n- Auto-complete systems\n\n**Trie Implementation Template:**\n```python\nclass TrieNode:\n    def __init__(self):\n        self.children = {}\n        self.is_end = False\n\nclass Trie:\n    def __init__(self):\n        self.root = TrieNode()\n    \n    def insert(self, word):\n        node = self.root\n        for char in word:\n            if char not in node.children:\n                node.children[char] = TrieNode()\n            node = node.children[char]\n        node.is_end = True\n    \n    def search(self, word):\n        node = self.root\n        for char in word:\n            if char not in node.children:\n                return False\n            node = node.children[char]\n        return node.is_end\n    \n    def startsWith(self, prefix):\n        node = self.root\n        for char in prefix:\n            if char not in node.children:\n                return False\n            node = node.children[char]\n        return True\n```\n\n**Practice Problems (Tries):**\n\n| # | Problem | Difficulty | |\n|---|---|---|---|\n| 117 | Implement Trie | Medium | Core |\n| 118 | Design Add and Search Words | Medium | Wildcard DFS |\n| 119 | Word Search II | Hard | Trie + DFS |\n| 120 | Prefix and Suffix Search | Hard | Double trie |\n\n---\n\n### Topic 12: Backtracking\n\n**Core concepts:**\n- Decision tree exploration\n- Pruning strategies\n- Permutations and combinations\n- Subsets\n- Constraint satisfaction\n\n**Backtracking Template:**\n```python\ndef backtrack(state, choices, result):\n    if is_complete(state):\n        result.append(state[:])  # or process state\n        return\n    \n    for choice in choices:\n        if is_valid(state, choice):\n            state.append(choice)           # Choose\n            backtrack(state, next_choices, result)  # Explore\n            state.pop()                    # Unchoose\n```\n\n**Practice Problems (Backtracking):**\n\n| # | Problem | Difficulty | |\n|---|---|---|---|\n| 121 | Subsets | Medium | Classic |\n| 122 | Combination Sum | Medium | With repetition |\n| 123 | Permutations | Medium | Classic |\n| 124 | Subsets II | Medium | Deduplication |\n| 125 | Combination Sum II | Medium | Deduplication |\n| 126 | Permutations II | Medium | Deduplication |\n| 127 | Word Search | Medium | Grid backtrack |\n| 128 | N-Queens | Hard | Constraint check |\n| 129 | Palindrome Partitioning | Medium | Memoization |\n| 130 | Letter Combinations | Medium | Classic |\n\n---\n\n### Additional 20 Problems (Mixed Hard)\n\n| # | Problem | Difficulty | Chapter |\n|---|---|---|---|\n| 131 | LRU Cache | Medium | Design |\n| 132 | LFU Cache | Hard | Design |\n| 133 | Min Stack | Easy | Stack |\n| 134 | Evaluate Reverse Polish | Medium | Stack |\n| 135 | Daily Temperatures | Medium | Monotonic Stack |\n| 136 | Car Fleet | Medium | Monotonic Stack |\n| 137 | Largest Rectangle in Histogram | Hard | Monotonic Stack |\n| 138 | Sliding Window Maximum | Hard | Deque |\n| 139 | First Missing Positive | Hard | Index mapping |\n| 140 | Merge Intervals | Medium | Sorting |\n| 141 | Insert Interval | Medium | Interval |\n| 142 | Non-overlapping Intervals | Medium | Greedy |\n| 143 | Count of Smaller Numbers | Hard | Merge sort |\n| 144 | Reverse Pairs | Hard | Merge sort |\n| 145 | Longest Increasing Path in Matrix | Hard | DFS + memo |\n| 146 | Maximal Square | Medium | 2D DP |\n| 147 | Maximal Rectangle | Hard | Stack |\n| 148 | Sudoku Solver | Hard | Backtracking |\n| 149 | Couples Holding Hands | Hard | Union-Find |\n| 150 | Minimum Cost to Connect All Points | Medium | Prim's algorithm |\n\n---\n\n"},{"title":"Chapter 2.3 – 24-Week DSA Study Plan","html":"<h2>Chapter 2.3 – 24-Week DSA Study Plan<\/h2>\n<h3>Phase 1: Foundation (Weeks 1-6)<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Week<\/th>\n  <th>Topics<\/th>\n  <th>Problems<\/th>\n  <th>Goal<\/th>\n<\/t >\n  <th>Problems<\/th>\n  <th>Goal<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>15<\/td>\n  <td>DP 1D<\/td>\n  <td>#78-91<\/td>\n  <td>Recognize DP patterns<\/td>\n<\/tr>\n<tr>\n  <td>16<\/td>\n  <td>DP 2D<\/td>\n  <td>#92-97<\/td>\n  <td>Handle matrix DP<\/td>\n<\/tr>\n<tr>\n  <td>17<\/td>\n  <td>Tries<\/td>\n  <td>#117-120<\/td>\n  <td>Implement from memory<\/td>\n<\/tr>\n<tr>\n  <td>18<\/td>\n  <td>Graphs Advanced<\/td>\n  <td>#73-77, Dijkstra<\/td>\n  <td>Weighted graphs<\/td>\n<\/tr>\n<tr>\n  <td>19<\/td>\n  <td>Mixed Hard<\/td>\n  <td>#143-150<\/td>\n  <td>Adaptive thinking<\/td>\n<\/tr>\n<tr>\n  <td>20<\/td>\n  <td>Review all patterns<\/td>\n  <td>—<\/td>\n  <td>Pattern recognition speed<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Phase 4: Interview Simulation (Weeks 21-24)<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Week<\/th>\n  <th>Format<\/th>\n  <th>Time<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>21<\/td>\n  <td>2x mock interviews per day (timed)<\/td>\n  <td>45 min/problem<\/td>\n<\/tr>\n<tr>\n  <td>22<\/td>\n  <td>Focus on explanation quality<\/td>\n  <td>Record yourself<\/td>\n<\/tr>\n<tr>\n  <td>23<\/td>\n  <td>Company-specific problem sets<\/td>\n  <td>Target company list<\/td>\n<\/tr>\n<tr>\n  <td>24<\/td>\n  <td>Final review + mental readiness<\/td>\n  <td>Light practice<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Daily DSA Practice Schedule<\/h3>\n<pre><code>Monday – Wednesday – Friday (40 min each):\n  - 1 medium problem untimed (understand deeply)\n  - 1 easy problem timed (&lt; 15 min)\n\nTuesday – Thursday (30 min each):\n  - Review yesterday's problems\n  - Write explanation as if interviewing\n\nSaturday (90 min):\n  - 2 mediums timed + 1 hard attempted\n  - Simulate interview conditions\n\nSunday (30 min):\n  - Flashcard review of patterns\n  - Update pattern notes\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 2.3 – 24-Week DSA Study Plan\n\n### Phase 1: Foundation (Weeks 1-6)\n\n| Week | Topics | Problems | Goal |\n|---|---|---|---|\n| 1 | Arrays, Two Pointers | #1-12 | Comfort with basic patterns |\n| 2 | Strings, Sliding Window | #13-37 | Master sliding window template |\n| 3 | Binary Search | #38-45 | All 3 templates memorized |\n| 4 | HashMaps, HashSets | #24-30 + review | O(1) lookups instinctive |\n| 5 | Stacks, Queues | #133-138 | Monotonic stack mastered |\n| 6 | Review + mock interview | Mixed Easy/Medium | Solve 15 in 2 hours |\n\n### Phase 2: Core Algorithms (Weeks 7-14)\n\n| Week | Topics | Problems | Goal |\n|---|---|---|---|\n| 7 | Trees – DFS | #46-58 | DFS template fluent |\n| 8 | Trees – BFS | #51-60 | BFS template fluent |\n| 9 | Graphs – DFS/BFS | #61-67 | Graph traversal automatic |\n| 10 | Graphs – Topology/UF | #68-72 + Union-Find | DAG reasoning |\n| 11 | Greedy | #98-107 | Exchange argument intuition |\n| 12 | Heaps | #108-116 | Know when to use heap |\n| 13 | Backtracking | #121-130 | Template memorized |\n| 14 | Review + mock interview | 2 mediums + 1 hard in 90 min | — |\n\n### Phase 3: Advanced (Weeks 15-20)\n\n| Week | Topics | Problems | Goal |\n|---|---|---|---|\n| 15 | DP 1D | #78-91 | Recognize DP patterns |\n| 16 | DP 2D | #92-97 | Handle matrix DP |\n| 17 | Tries | #117-120 | Implement from memory |\n| 18 | Graphs Advanced | #73-77, Dijkstra | Weighted graphs |\n| 19 | Mixed Hard | #143-150 | Adaptive thinking |\n| 20 | Review all patterns | — | Pattern recognition speed |\n\n### Phase 4: Interview Simulation (Weeks 21-24)\n\n| Week | Format | Time |\n|---|---|---|\n| 21 | 2x mock interviews per day (timed) | 45 min/problem |\n| 22 | Focus on explanation quality | Record yourself |\n| 23 | Company-specific problem sets | Target company list |\n| 24 | Final review + mental readiness | Light practice |\n\n### Daily DSA Practice Schedule\n\n```\nMonday – Wednesday – Friday (40 min each):\n  - 1 medium problem untimed (understand deeply)\n  - 1 easy problem timed (< 15 min)\n\nTuesday – Thursday (30 min each):\n  - Review yesterday's problems\n  - Write explanation as if in
