ARTER WORKBENCH</div><button class="small" onclick="download('lab-${n}-starter.txt',DATA.labs.find(x=>x.id===${n}).starter.code)">Save starter</button></div><h2>${e(l.starter.title)}</h2><p>${e(l.starter.instructions)}</p><div class="article" style="padding:0;background:none"><pre><code>${e(l.starter.code)}</code></pre></div></div>`:''}` }
function dsa(){return `${header('04 / DELIBERATE ALGORITHMS','DSA problem bank','150 syllabus entries with original problem descriptions, examples, hints, Python solutions, explanations and runnable checks. Repeated entries preserve their original progress IDs.')}<div class="stats spaced">${stat('Solved',dsaDone(),dsaDone(),DATA.problems.length,'Marked solved')}${stat('Attempted',Object.values(S.dsa).filter(x=>x.status!=='Not started').length,Object.values(S.dsa).filter(x=>x.status!=='Not started').length,DATA.problems.length,'Any practice status')}${stat('Review due',DATA.problems.filter(p=>due(p)).length,0,1,'Revisit solved problems')}${stat('Total entries',DATA.problems.length,DATA.problems.length,DATA.problems.length,'From source syllabus')}</div><div class="panel"><div class="filters"><input type="search" id="dsaSearch" placeholder="Find problem or pattern" value="${e(filter.query)}" oninput="filter.query=this.value;renderDsaRows()"><select aria-label="Difficulty" onchange="filter.difficulty=this.value;renderDsaRows()">${['All','Easy','Medium','Hard'].map(x=>`<option ${filter.difficulty===x?'selected':''}>${x}</option>`).join('')}</select><select aria-label="Status" onchange="filter.status=this.value;renderDsaRows()">${['All','Not started','Attempted','Solved','Review due'].map(x=>`<option ${filter.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="table-wrap"><table class="data-table"><thead><tr><th>#</th><th>PROBLEM</th><th>DIFFICULTY</th><th>PATTERN</th><th>STATUS</th><th>REVIEW</th></tr></thead><tbody id="dsaRows"></tbody></table></div></div><div class="notice">Study protocol: clarify constraints → brute force → invariant → optimized implementation → edge-case tests → complexity → explain aloud. Review after 2, 7 and 21 days.</div>`}function due(p){let x=S.dsa[p.id];return x?.status==='Solved'&&x.next&&x.next<=TODAY()}function dateAfter(n){let d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function setDsa(id,status){let x=S.dsa[id]||{};if(status==='Solved'&&x.status!=='Solved'){x.next=dateAfter(2);x.stage=0}if(status!=='Solved'){delete x.next;delete x.stage}S.dsa[id]={...x,status,date:TODAY()};save();render()}function revisit(id){let x=S.dsa[id];if(!x||x.status!=='Solved')return;x.stage=(x.stage||0)+1;x.next=x.stage===1?dateAfter(5):x.stage===2?dateAfter(14):dateAfter(30);save();render();toast('Review logged')}function renderDsaRows(){let rows=DATA.problems.filter(p=>(filter.difficulty==='All'||p.difficulty===filter.difficulty)&&(filter.status==='All'||(filter.status==='Review due'?due(p):(S.dsa[p.id]?.status||'Not started')===filter.status))&&[p.name,p.pattern,p.topic].join(' ').toLowerCase().includes(filter.query.toLowerCase()));$('dsaRows').innerHTML=rows.length?rows.map(p=>`<tr><td class="tiny">${p.id}</td><td><button class="link problem-name" onclick="go('dsa-problem',${p.id})">${e(p.name)} →</button><div class="tiny">LESSON + PYTHON</div></td><td>${e(p.difficulty)}</td><td>${e(p.pattern)}</td><td><select aria-label="Status for ${e(p.name)}" onchange="setDsa(${p.id},this.value)">${['Not started','Attempted','Solved'].map(s=>`<option ${(S.dsa[p.id]?.status||'Not started')===s?'selected':''}>${s}</option>`).join('')}</select></td><td class="tiny">${due(p)?'<b>Due</b>':e(S.dsa[p.id]?.next||'—')}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">No matching entries.</td></tr>`}function getProblem(id){return DATA.problems.find(x=>x.id===id)}
function dsaDownload(id,attempt=false){let p=getProblem(id),l=p.lesson,code=attempt?S.notes['dsa-code-'+id]:null;if(attempt&&!code?.trim()){toast('Write your attempt first.');return}download('dsa-'+String(id).padStart(3,'0')+(attempt?'-attempt':'-solution')+'.py',attempt?(l.models?l.models+'\n':'')+code+'\n\n# Example checks\n'+l.tests+'\nprint("Sample checks passed")\n':l.full)}
async function copySolution(id){try{await navigator.clipboard.writeText(getProblem(id).lesson.code);toast('Solution copied')}catch(err){toast('Clipboard unavailable. Select the code or download it.')}}
function dsaProblem(id){let p=getProblem(id),x=S.dsa[id]||{},l=p.lesson,key='dsa-'+id;return `${button('← Problem bank','dsa')}<div class="spaced">${header('PROBLEM '+id+' / '+p.difficulty,p.name,p.topic+' · '+p.pattern)}</div><div class="between tiny"><span>SYLLABUS ENTRY ${id} / ${DATA.problems.length}</span><div class="flex"><button class="small" onclick="go('dsa-problem',${id-1})" ${id===1?'disabled':''}>← Previous</button><button class="small" onclick="go('dsa-problem',${id+1})" ${id===DATA.problems.length?'disabled':''}>Next →</button></div></div><div class="panel emphasis spaced"><div class="eyebrow">01 / UNDERSTAND</div><h2>Problem statement</h2><p>${e(l.description)}</p><h3>Worked input / expected output</h3><div class="template example-output">${e(l.example)}</div>${l.canonical!==id?`<p class="tiny">Repeated syllabus entry · reference approach also appears in problem ${l.canonical}. Your practice progress remains separate.</p>`:''}<details class="details spaced"><summary>Reveal a hint</summary><p>${e(l.hint)}</p></details></div><div class="grid2 spaced"><div class="panel"><div class="eyebrow">02 / ATTEMPT</div><h2>Your reasoning</h2><div class="template">Invariant:\nBrute force:\nOptimized approach:\nEdge cases:\nComplexity:\nWhat I missed:</div><textarea class="spaced" oninput="note('dsa-note-${id}',this.value)" placeholder="Write your reasoning before looking at the solution…">${e(S.notes['dsa-note-'+id]||'')}</textarea><p class="tiny">AUTOSAVED LOCALLY</p></div><div class="panel"><div class="eyebrow">PRACTICE PROTOCOL</div><h2>Session checklist</h2>${['Restate problem and constraints','Describe a brute-force solution','Identify invariant and optimize','Implement and test edge cases','Explain time and space complexity aloud'].map((t,i)=>check(key+'-'+i,t)).join('')}<div class="flex spaced"><button onclick="setDsa(${id},'Attempted')">Mark attempted</button><button class="primary" onclick="setDsa(${id},'Solved')">Mark solved</button>${x.status==='Solved'?`<button onclick="revisit(${id})">Log successful review</button>`:''}</div><p class="tiny">${e(x.status||'Not started')} ${x.next?' · Next review '+e(x.next):''}</p></div></div><div class="panel spaced"><div class="eyebrow">03 / IMPLEMENT</div><h2>Your Python workbench</h2><p>Write a solution using the same function or class interface as the sample checks. Download your code with checks and run locally with Python 3. The browser does not execute Python.</p><textarea class="code-editor" spellcheck="false" autocapitalize="off" oninput="note('dsa-code-${id}',this.value)" placeholder="# Write your implementation here">${e(S.notes['dsa-code-'+id]||'')}</textarea><details class="details spaced"><summary>View sample and boundary checks</summary><div class="article" style="padding:0;background:none"><pre><code>${e(l.tests.replaceAll('; ',';\n'))}</code></pre></div>${l.models?'<p class="tiny">Tree / graph / linked-list helper definitions are bundled in the Python download.</p>':''}</details><div class="flex spaced"><button onclick="dsaDownload(${id},true)">Download my attempt + tests (.py)</button></div></div><div class="panel spaced"><div class="eyebrow">04 / LEARN & VERIFY</div><h2>Reference solution</h2><p>Try the problem first. Reveal the reasoning and code when you are ready to compare approaches.</p><details class="details spaced" id="referenceSolution"><summary>Reveal solution and explanation</summary><div class="solution-content"><h3>Why this works</h3><p>${e(l.reason)}</p><h3>Complexity analysis</h3><div class="template">${e(l.complexity)}</div><div class="between spaced"><h3>Python 3 implementation</h3><button class="small" onclick="copySolution(${id})">Copy code</button></div><div class="article" style="padding:0;background:none"><pre><code>${e(l.code)}</code></pre></div>${l.models?`<details class="details"><summary>Required node classes and test helpers</summary><div class="article" style="padding:0;background:none"><pre><code>${e(l.models)}</code></pre></div></details>`:''}<button class="primary spaced" onclick="dsaDownload(${id})">Download runnable solution + tests (.py)</button><p class="tiny spaced">Original educational reference implementation. Included example checks passed locally; not exhaustively verified against an online judge. Recursive implementations may require adaptation for deep inputs.</p></div></details></div><div class="panel spaced"><div class="eyebrow">05 / RETAIN</div><h2>Teach it back</h2><p>Close the reference, explain the invariant aloud in 90 seconds, write one new edge case and reimplement from memory on your scheduled review day.</p><textarea oninput="note('dsa-reflection-${id}',this.value)" placeholder="What did I get wrong? Which case breaks a naive solution? What will I recall next time?">${e(S.notes['dsa-reflection-'+id]||'')}</textarea><p class="tiny">Practice notes, status and review dates remain compatible with existing backups.</p></div>`}
function voice(){let v=DATA.days[S.day-1],key='voice-'+S.day,phase=S.day<=30?'Foundation':S.day<=60?'Technical voice':'Career voice',x=S.voice[S.day]||{};let week=DATA.comm.findIndex(c=>{let m=c.title.match(/Days (\d+)[–-](\d+)/);return c.title.startsWith('Week ')&&m&&S.day>=+m[1]&&S.day<=+m[2]});return `${header('05 / ACTIVE ENGLISH','90-day voice lab','Speak, record, review, repeat. The 90 daily prompts extend the source course into concrete sessions. The goal is clarity and confidence, not removing your accent.')}<div class="panel spaced"><div class="between"><b>${voiceDone()} / 90 days complete</b><span class="tiny">${phase.toUpperCase()}</span></div>${bar(voiceDone(),90)}<div class="days-grid">${DATA.days.map(d=>`<button aria-label="Day ${d.day}" class="day ${d.day===S.day?'active':''} ${checked('voice-'+d.day)?'complete':''}" onclick="setDay(${d.day})">${d.day}</button>`).join('')}</div><div class="between"><button class="small" onclick="setDay(S.day-1)" ${S.day===1?'disabled':''}>← Previous</button><span class="tiny">DAY ${S.day} / 90</span><button class="small" onclick="setDay(S.day+1)" ${S.day===90?'disabled':''}>Next →</button></div></div><div class="grid2 spaced"><div class="panel emphasis"><div class="eyebrow">DAY ${String(S.day).padStart(2,'0')} / ${e(phase)}</div><h2>${e(v.theme)}</h2><div class="focus-note">${e(v.prompt)}</div><div class="divider"></div>${check(key+'-warm','5–10 min · English thinking','Write a few unedited sentences about today.')}${check(key+'-drill','15–25 min · Speaking drill','Speak out loud, record on your device, and do the assignment above.')}${check(key+'-feedback','5–10 min · Listen and improve','Replay, note one strength and one issue, then repeat.')}${check(key,'Mark day complete','Complete after speaking and reviewing, not just reading.') }<div class="flex spaced">${week>=0?button('Read matching course section','library-voice',week,'small'):button('Read course','library','small')}${button('Focus timer','focus',null,'small')}</div></div><div class="panel"><h2>Speaking score</h2><p class="muted">Self-assessment, 1 = difficult, 5 = comfortable. Use recordings to compare days.</p>${['Clarity','Fluency','Vocabulary','Structure'].map(label=>`<label class="score-row"><span>${label}</span><input type="range" min="1" max="5" value="${x[label]||1}" oninput="this.nextElementSibling.textContent=this.value;setVoiceScore('${label}',this.value)"><b>${x[label]||1}</b></label>`).join('')}<label class="label">Recording location / transcript / feedback</label><textarea oninput="note(${q(key)},this.value)" placeholder="Where did I hesitate? What words helped? What will I repeat tomorrow?">${e(S.notes[key]||'')}</textarea><p class="tiny">Record using your phone or computer. This offline site does not store audio or automatically grade speech.</p></div></div>`}function setVoiceScore(k,v){S.voice[S.day]??={};S.voice[S.day][k]=+v;save()}
function journal(){let k='w'+S.week,j=S.journal[k]||{},m=monthForWeek(S.week);let fields=[['outcome','Technical outcome','What will I build, measure or explain this week?'],['communication','Communication outcome','One speaking or writing output.'],['career','Career / influence action','A stakeholder conversation, review, networking or interview action.'],['evidence','Evidence produced','Links, test results, demos, measurements or specific feedback.'],['wins','What went well?','Which actions created measurable value?'],['blockers','What did I skip, and why?','Be specific about time, skills, or dependencies.'],['next','Next week adjustment','One small change that will make next week better.']];return `${header('06 / WEEKLY REFLECTION','A record of becoming.','Plan fewer things. Produce tangible evidence. Reflect and adapt before the next week.')}<div class="panel spaced"><div class="between"><div class="week-nav"><button class="small" onclick="setWeek(S.week-1)">←</button><b>Week ${S.week} / 78</b><button class="small" onclick="setWeek(S.week+1)">→</button></div><span class="tiny">${e(weekRange())}</span></div><p class="muted">Month ${m}: ${e(monthData(m).title)}</p><div class="grid2">${fields.map(([id,label,ph])=>`<div><label class="label" for="j-${id}">${label}</label><textarea id="j-${id}" oninput="journalSave('${id}',this.value)" placeholder="${e(ph)}">${e(j[id]||'')}</textarea></div>`).join('')}</div><div class="divider"></div><h2>Weekly counters</h2><div class="grid3">${[['hours','Focused minutes'],['problems','DSA entries practiced'],['posts','Articles published'],['talks','Talks delivered'],['mocks','Mock interviews'],['feedback','Feedback conversations']].map(([id,label])=>`<label><span class="label">${label}</span><input type="number" min="0" max="100000" value="${e(j[id]||0)}" onchange="journalSave('${id}',Math.max(0,Number(this.value)||0))" style="width:100%"></label>`).join('')}</div><div class="flex spaced"><button class="primary" onclick="exportWeek()">Export weekly review (.md)</button>${check('review-'+S.week,'Weekly review complete')}</div></div><div class="notice">Your notes are stored only in this browser. Avoid customer data, secrets and proprietary code; use links or anonymized summaries.</div>`}function journalSave(k,v){S.journal['w'+S.week]??={};S.journal['w'+S.week][k]=v;save()}function download(name,body,type='text/plain'){let url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportWeek(){let j=S.journal['w'+S.week]||{};download('week-'+S.week+'-review.md','# Week '+S.week+' / '+weekRange()+'\n\n'+Object.entries(j).map(([k,v])=>'## '+k+'\n'+v).join('\n\n'));toast('Weekly review exported')}
const dimensions=['Technical depth (Backend + Systems)','DSA interview readiness','System design (Staff level)','Cross-team influence','Technical writing (RFCs, ADRs)','Executive communication','Public technical voice','Mentorship impact','Business impact framing'];function score(){let m=monthForWeek(S.week),x=S.scores[m]||{},rated=dimensions.filter(d=>x[d]!==undefined).length,sum=dimensions.reduce((n,d)=>n+(x[d]||0),0);return `${header('07 / CAREER SIGNAL','Readiness scorecard','The nine dimensions from Chapter 20.2. Use evidence and peer feedback when rating. A self-rating is not a promotion decision.')}<div class="grid2 spaced"><div class="panel emphasis"><div class="between"><h2>Month ${m} assessment</h2><select aria-label="Select assessment month" onchange="setWeek(weekForMonth(+this.value))">${Array.from({length:18},(_,i)=>`<option value="${i+1}" ${m===i+1?'selected':''}>Month ${i+1}</option>`).join('')}</select></div><div class="between"><span class="tiny">${rated}/9 RATED</span><strong id="scoreTotal" style="font:36px var(--serif)">${sum}/45</strong></div>${dimensions.map((d,i)=>`<label class="score-row"><span>${e(d)}</span><select aria-label="${e(d)}" onchange="setScore(${m},${i},this.value)">${['','1','2','3','4','5'].map(s=>`<option value="${s}" ${(x[d]===undefined?'':String(x[d]))===s?'selected':''}>${s||'Unrated'}</option>`).join('')}</select><span></span></label>`).join('')}<label class="label">Evidence and feedback</label><textarea oninput="note('score-${m}',this.value)" placeholder="What evidence supports my ratings? What is the biggest remaining gap?">${e(S.notes['score-'+m]||'')}</textarea></div><div class="panel"><h2>What the ratings mean</h2><p>1 — learning fundamentals.<br>2 — can apply with guidance.<br>3 — independent in familiar situations.<br>4 — repeatable results across situations.<br>5 — teaches others and drives broader outcomes.</p><div class="divider"></div><h2>Monthly trend</h2>${Array.from({length:18},(_,i)=>{let r=S.scores[i+1],n=r?Object.values(r).reduce((a,b)=>a+b,0):0;return `<div class="between" style="gap:15px;margin:6px 0"><span class="tiny" style="width:50px">M${i+1}</span><div style="flex:1">${bar(n,45)}</div><span class="tiny" style="width:35px;text-align:right">${r&&Object.keys(r).length?n:'—'}</span></div>`}).join('')}</div></div>`}function setScore(m,i,v){S.scores[m]??={};if(v==='')delete S.scores[m][dimensions[i]];else S.scores[m][dimensions[i]]=+v;save();render()}
function timerRemaining(){return timer.running?Math.max(0,Math.ceil((timer.end-Date.now())/1000)):timer.remain}function formatTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function timerTick(){let n=timerRemaining();if(timer.running&&n===0){timer.running=false;timer.remain=0;S.focus++;save();toast('Focus session complete. Take a short break.');if(current==='focus')render()}if($('timerDisplay'))$('timerDisplay').textContent=formatTime(n);$('topTimer').textContent=timer.running?formatTime(n):'Focus'}setInterval(timerTick,250);function timerStart(){if(timer.running){timer.remain=timerRemaining();timer.running=false}else{if(timer.remain===0)timer.remain=1500;timer.end=Date.now()+timer.remain*1000;timer.running=true}render()}function timerReset(minutes){timer.running=false;timer.remain=minutes*60;render()}function focus(){return `${header('08 / ATTENTION','One thing at a time.','Use a short, intentional block of uninterrupted work. The timer runs while you navigate this site, but resets if you close or refresh the page.')}<div class="panel emphasis spaced" style="max-width:590px;text-align:center;margin-left:auto;margin-right:auto"><div class="eyebrow">DEEP WORK SESSION</div><div id="timerDisplay" style="font:clamp(68px,12vw,114px)/1.3 var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-5px">${formatTime(timerRemaining())}</div><div class="flex" style="justify-content:center"><button class="small" onclick="timerReset(15)">15 min</button><button class="small" onclick="timerReset(25)">25 min</button><button class="small" onclick="timerReset(45)">45 min</button><button class="small" onclick="timerReset(5)">5 min break</button></div><div class="flex spaced" style="justify-content:center"><button class="primary" onclick="timerStart()">${timer.running?'Pause':'Start session'}</button><button onclick="timerReset(25)">Reset</button></div><div class="divider"></div><label class="label">What is the single outcome of this session?</label><textarea oninput="note('focus-intent',this.value)" placeholder="A test passing, an exercise solved, a clear explanation…">${e(S.notes['focus-intent']||'')}</textarea><p class="tiny spaced">${S.focus} timer blocks completed</p></div>`}
function search(a){let term=String(a||'').trim().toLowerCase(),results=[];if(term){for(let p of DATA.problems){if([p.name,p.pattern,p.topic,p.lesson.description,p.lesson.reason].join(' ').toLowerCase().includes(term))results.push({title:p.name,sub:'DSA lesson / '+p.difficulty,excerpt:p.lesson.description,page:'dsa-problem',arg:p.id})}for(let m of DATA.modules)for(let i=0;i<m.chapters.length;i++){let c=m.chapters[i],idx=c.text.toLowerCase().indexOf(term);if(idx>=0||c.title.toLowerCase().includes(term))results.push({title:c.title==='Introduction'?m.title+' — overview':c.title,sub:m.title,excerpt:c.text.slice(Math.max(0,idx-40),Math.max(0,idx-40)+165).replace(/\n/g,' '),page:'library-read',arg:[m.id,i]})}for(let i=0;i<DATA.comm.length;i++){let c=DATA.comm[i],idx=c.text.toLowerCase().indexOf(term);if(idx>=0)results.push({title:c.title,sub:'Communication course',excerpt:c.text.slice(Math.max(0,idx-40),Math.max(0,idx-40)+165).replace(/\n/g,' '),page:'library-voice',arg:i})}}return `${header('SEARCH / FULL SOURCE','Find a concept.',term?`${results.length} sections match “${a}”.`:'Search the handbook, communication course and DSA lessons.')}<div class="panel spaced"><form class="flex" onsubmit="event.preventDefault();go('search',document.getElementById('query').value)"><input style="flex:1" id="query" value="${e(a||'')}" placeholder="MVCC, Kafka, STAR, async…"><button class="primary">Search</button></form>${results.map(r=>`<div class="search-item"><button onclick="go(${q(r.page)},${q(r.arg)})">${e(r.title)} →</button><p>${e(r.sub)} · ${e(r.excerpt)}</p></div>`).join('')||'<p class="empty">'+(term?'No matching section. Try a different term.':'Enter a topic to begin.')+'</p>'}</div>`}
function settings(){return `${header('09 / YOUR WORKSPACE','Make it yours.','Adjust your start date and daily study capacity. Export a backup before changing browsers or devices.')}<div class="grid2 spaced"><div class="panel"><h2>Study preferences</h2><label class="label" for="startDate">Roadmap start date</label><input id="startDate" type="date" value="${e(S.start)}" onchange="if(this.value){S.start=this.value;save();render()}"><label class="label" for="budget">Daily time budget</label><select id="budget" onchange="S.budget=+this.value;save();render()">${[60,90,120,150,180].map(n=>`<option value="${n}" ${S.budget===n?'selected':''}>${n} minutes</option>`).join('')}</select><p class="muted">Default: 120 minutes. Voice practice uses 30–45 minutes; reflection uses 15. Select a different week whenever you need to catch up.</p><div class="divider"></div><button onclick="setWeek(currentWeek());go('home')">Jump to current calendar week</button></div><div class="panel"><h2>Data & privacy</h2><p>Progress, notes, ratings and journal entries are stored locally in your browser. No account, database, analytics or server is required.</p>${storageOK?'':'<div class="notice">Local storage is unavailable. Export progress before leaving.</div>'}<div class="flex"><button class="primary" onclick="download('fieldnotes-backup.json',JSON.stringify(S,null,2),'application/json')">Export backup</button><button onclick="document.getElementById('backupInput').click()">Import backup</button><input type="file" id="backupInput" hidden accept=".json,application/json" onchange="importBackup(this.files[0])"></div><div class="divider"></div><button onclick="if(confirm('Clear all local notes and progress? Export a backup first.')){S=defaults();save();render();toast('Workspace reset')}">Reset progress</button></div></div><div class="panel spaced"><h2>About the curriculum</h2><p>The source library preserves your five uploaded files, including code blocks, tables and original career targets. Guided labs and applied scenarios, DSA lessons with sample-checked Python reference implementations, daily prompts, recommended week-to-month mapping and assessment scale are additions. DSA statements and examples are educational paraphrases, not official judge specifications. Technical snippets, dated salary figures, course and exam information are not independently verified; check documentation before production use.</p><div class="template">${DATA.files.map(e).join('\n')}</div></div>`}async function importBackup(file){if(!file)return;try{let v=JSON.parse(await file.text());if(v.version!==1||!v.checks||!v.notes||typeof v.checks!=='object'||typeof v.notes!=='object')throw Error('Invalid backup');if(!confirm('Replace local progress with this backup?'))return;let fresh=defaults();for(let k of ['checks','notes','dsa','voice','scores','journal'])if(v[k]&&typeof v[k]==='object'&&!Array.isArray(v[k]))fresh[k]=v[k];if(/^\d{4}-\d{2}-\d{2}$/.test(v.start)&&!isNaN(new Date(v.start)))fresh.start=v.start;fresh.week=Math.max(1,Math.min(78,Number(v.week)||1));fresh.day=Math.max(1,Math.min(90,Number(v.day)||1));fresh.budget=[60,90,120,150,180].includes(v.budget)?v.budget:120;fresh.focus=Number(v.focus)||0;S=fresh;save();render();toast('Backup imported')}catch(err){toast('Could not import this backup.')}}
function render(){renderNav();let titles={home:'TODAY',roadmap:'18-MONTH ROADMAP',library:'HANDBOOK',labs:'PRACTICE STUDIO',dsa:'DSA PROBLEM BANK',voice:'90-DAY VOICE LAB',journal:'WEEKLY JOURNAL',score:'READINESS SCORECARD',focus:'FOCUS TIMER',settings:'SETTINGS',search:'SEARCH'};$('crumb').textContent='WORKSPACE / '+(titles[current.split('-')[0]]||'HANDBOOK');let views={home,roadmap,library,labs,dsa,voice,journal,score,focus,settings,search:()=>search(arg),'roadmap-month':()=>monthView(arg),'library-module':()=>libraryModule(arg),'library-read':()=>reader('career',arg),'library-voice':()=>reader('voice',arg),'labs-detail':()=>labDetail(arg),'dsa-problem':()=>dsaProblem(arg)};try{$('app').innerHTML=(views[current]||home)()+footer();if(current==='dsa')renderDsaRows();timerTick();document.querySelectorAll('.article a[href^="#part-"]').forEach(a=>{let id=Number(a.getAttribute('href').match(/#part-(\d+)/)?.[1]);if(id)a.onclick=ev=>{ev.preventDefault();go('library-module',id)}});document.querySelectorAll('.article a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'});if(!storageOK)$('app').insertAdjacentHTML('afterbegin','<div class="notice">Browser storage is unavailable. Export a backup from Settings before closing.</div>')}catch(err){console.error(err);$('app').innerHTML='<div class="panel"><h2>Unable to open this page.</h2><button onclick="go(\'home\')">Return to dashboard</button></div>'}}try{let h=location.hash.slice(1),idx=h.indexOf(':');if(h){current=idx<0?h:h.slice(0,idx);arg=idx<0?null:JSON.parse(decodeURIComponent(h.slice(idx+1)))}}catch(err){current='home';arg=null}render();
</script></body></html>
