nd({\n            'MetricName': metric_name,\n            'Value': value,\n            'Unit': 'Count',\n            'Timestamp': datetime.utcnow(),\n            'Dimensions': [\n                {'Name': 'ServiceName', 'Value': service_name},\n                {'Name': 'Environment', 'Value': 'production'},\n            ]\n        })\n    \n    cloudwatch.put_metric_data(\n        Namespace='MyApp/Business',\n        MetricData=metric_data\n    )\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 8.1 – AWS Roadmap for Staff Backend Engineers\n\n### Core Services You Already Use\n\n| Service | Current Use | Gap |\n|---|---|---|\n| EKS | ✅ Production | Deeper networking, IRSA |\n| EC2 | ✅ | Placement groups, instance types |\n| S3 | ✅ | Lifecycle policies, intelligent tiering |\n| RDS | ✅ | Read replicas, Multi-AZ, Aurora |\n| IAM | ✅ Basic | Cross-account roles, permission boundaries |\n\n### Must-Master AWS Services\n\n#### IAM (Identity and Access Management)\n\n```json\n// Principle of least privilege - example policy\n{\n    \"Version\": \"2012-10-17\",\n    \"Statement\": [\n        {\n            \"Sid\": \"AllowS3ReadOnly\",\n            \"Effect\": \"Allow\",\n            \"Action\": [\n                \"s3:GetObject\",\n                \"s3:ListBucket\"\n            ],\n            \"Resource\": [\n                \"arn:aws:s3:::my-bucket\",\n                \"arn:aws:s3:::my-bucket/*\"\n            ],\n            \"Condition\": {\n                \"StringEquals\": {\n                    \"s3:prefix\": [\"data/\", \"config/\"]\n                }\n            }\n        }\n    ]\n}\n```\n\n**IRSA (IAM Roles for Service Accounts) for EKS:**\n```yaml\n# ServiceAccount with IRSA annotation\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: my-service\n  namespace: production\n  annotations:\n    eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/MyServiceRole\n```\n\n#### VPC Networking\n\n```\nVPC: 10.0.0.0/16\n\nPublic Subnets (one per AZ):\n  10.0.1.0/24 - us-east-1a\n  10.0.2.0/24 - us-east-1b\n  10.0.3.0/24 - us-east-1c\n\nPrivate Subnets (one per AZ):\n  10.0.11.0/24 - us-east-1a\n  10.0.12.0/24 - us-east-1b\n  10.0.13.0/24 - us-east-1c\n\nDatabase Subnets (one per AZ, no internet access):\n  10.0.21.0/24 - us-east-1a\n  10.0.22.0/24 - us-east-1b\n  10.0.23.0/24 - us-east-1c\n\nInternet Gateway: in public subnets\nNAT Gateway: in each AZ's public subnet (HA)\n```\n\n#### Lambda for Event-Driven Processing\n\n```python\n# Lambda handler best practices\nimport json\nimport boto3\nfrom aws_lambda_powertools import Logger, Tracer, Metrics\nfrom aws_lambda_powertools.metrics import MetricUnit\n\nlogger = Logger()\ntracer = Tracer()\nmetrics = Metrics()\n\n@metrics.log_metrics\n@tracer.capture_lambda_handler\n@logger.inject_lambda_context\ndef handler(event: dict, context) -> dict:\n    \"\"\"Process S3 events\"\"\"\n    \n    for record in event.get(\"Records\", []):\n        bucket = record[\"s3\"][\"bucket\"][\"name\"]\n        key = record[\"s3\"][\"object\"][\"key\"]\n        \n        logger.info(\"Processing file\", bucket=bucket, key=key)\n        metrics.add_metric(name=\"FilesProcessed\", unit=MetricUnit.Count, value=1)\n        \n        try:\n            process_file(bucket, key)\n        except Exception as e:\n            logger.exception(\"Failed to process file\", extra={\"key\": key})\n            raise\n    \n    return {\"statusCode\": 200, \"body\": \"OK\"}\n```\n\n#### CloudWatch for Observability\n\n```python\n# Structured CloudWatch metric publishing\nimport boto3\nfrom datetime import datetime\n\ncloudwatch = boto3.client('cloudwatch')\n\ndef publish_custom_metrics(service_name: str, metrics: dict):\n    metric_data = []\n    \n    for metric_name, value in metrics.items():\n        metric_data.append({\n            'MetricName': metric_name,\n            'Value': value,\n            'Unit': 'Count',\n            'Timestamp': datetime.utcnow(),\n            'Dimensions': [\n                {'Name': 'ServiceName', 'Value': service_name},\n                {'Name': 'Environment', 'Value': 'production'},\n            ]\n        })\n    \n    cloudwatch.put_metric_data(\n        Namespace='MyApp/Business',\n        MetricData=metric_data\n    )\n```\n\n---\n\n"},{"title":"Chapter 8.2 – Infrastructure as Code with Terraform","html":"<h2>Chapter 8.2 – Infrastructure as Code with Terraform<\/h2>\n<pre><code class=\"language-hcl\"># Production-grade EKS cluster\nmodule &quot;eks&quot; {\n  source  = &quot;terraform-aws-modules/eks/aws&quot;\n  version = &quot;~&gt; 20.0&quot;\n\n  cluster_name    = &quot;production-cluster&quot;\n  cluster_version = &quot;1.29&quot;\n\n  vpc_id     = module.vpc.vpc_id\n  subnet_ids = module.vpc.private_subnets\n\n  cluster_endpoint_public_access  = false\n  cluster_endpoint_private_access = true\n\n  eks_managed_node_groups = {\n    application = {\n      instance_types = [&quot;m5.xlarge&quot;]\n      min_size       = 3\n      max_size       = 20\n      desired_size   = 5\n\n      labels = {\n        role = &quot;application&quot;\n      }\n    }\n\n    gpu = {\n      instance_types = [&quot;p3.2xlarge&quot;]\n      min_size       = 0\n      max_size       = 10\n      desired_size   = 0\n\n      taints = [{\n        key    = &quot;nvidia.com/gpu&quot;\n        value  = &quot;true&quot;\n        effect = &quot;NO_SCHEDULE&quot;\n      }]\n    }\n  }\n\n  tags = {\n    Environment = &quot;production&quot;\n    Team        = &quot;platform&quot;\n  }\n}\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 8.2 – Infrastructure as Code with Terraform\n\n```hcl\n# Production-grade EKS cluster\nmodule \"eks\" {\n  source  = \"terraform-aws-modules/eks/aws\"\n  version = \"~> 20.0\"\n\n  cluster_name    = \"production-cluster\"\n  cluster_version = \"1.29\"\n\n  vpc_id     = module.vpc.vpc_id\n  subnet_ids = module.vpc.private_subnets\n\n  cluster_endpoint_public_access  = false\n  cluster_endpoint_private_access = true\n\n  eks_managed_node_groups = {\n    application = {\n      instance_types = [\"m5.xlarge\"]\n      min_size       = 3\n      max_size       = 20\n      desired_size   = 5\n\n      labels = {\n        role = \"application\"\n      }\n    }\n\n    gpu = {\n      instance_types = [\"p3.2xlarge\"]\n      min_size       = 0\n      max_size       = 10\n      desired_size   = 0\n\n      taints = [{\n        key    = \"nvidia.com/gpu\"\n        value  = \"true\"\n        effect = \"NO_SCHEDULE\"\n      }]\n    }\n  }\n\n  tags = {\n    Environment = \"production\"\n    Team        = \"platform\"\n  }\n}\n```\n\n---\n\n"},{"title":"Chapter 8.3 – AWS Certifications Roadmap","html":"<h2>Chapter 8.3 – AWS Certifications Roadmap<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Certification<\/th>\n  <th>Priority<\/th>\n  <th>Prep Time<\/th>\n  <th>Value for Staff<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>AWS Solutions Architect Associate<\/td>\n  <td><strong>High<\/strong><\/td>\n  <td>6-8 weeks<\/td>\n  <td>Foundation, widely recognized<\/td>\n<\/tr>\n<tr>\n  <td>AWS Solutions Architect Professional<\/td>\n  <td>High<\/td>\n  <td>8-12 weeks<\/td>\n  <td>Staff/Principal signal<\/td>\n<\/tr>\n<tr>\n  <td>AWS DevOps Engineer Professional<\/td>\n  <td>Medium<\/td>\n  <td>8-12 weeks<\/td>\n  <td>Pipeline + Kubernetes depth<\/td>\n<\/tr>\n<tr>\n  <td>AWS Certified Security Specialty<\/td>\n  <td>Low-Medium<\/td>\n  <td>8 weeks<\/td>\n  <td>Security-focused roles<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Recommended sequence:<\/strong> SAA-C03 → SAP-C02<\/p>\n<p><strong>Study resources:<\/strong><\/p>\n<ul>\n<li>Adrian Cantrill courses (best quality, cantrill.io)<\/li>\n<li>Tutorials Dojo practice exams (essential)<\/li>\n<li>A Cloud Guru (hands-on labs)<\/li>\n<\/ul>\n<hr />\n","text":"## Chapter 8.3 – AWS Certifications Roadmap\n\n| Certification | Priority | Prep Time | Value for Staff |\n|---|---|---|---|\n| AWS Solutions Architect Associate | **High** | 6-8 weeks | Foundation, widely recognized |\n| AWS Solutions Architect Professional | High | 8-12 weeks | Staff/Principal signal |\n| AWS DevOps Engineer Professional | Medium | 8-12 weeks | Pipeline + Kubernetes depth |\n| AWS Certified Security Specialty | Low-Medium | 8 weeks | Security-focused roles |\n\n**Recommended sequence:** SAA-C03 → SAP-C02\n\n**Study resources:**\n- Adrian Cantrill courses (best quality, cantrill.io)\n- Tutorials Dojo practice exams (essential)\n- A Cloud Guru (hands-on labs)\n\n---\n\n"},{"title":"Chapter 8.4 – Milestones & Success Criteria","html":"<h2>Chapter 8.4 – Milestones &amp; Success Criteria<\/h2>\n<h3>Month-Based AWS Milestones<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Timeline<\/th>\n  <th>Goal<\/th>\n  <th>Deliverable<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Month 3<\/td>\n  <td>Master IAM + VPC + EKS networking<\/td>\n  <td>Can architect production VPC from scratch<\/td>\n<\/tr>\n<tr>\n  <td>Month 6<\/td>\n  <td>Pass SAA-C03 certification<\/td>\n  <td>Certification earned<\/td>\n<\/tr>\n<tr>\n  <td>Month 9<\/td>\n  <td>Implement complete GitOps pipeline<\/td>\n  <td>ArgoCD + EKS + Terraform working<\/td>\n<\/tr>\n<tr>\n  <td>Month 12<\/td>\n  <td>Pass SAP-C02 (Professional)<\/td>\n  <td>Certification earned<\/td>\n<\/tr>\n<tr>\n  <td>Month 15<\/td>\n  <td>Build and present cloud cost optimization plan<\/td>\n  <td>Present to leadership<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n","text":"## Chapter 8.4 – Milestones & Success Criteria\n\n### Month-Based AWS Milestones\n\n| Timeline | Goal | Deliverable |\n|---|---|---|\n| Month 3 | Master IAM + VPC + EKS networking | Can architect production VPC from scratch |\n| Month 6 | Pass SAA-C03 certification | Certification earned |\n| Month 9 | Implement complete GitOps pipeline | ArgoCD + EKS + Terraform working |\n| Month 12 | Pass SAP-C02 (Professional) | Certification earned |\n| Month 15 | Build and present cloud cost optimization plan | Present to leadership |\n\n"}]},{"id":9,"title":"Kubernetes Mastery","chapters":[{"title":"Introduction","html":"<h1>PART 9 – KUBERNETES MASTERY<\/h1>\n<hr />\n","text":"# PART 9 – KUBERNETES MASTERY\n\n---\n\n"},{"title":"Chapter 9.1 – Kubernetes Architecture Deep Dive","html":"<h2>Chapter 9.1 – Kubernetes Architecture Deep Dive<\/h2>\n<h3>Control Plane Components<\/h3>\n<pre><code>┌──────────────────────────────────────────────────────┐\n│                 Control Plane                        │\n│                                                      │\n│  ┌─────────────┐  ┌──────────────┐  ┌─────────────┐│\n│  │ API Server  │  │  Scheduler   │  │ Controller  ││\n│  │ (kube-      │  │  (kube-      │  │ Manager     ││\n│  │  apiserver) │  │  scheduler)  │  │ (kube-cm)   ││\n│  └─────────────┘  └──────────────┘  └─────────────┘│\n│         │                                     │      │\n│  ┌──────▼───────────────────────────────────┐ │      │\n│  │              etcd (cluster state)        │ │      │\n│  └──────────────────────────────────────────┘ │      │\n└──────────────────────────────────────────────────────┘\n                        │\n          ┌─────────────┼─────────────┐\n          ▼             ▼             ▼\n    ┌───────────┐ ┌───────────┐ ┌───────────┐\n    │  Node 1   │ │  Node 2   │ │  Node N   │\n    │ ┌───────┐ │ │ ┌───────┐ │ │ ┌───────┐ │\n    │ │kubelet│ │ │ │kubelet│ │ │ │kubelet│ │\n    │ │kube-  │ │ │ │kube-  │ │ │ │kube-  │ │\n    │ │proxy  │ │ │ │proxy  │ │ │ │proxy  │ │\n    │ └───────┘ │ │ └───────┘ │ │ └───────┘ │\n    └───────────┘ └───────────┘ └───────────┘\n<\/code><\/pre>\n<p><strong>etcd:<\/strong> Distributed key-value store. All cluster state lives here. Raft-based consensus.<\/p>\n<p><strong>kube-apiserver:<\/strong> The front-end to the control plane. All <code>kubectl<\/code> commands go here. Validates and persists state to etcd.<\/p>\n<p><strong>kube-scheduler:<\/strong> Watches for unscheduled Pods. Assigns them to nodes based on resource requests, taints, affinity rules.<\/p>\n<p><strong>kube-controller-manager:<\/strong> Runs control loops:<\/p>\n<ul>\n<li>ReplicaSet controller: ensures desired Pod count<\/li>\n<li>Deployment controller: rolling updates<\/li>\n<li>Node controller: handles node failures<\/li>\n<li>Service controller: creates LoadBalancer resources<\/li>\n<\/ul>\n<hr />\n","text":"## Chapter 9.1 – Kubernetes Architecture Deep Dive\n\n### Control Plane Components\n\n```\n┌──────────────────────────────────────────────────────┐\n│                 Control Plane                        │\n│                                                      │\n│  ┌─────────────┐  ┌──────────────┐  ┌─────────────┐│\n│  │ API Server  │  │  Scheduler   │  │ Controller  ││\n│  │ (kube-      │  │  (kube-      │  │ Manager     ││\n│  │  apiserver) │  │  scheduler)  │  │ (kube-cm)   ││\n│  └─────────────┘  └──────────────┘  └─────────────┘│\n│         │                                     │      │\n│  ┌──────▼───────────────────────────────────┐ │      │\n│  │              etcd (cluster state)        │ │      │\n│  └──────────────────────────────────────────┘ │      │\n└──────────────────────────────────────────────────────┘\n                        │\n          ┌─────────────┼─────────────┐\n          ▼             ▼             ▼\n    ┌───────────┐ ┌───────────┐ ┌───────────┐\n    │  Node 1   │ │  Node 2   │ │  Node N   │\n    │ ┌───────┐ │ │ ┌───────┐ │ │ ┌───────┐ │\n    │ │kubelet│ │ │ │kubelet│ │ │ │kubelet│ │\n    │ │kube-  │ │ │ │kube-  │ │ │ │kube-  │ │\n    │ │proxy  │ │ │ │proxy  │ │ │ │proxy  │ │\n    │ └───────┘ │ │ └───────┘ │ │ └───────┘ │\n    └───────────┘ └───────────┘ └───────────┘\n```\n\n**etcd:** Distributed key-value store. All cluster state lives here. Raft-based consensus.\n\n**kube-apiserver:** The front-end to the control plane. All `kubectl` commands go here. Validates and persists state to etcd.\n\n**kube-scheduler:** Watches for unscheduled Pods. Assigns them to nodes based on resource requests, taints, affinity rules.\n\n**kube-controller-manager:** Runs control loops:\n- ReplicaSet controller: ensures desired Pod count\n- Deployment controller: rolling updates\n- Node controller: handles node failures\n- Service controller: creates LoadBalancer resources\n\n---\n\n"},{"title":"Chapter 9.2 – Pod Scheduling Deep Dive","html":"<h2>Chapter 9.2 – Pod Scheduling Deep Dive<\/h2>\n<h3>Node Selection Mechanisms<\/h3>\n<pre><code class=\"language-yaml\"># 1. nodeSelector — simple label matching\nspec:\n  nodeSelector:\n    disktype: ssd\n    gpu: &quot;true&quot;\n\n# 2. Node Affinity — more expressive\nspec:\n  affinity:\n    nodeAffinity:\n      requiredDuringSchedulingIgnoredDuringExecution:\n        nodeSelectorTerms:\n        - matchExpressions:\n          - key: topology.kubernetes.io/zone\n            operator: In\n            values: [&quot;us-east-1a&quot;, &quot;us-east-1b&quot;]\n      preferredDuringSchedulingIgnoredDuringExecution:\n      - weight: 100\n        preference:\n          matchExpressions:\n          - key: instance-type\n            operator: In\n            values: [&quot;m5.2xlarge&quot;]\n\n# 3. Taints and Tolerations — for dedicated nodes\n# Node: kubectl taint nodes gpu-node-1 nvidia.com/gpu=true:NoSchedule\nspec:\n  tolerations:\n  - key: &quot;nvidia.com/gpu&quot;\n    operator: &quot;Equal&quot;\n    value: &quot;true&quot;\n    effect: &quot;NoSchedule&quot;\n<\/code><\/pre>\n<h3>Pod Disruption Budgets (PDB)<\/h3>\n<pre><code class=\"language-yaml\"># Ensure at least 2 replicas are always available during disruptions\napiVersion: policy/v1\nkind: PodDisruptionBudget\nmetadata:\n  name: user-service-pdb\nspec:\n  minAvailable: 2\n  selector:\n    matchLabels:\n      app: user-service\n<\/code><\/pre>\n<h3>Resource Requests and Limits<\/h3>\n<pre><code class=\"language-yaml\">resources:\n  requests:\n    cpu: &quot;250m&quot;      # 0.25 CPU cores (scheduling guarantee)\n    memory: &quot;256Mi&quot;  # 256 MiB RAM\n  limits:\n    cpu: &quot;1000m&quot;     # 1 CPU core max (throttled if exceeded)\n    memory: &quot;512Mi&quot;  # 512 MiB max (OOMKilled if exceeded)\n<\/code><\/pre>\n<p><strong>Best practices:<\/strong><\/p>\n<ul>\n<li>Always set requests (for scheduler)<\/li>\n<li>Memory limits = memory requests (avoid OOMKill surprises)<\/li>\n<li>CPU limits are controversial — throttling can cause P99 latency spikes<\/li>\n<li>Use VPA (Vertical Pod Autoscaler) to auto-tune requests<\/li>\n<\/ul>\n<hr />\n","text":"## Chapter 9.2 – Pod Scheduling Deep Dive\n\n### Node Selection Mechanisms\n\n```yaml\n# 1. nodeSelector — simple label matching\nspec:\n  nodeSelector:\n    disktype: ssd\n    gpu: \"true\"\n\n# 2. Node Affinity — more expressive\nspec:\n  affinity:\n    nodeAffinity:\n      requiredDuringSchedulingIgnoredDuringExecution:\n        nodeSelectorTerms:\n        - matchExpressions:\n          - key: topology.kubernetes.io/zone\n            operator: In\n            values: [\"us-east-1a\", \"us-east-1b\"]\n      preferredDuringSchedulingIgnoredDuringExecution:\n      - weight: 100\n        preference:\n          matchExpressions:\n          - key: instance-type\n            operator: In\n            values: [\"m5.2xlarge\"]\n\n# 3. Taints and Tolerations — for dedicated nodes\n# Node: kubectl taint nodes gpu-node-1 nvidia.com/gpu=true:NoSchedule\nspec:\n  tolerations:\n  - key: \"nvidia.com/gpu\"\n    operator: \"Equal\"\n    value: \"true\"\n    effect: \"NoSchedule\"\n```\n\n### Pod Disruption Budgets (PDB)\n\n```yaml\n# Ensure at least 2 replicas are always available during disruptions\napiVersion: policy/v1\nkind: PodDisruptionBudget\nmetadata:\n  name: user-service-pdb\nspec:\n  minAvailable: 2\n  selector:\n    matchLabels:\n      app: user-service\n```\n\n### Resource Requests and Limits\n\n```yaml\nresources:\n  requests:\n    cpu: \"250m\"      # 0.25 CPU cores (scheduling guarantee)\n    memory: \"256Mi\"  # 256 MiB RAM\n  limits:\n    cpu: \"1000m\"     # 1 CPU core max (throttled if exceeded)\n    memory: \"512Mi\"  # 512 MiB max (OOMKilled if exceeded)\n```\n\n**Best practices:**\n- Always set requests (for scheduler)\n- Memory limits = memory requests (avoid OOMKill surprises)\n- CPU limits are controversial — throttling can cause P99 latency spikes\n- Use VPA (Vertical Pod Autoscaler) to auto-tune requests\n\n---\n\n"},{"title":"Chapter 9.3 – Kubernetes Networking","html":"<h2>Chapter 9.3 – Kubernetes Networking<\/h2>\n<h3>Service Types<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Type<\/th>\n  <th>External Access<\/th>\n  <th>Use Case<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>ClusterIP<\/td>\n  <td>No (internal only)<\/td>\n  <td>Service-to-service communication<\/td>\n<\/tr>\n<tr>\n  <td>NodePort<\/td>\n  <td>Yes (via node IP + port)<\/td>\n  <td>Development, simple external access<\/td>\n<\/tr>\n<tr>\n  <td>LoadBalancer<\/td>\n  <td>Yes (via cloud LB)<\/td>\n  <td>Production external services<\/td>\n<\/tr>\n<tr>\n  <td>ExternalName<\/td>\n  <td>DNS CNAME<\/td>\n  <td>Access external services by name<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>How Service Discovery Works<\/h3>\n<pre><code>Pod A wants to talk to user-service:\n  1. Pod A queries DNS: user-service.default.svc.cluster.local\n  2. CoreDNS resolves to ClusterIP (e.g., 10.96.45.123)\n  3. kube-proxy has programmed iptables/ipvs rules on each node\n  4. Packet hits iptables rule → DNAT to one of the endpoint Pods\n  5. Pod selected round-robin or based on ipvs algorithm\n<\/code><\/pre>\n<h3>Ingress Configuration<\/h3>\n<pre><code class=\"language-yaml\">apiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: api-ingress\n  annotations:\n    nginx.ingress.kubernetes.io/rate-limit: &quot;100&quot;\n    nginx.ingress.kubernetes.io/ssl-redirect: &quot;true&quot;\n    cert-manager.io/cluster-issuer: &quot;letsencrypt-prod&quot;\nspec:\n  ingressClassName: nginx\n  tls:\n  - hosts:\n    - api.mycompany.com\n    secretName: api-tls\n  rules:\n  - host: api.mycompany.com\n    http:\n      paths:\n      - path: /v1/users\n        pathType: Prefix\n        backend:\n          service:\n            name: user-service\n            port:\n              number: 8080\n      - path: /v1/orders\n        pathType: Prefix\n        backend:\n          service:\n            name: order-service\n            port:\n              number: 8080\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 9.3 – Kubernetes Networking\n\n### Service Types\n\n| Type | External Access | Use Case |\n|---|---|---|\n| ClusterIP | No (internal only) | Service-to-service communication |\n| NodePort | Yes (via node IP + port) | Development, simple external access |\n| LoadBalancer | Yes (via cloud LB) | Production external services |\n| ExternalName | DNS CNAME | Access external services by name |\n\n### How Service Discovery Works\n\n```\nPod A wants to talk to user-service:\n  1. Pod A queries DNS: user-service.default.svc.cluster.local\n  2. CoreDNS resolves to ClusterIP (e.g., 10.96.45.123)\n  3. kube-proxy has programmed iptables/ipvs rules on each node\n  4. Packet hits iptables rule → DNAT to one of the endpoint Pods\n  5. Pod selected round-robin or based on ipvs algorithm\n```\n\n### Ingress Configuration\n\n```yaml\napiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: api-ingress\n  annotations:\n    nginx.ingress.kubernetes.io/rate-limit: \"100\"\n    nginx.ingress.kubernetes.io/ssl-redirect: \"true\"\n    cert-manager.io/cluster-issuer: \"letsencrypt-prod\"\nspec:\n  ingressClassName: nginx\n  tls:\n  - hosts:\n    - api.mycompany.com\n    secretName: api-tls\n  rules:\n  - host: api.mycompany.com\n    http:\n      paths:\n      - path: /v1/users\n        pathType: Prefix\n        backend:\n          service:\n            name: user-service\n            port:\n              number: 8080\n      - path: /v1/orders\n        pathType: Prefix\n        backend:\n          service:\n            name: order-service\n            port:\n              number: 8080\n```\n\n---\n\n"},{"title":"Chapter 9.4 – Autoscaling","html":"<h2>Chapter 9.4 – Autoscaling<\/h2>\n<h3>Horizontal Pod Autoscaler (HPA)<\/h3>\n<pre><code class=\"language-yaml\">apiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nmetadata:\n  name: user-service-hpa\nspec:\n  scaleTargetRef:\n    apiVersion: apps/v1\n    kind: Deployment\n    name: user-service\n  minReplicas: 3\n  maxReplicas: 50\n  metrics:\n  - type: Resource\n    resource:\n      name: cpu\n      target:\n        type: Utilization\n        averageUtilization: 70\n  - type: External\n    external:\n      metric:\n        name: rabbitmq_queue_depth\n        selector:\n          matchLabels:\n            queue: &quot;user-events&quot;\n      target:\n        type: AverageValue\n        averageValue: &quot;100&quot;  # scale up when &gt; 100 messages per pod\n  behavior:\n    scaleUp:\n      stabilizationWindowSeconds: 60\n      policies:\n      - type: Percent\n        value: 100\n        periodSeconds: 60\n    scaleDown:\n      stabilizationWindowSeconds: 300  # be conservative scaling down\n<\/code><\/pre>\n<h3>Cluster Autoscaler vs Karpenter<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Feature<\/th>\n  <th>Cluster Autoscaler<\/th>\n  <th>Karpenter<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Node provisioning<\/td>\n  <td>1-3 min<\/td>\n  <td>30-60 seconds<\/td>\n<\/tr>\n<tr>\n  <td>Instance selection<\/td>\n  <td>Pre-defined node groups<\/td>\n  <td>Dynamic (any instance type)<\/td>\n<\/tr>\n<tr>\n  <td>Bin packing<\/td>\n  <td>Basic<\/td>\n  <td>Advanced<\/td>\n<\/tr>\n<tr>\n  <td>Spot support<\/td>\n  <td>Via node groups<\/td>\n  <td>Native, flexible<\/td>\n<\/tr>\n<tr>\n  <td>AWS integration<\/td>\n  <td>Limited<\/td>\n  <td>Deep (native AWS)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Karpenter NodePool:<\/strong><\/p>\n<pre><code class=\"language-yaml\">apiVersion: karpenter.sh/v1beta1\nkind: NodePool\nmetadata:\n  name: default\nspec:\n  template:\n    spec:\n      requirements:\n      - key: &quot;karpenter.k8s.aws/instance-category&quot;\n        operator: In\n        values: [&quot;m&quot;, &quot;c&quot;, &quot;r&quot;]\n      - key: &quot;karpenter.k8s.aws/instance-cpu&quot;\n        operator: In\n        values: [&quot;4&quot;, &quot;8&quot;, &quot;16&quot;]\n      - key: &quot;kubernetes.io/arch&quot;\n        operator: In\n        values: [&quot;amd64&quot;]\n      - key: &quot;karpenter.sh/capacity-type&quot;\n        operator: In\n        values: [&quot;spot&quot;, &quot;on-demand&quot;]\n  limits:\n    cpu: 1000\n    memory: 4000Gi\n  disruption:\n    consolidationPolicy: WhenUnderutilized\n    consolidateAfter: 30s\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 9.4 – Autoscaling\n\n### Horizontal Pod Autoscaler (HPA)\n\n```yaml\napiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nmetadata:\n  name: user-service-hpa\nspec:\n  scaleTargetRef:\n    apiVersion: apps/v1\n    kind: Deployment\n    name: user-service\n  minReplicas: 3\n  maxReplicas: 50\n  metrics:\n  - type: Resource\n    resource:\n      name: cpu\n      target:\n        type: Utilization\n        averageUtilization: 70\n  - type: External\n    external:\n      metric:\n        name: rabbitmq_queue_depth\n        selector:\n          matchLabels:\n            queue: \"user-events\"\n      target:\n        type: AverageValue\n        averageValue: \"100\"  # scale up when > 100 messages per pod\n  behavior:\n    scaleUp:\n      stabilizationWindowSeconds: 60\n      policies:\n      - type: Percent\n        value: 100\n        periodSeconds: 60\n    scaleDown:\n      stabilizationWindowSeconds: 300  # be conservative scaling down\n```\n\n### Cluster Autoscaler vs Karpenter\n\n| Feature | Cluster Autoscaler | Karpenter |\n|---|---|---|\n| Node provisioning | 1-3 min | 30-60 seconds |\n| Instance selection | Pre-defined node groups | Dynamic (any instance type) |\n| Bin packing | Basic | Advanced |\n| Spot support | Via node groups | Native, flexible |\n| AWS integration | Limited | Deep (native AWS) |\n\n**Karpenter NodePool:**\n```yaml\napiVersion: karpenter.sh/v1beta1\nkind: NodePool\nmetadata:\n  name: default\nspec:\n  template:\n    spec:\n      requirements:\n      - key: \"karpenter.k8s.aws/instance-category\"\n        operator: In\n        values: [\"m\", \"c\", \"r\"]\n      - key: \"karpenter.k8s.aws/instance-cpu\"\n        operator: In\n        values: [\"4\", \"8\", \"16\"]\n      - key: \"kubernetes.io/arch\"\n        operator: In\n        values: [\"amd64\"]\n      - key: \"karpenter.sh/capacity-type\"\n        operator: In\n        values: [\"spot\", \"on-demand\"]\n  limits:\n    cpu: 1000\n    memory: 4000Gi\n  disruption:\n    consolidationPolicy: WhenUnderutilized\n    consolidateAfter: 30s\n```\n\n---\n\n"},{"title":"Chapter 9.5 – Kubernetes Operators","html":"<h2>Chapter 9.5 – Kubernetes Operators<\/h2>\n<p>An Operator is a Kubernetes controller that encodes operational knowledge for a complex application.<\/p>\n<h3>When to Build an Operator<\/h3>\n<ul>\n<li>The application has complex lifecycle management<\/li>\n<li>Manual operations require deep domain knowledge<\/li>\n<li>You manage many instances of the same application<\/li>\n<\/ul>\n<p><strong>Operator Framework (Operator SDK):<\/strong><\/p>\n<pre><code class=\"language-python\"># Kopf — Python framework for Kubernetes operators\nimport kopf\nimport kubernetes\n\n@kopf.on.create('mycompany.com', 'v1', 'databaseclusters')\nasync def create_database_cluster(spec, name, namespace, **kwargs):\n    &quot;&quot;&quot;Called when a DatabaseCluster resource is created&quot;&quot;&quot;\n    \n    replicas = spec.get('replicas', 3)\n    storage_size = spec.get('storageSize', '100Gi')\n    \n    # Create the StatefulSet\n    apps_v1 = kubernetes.client.AppsV1Api()\n    statefulset = build_statefulset(name, namespace, replicas, storage_size)\n    apps_v1.create_namespaced_stateful_set(namespace, statefulset)\n    \n    # Create the Service\n    core_v1 = kubernetes.client.CoreV1Api()\n    service = build_service(name, namespace)\n    core_v1.create_namespaced_service(namespace, service)\n    \n    return {&quot;message&quot;: f&quot;Database cluster {name} created with {replicas} replicas&quot;}\n\n@kopf.on.field('mycompany.com', 'v1', 'databaseclusters', field='spec.replicas')\nasync def scale_database_cluster(old, new, name, namespace, **kwargs):\n    &quot;&quot;&quot;Called when replicas field changes&quot;&quot;&quot;\n    \n    apps_v1 = kubernetes.client.AppsV1Api()\n    apps_v1.patch_namespaced_stateful_set(\n        name=name,\n        namespace=namespace,\n        body={&quot;spec&quot;: {&quot;replicas&quot;: new}}\n    )\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 9.5 – Kubernetes Operators\n\nAn Operator is a Kubernetes controller that encodes operational knowledge for a complex application.\n\n### When to Build an Operator\n\n- The application has complex lifecycle management\n- Manual operations require deep domain knowledge\n- You manage many instances of the same application\n\n**Operator Framework (Operator SDK):**\n```python\n# Kopf — Python framework for Kubernetes operators\nimport kopf\nimport kubernetes\n\n@kopf.on.create('mycompany.com', 'v1', 'databaseclusters')\nasync def create_database_cluster(spec, name, namespace, **kwargs):\n    \"\"\"Called when a DatabaseCluster resource is created\"\"\"\n    \n    replicas = spec.get('replicas', 3)\n    storage_size = spec.get('storageSize', '100Gi')\n    \n    # Create the StatefulSet\n    apps_v1 = kubernetes.client.AppsV1Api()\n    statefulset = build_statefulset(name, namespace, replicas, storage_size)\n    apps_v1.create_namespaced_stateful_set(namespace, statefulset)\n    \n    # Create the Service\n    core_v1 = kubernetes.client.CoreV1Api()\n    service = build_service(name, namespace)\n    core_v1.create_namespaced_service(namespace, service)\n    \n    return {\"message\": f\"Database cluster {name} created with {replicas} replicas\"}\n\n@kopf.on.field('mycompany.com', 'v1', 'databaseclusters', field='spec.replicas')\nasync def scale_database_cluster(old, new, name, namespace, **kwargs):\n    \"\"\"Called when replicas field changes\"\"\"\n    \n    apps_v1 = kubernetes.client.AppsV1Api()\n    apps_v1.patch_namespaced_stateful_set(\n        name=name,\n        namespace=namespace,\n        body={\"spec\": {\"replicas\": new}}\n    )\n```\n\n---\n\n"},{"title":"Chapter 9.6 – Service Mesh (Istio/Linkerd)","html":"<h2>Chapter 9.6 – Service Mesh (Istio/Linkerd)<\/h2>\n<h3>What a Service Mesh Provides<\/h3>\n<pre><code>Without service mesh:\n  Service A → Service B\n  (developer must implement: retries, circuit breakers, mTLS, metrics)\n\nWith service mesh (sidecar proxy):\n  Service A → [Envoy sidecar] → network → [Envoy sidecar] → Service B\n  (infrastructure layer handles: retries, circuit breakers, mTLS, metrics)\n<\/code><\/pre>\n<h3>Istio Traffic Management<\/h3>\n<pre><code class=\"language-yaml\"># VirtualService — traffic routing\napiVersion: networking.istio.io/v1alpha3\nkind: VirtualService\nmetadata:\n  name: user-service\nspec:\n  hosts:\n  - user-service\n  http:\n  - match:\n    - headers:\n        x-canary:\n          exact: &quot;true&quot;\n    route:\n    - destination:\n        host: user-service\n        subset: v2\n      weight: 100\n  - route:\n    - destination:\n        host: user-service\n        subset: v1\n      weight: 90\n    - destination:\n        host: user-service\n        subset: v2\n      weight: 10  # 10% canary\n  retries:\n    attempts: 3\n    perTryTimeout: 5s\n  timeout: 15s\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 9.6 – Service Mesh (Istio/Linkerd)\n\n### What a Service Mesh Provides\n\n```\nWithout service mesh:\n  Service A → Service B\n  (developer must implement: retries, circuit breakers, mTLS, metrics)\n\nWith service mesh (sidecar proxy):\n  Service A → [Envoy sidecar] → network → [Envoy sidecar] → Service B\n  (infrastructure layer handles: retries, circuit breakers, mTLS, metrics)\n```\n\n### Istio Traffic Management\n\n```yaml\n# VirtualService — traffic routing\napiVersion: networking.istio.io/v1alpha3\nkind: VirtualService\nmetadata:\n  name: user-service\nspec:\n  hosts:\n  - user-service\n  http:\n  - match:\n    - headers:\n        x-canary:\n          exact: \"true\"\n    route:\n    - destination:\n        host: user-service\n        subset: v2\n      weight: 100\n  - route:\n    - destination:\n        host: user-service\n        subset: v1\n      weight: 90\n    - destination:\n        host: user-service\n        subset: v2\n      weight: 10  # 10% canary\n  retries:\n    attempts: 3\n    perTryTimeout: 5s\n  timeout: 15s\n```\n\n---\n\n"},{"title":"Chapter 9.7 – CKA Preparation Roadmap","html":"<h2>Chapter 9.7 – CKA Preparation Roadmap<\/h2>\n<h3>CKA Exam Domains (2024)<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Domain<\/th>\n  <th>Weight<\/th>\n  <th>Key Topics<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Cluster Architecture, Installation &amp; Configuration<\/td>\n  <td>25%<\/td>\n  <td>kubeadm, etcd backup, RBAC<\/td>\n<\/tr>\n<tr>\n  <td>Workloads &amp; Scheduling<\/td>\n  <td>15%<\/td>\n  <td>Deployments, DaemonSets, ConfigMaps<\/td>\n<\/tr>\n<tr>\n  <td>Services &amp; Networking<\/td>\n  <td>20%<\/td>\n  <td>Services, Ingress, NetworkPolicy<\/td>\n<\/tr>\n<tr>\n  <td>Storage<\/td>\n  <td>10%<\/td>\n  <td>PV, PVC, StorageClass<\/td>\n<\/tr>\n<tr>\n  <td>Troubleshooting<\/td>\n  <td>30%<\/td>\n  <td>Pod failures, node issues, logs<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Study Plan (8 Weeks)<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Week<\/th>\n  <th>Focus<\/th>\n  <th>Resource<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>1-2<\/td>\n  <td>Core concepts, Pods, Deployments<\/td>\n  <td>Kubernetes Docs + killer.sh<\/td>\n<\/tr>\n<tr>\n  <td>3<\/td>\n  <td>Services, Networking, Ingress<\/td>\n  <td>Linux Foundation CKA course<\/td>\n<\/tr>\n<tr>\n  <td>4<\/td>\n  <td>Storage, RBAC, Security<\/td>\n  <td>Practice on KillerCoda<\/td>\n<\/tr>\n<tr>\n  <td>5<\/td>\n  <td>Scheduling, Taints, Affinity<\/td>\n  <td>—<\/td>\n<\/tr>\n<tr>\n  <td>6<\/td>\n  <td>Cluster maintenance, upgrades<\/td>\n  <td>—<\/td>\n<\/tr>\n<tr>\n  <td>7<\/td>\n  <td>Troubleshooting practice<\/td>\n  <td>killer.sh (included with exam)<\/td>\n<\/tr>\n<tr>\n  <td>8<\/td>\n  <td>Full mock exams + time management<\/td>\n  <td>2 mock exams/day<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Resources:<\/strong><\/p>\n<ul>\n<li><strong>killer.sh<\/strong> — Official exam simulator (included with CKA registration)<\/li>\n<li><strong>KillerCoda<\/strong> — Free interactive Kubernetes labs<\/li>\n<li><strong>Mumshad Mannambeth's CKA course<\/strong> (Udemy) — Most popular<\/li>\n<li><strong>Official Kubernetes documentation<\/strong> — Allowed during exam!<\/li>\n<\/ul>\n<hr />\n","text":"## Chapter 9.7 – CKA Preparation Roadmap\n\n### CKA Exam Domains (2024)\n\n| Domain | Weight | Key Topics |\n|---|---|---|\n| Cluster Architecture, Installation & Configuration | 25% | kubeadm, etcd backup, RBAC |\n| Workloads & Scheduling | 15% | Deployments, DaemonSets, ConfigMaps |\n| Services & Networking | 20% | Services, Ingress, NetworkPolicy |\n| Storage | 10% | PV, PVC, StorageClass |\n| Troubleshooting | 30% | Pod failures, node issues, logs |\n\n### Study Plan (8 Weeks)\n\n| Week | Focus | Resource |\n|---|---|---|\n| 1-2 | Core concepts, Pods, Deployments | Kubernetes Docs + killer.sh |\n| 3 | Services, Networking, Ingress | Linux Foundation CKA course |\n| 4 | Storage, RBAC, Security | Practice on KillerCoda |\n| 5 | Scheduling, Taints, Affinity | — |\n| 6 | Cluster maintenance, upgrades | — |\n| 7 | Troubleshooting practice | killer.sh (included with exam) |\n| 8 | Full mock exams + time management | 2 mock exams/day |\n\n**Resources:**\n- **killer.sh** — Official exam simulator (included with CKA registration)\n- **KillerCoda** — Free interactive Kubernetes labs\n- **Mumshad Mannambeth's CKA course** (Udemy) — Most popular\n- **Official Kubernetes documentation** — Allowed during exam!\n\n---\n\n"}]},{"id":10,"title":"Observability","chapters":[{"title":"Introduction","html":"<h1>PART 10 – OBSERVABILITY<\/h1>\n<hr />\n","text":"# PART 10 – OBSERVABILITY\n\n---\n\n"},{"title":"Chapter 10.1 – The Three Pillars of Observability","html":"<h2>Chapter 10.1 – The Three Pillars of Observability<\/h2>\n<h3>Metrics, Logs, and Traces<\/h3>\n<pre><code>Metrics: &quot;What is happening&quot; — quantitative measurements\n  CPU: 72%, Error rate: 0.3%, p99 latency: 145ms\n\nLogs: &quot;Why is it happening&quot; — discrete events\n  ERROR: Failed to connect to database: connection timeout\n\nTraces: &quot;Where is it happening&quot; — request flow across services\n  Request 123 → User Service (45ms) → Auth Service (12ms) → DB (88ms)\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 10.1 – The Three Pillars of Observability\n\n### Metrics, Logs, and Traces\n\n```\nMetrics: \"What is happening\" — quantitative measurements\n  CPU: 72%, Error rate: 0.3%, p99 latency: 145ms\n\nLogs: \"Why is it happening\" — discrete events\n  ERROR: Failed to connect to database: connection timeout\n\nTraces: \"Where is it happening\" — request flow across services\n  Request 123 → User Service (45ms) → Auth Service (12ms) → DB (88ms)\n```\n\n---\n\n"},{"title":"Chapter 10.2 – OpenTelemetry","html":"<h2>Chapter 10.2 – OpenTelemetry<\/h2>\n<p>OpenTelemetry is the industry standard for instrumentation. Use it from day one.<\/p>\n<h3>Python Instrumentation<\/h3>\n<pre><code class=\"language-python\"># Auto-instrumentation (zero-code)\npip install opentelemetry-distro opentelemetry-exporter-otlp\nopentelemetry-bootstrap -a install\nopentelemetry-instrument \\\n    --service-name user-service \\\n    --exporter-otlp-endpoint http://otel-collector:4317 \\\n    python -m uvicorn main:app\n\n# Manual instrumentation\nfrom opentelemetry import trace, metrics\nfrom opentelemetry.sdk.trace import TracerProvider\nfrom opentelemetry.sdk.metrics import MeterProvider\nfrom opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter\n\ntracer = trace.get_tracer(__name__)\nmeter = metrics.get_meter(__name__)\n\n# Custom counter\nrequest_counter = meter.create_counter(\n    name=&quot;api.requests&quot;,\n    description=&quot;Total API requests&quot;,\n    unit=&quot;1&quot;\n)\n\n# Custom histogram\nlatency_histogram = meter.create_histogram(\n    name=&quot;api.latency&quot;,\n    description=&quot;API latency in milliseconds&quot;,\n    unit=&quot;ms&quot;\n)\n\n# Span creation\nasync def process_order(order_id: str):\n    with tracer.start_as_current_span(&quot;process_order&quot;) as span:\n        span.set_attribute(&quot;order.id&quot;, order_id)\n        span.set_attribute(&quot;service.version&quot;, &quot;1.2.3&quot;)\n        \n        try:\n            result = await order_repository.get(order_id)\n            span.set_attribute(&quot;order.status&quot;, result.status)\n            return result\n        except Exception as e:\n            span.record_exception(e)\n            span.set_status(trace.Status(trace.StatusCode.ERROR))\n            raise\n<\/code><\/pre>\n<h3>OpenTelemetry Collector Configuration<\/h3>\n<pre><code class=\"language-yaml\"># otel-collector-config.yaml\nreceivers:\n  otlp:\n    protocols:\n      grpc:\n        endpoint: 0.0.0.0:4317\n      http:\n        endpoint: 0.0.0.0:4318\n\nprocessors:\n  batch:\n    timeout: 5s\n    send_batch_size: 10000\n  \n  resource:\n    attributes:\n    - key: environment\n      value: production\n      action: upsert\n\nexporters:\n  prometheus:\n    endpoint: &quot;0.0.0.0:8889&quot;\n  \n  jaeger:\n    endpoint: jaeger:14250\n    tls:\n      insecure: true\n  \n  loki:\n    endpoint: http://loki:3100/loki/api/v1/push\n\nservice:\n  pipelines:\n    traces:\n      receivers: [otlp]\n      processors: [batch, resource]\n      exporters: [jaeger]\n    metrics:\n      receivers: [otlp]\n      processors: [batch]\n      exporters: [prometheus]\n    logs:\n      receivers: [otlp]\n      processors: [batch]\n      exporters: [loki]\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 10.2 – OpenTelemetry\n\nOpenTelemetry is the industry standard for instrumentation. Use it from day one.\n\n### Python Instrumentation\n\n```python\n# Auto-instrumentation (zero-code)\npip install opentelemetry-distro opentelemetry-exporter-otlp\nopentelemetry-bootstrap -a install\nopentelemetry-instrument \\\n    --service-name user-service \\\n    --exporter-otlp-endpoint http://otel-collector:4317 \\\n    python -m uvicorn main:app\n\n# Manual instrumentation\nfrom opentelemetry import trace, metrics\nfrom opentelemetry.sdk.trace import TracerProvider\nfrom opentelemetry.sdk.metrics import MeterProvider\nfrom opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter\n\ntracer = trace.get_tracer(__name__)\nmeter = metrics.get_meter(__name__)\n\n# Custom counter\nrequest_counter = meter.create_counter(\n    name=\"api.requests\",\n    description=\"Total API requests\",\n    unit=\"1\"\n)\n\n# Custom histogram\nlatency_histogram = meter.create_histogram(\n    name=\"api.latency\",\n    description=\"API latency in milliseconds\",\n    unit=\"ms\"\n)\n\n# Span creation\nasync def process_order(order_id: str):\n    with tracer.start_as_current_span(\"process_order\") as span:\n        span.set_attribute(\"order.id\", order_id)\n        span.set_attribute(\"service.version\", \"1.2.3\")\n        \n        try:\n            result = await order_repository.get(order_id)\n            span.set_attribute(\"order.status\", result.status)\n            return result\n        except Exception as e:\n            span.record_exception(e)\n            span.set_status(trace.Status(trace.StatusCode.ERROR))\n            raise\n```\n\n### OpenTelemetry Collector Configuration\n\n```yaml\n# otel-collector-config.yaml\nreceivers:\n  otlp:\n    protocols:\n      grpc:\n        endpoint: 0.0.0.0:4317\n      http:\n        endpoint: 0.0.0.0:4318\n\nprocessors:\n  batch:\n    timeout: 5s\n    send_batch_size: 10000\n  \n  resource:\n    attributes:\n    - key: environment\n      value: production\n      action: upsert\n\nexporters:\n  prometheus:\n    endpoint: \"0.0.0.0:8889\"\n  \n  jaeger:\n    endpoint: jaeger:14250\n    tls:\n      insecure: true\n  \n  loki:\n    endpoint: http://loki:3100/loki/api/v1/push\n\nservice:\n  pipelines:\n    traces:\n      receivers: [otlp]\n      processors: [batch, resource]\n      exporters: [jaeger]\n    metrics:\n      receivers: [otlp]\n      processors: [batch]\n      exporters: [prometheus]\n    logs:\n      receivers: [otlp]\n      processors: [batch]\n      exporters: [loki]\n```\n\n---\n\n"},{"title":"Chapter 10.3 – SLIs, SLOs, and Error Budgets","html":"<h2>Chapter 10.3 – SLIs, SLOs, and Error Budgets<\/h2>\n<h3>SLI (Service Level Indicator)<\/h3>\n<p>A quantitative measure of a service's behavior:<\/p>\n<pre><code>SLI = (good events / total events) × 100%\n\nExamples:\n  Availability SLI = (successful requests / total requests) × 100%\n  Latency SLI = (requests &lt; 200ms / total requests) × 100%\n  Error SLI = (requests without 5xx errors / total requests) × 100%\n<\/code><\/pre>\n<h3>SLO (Service Level Objective)<\/h3>\n<p>A target value for an SLI:<\/p>\n<pre><code>SLO: 99.9% of requests return a successful response (availability)\nSLO: 99% of requests complete within 200ms (latency)\nSLO: 99.95% of requests complete without server error (error rate)\n<\/code><\/pre>\n<h3>Error Budget<\/h3>\n<pre><code>Error budget = 1 - SLO target\n\nExample: SLO = 99.9% availability\n  Error budget = 0.1% = 43.8 minutes/month\n\nError budget consumption:\n  If we had 10 minutes of downtime this month:\n  Budget remaining = 33.8 minutes\n\nRules:\n  Budget &gt; 50%: Can deploy features aggressively\n  Budget 25-50%: Deploy with caution, increase testing\n  Budget &lt; 25%: Feature freeze, focus on reliability\n  Budget exhausted: Full incident response, post-mortem required\n<\/code><\/pre>\n<h3>Prometheus Alert Rules<\/h3>\n<pre><code class=\"language-yaml\">groups:\n- name: user-service.rules\n  rules:\n  \n  # Latency SLO: 99% of requests &lt; 200ms\n  - alert: HighAPILatency\n    expr: |\n      (1 - sum(rate(http_requests_duration_bucket{le=&quot;0.2&quot;,job=&quot;user-service&quot;}[5m]))\n         / sum(rate(http_requests_duration_count{job=&quot;user-service&quot;}[5m]))\n      ) &gt; 0.01\n    for: 5m\n    labels:\n      severity: warning\n    annotations:\n      summary: &quot;API latency SLO violation&quot;\n      description: &quot;More than 1% of requests taking &gt; 200ms&quot;\n  \n  # Error SLO: &lt; 0.1% error rate\n  - alert: HighErrorRate\n    expr: |\n      sum(rate(http_requests_total{status=~&quot;5..&quot;,job=&quot;user-service&quot;}[5m]))\n      / sum(rate(http_requests_total{job=&quot;user-service&quot;}[5m]))\n      &gt; 0.001\n    for: 2m\n    labels:\n      severity: critical\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 10.3 – SLIs, SLOs, and Error Budgets\n\n### SLI (Service Level Indicator)\n\nA quantitative measure of a service's behavior:\n\n```\nSLI = (good events / total events) × 100%\n\nExamples:\n  Availability SLI = (successful requests / total requests) × 100%\n  Latency SLI = (requests < 200ms / total requests) × 100%\n  Error SLI = (requests without 5xx errors / total requests) × 100%\n```\n\n### SLO (Service Level Objective)\n\nA target value for an SLI:\n\n```\nSLO: 99.9% of requests return a successful response (availability)\nSLO: 99% of requests complete within 200ms (latency)\nSLO: 99.95% of requests complete without server error (error rate)\n```\n\n### Error Budget\n\n```\nError budget = 1 - SLO target\n\nExample: SLO = 99.9% availability\n  Error budget = 0.1% = 43.8 minutes/month\n\nError budget consumption:\n  If we had 10 minutes of downtime this month:\n  Budget remaining = 33.8 minutes\n\nRules:\n  Budget > 50%: Can deploy features aggressively\n  Budget 25-50%: Deploy with caution, increase testing\n  Budget < 25%: Feature freeze, focus on reliability\n  Budget exhausted: Full incident response, post-mortem required\n```\n\n### Prometheus Alert Rules\n\n```yaml\ngroups:\n- name: user-service.rules\n  rules:\n  \n  # Latency SLO: 99% of requests < 200ms\n  - alert: HighAPILatency\n    expr: |\n      (1 - sum(rate(http_requests_duration_bucket{le=\"0.2\",job=\"user-service\"}[5m]))\n         / sum(rate(http_requests_duration_count{job=\"user-service\"}[5m]))\n      ) > 0.01\n    for: 5m\n    labels:\n      severity: warning\n    annotations:\n      summary: \"API latency SLO violation\"\n      description: \"More than 1% of requests taking > 200ms\"\n  \n  # Error SLO: < 0.1% error rate\n  - alert: HighErrorRate\n    expr: |\n      sum(rate(http_requests_total{status=~\"5..\",job=\"user-service\"}[5m]))\n      / sum(rate(http_requests_total{job=\"user-service\"}[5m]))\n      > 0.001\n    for: 2m\n    labels:\n      severity: critical\n```\n\n---\n\n"},{"title":"Chapter 10.4 – Observability Stack for Production","html":"<h2>Chapter 10.4 – Observability Stack for Production<\/h2>\n<h3>The Grafana LGTM Stack<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Component<\/th>\n  <th>Purpose<\/th>\n  <th>OSS Alternative<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><strong>Loki<\/strong><\/td>\n  <td>Log aggregation<\/td>\n  <td>Elasticsearch (ELK)<\/td>\n<\/tr>\n<tr>\n  <td><strong>Grafana<\/strong><\/td>\n  <td>Visualization<\/td>\n  <td>Kibana<\/td>\n<\/tr>\n<tr>\n  <td><strong>Tempo<\/strong><\/td>\n  <td>Distributed tracing<\/td>\n  <td>Jaeger, Zipkin<\/td>\n<\/tr>\n<tr>\n  <td><strong>Mimir<\/strong><\/td>\n  <td>Long-term metrics storage<\/td>\n  <td>Thanos, VictoriaMetrics<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Structured Logging Best Practices<\/h3>\n<pre><code class=\"language-python\">import structlog\nimport logging\n\n# Configure structlog for production\nstructlog.configure(\n    processors=[\n        structlog.contextvars.merge_contextvars,\n        structlog.stdlib.filter_by_level,\n        structlog.stdlib.add_logger_name,\n        structlog.stdlib.add_log_level,\n        structlog.stdlib.PositionalArgumentsFormatter(),\n        structlog.processors.TimeStamper(fmt=&quot;iso&quot;),\n        structlog.processors.StackInfoRenderer(),\n        structlog.processors.format_exc_info,\n        structlog.processors.UnicodeDecoder(),\n        structlog.processors.JSONRenderer(),  # JSON for production\n    ],\n    context_class=dict,\n    logger_factory=structlog.stdlib.LoggerFactory(),\n    wrapper_class=structlog.stdlib.BoundLogger,\n    cache_logger_on_first_use=True,\n)\n\nlogger = structlog.get_logger()\n\n# Usage\nasync def create_order(user_id: int, items: list):\n    log = logger.bind(user_id=user_id, item_count=len(items))\n    \n    log.info(&quot;order_creation_started&quot;)\n    \n    try:\n        order = await order_service.create(user_id, items)\n        log.info(&quot;order_created&quot;, order_id=order.id, total_amount=order.total)\n        return order\n    except InsufficientStockError as e:\n        log.warning(&quot;order_creation_failed&quot;, reason=&quot;insufficient_stock&quot;, \n                   item_id=e.item_id, requested=e.requested, available=e.available)\n        raise\n    except Exception as e:\n        log.exception(&quot;order_creation_error&quot;, error=str(e))\n        raise\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 10.4 – Observability Stack for Production\n\n### The Grafana LGTM Stack\n\n| Component | Purpose | OSS Alternative |\n|---|---|---|\n| **Loki** | Log aggregation | Elasticsearch (ELK) |\n| **Grafana** | Visualization | Kibana |\n| **Tempo** | Distributed tracing | Jaeger, Zipkin |\n| **Mimir** | Long-term metrics storage | Thanos, VictoriaMetrics |\n\n### Structured Logging Best Practices\n\n```python\nimport structlog\nimport logging\n\n# Configure structlog for production\nstructlog.configure(\n    processors=[\n        structlog.contextvars.merge_contextvars,\n        structlog.stdlib.filter_by_level,\n        structlog.stdlib.add_logger_name,\n        structlog.stdlib.add_log_level,\n        structlog.stdlib.PositionalArgumentsFormatter(),\n        structlog.processors.TimeStamper(fmt=\"iso\"),\n        structlog.processors.StackInfoRenderer(),\n        structlog.processors.format_exc_info,\n        structlog.processors.UnicodeDecoder(),\n        structlog.processors.JSONRenderer(),  # JSON for production\n    ],\n    context_class=dict,\n    logger_factory=structlog.stdlib.LoggerFactory(),\n    wrapper_class=structlog.stdlib.BoundLogger,\n    cache_logger_on_first_use=True,\n)\n\nlogger = structlog.get_logger()\n\n# Usage\nasync def create_order(user_id: int, items: list):\n    log = logger.bind(user_id=user_id, item_count=len(items))\n    \n    log.info(\"order_creation_started\")\n    \n    try:\n        order = await order_service.create(user_id, items)\n        log.info(\"order_created\", order_id=order.id, total_amount=order.total)\n        return order\n    except InsufficientStockError as e:\n        log.warning(\"order_creation_failed\", reason=\"insufficient_stock\", \n                   item_id=e.item_id, requested=e.requested, available=e.available)\n        raise\n    except Exception as e:\n        log.exception(\"order_creation_error\", error=str(e))\n        raise\n```\n\n---\n\n"}]},{"id":11,"title":"Security","chapters":[{"title":"Introduction","html":"<h1>PART 11 – SECURITY<\/h1>\n<hr />\n","text":"# PART 11 – SECURITY\n\n---\n\n"},{"title":"Chapter 11.1 – OAuth2 and OIDC Deep Dive","html":"<h2>Chapter 11.1 – OAuth2 and OIDC Deep Dive<\/h2>\n<h3>OAuth2 Flows<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Flow<\/th>\n  <th>Use Case<\/th>\n  <th>Token Endpoint<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Authorization Code + PKCE<\/td>\n  <td>SPA, mobile apps<\/td>\n  <td>Yes<\/td>\n<\/tr>\n<tr>\n  <td>Client Credentials<\/td>\n  <td>Machine-to-machine<\/td>\n  <td>Yes<\/td>\n<\/tr>\n<tr>\n  <td>Device Code<\/td>\n  <td>Smart TV, CLI<\/td>\n  <td>Yes<\/td>\n<\/tr>\n<tr>\n  <td>Implicit<\/td>\n  <td>Deprecated (use PKCE)<\/td>\n  <td>No<\/td>\n<\/tr>\n<tr>\n  <td>Resource Owner Password<\/td>\n  <td>Legacy only<\/td>\n  <td>Yes<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>JWT Anatomy and Security<\/h3>\n<pre><code class=\"language-python\"># JWT structure: header.payload.signature\n\nheader = {\n    &quot;alg&quot;: &quot;RS256&quot;,   # RSA with SHA-256 (prefer over HS256)\n    &quot;typ&quot;: &quot;JWT&quot;,\n    &quot;kid&quot;: &quot;key-id-1&quot;  # Key ID for rotation\n}\n\npayload = {\n    &quot;sub&quot;: &quot;user-123&quot;,           # Subject (user ID)\n    &quot;iss&quot;: &quot;https://auth.myapp.com&quot;,  # Issuer\n    &quot;aud&quot;: &quot;user-service&quot;,       # Audience (which service can accept this)\n    &quot;exp&quot;: 1234567890,           # Expiry time (Unix timestamp)\n    &quot;iat&quot;: 1234567800,           # Issued at\n    &quot;nbf&quot;: 1234567800,           # Not before\n    &quot;jti&quot;: &quot;unique-token-id&quot;,    # JWT ID (for revocation)\n    &quot;roles&quot;: [&quot;user&quot;, &quot;admin&quot;],  # Custom claims\n    &quot;tenant_id&quot;: &quot;tenant-456&quot;,   # Tenant context (multi-tenant)\n}\n<\/code><\/pre>\n<p><strong>JWT Validation (FastAPI + python-jose):<\/strong><\/p>\n<pre><code class=\"language-python\">from jose import JWTError, jwt\nfrom fastapi import HTTPException, Depends, status\nfrom fastapi.security import HTTPBearer\n\nsecurity = HTTPBearer()\n\nclass JWTValidator:\n    def __init__(self, jwks_url: str, audience: str):\n        self.jwks_url = jwks_url\n        self.audience = audience\n        self._jwks_cache = None\n        self._cache_expires = None\n    \n    async def get_jwks(self) -&gt; dict:\n        &quot;&quot;&quot;Cache JWKS with TTL&quot;&quot;&quot;\n        if self._jwks_cache and datetime.utcnow() &lt; self._cache_expires:\n            return self._jwks_cache\n        \n        async with aiohttp.ClientSession() as session:\n            async with session.get(self.jwks_url) as resp:\n                self._jwks_cache = await resp.json()\n                self._cache_expires = datetime.utcnow() + timedelta(hours=1)\n        return self._jwks_cache\n    \n    async def validate(self, token: str) -&gt; dict:\n        try:\n            jwks = await self.get_jwks()\n            header = jwt.get_unverified_header(token)\n            \n            # Find matching key by kid\n            key = next(\n                (k for k in jwks[&quot;keys&quot;] if k[&quot;kid&quot;] == header.get(&quot;kid&quot;)),\n                None\n            )\n            if not key:\n                raise HTTPException(status_code=401, detail=&quot;Invalid token key ID&quot;)\n            \n            payload = jwt.decode(\n                token,\n                key,\n                algorithms=[&quot;RS256&quot;],\n                audience=self.audience,\n                options={&quot;verify_exp&quot;: True, &quot;verify_aud&quot;: True},\n            )\n            return payload\n        except JWTError as e:\n            raise HTTPException(\n                status_code=status.HTTP_401_UNAUTHORIZED,\n                detail=f&quot;Token validation failed: {str(e)}&quot;,\n                headers={&quot;WWW-Authenticate&quot;: &quot;Bearer&quot;},\n            )\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 11.1 – OAuth2 and OIDC Deep Dive\n\n### OAuth2 Flows\n\n| Flow | Use Case | Token Endpoint |\n|---|---|---|\n| Authorization Code + PKCE | SPA, mobile apps | Yes |\n| Client Credentials | Machine-to-machine | Yes |\n| Device Code | Smart TV, CLI | Yes |\n| Implicit | Deprecated (use PKCE) | No |\n| Resource Owner Password | Legacy only | Yes |\n\n### JWT Anatomy and Security\n\n```python\n# JWT structure: header.payload.signature\n\nheader = {\n    \"alg\": \"RS256\",   # RSA with SHA-256 (prefer over HS256)\n    \"typ\": \"JWT\",\n    \"kid\": \"key-id-1\"  # Key ID for rotation\n}\n\npayload = {\n    \"sub\": \"user-123\",           # Subject (user ID)\n    \"iss\": \"https://auth.myapp.com\",  # Issuer\n    \"aud\": \"user-service\",       # Audience (which service can accept this)\n    \"exp\": 1234567890,           # Expiry time (Unix timestamp)\n    \"iat\": 1234567800,           # Issued at\n    \"nbf\": 1234567800,           # Not before\n    \"jti\": \"unique-token-id\",    # JWT ID (for revocation)\n    \"roles\": [\"user\", \"admin\"],  # Custom claims\n    \"tenant_id\": \"tenant-456\",   # Tenant context (multi-tenant)\n}\n```\n\n**JWT Validation (FastAPI + python-jose):**\n```python\nfrom jose import JWTError, jwt\nfrom fastapi import HTTPException, Depends, status\nfrom fastapi.security import HTTPBearer\n\nsecurity = HTTPBearer()\n\nclass JWTValidator:\n    def __init__(self, jwks_url: str, audience: str):\n        self.jwks_url = jwks_url\n        self.audience = audience\n        self._jwks_cache = None\n        self._cache_expires = None\n    \n    async def get_jwks(self) -> dict:\n        \"\"\"Cache JWKS with TTL\"\"\"\n        if self._jwks_cache and datetime.utcnow() < self._cache_expires:\n            return self._jwks_cache\n        \n        async with aiohttp.ClientSession() as session:\n            async with session.get(self.jwks_url) as resp:\n                self._jwks_cache = await resp.json()\n                self._cache_expires = datetime.utcnow() + timedelta(hours=1)\n        return self._jwks_cache\n    \n    async def validate(self, token: str) -> dict:\n        try:\n            jwks = await self.get_jwks()\n            header = jwt.get_unverified_header(token)\n            \n            # Find matching key by kid\n            key = next(\n                (k for k in jwks[\"keys\"] if k[\"kid\"] == header.get(\"kid\")),\n                None\n            )\n            if not key:\n                raise HTTPException(status_code=401, detail=\"Invalid token key ID\")\n            \n            payload = jwt.decode(\n                token,\n                key,\n                algorithms=[\"RS256\"],\n                audience=self.audience,\n                options={\"verify_exp\": True, \"verify_aud\": True},\n            )\n            return payload\n        except JWTError as e:\n            raise HTTPException(\n                status_code=status.HTTP_401_UNAUTHORIZED,\n                detail=f\"Token validation failed: {str(e)}\",\n                headers={\"WWW-Authenticate\": \"Bearer\"},\n            )\n```\n\n---\n\n"},{"title":"Chapter 11.2 – OWASP Top 10 for Backend Engineers","html":"<h2>Chapter 11.2 – OWASP Top 10 for Backend Engineers<\/h2>\n<table>\n<thead>\n<tr>\n  <th>#<\/th>\n  <th>Vulnerability<\/th>\n  <th>Backend Prevention<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>A01<\/td>\n  <td>Broken Access Control<\/td>\n  <td>RBAC, attribute-based access, always authorize server-side<\/td>\n<\/tr>\n<tr>\n  <td>A02<\/td>\n  <td>Cryptographic Failures<\/td>\n  <td>TLS 1.3+, bcrypt/argon2 for passwords, encrypt PII at rest<\/td>\n<\/tr>\n<tr>\n  <td>A03<\/td>\n  <td>Injection (SQL, NoSQL, OS)<\/td>\n  <td>Parameterized queries, ORM usage, input validation<\/td>\n<\/tr>\n<tr>\n  <td>A04<\/td>\n  <td>Insecure Design<\/td>\n  <td>Threat modeling, defense in depth, rate limiting<\/td>\n<\/tr>\n<tr>\n  <td>A05<\/td>\n  <td>Security Misconfiguration<\/td>\n  <td>Infrastructure as Code, security scanning in CI<\/td>\n<\/tr>\n<tr>\n  <td>A06<\/td>\n  <td>Vulnerable Components<\/td>\n  <td><code>pip-audit<\/code>, <code>safety<\/code>, Dependabot, SBOM<\/td>\n<\/tr>\n<tr>\n  <td>A07<\/td>\n  <td>Auth &amp; Session Failures<\/td>\n  <td>MFA, strong password policies, session rotation<\/td>\n<\/tr>\n<tr>\n  <td>A08<\/td>\n  <td>Software Integrity Failures<\/td>\n  <td>Signed images, verified dependencies, artifact signing<\/td>\n<\/tr>\n<tr>\n  <td>A09<\/td>\n  <td>Logging &amp; Monitoring Failures<\/td>\n  <td>Structured logs, SIEM, alerting on auth failures<\/td>\n<\/tr>\n<tr>\n  <td>A10<\/td>\n  <td>SSRF<\/td>\n  <td>Validate URLs, block internal IPs, use allow-lists<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>SQL Injection Prevention (Python)<\/h3>\n<pre><code class=\"language-python\"># WRONG — never do this\nuser_input = &quot;'; DROP TABLE users; --&quot;\nquery = f&quot;SELECT * FROM users WHERE name = '{user_input}'&quot;  # DANGEROUS\n\n# RIGHT — always use parameterized queries\n# SQLAlchemy ORM (automatic)\nusers = await db.execute(select(User).where(User.name == user_input))\n\n# SQLAlchemy Core\nresult = await db.execute(\n    text(&quot;SELECT * FROM users WHERE name = :name&quot;),\n    {&quot;name&quot;: user_input}  # Parameterized — safe\n)\n\n# asyncpg\nawait conn.fetch(&quot;SELECT * FROM users WHERE name = $1&quot;, user_input)\n<\/code><\/pre>\n<h3>SSRF Prevention<\/h3>\n<pre><code class=\"language-python\">import ipaddress\nfrom urllib.parse import urlparse\n\nALLOWED_SCHEMES = {&quot;https&quot;, &quot;http&quot;}\nBLOCKED_HOSTS = {\n    &quot;localhost&quot;, &quot;127.0.0.1&quot;, &quot;0.0.0.0&quot;,\n    &quot;169.254.169.254&quot;,  # AWS metadata endpoint\n    &quot;metadata.google.internal&quot;,  # GCP metadata\n}\n\ndef validate_url(url: str) -&gt; bool:\n    try:\n        parsed = urlparse(url)\n        \n        # Check scheme\n        if parsed.scheme not in ALLOWED_SCHEMES:\n            return False\n        \n        # Check for blocked hosts\n        if parsed.hostname in BLOCKED_HOSTS:\n            return False\n        \n        # Check for private IP ranges\n        try:\n            ip = ipaddress.ip_address(parsed.hostname)\n            if ip.is_private or ip.is_loopback or ip.is_link_local:\n                return False\n        except ValueError:\n            pass  # Not an IP address, hostname DNS resolution happens separately\n        \n        return True\n    except Exception:\n        return False\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 11.2 – OWASP Top 10 for Backend Engineers\n\n| # | Vulnerability | Backend Prevention |\n|---|---|---|\n| A01 | Broken Access Control | RBAC, attribute-based access, always authorize server-side |\n| A02 | Cryptographic Failures | TLS 1.3+, bcrypt/argon2 for passwords, encrypt PII at rest |\n| A03 | Injection (SQL, NoSQL, OS) | Parameterized queries, ORM usage, input validation |\n| A04 | Insecure Design | Threat modeling, defense in depth, rate limiting |\n| A05 | Security Misconfiguration | Infrastructure as Code, security scanning in CI |\n| A06 | Vulnerable Components | `pip-audit`, `safety`, Dependabot, SBOM |\n| A07 | Auth & Session Failures | MFA, strong password policies, session rotation |\n| A08 | Software Integrity Failures | Signed images, verified dependencies, artifact signing |\n| A09 | Logging & Monitoring Failures | Structured logs, SIEM, alerting on auth failures |\n| A10 | SSRF | Validate URLs, block internal IPs, use allow-lists |\n\n### SQL Injection Prevention (Python)\n\n```python\n# WRONG — never do this\nuser_input = \"'; DROP TABLE users; --\"\nquery = f\"SELECT * FROM users WHERE name = '{user_input}'\"  # DANGEROUS\n\n# RIGHT — always use parameterized queries\n# SQLAlchemy ORM (automatic)\nusers = await db.execute(select(User).where(User.name == user_input))\n\n# SQLAlchemy Core\nresult = await db.execute(\n    text(\"SELECT * FROM users WHERE name = :name\"),\n    {\"name\": user_input}  # Parameterized — safe\n)\n\n# asyncpg\nawait conn.fetch(\"SELECT * FROM users WHERE name = $1\", user_input)\n```\n\n### SSRF Prevention\n\n```python\nimport ipaddress\nfrom urllib.parse import urlparse\n\nALLOWED_SCHEMES = {\"https\", \"http\"}\nBLOCKED_HOSTS = {\n    \"localhost\", \"127.0.0.1\", \"0.0.0.0\",\n    \"169.254.169.254\",  # AWS metadata endpoint\n    \"metadata.google.internal\",  # GCP metadata\n}\n\ndef validate_url(url: str) -> bool:\n    try:\n        parsed = urlparse(url)\n        \n        # Check scheme\n        if parsed.scheme not in ALLOWED_SCHEMES:\n            return False\n        \n        # Check for blocked hosts\n        if parsed.hostname in BLOCKED_HOSTS:\n            return False\n        \n        # Check for private IP ranges\n        try:\n            ip = ipaddress.ip_address(parsed.hostname)\n            if ip.is_private or ip.is_loopback or ip.is_link_local:\n                return False\n        except ValueError:\n            pass  # Not an IP address, hostname DNS resolution happens separately\n        \n        return True\n    except Exception:\n        return False\n```\n\n---\n\n"},{"title":"Chapter 11.3 – Secrets Management","html":"<h2>Chapter 11.3 – Secrets Management<\/h2>\n<h3>HashiCorp Vault Integration<\/h3>\n<pre><code class=\"language-python\">import hvac\n\nclass VaultSecretManager:\n    def __init__(self, vault_url: str, role_id: str, secret_id: str):\n        self.client = hvac.Client(url=vault_url)\n        self.client.auth.approle.login(role_id=role_id, secret_id=secret_id)\n    \n    def get_secret(self, path: str) -&gt; dict:\n        response = self.client.secrets.kv.v2.read_secret_version(path=path)\n        return response[&quot;data&quot;][&quot;data&quot;]\n    \n    def get_database_credentials(self, role: str) -&gt; dict:\n        &quot;&quot;&quot;Dynamic database credentials — rotated automatically by Vault&quot;&quot;&quot;\n        response = self.client.secrets.database.generate_credentials(name=role)\n        return {\n            &quot;username&quot;: response[&quot;data&quot;][&quot;username&quot;],\n            &quot;password&quot;: response[&quot;data&quot;][&quot;password&quot;],\n        }\n<\/code><\/pre>\n<h3>Kubernetes Secrets Best Practices<\/h3>\n<pre><code class=\"language-yaml\"># Never store secrets in plain text in Git\n# Use External Secrets Operator instead\n\napiVersion: external-secrets.io/v1beta1\nkind: ExternalSecret\nmetadata:\n  name: database-credentials\nspec:\n  refreshInterval: 1h\n  secretStoreRef:\n    name: vault-backend\n    kind: ClusterSecretStore\n  target:\n    name: database-credentials  # Creates this K8s Secret\n    creationPolicy: Owner\n  data:\n  - secretKey: password\n    remoteRef:\n      key: production/database\n      property: password\n  - secretKey: username\n    remoteRef:\n      key: production/database\n      property: username\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 11.3 – Secrets Management\n\n### HashiCorp Vault Integration\n\n```python\nimport hvac\n\nclass VaultSecretManager:\n    def __init__(self, vault_url: str, role_id: str, secret_id: str):\n        self.client = hvac.Client(url=vault_url)\n        self.client.auth.approle.login(role_id=role_id, secret_id=secret_id)\n    \n    def get_secret(self, path: str) -> dict:\n        response = self.client.secrets.kv.v2.read_secret_version(path=path)\n        return response[\"data\"][\"data\"]\n    \n    def get_database_credentials(self, role: str) -> dict:\n        \"\"\"Dynamic database credentials — rotated automatically by Vault\"\"\"\n        response = self.client.secrets.database.generate_credentials(name=role)\n        return {\n            \"username\": response[\"data\"][\"username\"],\n            \"password\": response[\"data\"][\"password\"],\n        }\n```\n\n### Kubernetes Secrets Best Practices\n\n```yaml\n# Never store secrets in plain text in Git\n# Use External Secrets Operator instead\n\napiVersion: external-secrets.io/v1beta1\nkind: ExternalSecret\nmetadata:\n  name: database-credentials\nspec:\n  refreshInterval: 1h\n  secretStoreRef:\n    name: vault-backend\n    kind: ClusterSecretStore\n  target:\n    name: database-credentials  # Creates this K8s Secret\n    creationPolicy: Owner\n  data:\n  - secretKey: password\n    remoteRef:\n      key: production/database\n      property: password\n  - secretKey: username\n    remoteRef:\n      key: production/database\n      property: username\n```\n\n---\n\n"}]},{"id":12,"title":"Testing Excellence","chapters":[{"title":"Introduction","html":"<h1>PART 12 – TESTING EXCELLENCE<\/h1>\n<hr />\n","text":"# PART 12 – TESTING EXCELLENCE\n\n---\n\n"},{"title":"Chapter 12.1 – The Testing Maturity Model","html":"<h2>Chapter 12.1 – The Testing Maturity Model<\/h2>\n<h3>Level 0: Survival Mode<\/h3>\n<ul>\n<li>No tests<\/li>\n<li>Manual testing before deploy<\/li>\n<li>Bug discovery in production<\/li>\n<\/ul>\n<h3>Level 1: Basic Coverage<\/h3>\n<ul>\n<li>Some unit tests<\/li>\n<li>No integration tests<\/li>\n<li>Testing is an afterthought<\/li>\n<li>CI runs tests but nobody fixes failures<\/li>\n<\/ul>\n<h3>Level 2: Systematic Testing<\/h3>\n<ul>\n<li>Structured unit + integration tests<\/li>\n<li>CI gates merges on test passing<\/li>\n<li>60-70% code coverage<\/li>\n<li>Basic load testing before major releases<\/li>\n<\/ul>\n<h3>Level 3: Test-Driven Development<\/h3>\n<ul>\n<li>TDD for new features<\/li>\n<li>Contract tests between services<\/li>\n<li>80%+ meaningful coverage<\/li>\n<li>Automated performance regression detection<\/li>\n<\/ul>\n<h3>Level 4: Production Confidence<\/h3>\n<ul>\n<li>Chaos engineering in staging<\/li>\n<li>Property-based testing<\/li>\n<li>Consumer-driven contract testing<\/li>\n<li>Canary deployments with automated rollback<\/li>\n<li>Continuous performance testing<\/li>\n<\/ul>\n<p><strong>Target: Level 3 by Month 12, Level 4 by Month 18<\/strong><\/p>\n<hr />\n","text":"## Chapter 12.1 – The Testing Maturity Model\n\n### Level 0: Survival Mode\n- No tests\n- Manual testing before deploy\n- Bug discovery in production\n\n### Level 1: Basic Coverage\n- Some unit tests\n- No integration tests\n- Testing is an afterthought\n- CI runs tests but nobody fixes failures\n\n### Level 2: Systematic Testing\n- Structured unit + integration tests\n- CI gates merges on test passing\n- 60-70% code coverage\n- Basic load testing before major releases\n\n### Level 3: Test-Driven Development\n- TDD for new features\n- Contract tests between services\n- 80%+ meaningful coverage\n- Automated performance regression detection\n\n### Level 4: Production Confidence\n- Chaos engineering in staging\n- Property-based testing\n- Consumer-driven contract testing\n- Canary deployments with automated rollback\n- Continuous performance testing\n\n**Target: Level 3 by Month 12, Level 4 by Month 18**\n\n---\n\n"},{"title":"Chapter 12.2 – Unit Testing in Python","html":"<h2>Chapter 12.2 – Unit Testing in Python<\/h2>\n<h3>pytest Best Practices<\/h3>\n<pre><code class=\"language-python\"># conftest.py — shared fixtures\nimport pytest\nimport asyncio\nfrom unittest.mock import AsyncMock, Mock\nfrom sqlalchemy.ext.asyncio import create_async_engine, AsyncSession\nfrom sqlalchemy.orm import sessionmaker\n\n@pytest.fixture(scope=&quot;session&quot;)\ndef event_loop():\n    &quot;&quot;&quot;Use single event loop for all async tests&quot;&quot;&quot;\n    loop = asyncio.get_event_loop_policy().new_event_loop()\n    yield loop\n    loop.close()\n\n@pytest.fixture\nasync def db_session():\n    &quot;&quot;&quot;In-memory SQLite for fast unit tests&quot;&quot;&quot;\n    engine = create_async_engine(&quot;sqlite+aiosqlite:///:memory:&quot;)\n    async with engine.begin() as conn:\n        await conn.run_sync(Base.metadata.create_all)\n    \n    async_session = sessionmaker(engine, class_=AsyncSession)\n    async with async_session() as session:\n        yield session\n\n@pytest.fixture\ndef mock_email_service():\n    return AsyncMock(spec=EmailService)\n\n# test_user_service.py\nclass TestUserService:\n    async def test_create_user_success(\n        self, \n        db_session: AsyncSession, \n        mock_email_service: AsyncMock\n    ):\n        service = UserService(db=db_session, email_service=mock_email_service)\n        \n        user = await service.create_user(\n            email=&quot;test@example.com&quot;,\n            name=&quot;Test User&quot;,\n            role=&quot;user&quot;\n        )\n        \n        assert user.id is not None\n        assert user.email == &quot;test@example.com&quot;\n        assert user.role == &quot;user&quot;\n        mock_email_service.send_welcome.assert_called_once_with(&quot;test@example.com&quot;)\n    \n    async def test_create_user_duplicate_email(self, db_session, mock_email_service):\n        service = UserService(db=db_session, email_service=mock_email_service)\n        \n        await service.create_user(email=&quot;same@example.com&quot;, name=&quot;First&quot;, role=&quot;user&quot;)\n        \n        with pytest.raises(DuplicateEmailError) as exc_info:\n            await service.create_user(email=&quot;same@example.com&quot;, name=&quot;Second&quot;, role=&quot;user&quot;)\n        \n        assert &quot;same@example.com&quot; in str(exc_info.value)\n    \n    @pytest.mark.parametrize(&quot;invalid_email&quot;, [\n        &quot;not-an-email&quot;,\n        &quot;missing-at-sign.com&quot;,\n        &quot;@no-local-part.com&quot;,\n        &quot;&quot;,\n        None,\n    ])\n    async def test_create_user_invalid_email(self, db_session, invalid_email):\n        service = UserService(db=db_session)\n        \n        with pytest.raises(ValidationError):\n            await service.create_user(email=invalid_email, name=&quot;Test&quot;, role=&quot;user&quot;)\n<\/code><\/pre>\n<h3>Hypothesis: Property-Based Testing<\/h3>\n<pre><code class=\"language-python\">from hypothesis import given, strategies as st, settings\nfrom hypothesis.strategies import composite\n\n@composite\ndef valid_user_data(draw):\n    return {\n        &quot;name&quot;: draw(st.text(min_size=1, max_size=100)),\n        &quot;email&quot;: draw(st.emails()),\n        &quot;role&quot;: draw(st.sampled_from([&quot;admin&quot;, &quot;user&quot;, &quot;viewer&quot;])),\n    }\n\nclass TestUserServiceProperty:\n    @given(user_data=valid_user_data())\n    @settings(max_examples=200)\n    async def test_user_round_trip(self, user_data, db_session):\n        &quot;&quot;&quot;Any valid user data should be storable and retrievable&quot;&quot;&quot;\n        service = UserService(db=db_session)\n        \n        created = await service.create_user(**user_data)\n        retrieved = await service.get_user(created.id)\n        \n        assert retrieved.name == user_data[&quot;name&quot;]\n        assert retrieved.email == user_data[&quot;email&quot;].lower()\n        assert retrieved.role == user_data[&quot;role&quot;]\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 12.2 – Unit Testing in Python\n\n### pytest Best Practices\n\n```python\n# conftest.py — shared fixtures\nimport pytest\nimport asyncio\nfrom unittest.mock import AsyncMock, Mock\nfrom sqlalchemy.ext.asyncio import create_async_engine, AsyncSession\nfrom sqlalchemy.orm import sessionmaker\n\n@pytest.fixture(scope=\"session\")\ndef event_loop():\n    \"\"\"Use single event loop for all async tests\"\"\"\n    loop = asyncio.get_event_loop_policy().new_event_loop()\n    yield loop\n    loop.close()\n\n@pytest.fixture\nasync def db_session():\n    \"\"\"In-memory SQLite for fast unit tests\"\"\"\n    engine = create_async_engine(\"sqlite+aiosqlite:///:memory:\")\n    async with engine.begin() as conn:\n        await conn.run_sync(Base.metadata.create_all)\n    \n    async_session = sessionmaker(engine, class_=AsyncSession)\n    async with async_session() as session:\n        yield session\n\n@pytest.fixture\ndef mock_email_service():\n    return AsyncMock(spec=EmailService)\n\n# test_user_service.py\nclass TestUserService:\n    async def test_create_user_success(\n        self, \n        db_session: AsyncSession, \n        mock_email_service: AsyncMock\n    ):\n        service = UserService(db=db_session, email_service=mock_email_service)\n        \n        user = await service.create_user(\n            email=\"test@example.com\",\n            name=\"Test User\",\n            role=\"user\"\n        )\n        \n        assert user.id is not None\n        assert user.email == \"test@example.com\"\n        assert user.role == \"user\"\n        mock_email_service.send_welcome.assert_called_once_with(\"test@example.com\")\n    \n    async def test_create_user_duplicate_email(self, db_session, mock_email_service):\n        service = UserService(db=db_session, email_service=mock_email_service)\n        \n        await service.create_user(email=\"same@example.com\", name=\"First\", role=\"user\")\n        \n        with pytest.raises(DuplicateEmailError) as exc_info:\n            await service.create_user(email=\"same@example.com\", name=\"Second\", role=\"user\")\n        \n        assert \"same@example.com\" in str(exc_info.value)\n    \n    @pytest.mark.parametrize(\"invalid_email\", [\n        \"not-an-email\",\n        \"missing-at-sign.com\",\n        \"@no-local-part.com\",\n        \"\",\n        None,\n    ])\n    async def test_create_user_invalid_email(self, db_session, invalid_email):\n        service = UserService(db=db_session)\n        \n        with pytest.raises(ValidationError):\n            await service.create_user(email=invalid_email, name=\"Test\", role=\"user\")\n```\n\n### Hypothesis: Property-Based Testing\n\n```python\nfrom hypothesis import given, strategies as st, settings\nfrom hypothesis.strategies import composite\n\n@composite\ndef valid_user_data(draw):\n    return {\n        \"name\": draw(st.text(min_size=1, max_size=100)),\n        \"email\": draw(st.emails()),\n        \"role\": draw(st.sampled_from([\"admin\", \"user\", \"viewer\"])),\n    }\n\nclass TestUserServiceProperty:\n    @given(user_data=valid_user_data())\n    @settings(max_examples=200)\n    async def test_user_round_trip(self, user_data, db_session):\n        \"\"\"Any valid user data should be storable and retrievable\"\"\"\n        service = UserService(db=db_session)\n        \n        created = await service.create_user(**user_data)\n        retrieved = await service.get_user(created.id)\n        \n        assert retrieved.name == user_data[\"name\"]\n        assert retrieved.email == user_data[\"email\"].lower()\n        assert retrieved.role == user_data[\"role\"]\n```\n\n---\n\n"},{"title":"Chapter 12.3 – Integration Testing","html":"<h2>Chapter 12.3 – Integration Testing<\/h2>\n<pre><code class=\"language-python\"># Using TestContainers for real database integration tests\nimport pytest\nfrom testcontainers.postgres import PostgresContainer\nfrom testcontainers.redis import RedisContainer\n\n@pytest.fixture(scope=&quot;session&quot;)\nasync def postgres_container():\n    with PostgresContainer(&quot;postgres:15&quot;) as postgres:\n        yield postgres.get_connection_url().replace(&quot;psycopg2&quot;, &quot;asyncpg&quot;)\n\n@pytest.fixture(scope=&quot;session&quot;)  \nasync def redis_container():\n    with RedisContainer(&quot;redis:7&quot;) as redis:\n        yield f&quot;redis://{redis.get_container_host_ip()}:{redis.get_exposed_port(6379)}&quot;\n\nclass TestUserAPIIntegration:\n    async def test_create_and_get_user(self, async_client, postgres_container):\n        # Create user\n        response = await async_client.post(&quot;/v1/users&quot;, json={\n            &quot;name&quot;: &quot;Integration Test User&quot;,\n            &quot;email&quot;: &quot;integration@test.com&quot;,\n            &quot;role&quot;: &quot;user&quot;\n        })\n        assert response.status_code == 201\n        user_id = response.json()[&quot;id&quot;]\n        \n        # Retrieve user\n        response = await async_client.get(f&quot;/v1/users/{user_id}&quot;)\n        assert response.status_code == 200\n        assert response.json()[&quot;email&quot;] == &quot;integration@test.com&quot;\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 12.3 – Integration Testing\n\n```python\n# Using TestContainers for real database integration tests\nimport pytest\nfrom testcontainers.postgres import PostgresContainer\nfrom testcontainers.redis import RedisContainer\n\n@pytest.fixture(scope=\"session\")\nasync def postgres_container():\n    with PostgresConta
