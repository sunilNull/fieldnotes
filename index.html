sets with that element appended. This enumerates exactly all binary membership choices.","complexity":"O(n·2^n) time and output space.","code":"def solve(nums):\n    out=[[]]\n    for x in nums: out += [s+[x] for s in out]\n    return out","tests":"assert sorted(solve([1,2]))==[[],[1],[1,2],[2]]","models":"","full":"def solve(nums):\n    out=[[]]\n    for x in nums: out += [s+[x] for s in out]\n    return out\n\n# Example and boundary checks\nassert sorted(solve([1,2]))==[[],[1],[1,2],[2]]\nprint(\"Sample checks passed\")\n","canonical":121}},{"id":122,"name":"Combination Sum","difficulty":"Medium","pattern":"With repetition","topic":"Backtracking","lesson":{"description":"Find all distinct combinations of positive distinct candidates adding to target; each candidate may be reused unlimited times.","example":"[2,3,6,7],7 → [[2,2,3],[7]]","hint":"Keep chosen candidate indices nondecreasing.","reason":"Reusing current index permits repetitions; never visiting an earlier index avoids permutations of the same combination. Positive values ensure remaining target decreases.","complexity":"O(c^D·D) loose time bound, D=target/min candidate; O(D+c) auxiliary space excluding results.","code":"def solve(candidates,target):\n    a=sorted(candidates); out=[]; path=[]\n    def dfs(i,t):\n        if t==0: out.append(path[:]); return\n        for j in range(i,len(a)):\n            if a[j]>t: break\n            path.append(a[j]); dfs(j,t-a[j]); path.pop()\n    dfs(0,target); return out","tests":"assert sorted(solve([2,3,6,7],7))==[[2,2,3],[7]]","models":"","full":"def solve(candidates,target):\n    a=sorted(candidates); out=[]; path=[]\n    def dfs(i,t):\n        if t==0: out.append(path[:]); return\n        for j in range(i,len(a)):\n            if a[j]>t: break\n            path.append(a[j]); dfs(j,t-a[j]); path.pop()\n    dfs(0,target); return out\n\n# Example and boundary checks\nassert sorted(solve([2,3,6,7],7))==[[2,2,3],[7]]\nprint(\"Sample checks passed\")\n","canonical":122}},{"id":123,"name":"Permutations","difficulty":"Medium","pattern":"Classic","topic":"Backtracking","lesson":{"description":"Return all permutations of distinct values.","example":"[1,2] → [[1,2],[2,1]]","hint":"Choose one unused element per position.","reason":"A used array prevents repeated indices. When path length reaches n, every element has been placed exactly once; branching covers every possible ordering.","complexity":"O(n·n!) time and output space, O(n) auxiliary space.","code":"def solve(a):\n    out=[]; used=[False]*len(a); path=[]\n    def dfs():\n        if len(path)==len(a): out.append(path[:]); return\n        for i,x in enumerate(a):\n            if not used[i]:\n                used[i]=True; path.append(x); dfs(); path.pop(); used[i]=False\n    dfs(); return out","tests":"assert sorted(solve([1,2]))==[[1,2],[2,1]]","models":"","full":"def solve(a):\n    out=[]; used=[False]*len(a); path=[]\n    def dfs():\n        if len(path)==len(a): out.append(path[:]); return\n        for i,x in enumerate(a):\n            if not used[i]:\n                used[i]=True; path.append(x); dfs(); path.pop(); used[i]=False\n    dfs(); return out\n\n# Example and boundary checks\nassert sorted(solve([1,2]))==[[1,2],[2,1]]\nprint(\"Sample checks passed\")\n","canonical":123}},{"id":124,"name":"Subsets II","difficulty":"Medium","pattern":"Deduplication","topic":"Backtracking","lesson":{"description":"Generate all distinct subsets of an array that may contain duplicate values.","example":"[1,2,2] → [[],[1],[1,2],[1,2,2],[2],[2,2]]","hint":"Sort and skip equal sibling choices.","reason":"Equal candidates at the same recursion depth create identical subset branches; skipping those siblings still allows choosing repeated values at deeper levels.","complexity":"O(n·2^n) time and output space worst case, O(n) auxiliary space.","code":"def solve(nums):\n    a=sorted(nums); out=[]; path=[]\n    def dfs(i):\n        out.append(path[:])\n        for j in range(i,len(a)):\n            if j>i and a[j]==a[j-1]: continue\n            path.append(a[j]); dfs(j+1); path.pop()\n    dfs(0); return out","tests":"assert sorted(solve([1,2,2]))==[[],[1],[1,2],[1,2,2],[2],[2,2]]","models":"","full":"def solve(nums):\n    a=sorted(nums); out=[]; path=[]\n    def dfs(i):\n        out.append(path[:])\n        for j in range(i,len(a)):\n            if j>i and a[j]==a[j-1]: continue\n            path.append(a[j]); dfs(j+1); path.pop()\n    dfs(0); return out\n\n# Example and boundary checks\nassert sorted(solve([1,2,2]))==[[],[1],[1,2],[1,2,2],[2],[2,2]]\nprint(\"Sample checks passed\")\n","canonical":124}},{"id":125,"name":"Combination Sum II","difficulty":"Medium","pattern":"Deduplication","topic":"Backtracking","lesson":{"description":"Return distinct combinations summing to target from positive candidates, using each input index at most once; duplicates may exist.","example":"[10,1,2,7,6,1,5],8 → [[1,1,6],[1,2,5],[1,7],[2,6]]","hint":"Sort, skip sibling duplicates, recurse from j+1.","reason":"Increasing index ensures no reuse; skipping equal siblings removes equivalent branches without excluding multiple copies from distinct indices.","complexity":"O(n·2^n) worst-case time, O(n) auxiliary space excluding output.","code":"def solve(nums,target):\n    a=sorted(nums); out=[]; path=[]\n    def dfs(i,t):\n        if t==0: out.append(path[:]); return\n        for j in range(i,len(a)):\n            if a[j]>t: break\n            if j>i and a[j]==a[j-1]: continue\n            path.append(a[j]); dfs(j+1,t-a[j]); path.pop()\n    dfs(0,target); return out","tests":"assert sorted(solve([10,1,2,7,6,1,5],8))==[[1,1,6],[1,2,5],[1,7],[2,6]]","models":"","full":"def solve(nums,target):\n    a=sorted(nums); out=[]; path=[]\n    def dfs(i,t):\n        if t==0: out.append(path[:]); return\n        for j in range(i,len(a)):\n            if a[j]>t: break\n            if j>i and a[j]==a[j-1]: continue\n            path.append(a[j]); dfs(j+1,t-a[j]); path.pop()\n    dfs(0,target); return out\n\n# Example and boundary checks\nassert sorted(solve([10,1,2,7,6,1,5],8))==[[1,1,6],[1,2,5],[1,7],[2,6]]\nprint(\"Sample checks passed\")\n","canonical":125}},{"id":126,"name":"Permutations II","difficulty":"Medium","pattern":"Deduplication","topic":"Backtracking","lesson":{"description":"Return all unique permutations of values that may repeat.","example":"[1,1,2] → [[1,1,2],[1,2,1],[2,1,1]]","hint":"Branch on distinct remaining values, not individual indices.","reason":"A frequency map removes identical branches by construction. Decrement before recursion and restore afterwards so each permutation uses precisely the original multiplicities.","complexity":"O(n·n!) worst-case time, O(n) auxiliary space excluding output.","code":"from collections import Counter\ndef solve(a):\n    counts=Counter(a); out=[]; path=[]\n    def dfs():\n        if len(path)==len(a): out.append(path[:]); return\n        for x in counts:\n            if counts[x]:\n                counts[x]-=1; path.append(x); dfs(); path.pop(); counts[x]+=1\n    dfs(); return out","tests":"assert sorted(solve([1,1,2]))==[[1,1,2],[1,2,1],[2,1,1]]","models":"","full":"from collections import Counter\ndef solve(a):\n    counts=Counter(a); out=[]; path=[]\n    def dfs():\n        if len(path)==len(a): out.append(path[:]); return\n        for x in counts:\n            if counts[x]:\n                counts[x]-=1; path.append(x); dfs(); path.pop(); counts[x]+=1\n    dfs(); return out\n\n# Example and boundary checks\nassert sorted(solve([1,1,2]))==[[1,1,2],[1,2,1],[2,1,1]]\nprint(\"Sample checks passed\")\n","canonical":126}},{"id":127,"name":"Word Search","difficulty":"Medium","pattern":"Grid backtrack","topic":"Backtracking","lesson":{"description":"Determine whether a word can be formed by orthogonally adjacent grid cells without reusing a cell on one path.","example":"[['A','B'],['C','D']], 'ABD' → True","hint":"Backtrack from each possible starting cell.","reason":"After matching a character, mark its cell unavailable while exploring the next character. Restore it when returning so other candidate paths remain valid.","complexity":"O(mn·3^L) upper bound time for nonempty word length L, O(L) stack.","code":"def solve(g,w):\n    if not w: return True\n    if not g or not g[0]: return False\n    m,n=len(g),len(g[0]); seen=set()\n    def dfs(i,j,k):\n        if not (0<=i<m and 0<=j<n) or (i,j) in seen or g[i][j]!=w[k]: return False\n        if k==len(w)-1: return True\n        seen.add((i,j))\n        ok=any(dfs(x,y,k+1) for x,y in [(i+1,j),(i-1,j),(i,j+1),(i,j-1)])\n        seen.remove((i,j)); return ok\n    return any(dfs(i,j,0) for i in range(m) for j in range(n))","tests":"g=[['A','B'],['C','D']]; assert solve(g,'ABD'); assert not solve(g,'ABA')","models":"","full":"def solve(g,w):\n    if not w: return True\n    if not g or not g[0]: return False\n    m,n=len(g),len(g[0]); seen=set()\n    def dfs(i,j,k):\n        if not (0<=i<m and 0<=j<n) or (i,j) in seen or g[i][j]!=w[k]: return False\n        if k==len(w)-1: return True\n        seen.add((i,j))\n        ok=any(dfs(x,y,k+1) for x,y in [(i+1,j),(i-1,j),(i,j+1),(i,j-1)])\n        seen.remove((i,j)); return ok\n    return any(dfs(i,j,0) for i in range(m) for j in range(n))\n\n# Example and boundary checks\ng=[['A','B'],['C','D']]; assert solve(g,'ABD'); assert not solve(g,'ABA')\nprint(\"Sample checks passed\")\n","canonical":127}},{"id":128,"name":"N-Queens","difficulty":"Hard","pattern":"Constraint check","topic":"Backtracking","lesson":{"description":"Place n queens on an n×n chessboard so no two attack each other; return all boards as strings.","example":"n=4 → 2 boards; one is ['.Q..','...Q','Q...','..Q.']","hint":"Place one queen per row and track columns and diagonals.","reason":"Two cells share diagonals when r-c or r+c match. Reject occupied columns or diagonals, recurse, and restore all three sets.","complexity":"O(n·n!) search upper bound plus O(n²) per solution, O(n) auxiliary space excluding output.","code":"def solve(n):\n    out=[]; cols=set(); d1=set(); d2=set(); path=[]\n    def dfs(r):\n        if r==n: out.append(['.'*c+'Q'+'.'*(n-c-1) for c in path]); return\n        for c in range(n):\n            if c in cols or r-c in d1 or r+c in d2: continue\n            cols.add(c); d1.add(r-c); d2.add(r+c); path.append(c)\n            dfs(r+1); path.pop(); cols.remove(c); d1.remove(r-c); d2.remove(r+c)\n    dfs(0); return out","tests":"assert len(solve(4))==2; assert solve(1)==[['Q']]","models":"","full":"def solve(n):\n    out=[]; cols=set(); d1=set(); d2=set(); path=[]\n    def dfs(r):\n        if r==n: out.append(['.'*c+'Q'+'.'*(n-c-1) for c in path]); return\n        for c in range(n):\n            if c in cols or r-c in d1 or r+c in d2: continue\n            cols.add(c); d1.add(r-c); d2.add(r+c); path.append(c)\n            dfs(r+1); path.pop(); cols.remove(c); d1.remove(r-c); d2.remove(r+c)\n    dfs(0); return out\n\n# Example and boundary checks\nassert len(solve(4))==2; assert solve(1)==[['Q']]\nprint(\"Sample checks passed\")\n","canonical":128}},{"id":129,"name":"Palindrome Partitioning","difficulty":"Medium","pattern":"Memoization","topic":"Backtracking","lesson":{"description":"Partition a string into all lists of palindromic substrings.","example":"'aab' → [['a','a','b'],['aa','b']]","hint":"Precompute which intervals are palindromes, then choose valid cuts.","reason":"The palindrome table answers each candidate cut in constant time; backtracking explores each complete valid partition exactly once.","complexity":"O(n²+n·2^n) time, O(n²) auxiliary space excluding output.","code":"def solve(s):\n    n=len(s); pal=[[False]*n for _ in s]; out=[]; path=[]\n    for i in range(n-1,-1,-1):\n        for j in range(i,n): pal[i][j]=s[i]==s[j] and (j-i<2 or pal[i+1][j-1])\n    def dfs(i):\n        if i==n: out.append(path[:]); return\n        for j in range(i,n):\n            if pal[i][j]: path.append(s[i:j+1]); dfs(j+1); path.pop()\n    dfs(0); return out","tests":"assert sorted(solve('aab'))==[['a','a','b'],['aa','b']]","models":"","full":"def solve(s):\n    n=len(s); pal=[[False]*n for _ in s]; out=[]; path=[]\n    for i in range(n-1,-1,-1):\n        for j in range(i,n): pal[i][j]=s[i]==s[j] and (j-i<2 or pal[i+1][j-1])\n    def dfs(i):\n        if i==n: out.append(path[:]); return\n        for j in range(i,n):\n            if pal[i][j]: path.append(s[i:j+1]); dfs(j+1); path.pop()\n    dfs(0); return out\n\n# Example and boundary checks\nassert sorted(solve('aab'))==[['a','a','b'],['aa','b']]\nprint(\"Sample checks passed\")\n","canonical":129}},{"id":130,"name":"Letter Combinations","difficulty":"Medium","pattern":"Classic","topic":"Backtracking","lesson":{"description":"Return all letter strings represented by a sequence of phone keypad digits 2–9. Empty input gives empty list.","example":"'23' → ['ad','ae','af','bd','be','bf','cd','ce','cf']","hint":"Take the Cartesian product of digit letter groups.","reason":"Each digit contributes exactly one letter; product enumerates every independent choice without duplicates.","complexity":"O(n·4^n) time and output space, O(n) auxiliary space.","code":"from itertools import product\ndef solve(digits):\n    keys={'2':'abc','3':'def','4':'ghi','5':'jkl','6':'mno','7':'pqrs','8':'tuv','9':'wxyz'}\n    return [''.join(p) for p in product(*(keys[d] for d in digits))] if digits else []","tests":"assert solve('23')==['ad','ae','af','bd','be','bf','cd','ce','cf']; assert solve('')==[]","models":"","full":"from itertools import product\ndef solve(digits):\n    keys={'2':'abc','3':'def','4':'ghi','5':'jkl','6':'mno','7':'pqrs','8':'tuv','9':'wxyz'}\n    return [''.join(p) for p in product(*(keys[d] for d in digits))] if digits else []\n\n# Example and boundary checks\nassert solve('23')==['ad','ae','af','bd','be','bf','cd','ce','cf']; assert solve('')==[]\nprint(\"Sample checks passed\")\n","canonical":130}},{"id":131,"name":"LRU Cache","difficulty":"Medium","pattern":"Design","topic":"Additional 20 Problems (Mixed Hard)","lesson":{"description":"Design a capacity-limited LRU cache with get(key) returning value or -1 and put(key,value), evicting least recently used when full.","example":"LRUCache(2); put(1,1); put(2,2); get(1) → 1; put(3,3); get(2) → -1","hint":"Combine hash lookup with recency ordering.","reason":"OrderedDict maintains insertion order and supports constant-time moving a key to the newest end. Reads and writes update recency; evict from the oldest end.","complexity":"O(1) expected get/put, O(capacity) storage.","code":"from collections import OrderedDict\nclass LRUCache:\n    def __init__(self,capacity): self.cap=capacity; self.d=OrderedDict()\n    def get(self,k):\n        if k not in self.d: return -1\n        self.d.move_to_end(k); return self.d[k]\n    def put(self,k,v):\n        self.d[k]=v; self.d.move_to_end(k)\n        if len(self.d)>self.cap: self.d.popitem(last=False)","tests":"x=LRUCache(2); x.put(1,1); x.put(2,2); assert x.get(1)==1; x.put(3,3); assert x.get(2)==-1","models":"","full":"from collections import OrderedDict\nclass LRUCache:\n    def __init__(self,capacity): self.cap=capacity; self.d=OrderedDict()\n    def get(self,k):\n        if k not in self.d: return -1\n        self.d.move_to_end(k); return self.d[k]\n    def put(self,k,v):\n        self.d[k]=v; self.d.move_to_end(k)\n        if len(self.d)>self.cap: self.d.popitem(last=False)\n\n# Example and boundary checks\nx=LRUCache(2); x.put(1,1); x.put(2,2); assert x.get(1)==1; x.put(3,3); assert x.get(2)==-1\nprint(\"Sample checks passed\")\n","canonical":131}},{"id":132,"name":"LFU Cache","difficulty":"Hard","pattern":"Design","topic":"Additional 20 Problems (Mixed Hard)","lesson":{"description":"Design LFU cache with get and put; evict lowest access frequency, breaking ties by least recent use. Updating an existing key counts as access.","example":"LFUCache(2); put(1,1); put(2,2); get(1) → 1; put(3,3); get(2) → -1","hint":"Store keys in recency-ordered frequency buckets and track minimum frequency.","reason":"Touching moves a key from frequency f to f+1; if old minimum empties, new minimum is f+1. New insertions reset minimum to one. Evict oldest in minimum bucket.","complexity":"O(1) expected get/put, O(capacity) storage.","code":"from collections import OrderedDict,defaultdict\nclass LFUCache:\n    def __init__(self,capacity): self.cap=capacity; self.values={}; self.freq={}; self.b=defaultdict(OrderedDict); self.minf=0\n    def touch(self,k):\n        f=self.freq[k]; del self.b[f][k]\n        if not self.b[f]:\n            del self.b[f]\n            if self.minf==f: self.minf=f+1\n        self.freq[k]=f+1; self.b[f+1][k]=None\n    def get(self,k):\n        if k not in self.values: return -1\n        self.touch(k); return self.values[k]\n    def put(self,k,v):\n        if not self.cap: return\n        if k in self.values: self.values[k]=v; self.touch(k); return\n        if len(self.values)==self.cap:\n            old,_=self.b[self.minf].popitem(last=False)\n            if not self.b[self.minf]: del self.b[self.minf]\n            del self.values[old]; del self.freq[old]\n        self.values[k]=v; self.freq[k]=1; self.b[1][k]=None; self.minf=1","tests":"x=LFUCache(2); x.put(1,1); x.put(2,2); assert x.get(1)==1; x.put(3,3); assert x.get(2)==-1; assert x.get(3)==3; x.put(4,4); assert x.get(1)==-1","models":"","full":"from collections import OrderedDict,defaultdict\nclass LFUCache:\n    def __init__(self,capacity): self.cap=capacity; self.values={}; self.freq={}; self.b=defaultdict(OrderedDict); self.minf=0\n    def touch(self,k):\n        f=self.freq[k]; del self.b[f][k]\n        if not self.b[f]:\n            del self.b[f]\n            if self.minf==f: self.minf=f+1\n        self.freq[k]=f+1; self.b[f+1][k]=None\n    def get(self,k):\n        if k not in self.values: return -1\n        self.touch(k); return self.values[k]\n    def put(self,k,v):\n        if not self.cap: return\n        if k in self.values: self.values[k]=v; self.touch(k); return\n        if len(self.values)==self.cap:\n            old,_=self.b[self.minf].popitem(last=False)\n            if not self.b[self.minf]: del self.b[self.minf]\n            del self.values[old]; del self.freq[old]\n        self.values[k]=v; self.freq[k]=1; self.b[1][k]=None; self.minf=1\n\n# Example and boundary checks\nx=LFUCache(2); x.put(1,1); x.put(2,2); assert x.get(1)==1; x.put(3,3); assert x.get(2)==-1; assert x.get(3)==3; x.put(4,4); assert x.get(1)==-1\nprint(\"Sample checks passed\")\n","canonical":132}},{"id":133,"name":"Min Stack","difficulty":"Easy","pattern":"Stack","topic":"Additional 20 Problems (Mixed Hard)","lesson":{"description":"Implement stack push, pop, top and getMin in constant time; nonempty stack for pop/top/min.","example":"push(-2); push(0); push(-3); getMin() → -3; pop(); getMin() → -2","hint":"Store minimum alongside each stack element.","reason":"Each entry remembers minimum of its entire prefix. Popping restores previous minimum automatically, including duplicate minima.","complexity":"O(1) per operation, O(n) storage.","code":"class MinStack:\n    def __init__(self): self.s=[]\n    def push(self,x): self.s.append((x,min(x,self.s[-1][1]) if self.s else x))\n    def pop(self): self.s.pop()\n    def top(self): return self.s[-1][0]\n    def getMin(self): return self.s[-1][1]","tests":"x=MinStack(); x.push(-2); x.push(0); x.push(-3); assert x.getMin()==-3; x.pop(); assert x.getMin()==-2","models":"","full":"class MinStack:\n    def __init__(self): self.s=[]\n    def push(self,x): self.s.append((x,min(x,self.s[-1][1]) if self.s else x))\n    def pop(self): self.s.pop()\n    def top(self): return self.s[-1][0]\n    def getMin(self): return self.s[-1][1]\n\n# Example and boundary checks\nx=MinStack(); x.push(-2); x.push(0); x.push(-3); assert x.getMin()==-3; x.pop(); assert x.getMin()==-2\nprint(\"Sample checks passed\")\n","canonical":133}},{"id":134,"name":"Evaluate Reverse Polish","difficulty":"Medium","pattern":"Stack","topic":"Additional 20 Problems (Mixed Hard)","lesson":{"description":"Evaluate a valid reverse Polish expression with integer tokens and +,-,*,/ operators. Division truncates toward zero.","example":"['4','13','5','/','+'] → 6","hint":"Operands precede operator; pop right before left.","reason":"A stack holds evaluated subexpressions. Every operator consumes its two arguments, pushing the result. Use integer absolute division and sign to avoid float rounding.","complexity":"O(n) arithmetic operations, O(n) space; big integers add bit cost.","code":"def solve(tokens):\n    s=[]\n    for t in tokens:\n        if t not in {'+','-','*','/'}: s.append(int(t)); continue\n        b=s.pop(); a=s.pop()\n        if t=='+': s.append(a+b)\n        elif t=='-': s.append(a-b)\n        elif t=='*': s.append(a*b)\n        else: s.append((abs(a)//abs(b))*(-1 if (a<0)!=(b<0) else 1))\n    return s[0]","tests":"assert solve(['4','13','5','/','+'])==6; assert solve(['-7','3','/'])==-2","models":"","full":"def solve(tokens):\n    s=[]\n    for t in tokens:\n        if t not in {'+','-','*','/'}: s.append(int(t)); continue\n        b=s.pop(); a=s.pop()\n        if t=='+': s.append(a+b)\n        elif t=='-': s.append(a-b)\n        elif t=='*': s.append(a*b)\n        else: s.append((abs(a)//abs(b))*(-1 if (a<0)!=(b<0) else 1))\n    return s[0]\n\n# Example and boundary checks\nassert solve(['4','13','5','/','+'])==6; assert solve(['-7','3','/'])==-2\nprint(\"Sample checks passed\")\n","canonical":134}},{"id":135,"name":"Daily Temperatures","difficulty":"Medium","pattern":"Monotonic Stack","topic":"Additional 20 Problems (Mixed Hard)","lesson":{"description":"For each day's temperature, return days until a strictly warmer temperature, or zero if none.","example":"[73,74,75,71,69,72,76,73] → [1,1,4,2,1,1,0,0]","hint":"Keep unresolved days in a decreasing stack.","reason":"When a warmer day arrives, it resolves all smaller temperatures at stack top. Earlier unresolved days remain waiting; each index enters and leaves once.","complexity":"O(n) time, O(n) auxiliary space.","code":"def solve(t):\n    st=[]; out=[0]*len(t)\n    for i,x in enumerate(t):\n        while st and t[st[-1]]<x:\n            j=st.pop(); out[j]=i-j\n        st.append(i)\n    return out","tests":"assert solve([73,74,75,71,69,72,76,73])==[1,1,4,2,1,1,0,0]","models":"","full":"def solve(t):\n    st=[]; out=[0]*len(t)\n    for i,x in enumerate(t):\n        while st and t[st[-1]]<x:\n            j=st.pop(); out[j]=i-j\n        st.append(i)\n    return out\n\n# Example and boundary checks\nassert solve([73,74,75,71,69,72,76,73])==[1,1,4,2,1,1,0,0]\nprint(\"Sample checks passed\")\n","canonical":135}},{"id":136,"name":"Car Fleet","difficulty":"Medium","pattern":"Monotonic Stack","topic":"Additional 20 Problems (Mixed Hard)","lesson":{"description":"Cars at distinct positions below target travel at positive speeds; a faster car catches and joins the slower fleet ahead. Count fleets reaching target, including catches exactly at target.","example":"target=12, positions=[10,8,0,5,3], speeds=[2,4,1,1,3] → 3","hint":"Process cars nearest target first and compare arrival times.","reason":"A car behind whose free arrival time is no later than the fleet ahead must catch it. Otherwise it creates a new fleet. Compare fractions exactly using cross-products.","complexity":"O(n log n) time, O(n) sorting space.","code":"def solve(target,position,speed):\n    fleets=0; num,den=0,1\n    for p,s in sorted(zip(position,speed),reverse=True):\n        d=target-p\n        if d*den>num*s: fleets+=1; num,den=d,s\n    return fleets","tests":"assert solve(12,[10,8,0,5,3],[2,4,1,1,3])==3","models":"","full":"def solve(target,position,speed):\n    fleets=0; num,den=0,1\n    for p,s in sorted(zip(position,speed),reverse=True):\n        d=target-p\n        if d*den>num*s: fleets+=1; num,den=d,s\n    return fleets\n\n# Example and boundary checks\nassert solve(12,[10,8,0,5,3],[2,4,1,1,3])==3\nprint(\"Sample checks passed\")\n","canonical":136}},{"id":137,"name":"Largest Rectangle in Histogram","difficulty":"Hard","pattern":"Monotonic Stack","topic":"Additional 20 Problems (Mixed Hard)","lesson":{"description":"Find largest rectangular area in a histogram of unit-width nonnegative heights.","example":"[2,1,5,6,2,3] → 10","hint":"Maintain increasing bar indices until a shorter height closes a rectangle.","reason":"When popping a bar, current index is its first shorter boundary on the right and new stack top bounds it on the left (equal heights may be retained). Sentinel zero flushes remaining positive bars.","complexity":"O(n) time, O(n) space.","code":"def solve(h):\n    st=[]; best=0\n    for i,x in enumerate(h+[0]):\n        while st and h[st[-1]]>x:\n            height=h[st.pop()]; left=st[-1] if st else -1\n            best=max(best,height*(i-left-1))\n        st.append(i)\n    return best","tests":"assert solve([2,1,5,6,2,3])==10; assert solve([])==0","models":"","full":"def solve(h):\n    st=[]; best=0\n    for i,x in enumerate(h+[0]):\n        while st and h[st[-1]]>x:\n            height=h[st.pop()]; left=st[-1] if st else -1\n            best=max(best,height*(i-left-1))\n        st.append(i)\n    return best\n\n# Example and boundary checks\nassert solve([2,1,5,6,2,3])==10; assert solve([])==0\nprint(\"Sample checks passed\")\n","canonical":137}},{"id":138,"name":"Sliding Window Maximum","difficulty":"Hard","pattern":"Deque","topic":"Additional 20 Problems (Mixed Hard)","lesson":{"description":"Return maximum value in each contiguous window of length k, 1 ≤ k ≤ n.","example":"[1,3,-1,-3,5,3,6,7],3 → [3,3,5,5,6,7]","hint":"Keep candidate indices in decreasing value order.","reason":"Remove expired indices from the front and dominated values from the back. The front is always the maximum of the current window.","complexity":"O(n) time, O(k) auxiliary space.","code":"from collections import deque\ndef solve(a,k):\n    q=deque(); out=[]\n    for i,x in enumerate(a):\n        while q and q[0]<=i-k: q.popleft()\n        while q and a[q[-1]]<=x: q.pop()\n        q.append(i)\n        if i>=k-1: out.append(a[q[0]])\n    return out","tests":"assert solve([1,3,-1,-3,5,3,6,7],3)==[3,3,5,5,6,7]; assert solve([2,2],1)==[2,2]","models":"","full":"from collections import deque\ndef solve(a,k):\n    q=deque(); out=[]\n    for i,x in enumerate(a):\n        while q and q[0]<=i-k: q.popleft()\n        while q and a[q[-1]]<=x: q.pop()\n        q.append(i)\n        if i>=k-1: out.append(a[q[0]])\n    return out\n\n# Example and boundary checks\nassert solve([1,3,-1,-3,5,3,6,7],3)==[3,3,5,5,6,7]; assert solve([2,2],1)==[2,2]\nprint(\"Sample checks passed\")\n","canonical":37}},{"id":139,"name":"First Missing Positive","difficulty":"Hard","pattern":"Index mapping","topic":"Additional 20 Problems (Mixed Hard)","lesson":{"description":"Find smallest missing positive integer in an unsorted array; O(n) time and constant extra space, may mutate input.","example":"[3,4,-1,1] → 2","hint":"Place each value x in index x-1 if 1≤x≤n.","reason":"Every swap places at least one useful value in its final position; duplicate guard prevents loops. First mismatch reveals smallest missing value, or n+1 if all are placed.","complexity":"O(n) time, O(1) extra space.","code":"def solve(a):\n    n=len(a)\n    for i in range(n):\n        while 1<=a[i]<=n and a[a[i]-1]!=a[i]:\n            j=a[i]-1; a[i],a[j]=a[j],a[i]\n    for i,x in enumerate(a,1):\n        if x!=i: return i\n    return n+1","tests":"assert solve([3,4,-1,1])==2; assert solve([1,1])==2","models":"","full":"def solve(a):\n    n=len(a)\n    for i in range(n):\n        while 1<=a[i]<=n and a[a[i]-1]!=a[i]:\n            j=a[i]-1; a[i],a[j]=a[j],a[i]\n    for i,x in enumerate(a,1):\n        if x!=i: return i\n    return n+1\n\n# Example and boundary checks\nassert solve([3,4,-1,1])==2; assert solve([1,1])==2\nprint(\"Sample checks passed\")\n","canonical":139}},{"id":140,"name":"Merge Intervals","difficulty":"Medium","pattern":"Sorting","topic":"Additional 20 Problems (Mixed Hard)","lesson":{"description":"Merge overlapping closed intervals, including those that touch endpoints.","example":"[[1,3],[2,6],[8,10],[15,18]] → [[1,6],[8,10],[15,18]]","hint":"Sort intervals by start and merge with the last output.","reason":"Sorted starts mean only the last merged interval can overlap the next interval. Extend its end if overlap occurs; otherwise begin a new one.","complexity":"O(n log n) time, O(n) sorting space excluding output.","code":"def solve(intervals):\n    out=[]\n    for a,b in sorted(intervals):\n        if out and a<=out[-1][1]: out[-1][1]=max(out[-1][1],b)\n        else: out.append([a,b])\n    return out","tests":"assert solve([[1,3],[2,6],[8,10],[15,18]])==[[1,6],[8,10],[15,18]]; assert solve([[1,4],[4,5]])==[[1,5]]","models":"","full":"def solve(intervals):\n    out=[]\n    for a,b in sorted(intervals):\n        if out and a<=out[-1][1]: out[-1][1]=max(out[-1][1],b)\n        else: out.append([a,b])\n    return out\n\n# Example and boundary checks\nassert solve([[1,3],[2,6],[8,10],[15,18]])==[[1,6],[8,10],[15,18]]; assert solve([[1,4],[4,5]])==[[1,5]]\nprint(\"Sample checks passed\")\n","canonical":140}},{"id":141,"name":"Insert Interval","difficulty":"Medium","pattern":"Interval","topic":"Additional 20 Problems (Mixed Hard)","lesson":{"description":"Insert a closed interval into sorted disjoint closed intervals and merge overlaps.","example":"[[1,3],[6,9]],[2,5] → [[1,5],[6,9]]","hint":"Handle before, overlapping and after intervals separately.","reason":"Intervals ending before the new start remain unchanged. Merge all touching/overlapping intervals into the new bounds, then append it before the untouched suffix.","complexity":"O(n) time, O(1) auxiliary space excluding output.","code":"def solve(a,new):\n    out=[]; i=0; l,r=new\n    while i<len(a) and a[i][1]<l: out.append(a[i]); i+=1\n    while i<len(a) and a[i][0]<=r:\n        l=min(l,a[i][0]); r=max(r,a[i][1]); i+=1\n    out.append([l,r]); out.extend(a[j] for j in range(i,len(a)))\n    return out","tests":"assert solve([[1,3],[6,9]],[2,5])==[[1,5],[6,9]]; assert solve([],[2,5])==[[2,5]]","models":"","full":"def solve(a,new):\n    out=[]; i=0; l,r=new\n    while i<len(a) and a[i][1]<l: out.append(a[i]); i+=1\n    while i<len(a) and a[i][0]<=r:\n        l=min(l,a[i][0]); r=max(r,a[i][1]); i+=1\n    out.append([l,r]); out.extend(a[j] for j in range(i,len(a)))\n    return out\n\n# Example and boundary checks\nassert solve([[1,3],[6,9]],[2,5])==[[1,5],[6,9]]; assert solve([],[2,5])==[[2,5]]\nprint(\"Sample checks passed\")\n","canonical":141}},{"id":142,"name":"Non-overlapping Intervals","difficulty":"Medium","pattern":"Greedy","topic":"Additional 20 Problems (Mixed Hard)","lesson":{"description":"Remove minimum number of nonempty intervals so remaining intervals do not overlap; touching endpoints are allowed.","example":"[[1,2],[2,3],[3,4],[1,3]] → 1","hint":"Keep the interval finishing earliest.","reason":"An earliest-finishing interval leaves at least as much room as any alternative first choice. Repeating this maximizes kept intervals; remove the rest.","complexity":"O(n log n) time, O(n) sorted copy space.","code":"def solve(intervals):\n    end=-float('inf'); kept=0\n    for a,b in sorted(intervals,key=lambda x:x[1]):\n        if a>=end: kept+=1; end=b\n    return len(intervals)-kept","tests":"assert solve([[1,2],[2,3],[3,4],[1,3]])==1","models":"","full":"def solve(intervals):\n    end=-float('inf'); kept=0\n    for a,b in sorted(intervals,key=lambda x:x[1]):\n        if a>=end: kept+=1; end=b\n    return len(intervals)-kept\n\n# Example and boundary checks\nassert solve([[1,2],[2,3],[3,4],[1,3]])==1\nprint(\"Sample checks passed\")\n","canonical":106}},{"id":143,"name":"Count of Smaller Numbers","difficulty":"Hard","pattern":"Merge sort","topic":"Additional 20 Problems (Mixed Hard)","lesson":{"description":"For each integer, count strictly smaller elements to its right.","example":"[5,2,6,1] → [2,1,1,0]","hint":"Merge sorted halves of original indices, counting right elements moved before a left one.","reason":"During merge, every right element emitted before the current left is smaller and originally later. Add this count to the left index; use <= for left ties to exclude equal values.","complexity":"O(n log n) time, O(n) auxiliary space.","code":"def solve(a):\n    out=[0]*len(a)\n    def sort(ids):\n        if len(ids)<=1: return ids\n        m=len(ids)//2; l=sort(ids[:m]); r=sort(ids[m:]); i=j=0; merged=[]\n        while i<len(l):\n            if j<len(r) and a[r[j]]<a[l[i]]: merged.append(r[j]); j+=1\n            else: out[l[i]]+=j; merged.append(l[i]); i+=1\n        return merged+r[j:]\n    sort(list(range(len(a)))); return out","tests":"assert solve([5,2,6,1])==[2,1,1,0]; assert solve([1,1])==[0,0]","models":"","full":"def solve(a):\n    out=[0]*len(a)\n    def sort(ids):\n        if len(ids)<=1: return ids\n        m=len(ids)//2; l=sort(ids[:m]); r=sort(ids[m:]); i=j=0; merged=[]\n        while i<len(l):\n            if j<len(r) and a[r[j]]<a[l[i]]: merged.append(r[j]); j+=1\n            else: out[l[i]]+=j; merged.append(l[i]); i+=1\n        return merged+r[j:]\n    sort(list(range(len(a)))); return out\n\n# Example and boundary checks\nassert solve([5,2,6,1])==[2,1,1,0]; assert solve([1,1])==[0,0]\nprint(\"Sample checks passed\")\n","canonical":143}},{"id":144,"name":"Reverse Pairs","difficulty":"Hard","pattern":"Merge sort","topic":"Additional 20 Problems (Mixed Hard)","lesson":{"description":"Count pairs of indices i<j such that nums[i] > 2*nums[j], including negative integers.","example":"[1,3,2,3,1] → 2","hint":"Count cross-half pairs before ordinary sorted merge.","reason":"Once halves are sorted, the right values satisfying the inequality form a prefix for each left value. The prefix only grows as left values increase; then merge normally for the parent.","complexity":"O(n log n) time, O(n) space.","code":"from heapq import merge\ndef solve(a):\n    def sort(a):\n        if len(a)<=1: return a,0\n        m=len(a)//2; l,c=sort(a[:m]); r,d=sort(a[m:]); j=0; total=c+d\n        for x in l:\n            while j<len(r) and x>2*r[j]: j+=1\n            total+=j\n        return list(merge(l,r)),total\n    return sort(a)[1]","tests":"assert solve([1,3,2,3,1])==2; assert solve([-5,-5])==1","models":"","full":"from heapq import merge\ndef solve(a):\n    def sort(a):\n        if len(a)<=1: return a,0\n        m=len(a)//2; l,c=sort(a[:m]); r,d=sort(a[m:]); j=0; total=c+d\n        for x in l:\n            while j<len(r) and x>2*r[j]: j+=1\n            total+=j\n        return list(merge(l,r)),total\n    return sort(a)[1]\n\n# Example and boundary checks\nassert solve([1,3,2,3,1])==2; assert solve([-5,-5])==1\nprint(\"Sample checks passed\")\n","canonical":144}},{"id":145,"name":"Longest Increasing Path in Matrix","difficulty":"Hard","pattern":"DFS + memo","topic":"Additional 20 Problems (Mixed Hard)","lesson":{"description":"Find length of longest strictly increasing path in a rectangular integer matrix using orthogonal moves.","example":"[[9,9,4],[6,6,8],[2,1,1]] → 4","hint":"Strict increases form an acyclic dependency graph.","reason":"DFS returns the best increasing path from a cell; each higher neighbor can extend it by one. Memoization computes each cell once. For very deep inputs consider iterative topological DP.","complexity":"O(mn) time and space including recursion.","code":"from functools import lru_cache\ndef solve(a):\n    if not a or not a[0]: return 0\n    m,n=len(a),len(a[0])\n    @lru_cache(None)\n    def f(i,j):\n        return 1+max((f(x,y) for x,y in [(i+1,j),(i-1,j),(i,j+1),(i,j-1)] if 0<=x<m and 0<=y<n and a[x][y]>a[i][j]),default=0)\n    return max(f(i,j) for i in range(m) for j in range(n))","tests":"assert solve([[9,9,4],[6,6,8],[2,1,1]])==4; assert solve([[1]])==1","models":"","full":"from functools import lru_cache\ndef solve(a):\n    if not a or not a[0]: return 0\n    m,n=len(a),len(a[0])\n    @lru_cache(None)\n    def f(i,j):\n        return 1+max((f(x,y) for x,y in [(i+1,j),(i-1,j),(i,j+1),(i,j-1)] if 0<=x<m and 0<=y<n and a[x][y]>a[i][j]),default=0)\n    return max(f(i,j) for i in range(m) for j in range(n))\n\n# Example and boundary checks\nassert solve([[9,9,4],[6,6,8],[2,1,1]])==4; assert solve([[1]])==1\nprint(\"Sample checks passed\")\n","canonical":145}},{"id":146,"name":"Maximal Square","difficulty":"Medium","pattern":"2D DP","topic":"Additional 20 Problems (Mixed Hard)","lesson":{"description":"Find area of largest square containing only '1' characters in a rectangular binary matrix.","example":"[['1','1'],['1','1']] → 4","hint":"The bottom-right cell of a square needs three smaller neighboring squares.","reason":"If a cell is one, square side is one plus minimum of top, left and diagonal sides. Any missing cell in one of these bounds prevents a larger square.","complexity":"O(mn) time, O(n) space.","code":"def solve(a):\n    if not a or not a[0]: return 0\n    dp=[0]*(len(a[0])+1); best=0\n    for row in a:\n        diag=0\n        for j,x in enumerate(row,1):\n            old=dp[j]; dp[j]=1+min(dp[j],dp[j-1],diag) if x=='1' else 0\n            best=max(best,dp[j]); diag=old\n    return best*best","tests":"assert solve([list('11'),list('11')])==4; assert solve([['0']])==0","models":"","full":"def solve(a):\n    if not a or not a[0]: return 0\n    dp=[0]*(len(a[0])+1); best=0\n    for row in a:\n        diag=0\n        for j,x in enumerate(row,1):\n            old=dp[j]; dp[j]=1+min(dp[j],dp[j-1],diag) if x=='1' else 0\n            best=max(best,dp[j]); diag=old\n    return best*best\n\n# Example and boundary checks\nassert solve([list('11'),list('11')])==4; assert solve([['0']])==0\nprint(\"Sample checks passed\")\n","canonical":146}},{"id":147,"name":"Maximal Rectangle","difficulty":"Hard","pattern":"Stack","topic":"Additional 20 Problems (Mixed Hard)","lesson":{"description":"Find area of largest axis-aligned rectangle of '1' characters in a binary matrix.","example":"[['1','0','1'],['1','1','1']] → 3","hint":"Treat each row as bottom edge of a histogram.","reason":"Update consecutive-one heights per column. Any all-one rectangle ends at some row and is represented by a histogram rectangle there. Solve each histogram with a monotonic stack.","complexity":"O(mn) time, O(n) auxiliary space.","code":"def solve(a):\n    if not a or not a[0]: return 0\n    n=len(a[0]); h=[0]*n; best=0\n    for row in a:\n        for j,x in enumerate(row): h[j]=h[j]+1 if x=='1' else 0\n        st=[]\n        for j,x in enumerate(h+[0]):\n            while st and h[st[-1]]>x:\n                y=h[st.pop()]; left=st[-1] if st else -1\n                best=max(best,y*(j-left-1))\n            st.append(j)\n    return best","tests":"assert solve([list('101'),list('111')])==3; assert solve([list('11'),list('11')])==4","models":"","full":"def solve(a):\n    if not a or not a[0]: return 0\n    n=len(a[0]); h=[0]*n; best=0\n    for row in a:\n        for j,x in enumerate(row): h[j]=h[j]+1 if x=='1' else 0\n        st=[]\n        for j,x in enumerate(h+[0]):\n            while st and h[st[-1]]>x:\n                y=h[st.pop()]; left=st[-1] if st else -1\n                best=max(best,y*(j-left-1))\n            st.append(j)\n    return best\n\n# Example and boundary checks\nassert solve([list('101'),list('111')])==3; assert solve([list('11'),list('11')])==4\nprint(\"Sample checks passed\")\n","canonical":147}},{"id":148,"name":"Sudoku Solver","difficulty":"Hard","pattern":"Backtracking","topic":"Additional 20 Problems (Mixed Hard)","lesson":{"description":"Fill a valid 9×9 Sudoku with digits 1–9 so each row, column and 3×3 box has each digit once. '.' is blank; mutate board. Assume a solution exists.","example":"A completed valid board remains unchanged; one blank in an otherwise valid completed row is filled with its missing digit.","hint":"Choose the blank with fewest legal options to prune search.","reason":"Track used digits in row, column and box sets. At each recursion select the most constrained blank, try each legal digit and undo on failure. Exhaustive choices guarantee a solution if one exists.","complexity":"O(9^B·B) loose search bound for B blanks, O(B) stack plus fixed sets.","code":"def solve(g):\n    digits=set('123456789'); rows=[set() for _ in range(9)]; cols=[set() for _ in range(9)]; boxes=[set() for _ in range(9)]; blanks=[]\n    def box(i,j): return i//3*3+j//3\n    for i in range(9):\n        for j in range(9):\n            x=g[i][j]\n            if x=='.': blanks.append((i,j))\n            else: rows[i].add(x); cols[j].add(x); boxes[box(i,j)].add(x)\n    def opts(i,j): return digits-rows[i]-cols[j]-boxes[box(i,j)]\n    def dfs(k):\n        if k==len(blanks): return True\n        p=min(range(k,len(blanks)),key=lambda t:len(opts(*blanks[t])))\n        blanks[k],blanks[p]=blanks[p],blanks[k]; i,j=blanks[k]; b=box(i,j)\n        for x in opts(i,j):\n            g[i][j]=x; rows[i].add(x); cols[j].add(x); boxes[b].add(x)\n            if dfs(k+1): return True\n            g[i][j]='.'; rows[i].remove(x); cols[j].remove(x); boxes[b].remove(x)\n        blanks[k],blanks[p]=blanks[p],blanks[k]; return False\n    dfs(0)","tests":"g=[list('534678912'),list('672195348'),list('198342567'),list('859761423'),list('426853791'),list('713924856'),list('961537284'),list('287419635'),list('345286179')]; g[0][0]='.'; solve(g); assert ''.join(g[0])=='534678912'","models":"","full":"def solve(g):\n    digits=set('123456789'); rows=[set() for _ in range(9)]; cols=[set() for _ in range(9)]; boxes=[set() for _ in range(9)]; blanks=[]\n    def box(i,j): return i//3*3+j//3\n    for i in range(9):\n        for j in range(9):\n            x=g[i][j]\n            if x=='.': blanks.append((i,j))\n            else: rows[i].add(x); cols[j].add(x); boxes[box(i,j)].add(x)\n    def opts(i,j): return digits-rows[i]-cols[j]-boxes[box(i,j)]\n    def dfs(k):\n        if k==len(blanks): return True\n        p=min(range(k,len(blanks)),key=lambda t:len(opts(*blanks[t])))\n        blanks[k],blanks[p]=blanks[p],blanks[k]; i,j=blanks[k]; b=box(i,j)\n        for x in opts(i,j):\n            g[i][j]=x; rows[i].add(x); cols[j].add(x); boxes[b].add(x)\n            if dfs(k+1): return True\n            g[i][j]='.'; rows[i].remove(x); cols[j].remove(x); boxes[b].remove(x)\n        blanks[k],blanks[p]=blanks[p],blanks[k]; return False\n    dfs(0)\n\n# Example and boundary checks\ng=[list('534678912'),list('672195348'),list('198342567'),list('859761423'),list('426853791'),list('713924856'),list('961537284'),list('287419635'),list('345286179')]; g[0][0]='.'; solve(g); assert ''.join(g[0])=='534678912'\nprint(\"Sample checks passed\")\n","canonical":148}},{"id":149,"name":"Couples Holding Hands","difficulty":"Hard","pattern":"Union-Find","topic":"Additional 20 Problems (Mixed Hard)","lesson":{"description":"People 0..2n-1 sit in a row; couples are (0,1),(2,3), etc. Any two people can swap. Find minimum swaps so every adjacent seat pair is a couple.","example":"[0,2,1,3] → 1","hint":"Treat each couple as a vertex and each adjacent seat pair as an edge.","reason":"Every connected component of k couples is a cycle of mismatched pairs (or a self-loop). It needs exactly k-1 swaps to resolve, achievable by fixing one pair per swap. Count successful unions.","complexity":"O(n α(n)) time, O(n) space.","code":"def solve(row):\n    n=len(row)//2; p=list(range(n)); size=[1]*n; swaps=0\n    def find(x):\n        while x!=p[x]: p[x]=p[p[x]]; x=p[x]\n        return x\n    for i in range(0,len(row),2):\n        a,b=find(row[i]//2),find(row[i+1]//2)\n        if a!=b:\n            if size[a]<size[b]: a,b=b,a\n            p[b]=a; size[a]+=size[b]; swaps+=1\n    return swaps","tests":"assert solve([0,2,1,3])==1; assert solve([3,2,0,1])==0","models":"","full":"def solve(row):\n    n=len(row)//2; p=list(range(n)); size=[1]*n; swaps=0\n    def find(x):\n        while x!=p[x]: p[x]=p[p[x]]; x=p[x]\n        return x\n    for i in range(0,len(row),2):\n        a,b=find(row[i]//2),find(row[i+1]//2)\n        if a!=b:\n            if size[a]<size[b]: a,b=b,a\n            p[b]=a; size[a]+=size[b]; swaps+=1\n    return swaps\n\n# Example and boundary checks\nassert solve([0,2,1,3])==1; assert solve([3,2,0,1])==0\nprint(\"Sample checks passed\")\n","canonical":149}},{"id":150,"name":"Minimum Cost to Connect All Points","difficulty":"Medium","pattern":"Prim's algorithm","topic":"Additional 20 Problems (Mixed Hard)","lesson":{"description":"Connect all 2D points with minimum total Manhattan edge cost, with every point reachable from every other.","example":"[[0,0],[2,2],[3,10],[5,2],[7,0]] → 20","hint":"Build a minimum spanning tree using dense Prim.","reason":"Keep each unvisited point's cheapest edge to the growing tree. Add the minimum crossing edge (safe by cut property), then update candidates without storing every pairwise edge.","complexity":"O(n²) time, O(n) space.","code":"def solve(points):\n    n=len(points)\n    if not n: return 0\n    best=[float('inf')]*n; best[0]=0; used=[False]*n; cost=0\n    for _ in range(n):\n        i=min((j for j in range(n) if not used[j]),key=lambda j:best[j])\n        used[i]=True; cost+=best[i]; x,y=points[i]\n        for j,(a,b) in enumerate(points):\n            if not used[j]: best[j]=min(best[j],abs(x-a)+abs(y-b))\n    return cost","tests":"assert solve([[0,0],[2,2],[3,10],[5,2],[7,0]])==20; assert solve([[1,1]])==0","models":"","full":"def solve(points):\n    n=len(points)\n    if not n: return 0\n    best=[float('inf')]*n; best[0]=0; used=[False]*n; cost=0\n    for _ in range(n):\n        i=min((j for j in range(n) if not used[j]),key=lambda j:best[j])\n        used[i]=True; cost+=best[i]; x,y=points[i]\n        for j,(a,b) in enumerate(points):\n            if not used[j]: best[j]=min(best[j],abs(x-a)+abs(y-b))\n    return cost\n\n# Example and boundary checks\nassert solve([[0,0],[2,2],[3,10],[5,2],[7,0]])==20; assert solve([[1,1]])==0\nprint(\"Sample checks passed\")\n","canonical":150}}],"labs":[{"id":1,"title":"Staff-scope opportunity brief","goal":"Find an opportunity beyond your own service.","steps":["Choose a recurring pain affecting at least two teams","gather a baseline from permitted data","interview two stakeholders","write a one-page proposal with options, cost, risk and a 30-day experiment."],"done":"A proposal with an owner, measurable baseline, success criterion and review date; obtain feedback from one stakeholder.","q":"Why does scope matter more than coding volume at Staff level?","a":"Staff leverage is measured by outcomes across people and systems, not just personal output.","template":"Problem / affected teams / baseline / proposed experiment / sponsor / decision requested","scenario":{"case":"Two teams independently maintain retry logic and both report recurring duplicate jobs.","action":"Draft a proposal for shared idempotency guidelines; establish a baseline of duplicate effects and incident time; ask both teams to review the proposed experiment.","accept":"A named decision owner, a measured or explicitly hypothetical baseline, two alternatives, a one-month pilot and a success metric."}},{"id":2,"title":"Pattern recognition bootcamp","goal":"Solve and explain, not memorize.","steps":["Try Two Sum, Valid Parentheses and Longest Substring Without Repeating Characters without hints","write brute force first","state the invariant","improve the solution","test empty input, duplicates and boundaries","revisit after 2 and 7 days."],"done":"Three tested solutions, complexity analysis and a 2-minute explanation for each.","q":"Why is a sliding window not valid for every subarray problem?","a":"A window needs a usable invariant; for example shrinking by sum may fail when negative values exist.","template":"Problem / invariant / brute force / optimized approach / edge cases / time and space","starter":{"title":"Python • tests-first Two Sum","instructions":"Save as two_sum.py; implement the function, run python two_sum.py, then explain the complement invariant.","code":"def two_sum(nums, target):\n    # TODO: Return indices of two distinct elements whose sum is target.\n    raise NotImplementedError\n\nif __name__ == '__main__':\n    for nums, target in [([2,7,11,15],9), ([3,3],6), ([-3,4,3,90],0)]:\n        i,j = two_sum(nums,target)\n        assert i != j and nums[i]+nums[j] == target\n    print('All tests passed')"},"scenario":{"case":"You have 30 minutes to solve an unfamiliar medium problem in an interview.","action":"Open problem 17; solve without hints, then run its sample checks. Explain why the left pointer cannot move backwards. Repeat with a new input such as abba.","accept":"Both examples pass; explanation includes an invariant and time/space costs; record whether you needed a hint."}},{"id":3,"title":"Async service profiling","goal":"Turn Python internals into measurable engineering judgment.","steps":["Create an async worker with 20 tasks","compare blocking time.sleep with asyncio.sleep","cap concurrency using a semaphore","add timeouts and cancellation cleanup","profile CPU and memory with cProfile and tracemalloc."],"done":"Reproducible script and measurements of elapsed time, memory and cancellation behavior.","q":"When does asyncio not improve throughput?","a":"CPU-bound work blocks the event loop unless moved off it; asyncio primarily helps cooperative I/O.","template":"Baseline / bottleneck / hypothesis / changes / benchmark / caveats","starter":{"title":"Python • blocking vs cooperative I/O","instructions":"Save as async_lab.py; run python async_lab.py. Compare both timings, then add a semaphore of size 5 and a per-task deadline.","code":"import asyncio\nimport time\n\nasync def worker(blocking):\n    if blocking:\n        time.sleep(0.1)\n    else:\n        await asyncio.sleep(0.1)\n\nasync def benchmark(blocking):\n    start = time.perf_counter()\n    await asyncio.gather(*(worker(blocking) for _ in range(20)))\n    print(f'{blocking=}: {time.perf_counter()-start:.3f}s')\n\nasync def main():\n    await benchmark(True)\n    await benchmark(False)\n\nasyncio.run(main())"},"scenario":{"case":"Twenty concurrent requests each wait on a mock dependency for 100 ms.","action":"Run the supplied blocking and nonblocking benchmark, then cap concurrency to five. Compare expected batch counts with measured time. Add a timeout and verify cancellation.","accept":"Nonblocking overlap is observable; bounded concurrency produces roughly four batches under ideal conditions; no pending tasks after cancellation."}},{"id":4,"title":"Multi-tenant job API","goal":"Design a reliable service contract.","steps":["Build POST /jobs and GET /jobs/{id} in FastAPI","add tenant-scoped access, cursor pagination for GET /jobs, validation and idempotency keys","simulate transient downstream failure","document retry and timeout policy."],"done":"OpenAPI contract, tests for tenant isolation and duplicate submissions, and an ADR explaining REST versus gRPC.","q":"What makes a retry safe?","a":"The operation must be idempotent or use a durable deduplication mechanism; timeouts do not prove failure.","template":"Contract / error semantics / ownership / retries / versioning / compatibility","scenario":{"case":"Tenant A submits the same job twice while tenant B attempts to read it.","action":"Implement the API contract and a unique database constraint on tenant_id plus idempotency key. Retry the same payload, then retry with a conflicting payload.","accept":"Same key and same payload returns the original job; conflicting payload returns 409; tenant B cannot read A’s job; tests exercise simultaneous submissions."}},{"id":5,"title":"PostgreSQL performance laboratory","goal":"Diagnose a real query instead of guessing.","steps":["Use a disposable local database","create 100k synthetic jobs across tenants","measure a tenant/status/created_at query with EXPLAIN (ANALYZE, BUFFERS)","add a composite index","compare plans","run two transactions to observe locking."],"done":"SQL scripts and before/after plan, actual timings, index trade-offs and lock observation.","q":"Why might a sequential scan be faster than an index scan?","a":"When many rows qualify, random index and heap access can cost more than reading the table sequentially.","template":"Query / baseline plan / proposed index / actual result / write overhead","starter":{"title":"SQL • reproducible index experiment","instructions":"Run only in a disposable local PostgreSQL database. Compare both plans, then change selectivity and explain what happens. EXPLAIN ANALYZE actually executes the query.","code":"CREATE TABLE roadmap_lab_jobs (\n  id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  tenant_id int NOT NULL,\n  status text NOT NULL,\n  created_at timestamptz NOT NULL\n);\nINSERT INTO roadmap_lab_jobs(tenant_id, status, created_at)\nSELECT n % 100, CASE WHEN n % 7 = 0 THEN 'pending' ELSE 'done' END,\n       now() - n * interval '1 second'\nFROM generate_series(1,100000) AS n;\nANALYZE roadmap_lab_jobs;\nEXPLAIN (ANALYZE, BUFFERS)\nSELECT * FROM roadmap_lab_jobs\nWHERE tenant_id = 42 AND status = 'pending'\nORDER BY created_at DESC LIMIT 20;\nCREATE INDEX roadmap_jobs_tenant_status_time\nON roadmap_lab_jobs (tenant_id, status, created_at DESC);\nEXPLAIN (ANALYZE, BUFFERS)\nSELECT * FROM roadmap_lab_jobs\nWHERE tenant_id = 42 AND status = 'pending'\nORDER BY created_at DESC LIMIT 20;\n-- Cleanup in the disposable database:\n-- DROP TABLE roadmap_lab_jobs;"},"scenario":{"case":"A dashboard filters jobs by tenant, status and date; latency rises as data grows.","action":"Load synthetic rows, run ANALYZE, collect EXPLAIN (ANALYZE, BUFFERS), add an index matching the predicates and sort, then repeat for both selective and broad filters.","accept":"Record actual plan nodes, rows, execution time and buffer usage before/after; explain why an index may be ignored for a broad query."}},{"id":6,"title":"Outbox and failure recovery","goal":"Build correctness under partial failure.","steps":["Write an order and an outbox row in one DB transaction","make a worker publish events","inject a crash after publishing but before marking sent","use a unique event key at the consumer","test duplicate delivery and recovery."],"done":"An integration test proving a repeated event does not repeat the business effect; describe remaining failure modes.","q":"Does an outbox guarantee exactly-once external side effects?","a":"No. It makes state and publication intent atomic; consumers and external effects still need idempotency or coordination.","template":"Failure window / invariant / recovery / duplicate behavior / trade-off","starter":{"title":"SQL • outbox schema scaffold","instructions":"Use a disposable PostgreSQL database. Build a poller, simulate duplicate delivery, and ensure the effect and dedupe insert share one transaction. The scaffold does not provide a complete outbox implementation.","code":"CREATE TABLE lab_orders (id uuid PRIMARY KEY, status text NOT NULL);\nCREATE TABLE lab_outbox (\n  event_id uuid PRIMARY KEY,\n  order_id uuid NOT NULL REFERENCES lab_orders(id),\n  payload jsonb NOT NULL,\n  created_at timestamptz NOT NULL DEFAULT now(),\n  sent_at timestamptz\n);\nCREATE TABLE lab_processed_events (event_id uuid PRIMARY KEY);\n-- Producer transaction: insert order + outbox event together.\n-- Worker: publish, then set sent_at; simulate crash in between.\n-- Consumer transaction: INSERT dedupe key ON CONFLICT DO NOTHING\n-- Apply business effect only if key was inserted; commit both.\n-- Test: publish the same event twice; effect must occur once."},"scenario":{"case":"The publisher crashes after an event is delivered but before marking its outbox row sent.","action":"Simulate two deliveries of one event ID. Add a consumer dedupe constraint and ensure the dedupe record and local effect commit together.","accept":"Exactly one committed local business effect, despite two deliveries; roll back a consumer transaction and verify the event can be retried."}},{"id":7,"title":"Design a distributed job scheduler","goal":"Practice Staff-level design around familiar systems.","steps":["Set explicit assumptions for tenants, daily jobs and peak throughput","estimate storage and queue rates","sketch producer, scheduler, workers and state store","explain leases, retries and partitioning","model worker loss","present alternatives in 40 minutes."],"done":"Design doc with capacity math, API, data model, failure analysis, security, observability and a defended trade-off.","q":"What happens if a worker loses its lease while still running?","a":"A second worker may acquire the job; use fencing tokens or idempotent effects to prevent stale writes.","template":"Requirements / estimates / APIs / architecture / failure modes / trade-offs","starter":{"title":"Capacity estimation • working assumptions","instructions":"Use the hypothetical values below as a starting point, not measured production traffic. Recompute for your own anonymized scenario.","code":"Daily jobs = 1,000,000\nAverage enqueue rate = 1,000,000 / 86,400 ≈ 11.6 jobs/s\nAssumed peak multiplier = 10\nPeak rate ≈ 116 jobs/s\nAverage job duration = 2 seconds\nRequired concurrent workers at peak ≈ 232 (before headroom)\nMetadata per job = 2 KB\nRaw metadata per day ≈ 2 GB (before indexes and replication)\n\nExercise: add 30% headroom; calculate 30-day retention.\nThen model failure of one third of workers and a 10-minute backlog.\nState your assumptions; design the queue, leases and retries."},"scenario":{"case":"A scheduler accepts one million jobs/day, with a hypothetical 10× peak and 30-second average processing time.","action":"Calculate average arrivals (about 11.6/s), peak (~116/s) and peak concurrency (~3,472 at steady state, before headroom). Design a lease, fencing token and backpressure policy.","accept":"Capacity estimates have units and assumptions; diagram handles worker death, duplicate execution, overload, lease expiry and stale writes."}},{"id":8,"title":"Cloud architecture cost review","goal":"Connect cloud design to risk and cost.","steps":["Draw an AWS deployment using private subnets, load balancing, managed database and IAM roles","choose RPO/RTO","compare one-region Multi-AZ with cross-region recovery","draft Terraform locally","estimate costs from documented assumptions before deploying."],"done":"Diagram, IAM least-privilege notes, cost estimate and recovery plan; no paid deployment required.","q":"What is the difference between high availability and disaster recovery?","a":"Availability handles failures during normal service; disaster recovery restores service after major disruption against RPO/RTO.","template":"Architecture / traffic / IAM / RPO / RTO / cost assumptions / teardown","scenario":{"case":"An API has a single-region deployment and needs recovery after a database failure.","action":"Define a hypothetical RPO of five minutes and RTO of one hour. Compare managed failover with restore from backups and document what regional failure would require.","accept":"Diagram with network boundaries; cost assumptions; restore drill steps and a teardown plan. No cloud spending required."}},{"id":9,"title":"Kubernetes failure drill","goal":"Operate a workload under controlled failure.","steps":["Deploy a sample API on local kind or Minikube","configure probes, requests and limits","intentionally use a wrong image, failing readiness and too-small memory","use kubectl describe, logs and events","restore each issue and test rolling updates."],"done":"Runbook with commands, symptoms and remedies for three controlled failures; healthy rollout verified.","q":"Why separate readiness and liveness probes?","a":"Readiness gates traffic; liveness restarts unhealthy containers. Treating a downstream outage as liveness can worsen an incident.","template":"Symptom / evidence / hypothesis / command / resolution / prevention","scenario":{"case":"A new deployment has an invalid image tag, then a failing readiness probe.","action":"In a local cluster use kubectl get pods, describe pod, logs and rollout status; fix one cause at a time and verify service endpoints.","accept":"Capture ImagePullBackOff or equivalent event, readiness failure and recovery evidence. Explain why readiness and liveness are not interchangeable."}},{"id":10,"title":"Observability and SLO workshop","goal":"Make reliability measurable.","steps":["Instrument a local API with request duration, count and errors","propagate trace IDs","generate normal and failing traffic","define a success-rate SLI and latency threshold","calculate a sample error budget","write alert and runbook."],"done":"Dashboard screenshot or exported metrics, trace example, SLO definition and alert rationale.","q":"Why alert on symptoms before causes?","a":"User-visible symptoms reflect impact; causal signals are valuable for diagnosis but may not justify paging by themselves.","template":"SLI numerator / denominator / window / objective / budget / response","starter":{"title":"SLO • calculate an error budget","instructions":"Replace these hypothetical counts with metrics from a local test. An error budget is meaningful only with a clearly defined SLI and time window.","code":"# Request-based availability SLI, hypothetical 30-day window\neligible_requests = 100_000\nsuccessful_requests = 99_850\nobjective = 0.999\nallowed_failures = eligible_requests * (1-objective)\nactual_failures = eligible_requests - successful_requests\nprint('SLI:', successful_requests / eligible_requests)\nprint('Allowed failures:', round(allowed_failures))\nprint('Actual failures:', actual_failures)\nprint('Budget consumed:', actual_failures / allowed_failures)\n# What changes if health checks are excluded?"},"scenario":{"case":"Out of 100,000 hypothetical requests, 200 failed; target success SLO is 99.9%.","action":"Compute SLI = 99.8%; allowed failures = 100; actual failures use 200% of the budget. Generate local traffic and build a simple metric query.","accept":"Correct numerator/denominator, window and budget calculation; dashboard shows request count and failures, with an actionable alert and runbook."}},{"id":11,"title":"Tenant isolation threat model","goal":"Find security flaws in a local lab.","steps":["Draw trust boundaries for your API, gateway, database and queue","list threats","test invalid/expired/wrong-audience tokens and cross-tenant reads using synthetic data","check secrets handling and audit logging","fix and retest."],"done":"Threat model and regression tests proving unauthorized access is denied; no real tokens or production data.","q":"Is a valid JWT sufficient for authorization?","a":"No. Verify token claims and enforce resource-specific permission and tenant boundaries.","template":"Asset / attacker assumption / threat / control / test / residual risk","scenario":{"case":"Tenant B has a valid token but supplies tenant A’s job ID.","action":"Create two tenants in a disposable test DB. Try missing, expired, wrong-audience and wrong-tenant credentials. Validate resource authorization independently of identity.","accept":"Unauthorized requests fail according to the chosen API policy, including tenant isolation; tokens and secrets are not exposed in logs."}},{"id":12,"title":"Reliability test suite","goal":"Test behavior across service boundaries.","steps":["Add pytest unit tests for business logic, real PostgreSQL integration tests, consumer/provider contract tests and a small Locust workload","simulate dependency timeout","document test pyramid and CI gating."],"done":"Reproducible tests including duplicate and failure scenarios, load-test p95 and error rate with environment stated.","q":"What can contract tests catch that unit tests cannot?","a":"Compatibility failures between independently evolving consumer and provider expectations.","template":"Risk / test layer / setup / assertion / CI gate / known gap","scenario":{"case":"A dependency times out after a job request may already have been accepted.","action":"Write a unit test for retry classification, an integration test for duplicate submission and a contract test for error response schema. Run a small repeatable load test.","accept":"Tests prove a timeout is not automatically a failed operation; p95 and error rate are reported with workload, hardware and duration."}},{"id":13,"title":"Go worker benchmark","goal":"Learn Go through a backend service.","steps":["Implement a Go HTTP job endpoint and bounded worker pool using context cancellation","write table-driven tests","run go test -race","compare against a comparable Python service under the same local workload."],"done":"Go repo with tests, race-check results and benchmark methodology, not just headline throughput.","q":"Why pass context.Context through Go service calls?","a":"It propagates cancellation and deadlines across request-scoped work.","template":"Interface / concurrency model / cancellation / test / benchmark caveats","scenario":{"case":"A Go job worker receives ten requests but must execute at most three simultaneously.","action":"Use a bounded worker pool, context cancellation and httptest. Track active worker count and run go test -race.","accept":"Peak active count ≤3, cancellation releases resources, race test passes. Report latency distribution under matching test conditions."}},{"id":14,"title":"Replayable event pipeline","goal":"Prove duplicate handling and consumer recovery.","steps":["Use local Kafka with one topic and multiple partitions","choose a key","write producer and consumer","replay messages from an earlier offset","simulate consumer restart","add deduplication and schema evolution tests."],"done":"Demo with ordered processing per key under stated assumptions, replay and duplicate-handling evidence.","q":"Why does Kafka not provide global ordering across partitions?","a":"Each partition has an independent ordered log; cross-partition order is not defined.","template":"Event schema / partition key / offset policy / replay / dedupe / evolution","scenario":{"case":"An event consumer is offline briefly and restarts from an earlier offset.","action":"Publish messages sharing a key, capture offsets, restart the consumer and intentionally replay an event ID. Add a dedupe strategy and schema compatibility check.","accept":"Per-partition order is demonstrated under the stated assumptions; replay does not duplicate committed local effects; offset commit policy is explained."}},{"id":15,"title":"Lead an architecture review","goal":"Multiply the quality of team decisions.","steps":["Draft a short RFC about an actual shared engineering problem","ask colleagues for feedback","run a 30-minute review with alternatives and risks","record decisions and action owners","coach rather than prescribe."],"done":"Decision record and follow-up with at least one piece of peer feedback; use a simulation if no work access.","q":"What is the difference between consensus and a decision?","a":"Consensus is agreement; a decision has an accountable owner, rationale and next steps even when disagreement remains.","template":"Agenda / stakeholders / open questions / decision / owners / follow-up","scenario":{"case":"Two teams disagree on REST versus gRPC for an internal interface.","action":"Facilitate a 30-minute review: context 5 min, options 10 min, objections 10 min, decision 5 min. Ask quieter participants for input and document dissent.","accept":"An RFC, decision owner, trade-offs, action items, review date and one explicit piece of feedback."}},{"id":16,"title":"Speak at three levels","goal":"Practice clear spoken engineering English.","steps":["Record a 60-second explanation of connection pooling","explain it again to a PM and a Staff engineer","replace vague words","state the conclusion first","listen and record again","compare filler words and pauses."],"done":"Three recordings or transcripts and a self-rating for structure, precision and fluency.","q":"What changes when explaining to an executive?","a":"Lead with the decision, impact and risk; omit implementation details unless requested.","template":"Audience / conclusion / evidence / trade-off / ask / self-review","scenario":{"case":"You need to explain a database connection pool to a PM, a junior engineer and a Staff engineer.","action":"Speak for 60 seconds per audience. PM: throughput and failure risk. Junior: reusable connections and limits. Staff: pool saturation, timeout budget and measurement.","accept":"Three recordings or transcripts; conclusion first; one concrete example per audience; compare filler count and clarity after a second take."}},{"id":17,"title":"Write an RFC and ADR","goal":"Produce documents that make decisions reusable.","steps":["Choose API versioning or job delivery semantics","write a one-page RFC with goals, alternatives, rollout and rollback","request review","finalize a short ADR","add a runbook for the highest-risk failure."],"done":"Three linked artifacts; each has an owner, decision or operational action and date.","q":"How does an RFC differ from an ADR?","a":"An RFC invites review before a decision; an ADR records the decision and consequences.","template":"Context / goals / alternatives / decision / rollback / operations","scenario":{"case":"Your team must choose between synchronous job completion and asynchronous acceptance.","action":"Write a one-page RFC with constraints, alternatives and rollout. Write an ADR after deciding. Add a runbook for stuck jobs and a rollback trigger.","accept":"Documents distinguish proposals from decisions, state trade-offs and specify an observable failure threshold."}},{"id":18,"title":"Business impact calculator","goal":"Translate technical work into measurable outcomes.","steps":["Pick a latency, incident or infrastructure-cost problem","identify baseline, affected population and assumptions","estimate impact conservatively","compare implementation and maintenance costs","propose a small measurement experiment."],"done":"One-page ROI memo with explicit assumptions, uncertainty and success/failure thresholds.","q":"Why should you not equate developer hours saved with realized revenue?","a":"Time saved is capacity, not necessarily revenue; conversion needs evidence and context.","template":"Baseline / benefit model / costs / assumptions / sensitivity / decision","starter":{"title":"Business case • sensitivity exercise","instructions":"Example inputs are hypothetical. Replace them with observed values, and distinguish time saved from actual financial savings.","code":"# Conservative, illustrative annual capacity model\nengineers = 6\nminutes_saved_per_week = 40\nworking_weeks = 46\nimplementation_hours = 80\nmaintenance_hours_per_year = 24\nannual_capacity_hours = engineers * minutes_saved_per_week / 60 * working_weeks\nnet_hours_year_one = annual_capacity_hours - implementation_hours - maintenance_hours_per_year\nprint('Estimated capacity released:', annual_capacity_hours)\nprint('Year-one net hours:', net_hours_year_one)\n# Repeat for 20 and 60 minutes saved; report a range."},"scenario":{"case":"Five engineers each spend 30 minutes/week resolving the same operational issue.","action":"Estimate 2.5 hours/week or 120 hours over 48 working weeks. Compare with implementation and maintenance effort; vary adoption by 50%, 75%, 100%.","accept":"Show assumptions, sensitivity and the difference between reclaimed capacity and realized cash savings; propose how to measure actual change."}},{"id":19,"title":"Mock Staff interview","goal":"Build reusable interview evidence.","steps":["Run a 45-minute design interview and a 30-minute coding mock","write STAR stories about ownership, conflict and failure","record spoken answers","score clarity, trade-offs and evidence","schedule a targeted retry."],"done":"Two mock summaries, three STAR stories with truthful quantified evidence and one next-practice target.","q":"What distinguishes a Staff behavioral story?", const defaults=()=>({version:1,start:TODAY(),week:1,day:1,budget:120,checks:{},notes:{},dsa:{},voice:{},scores:{},journal:{},focus:0});let S=defaults(),storageOK=true;try{let x=localStorage.getItem(KEY);if(x)S={...S,...JSON.parse(x)}}catch(e){storageOK=false}let current='home',arg=null,searchTimer;let timer={remain:1500,end:0,running:false};let filter={query:'',difficulty:'All',status:'All'};const $=id=>document.getElementById(id);const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const q=x=>e(JSON.stringify(x));

 labDone=()=>DATA.labs.filter(l=>checked(`lab-${l.id}-done`)).length;const monthForWeek=w=>Math.min(18,Math.floor((w-1)*18/78)+1);const monthData=n=>DATA.months.find(m=>n>=m.start&&n<=m.end)||DATA.months[0];const weekForMonth=n=>Math.min(78,Math.ceil((n-1)*78/18)+1);const moduleMap=[[1,2,3],[2,3,5],[7,15,16],[4,3,17],[6,2,13],[14,10],[9,8],[12,11],[19,2,7],[13,3],[8,9],[19,7],[1,15,17],[7,18,15],[7,18,15],[19,2,7],[19,7],[20,1]];const workday=()=>new Date().getDay();function setWeek(n){S.week=Math.max(1,Math.min(78,Number(n)||1));save();render()}function setDay(n){S.day=Math.max(1,Math.min(90,Number(n)||1));save();render()}function currentWeek(){const d=new Date(S.start+'T00:00:00'),t=new Date(TODAY()+'T00:00:00');return Math.max(1,Math.min(78,Math.floor(Math.round((t-d)/86400000)/7)+1))}function weekRange(){let d=new Date(S.start+'T00:00:00');if(isNaN(d))return '';d.setDate(d.getDate()+(S.week-1)*7);let end=new Date(d);end.setDate(d.getDate()+6);const fmt=x=>x.toLocaleDateString(undefined,{day:'numeric',month:'short'});return fmt(d)+' – '+fmt(end)}function updateSidebar(){if(!$('sidePct'))return;let p=pct(doneMilestones(),totalMilestones());$('sidePct').textContent=p+'%';$('sideBar').style.width=p+'%'}function renderNav(){let groups=[['Plan',nav.slice(0,3)],['Practice',nav.slice(3,6)],['Reflect',nav.slice(6,9)],['Workspace',nav.slice(9)]];$('nav').innerHTML=groups.map(([label,items])=>`<div class="nav-label">${label}</div>${items.map(([id,symbol,title])=>`<button class="nav-btn ${current===id||current.startsWith(id+'-')?'active':''}" onclick="go('${id}')"><span class="symbol">${symbol}</span>${title}</button>`).join('')}`).join('');updateSidebar()}function go(page,a=null){current=page;arg=a;document.getElementById('sidebar').classList.remove('open');render();window.scrollTo(0,0);if(page==='search')$('globalSearch').value=a||'';try{history.replaceState(null,'','#'+page+(a===null?'':':'+encodeURIComponent(JSON.stringify(a))))}catch(e){}}function header(k,title,desc=' lestones(),totalMilestones(),'18-month roadmap')}${stat('DSA practice',dsaDone()+'/'+DATA.problems.length,dsaDone(),DATA.problems.length,'Source problem entries')}${stat('Voice lab',voiceDone()+'/90',voiceDone(),90,'Days of active English')}${stat('Practical labs',labDone()+'/20',labDone(),20,'Evidence-producing projects')}</div><div class="grid2"><section class="panel emphasis"><div class="between"><div class="eyebrow" style="margin:0">TODAY'S WORK</div><span class="tag dark">${S.budget} min / day</span></div><h2 style="margin-top:13px">Make today count.</h2><p class="muted">Suggested sessions for your selected roadmap week. Complete what fits your energy and work schedule.</p>${check(key+'technical',`Technical deep work · ${tech} min`,l.title+' — produce a small artifact or test.')}${dsaMin?check(key+'dsa',`DSA practice · ${dsaMin} min`,problem.name+' — solve, narrate and test.'):''}${check(key+'voice',`English speaking · ${voice} min`,'Day '+S.day+': '+v.theme)}${check(key+'review','Reflection & evidence · 15 min','Write one insight, one result, and the next action.')}<div class="flex spaced">${button('Open practice lab →','labs-detail',l.id,'primary')}${button('Start English drill','voice')}${dsaMin?button('Open DSA exercise','dsa-problem',problem.id):''}${button('Log evidence','journal')}</div></section><section class="panel"><div class="between"><span class="eyebrow" style="margin:0">CURRENT CHAPTER OF LIFE</span><span class="tag">MONTH ${m}</span></div><h2 style="margin-top:13px">${e(mo.title)}</h2><div class="week-nav"><button class="small" aria-label="Previous week" onclick="setWeek(S.week-1)">←</button><b>Week ${S.week} / 78</b><button class="small" aria-label="Next week" onclick="setWeek(S.week+1)">→</button></div><p class="tiny">${e(weekRange())}</p>${bar(S.week,78)}<p class="muted">Recommended modules</p><div class="flex">${moduleMap[m-1].map(moduleButton).join('')}</div><div class="divider"></div><div class="between"><span class="tiny">MONTH DELIVERABL function reader(kind,a){let c,m,i,key,back,next,prev;if(kind==='voice'){i=a;c=DATA.comm[i];key='commread-'+i;back=button('← Communication library','library');next=i<DATA.comm.length-1?button('Next section →','library-voice',i+1):'';prev=i>0?button('← Previous','library-voice',i-1):''}else{[m,i]=a;let mod=DATA.modules.find(x=>x.id===m);c=mod.chapters[i];key='read-'+m+'-'+i;back=button('← '+mod.title,'library-module',m);next=i<mod.chapters.length-1?button('Next section →','library-read',[m,i+1]):'';prev=i>0?button('← Previous','library-read',[m,i-1]):''}return `<div class="reader"><div class="between">${back}<span class="tag">ORIGINAL SOURCE</span></div><div class="article spaced">${c.html}</div><div class="panel spaced"><label class="label" for="chapterNote">Your recall / notes / questions</label><textarea id="chapterNote" oninput="note(${q(key)},this.value)" placeholder="Close the source and explain what you remember.">${e(S.notes[key]||'')}</textarea>${check(key,'Mark this section as read')}</div><div class="between spaced"><div>${prev}</div>${next}</div></div>`}
