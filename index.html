iner(\"postgres:15\") as postgres:\n        yield postgres.get_connection_url().replace(\"psycopg2\", \"asyncpg\")\n\n@pytest.fixture(scope=\"session\")  \nasync def redis_container():\n    with RedisContainer(\"redis:7\") as redis:\n        yield f\"redis://{redis.get_container_host_ip()}:{redis.get_exposed_port(6379)}\"\n\nclass TestUserAPIIntegration:\n    async def test_create_and_get_user(self, async_client, postgres_container):\n        # Create user\n        response = await async_client.post(\"/v1/users\", json={\n            \"name\": \"Integration Test User\",\n            \"email\": \"integration@test.com\",\n            \"role\": \"user\"\n        })\n        assert response.status_code == 201\n        user_id = response.json()[\"id\"]\n        \n        # Retrieve user\n        response = await async_client.get(f\"/v1/users/{user_id}\")\n        assert response.status_code == 200\n        assert response.json()[\"email\"] == \"integration@test.com\"\n```\n\n---\n\n"},{"title":"Chapter 12.4 – Contract Testing with Pact","html":"<h2>Chapter 12.4 – Contract Testing with Pact<\/h2>\n<pre><code class=\"language-python\"># Consumer-driven contract tests\n# Ensures services fulfill their contracts even when deployed independently\n\n# Provider (user-service) side:\nimport pytest\nfrom pact import Verifier\n\ndef test_provider_contracts():\n    verifier = Verifier(\n        provider=&quot;user-service&quot;,\n        provider_base_url=&quot;http://localhost:8080&quot;\n    )\n    \n    output, _ = verifier.verify_with_broker(\n        broker_url=&quot;http://pact-broker:9292&quot;,\n        provider_states_setup_url=&quot;http://localhost:8080/_pact/setup&quot;,\n        publish_verification_results=True,\n        provider_version=&quot;1.2.3&quot;,\n    )\n    \n    assert output == 0, &quot;Pact contract verification failed&quot;\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 12.4 – Contract Testing with Pact\n\n```python\n# Consumer-driven contract tests\n# Ensures services fulfill their contracts even when deployed independently\n\n# Provider (user-service) side:\nimport pytest\nfrom pact import Verifier\n\ndef test_provider_contracts():\n    verifier = Verifier(\n        provider=\"user-service\",\n        provider_base_url=\"http://localhost:8080\"\n    )\n    \n    output, _ = verifier.verify_with_broker(\n        broker_url=\"http://pact-broker:9292\",\n        provider_states_setup_url=\"http://localhost:8080/_pact/setup\",\n        publish_verification_results=True,\n        provider_version=\"1.2.3\",\n    )\n    \n    assert output == 0, \"Pact contract verification failed\"\n```\n\n---\n\n"},{"title":"Chapter 12.5 – Load Testing with Locust","html":"<h2>Chapter 12.5 – Load Testing with Locust<\/h2>\n<pre><code class=\"language-python\">from locust import HttpUser, task, between, events\nimport random\n\nclass UserServiceUser(HttpUser):\n    wait_time = between(0.5, 2)\n    \n    def on_start(self):\n        &quot;&quot;&quot;Authenticate before running tasks&quot;&quot;&quot;\n        response = self.client.post(&quot;/auth/token&quot;, json={\n            &quot;client_id&quot;: &quot;test-client&quot;,\n            &quot;client_secret&quot;: &quot;test-secret&quot;,\n        })\n        self.token = response.json()[&quot;access_token&quot;]\n        self.client.headers.update({&quot;Authorization&quot;: f&quot;Bearer {self.token}&quot;})\n    \n    @task(3)  # Weight 3 — runs 3x more than weight 1 tasks\n    def get_user_profile(self):\n        user_id = random.randint(1, 10000)\n        with self.client.get(f&quot;/v1/users/{user_id}&quot;, catch_response=True) as response:\n            if response.status_code == 404:\n                response.success()  # 404 is acceptable for random IDs\n            elif response.elapsed.total_seconds() &gt; 0.5:\n                response.failure(f&quot;Response too slow: {response.elapsed.total_seconds():.2f}s&quot;)\n    \n    @task(1)\n    def list_users(self):\n        self.client.get(&quot;/v1/users?limit=20&quot;)\n    \n    @task(1)\n    def create_user(self):\n        self.client.post(&quot;/v1/users&quot;, json={\n            &quot;name&quot;: f&quot;Load Test User {random.randint(1, 1000000)}&quot;,\n            &quot;email&quot;: f&quot;loadtest_{random.randint(1, 1000000)}@test.com&quot;,\n            &quot;role&quot;: &quot;user&quot;,\n        })\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 12.5 – Load Testing with Locust\n\n```python\nfrom locust import HttpUser, task, between, events\nimport random\n\nclass UserServiceUser(HttpUser):\n    wait_time = between(0.5, 2)\n    \n    def on_start(self):\n        \"\"\"Authenticate before running tasks\"\"\"\n        response = self.client.post(\"/auth/token\", json={\n            \"client_id\": \"test-client\",\n            \"client_secret\": \"test-secret\",\n        })\n        self.token = response.json()[\"access_token\"]\n        self.client.headers.update({\"Authorization\": f\"Bearer {self.token}\"})\n    \n    @task(3)  # Weight 3 — runs 3x more than weight 1 tasks\n    def get_user_profile(self):\n        user_id = random.randint(1, 10000)\n        with self.client.get(f\"/v1/users/{user_id}\", catch_response=True) as response:\n            if response.status_code == 404:\n                response.success()  # 404 is acceptable for random IDs\n            elif response.elapsed.total_seconds() > 0.5:\n                response.failure(f\"Response too slow: {response.elapsed.total_seconds():.2f}s\")\n    \n    @task(1)\n    def list_users(self):\n        self.client.get(\"/v1/users?limit=20\")\n    \n    @task(1)\n    def create_user(self):\n        self.client.post(\"/v1/users\", json={\n            \"name\": f\"Load Test User {random.randint(1, 1000000)}\",\n            \"email\": f\"loadtest_{random.randint(1, 1000000)}@test.com\",\n            \"role\": \"user\",\n        })\n```\n\n---\n\n"}]},{"id":13,"title":"Go Roadmap","chapters":[{"title":"Introduction","html":"<h1>PART 13 – GO ROADMAP<\/h1>\n<hr />\n","text":"# PART 13 – GO ROADMAP\n\n---\n\n"},{"title":"Chapter 13.1 – Why Go for a Python Backend Engineer","html":"<h2>Chapter 13.1 – Why Go for a Python Backend Engineer<\/h2>\n<p>Go complements Python perfectly for a Backend Architect:<\/p>\n<ul>\n<li>Python: rapid development, ML/data, scripting, async I/O<\/li>\n<li>Go: high-performance services, network tools, CLI tools, gRPC servers<\/li>\n<\/ul>\n<p>Many Platform Engineering / Infrastructure roles require Go proficiency. Kubernetes, Docker, etcd, Prometheus, Terraform — all written in Go.<\/p>\n<h3>Go vs Python for Backend<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Dimension<\/th>\n  <th>Python<\/th>\n  <th>Go<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Startup time<\/td>\n  <td>~100-500ms<\/td>\n  <td>~1-10ms<\/td>\n<\/tr>\n<tr>\n  <td>Memory footprint<\/td>\n  <td>~50-200MB<\/td>\n  <td>~5-20MB<\/td>\n<\/tr>\n<tr>\n  <td>Throughput<\/td>\n  <td>High (with async)<\/td>\n  <td>Very high (native concurrency)<\/td>\n<\/tr>\n<tr>\n  <td>Concurrency model<\/td>\n  <td>asyncio (cooperative)<\/td>\n  <td>Goroutines (lightweight threads)<\/td>\n<\/tr>\n<tr>\n  <td>Type system<\/td>\n  <td>Optional, dynamic<\/td>\n  <td>Static, strong<\/td>\n<\/tr>\n<tr>\n  <td>Compilation<\/td>\n  <td>Interpreted<\/td>\n  <td>Compiled (fast)<\/td>\n<\/tr>\n<tr>\n  <td>Deployment<\/td>\n  <td>Runtime required<\/td>\n  <td>Single binary<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n","text":"## Chapter 13.1 – Why Go for a Python Backend Engineer\n\nGo complements Python perfectly for a Backend Architect:\n- Python: rapid development, ML/data, scripting, async I/O\n- Go: high-performance services, network tools, CLI tools, gRPC servers\n\nMany Platform Engineering / Infrastructure roles require Go proficiency. Kubernetes, Docker, etcd, Prometheus, Terraform — all written in Go.\n\n### Go vs Python for Backend\n\n| Dimension | Python | Go |\n|---|---|---|\n| Startup time | ~100-500ms | ~1-10ms |\n| Memory footprint | ~50-200MB | ~5-20MB |\n| Throughput | High (with async) | Very high (native concurrency) |\n| Concurrency model | asyncio (cooperative) | Goroutines (lightweight threads) |\n| Type system | Optional, dynamic | Static, strong |\n| Compilation | Interpreted | Compiled (fast) |\n| Deployment | Runtime required | Single binary |\n\n---\n\n"},{"title":"Chapter 13.2 – Go Language Fundamentals","html":"<h2>Chapter 13.2 – Go Language Fundamentals<\/h2>\n<h3>Goroutines and Channels<\/h3>\n<pre><code class=\"language-go\">package main\n\nimport (\n    &quot;fmt&quot;\n    &quot;sync&quot;\n    &quot;time&quot;\n)\n\n// Fan-out pattern: distribute work across workers\nfunc fanOut(jobs &lt;-chan int, numWorkers int) &lt;-chan int {\n    results := make(chan int, numWorkers)\n    var wg sync.WaitGroup\n    \n    for i := 0; i &lt; numWorkers; i++ {\n        wg.Add(1)\n        go func(workerID int) {\n            defer wg.Done()\n            for job := range jobs {\n                result := process(job)\n                results &lt;- result\n            }\n        }(i)\n    }\n    \n    go func() {\n        wg.Wait()\n        close(results)\n    }()\n    \n    return results\n}\n\n// Context-based cancellation\nfunc fetchWithTimeout(ctx context.Context, url string) ([]byte, error) {\n    ctx, cancel := context.WithTimeout(ctx, 5*time.Second)\n    defer cancel()\n    \n    req, err := http.NewRequestWithContext(ctx, &quot;GET&quot;, url, nil)\n    if err != nil {\n        return nil, err\n    }\n    \n    resp, err := http.DefaultClient.Do(req)\n    if err != nil {\n        return nil, fmt.Errorf(&quot;fetch failed: %w&quot;, err)\n    }\n    defer resp.Body.Close()\n    \n    return io.ReadAll(resp.Body)\n}\n<\/code><\/pre>\n<h3>Go Interfaces<\/h3>\n<pre><code class=\"language-go\">// Define behavior through interfaces\ntype UserRepository interface {\n    Get(ctx context.Context, id int64) (*User, error)\n    Save(ctx context.Context, user *User) error\n    ListByTenant(ctx context.Context, tenantID int64) ([]*User, error)\n}\n\n// PostgreSQL implementation\ntype PostgresUserRepository struct {\n    db *pgxpool.Pool\n}\n\nfunc (r *PostgresUserRepository) Get(ctx context.Context, id int64) (*User, error) {\n    row := r.db.QueryRow(ctx, \n        &quot;SELECT id, name, email, tenant_id FROM users WHERE id = $1&quot;, id)\n    \n    var u User\n    err := row.Scan(&amp;u.ID, &amp;u.Name, &amp;u.Email, &amp;u.TenantID)\n    if errors.Is(err, pgx.ErrNoRows) {\n        return nil, ErrNotFound\n    }\n    return &amp;u, err\n}\n\n// Cached implementation — same interface, added behavior\ntype CachedUserRepository struct {\n    repo  UserRepository\n    cache *redis.Client\n}\n\nfunc (r *CachedUserRepository) Get(ctx context.Context, id int64) (*User, error) {\n    key := fmt.Sprintf(&quot;user:%d&quot;, id)\n    \n    cached, err := r.cache.Get(ctx, key).Bytes()\n    if err == nil {\n        var user User\n        json.Unmarshal(cached, &amp;user)\n        return &amp;user, nil\n    }\n    \n    user, err := r.repo.Get(ctx, id)\n    if err != nil {\n        return nil, err\n    }\n    \n    data, _ := json.Marshal(user)\n    r.cache.SetEx(ctx, key, data, 5*time.Minute)\n    \n    return user, nil\n}\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 13.2 – Go Language Fundamentals\n\n### Goroutines and Channels\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"sync\"\n    \"time\"\n)\n\n// Fan-out pattern: distribute work across workers\nfunc fanOut(jobs <-chan int, numWorkers int) <-chan int {\n    results := make(chan int, numWorkers)\n    var wg sync.WaitGroup\n    \n    for i := 0; i < numWorkers; i++ {\n        wg.Add(1)\n        go func(workerID int) {\n            defer wg.Done()\n            for job := range jobs {\n                result := process(job)\n                results <- result\n            }\n        }(i)\n    }\n    \n    go func() {\n        wg.Wait()\n        close(results)\n    }()\n    \n    return results\n}\n\n// Context-based cancellation\nfunc fetchWithTimeout(ctx context.Context, url string) ([]byte, error) {\n    ctx, cancel := context.WithTimeout(ctx, 5*time.Second)\n    defer cancel()\n    \n    req, err := http.NewRequestWithContext(ctx, \"GET\", url, nil)\n    if err != nil {\n        return nil, err\n    }\n    \n    resp, err := http.DefaultClient.Do(req)\n    if err != nil {\n        return nil, fmt.Errorf(\"fetch failed: %w\", err)\n    }\n    defer resp.Body.Close()\n    \n    return io.ReadAll(resp.Body)\n}\n```\n\n### Go Interfaces\n\n```go\n// Define behavior through interfaces\ntype UserRepository interface {\n    Get(ctx context.Context, id int64) (*User, error)\n    Save(ctx context.Context, user *User) error\n    ListByTenant(ctx context.Context, tenantID int64) ([]*User, error)\n}\n\n// PostgreSQL implementation\ntype PostgresUserRepository struct {\n    db *pgxpool.Pool\n}\n\nfunc (r *PostgresUserRepository) Get(ctx context.Context, id int64) (*User, error) {\n    row := r.db.QueryRow(ctx, \n        \"SELECT id, name, email, tenant_id FROM users WHERE id = $1\", id)\n    \n    var u User\n    err := row.Scan(&u.ID, &u.Name, &u.Email, &u.TenantID)\n    if errors.Is(err, pgx.ErrNoRows) {\n        return nil, ErrNotFound\n    }\n    return &u, err\n}\n\n// Cached implementation — same interface, added behavior\ntype CachedUserRepository struct {\n    repo  UserRepository\n    cache *redis.Client\n}\n\nfunc (r *CachedUserRepository) Get(ctx context.Context, id int64) (*User, error) {\n    key := fmt.Sprintf(\"user:%d\", id)\n    \n    cached, err := r.cache.Get(ctx, key).Bytes()\n    if err == nil {\n        var user User\n        json.Unmarshal(cached, &user)\n        return &user, nil\n    }\n    \n    user, err := r.repo.Get(ctx, id)\n    if err != nil {\n        return nil, err\n    }\n    \n    data, _ := json.Marshal(user)\n    r.cache.SetEx(ctx, key, data, 5*time.Minute)\n    \n    return user, nil\n}\n```\n\n---\n\n"},{"title":"Chapter 13.3 – gRPC in Go","html":"<h2>Chapter 13.3 – gRPC in Go<\/h2>\n<pre><code class=\"language-go\">// user.proto generated code usage\npackage main\n\nimport (\n    &quot;google.golang.org/grpc&quot;\n    &quot;google.golang.org/grpc/codes&quot;\n    &quot;google.golang.org/grpc/status&quot;\n    pb &quot;myapp/gen/user/v1&quot;\n)\n\ntype UserServiceServer struct {\n    pb.UnimplementedUserServiceServer\n    repo UserRepository\n}\n\nfunc (s *UserServiceServer) GetUser(\n    ctx context.Context, \n    req *pb.GetUserRequest,\n) (*pb.UserResponse, error) {\n    user, err := s.repo.Get(ctx, req.UserId)\n    if errors.Is(err, ErrNotFound) {\n        return nil, status.Errorf(codes.NotFound, &quot;user %d not found&quot;, req.UserId)\n    }\n    if err != nil {\n        return nil, status.Errorf(codes.Internal, &quot;failed to get user: %v&quot;, err)\n    }\n    \n    return &amp;pb.UserResponse{\n        Id:    user.ID,\n        Name:  user.Name,\n        Email: user.Email,\n    }, nil\n}\n\nfunc main() {\n    lis, _ := net.Listen(&quot;tcp&quot;, &quot;:50051&quot;)\n    \n    server := grpc.NewServer(\n        grpc.UnaryInterceptor(\n            grpc_middleware.ChainUnaryServer(\n                grpc_recovery.UnaryServerInterceptor(),\n                grpc_zap.UnaryServerInterceptor(logger),\n                grpc_prometheus.UnaryServerInterceptor,\n            ),\n        ),\n    )\n    \n    pb.RegisterUserServiceServer(server, &amp;UserServiceServer{repo: repo})\n    reflection.Register(server)\n    \n    server.Serve(lis)\n}\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 13.3 – gRPC in Go\n\n```go\n// user.proto generated code usage\npackage main\n\nimport (\n    \"google.golang.org/grpc\"\n    \"google.golang.org/grpc/codes\"\n    \"google.golang.org/grpc/status\"\n    pb \"myapp/gen/user/v1\"\n)\n\ntype UserServiceServer struct {\n    pb.UnimplementedUserServiceServer\n    repo UserRepository\n}\n\nfunc (s *UserServiceServer) GetUser(\n    ctx context.Context, \n    req *pb.GetUserRequest,\n) (*pb.UserResponse, error) {\n    user, err := s.repo.Get(ctx, req.UserId)\n    if errors.Is(err, ErrNotFound) {\n        return nil, status.Errorf(codes.NotFound, \"user %d not found\", req.UserId)\n    }\n    if err != nil {\n        return nil, status.Errorf(codes.Internal, \"failed to get user: %v\", err)\n    }\n    \n    return &pb.UserResponse{\n        Id:    user.ID,\n        Name:  user.Name,\n        Email: user.Email,\n    }, nil\n}\n\nfunc main() {\n    lis, _ := net.Listen(\"tcp\", \":50051\")\n    \n    server := grpc.NewServer(\n        grpc.UnaryInterceptor(\n            grpc_middleware.ChainUnaryServer(\n                grpc_recovery.UnaryServerInterceptor(),\n                grpc_zap.UnaryServerInterceptor(logger),\n                grpc_prometheus.UnaryServerInterceptor,\n            ),\n        ),\n    )\n    \n    pb.RegisterUserServiceServer(server, &UserServiceServer{repo: repo})\n    reflection.Register(server)\n    \n    server.Serve(lis)\n}\n```\n\n---\n\n"},{"title":"Chapter 13.4 – Go Learning Roadmap","html":"<h2>Chapter 13.4 – Go Learning Roadmap<\/h2>\n<h3>12-Week Go Backend Curriculum<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Week<\/th>\n  <th>Topic<\/th>\n  <th>Project<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>1-2<\/td>\n  <td>Syntax, types, functions, interfaces<\/td>\n  <td>Build a CLI tool<\/td>\n<\/tr>\n<tr>\n  <td>3-4<\/td>\n  <td>Goroutines, channels, sync primitives<\/td>\n  <td>Build a concurrent web scraper<\/td>\n<\/tr>\n<tr>\n  <td>5-6<\/td>\n  <td>HTTP server, net/http, middleware<\/td>\n  <td>Build a REST API<\/td>\n<\/tr>\n<tr>\n  <td>7-8<\/td>\n  <td>gRPC, Protobuf, grpc-go<\/td>\n  <td>Build a gRPC user service<\/td>\n<\/tr>\n<tr>\n  <td>9-10<\/td>\n  <td>Testing, benchmarking<\/td>\n  <td>80%+ test coverage on REST API<\/td>\n<\/tr>\n<tr>\n  <td>11-12<\/td>\n  <td>Performance tuning, pprof, tracing<\/td>\n  <td>Profile and optimize gRPC service<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Books<\/h3>\n<ol>\n<li><em>The Go Programming Language<\/em> — Donovan &amp; Kernighan — Classic foundation<\/li>\n<li><em>Learning Go<\/em> — Jon Bodner — More modern, idiomatic<\/li>\n<li><em>100 Go Mistakes and How to Avoid Them<\/em> — Teiva Harsanyi — Essential for production<\/li>\n<li><em>Cloud Native Go<\/em> — Matthew A. Titmus — K8s operator development<\/li>\n<\/ol>\n<hr />\n","text":"## Chapter 13.4 – Go Learning Roadmap\n\n### 12-Week Go Backend Curriculum\n\n| Week | Topic | Project |\n|---|---|---|\n| 1-2 | Syntax, types, functions, interfaces | Build a CLI tool |\n| 3-4 | Goroutines, channels, sync primitives | Build a concurrent web scraper |\n| 5-6 | HTTP server, net/http, middleware | Build a REST API |\n| 7-8 | gRPC, Protobuf, grpc-go | Build a gRPC user service |\n| 9-10 | Testing, benchmarking | 80%+ test coverage on REST API |\n| 11-12 | Performance tuning, pprof, tracing | Profile and optimize gRPC service |\n\n### Books\n\n1. *The Go Programming Language* — Donovan & Kernighan — Classic foundation\n2. *Learning Go* — Jon Bodner — More modern, idiomatic\n3. *100 Go Mistakes and How to Avoid Them* — Teiva Harsanyi — Essential for production\n4. *Cloud Native Go* — Matthew A. Titmus — K8s operator development\n\n---\n\n"}]},{"id":14,"title":"Kafka & Event Streaming","chapters":[{"title":"Introduction","html":"<h1>PART 14 – KAFKA &amp; EVENT STREAMING<\/h1>\n<hr />\n","text":"# PART 14 – KAFKA & EVENT STREAMING\n\n---\n\n"},{"title":"Chapter 14.1 – Kafka Architecture Deep Dive","html":"<h2>Chapter 14.1 – Kafka Architecture Deep Dive<\/h2>\n<h3>Core Concepts<\/h3>\n<pre><code>Topics: Named stream of events (like database tables)\nPartitions: Ordered, immutable log. Each topic has N partitions.\nOffsets: Sequential ID for each message within a partition.\nBrokers: Servers that store and serve partitions.\nProducers: Write messages to topics.\nConsumers: Read messages from topics.\nConsumer Groups: Set of consumers sharing work across partitions.\nReplication: Each partition has 1 leader + N followers.\n<\/code><\/pre>\n<h3>Partition Design<\/h3>\n<pre><code>Rule of thumb:\n  Partitions per topic = max consumers in consumer group\n  (Each partition is consumed by exactly 1 consumer in a group)\n\nFor user-events topic serving 10 consumer instances:\n  → 10 partitions minimum\n  → Partition key: user_id (ensures all events for a user go to same partition)\n  → Ordering is guaranteed within a partition\n\nThroughput:\n  Each partition can handle ~10-100MB/s read + write\n  50 partitions × 100MB/s = 5GB/s max throughput\n<\/code><\/pre>\n<h3>Producer Best Practices<\/h3>\n<pre><code class=\"language-python\">from confluent_kafka import Producer, KafkaException\nimport json\n\nclass KafkaEventProducer:\n    def __init__(self, bootstrap_servers: str):\n        self.producer = Producer({\n            'bootstrap.servers': bootstrap_servers,\n            'acks': 'all',              # Wait for all in-sync replicas\n            'retries': 5,               # Retry on transient failures\n            'retry.backoff.ms': 100,\n            'enable.idempotence': True, # Exactly-once semantics\n            'max.in.flight.requests.per.connection': 5,\n            'compression.type': 'snappy',  # Reduce network + disk usage\n            'batch.size': 65536,        # 64KB batch size\n            'linger.ms': 5,             # Wait up to 5ms to batch messages\n        })\n    \n    async def publish_event(\n        self,\n        topic: str,\n        event: dict,\n        key: str | None = None,\n    ) -&gt; None:\n        def delivery_callback(err, msg):\n            if err:\n                logger.error(&quot;Delivery failed&quot;, topic=topic, error=str(err))\n            else:\n                logger.debug(&quot;Delivered&quot;, topic=topic, partition=msg.partition(),\n                           offset=msg.offset())\n        \n        self.producer.produce(\n            topic=topic,\n            key=key.encode() if key else None,\n            value=json.dumps(event).encode(),\n            on_delivery=delivery_callback,\n        )\n        self.producer.poll(0)  # Trigger callbacks without blocking\n    \n    async def flush(self, timeout: float = 30.0):\n        remaining = self.producer.flush(timeout=timeout)\n        if remaining &gt; 0:\n            raise RuntimeError(f&quot;{remaining} messages not delivered after {timeout}s&quot;)\n<\/code><\/pre>\n<h3>Consumer Best Practices<\/h3>\n<pre><code class=\"language-python\">from confluent_kafka import Consumer, KafkaError\nimport asyncio\n\nclass KafkaEventConsumer:\n    def __init__(self, bootstrap_servers: str, group_id: str, topics: list[str]):\n        self.consumer = Consumer({\n            'bootstrap.servers': bootstrap_servers,\n            'group.id': group_id,\n            'auto.offset.reset': 'earliest',\n            'enable.auto.commit': False,  # Manual commit for at-least-once\n            'max.poll.interval.ms': 300000,  # 5 min processing time limit\n            'session.timeout.ms': 45000,\n            'heartbeat.interval.ms': 3000,\n        })\n        self.consumer.subscribe(topics)\n    \n    async def consume_loop(self, handler):\n        try:\n            while True:\n                msg = self.consumer.poll(timeout=1.0)\n                \n                if msg is None:\n                    continue\n                \n                if msg.error():\n                    if msg.error().code() == KafkaError._PARTITION_EOF:\n                        continue\n                    raise KafkaException(msg.error())\n                \n                event = json.loads(msg.value().decode())\n                \n                try:\n                    await handler(event)\n                    # Only commit after successful processing\n                    self.consumer.commit(message=msg, asynchronous=False)\n                except Exception as e:\n                    logger.error(&quot;Event processing failed&quot;, \n                               event_key=msg.key(), error=str(e))\n                    # Don't commit — message will be redelivered\n                    # Send to Dead Letter Queue after N retries\n                    await self.handle_failed_event(msg, e)\n        finally:\n            self.consumer.close()\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 14.1 – Kafka Architecture Deep Dive\n\n### Core Concepts\n\n```\nTopics: Named stream of events (like database tables)\nPartitions: Ordered, immutable log. Each topic has N partitions.\nOffsets: Sequential ID for each message within a partition.\nBrokers: Servers that store and serve partitions.\nProducers: Write messages to topics.\nConsumers: Read messages from topics.\nConsumer Groups: Set of consumers sharing work across partitions.\nReplication: Each partition has 1 leader + N followers.\n```\n\n### Partition Design\n\n```\nRule of thumb:\n  Partitions per topic = max consumers in consumer group\n  (Each partition is consumed by exactly 1 consumer in a group)\n\nFor user-events topic serving 10 consumer instances:\n  → 10 partitions minimum\n  → Partition key: user_id (ensures all events for a user go to same partition)\n  → Ordering is guaranteed within a partition\n\nThroughput:\n  Each partition can handle ~10-100MB/s read + write\n  50 partitions × 100MB/s = 5GB/s max throughput\n```\n\n### Producer Best Practices\n\n```python\nfrom confluent_kafka import Producer, KafkaException\nimport json\n\nclass KafkaEventProducer:\n    def __init__(self, bootstrap_servers: str):\n        self.producer = Producer({\n            'bootstrap.servers': bootstrap_servers,\n            'acks': 'all',              # Wait for all in-sync replicas\n            'retries': 5,               # Retry on transient failures\n            'retry.backoff.ms': 100,\n            'enable.idempotence': True, # Exactly-once semantics\n            'max.in.flight.requests.per.connection': 5,\n            'compression.type': 'snappy',  # Reduce network + disk usage\n            'batch.size': 65536,        # 64KB batch size\n            'linger.ms': 5,             # Wait up to 5ms to batch messages\n        })\n    \n    async def publish_event(\n        self,\n        topic: str,\n        event: dict,\n        key: str | None = None,\n    ) -> None:\n        def delivery_callback(err, msg):\n            if err:\n                logger.error(\"Delivery failed\", topic=topic, error=str(err))\n            else:\n                logger.debug(\"Delivered\", topic=topic, partition=msg.partition(),\n                           offset=msg.offset())\n        \n        self.producer.produce(\n            topic=topic,\n            key=key.encode() if key else None,\n            value=json.dumps(event).encode(),\n            on_delivery=delivery_callback,\n        )\n        self.producer.poll(0)  # Trigger callbacks without blocking\n    \n    async def flush(self, timeout: float = 30.0):\n        remaining = self.producer.flush(timeout=timeout)\n        if remaining > 0:\n            raise RuntimeError(f\"{remaining} messages not delivered after {timeout}s\")\n```\n\n### Consumer Best Practices\n\n```python\nfrom confluent_kafka import Consumer, KafkaError\nimport asyncio\n\nclass KafkaEventConsumer:\n    def __init__(self, bootstrap_servers: str, group_id: str, topics: list[str]):\n        self.consumer = Consumer({\n            'bootstrap.servers': bootstrap_servers,\n            'group.id': group_id,\n            'auto.offset.reset': 'earliest',\n            'enable.auto.commit': False,  # Manual commit for at-least-once\n            'max.poll.interval.ms': 300000,  # 5 min processing time limit\n            'session.timeout.ms': 45000,\n            'heartbeat.interval.ms': 3000,\n        })\n        self.consumer.subscribe(topics)\n    \n    async def consume_loop(self, handler):\n        try:\n            while True:\n                msg = self.consumer.poll(timeout=1.0)\n                \n                if msg is None:\n                    continue\n                \n                if msg.error():\n                    if msg.error().code() == KafkaError._PARTITION_EOF:\n                        continue\n                    raise KafkaException(msg.error())\n                \n                event = json.loads(msg.value().decode())\n                \n                try:\n                    await handler(event)\n                    # Only commit after successful processing\n                    self.consumer.commit(message=msg, asynchronous=False)\n                except Exception as e:\n                    logger.error(\"Event processing failed\", \n                               event_key=msg.key(), error=str(e))\n                    # Don't commit — message will be redelivered\n                    # Send to Dead Letter Queue after N retries\n                    await self.handle_failed_event(msg, e)\n        finally:\n            self.consumer.close()\n```\n\n---\n\n"},{"title":"Chapter 14.2 – Kafka Schema Registry","html":"<h2>Chapter 14.2 – Kafka Schema Registry<\/h2>\n<pre><code class=\"language-python\">from confluent_kafka.schema_registry import SchemaRegistryClient\nfrom confluent_kafka.schema_registry.avro import AvroSerializer, AvroDeserializer\n\nschema_registry_client = SchemaRegistryClient({&quot;url&quot;: &quot;http://schema-registry:8081&quot;})\n\n# Avro schema for user events\nuser_event_schema = &quot;&quot;&quot;\n{\n  &quot;type&quot;: &quot;record&quot;,\n  &quot;name&quot;: &quot;UserEvent&quot;,\n  &quot;namespace&quot;: &quot;com.mycompany.events&quot;,\n  &quot;fields&quot;: [\n    {&quot;name&quot;: &quot;event_id&quot;, &quot;type&quot;: &quot;string&quot;},\n    {&quot;name&quot;: &quot;user_id&quot;, &quot;type&quot;: &quot;long&quot;},\n    {&quot;name&quot;: &quot;event_type&quot;, &quot;type&quot;: {\n      &quot;type&quot;: &quot;enum&quot;,\n      &quot;name&quot;: &quot;EventType&quot;,\n      &quot;symbols&quot;: [&quot;USER_CREATED&quot;, &quot;USER_UPDATED&quot;, &quot;USER_DELETED&quot;]\n    }},\n    {&quot;name&quot;: &quot;timestamp&quot;, &quot;type&quot;: &quot;long&quot;, &quot;logicalType&quot;: &quot;timestamp-millis&quot;},\n    {&quot;name&quot;: &quot;payload&quot;, &quot;type&quot;: &quot;string&quot;}\n  ]\n}\n&quot;&quot;&quot;\n\n# Serializer with schema registry (schema versioned and validated)\navro_serializer = AvroSerializer(\n    schema_registry_client=schema_registry_client,\n    schema_str=user_event_schema,\n)\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 14.2 – Kafka Schema Registry\n\n```python\nfrom confluent_kafka.schema_registry import SchemaRegistryClient\nfrom confluent_kafka.schema_registry.avro import AvroSerializer, AvroDeserializer\n\nschema_registry_client = SchemaRegistryClient({\"url\": \"http://schema-registry:8081\"})\n\n# Avro schema for user events\nuser_event_schema = \"\"\"\n{\n  \"type\": \"record\",\n  \"name\": \"UserEvent\",\n  \"namespace\": \"com.mycompany.events\",\n  \"fields\": [\n    {\"name\": \"event_id\", \"type\": \"string\"},\n    {\"name\": \"user_id\", \"type\": \"long\"},\n    {\"name\": \"event_type\", \"type\": {\n      \"type\": \"enum\",\n      \"name\": \"EventType\",\n      \"symbols\": [\"USER_CREATED\", \"USER_UPDATED\", \"USER_DELETED\"]\n    }},\n    {\"name\": \"timestamp\", \"type\": \"long\", \"logicalType\": \"timestamp-millis\"},\n    {\"name\": \"payload\", \"type\": \"string\"}\n  ]\n}\n\"\"\"\n\n# Serializer with schema registry (schema versioned and validated)\navro_serializer = AvroSerializer(\n    schema_registry_client=schema_registry_client,\n    schema_str=user_event_schema,\n)\n```\n\n---\n\n"},{"title":"Chapter 14.3 – Event Sourcing and CQRS with Kafka","html":"<h2>Chapter 14.3 – Event Sourcing and CQRS with Kafka<\/h2>\n<h3>Event Sourcing Pattern<\/h3>\n<pre><code>Traditional: Store current state (UPDATE users SET name = 'Alice')\n\nEvent Sourcing: Store events that led to current state\n  event_1: UserCreated {id: 1, name: &quot;Alice&quot;}\n  event_2: UserEmailChanged {id: 1, email: &quot;alice@example.com&quot;}\n  event_3: UserRoleChanged {id: 1, role: &quot;admin&quot;}\n  \nCurrent state = replay of all events for user 1\n<\/code><\/pre>\n<p><strong>Benefits:<\/strong><\/p>\n<ul>\n<li>Complete audit log (every change is permanent)<\/li>\n<li>Time travel (what was the state at any point in time?)<\/li>\n<li>CQRS — separate read models built from events<\/li>\n<\/ul>\n<h3>CDC (Change Data Capture) with Debezium<\/h3>\n<pre><code class=\"language-yaml\"># Debezium PostgreSQL connector\napiVersion: kafka.strimzi.io/v1beta2\nkind: KafkaConnector\nmetadata:\n  name: postgres-connector\nspec:\n  class: io.debezium.connector.postgresql.PostgresConnector\n  config:\n    database.hostname: postgres\n    database.port: 5432\n    database.user: debezium\n    database.password: secret\n    database.dbname: myapp\n    database.server.name: myapp\n    table.include.list: &quot;public.users,public.orders&quot;\n    plugin.name: pgoutput\n    topic.prefix: cdc\n    # Output: cdc.public.users topic receives all changes\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 14.3 – Event Sourcing and CQRS with Kafka\n\n### Event Sourcing Pattern\n\n```\nTraditional: Store current state (UPDATE users SET name = 'Alice')\n\nEvent Sourcing: Store events that led to current state\n  event_1: UserCreated {id: 1, name: \"Alice\"}\n  event_2: UserEmailChanged {id: 1, email: \"alice@example.com\"}\n  event_3: UserRoleChanged {id: 1, role: \"admin\"}\n  \nCurrent state = replay of all events for user 1\n```\n\n**Benefits:**\n- Complete audit log (every change is permanent)\n- Time travel (what was the state at any point in time?)\n- CQRS — separate read models built from events\n\n### CDC (Change Data Capture) with Debezium\n\n```yaml\n# Debezium PostgreSQL connector\napiVersion: kafka.strimzi.io/v1beta2\nkind: KafkaConnector\nmetadata:\n  name: postgres-connector\nspec:\n  class: io.debezium.connector.postgresql.PostgresConnector\n  config:\n    database.hostname: postgres\n    database.port: 5432\n    database.user: debezium\n    database.password: secret\n    database.dbname: myapp\n    database.server.name: myapp\n    table.include.list: \"public.users,public.orders\"\n    plugin.name: pgoutput\n    topic.prefix: cdc\n    # Output: cdc.public.users topic receives all changes\n```\n\n---\n\n"},{"title":"Chapter 14.4 – Hands-On Kafka Projects","html":"<h2>Chapter 14.4 – Hands-On Kafka Projects<\/h2>\n<p><strong>Project 1: Order Processing Pipeline<\/strong><\/p>\n<pre><code>Order Service → Kafka (order.created) → \n  Inventory Service (reserve stock)\n  Payment Service (charge card)\n  Notification Service (send confirmation)\n<\/code><\/pre>\n<p><strong>Project 2: Real-Time Analytics Dashboard<\/strong><\/p>\n<pre><code>User Activity Events → Kafka → \n  Flink/Spark Streaming (aggregate by 1-min windows) →\n  Redis (materialized view) →\n  Dashboard (polling Redis)\n<\/code><\/pre>\n<p><strong>Project 3: Audit Log System<\/strong><\/p>\n<pre><code>All service events → Kafka (audit.events) →\n  Audit Consumer (deduplicate + enrich) →\n  Elasticsearch (queryable audit log)\n<\/code><\/pre>\n<h3>Books and Resources<\/h3>\n<ol>\n<li><em>Kafka: The Definitive Guide<\/em> — Gwen Shapira et al. — <strong>Essential<\/strong><\/li>\n<li><em>Designing Event-Driven Systems<\/em> — Ben Stopford (free from Confluent)<\/li>\n<li><em>Building Event-Driven Microservices<\/em> — Adam Bellemare<\/li>\n<\/ol>\n<p><strong>Courses:<\/strong><\/p>\n<ul>\n<li>Confluent Developer — Free official Kafka courses<\/li>\n<li>Stephane Maarek's Kafka course (Udemy) — Most popular<\/li>\n<\/ul>\n","text":"## Chapter 14.4 – Hands-On Kafka Projects\n\n**Project 1: Order Processing Pipeline**\n```\nOrder Service → Kafka (order.created) → \n  Inventory Service (reserve stock)\n  Payment Service (charge card)\n  Notification Service (send confirmation)\n```\n\n**Project 2: Real-Time Analytics Dashboard**\n```\nUser Activity Events → Kafka → \n  Flink/Spark Streaming (aggregate by 1-min windows) →\n  Redis (materialized view) →\n  Dashboard (polling Redis)\n```\n\n**Project 3: Audit Log System**\n```\nAll service events → Kafka (audit.events) →\n  Audit Consumer (deduplicate + enrich) →\n  Elasticsearch (queryable audit log)\n```\n\n### Books and Resources\n\n1. *Kafka: The Definitive Guide* — Gwen Shapira et al. — **Essential**\n2. *Designing Event-Driven Systems* — Ben Stopford (free from Confluent)\n3. *Building Event-Driven Microservices* — Adam Bellemare\n\n**Courses:**\n- Confluent Developer — Free official Kafka courses\n- Stephane Maarek's Kafka course (Udemy) — Most popular\n\n"}]},{"id":15,"title":"Technical Leadership","chapters":[{"title":"Introduction","html":"<h1>PART 15 – TECHNICAL LEADERSHIP<\/h1>\n<hr />\n","text":"# PART 15 – TECHNICAL LEADERSHIP\n\n---\n\n"},{"title":"Chapter 15.1 – The Technical Lead Identity Shift","html":"<h2>Chapter 15.1 – The Technical Lead Identity Shift<\/h2>\n<p>The most common failure mode for engineers becoming Technical Leads is continuing to think of themselves as &quot;the best programmer on the team.&quot; Technical leadership is not about being the smartest engineer in the room — it's about making the room smarter.<\/p>\n<h3>The Three Modes of Technical Leadership<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Mode<\/th>\n  <th>Description<\/th>\n  <th>When to Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><strong>Directing<\/strong><\/td>\n  <td>&quot;Here's what to do and how&quot;<\/td>\n  <td>Juniors, urgent production issues, high-risk decisions<\/td>\n<\/tr>\n<tr>\n  <td><strong>Coaching<\/strong><\/td>\n  <td>&quot;What do you think? Here's a framework&quot;<\/td>\n  <td>Developing mid/senior engineers<\/td>\n<\/tr>\n<tr>\n  <td><strong>Collaborating<\/strong><\/td>\n  <td>&quot;Let's figure this out together&quot;<\/td>\n  <td>Peer technical problems, cross-team design<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Most TLs over-index on Directing. Your goal: default to Coaching and Collaborating.<\/p>\n<hr />\n","text":"## Chapter 15.1 – The Technical Lead Identity Shift\n\nThe most common failure mode for engineers becoming Technical Leads is continuing to think of themselves as \"the best programmer on the team.\" Technical leadership is not about being the smartest engineer in the room — it's about making the room smarter.\n\n### The Three Modes of Technical Leadership\n\n| Mode | Description | When to Use |\n|---|---|---|\n| **Directing** | \"Here's what to do and how\" | Juniors, urgent production issues, high-risk decisions |\n| **Coaching** | \"What do you think? Here's a framework\" | Developing mid/senior engineers |\n| **Collaborating** | \"Let's figure this out together\" | Peer technical problems, cross-team design |\n\nMost TLs over-index on Directing. Your goal: default to Coaching and Collaborating.\n\n---\n\n"},{"title":"Chapter 15.2 – Engineering Mentorship Framework","html":"<h2>Chapter 15.2 – Engineering Mentorship Framework<\/h2>\n<h3>The GROW Model for Technical Mentoring<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Step<\/th>\n  <th>Question<\/th>\n  <th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><strong>G<\/strong>oal<\/td>\n  <td>What do you want to achieve?<\/td>\n  <td>&quot;I want to become a Senior Engineer in 12 months&quot;<\/td>\n<\/tr>\n<tr>\n  <td><strong>R<\/strong>eality<\/td>\n  <td>Where are you now? What's blocking you?<\/td>\n  <td>&quot;I'm strong in coding but struggle with design&quot;<\/td>\n<\/tr>\n<tr>\n  <td><strong>O<\/strong>ptions<\/td>\n  <td>What could you do? What else?<\/td>\n  <td>&quot;I could: take a design course, shadow you, lead next feature&quot;<\/td>\n<\/tr>\n<tr>\n  <td><strong>W<\/strong>ay Forward<\/td>\n  <td>What will you actually do? By when?<\/td>\n  <td>&quot;I'll lead the payment redesign, with your support, by Q3&quot;<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Structuring 1:1s for Growth<\/h3>\n<pre><code>Weekly 1:1 Format (30 min):\n\n5 min: What's going well / personal check-in\n10 min: Blockers — &quot;What's slowing you down that I could help remove?&quot;\n10 min: Growth discussion — current skill, career goal, recent challenge\n5 min: Feedback exchange — both directions\n\nMonthly 1:1 additions:\n  Career progression check-in\n  Feedback from code reviews, design discussions\n  Goal alignment with team roadmap\n<\/code><\/pre>\n<h3>Technical Feedback Model<\/h3>\n<p>Avoid vague feedback. Use the <strong>SBI model (Situation, Behavior, Impact):<\/strong><\/p>\n<pre><code>Weak: &quot;Your code review feedback isn't very helpful.&quot;\n\nStrong (SBI): \n  Situation: &quot;In yesterday's PR review for the auth module,&quot;\n  Behavior: &quot;you commented 'this is wrong' without explaining why,&quot;\n  Impact: &quot;which left the author confused and required another round of discussion.&quot;\n  \n  Ask: &quot;What would help you give more specific feedback in reviews?&quot;\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 15.2 – Engineering Mentorship Framework\n\n### The GROW Model for Technical Mentoring\n\n| Step | Question | Example |\n|---|---|---|\n| **G**oal | What do you want to achieve? | \"I want to become a Senior Engineer in 12 months\" |\n| **R**eality | Where are you now? What's blocking you? | \"I'm strong in coding but struggle with design\" |\n| **O**ptions | What could you do? What else? | \"I could: take a design course, shadow you, lead next feature\" |\n| **W**ay Forward | What will you actually do? By when? | \"I'll lead the payment redesign, with your support, by Q3\" |\n\n### Structuring 1:1s for Growth\n\n```\nWeekly 1:1 Format (30 min):\n\n5 min: What's going well / personal check-in\n10 min: Blockers — \"What's slowing you down that I could help remove?\"\n10 min: Growth discussion — current skill, career goal, recent challenge\n5 min: Feedback exchange — both directions\n\nMonthly 1:1 additions:\n  Career progression check-in\n  Feedback from code reviews, design discussions\n  Goal alignment with team roadmap\n```\n\n### Technical Feedback Model\n\nAvoid vague feedback. Use the **SBI model (Situation, Behavior, Impact):**\n\n```\nWeak: \"Your code review feedback isn't very helpful.\"\n\nStrong (SBI): \n  Situation: \"In yesterday's PR review for the auth module,\"\n  Behavior: \"you commented 'this is wrong' without explaining why,\"\n  Impact: \"which left the author confused and required another round of discussion.\"\n  \n  Ask: \"What would help you give more specific feedback in reviews?\"\n```\n\n---\n\n"},{"title":"Chapter 15.3 – Architecture Reviews","html":"<h2>Chapter 15.3 – Architecture Reviews<\/h2>\n<h3>How to Run an Architecture Review<\/h3>\n<p><strong>Before the review:<\/strong><\/p>\n<ol>\n<li>Author writes an RFC/design doc (see Part 17)<\/li>\n<li>Share document 3-5 days before review<\/li>\n<li>Invite: Tech Lead, affected team leads, SRE rep<\/li>\n<li>Prepare specific questions as a reviewer<\/li>\n<\/ol>\n<p><strong>During the review:<\/strong><\/p>\n<ol>\n<li>Author presents problem statement (5 min)<\/li>\n<li>Author presents proposed solution (10 min)<\/li>\n<li>Structured Q&amp;A (20 min):<ul>\n<li>Clarifying questions first<\/li>\n<li>Challenge assumptions<\/li>\n<li>Explore alternatives<\/li>\n<li>Identify risks<\/li>\n<\/ul>\n<\/li>\n<li>Decision: Approve / Approve with changes / Need revision<\/li>\n<\/ol>\n<p><strong>Reviewer's toolkit — questions to always ask:<\/strong><\/p>\n<ul>\n<li>&quot;What happens if this service goes down?&quot;<\/li>\n<li>&quot;How does this scale to 10x current load?&quot;<\/li>\n<li>&quot;What's the rollback plan?&quot;<\/li>\n<li>&quot;What data migrations are required?&quot;<\/li>\n<li>&quot;How will we know if this is working in production?&quot;<\/li>\n<li>&quot;What are the security implications?&quot;<\/li>\n<li>&quot;What does the on-call playbook look like?&quot;<\/li>\n<\/ul>\n<hr />\n","text":"## Chapter 15.3 – Architecture Reviews\n\n### How to Run an Architecture Review\n\n**Before the review:**\n1. Author writes an RFC/design doc (see Part 17)\n2. Share document 3-5 days before review\n3. Invite: Tech Lead, affected team leads, SRE rep\n4. Prepare specific questions as a reviewer\n\n**During the review:**\n1. Author presents problem statement (5 min)\n2. Author presents proposed solution (10 min)\n3. Structured Q&A (20 min):\n   - Clarifying questions first\n   - Challenge assumptions\n   - Explore alternatives\n   - Identify risks\n4. Decision: Approve / Approve with changes / Need revision\n\n**Reviewer's toolkit — questions to always ask:**\n- \"What happens if this service goes down?\"\n- \"How does this scale to 10x current load?\"\n- \"What's the rollback plan?\"\n- \"What data migrations are required?\"\n- \"How will we know if this is working in production?\"\n- \"What are the security implications?\"\n- \"What does the on-call playbook look like?\"\n\n---\n\n"},{"title":"Chapter 15.4 – Incident Leadership","html":"<h2>Chapter 15.4 – Incident Leadership<\/h2>\n<h3>The Incident Commander Role<\/h3>\n<p>During a P0/P1 incident, the IC's job is <strong>coordination<\/strong>, not debugging:<\/p>\n<pre><code>Incident Timeline:\n  T+0: Incident detected (alert fires / user report)\n  T+5: IC declared, incident channel opened, status page updated\n  T+10: Responders assigned: debugging lead, comms lead\n  T+15: First update to stakeholders (&quot;We're investigating, ETA unknown&quot;)\n  T+30: Progress update / first hypothesis confirmed or rejected\n  T+60: Either resolved or escalation / additional responders\n  T+xx: Resolution + timeline communicated\n<\/code><\/pre>\n<p><strong>IC Communication Templates:<\/strong><\/p>\n<p><em>Initial stakeholder update:<\/em><\/p>\n<pre><code>🔴 INCIDENT ACTIVE — [Service Name] Degraded\nStatus: Investigating\nImpact: [X% of users affected, describe symptoms]\nStarted: [Time]\nResponders: [Names]\nNext update: [Time + 15 min]\n<\/code><\/pre>\n<p><em>Hourly update:<\/em><\/p>\n<pre><code>🔴 INCIDENT UPDATE — [Time]\nCurrent hypothesis: [Best current understanding]\nActions taken: [List of actions]\nProgress: [What's been ruled out / confirmed]\nNext steps: [What's happening in next 30 min]\nETA to resolution: [If known]\n<\/code><\/pre>\n<p><em>Resolution:<\/em><\/p>\n<pre><code>✅ INCIDENT RESOLVED — [Time]\nRoot cause: [Brief description]\nResolution: [What fixed it]\nTotal duration: [X hours Y min]\nImpact: [Estimated users affected]\nPost-mortem: [Link, scheduled for within 48 hours]\n<\/code><\/pre>\n<h3>Blameless Post-Mortems<\/h3>\n<pre><code>Post-Mortem Template:\n\n## Incident Summary\n- Date/Time: \n- Duration: \n- Impact: \n- Severity: P0 / P1 / P2\n\n## Timeline (UTC)\n- 14:30: First alert fired\n- 14:35: Oncall acknowledged\n- 14:45: Incident declared\n- ...\n- 16:20: Resolution deployed\n\n## Root Cause Analysis (5 Whys)\nWhy did users see errors?\n  → Database connection pool was exhausted\nWhy was the pool exhausted?\n  → Connection leak in new payment service\nWhy was there a connection leak?\n  → Missing context cancellation in async handler\nWhy was this not caught in review?\n  → Async resource management not in review checklist\nWhy is it not in the checklist?\n  → No systematic review of new async patterns\n\nRoot cause: Missing async context management in new code patterns.\n\n## What Went Well\n- Alerting fired within 2 minutes\n- Rollback took &lt; 5 minutes\n\n## What Could Be Improved\n- Alert was PagerDuty escalation tier 2, should be tier 1\n- No runbook for connection pool issues\n\n## Action Items\n| Action | Owner | Due Date |\n|--------|-------|----------|\n| Add async resource checklist to PR template | @alice | 2024-03-20 |\n| Create runbook for DB connection issues | @bob | 2024-03-22 |\n| Add connection pool saturation alert | @charlie | 2024-03-21 |\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 15.4 – Incident Leadership\n\n### The Incident Commander Role\n\nDuring a P0/P1 incident, the IC's job is **coordination**, not debugging:\n\n```\nIncident Timeline:\n  T+0: Incident detected (alert fires / user report)\n  T+5: IC declared, incident channel opened, status page updated\n  T+10: Responders assigned: debugging lead, comms lead\n  T+15: First update to stakeholders (\"We're investigating, ETA unknown\")\n  T+30: Progress update / first hypothesis confirmed or rejected\n  T+60: Either resolved or escalation / additional responders\n  T+xx: Resolution + timeline communicated\n```\n\n**IC Communication Templates:**\n\n*Initial stakeholder update:*\n```\n🔴 INCIDENT ACTIVE — [Service Name] Degraded\nStatus: Investigating\nImpact: [X% of users affected, describe symptoms]\nStarted: [Time]\nResponders: [Names]\nNext update: [Time + 15 min]\n```\n\n*Hourly update:*\n```\n🔴 INCIDENT UPDATE — [Time]\nCurrent hypothesis: [Best current understanding]\nActions taken: [List of actions]\nProgress: [What's been ruled out / confirmed]\nNext steps: [What's happening in next 30 min]\nETA to resolution: [If known]\n```\n\n*Resolution:*\n```\n✅ INCIDENT RESOLVED — [Time]\nRoot cause: [Brief description]\nResolution: [What fixed it]\nTotal duration: [X hours Y min]\nImpact: [Estimated users affected]\nPost-mortem: [Link, scheduled for within 48 hours]\n```\n\n### Blameless Post-Mortems\n\n```\nPost-Mortem Template:\n\n## Incident Summary\n- Date/Time: \n- Duration: \n- Impact: \n- Severity: P0 / P1 / P2\n\n## Timeline (UTC)\n- 14:30: First alert fired\n- 14:35: Oncall acknowledged\n- 14:45: Incident declared\n- ...\n- 16:20: Resolution deployed\n\n## Root Cause Analysis (5 Whys)\nWhy did users see errors?\n  → Database connection pool was exhausted\nWhy was the pool exhausted?\n  → Connection leak in new payment service\nWhy was there a connection leak?\n  → Missing context cancellation in async handler\nWhy was this not caught in review?\n  → Async resource management not in review checklist\nWhy is it not in the checklist?\n  → No systematic review of new async patterns\n\nRoot cause: Missing async context management in new code patterns.\n\n## What Went Well\n- Alerting fired within 2 minutes\n- Rollback took < 5 minutes\n\n## What Could Be Improved\n- Alert was PagerDuty escalation tier 2, should be tier 1\n- No runbook for connection pool issues\n\n## Action Items\n| Action | Owner | Due Date |\n|--------|-------|----------|\n| Add async resource checklist to PR template | @alice | 2024-03-20 |\n| Create runbook for DB connection issues | @bob | 2024-03-22 |\n| Add connection pool saturation alert | @charlie | 2024-03-21 |\n```\n\n---\n\n"},{"title":"Chapter 15.5 – Stakeholder Management","html":"<h2>Chapter 15.5 – Stakeholder Management<\/h2>\n<h3>The Stakeholder Map<\/h3>\n<p>Before any cross-team initiative, map your stakeholders:<\/p>\n<table>\n<thead>\n<tr>\n  <th>Stakeholder<\/th>\n  <th>Interest<\/th>\n  <th>Influence<\/th>\n  <th>Strategy<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Engineering VP<\/td>\n  <td>Timeline, risk<\/td>\n  <td>High<\/td>\n  <td>Executive summary<\/td>\n<\/tr>\n<tr>\n  <td>Product Manager<\/td>\n  <td>Features, user impact<\/td>\n  <td>High<\/td>\n  <td>Translate tech to user value<\/td>\n<\/tr>\n<tr>\n  <td>Other team TLs<\/td>\n  <td>API compatibility<\/td>\n  <td>Medium<\/td>\n  <td>Early involvement in design<\/td>\n<\/tr>\n<tr>\n  <td>Oncall team<\/td>\n  <td>Operational burden<\/td>\n  <td>Medium<\/td>\n  <td>Involve in design, document runbooks<\/td>\n<\/tr>\n<tr>\n  <td>Security team<\/td>\n  <td>Compliance, vulnerabilities<\/td>\n  <td>Medium<\/td>\n  <td>Threat modeling session<\/td>\n<\/tr>\n<tr>\n  <td>Finance<\/td>\n  <td>Cost impact<\/td>\n  <td>Low-Medium<\/td>\n  <td>ROI framing<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Managing Up Effectively<\/h3>\n<p>The <strong>BLUF (Bottom Line Up Front)<\/strong> technique:<\/p>\n<pre><code>Weak update to VP Engineering:\n&quot;We've been working on the database migration for 3 weeks.\n We've upgraded the schema, written the migration scripts, \n done extensive testing, and are now almost ready to deploy.\n The tests show good results and we're targeting next week.&quot;\n\nStrong update (BLUF):\n&quot;The database migration is on track for Friday deploy.\n 3 key risks mitigated: downtime reduced to &lt;5 min, \n rollback tested successfully, all 847 integration tests passing.\n One remaining risk: peak traffic on Friday—recommend 2pm window.\n Do you approve the Friday 2pm deployment window?&quot;\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 15.5 – Stakeholder Management\n\n### The Stakeholder Map\n\nBefore any cross-team initiative, map your stakeholders:\n\n| Stakeholder | Interest | Influence | Strategy |\n|---|---|---|---|\n| Engineering VP | Timeline, risk | High | Executive summary |\n| Product Manager | Features, user impact | High | Translate tech to user value |\n| Other team TLs | API compatibility | Medium | Early involvement in design |\n| Oncall team | Operational burden | Medium | Involve in design, document runbooks |\n| Security team | Compliance, vulnerabilities | Medium | Threat modeling session |\n| Finance | Cost impact | Low-Medium | ROI framing |\n\n### Managing Up Effectively\n\nThe **BLUF (Bottom Line Up Front)** technique:\n\n```\nWeak update to VP Engineering:\n\"We've been working on the database migration for 3 weeks.\n We've upgraded the schema, written the migration scripts, \n done extensive testing, and are now almost ready to deploy.\n The tests show good results and we're targeting next week.\"\n\nStrong update (BLUF):\n\"The database migration is on track for Friday deploy.\n 3 key risks mitigated: downtime reduced to <5 min, \n rollback tested successfully, all 847 integration tests passing.\n One remaining risk: peak traffic on Friday—recommend 2pm window.\n Do you approve the Friday 2pm deployment window?\"\n```\n\n---\n\n"}]},{"id":16,"title":"Communication Mastery","chapters":[{"title":"Introduction","html":"<h1>PART 16 – COMMUNICATION MASTERY<\/h1>\n<hr />\n","text":"# PART 16 – COMMUNICATION MASTERY\n\n---\n\n"},{"title":"Chapter 16.1 – The Communication Gap for Engineers","html":"<h2>Chapter 16.1 – The Communication Gap for Engineers<\/h2>\n<p>Technical excellence without communication is invisible. At Staff level, you will be judged as much on your ability to explain, persuade, and align as on your ability to build.<\/p>\n<p>Your self-identified gaps: executive communication, public speaking, presentation skills, technical storytelling.<\/p>\n<p><strong>The core insight:<\/strong> Communication skills are practiced, not innate. Daily reps beat occasional bursts.<\/p>\n<hr />\n","text":"## Chapter 16.1 – The Communication Gap for Engineers\n\nTechnical excellence without communication is invisible. At Staff level, you will be judged as much on your ability to explain, persuade, and align as on your ability to build.\n\nYour self-identified gaps: executive communication, public speaking, presentation skills, technical storytelling.\n\n**The core insight:** Communication skills are practiced, not innate. Daily reps beat occasional bursts.\n\n---\n\n"},{"title":"Chapter 16.2 – The Pyramid Principle","html":"<h2>Chapter 16.2 – The Pyramid Principle<\/h2>\n<p>Barbara Minto's structure for executive communication: <strong>Start with the conclusion.<\/strong><\/p>\n<pre><code>Pyramid structure:\n            [Answer / Recommendation]\n           /          |              \\\n    [Argument 1] [Argument 2] [Argument 3]\n       /    \\       /    \\       /    \\\n  [Data]  [Data] [Data] [Data] [Data] [Data]\n\nvs. Narrative structure (bottom-up — wrong for executive):\n  [Data] → [Data] → [Data] → [Therefore: Conclusion]\n<\/code><\/pre>\n<p><strong>Example — proposing a migration:<\/strong><\/p>\n<p><em>Bottom-up (weak):<\/em>\n&quot;Our database is 8 years old. We're experiencing performance issues. The team has evaluated options. After 3 weeks of analysis, we recommend migrating to PostgreSQL.&quot;<\/p>\n<p><em>Pyramid (strong):<\/em>\n&quot;We recommend migrating to PostgreSQL by Q3. This solves our performance degradation, reduces costs by 30%, and unblocks the ML platform team. Three evidence points support this: [...]&quot;<\/p>\n<hr />\n","text":"## Chapter 16.2 – The Pyramid Principle\n\nBarbara Minto's structure for executive communication: **Start with the conclusion.**\n\n```\nPyramid structure:\n            [Answer / Recommendation]\n           /          |              \\\n    [Argument 1] [Argument 2] [Argument 3]\n       /    \\       /    \\       /    \\\n  [Data]  [Data] [Data] [Data] [Data] [Data]\n\nvs. Narrative structure (bottom-up — wrong for executive):\n  [Data] → [Data] → [Data] → [Therefore: Conclusion]\n```\n\n**Example — proposing a migration:**\n\n*Bottom-up (weak):*\n\"Our database is 8 years old. We're experiencing performance issues. The team has evaluated options. After 3 weeks of analysis, we recommend migrating to PostgreSQL.\"\n\n*Pyramid (strong):*\n\"We recommend migrating to PostgreSQL by Q3. This solves our performance degradation, reduces costs by 30%, and unblocks the ML platform team. Three evidence points support this: [...]\"\n\n---\n\n"},{"title":"Chapter 16.3 – Speaking About Technical Work","html":"<h2>Chapter 16.3 – Speaking About Technical Work<\/h2>\n<h3>The 5-Level Explanation Technique<\/h3>\n<p>Practice explaining the same concept at 5 levels:<\/p>\n<pre><code>Topic: &quot;Why we're migrating from RabbitMQ to Kafka&quot;\n\nLevel 1 (Non-technical exec):\n&quot;We're replacing our message delivery system with one that can \n keep up with our growth. It'll prevent the slowdowns we've \n had during peak hours and saves us $50K/year.&quot;\n\nLevel 2 (Product Manager):\n&quot;Kafka gives us a persistent event log, so we can replay events \n for debugging and build new features like audit logs without \n changing the source services.&quot;\n\nLevel 3 (Senior Engineer):\n&quot;Kafka's partition model gives us horizontal scalability and \n durable message storage. Consumer groups enable independent \n processing speeds per service, eliminating our RabbitMQ \n queue backup issues.&quot;\n\nLevel 4 (Staff Engineer):\n&quot;Kafka's commit log architecture separates storage from processing,\n enabling event sourcing patterns. The pull-based consumption model \n lets consumers control their processing rate, avoiding \n backpressure issues.&quot;\n\nLevel 5 (Principal Engineer):\n&quot;Kafka's log-structured storage with zero-copy I/O achieves \n near-disk-sequential throughput. The segment-based log retention \n enables exactly-once semantics via idempotent producers and \n transactional APIs...&quot;\n<\/code><\/pre>\n<p>Practice switching levels mid-conversation based on audience cues.<\/p>\n<hr />\n","text":"## Chapter 16.3 – Speaking About Technical Work\n\n### The 5-Level Explanation Technique\n\nPractice explaining the same concept at 5 levels:\n\n```\nTopic: \"Why we're migrating from RabbitMQ to Kafka\"\n\nLevel 1 (Non-technical exec):\n\"We're replacing our message delivery system with one that can \n keep up with our growth. It'll prevent the slowdowns we've \n had during peak hours and saves us $50K/year.\"\n\nLevel 2 (Product Manager):\n\"Kafka gives us a persistent event log, so we can replay events \n for debugging and build new features like audit logs without \n changing the source services.\"\n\nLevel 3 (Senior Engineer):\n\"Kafka's partition model gives us horizontal scalability and \n durable message storage. Consumer groups enable independent \n processing speeds per service, eliminating our RabbitMQ \n queue backup issues.\"\n\nLevel 4 (Staff Engineer):\n\"Kafka's commit log architecture separates storage from processing,\n enabling event sourcing patterns. The pull-based consumption model \n lets consumers control their processing rate, avoiding \n backpressure issues.\"\n\nLevel 5 (Principal Engineer):\n\"Kafka's log-structured storage with zero-copy I/O achieves \n near-disk-sequential throughput. The segment-based log retention \n enables exactly-once semantics via idempotent producers and \n transactional APIs...\"\n```\n\nPractice switching levels mid-conversation based on audience cues.\n\n---\n\n"},{"title":"Chapter 16.4 – Presentation Skills Program","html":"<h2>Chapter 16.4 – Presentation Skills Program<\/h2>\n<h3>The Engineering Talk Structure<\/h3>\n<pre><code>1. Hook (30 sec): A problem, statistic, or story that creates tension\n2. Thesis (15 sec): &quot;Today I'll show you [X]&quot;\n3. Context (1-2 min): Why does this matter to this audience?\n4. Body (70% of time): 3 main points, each with: claim + evidence + example\n5. Demo or visualization: Make it tangible\n6. Summary (30 sec): Restate key points\n7. Call to Action (30 sec): What do you want the audience to do?\n<\/code><\/pre>\n<h3>Daily Speaking Exercises<\/h3>\n<p><strong>Week 1-4: Foundation<\/strong><\/p>\n<ul>\n<li>Day 1-7: Record yourself explaining one technical concept for 60 seconds. Play it back.<\/li>\n<li>Day 8-14: Explain the same concept to a non-technical person (family member, friend).<\/li>\n<li>Day 15-21: Give the same talk to your team at standup.<\/li>\n<li>Day 22-28: Present a technical decision to your manager.<\/li>\n<\/ul>\n<p><strong>Week 5-8: Structured Practice<\/strong><\/p>\n<ul>\n<li>Monday: Write a &quot;one-pager&quot; explaining last week's most complex technical work<\/li>\n<li>Wednesday: Give a 5-minute presentation from that one-pager<\/li>\n<li>Friday: Get feedback from one peer<\/li>\n<\/ul>\n<p><strong>Month 3+: Public Reps<\/strong><\/p>\n<ul>\n<li>Internal lightning talk (10 min) to engineering team<\/li>\n<li>Record a YouTube video or Loom explaining a technical concept<\/li>\n<li>Write the talk out as a blog post<\/li>\n<li>Submit to a local meetup<\/li>\n<\/ul>\n<h3>Managing Technical Anxiety in Presentations<\/h3>\n<p>The <strong>3-2-1 Technique<\/strong> for nerves:<\/p>\n<ol>\n<li>Three deep breaths before you begin<\/li>\n<li>Two minutes of preparation silence (don't review slides, just center)<\/li>\n<li>One strong opening line (memorized, no thinking required)<\/li>\n<\/ol>\n<p>The <strong>Pause Technique:<\/strong> Silence feels longer to you than to the audience. Use 2-second pauses after key points. It feels like eternity to you, like gravitas to them.<\/p>\n<hr />\n","text":"## Chapter 16.4 – Presentation Skills Program\n\n### The Engineering Talk Structure\n\n```\n1. Hook (30 sec): A problem, statistic, or story that creates tension\n2. Thesis (15 sec): \"Today I'll show you [X]\"\n3. Context (1-2 min): Why does this matter to this audience?\n4. Body (70% of time): 3 main points, each with: claim + evidence + example\n5. Demo or visualization: Make it tangible\n6. Summary (30 sec): Restate key points\n7. Call to Action (30 sec): What do you want the audience to do?\n```\n\n### Daily Speaking Exercises\n\n**Week 1-4: Foundation**\n- Day 1-7: Record yourself explaining one technical concept for 60 seconds. Play it back.\n- Day 8-14: Explain the same concept to a non-technical person (family member, friend).\n- Day 15-21: Give the same talk to your team at standup.\n- Day 22-28: Present a technical decision to your manager.\n\n**Week 5-8: Structured Practice**\n- Monday: Write a \"one-pager\" explaining last week's most complex technical work\n- Wednesday: Give a 5-minute presentation from that one-pager\n- Friday: Get feedback from one peer\n\n**Month 3+: Public Reps**\n- Internal lightning talk (10 min) to engineering team\n- Record a YouTube video or Loom explaining a technical concept\n- Write the talk out as a blog post\n- Submit to a local meetup\n\n### Managing Technical Anxiety in Presentations\n\nThe **3-2-1 Technique** for nerves:\n1. Three deep breaths before you begin\n2. Two minutes of preparation silence (don't review slides, just center)\n3. One strong opening line (memorized, no thinking required)\n\nThe **Pause Technique:** Silence feels longer to you than to the audience. Use 2-second pauses after key points. It feels like eternity to you, like gravitas to them.\n\n---\n\n"},{"title":"Chapter 16.5 – Executive Communication","html":"<h2>Chapter 16.5 – Executive Communication<\/h2>\n<h3>The One-Page Technical Summary<\/h3>\n<p>Before any meeting with a director/VP, write a one-page summary:<\/p>\n<pre><code>TECHNICAL DECISION SUMMARY\nDate: [Date]\nAuthor: [Your name]\nDecision Required By: [Date]\n\nRECOMMENDATION\n[One sentence: what you're recommending]\n\nCONTEXT\n[2-3 sentences: why this decision needs to be made now]\n\nOPTIONS CONSIDERED\nOption A: [Name] — [Pros/Cons, cost, risk]\nOption B: [Name] — [Pros/Cons, cost, risk]\nOption C: Do nothing — [Why this is bad]\n\nRECOMMENDATION DETAILS\n[Why Option A is best: business impact, risk mitigation, team alignment]\n\nRISKS\n[Top 2-3 risks + mitigations]\n\nRESOURCE REQUIREMENTS\n[Time, people, cost]\n\nNEXT STEPS\n[Specific actions if approved]\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 16.5 – Executive Communication\n\n### The One-Page Technical Summary\n\nBefore any meeting with a director/VP, write a one-page summary:\n\n```\nTECHNICAL DECISION SUMMARY\nDate: [Date]\nAuthor: [Your name]\nDecision Required By: [Date]\n\nRECOMMENDATION\n[One sentence: what you're recommending]\n\nCONTEXT\n[2-3 sentences: why this decision needs to be made now]\n\nOPTIONS CONSIDERED\nOption A: [Name] — [Pros/Cons, cost, risk]\nOption B: [Name] — [Pros/Cons, cost, risk]\nOption C: Do nothing — [Why this is bad]\n\nRECOMMENDATION DETAILS\n[Why Option A is best: business impact, risk mitigation, team alignment]\n\nRISKS\n[Top 2-3 risks + mitigations]\n\nRESOURCE REQUIREMENTS\n[Time, people, cost]\n\nNEXT STEPS\n[Specific actions if approved]\n```\n\n---\n\n"}]},{"id":17,"title":"Technical Writing","chapters":[{"title":"Introduction","html":"<h1>PART 17 – TECHNICAL WRITING<\/h1>\n<hr />\n","text":"# PART 17 – TECHNICAL WRITING\n\n---\n\n"},{"title":"Chapter 17.1 – RFC (Request for Comments) Template","html":"<h2>Chapter 17.1 – RFC (Request for Comments) Template<\/h2>\n<p>RFCs are how Staff engineers create change at scale. A well-written RFC does the work of 20 meetings.<\/p>\n<pre><code class=\"language-markdown\"># RFC-042: Migrate User Authentication to Keycloak\n\n**Author:** [Your name]  \n**Date:** 2024-03-15  \n**Status:** DRAFT | IN REVIEW | ACCEPTED | REJECTED  \n**Stakeholders:** Platform Team, Security Team, User-facing Services  \n\n---\n\n## Summary\n\nOne paragraph: what this RFC proposes and why.\n\nWe propose migrating our custom JWT authentication to Keycloak, \na production-ready identity platform. This reduces security maintenance \nburden, adds OIDC compliance, and enables SSO across all internal tools.\n\n---\n\n## Problem Statement\n\nWhat is the current state? What problems does it cause?\n\nOur homegrown auth system has accumulated significant technical debt:\n- Manual token rotation (2 production incidents in Q4 2023)\n- No SSO capability (users login to 5 separate tools)\n- Not OIDC compliant (blocking enterprise customer deals)\n- No MFA support (compliance risk for SOC2 Type II)\n\n---\n\n## Goals\n\n- Provide SSO across all internal tools\n- Achieve OIDC/OAuth2 compliance\n- Enable MFA for all admin users\n- Reduce auth-related on-call incidents by 80%\n\n---\n\n## Non-Goals\n\n- Migrating external API authentication (separate RFC)\n- Social login (planned for Q3)\n\n---\n\n## Proposed Solution\n\n### Architecture Overview\n[Architecture diagram]\n\n### Migration Approach\n[Phased approach with rollback points]\n\n### API Changes\n[Before/after of auth endpoints]\n\n---\n\n## Alternatives Considered\n\n### Option A: Auth0 (Cloud-managed)\nPros: No ops burden, enterprise features\nCons: $2,000/month at current scale, data residency concerns\n\n### Option B: Maintain custom JWT (status quo)\nPros: No migration effort\nCons: Continues accumulating technical debt, blocks compliance\n\n### Option C: Keycloak (Selected)\nPros: Open source, OIDC compliant, Kubernetes-native\nCons: Ops burden for initial setup\n\n---\n\n## Implementation Plan\n\n### Phase 1 (Week 1-2): Keycloak Setup\n- Deploy Keycloak to Kubernetes\n- Configure tenant realms\n- Set up LDAP sync\n\n### Phase 2 (Week 3-4): Service Migration (Canary)\n- Migrate 1 non-critical service to new auth\n- Monitor for 1 week\n\n### Phase 3 (Week 5-6): Full Migration\n- Migrate remaining services\n- Deprecate old auth endpoints\n- Update documentation\n\n---\n\n## Rollback Plan\n\nEach phase has an independent rollback. Feature flags control traffic to old vs new auth.\n\n---\n\n## Security Considerations\n\n[Threat model, data access implications]\n\n---\n\n## Observability\n\n[Metrics, alerts, dashboards to create]\n\n---\n\n## Open Questions\n\n1. Should we self-host Keycloak or use Keycloak Cloud? (Decision needed by [date])\n2. How do we handle service accounts during migration?\n\n---\n\n## References\n\n- [Keycloak Documentation](https://www.keycloak.org/documentation)\n- [Internal auth incident reports](internal link)\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 17.1 – RFC (Request for Comments) Template\n\nRFCs are how Staff engineers create change at scale. A well-written RFC does the work of 20 meetings.\n\n```markdown\n# RFC-042: Migrate User Authentication to Keycloak\n\n**Author:** [Your name]  \n**Date:** 2024-03-15  \n**Status:** DRAFT | IN REVIEW | ACCEPTED | REJECTED  \n**Stakeholders:** Platform Team, Security Team, User-facing Services  \n\n---\n\n## Summary\n\nOne paragraph: what this RFC proposes and why.\n\nWe propose migrating our custom JWT authentication to Keycloak, \na production-ready identity platform. This reduces security maintenance \nburden, adds OIDC compliance, and enables SSO across all internal tools.\n\n---\n\n## Problem Statement\n\nWhat is the current state? What problems does it cause?\n\nOur homegrown auth system has accumulated significant technical debt:\n- Manual token rotation (2 production incidents in Q4 2023)\n- No SSO capability (users login to 5 separate tools)\n- Not OIDC compliant (blocking enterprise customer deals)\n- No MFA support (compliance risk for SOC2 Type II)\n\n---\n\n## Goals\n\n- Provide SSO across all internal tools\n- Achieve OIDC/OAuth2 compliance\n- Enable MFA for all admin users\n- Reduce auth-related on-call incidents by 80%\n\n---\n\n## Non-Goals\n\n- Migrating external API authentication (separate RFC)\n- Social login (planned for Q3)\n\n---\n\n## Proposed Solution\n\n### Architecture Overview\n[Architecture diagram]\n\n### Migration Approach\n[Phased approach with rollback points]\n\n### API Changes\n[Before/after of auth endpoints]\n\n---\n\n## Alternatives Considered\n\n### Option A: Auth0 (Cloud-managed)\nPros: No ops burden, enterprise features\nCons: $2,000/month at current scale, data residency concerns\n\n### Option B: Maintain custom JWT (status quo)\nPros: No migration effort\nCons: Continues accumulating technical debt, blocks compliance\n\n### Option C: Keycloak (Selected)\nPros: Open source, OIDC compliant, Kubernetes-native\nCons: Ops burden for initial setup\n\n---\n\n## Implementation Plan\n\n### Phase 1 (Week 1-2): Keycloak Setup\n- Deploy Keycloak to Kubernetes\n- Configure tenant realms\n- Set up LDAP sync\n\n### Phase 2 (Week 3-4): Service Migration (Canary)\n- Migrate 1 non-critical service to new auth\n- Monitor for 1 week\n\n### Phase 3 (Week 5-6): Full Migration\n- Migrate remaining services\n- Deprecate old auth endpoints\n- Update documentation\n\n---\n\n## Rollback Plan\n\nEach phase has an independent rollback. Feature flags control traffic to old vs new auth.\n\n---\n\n## Security Considerations\n\n[Threat model, data access implications]\n\n---\n\n## Observability\n\n[Metrics, alerts, dashboards to create]\n\n---\n\n## Open Questions\n\n1. Should we self-host Keycloak or use Keycloak Cloud? (Decision needed by [date])\n2. How do we handle service accounts during migration?\n\n---\n\n## References\n\n- [Keycloak Documentation](https://www.keycloak.org/documentation)\n- [Internal auth incident reports](internal link)\n```\n\n---\n\n"},{"title":"Chapter 17.2 – ADR (Architecture Decision Record) Template","html":"<h2>Chapter 17.2 – ADR (Architecture Decision Record) Template<\/h2>\n<p>ADRs document <em>why<\/em> a decision was made. Future you will thank present you.<\/p>\n<pre><code class=\"language-markdown\"># ADR-023: Use PostgreSQL for User Profile Storage\n\n**Date:** 2024-02-10  \n**Status:** Accepted  \n**Deciders:** [Tech Lead], Priya (PM), Arjun (Staff SRE)  \n\n---\n\n## Context\n\nWe need to store user profiles for a multi-tenant SaaS product. \nExpected scale: 10M users, 50K tenants within 12 months.\nRequirements: strong consistency, complex querying, ACID transactions.\n\n---\n\n## Decision\n\nWe will use PostgreSQL 15 with row-level security for tenant isolation.\n\n---\n\n## Consequences\n\n**Good:**\n- ACID transactions for user data integrity\n- Row-level security simplifies multi-tenancy\n- Existing team expertise reduces operational risk\n- Rich querying for user analytics\n\n**Bad:**\n- Vertical scaling limits (mitigated with read replicas)\n- Not ideal for document-heavy profile data (use JSONB for flexibility)\n\n---\n\n## Alternatives Considered\n\n**MongoDB:** Rejected — eventual consistency risks for financial operations, \nlimited ACID transaction support.\n\n**DynamoDB:** Rejected — complex multi-tenant patterns, \nlimited query flexibility, higher operational cost at scale.\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 17.2 – ADR (Architecture Decision Record) Template\n\nADRs document *why* a decision was made. Future you will thank present you.\n\n```markdown\n# ADR-023: Use PostgreSQL for User Profile Storage\n\n**Date:** 2024-02-10  \n**Status:** Accepted  \n**Deciders:** [Tech Lead], Priya (PM), Arjun (Staff SRE)  \n\n---\n\n## Context\n\nWe need to store user profiles for a multi-tenant SaaS product. \nExpected scale: 10M users, 50K tenants within 12 months.\nRequirements: strong consistency, complex querying, ACID transactions.\n\n---\n\n## Decision\n\nWe will use PostgreSQL 15 with row-level security for tenant isolation.\n\n---\n\n## Consequences\n\n**Good:**\n- ACID transactions for user data integrity\n- Row-level security simplifies multi-tenancy\n- Existing team expertise reduces operational risk\n- Rich querying for user analytics\n\n**Bad:**\n- Vertical scaling limits (mitigated with read replicas)\n- Not ideal for document-heavy profile data (use JSONB for flexibility)\n\n---\n\n## Alternatives Considered\n\n**MongoDB:** Rejected — eventual consistency risks for financial operations, \nlimited ACID transaction support.\n\n**DynamoDB:** Rejected — complex multi-tenant patterns, \nlimited query flexibility, higher operational cost at scale.\n```\n\n---\n\n"},{"title":"Chapter 17.3 – Writing Production Runbooks","html":"<h2>Chapter 17.3 – Writing Production Runbooks<\/h2>\n<p>Every service you own should have an operational runbook:<\/p>\n<pre><code class=\"language-markdown\"># User Service Runbook\n\n## Service Overview\nThe User Service manages authentication, profile data, and RBAC for the platform.\n\n**Owner:** [Service owner] (Slack: [owner handle])  \n**Oncall Rotation:** platform-oncall  \n**PagerDuty:** https://mycompany.pagerduty.com/services/P12345  \n\n---\n\n## Architecture\n[Architecture diagram]\n\n**Dependencies:**\n- PostgreSQL (primary data store)\n- Redis (session cache, rate limiting)\n- Keycloak (token validation)\n- Kafka (publishes UserCreated, UserUpdated events)\n\n---\n\n## Common Issues and Resolutions\n\n### High Error Rate (5xx)\n\n**Detection:** PagerDuty alert &quot;user-service-error-rate-high&quot;\n\n**Investigation:**\n1. Check logs: `kubectl logs -n production -l app=user-service --since=10m | grep ERROR`\n2. Check DB connections: `kubectl exec -n production deploy/user-service -- curl localhost:8080/health/db`\n3. Check Redis: `redis-cli -h redis.production ping`\n\n**Common causes:**\n- Database connection pool exhausted → scale pods or check for connection leaks\n- Redis unavailable → user service will degrade gracefully (slower, not down)\n- Token validation failures → check Keycloak health\n\n**Resolution:**\n```bash\n# Restart deployment (last resort)\nkubectl rollout restart deploy/user-service -n production\n\n# Scale up during traffic spike\nkubectl scale deploy/user-service --replicas=10 -n production\n<\/code><\/pre>\n<hr />\n<h2>Deployment<\/h2>\n<pre><code class=\"language-bash\"># Normal deployment (GitOps via ArgoCD)\ngit tag v1.2.3 &amp;&amp; git push --tags\n# ArgoCD automatically deploys tagged releases\n\n# Emergency rollback\nkubectl rollout undo deploy/user-service -n production\n<\/code><\/pre>\n<hr />\n<h2>Database Migrations<\/h2>\n<p>All migrations are run automatically on startup via Alembic.\nTo run manually: <code>kubectl exec -n production deploy/user-service -- alembic upgrade head<\/code><\/p>\n<p>Never run migrations directly on the production database.<\/p>\n<hr />\n<h2>Escalation Path<\/h2>\n<ol>\n<li>Check this runbook<\/li>\n<li>Check #platform-support Slack channel<\/li>\n<li>Page secondary oncall if not resolved in 15 minutes<\/li>\n<li>Escalate to [owner handle] if database-related and unclear path<\/li>\n<\/ol>\n<pre><code>\n---\n\n<\/code><\/pre>\n","text":"## Chapter 17.3 – Writing Production Runbooks\n\nEvery service you own should have an operational runbook:\n\n```markdown\n# User Service Runbook\n\n## Service Overview\nThe User Service manages authentication, profile data, and RBAC for the platform.\n\n**Owner:** [Service owner] (Slack: [owner handle])  \n**Oncall Rotation:** platform-oncall  \n**PagerDuty:** https://mycompany.pagerduty.com/services/P12345  \n\n---\n\n## Architecture\n[Architecture diagram]\n\n**Dependencies:**\n- PostgreSQL (primary data store)\n- Redis (session cache, rate limiting)\n- Keycloak (token validation)\n- Kafka (publishes UserCreated, UserUpdated events)\n\n---\n\n## Common Issues and Resolutions\n\n### High Error Rate (5xx)\n\n**Detection:** PagerDuty alert \"user-service-error-rate-high\"\n\n**Investigation:**\n1. Check logs: `kubectl logs -n production -l app=user-service --since=10m | grep ERROR`\n2. Check DB connections: `kubectl exec -n production deploy/user-service -- curl localhost:8080/health/db`\n3. Check Redis: `redis-cli -h redis.production ping`\n\n**Common causes:**\n- Database connection pool exhausted → scale pods or check for connection leaks\n- Redis unavailable → user service will degrade gracefully (slower, not down)\n- Token validation failures → check Keycloak health\n\n**Resolution:**\n```bash\n# Restart deployment (last resort)\nkubectl rollout restart deploy/user-service -n production\n\n# Scale up during traffic spike\nkubectl scale deploy/user-service --replicas=10 -n production\n```\n\n---\n\n## Deployment\n\n```bash\n# Normal deployment (GitOps via ArgoCD)\ngit tag v1.2.3 && git push --tags\n# ArgoCD automatically deploys tagged releases\n\n# Emergency rollback\nkubectl rollout undo deploy/user-service -n production\n```\n\n---\n\n## Database Migrations\n\nAll migrations are run automatically on startup via Alembic.\nTo run manually: `kubectl exec -n production deploy/user-service -- alembic upgrade head`\n\nNever run migrations directly on the production database.\n\n---\n\n## Escalation Path\n\n1. Check this runbook\n2. Check #platform-support Slack channel\n3. Page secondary oncall if not resolved in 15 minutes\n4. Escalate to [owner handle] if database-related and unclear path\n```\n\n---\n\n"}]},{"id":18,"title":"Business Thinking","chapters":[{"title":"Introduction","html":"<h1>PART 18 – BUSINESS THINKING<\/h1>\n<hr />\n","text":"# PART 18 – BUSINESS THINKING\n\n---\n\n"},{"title":"Chapter 18.1 – Why Business Thinking Separates Staff from Senior","html":"<h2>Chapter 18.1 – Why Business Thinking Sep
