and 0<=j<n and g[i][j]=='O': g[i][j]='#'; q.append((i,j))\n    for i in range(m): add(i,0); add(i,n-1)\n    for j in range(n): add(0,j); add(m-1,j)\n    while q:\n        i,j=q.popleft()\n        for x,y in [(i+1,j),(i-1,j),(i,j+1),(i,j-1)]: add(x,y)\n    for i in range(m):\n        for j in range(n): g[i][j]='O' if g[i][j]=='#' else 'X'\n\n# Example and boundary checks\ng=[list('XXX'),list('XOX'),list('XXX')]; solve(g); assert g==[list('XXX')]*3; g=[['O']]; solve(g); assert g==[['O']]\nprint(\"Sample checks passed\")\n","canonical":65}},{"id":66,"name":"Rotting Oranges","difficulty":"Medium","pattern":"Multi-source BFS","topic":"Graphs","lesson":{"description":"In a grid with 0 empty, 1 fresh and 2 rotten oranges, each rotten orange infects adjacent fresh ones per minute. Return minutes until all fresh rot, or -1.","example":"[[2,1,1],[1,1,0],[0,1,1]] → 4","hint":"Queue every initial rotten orange at time zero.","reason":"Multi-source BFS discovers each fresh orange at its earliest infection time. Any fresh cells left at the end are unreachable.","complexity":"O(mn) time and space; mutates grid.","code":"from collections import deque\ndef solve(g):\n    m,n=len(g),len(g[0]); q=deque(); fresh=0; t=0\n    for i in range(m):\n        for j in range(n):\n            if g[i][j]==2: q.append((i,j,0))\n            if g[i][j]==1: fresh+=1\n    while q:\n        i,j,t=q.popleft()\n        for x,y in [(i+1,j),(i-1,j),(i,j+1),(i,j-1)]:\n            if 0<=x<m and 0<=y<n and g[x][y]==1:\n                fresh-=1; g[x][y]=2; q.append((x,y,t+1))\n    return -1 if fresh else t","tests":"assert solve([[2,1,1],[1,1,0],[0,1,1]])==4; assert solve([[1]])==-1","models":"","full":"from collections import deque\ndef solve(g):\n    m,n=len(g),len(g[0]); q=deque(); fresh=0; t=0\n    for i in range(m):\n        for j in range(n):\n            if g[i][j]==2: q.append((i,j,0))\n            if g[i][j]==1: fresh+=1\n    while q:\n        i,j,t=q.popleft()\n        for x,y in [(i+1,j),(i-1,j),(i,j+1),(i,j-1)]:\n            if 0<=x<m and 0<=y<n and g[x][y]==1:\n                fresh-=1; g[x][y]=2; q.append((x,y,t+1))\n    return -1 if fresh else t\n\n# Example and boundary checks\nassert solve([[2,1,1],[1,1,0],[0,1,1]])==4; assert solve([[1]])==-1\nprint(\"Sample checks passed\")\n","canonical":66}},{"id":67,"name":"Walls and Gates","difficulty":"Medium","pattern":"Multi-source BFS","topic":"Graphs","lesson":{"description":"Fill each empty room (2147483647) with distance to nearest gate (0); walls are -1. Leave unreachable rooms unchanged.","example":"[[0,2147483647,-1],[2147483647,2147483647,2147483647]] → [[0,1,-1],[1,2,3]]","hint":"All gates are BFS sources.","reason":"First visit from any gate gives shortest unweighted distance. Assign a room only once, preventing slower paths from overwriting it.","complexity":"O(mn) time and space; mutates input.","code":"from collections import deque\ndef solve(g):\n    if not g: return\n    m,n=len(g),len(g[0]); q=deque((i,j) for i in range(m) for j in range(n) if g[i][j]==0)\n    while q:\n        i,j=q.popleft()\n        for x,y in [(i+1,j),(i-1,j),(i,j+1),(i,j-1)]:\n            if 0<=x<m and 0<=y<n and g[x][y]==2147483647:\n                g[x][y]=g[i][j]+1; q.append((x,y))","tests":"I=2147483647; g=[[0,I,-1],[I,I,I]]; solve(g); assert g==[[0,1,-1],[1,2,3]]","models":"","full":"from collections import deque\ndef solve(g):\n    if not g: return\n    m,n=len(g),len(g[0]); q=deque((i,j) for i in range(m) for j in range(n) if g[i][j]==0)\n    while q:\n        i,j=q.popleft()\n        for x,y in [(i+1,j),(i-1,j),(i,j+1),(i,j-1)]:\n            if 0<=x<m and 0<=y<n and g[x][y]==2147483647:\n                g[x][y]=g[i][j]+1; q.append((x,y))\n\n# Example and boundary checks\nI=2147483647; g=[[0,I,-1],[I,I,I]]; solve(g); assert g==[[0,1,-1],[1,2,3]]\nprint(\"Sample checks passed\")\n","canonical":67}},{"id":68,"name":"Course Schedule","difficulty":"Medium","pattern":"Topological sort","topic":"Graphs","lesson":{"description":"Given n courses labeled 0..n-1 and pairs [course, prerequisite], determine if all can be completed.","example":"2,[[1,0],[0,1]] → False","hint":"A directed cycle prevents completion.","reason":"Kahn's algorithm removes zero-indegree vertices and their outgoing edges. All vertices can be removed exactly when the dependency graph is acyclic.","complexity":"O(V+E) time and space.","code":"from collections import deque\ndef solve(n,pairs):\n    adj=[[] for _ in range(n)]; deg=[0]*n\n    for a,b in pairs: adj[b].append(a); deg[a]+=1\n    q=deque(i for i in range(n) if deg[i]==0); done=0\n    while q:\n        u=q.popleft(); done+=1\n        for v in adj[u]:\n            deg[v]-=1\n            if not deg[v]: q.append(v)\n    return done==n","tests":"assert not solve(2,[[1,0],[0,1]]); assert solve(2,[[1,0]])","models":"","full":"from collections import deque\ndef solve(n,pairs):\n    adj=[[] for _ in range(n)]; deg=[0]*n\n    for a,b in pairs: adj[b].append(a); deg[a]+=1\n    q=deque(i for i in range(n) if deg[i]==0); done=0\n    while q:\n        u=q.popleft(); done+=1\n        for v in adj[u]:\n            deg[v]-=1\n            if not deg[v]: q.append(v)\n    return done==n\n\n# Example and boundary checks\nassert not solve(2,[[1,0],[0,1]]); assert solve(2,[[1,0]])\nprint(\"Sample checks passed\")\n","canonical":68}},{"id":69,"name":"Course Schedule II","difficulty":"Medium","pattern":"Topological sort","topic":"Graphs","lesson":{"description":"Return any course order satisfying prerequisite pairs, or empty if no valid order exists.","example":"4,[[1,0],[2,0],[3,1],[3,2]] → [0,1,2,3]","hint":"Save the removal order from topological sort.","reason":"A zero-indegree course has no remaining prerequisites. Appending it before removing outgoing edges ensures every dependency precedes its dependent.","complexity":"O(V+E) time and space.","code":"from collections import deque\ndef solve(n,pairs):\n    adj=[[] for _ in range(n)]; deg=[0]*n; order=[]\n    for a,b in pairs: adj[b].append(a); deg[a]+=1\n    q=deque(i for i in range(n) if not deg[i])\n    while q:\n        u=q.popleft(); order.append(u)\n        for v in adj[u]:\n            deg[v]-=1\n            if not deg[v]: q.append(v)\n    return order if len(order)==n else []","tests":"assert solve(4,[[1,0],[2,0],[3,1],[3,2]]) in ([0,1,2,3],[0,2,1,3]); assert solve(2,[[1,0],[0,1]])==[]","models":"","full":"from collections import deque\ndef solve(n,pairs):\n    adj=[[] for _ in range(n)]; deg=[0]*n; order=[]\n    for a,b in pairs: adj[b].append(a); deg[a]+=1\n    q=deque(i for i in range(n) if not deg[i])\n    while q:\n        u=q.popleft(); order.append(u)\n        for v in adj[u]:\n            deg[v]-=1\n            if not deg[v]: q.append(v)\n    return order if len(order)==n else []\n\n# Example and boundary checks\nassert solve(4,[[1,0],[2,0],[3,1],[3,2]]) in ([0,1,2,3],[0,2,1,3]); assert solve(2,[[1,0],[0,1]])==[]\nprint(\"Sample checks passed\")\n","canonical":69}},{"id":70,"name":"Redundant Connection","difficulty":"Medium","pattern":"Union-Find","topic":"Graphs","lesson":{"description":"A tree with vertices 1..n has one additional undirected edge. Return the last input edge whose removal restores a tree.","example":"[[1,2],[1,3],[2,3]] → [2,3]","hint":"Detect a union between already connected vertices.","reason":"A new edge creates a cycle iff both endpoints already share a component. In a tree plus one edge, the first failed union is the last edge of the unique cycle in input order.","complexity":"O(n α(n)) time, O(n) space.","code":"def solve(edges):\n    p=list(range(len(edges)+1)); size=[1]*len(p)\n    def find(x):\n        while x!=p[x]: p[x]=p[p[x]]; x=p[x]\n        return x\n    for a,b in edges:\n        x,y=find(a),find(b)\n        if x==y: return [a,b]\n        if size[x]<size[y]: x,y=y,x\n        p[y]=x; size[x]+=size[y]","tests":"assert solve([[1,2],[1,3],[2,3]])==[2,3]","models":"","full":"def solve(edges):\n    p=list(range(len(edges)+1)); size=[1]*len(p)\n    def find(x):\n        while x!=p[x]: p[x]=p[p[x]]; x=p[x]\n        return x\n    for a,b in edges:\n        x,y=find(a),find(b)\n        if x==y: return [a,b]\n        if size[x]<size[y]: x,y=y,x\n        p[y]=x; size[x]+=size[y]\n\n# Example and boundary checks\nassert solve([[1,2],[1,3],[2,3]])==[2,3]\nprint(\"Sample checks passed\")\n","canonical":70}},{"id":71,"name":"Number of Connected Components","difficulty":"Medium","pattern":"Union-Find","topic":"Graphs","lesson":{"description":"Count connected components in an undirected graph on n vertices 0..n-1.","example":"5,[[0,1],[1,2],[3,4]] → 2","hint":"Start with n singleton components.","reason":"Each successful union joins two formerly separate components, decreasing count by one. Redundant edges do not change it.","complexity":"O((V+E) α(V)) time, O(V) space.","code":"def solve(n,edges):\n    p=list(range(n)); size=[1]*n; count=n\n    def find(x):\n        while x!=p[x]: p[x]=p[p[x]]; x=p[x]\n        return x\n    for a,b in edges:\n        x,y=find(a),find(b)\n        if x!=y:\n            if size[x]<size[y]: x,y=y,x\n            p[y]=x; size[x]+=size[y]; count-=1\n    return count","tests":"assert solve(5,[[0,1],[1,2],[3,4]])==2; assert solve(3,[])==3","models":"","full":"def solve(n,edges):\n    p=list(range(n)); size=[1]*n; count=n\n    def find(x):\n        while x!=p[x]: p[x]=p[p[x]]; x=p[x]\n        return x\n    for a,b in edges:\n        x,y=find(a),find(b)\n        if x!=y:\n            if size[x]<size[y]: x,y=y,x\n            p[y]=x; size[x]+=size[y]; count-=1\n    return count\n\n# Example and boundary checks\nassert solve(5,[[0,1],[1,2],[3,4]])==2; assert solve(3,[])==3\nprint(\"Sample checks passed\")\n","canonical":71}},{"id":72,"name":"Graph Valid Tree","difficulty":"Medium","pattern":"Union-Find/DFS","topic":"Graphs","lesson":{"description":"Check if an undirected graph on n≥1 vertices is a tree.","example":"5,[[0,1],[0,2],[0,3],[1,4]] → True","hint":"A tree is connected and has exactly n-1 edges.","reason":"Check edge count first, then traverse from vertex zero. Connected graphs with n-1 edges cannot contain a cycle.","complexity":"O(V+E) time and space.","code":"def solve(n,edges):\n    if len(edges)!=n-1: return False\n    adj=[[] for _ in range(n)]\n    for a,b in edges: adj[a].append(b); adj[b].append(a)\n    seen={0}; st=[0]\n    while st:\n        for v in adj[st.pop()]:\n            if v not in seen: seen.add(v); st.append(v)\n    return len(seen)==n","tests":"assert solve(5,[[0,1],[0,2],[0,3],[1,4]]); assert not solve(4,[[0,1],[1,2],[2,0]])","models":"","full":"def solve(n,edges):\n    if len(edges)!=n-1: return False\n    adj=[[] for _ in range(n)]\n    for a,b in edges: adj[a].append(b); adj[b].append(a)\n    seen={0}; st=[0]\n    while st:\n        for v in adj[st.pop()]:\n            if v not in seen: seen.add(v); st.append(v)\n    return len(seen)==n\n\n# Example and boundary checks\nassert solve(5,[[0,1],[0,2],[0,3],[1,4]]); assert not solve(4,[[0,1],[1,2],[2,0]])\nprint(\"Sample checks passed\")\n","canonical":72}},{"id":73,"name":"Word Ladder","difficulty":"Hard","pattern":"BFS","topic":"Graphs","lesson":{"description":"Find shortest word transformation sequence length from begin to end, changing one lowercase letter at a time; intermediate and end words must be in dictionary. Return 0 if impossible.","example":"'hit','cog',['hot','dot','dog','lot','log','cog'] → 5","hint":"Words form an unweighted graph.","reason":"BFS explores increasing sequence lengths. Generate all one-letter neighbors and remove dictionary entries when queued to avoid duplicate work.","complexity":"O(26 NL²) time including Python string construction; O(NL) space for N words length L.","code":"from collections import deque\nfrom string import ascii_lowercase\ndef solve(begin,end,words):\n    if begin==end: return 1\n    todo=set(words); todo.discard(begin); q=deque([(begin,1)])\n    while q:\n        w,d=q.popleft()\n        for i in range(len(w)):\n            for c in ascii_lowercase:\n                v=w[:i]+c+w[i+1:]\n                if v in todo:\n                    if v==end: return d+1\n                    todo.remove(v); q.append((v,d+1))\n    return 0","tests":"assert solve('hit','cog',['hot','dot','dog','lot','log','cog'])==5; assert solve('hit','cog',['hot'])==0","models":"","full":"from collections import deque\nfrom string import ascii_lowercase\ndef solve(begin,end,words):\n    if begin==end: return 1\n    todo=set(words); todo.discard(begin); q=deque([(begin,1)])\n    while q:\n        w,d=q.popleft()\n        for i in range(len(w)):\n            for c in ascii_lowercase:\n                v=w[:i]+c+w[i+1:]\n                if v in todo:\n                    if v==end: return d+1\n                    todo.remove(v); q.append((v,d+1))\n    return 0\n\n# Example and boundary checks\nassert solve('hit','cog',['hot','dot','dog','lot','log','cog'])==5; assert solve('hit','cog',['hot'])==0\nprint(\"Sample checks passed\")\n","canonical":73}},{"id":74,"name":"Alien Dictionary","difficulty":"Hard","pattern":"Topological sort","topic":"Graphs","lesson":{"description":"Infer any valid character order from words sorted in an unknown alphabet, or empty if impossible.","example":"['wrt','wrf','er','ett','rftt'] → 'wertf'","hint":"Only first differing characters between adjacent words imply an edge.","reason":"Adjacent words determine precedence constraints; a longer word before its own prefix is invalid. Topologically sort the unique edges; a cycle means no alphabet fits.","complexity":"O(C+V+E) time, O(V+E) space, C total characters.","code":"from collections import deque\ndef solve(words):\n    adj={c:set() for w in words for c in w}; deg=dict.fromkeys(adj,0)\n    for a,b in zip(words,words[1:]):\n        for x,y in zip(a,b):\n            if x!=y:\n                if y not in adj[x]: adj[x].add(y); deg[y]+=1\n                break\n        else:\n            if len(a)>len(b): return ''\n    q=deque(c for c in deg if not deg[c]); out=[]\n    while q:\n        x=q.popleft(); out.append(x)\n        for y in adj[x]:\n            deg[y]-=1\n            if not deg[y]: q.append(y)\n    return ''.join(out) if len(out)==len(adj) else ''","tests":"assert solve(['wrt','wrf','er','ett','rftt'])=='wertf'; assert solve(['abc','ab'])==''","models":"","full":"from collections import deque\ndef solve(words):\n    adj={c:set() for w in words for c in w}; deg=dict.fromkeys(adj,0)\n    for a,b in zip(words,words[1:]):\n        for x,y in zip(a,b):\n            if x!=y:\n                if y not in adj[x]: adj[x].add(y); deg[y]+=1\n                break\n        else:\n            if len(a)>len(b): return ''\n    q=deque(c for c in deg if not deg[c]); out=[]\n    while q:\n        x=q.popleft(); out.append(x)\n        for y in adj[x]:\n            deg[y]-=1\n            if not deg[y]: q.append(y)\n    return ''.join(out) if len(out)==len(adj) else ''\n\n# Example and boundary checks\nassert solve(['wrt','wrf','er','ett','rftt'])=='wertf'; assert solve(['abc','ab'])==''\nprint(\"Sample checks passed\")\n","canonical":74}},{"id":75,"name":"Cheapest Flights K Stops","difficulty":"Medium","pattern":"Bellman-Ford","topic":"Graphs","lesson":{"description":"Find cheapest route src→dst in directed weighted flight graph with at most k intermediate stops, or -1. Weights nonnegative.","example":"3,[[0,1,100],[1,2,100],[0,2,500]],0,2,1 → 200","hint":"Limit relaxation to k+1 edges.","reason":"Each Bellman-Ford round reads only the previous distances, so it can add at most one edge. Copying prevents a round from using several new edges.","complexity":"O((k+1)(V+E)) time, O(V) space.","code":"def solve(n,flights,src,dst,k):\n    dist=[float('inf')]*n; dist[src]=0\n    for _ in range(k+1):\n        nxt=dist[:]\n        for a,b,w in flights: nxt[b]=min(nxt[b],dist[a]+w)\n        dist=nxt\n    return -1 if dist[dst]==float('inf') else dist[dst]","tests":"assert solve(3,[[0,1,100],[1,2,100],[0,2,500]],0,2,1)==200; assert solve(3,[[0,1,100],[1,2,100],[0,2,500]],0,2,0)==500","models":"","full":"def solve(n,flights,src,dst,k):\n    dist=[float('inf')]*n; dist[src]=0\n    for _ in range(k+1):\n        nxt=dist[:]\n        for a,b,w in flights: nxt[b]=min(nxt[b],dist[a]+w)\n        dist=nxt\n    return -1 if dist[dst]==float('inf') else dist[dst]\n\n# Example and boundary checks\nassert solve(3,[[0,1,100],[1,2,100],[0,2,500]],0,2,1)==200; assert solve(3,[[0,1,100],[1,2,100],[0,2,500]],0,2,0)==500\nprint(\"Sample checks passed\")\n","canonical":75}},{"id":76,"name":"Network Delay Time","difficulty":"Medium","pattern":"Dijkstra","topic":"Graphs","lesson":{"description":"Given directed nonnegative travel times on nodes 1..n, return time until signal from k reaches every node, or -1.","example":"[[2,1,1],[2,3,1],[3,4,1]],4,2 → 2","hint":"Find all shortest distances with Dijkstra.","reason":"A min-heap settles the smallest tentative distance; nonnegative edges guarantee it cannot improve afterwards. The last settled distance is maximum delay.","complexity":"O((V+E) log(E+1)) time, O(V+E) space.","code":"from heapq import heappush,heappop\ndef solve(times,n,k):\n    adj=[[] for _ in range(n+1)]\n    for a,b,w in times: adj[a].append((b,w))\n    q=[(0,k)]; seen=set(); d=0\n    while q:\n        d,u=heappop(q)\n        if u in seen: continue\n        seen.add(u)\n        if len(seen)==n: return d\n        for v,w in adj[u]:\n            if v not in seen: heappush(q,(d+w,v))\n    return -1","tests":"assert solve([[2,1,1],[2,3,1],[3,4,1]],4,2)==2; assert solve([],2,1)==-1","models":"","full":"from heapq import heappush,heappop\ndef solve(times,n,k):\n    adj=[[] for _ in range(n+1)]\n    for a,b,w in times: adj[a].append((b,w))\n    q=[(0,k)]; seen=set(); d=0\n    while q:\n        d,u=heappop(q)\n        if u in seen: continue\n        seen.add(u)\n        if len(seen)==n: return d\n        for v,w in adj[u]:\n            if v not in seen: heappush(q,(d+w,v))\n    return -1\n\n# Example and boundary checks\nassert solve([[2,1,1],[2,3,1],[3,4,1]],4,2)==2; assert solve([],2,1)==-1\nprint(\"Sample checks passed\")\n","canonical":76}},{"id":77,"name":"Swim in Rising Water","difficulty":"Hard","pattern":"Dijkstra/Binary Search","topic":"Graphs","lesson":{"description":"On a nonempty square elevation grid, reach bottom-right from top-left with four-direction moves; minimum time is the minimum possible maximum elevation along a path.","example":"[[0,2],[1,3]] → 3","hint":"Replace additive path cost with maximum so far.","reason":"A min-heap extracts the smallest bottleneck cost. Extending a path cannot decrease that cost, so the first finalized destination is optimal.","complexity":"O(n² log n) time, O(n²) space.","code":"from heapq import heappush,heappop\ndef solve(g):\n    n=len(g); q=[(g[0][0],0,0)]; seen=set()\n    while q:\n        t,i,j=heappop(q)\n        if (i,j) in seen: continue\n        seen.add((i,j))\n        if (i,j)==(n-1,n-1): return t\n        for x,y in [(i+1,j),(i-1,j),(i,j+1),(i,j-1)]:\n            if 0<=x<n and 0<=y<n and (x,y) not in seen: heappush(q,(max(t,g[x][y]),x,y))","tests":"assert solve([[0,2],[1,3]])==3; assert solve([[0]])==0","models":"","full":"from heapq import heappush,heappop\ndef solve(g):\n    n=len(g); q=[(g[0][0],0,0)]; seen=set()\n    while q:\n        t,i,j=heappop(q)\n        if (i,j) in seen: continue\n        seen.add((i,j))\n        if (i,j)==(n-1,n-1): return t\n        for x,y in [(i+1,j),(i-1,j),(i,j+1),(i,j-1)]:\n            if 0<=x<n and 0<=y<n and (x,y) not in seen: heappush(q,(max(t,g[x][y]),x,y))\n\n# Example and boundary checks\nassert solve([[0,2],[1,3]])==3; assert solve([[0]])==0\nprint(\"Sample checks passed\")\n","canonical":77}},{"id":78,"name":"Climbing Stairs","difficulty":"Easy","pattern":"Linear DP","topic":"Dynamic Programming","lesson":{"description":"Count ways to climb n steps using jumps of one or two, with one way to climb zero steps.","example":"5 → 8","hint":"The last jump determines the recurrence.","reason":"Every path to step i ends with a jump from i-1 or i-2. Those two sets are disjoint; add their counts.","complexity":"O(n) time, O(1) space.","code":"def solve(n):\n    a,b=1,1\n    for _ in range(n): a,b=b,a+b\n    return a","tests":"assert solve(5)==8; assert solve(0)==1","models":"","full":"def solve(n):\n    a,b=1,1\n    for _ in range(n): a,b=b,a+b\n    return a\n\n# Example and boundary checks\nassert solve(5)==8; assert solve(0)==1\nprint(\"Sample checks passed\")\n","canonical":78}},{"id":79,"name":"House Robber","difficulty":"Medium","pattern":"Linear DP","topic":"Dynamic Programming","lesson":{"description":"Maximize money robbed from nonnegative house values in a row without robbing adjacent houses.","example":"[2,7,9,3,1] → 12","hint":"Choose skip versus take.","reason":"At each house, skipping preserves the best previous result; taking adds its value to the best result two positions back.","complexity":"O(n) time, O(1) space.","code":"def solve(a):\n    prev,cur=0,0\n    for x in a: prev,cur=cur,max(cur,prev+x)\n    return cur","tests":"assert solve([2,7,9,3,1])==12; assert solve([])==0","models":"","full":"def solve(a):\n    prev,cur=0,0\n    for x in a: prev,cur=cur,max(cur,prev+x)\n    return cur\n\n# Example and boundary checks\nassert solve([2,7,9,3,1])==12; assert solve([])==0\nprint(\"Sample checks passed\")\n","canonical":79}},{"id":80,"name":"House Robber II","difficulty":"Medium","pattern":"Linear DP circular","topic":"Dynamic Programming","lesson":{"description":"Maximize robbery money in a circular row of houses, where first and last are adjacent.","example":"[2,3,2] → 3","hint":"Solve two linear ranges.","reason":"A valid choice cannot contain both endpoints, so every solution excludes the first or the last. Take the better linear result.","complexity":"O(n) time, O(1) auxiliary space.","code":"def solve(a):\n    if len(a)<=1: return sum(a)\n    def rob(l,r):\n        prev=cur=0\n        for i in range(l,r): prev,cur=cur,max(cur,prev+a[i])\n        return cur\n    return max(rob(0,len(a)-1),rob(1,len(a)))","tests":"assert solve([2,3,2])==3; assert solve([1,2,3,1])==4","models":"","full":"def solve(a):\n    if len(a)<=1: return sum(a)\n    def rob(l,r):\n        prev=cur=0\n        for i in range(l,r): prev,cur=cur,max(cur,prev+a[i])\n        return cur\n    return max(rob(0,len(a)-1),rob(1,len(a)))\n\n# Example and boundary checks\nassert solve([2,3,2])==3; assert solve([1,2,3,1])==4\nprint(\"Sample checks passed\")\n","canonical":80}},{"id":81,"name":"Longest Palindromic Substring","difficulty":"Medium","pattern":"2D DP","topic":"Dynamic Programming","lesson":{"description":"Return any longest palindromic substring using dynamic programming rather than center expansion.","example":"'cbbd' → 'bb'","hint":"A substring is palindrome if its ends match and its interior is palindrome.","reason":"Fill intervals from shorter to longer (or reverse start index). The recurrence reuses the interior state; track the longest true interval.","complexity":"O(n²) time and space.","code":"def solve(s):\n    n=len(s); dp=[[False]*n for _ in range(n)]; start=size=0\n    for i in range(n-1,-1,-1):\n        for j in range(i,n):\n            dp[i][j]=s[i]==s[j] and (j-i<2 or dp[i+1][j-1])\n            if dp[i][j] and j-i+1>size: start,size=i,j-i+1\n    return s[start:start+size]","tests":"assert solve('cbbd')=='bb'; assert solve('babad') in ('bab','aba')","models":"","full":"def solve(s):\n    n=len(s); dp=[[False]*n for _ in range(n)]; start=size=0\n    for i in range(n-1,-1,-1):\n        for j in range(i,n):\n            dp[i][j]=s[i]==s[j] and (j-i<2 or dp[i+1][j-1])\n            if dp[i][j] and j-i+1>size: start,size=i,j-i+1\n    return s[start:start+size]\n\n# Example and boundary checks\nassert solve('cbbd')=='bb'; assert solve('babad') in ('bab','aba')\nprint(\"Sample checks passed\")\n","canonical":81}},{"id":82,"name":"Palindromic Substrings","difficulty":"Medium","pattern":"2D DP","topic":"Dynamic Programming","lesson":{"description":"Count palindromic substrings using an interval DP table, counting each occurrence separately.","example":"'aaa' → 6","hint":"Reuse the palindrome status of the interior.","reason":"A length-one interval is always a palindrome; longer intervals require matching endpoints and a palindromic interior, except length two needs only matching endpoints.","complexity":"O(n²) time and space.","code":"def solve(s):\n    n=len(s); dp=[[False]*n for _ in range(n)]; total=0\n    for i in range(n-1,-1,-1):\n        for j in range(i,n):\n            dp[i][j]=s[i]==s[j] and (j-i<2 or dp[i+1][j-1])\n            total+=dp[i][j]\n    return total","tests":"assert solve('aaa')==6; assert solve('')==0","models":"","full":"def solve(s):\n    n=len(s); dp=[[False]*n for _ in range(n)]; total=0\n    for i in range(n-1,-1,-1):\n        for j in range(i,n):\n            dp[i][j]=s[i]==s[j] and (j-i<2 or dp[i+1][j-1])\n            total+=dp[i][j]\n    return total\n\n# Example and boundary checks\nassert solve('aaa')==6; assert solve('')==0\nprint(\"Sample checks passed\")\n","canonical":82}},{"id":83,"name":"Decode Ways","difficulty":"Medium","pattern":"Linear DP","topic":"Dynamic Programming","lesson":{"description":"Count decodings of a nonempty digit string using mappings 1→A through 26→Z. Zero alone is invalid.","example":"'226' → 3; '06' → 0","hint":"Look at one-digit and two-digit endings.","reason":"A valid final digit extends decodings one position back; a pair 10..26 extends those two positions back. Add both possibilities.","complexity":"O(n) time, O(1) space.","code":"def solve(s):\n    if not s: return 0\n    a,b=1,int(s[0]!='0')\n    for i in range(1,len(s)):\n        a,b=b,(b if s[i]!='0' else 0)+(a if 10<=int(s[i-1:i+1])<=26 else 0)\n    return b","tests":"assert solve('226')==3; assert solve('06')==0; assert solve('10')==1","models":"","full":"def solve(s):\n    if not s: return 0\n    a,b=1,int(s[0]!='0')\n    for i in range(1,len(s)):\n        a,b=b,(b if s[i]!='0' else 0)+(a if 10<=int(s[i-1:i+1])<=26 else 0)\n    return b\n\n# Example and boundary checks\nassert solve('226')==3; assert solve('06')==0; assert solve('10')==1\nprint(\"Sample checks passed\")\n","canonical":83}},{"id":84,"name":"Coin Change","difficulty":"Medium","pattern":"Unbounded knapsack","topic":"Dynamic Programming","lesson":{"description":"Given positive coin denominations with unlimited supply, return fewest coins summing to nonnegative amount, or -1.","example":"[1,2,5],11 → 3","hint":"Think of the last coin in an optimal solution.","reason":"For amount x, every valid solution ends with some coin c and an optimal solution for x-c. Compute amounts in ascending order; unreachable states remain infinite.","complexity":"O(amount × coin count) time, O(amount) space.","code":"def solve(coins,amount):\n    dp=[0]+[float('inf')]*amount\n    for x in range(1,amount+1):\n        for c in coins:\n            if c<=x: dp[x]=min(dp[x],dp[x-c]+1)\n    return -1 if dp[amount]==float('inf') else dp[amount]","tests":"assert solve([1,2,5],11)==3; assert solve([2],3)==-1","models":"","full":"def solve(coins,amount):\n    dp=[0]+[float('inf')]*amount\n    for x in range(1,amount+1):\n        for c in coins:\n            if c<=x: dp[x]=min(dp[x],dp[x-c]+1)\n    return -1 if dp[amount]==float('inf') else dp[amount]\n\n# Example and boundary checks\nassert solve([1,2,5],11)==3; assert solve([2],3)==-1\nprint(\"Sample checks passed\")\n","canonical":84}},{"id":85,"name":"Maximum Product Subarray","difficulty":"Medium","pattern":"Kadane variant","topic":"Dynamic Programming","lesson":{"description":"Find the maximum product of a nonempty contiguous subarray.","example":"[2,3,-2,4] → 6","hint":"A negative number swaps the roles of min and max.","reason":"Maintain both extremes of products ending at each position. Multiplying a negative by the previous minimum may create the new maximum; starting fresh handles zeros.","complexity":"O(n) time, O(1) space.","code":"def solve(nums):\n    lo = hi = best = nums[0]\n    for x in nums[1:]:\n        lo,hi = min(x,x*lo,x*hi),max(x,x*lo,x*hi)\n        best = max(best,hi)\n    return best","tests":"assert solve([2,3,-2,4])==6; assert solve([-2,3,-4])==24","models":"","full":"def solve(nums):\n    lo = hi = best = nums[0]\n    for x in nums[1:]:\n        lo,hi = min(x,x*lo,x*hi),max(x,x*lo,x*hi)\n        best = max(best,hi)\n    return best\n\n# Example and boundary checks\nassert solve([2,3,-2,4])==6; assert solve([-2,3,-4])==24\nprint(\"Sample checks passed\")\n","canonical":6}},{"id":86,"name":"Word Break","difficulty":"Medium","pattern":"Linear DP","topic":"Dynamic Programming","lesson":{"description":"Determine whether s can be segmented into a sequence of dictionary words; words may be reused.","example":"'leetcode',['leet','code'] → True","hint":"Track which prefixes can be segmented.","reason":"A reachable prefix i extends to i+len(w) whenever w matches at i. Reachability of the final prefix gives the answer.","complexity":"O(n × sum of word lengths) worst-case time, O(n) auxiliary space.","code":"def solve(s,words):\n    dp=[False]*(len(s)+1); dp[0]=True\n    for i in range(len(s)):\n        if dp[i]:\n            for w in words:\n                if s.startswith(w,i): dp[i+len(w)]=True\n    return dp[-1]","tests":"assert solve('leetcode',['leet','code']); assert not solve('catsandog',['cats','dog','sand','and','cat'])","models":"","full":"def solve(s,words):\n    dp=[False]*(len(s)+1); dp[0]=True\n    for i in range(len(s)):\n        if dp[i]:\n            for w in words:\n                if s.startswith(w,i): dp[i+len(w)]=True\n    return dp[-1]\n\n# Example and boundary checks\nassert solve('leetcode',['leet','code']); assert not solve('catsandog',['cats','dog','sand','and','cat'])\nprint(\"Sample checks passed\")\n","canonical":86}},{"id":87,"name":"Longest Increasing Subsequence","difficulty":"Medium","pattern":"Patience sorting","topic":"Dynamic Programming","lesson":{"description":"Find length of longest strictly increasing subsequence (not necessarily contiguous).","example":"[10,9,2,5,3,7,101,18] → 4","hint":"Store smallest possible tail for each subsequence length.","reason":"Replacing the first tail ≥ x preserves the length while making future extension easier. If no tail is ≥ x, extend the longest length.","complexity":"O(n log n) time, O(n) space.","code":"from bisect import bisect_left\ndef solve(a):\n    tails=[]\n    for x in a:\n        i=bisect_left(tails,x)\n        if i==len(tails): tails.append(x)\n        else: tails[i]=x\n    return len(tails)","tests":"assert solve([10,9,2,5,3,7,101,18])==4; assert solve([2,2])==1","models":"","full":"from bisect import bisect_left\ndef solve(a):\n    tails=[]\n    for x in a:\n        i=bisect_left(tails,x)\n        if i==len(tails): tails.append(x)\n        else: tails[i]=x\n    return len(tails)\n\n# Example and boundary checks\nassert solve([10,9,2,5,3,7,101,18])==4; assert solve([2,2])==1\nprint(\"Sample checks passed\")\n","canonical":87}},{"id":88,"name":"Partition Equal Subset Sum","difficulty":"Medium","pattern":"0/1 Knapsack","topic":"Dynamic Programming","lesson":{"description":"Determine whether positive integers can be split into two subsets of equal sum.","example":"[1,5,11,5] → True","hint":"Reduce to subset sum of half the total.","reason":"Maintain reachable sums up to target. Iterate sums backwards so a new item cannot be reused during the same update.","complexity":"O(nT) time, O(T) space, T half the sum.","code":"def solve(a):\n    total=sum(a)\n    if total%2: return False\n    t=total//2; dp=[True]+[False]*t\n    for x in a:\n        for j in range(t,x-1,-1): dp[j]=dp[j] or dp[j-x]\n    return dp[t]","tests":"assert solve([1,5,11,5]); assert not solve([1,2,3,5])","models":"","full":"def solve(a):\n    total=sum(a)\n    if total%2: return False\n    t=total//2; dp=[True]+[False]*t\n    for x in a:\n        for j in range(t,x-1,-1): dp[j]=dp[j] or dp[j-x]\n    return dp[t]\n\n# Example and boundary checks\nassert solve([1,5,11,5]); assert not solve([1,2,3,5])\nprint(\"Sample checks passed\")\n","canonical":88}},{"id":89,"name":"Unique Paths","difficulty":"Medium","pattern":"Grid DP","topic":"Dynamic Programming","lesson":{"description":"Count paths from top-left to bottom-right of an m×n grid, moving only right or down; m,n≥1.","example":"3,7 → 28","hint":"Paths arrive from above or left.","reason":"Each cell's count is the sum of its top and left neighbors. A one-dimensional row keeps exactly the required previous states.","complexity":"O(mn) time, O(n) space.","code":"def solve(m,n):\n    dp=[1]*n\n    for _ in range(m-1):\n        for j in range(1,n): dp[j]+=dp[j-1]\n    return dp[-1]","tests":"assert solve(3,7)==28; assert solve(1,1)==1","models":"","full":"def solve(m,n):\n    dp=[1]*n\n    for _ in range(m-1):\n        for j in range(1,n): dp[j]+=dp[j-1]\n    return dp[-1]\n\n# Example and boundary checks\nassert solve(3,7)==28; assert solve(1,1)==1\nprint(\"Sample checks passed\")\n","canonical":89}},{"id":90,"name":"Unique Paths II","difficulty":"Medium","pattern":"Grid DP","topic":"Dynamic Programming","lesson":{"description":"Count right/down paths in a rectangular 0/1 grid where 1 marks an obstacle.","example":"[[0,0,0],[0,1,0],[0,0,0]] → 2","hint":"An obstacle has zero reachable paths.","reason":"Update row counts with top plus left except at obstacles, where reset to zero. Initialize the virtual incoming path to the start.","complexity":"O(mn) time, O(n) space.","code":"def solve(g):\n    if not g or not g[0]: return 0\n    dp=[1]+[0]*(len(g[0])-1)\n    for row in g:\n        for j,x in enumerate(row):\n            dp[j]=0 if x else dp[j]+(dp[j-1] if j else 0)\n    return dp[-1]","tests":"assert solve([[0,0,0],[0,1,0],[0,0,0]])==2; assert solve([[1]])==0","models":"","full":"def solve(g):\n    if not g or not g[0]: return 0\n    dp=[1]+[0]*(len(g[0])-1)\n    for row in g:\n        for j,x in enumerate(row):\n            dp[j]=0 if x else dp[j]+(dp[j-1] if j else 0)\n    return dp[-1]\n\n# Example and boundary checks\nassert solve([[0,0,0],[0,1,0],[0,0,0]])==2; assert solve([[1]])==0\nprint(\"Sample checks passed\")\n","canonical":90}},{"id":91,"name":"Minimum Path Sum","difficulty":"Medium","pattern":"Grid DP","topic":"Dynamic Programming","lesson":{"description":"Find minimum sum of cells along a right/down path through a nonempty grid of nonnegative costs.","example":"[[1,3,1],[1,5,1],[4,2,1]] → 7","hint":"Choose the cheaper predecessor.","reason":"Every path reaches a cell from above or left; add the cell value to the cheaper accumulated cost. Infinity blocks nonexistent predecessors.","complexity":"O(mn) time, O(n) space.","code":"def solve(g):\n    dp=[0]+[float('inf')]*(len(g[0])-1)\n    for row in g:\n        for j,x in enumerate(row): dp[j]=x+min(dp[j],dp[j-1] if j else float('inf'))\n    return dp[-1]","tests":"assert solve([[1,3,1],[1,5,1],[4,2,1]])==7","models":"","full":"def solve(g):\n    dp=[0]+[float('inf')]*(len(g[0])-1)\n    for row in g:\n        for j,x in enumerate(row): dp[j]=x+min(dp[j],dp[j-1] if j else float('inf'))\n    return dp[-1]\n\n# Example and boundary checks\nassert solve([[1,3,1],[1,5,1],[4,2,1]])==7\nprint(\"Sample checks passed\")\n","canonical":91}},{"id":92,"name":"Longest Common Subsequence","difficulty":"Medium","pattern":"2D DP","topic":"Dynamic Programming","lesson":{"description":"Return length of longest common subsequence of two strings.","example":"'abcde','ace' → 3","hint":"Matching final characters can extend an optimal shorter solution.","reason":"If characters match, use diagonal plus one; otherwise skip one ending character and take the maximum. Each DP cell solves a prefix pair.","complexity":"O(mn) time, O(n) space.","code":"def solve(a,b):\n    dp=[0]*(len(b)+1)\n    for x in a:\n        old=dp[:]\n        for j,y in enumerate(b,1): dp[j]=old[j-1]+1 if x==y else max(old[j],dp[j-1])\n    return dp[-1]","tests":"assert solve('abcde','ace')==3; assert solve('','a')==0","models":"","full":"def solve(a,b):\n    dp=[0]*(len(b)+1)\n    for x in a:\n        old=dp[:]\n        for j,y in enumerate(b,1): dp[j]=old[j-1]+1 if x==y else max(old[j],dp[j-1])\n    return dp[-1]\n\n# Example and boundary checks\nassert solve('abcde','ace')==3; assert solve('','a')==0\nprint(\"Sample checks passed\")\n","canonical":92}},{"id":93,"name":"Edit Distance","difficulty":"Hard","pattern":"2D DP","topic":"Dynamic Programming","lesson":{"description":"Return minimum insertions, deletions and substitutions (unit cost) to transform one string into another.","example":"'horse','ros' → 3","hint":"Compare prefixes and their final characters.","reason":"Equal ends incur no edit. Otherwise choose the cheapest of inserting, deleting or replacing; these correspond to left, up and diagonal DP neighbors.","complexity":"O(mn) time, O(n) space.","code":"def solve(a,b):\n    dp=list(range(len(b)+1))\n    for i,x in enumerate(a,1):\n        old=dp[:]; dp[0]=i\n        for j,y in enumerate(b,1): dp[j]=old[j-1] if x==y else 1+min(old[j],dp[j-1],old[j-1])\n    return dp[-1]","tests":"assert solve('horse','ros')==3; assert solve('','abc')==3","models":"","full":"def solve(a,b):\n    dp=list(range(len(b)+1))\n    for i,x in enumerate(a,1):\n        old=dp[:]; dp[0]=i\n        for j,y in enumerate(b,1): dp[j]=old[j-1] if x==y else 1+min(old[j],dp[j-1],old[j-1])\n    return dp[-1]\n\n# Example and boundary checks\nassert solve('horse','ros')==3; assert solve('','abc')==3\nprint(\"Sample checks passed\")\n","canonical":93}},{"id":94,"name":"Regular Expression Matching","difficulty":"Hard","pattern":"2D DP","topic":"Dynamic Programming","lesson":{"description":"Match the whole string against a valid pattern where '.' matches any one character and '*' repeats the preceding atom zero or more times.","example":"'aab','c*a*b' → True","hint":"At a star, either skip the atom-star pair or consume one matching character.","reason":"Memoize suffix positions. A star creates two exhaustive branches: zero copies or consume one copy and remain at the same pattern position. Normal atoms consume exactly one character.","complexity":"O(mn) time and memo space, O(m+n) stack.","code":"from functools import lru_cache\ndef solve(s,p):\n    @lru_cache(None)\n    def f(i,j):\n        if j==len(p): return i==len(s)\n        match=i<len(s) and (p[j]=='.' or p[j]==s[i])\n        if j+1<len(p) and p[j+1]=='*': return f(i,j+2) or (match and f(i+1,j))\n        return match and f(i+1,j+1)\n    return f(0,0)","tests":"assert solve('aab','c*a*b'); assert not solve('mississippi','mis*is*p*.'); assert solve('','a*')","models":"","full":"from functools import lru_cache\ndef solve(s,p):\n    @lru_cache(None)\n    def f(i,j):\n        if j==len(p): return i==len(s)\n        match=i<len(s) and (p[j]=='.' or p[j]==s[i])\n        if j+1<len(p) and p[j+1]=='*': return f(i,j+2) or (match and f(i+1,j))\n        return match and f(i+1,j+1)\n    return f(0,0)\n\n# Example and boundary checks\nassert solve('aab','c*a*b'); assert not solve('mississippi','mis*is*p*.'); assert solve('','a*')\nprint(\"Sample checks passed\")\n","canonical":94}},{"id":95,"name":"Burst Balloons","difficulty":"Hard","pattern":"Interval DP","topic":"Dynamic Programming","lesson":{"description":"Burst all balloons, earning left×current×right for each burst using its remaining neighbors (outside boundaries are 1). Maximize total for nonnegative values.","example":"[3,1,5,8] → 167","hint":"Choose the last balloon burst in an interval.","reason":"The last burst sees fixed interval boundaries, independent of order inside each side. Combine optimal left and right subintervals with that last burst's reward.","complexity":"O(n³) time, O(n²) space.","code":"def solve(nums):\n    a=[1]+nums+[1]; n=len(a); dp=[[0]*n for _ in a]\n    for gap in range(2,n):\n        for l in range(n-gap):\n            r=l+gap\n            dp[l][r]=max(dp[l][k]+dp[k][r]+a[l]*a[k]*a[r] for k in range(l+1,r))\n    return dp[0][-1]","tests":"assert solve([3,1,5,8])==167; assert solve([])==0","models":"","full":"def solve(nums):\n    a=[1]+nums+[1]; n=len(a); dp=[[0]*n for _ in a]\n    for gap in range(2,n):\n        for l in range(n-gap):\n            r=l+gap\n            dp[l][r]=max(dp[l][k]+dp[k][r]+a[l]*a[k]*a[r] for k in range(l+1,r))\n    return dp[0][-1]\n\n# Example and boundary checks\nassert solve([3,1,5,8])==167; assert solve([])==0\nprint(\"Sample checks passed\")\n","canonical":95}},{"id":96,"name":"Interleaving String","difficulty":"Hard","pattern":"2D DP","topic":"Dynamic Programming","lesson":{"description":"Determine if string c is formed by interleaving a and b while preserving the order within each.","example":"'aabcc','dbbca','aadbbcbcac' → True","hint":"The next character must come from one of two prefixes.","reason":"For prefix lengths i,j, the target position is i+j-1. Reachability follows from a matching character and a reachable predecessor from either source.","complexity":"O(mn) time, O(n) space.","code":"def solve(a,b,c):\n    if len(a)+len(b)!=len(c): return False\n    dp=[True]+[False]*len(b)\n    for i in range(len(a)+1):\n        for j in range(len(b)+1):\n            if i==j==0: continue\n            k=i+j-1\n            dp[j]=(i>0 and dp[j] and a[i-1]==c[k]) or (j>0 and dp[j-1] and b[j-1]==c[k])\n    return dp[-1]","tests":"assert solve('aabcc','dbbca','aadbbcbcac'); assert not solve('aabcc','dbbca','aadbbbaccc')","models":"","full":"def solve(a,b,c):\n    if len(a)+len(b)!=len(c): return False\n    dp=[True]+[False]*len(b)\n    for i in range(len(a)+1):\n        for j in range(len(b)+1):\n            if i==j==0: continue\n            k=i+j-1\n            dp[j]=(i>0 and dp[j] and a[i-1]==c[k]) or (j>0 and dp[j-1] and b[j-1]==c[k])\n    return dp[-1]\n\n# Example and boundary checks\nassert solve('aabcc','dbbca','aadbbcbcac'); assert not solve('aabcc','dbbca','aadbbbaccc')\nprint(\"Sample checks passed\")\n","canonical":96}},{"id":97,"name":"Distinct Subsequences","difficulty":"Hard","pattern":"2D DP","topic":"Dynamic Programming","lesson":{"description":"Count distinct index selections in s whose resulting subsequence equals t.","example":"'rabbbit','rabbit' → 3","hint":"For each source character, choose use or ignore.","reason":"dp[j] counts ways to form the first j target characters. A matching source character adds dp[j-1]; iterate backwards to avoid using it more than once.","complexity":"O(mn) time, O(n) space.","code":"def solve(s,t):\n    dp=[1]+[0]*len(t)\n    for c in s:\n        for j in range(len(t),0,-1):\n            if c==t[j-1]: dp[j]+=dp[j-1]\n    return dp[-1]","tests":"assert solve('rabbbit','rabbit')==3; assert solve('a','')==1","models":"","full":"def solve(s,t):\n    dp=[1]+[0]*len(t)\n    for c in s:\n        for j in range(len(t),0,-1):\n            if c==t[j-1]: dp[j]+=dp[j-1]\n    return dp[-1]\n\n# Example and boundary checks\nassert solve('rabbbit','rabbit')==3; assert solve('a','')==1\nprint(\"Sample checks passed\")\n","canonical":97}},{"id":98,"name":"Maximum Subarray","difficulty":"Medium","pattern":"Kadane","topic":"Greedy Algorithms","lesson":{"description":"Return the largest sum of a nonempty contiguous subarray.","example":"[-2,1,-3,4,-1,2,1,-5,4] → 6","hint":"At each index, extend or restart.","reason":"A maximum subarray ending here either starts here or extends the best ending at the preceding index. Track the global maximum, including all-negative inputs.","complexity":"O(n) time, O(1) space.","code":"def solve(nums):\n    best = cur = nums[0]\n    for x in nums[1:]:\n        cur = max(x,cur+x); best = max(best,cur)\n    return best","tests":"assert solve([-2,1,-3,4,-1,2,1,-5,4])==6; assert solve([-5,-2])==-2","models":"","full":"def solve(nums):\n    best = cur = nums[0]\n    for x in nums[1:]:\n        cur = max(x,cur+x); best = max(best,cur)\n    return best\n\n# Example and boundary checks\nassert solve([-2,1,-3,4,-1,2,1,-5,4])==6; assert solve([-5,-2])==-2\nprint(\"Sample checks passed\")\n","canonical":5}},{"id":99,"name":"Jump Game","difficulty":"Medium","pattern":"Local max","topic":"Greedy Algorithms","lesson":{"description":"Given nonnegative maximum jump lengths, determine whether the last index is reachable from index zero.","example":"[2,3,1,1,4] → True; [3,2,1,0,4] → False","hint":"Track the farthest reachable index.","reason":"Any index at or below the current frontier is reachable. Each such index extends the frontier by its jump length. A gap cannot be crossed later.","complexity":"O(n) time, O(1) space.","code":"def solve(a):\n    reach=0\n    for i,x in enumerate(a):\n        if i>reach: return False\n        reach=max(reach,i+x)\n    return True","tests":"assert solve([2,3,1,1,4]); assert not solve([3,2,1,0,4])","models":"","full":"def solve(a):\n    reach=0\n    for i,x in enumerate(a):\n        if i>reach: return False\n        reach=max(reach,i+x)\n    return True\n\n# Example and boundary checks\nassert solve([2,3,1,1,4]); assert not solve([3,2,1,0,4])\nprint(\"Sample checks passed\")\n","canonical":99}},{"id":100,"name":"Jump Game II","difficulty":"Medium","pattern":"Greedy BFS","topic":"Greedy Algorithms","lesson":{"description":"Return minimum jumps to reach last index given nonnegative maximum jump lengths. Return -1 if unreachable.","example":"[2,3,1,1,4] → 2","hint":"Treat reachability ranges as BFS layers.","reason":"All indices up to end can be reached with the current number of jumps. Track farthest reach of that layer, then commit one jump at its boundary.","complexity":"O(n) time, O(1) space.","code":"def solve(a):\n    jumps=end=far=0\n    for i in range(len(a)-1):\n        far=max(far,i+a[i])\n        if i==end:\n            if far==end: return -1\n            jumps+=1; end=far\n            if end>=len(a)-1: return jumps\n    return jumps","tests":"assert solve([2,3,1,1,4])==2; assert solve([0,1])==-1","models":"","full":"def solve(a):\n    jumps=end=far=0\n    for i in range(len(a)-1):\n        far=max(far,i+a[i])\n        if i==end:\n            if far==end: return -1\n            jumps+=1; end=far\n            if end>=len(a)-1: return jumps\n    return jumps\n\n# Example and boundary checks\nassert solve([2,3,1,1,4])==2; assert solve([0,1])==-1\nprint(\"Sample checks passed\")\n","canonical":100}},{"id":101,"name":"Gas Station","difficulty":"Medium","pattern":"Running sum","topic":"Greedy Algorithms","lesson":{"description":"Find any gas station from which a circular route can be completed, given fuel gained and travel cost at each station, or -1.","example":"[1,2,3,4,5],[3,4,5,1,2] → 3","hint":"If a start fails at i, every station between start and i fails too.","reason":"A nonnegative partial balance before failure means starting later cannot improve the failed segment. Reset after failure; if total fuel covers total cost the final candidate works.","complexity":"O(n) time, O(1) space.","code":"def solve(gas,cost):\n    total=tank=start=0\n    for i,(g,c) in enumerate(zip(gas,cost)):\n        total+=g-c; tank+=g-c\n        if tank<0: start=i+1; tank=0\n    return start if total>=0 else -1","tests":"assert solve([1,2,3,4,5],[3,4,5,1,2])==3; assert solve([2,3,4],[3,4,3])==-1","models":"","full":"def solve(gas,cost):\n    total=tank=start=0\n    for i,(g,c) in enumerate(zip(gas,cost)):\n        total+=g-c; tank+=g-c\n        if tank<0: start=i+1; tank=0\n    return start if total>=0 else -1\n\n# Example and boundary checks\nassert solve([1,2,3,4,5],[3,4,5,1,2])==3; assert solve([2,3,4],[3,4,3])==-1\nprint(\"Sample checks passed\")\n","canonical":101}},{"id":102,"name":"Hand of Straights","difficulty":"Medium","pattern":"Greedy + HashMap","topic":"Greedy Algorithms","lesson":{"description":"Partition integer cards into groups of k consecutive values; each card used once, k≥1.","example":"[1,2,3,6,2,3,4,7,8],3 → True","hint":"The smallest remaining card must start a group.","reason":"Take all copies of the smallest unused value as group starts. Every group must contain the next k-1 values; insufficient counts make partition impossible.","complexity":"O(n+u log u+u k) upper bound time, O(u) space.","code":"from collections import Counter\ndef solve(hand,k):\n    if len(hand)%k: return False\n    c=Counter(hand)\n    for x in sorted(c):\n        n=c[x]\n        if n:\n            for y in range(x,x+k):\n                if c[y]<n: return False\n                c[y]-=n\n    return True","tests":"assert solve([1,2,3,6,2,3,4,7,8],3); assert not solve([1,2,3,4,5],4)","models":"","full":"from collections import Counter\ndef solve(hand,k):\n    if len(hand)%k: return False\n    c=Counter(hand)\n    for x in sorted(c):\n        n=c[x]\n        if n:\n            for y in range(x,x+k):\n                if c[y]<n: return False\n                c[y]-=n\n    return True\n\n# Example and boundary checks\nassert solve([1,2,3,6,2,3,4,7,8],3); assert not solve([1,2,3,4,5],4)\nprint(\"Sample checks passed\")\n","canonical":102}},{"id":103,"name":"Merge Triplets","difficulty":"Medium","pattern":"Greedy condition","topic":"Greedy Algorithms","lesson":{"description":"Given triplets, merge any chosen triplets using coordinatewise maximum. Decide whether target triplet can be obtained.","example":"[[2,5,3],[1,8,4],[1,7,5]],[2,7,5] → True","hint":"Ignore triplets exceeding any target coordinate.","reason":"Max operations cannot decrease a coordinate, so overshooting is irreversible. All safe triplets can be merged; target is reachable iff each coordinate is attained by at least one.","complexity":"O(n) time, O(1) space.","code":"def solve(triplets,target):\n    met=[False]*3\n    for t in triplets:\n        if all(x<=y for x,y in zip(t,target)):\n            for i in range(3): met[i]|=t[i]==target[i]\n    return all(met)","tests":"assert solve([[2,5,3],[1,8,4],[1,7,5]],[2,7,5]); assert not solve([[3,4,5]],[2,4,5])","models":"","full":"def solve(triplets,target):\n    met=[False]*3\n    for t in triplets:\n        if all(x<=y for x,y in zip(t,target)):\n            for i in range(3): met[i]|=t[i]==target[i]\n    return all(met)\n\n# Example and boundary checks\nassert solve([[2,5,3],[1,8,4],[1,7,5]],[2,7,5]); assert not solve([[3,4,5]],[2,4,5])\nprint(\"Sample checks passed\")\n","canonical":103}},{"id":104,"name":"Partition Labels","difficulty":"Medium","pattern":"Last occurrence","topic":"Greedy Algorithms","lesson":{"description":"Split a string into as many contiguous parts as possible so each character occurs in at most one part; return lengths.","example":"'ababcbacadefegdehijhklij' → [9,7,8]","hint":"A part must extend to the last occurrence of every character inside it.","reason":"Extend the current end to each new character's last index. The first index meeting this end is the earliest safe cut, maximizing parts.","complexity":"O(n) time, O(u) space.","code":"def solve(s):\n    last={c:i for i,c in enumerate(s)}; out=[]; start=end=0\n    for i,c in enumerate(s):\n        end=max(end,last[c])\n        if i==end: out.append(i-start+1); start=i+1\n    return out","tests":"assert solve('ababcbacadefegdehijhklij')==[9,7,8]; assert solve('')==[]","models":"","full":"def solve(s):\n    last={c:i for i,c in enumerate(s)}; out=[]; start=end=0\n    for i,c in enumerate(s):\n        end=max(end,last[c])\n        if i==end: out.append(i-start+1); start=i+1\n    return out\n\n# Example and boundary checks\nassert solve('ababcbacadefegdehijhklij')==[9,7,8]; assert solve('')==[]\nprint(\"Sample checks passed\")\n","canonical":104}},{"id":105,"name":"Valid Parenthesis String","difficulty":"Medium","pattern":"Range tracking","topic":"Greedy Algorithms","lesson":{"description":"Check if a string of '(', ')' and '*' can be balanced when each '*' means opener, closer or empty.","example":"'(*))' → True","hint":"Track min and max possible unmatched openers.","reason":"Each prefix has a contiguous range of feasible balances. Clamp minimum to zero; a negative maximum means every interpretation fails. At the end zero must be possible.","complexity":"O(n) time, O(1) space.","code":"def solve(s):\n    lo=hi=0\n    for c in s:\n        lo+=1 if c=='(' else -1\n        hi+=-1 if c==')' else 1\n        if hi<0: return False\n        lo=max(0,lo)\n    return lo==0","tests":"assert solve('(*))'); assert not solve(')*')","models":"","full":"def solve(s):\n    lo=hi=0\n    for c in s:\n        lo+=1 if c=='(' else -1\n        hi+=-1 if c==')' else 1\n        if hi<0: return False\n        lo=max(0,lo)\n    return lo==0\n\n# Example and boundary checks\nassert solve('(*))'); assert not solve(')*')\nprint(\"Sample checks passed\")\n","canonical":105}},{"id":106,"name":"Non-overlapping Intervals","difficulty":"Medium","pattern":"Sort by end","topic":"Greedy Algorithms","lesson":{"description":"Remove minimum number of nonempty intervals so remaining intervals do not overlap; touching endpoints are allowed.","example":"[[1,2],[2,3],[3,4],[1,3]] → 1","hint":"Keep the interval finishing earliest.","reason":"An earliest-finishing interval leaves at least as much room as any alternative first choice. Repeating this maximizes kept intervals; remove the rest.","complexity":"O(n log n) time, O(n) sorted copy space.","code":"def solve(intervals):\n    end=-float('inf'); kept=0\n    for a,b in sorted(intervals,key=lambda x:x[1]):\n        if a>=end: kept+=1; end=b\n    return len(intervals)-kept","tests":"assert solve([[1,2],[2,3],[3,4],[1,3]])==1","models":"","full":"def solve(intervals):\n    end=-float('inf'); kept=0\n    for a,b in sorted(intervals,key=lambda x:x[1]):\n        if a>=end: kept+=1; end=b\n    return len(intervals)-kept\n\n# Example and boundary checks\nassert solve([[1,2],[2,3],[3,4],[1,3]])==1\nprint(\"Sample checks passed\")\n","canonical":106}},{"id":107,"name":"Meeting Rooms II","difficulty":"Medium","pattern":"Sort + heap","topic":"Greedy Algorithms","lesson":{"description":"Return minimum meeting rooms needed for half-open intervals [start,end), start<end.","example":"[[0,30],[5,10],[15,20]] → 2","hint":"A heap tracks meeting end times.","reason":"If the earliest-ending room is free when the next meeting starts, reuse it. Otherwise all rooms are busy and a new one is necessary.","complexity":"O(n log n) time, O(n) space.","code":"from heapq import heappush,heapreplace\ndef solve(intervals):\n    ends=[]\n    for a,b in sorted(intervals):\n        if ends and ends[0]<=a: heapreplace(ends,b)\n        else: heappush(ends,b)\n    return len(ends)","tests":"assert solve([[0,30],[5,10],[15,20]])==2; assert solve([[1,2],[2,3]])==1","models":"","full":"from heapq import heappush,heapreplace\ndef solve(intervals):\n    ends=[]\n    for a,b in sorted(intervals):\n        if ends and ends[0]<=a: heapreplace(ends,b)\n        else: heappush(ends,b)\n    return len(ends)\n\n# Example and boundary checks\nassert solve([[0,30],[5,10],[15,20]])==2; assert solve([[1,2],[2,3]])==1\nprint(\"Sample checks passed\")\n","canonical":107}},{"id":108,"name":"Kth Largest in Array","difficulty":"Medium","pattern":"Min-heap of size k","topic":"Heaps / Priority Queues","lesson":{"description":"Return kth largest array element, counting duplicate occurrences, valid 1≤k≤n.","example":"[3,2,1,5,6,4],2 → 5","hint":"Keep a min-heap of the k largest values.","reason":"Once full, the heap root is the kth largest seen. A larger incoming value replaces it, and a smaller value cannot enter the top k.","complexity":"O(n log(k+1)) time, O(k) space.","code":"from heapq import heappush,heapreplace\ndef solve(a,k):\n    q=[]\n    for x in a:\n        if len(q)<k: heappush(q,x)\n        elif x>q[0]: heapreplace(q,x)\n    return q[0]","tests":"assert solve([3,2,1,5,6,4],2)==5; assert solve([2,2],2)==2","models":"","full":"from heapq import heappush,heapreplace\ndef solve(a,k):\n    q=[]\n    for x in a:\n        if len(q)<k: heappush(q,x)\n        elif x>q[0]: heapreplace(q,x)\n    return q[0]\n\n# Example and boundary checks\nassert solve([3,2,1,5,6,4],2)==5; assert solve([2,2],2)==2\nprint(\"Sample checks passed\")\n","canonical":108}},{"id":109,"name":"Last Stone Weight","difficulty":"Easy","pattern":"Max-heap","topic":"Heaps / Priority Queues","lesson":{"description":"Repeatedly smash two heaviest stones: equal weights vanish; otherwise keep their difference. Return final weight or zero.","example":"[2,7,4,1,8,1] → 1","hint":"Python min-heap can act as max-heap with negative weights.","reason":"Extract two largest weights, push positive difference if any. Each operation reduces count so eventually one or zero remains.","complexity":"O(n log n) time, O(n) space.","code":"from heapq import heapify,heappop,heappush\ndef solve(a):\n    q=[-x for x in a]; heapify(q)\n    while len(q)>1:\n        x,y=heappop(q),heappop(q)\n        if x!=y: heappush(q,x-y)\n    return -q[0] if q else 0","tests":"assert solve([2,7,4,1,8,1])==1; assert solve([2,2])==0","models":"","full":"from heapq import heapify,heappop,heappush\ndef solve(a):\n    q=[-x for x in a]; heapify(q)\n    while len(q)>1:\n        x,y=heappop(q),heappop(q)\n        if x!=y: heappush(q,x-y)\n    return -q[0] if q else 0\n\n# Example and boundary checks\nassert solve([2,7,4,1,8,1])==1; assert solve([2,2])==0\nprint(\"Sample checks passed\")\n","canonical":109}},{"id":110,"name":"K Closest Points to Origin","difficulty":"Medium","pattern":"Max-heap of size k","topic":"Heaps / Priority Queues","lesson":{"description":"Return any k points with smallest Euclidean distance to origin; 1≤k≤n.","example":"[[1,3],[-2,2]],1 → [[-2,2]]","hint":"Compare squared distances; avoid square roots.","reason":"A max-heap of k candidates keeps the farthest retained point at its root. Replace that point only when a closer point arrives.","complexity":"O(n log(k+1)) time, O(k) space.","code":"from heapq import heappush,heapreplace\ndef solve(points,k):\n    q=[]\n    for i,(x,y) in enumerate(points):\n        item=(-(x*x+y*y),i)\n        if len(q)<k: heappush(q,item)\n        elif item>q[0]: heapreplace(q,item)\n    return [points[i] for _,i in q]","tests":"assert solve([[1,3],[-2,2]],1)==[[-2,2]]","models":"","full":"from heapq import heappush,heapreplace\ndef solve(points,k):\n    q=[]\n    for i,(x,y) in enumerate(points):\n        item=(-(x*x+y*y),i)\n        if len(q)<k: heappush(q,item)\n        elif item>q[0]: heapreplace(q,item)\n    return [points[i] for _,i in q]\n\n# Example and boundary checks\nassert solve([[1,3],[-2,2]],1)==[[-2,2]]\nprint(\"Sample checks passed\")\n","canonical":110}},{"id":111,"name":"Kth Largest in Stream","difficulty":"Easy","pattern":"Min-heap","topic":"Heaps / Priority Queues","lesson":{"description":"Design a stream that returns kth largest value after each add; assume at least k values after each queried add.","example":"KthLargest(3,[4,5,8,2]); add(3) → 4; add(10) → 5","hint":"Reuse a size-k min-heap.","reason":"Push each new value, removing smallest when capacity is exceeded. The root remains the kth largest of all values processed.","complexity":"O(log(k+1)) per add, O(k) space.","code":"from heapq import heappush,heappop\nclass KthLargest:\n    def __init__(self,k,nums):\n        self.k=k; self.q=[]\n        for x in nums: self.add(x)\n    def add(self,x):\n        heappush(self.q,x)\n        if len(self.q)>self.k: heappop(self.q)\n        return self.q[0]","tests":"x=KthLargest(3,[4,5,8,2]); assert x.add(3)==4; assert x.add(10)==5","models":"","full":"from heapq import heappush,heappop\nclass KthLargest:\n    def __init__(self,k,nums):\n        self.k=k; self.q=[]\n        for x in nums: self.add(x)\n    def add(self,x):\n        heappush(self.q,x)\n        if len(self.q)>self.k: heappop(self.q)\n        return self.q[0]\n\n# Example and boundary checks\nx=KthLargest(3,[4,5,8,2]); assert x.add(3)==4; assert x.add(10)==5\nprint(\"Sample checks passed\")\n","canonical":111}},{"id":112,"name":"Task Scheduler","difficulty":"Medium","pattern":"Max-heap + cooldown","topic":"Heaps / Priority Queues","lesson":{"description":"Schedule unit-time tasks labeled A–Z with at least n intervening slots between equal tasks; minimize total slots including idle time.","example":"['A','A','A','B','B','B'],2 → 8","hint":"The most frequent tasks force a frame structure.","reason":"If maximum frequency is f and c tasks share it, f-1 full blocks each need n+1 slots, followed by c final tasks. Other tasks can fill idle slots or make total task count the dominant bound.","complexity":"O(N+26) time, O(26) space.","code":"from collections import Counter\ndef solve(tasks,n):\n    if not tasks: return 0\n    counts=Counter(tasks); f=max(counts.values()); c=sum(v==f for v in counts.values())\n    return max(len(tasks),(f-1)*(n+1)+c)","tests":"assert solve(['A','A','A','B','B','B'],2)==8; assert solve(['A','A'],0)==2","models":"","full":"from collections import Counter\ndef solve(tasks,n):\n    if not tasks: return 0\n    counts=Counter(tasks); f=max(counts.values()); c=sum(v==f for v in counts.values())\n    return max(len(tasks),(f-1)*(n+1)+c)\n\n# Example and boundary checks\nassert solve(['A','A','A','B','B','B'],2)==8; assert solve(['A','A'],0)==2\nprint(\"Sample checks passed\")\n","canonical":112}},{"id":113,"name":"Design Twitter","difficulty":"Medium","pattern":"Heap merge","topic":"Heaps / Priority Queues","lesson":{"description":"Design Twitter with postTweet, follow, unfollow and getNewsFeed returning ten most recent tweet IDs from user and followees. Tweet IDs unique.","example":"postTweet(1,5); getNewsFeed(1) → [5]; follow(1,2); postTweet(2,6) → [6,5]","hint":"Merge each followed user's reverse chronological list.","reason":"A global timestamp orders tweets. Seed a max-heap with the latest tweet of every relevant user, then repeatedly pop and add the previous tweet from that author.","complexity":"O(1) amortized post/follow, O(f+10 log(f+1)) feed with f authors, O(total tweets+follows) storage.","code":"from collections import defaultdict\nfrom heapq import heapify,heappop,heappush\nclass Twitter:\n    def __init__(self): self.t=0; self.posts=defaultdict(list); self.follows=defaultdict(set)\n    def postTweet(self,u,tweet):\n        self.t+=1; self.posts[u].append((self.t,tweet))\n    def follow(self,u,v): self.follows[u].add(v)\n    def unfollow(self,u,v): self.follows[u].discard(v)\n    def getNewsFeed(self,u):\n        q=[]; out=[]\n        for v in self.follows[u]|{u}:\n            if self.posts[v]:\n                i=len(self.posts[v])-1; t,x=self.posts[v][i]; q.append((-t,v,i,x))\n        heapify(q)\n        while q and len(out)<10:\n            _,v,i,x=heappop(q); out.append(x)\n            if i:\n                t,y=self.posts[v][i-1]; heappush(q,(-t,v,i-1,y))\n        return out","tests":"x=Twitter(); x.postTweet(1,5); assert x.getNewsFeed(1)==[5]; x.follow(1,2); x.postTweet(2,6); assert x.getNewsFeed(1)==[6,5]; x.unfollow(1,2); assert x.getNewsFeed(1)==[5]","models":"","full":"from collections import defaultdict\nfrom heapq import heapify,heappop,heappush\nclass Twitter:\n    def __init__(self): self.t=0; self.posts=defaultdict(list); self.follows=defaultdict(set)\n    def postTweet(self,u,tweet):\n        self.t+=1; self.posts[u].append((self.t,tweet))\n    def follow(self,u,v): self.follows[u].add(v)\n    def unfollow(self,u,v): self.follows[u].discard(v)\n    def getNewsFeed(self,u):\n        q=[]; out=[]\n        for v in self.follows[u]|{u}:\n            if self.posts[v]:\n                i=len(self.posts[v])-1; t,x=self.posts[v][i]; q.append((-t,v,i,x))\n        heapify(q)\n        while q and len(out)<10:\n            _,v,i,x=heappop(q); out.append(x)\n            if i:\n                t,y=self.posts[v][i-1]; heappush(q,(-t,v,i-1,y))\n        return out\n\n# Example and boundary checks\nx=Twitter(); x.postTweet(1,5); assert x.getNewsFeed(1)==[5]; x.follow(1,2); x.postTweet(2,6); assert x.getNewsFeed(1)==[6,5]; x.unfollow(1,2); assert x.getNewsFeed(1)==[5]\nprint(\"Sample checks passed\")\n","canonical":113}},{"id":114,"name":"Find Median from Data Stream","difficulty":"Hard","pattern":"Two heaps","topic":"Heaps / Priority Queues","lesson":{"description":"Design addNum and findMedian for an integer stream; query only after insertion.","example":"addNum(1); addNum(2); median → 1.5; addNum(3) → 2","hint":"Split lower and upper halves into two heaps.","reason":"Lower half max-heap and upper half min-heap maintain order and sizes differing by at most one, lower half larger if odd. Median is the middle root or mean of both roots.","complexity":"O(log n) insertion, O(1) median, O(n) space.","code":"from heapq import heappush,heappop\nclass MedianFinder:\n    def __init__(self): self.lo=[]; self.hi=[]\n    def addNum(self,x):\n        heappush(self.lo,-x); heappush(self.hi,-heappop(self.lo))\n        if len(self.hi)>len(self.lo): heappush(self.lo,-heappop(self.hi))\n    def findMedian(self):\n        return -self.lo[0] if len(self.lo)>len(self.hi) else (-self.lo[0]+self.hi[0])/2","tests":"x=MedianFinder(); x.addNum(1); x.addNum(2); assert x.findMedian()==1.5; x.addNum(3); assert x.findMedian()==2","models":"","full":"from heapq import heappush,heappop\nclass MedianFinder:\n    def __init__(self): self.lo=[]; self.hi=[]\n    def addNum(self,x):\n        heappush(self.lo,-x); heappush(self.hi,-heappop(self.lo))\n        if len(self.hi)>len(self.lo): heappush(self.lo,-heappop(self.hi))\n    def findMedian(self):\n        return -self.lo[0] if len(self.lo)>len(self.hi) else (-self.lo[0]+self.hi[0])/2\n\n# Example and boundary checks\nx=MedianFinder(); x.addNum(1); x.addNum(2); assert x.findMedian()==1.5; x.addNum(3); assert x.findMedian()==2\nprint(\"Sample checks passed\")\n","canonical":114}},{"id":115,"name":"Merge k Sorted Lists","difficulty":"Hard","pattern":"Min-heap","topic":"Heaps / Priority Queues","lesson":{"description":"Merge k sorted singly linked lists into one sorted list, reusing nodes.","example":"[[1,4,5],[1,3,4],[2,6]] → [1,1,2,3,4,4,5,6]","hint":"Heap current heads; break ties with list index.","reason":"The smallest remaining node must be a head. After extracting it, push its next node from the same list. A unique list index avoids comparing node objects on equal values.","complexity":"O(N log(k+1)) time, O(k) auxiliary space.","code":"from heapq import heapify,heappop,heappush\ndef solve(lists):\n    q=[(x.val,i,x) for i,x in enumerate(lists) if x]; heapify(q)\n    dummy=tail=ListNode(0)\n    while q:\n        _,i,x=heappop(q); tail.next=x; tail=x\n        if x.next: heappush(q,(x.next.val,i,x.next))\n    return dummy.next","tests":"assert unlinked(solve([linked([1,4,5]),linked([1,3,4]),linked([2,6])]))==[1,1,2,3,4,4,5,6]","models":"from collections import deque\nclass TreeNode:\n    def __init__(self,val=0,left=None,right=None): self.val=val; self.left=left; self.right=right\nclass ListNode:\n    def __init__(self,val=0,next=None): self.val=val; self.next=next\nclass Node:\n    def __init__(self,val=0,neighbors=None): self.val=val; self.neighbors=neighbors if neighbors is not None else []\ndef tree(values):\n    if not values or values[0] is None: return None\n    root=TreeNode(values[0]); q=deque([root]); it=iter(values[1:])\n    while q:\n        node=q.popleft()\n        for side in ('left','right'):\n            v=next(it,None)\n            if v is not None:\n                child=TreeNode(v); setattr(node,side,child); q.append(child)\n    return root\ndef level(root):\n    q=deque([root]); out=[]\n    while q:\n        node=q.popleft(); out.append(node.val if node else None)\n        if node: q.extend([node.left,node.right])\n    while out and out[-1] is None: out.pop()\n    return out\ndef linked(values):\n    root=None\n    for v in reversed(values): root=ListNode(v,root)\n    return root\ndef unlinked(root):\n    out=[]\n    while root: out.append(root.val); root=root.next\n    return out\n","full":"from collections import deque\nclass TreeNode:\n    def __init__(self,val=0,left=None,right=None): self.val=val; self.left=left; self.right=right\nclass ListNode:\n    def __init__(self,val=0,next=None): self.val=val; self.next=next\nclass Node:\n    def __init__(self,val=0,neighbors=None): self.val=val; self.neighbors=neighbors if neighbors is not None else []\ndef tree(values):\n    if not values or values[0] is None: return None\n    root=TreeNode(values[0]); q=deque([root]); it=iter(values[1:])\n    while q:\n        node=q.popleft()\n        for side in ('left','right'):\n            v=next(it,None)\n            if v is not None:\n                child=TreeNode(v); setattr(node,side,child); q.append(child)\n    return root\ndef level(root):\n    q=deque([root]); out=[]\n    while q:\n        node=q.popleft(); out.append(node.val if node else None)\n        if node: q.extend([node.left,node.right])\n    while out and out[-1] is None: out.pop()\n    return out\ndef linked(values):\n    root=None\n    for v in reversed(values): root=ListNode(v,root)\n    return root\ndef unlinked(root):\n    out=[]\n    while root: out.append(root.val); root=root.next\n    return out\n\nfrom heapq import heapify,heappop,heappush\ndef solve(lists):\n    q=[(x.val,i,x) for i,x in enumerate(lists) if x]; heapify(q)\n    dummy=tail=ListNode(0)\n    while q:\n        _,i,x=heappop(q); tail.next=x; tail=x\n        if x.next: heappush(q,(x.next.val,i,x.next))\n    return dummy.next\n\n# Example and boundary checks\nassert unlinked(solve([linked([1,4,5]),linked([1,3,4]),linked([2,6])]))==[1,1,2,3,4,4,5,6]\nprint(\"Sample checks passed\")\n","canonical":115}},{"id":116,"name":"Top K Frequent Words","difficulty":"Medium","pattern":"Min-heap","topic":"Heaps / Priority Queues","lesson":{"description":"Return k most frequent words, sorted descending frequency and ascending lexicographic order for ties.","example":"['i','love','leetcode','i','love','coding'],2 → ['i','love']","hint":"Use a composite ranking key.","reason":"Count words, then select the k smallest keys (-frequency, word). Negation puts higher frequency first, while normal word comparison resolves ties.","complexity":"O(N+u log(k+1)) comparisons, O(u+k) space; word comparisons may cost length.","code":"from collections import Counter\nfrom heapq import nsmallest\ndef solve(words,k):\n    c=Counter(words)\n    return nsmallest(k,c,key=lambda w:(-c[w],w))","tests":"assert solve(['i','love','leetcode','i','love','coding'],2)==['i','love']; assert solve(['b','a'],2)==['a','b']","models":"","full":"from collections import Counter\nfrom heapq import nsmallest\ndef solve(words,k):\n    c=Counter(words)\n    return nsmallest(k,c,key=lambda w:(-c[w],w))\n\n# Example and boundary checks\nassert solve(['i','love','leetcode','i','love','coding'],2)==['i','love']; assert solve(['b','a'],2)==['a','b']\nprint(\"Sample checks passed\")\n","canonical":116}},{"id":117,"name":"Implement Trie","difficulty":"Medium","pattern":"Core","topic":"Tries","lesson":{"description":"Implement a trie for lowercase words with insert, exact search and prefix search.","example":"insert('apple'); search('app') → False; startsWith('app') → True","hint":"Represent each prefix as a node with child edges and an end marker.","reason":"Traverse one character per edge. A prefix exists if all edges exist; exact search additionally requires the terminal flag.","complexity":"O(L) per operation, O(total inserted characters) space.","code":"class Trie:\n    def __init__(self): self.root={}\n    def insert(self,word):\n        node=self.root\n        for c in word: node=node.setdefault(c,{})\n        node[None]=True\n    def walk(self,word):\n        node=self.root\n        for c in word:\n            if c not in node: return None\n            node=node[c]\n        return node\n    def search(self,word):\n        node=self.walk(word); return node is not None and None in node\n    def startsWith(self,prefix): return self.walk(prefix) is not None","tests":"x=Trie(); x.insert('apple'); assert not x.search('app') and x.startsWith('app'); x.insert('app'); assert x.search('app')","models":"","full":"class Trie:\n    def __init__(self): self.root={}\n    def insert(self,word):\n        node=self.root\n        for c in word: node=node.setdefault(c,{})\n        node[None]=True\n    def walk(self,word):\n        node=self.root\n        for c in word:\n            if c not in node: return None\n            node=node[c]\n        return node\n    def search(self,word):\n        node=self.walk(word); return node is not None and None in node\n    def startsWith(self,prefix): return self.walk(prefix) is not None\n\n# Example and boundary checks\nx=Trie(); x.insert('apple'); assert not x.search('app') and x.startsWith('app'); x.insert('app'); assert x.search('app')\nprint(\"Sample checks passed\")\n","canonical":117}},{"id":118,"name":"Design Add and Search Words","difficulty":"Medium","pattern":"Wildcard DFS","topic":"Tries","lesson":{"description":"Design word insertion and exact-length pattern search where '.' matches any single lowercase letter.","example":"addWord('bad'); search('.ad') → True; search('ba') → False","hint":"Use trie traversal; wildcard branches to every child.","reason":"Literal characters have one possible edge. A wildcard explores all character edges, excluding end markers. At pattern end require a complete word.","complexity":"O(L) insertion, O(26^L) worst-case search bounded by trie size at relevant depths; O(total characters) storage.","code":"class WordDictionary:\n    def __init__(self): self.root={}\n    def addWord(self,w):\n        node=self.root\n        for c in w: node=node.setdefault(c,{})\n        node[None]=True\n    def search(self,w):\n        def dfs(node,i):\n            if i==len(w): return None in node\n            c=w[i]\n            if c=='.': return any(dfs(child,i+1) for k,child in node.items() if k is not None)\n            return c in node and dfs(node[c],i+1)\n        return dfs(self.root,0)","tests":"x=WordDictionary(); x.addWord('bad'); assert x.search('.ad'); assert not x.search('ba')","models":"","full":"class WordDictionary:\n    def __init__(self): self.root={}\n    def addWord(self,w):\n        node=self.root\n        for c in w: node=node.setdefault(c,{})\n        node[None]=True\n    def search(self,w):\n        def dfs(node,i):\n            if i==len(w): return None in node\n            c=w[i]\n            if c=='.': return any(dfs(child,i+1) for k,child in node.items() if k is not None)\n            return c in node and dfs(node[c],i+1)\n        return dfs(self.root,0)\n\n# Example and boundary checks\nx=WordDictionary(); x.addWord('bad'); assert x.search('.ad'); assert not x.search('ba')\nprint(\"Sample checks passed\")\n","canonical":118}},{"id":119,"name":"Word Search II","difficulty":"Hard","pattern":"Trie + DFS","topic":"Tries","lesson":{"description":"Find all distinct dictionary words on a letter grid via orthogonal paths, without reusing a cell within a word.","example":"[['a','b'],['c','d']], ['ab','ac','ad'] → ['ab','ac'] (any order)","hint":"Share prefix searches using a trie.","reason":"Only explore grid paths that exist in the trie. Temporarily mark visited cells, collect terminal words once, then restore the board during backtracking.","complexity":"O(total word lengths + mn·3^L) upper bound time for longest word L; O(trie size+L) auxiliary space.","code":"def solve(board,words):\n    if not board or not board[0]: return []\n    trie={}; out=[]; m,n=len(board),len(board[0])\n    for w in words:\n        if not w: continue\n        node=trie\n        for c in w: node=node.setdefault(c,{})\n        node[None]=w\n    def dfs(i,j,node):\n        if not (0<=i<m and 0<=j<n): return\n        c=board[i][j]\n        if c not in node: return\n        child=node[c]; word=child.pop(None,None)\n        if word is not None: out.append(word)\n        board[i][j]='#'\n        for x,y in [(i+1,j),(i-1,j),(i,j+1),(i,j-1)]: dfs(x,y,child)\n        board[i][j]=c\n        if not child: del node[c]\n    for i in range(m):\n        for j in range(n): dfs(i,j,trie)\n    return out","tests":"assert sorted(solve([['a','b'],['c','d']],['ab','ac','ad']))==['ab','ac']","models":"","full":"def solve(board,words):\n    if not board or not board[0]: return []\n    trie={}; out=[]; m,n=len(board),len(board[0])\n    for w in words:\n        if not w: continue\n        node=trie\n        for c in w: node=node.setdefault(c,{})\n        node[None]=w\n    def dfs(i,j,node):\n        if not (0<=i<m and 0<=j<n): return\n        c=board[i][j]\n        if c not in node: return\n        child=node[c]; word=child.pop(None,None)\n        if word is not None: out.append(word)\n        board[i][j]='#'\n        for x,y in [(i+1,j),(i-1,j),(i,j+1),(i,j-1)]: dfs(x,y,child)\n        board[i][j]=c\n        if not child: del node[c]\n    for i in range(m):\n        for j in range(n): dfs(i,j,trie)\n    return out\n\n# Example and boundary checks\nassert sorted(solve([['a','b'],['c','d']],['ab','ac','ad']))==['ab','ac']\nprint(\"Sample checks passed\")\n","canonical":119}},{"id":120,"name":"Prefix and Suffix Search","difficulty":"Hard","pattern":"Double trie","topic":"Tries","lesson":{"description":"Design a word filter returning the greatest original index of a word with given prefix and suffix, or -1. Lowercase words; empty queries allowed.","example":"WordFilter(['apple','apply']).f('app','le') → 0","hint":"Index prefix and reversed suffix in tries with ordered index lists.","reason":"Every trie node stores matching indices in ascending insertion order. Retrieve lists for both query strings and intersect backwards; first common index is largest.","complexity":"O(total characters) build time and space (index occurrences); O(P+S+a+b) query with matching-list lengths a,b.","code":"class WordFilter:\n    def __init__(self,words):\n        self.pre={None:[]}; self.suf={None:[]}\n        for i,w in enumerate(words):\n            for root,key in [(self.pre,w),(self.suf,w[::-1])]:\n                node=root; node[None].append(i)\n                for c in key:\n                    node=node.setdefault(c,{None:[]}); node[None].append(i)\n    def f(self,prefix,suffix):\n        def lookup(root,s):\n            for c in s:\n                if c not in root: return []\n                root=root[c]\n            return root[None]\n        a=lookup(self.pre,prefix); b=lookup(self.suf,suffix[::-1]); i,j=len(a)-1,len(b)-1\n        while i>=0 and j>=0:\n            if a[i]==b[j]: return a[i]\n            if a[i]>b[j]: i-=1\n            else: j-=1\n        return -1","tests":"x=WordFilter(['apple','apply']); assert x.f('app','le')==0; assert x.f('app','')==1; assert x.f('z','')==-1","models":"","full":"class WordFilter:\n    def __init__(self,words):\n        self.pre={None:[]}; self.suf={None:[]}\n        for i,w in enumerate(words):\n            for root,key in [(self.pre,w),(self.suf,w[::-1])]:\n                node=root; node[None].append(i)\n                for c in key:\n                    node=node.setdefault(c,{None:[]}); node[None].append(i)\n    def f(self,prefix,suffix):\n        def lookup(root,s):\n            for c in s:\n                if c not in root: return []\n                root=root[c]\n            return root[None]\n        a=lookup(self.pre,prefix); b=lookup(self.suf,suffix[::-1]); i,j=len(a)-1,len(b)-1\n        while i>=0 and j>=0:\n            if a[i]==b[j]: return a[i]\n            if a[i]>b[j]: i-=1\n            else: j-=1\n        return -1\n\n# Example and boundary checks\nx=WordFilter(['apple','apply']); assert x.f('app','le')==0; assert x.f('app','')==1; assert x.f('z','')==-1\nprint(\"Sample checks passed\")\n","canonical":120}},{"id":121,"name":"Subsets","difficulty":"Medium","pattern":"Classic","topic":"Backtracking","lesson":{"description":"Generate all subsets of distinct input values, including empty subset.","example":"[1,2] → [[],[1],[2],[1,2]] (any order)","hint":"Each element has an include/exclude choice.","reason":"At each element duplicate current sub
