nnections. Requests grab one\nin under 1ms, use it, and return it. No more connection errors under load,\nand our latency dropped by ~20ms per request.\"\n```\n\n---\n\n"},{"title":"Week 12 (Days 82–90): Integration and Consolidation","html":"<h2>Week 12 (Days 82–90): Integration and Consolidation<\/h2>\n<h3>The Final 9 Days<\/h3>\n<p>This week is about putting everything together and measuring your progress.<\/p>\n<p><strong>Day 82: Full mock interview (45 minutes)<\/strong><\/p>\n<p>Record yourself doing a simulated full interview:<\/p>\n<ul>\n<li>5 min: &quot;Tell me about yourself and your experience&quot;<\/li>\n<li>20 min: One medium LeetCode problem, narrated fully<\/li>\n<li>15 min: &quot;Tell me about the most complex system you've worked on&quot;<\/li>\n<li>5 min: &quot;Do you have any questions for us?&quot;<\/li>\n<\/ul>\n<p>Play it back in full. What sounds strong? What needs work?<\/p>\n<hr />\n<p><strong>Day 83: Architecture presentation (10 minutes)<\/strong><\/p>\n<p>Explain the architecture of your main work project as if presenting to a new senior engineer joining the team. Use PEDALS. Cover:<\/p>\n<ul>\n<li>What problem it solves<\/li>\n<li>High-level design<\/li>\n<li>Key technical decisions and why<\/li>\n<li>What you'd change if starting fresh<\/li>\n<\/ul>\n<hr />\n<p><strong>Day 84: Translate your work for a VP (5 minutes)<\/strong><\/p>\n<p>Explain your last 2 weeks of work as a 5-minute executive briefing. No technical jargon. Business impact only. Use the pyramid principle (conclusion first).<\/p>\n<hr />\n<p><strong>Day 85–87: Vocabulary final review<\/strong><\/p>\n<p>Go back through the precision words (Week 3) and the technical vocabulary domains (Week 5). For any word you still hesitate on — write 3 sentences, say them out loud.<\/p>\n<hr />\n<p><strong>Day 88: Rephrase drill<\/strong><\/p>\n<p>Take 10 sentences you'd say in Hindi about your work. Say them in English. Record yourself. Listen for:<\/p>\n<ul>\n<li>Any Hindi grammar patterns bleeding in (&quot;it is working only&quot;)<\/li>\n<li>Any filler words (&quot;basically&quot;, &quot;actually&quot;)<\/li>\n<li>Any vague words you could replace with precise ones<\/li>\n<\/ul>\n<hr />\n<p><strong>Day 89: Peer conversation<\/strong><\/p>\n<p>Have a real conversation entirely in English for 30 minutes. With a colleague, a friend, anyone. Talk about work, tech, career — whatever comes naturally. After: reflect on how different it felt vs Day 1.<\/p>\n<hr />\n<p><strong>Day 90: Final recording<\/strong><\/p>\n<p>Record yourself answering the same question from Day 1:<\/p>\n<p><em>&quot;Tell me about yourself and what you work on as a software engineer.&quot;<\/em><\/p>\n<p>Compare to your Day 1 recording. Notice:<\/p>\n<ul>\n<li>Sentence length and complexity<\/li>\n<li>Pause frequency<\/li>\n<li>Vocabulary precision<\/li>\n<li>Overall confidence and flow<\/li>\n<\/ul>\n<hr />\n<h3>Phase 3 Checkpoint (End of Day 90)<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Skill<\/th>\n  <th>Not Yet<\/th>\n  <th>Getting There<\/th>\n  <th>Solid<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Interview think-out-loud is natural<\/td>\n  <td><\/td>\n  <td><\/td>\n  <td><\/td>\n<\/tr>\n<tr>\n  <td>STAR+ stories flow in under 2 minutes<\/td>\n  <td><\/td>\n  <td><\/td>\n  <td><\/td>\n<\/tr>\n<tr>\n  <td>Can translate technical updates to business language<\/td>\n  <td><\/td>\n  <td><\/td>\n  <td><\/td>\n<\/tr>\n<tr>\n  <td>10-minute technical talk delivered at least once<\/td>\n  <td><\/td>\n  <td><\/td>\n  <td><\/td>\n<\/tr>\n<tr>\n  <td>Analogy for 5+ technical concepts ready<\/td>\n  <td><\/td>\n  <td><\/td>\n  <td><\/td>\n<\/tr>\n<tr>\n  <td>Escalation framework feels natural<\/td>\n  <td><\/td>\n  <td><\/td>\n  <td><\/td>\n<\/tr>\n<tr>\n  <td>Day 90 recording noticeably better than Day 1<\/td>\n  <td><\/td>\n  <td><\/td>\n  <td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n","text":"## Week 12 (Days 82–90): Integration and Consolidation\n\n### The Final 9 Days\n\nThis week is about putting everything together and measuring your progress.\n\n**Day 82: Full mock interview (45 minutes)**\n\nRecord yourself doing a simulated full interview:\n- 5 min: \"Tell me about yourself and your experience\"\n- 20 min: One medium LeetCode problem, narrated fully\n- 15 min: \"Tell me about the most complex system you've worked on\"\n- 5 min: \"Do you have any questions for us?\"\n\nPlay it back in full. What sounds strong? What needs work?\n\n---\n\n**Day 83: Architecture presentation (10 minutes)**\n\nExplain the architecture of your main work project as if presenting to a new senior engineer joining the team. Use PEDALS. Cover:\n- What problem it solves\n- High-level design\n- Key technical decisions and why\n- What you'd change if starting fresh\n\n---\n\n**Day 84: Translate your work for a VP (5 minutes)**\n\nExplain your last 2 weeks of work as a 5-minute executive briefing. No technical jargon. Business impact only. Use the pyramid principle (conclusion first).\n\n---\n\n**Day 85–87: Vocabulary final review**\n\nGo back through the precision words (Week 3) and the technical vocabulary domains (Week 5). For any word you still hesitate on — write 3 sentences, say them out loud.\n\n---\n\n**Day 88: Rephrase drill**\n\nTake 10 sentences you'd say in Hindi about your work. Say them in English. Record yourself. Listen for:\n- Any Hindi grammar patterns bleeding in (\"it is working only\")\n- Any filler words (\"basically\", \"actually\")\n- Any vague words you could replace with precise ones\n\n---\n\n**Day 89: Peer conversation**\n\nHave a real conversation entirely in English for 30 minutes. With a colleague, a friend, anyone. Talk about work, tech, career — whatever comes naturally. After: reflect on how different it felt vs Day 1.\n\n---\n\n**Day 90: Final recording**\n\nRecord yourself answering the same question from Day 1:\n\n*\"Tell me about yourself and what you work on as a software engineer.\"*\n\nCompare to your Day 1 recording. Notice:\n- Sentence length and complexity\n- Pause frequency\n- Vocabulary precision\n- Overall confidence and flow\n\n---\n\n### Phase 3 Checkpoint (End of Day 90)\n\n| Skill | Not Yet | Getting There | Solid |\n|---|---|---|---|\n| Interview think-out-loud is natural | | | |\n| STAR+ stories flow in under 2 minutes | | | |\n| Can translate technical updates to business language | | | |\n| 10-minute technical talk delivered at least once | | | |\n| Analogy for 5+ technical concepts ready | | | |\n| Escalation framework feels natural | | | |\n| Day 90 recording noticeably better than Day 1 | | | |\n\n---\n\n"},{"title":"RESOURCES AND REFERENCE","html":"<h1>RESOURCES AND REFERENCE<\/h1>\n<h2>Daily Practice Summary (one-line version)<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Days<\/th>\n  <th>Daily habit (15 min)<\/th>\n  <th>Weekly habit (30 min)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>1–7<\/td>\n  <td>Morning journal (English thoughts)<\/td>\n  <td>Record 1 technical explanation<\/td>\n<\/tr>\n<tr>\n  <td>8–14<\/td>\n  <td>Shadowing (1 Fireship video)<\/td>\n  <td>Fill in 10 sentence patterns with real work<\/td>\n<\/tr>\n<tr>\n  <td>15–21<\/td>\n  <td>Precision vocabulary drills<\/td>\n  <td>Translate 5 technical things to English<\/td>\n<\/tr>\n<tr>\n  <td>22–30<\/td>\n  <td>Rubber duck explanations<\/td>\n  <td>30-second answer drills (timed)<\/td>\n<\/tr>\n<tr>\n  <td>31–37<\/td>\n  <td>Technical vocabulary per domain<\/td>\n  <td>Domain deep-dive sentences<\/td>\n<\/tr>\n<tr>\n  <td>38–44<\/td>\n  <td>Code review language practice<\/td>\n  <td>5 real/practice review comments/day<\/td>\n<\/tr>\n<tr>\n  <td>45–51<\/td>\n  <td>PEDALS system explanations<\/td>\n  <td>Record 2 system walkthroughs<\/td>\n<\/tr>\n<tr>\n  <td>52–60<\/td>\n  <td>Standup writing + speaking<\/td>\n  <td>Mock technical debate<\/td>\n<\/tr>\n<tr>\n  <td>61–67<\/td>\n  <td>LeetCode narrated out loud<\/td>\n  <td>STAR+ story practice<\/td>\n<\/tr>\n<tr>\n  <td>68–74<\/td>\n  <td>Technical → business translation<\/td>\n  <td>Escalation scenario practice<\/td>\n<\/tr>\n<tr>\n  <td>75–81<\/td>\n  <td>Talk preparation and delivery<\/td>\n  <td>Analogy creation<\/td>\n<\/tr>\n<tr>\n  <td>82–90<\/td>\n  <td>Integration + recording<\/td>\n  <td>Full mock interview<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>The 10 YouTube Channels for Shadowing<\/h2>\n<ol>\n<li><strong>Fireship<\/strong> — short, fast, natural technical English<\/li>\n<li><strong>Hussein Nasser<\/strong> — backend/system design, clear articulation<\/li>\n<li><strong>ByteByteGo<\/strong> — system design explanations (excellent vocabulary)<\/li>\n<li><strong>TechWorld with Nana<\/strong> — Kubernetes, DevOps, clear teaching style<\/li>\n<li><strong>Theo (t3.gg)<\/strong> — opinionated, conversational, fast<\/li>\n<li><strong>Arpit Bhayani<\/strong> — Indian engineer, excellent technical English<\/li>\n<li><strong>The Primeagen<\/strong> — passionate, natural speech patterns<\/li>\n<li><strong>AWS Events<\/strong> (YouTube) — professional presentation English<\/li>\n<li><strong>GOTO Conferences<\/strong> — Staff/Principal level technical talks<\/li>\n<li><strong>Lenny's Podcast<\/strong> (clips) — product + engineering career conversations<\/li>\n<\/ol>\n<hr />\n<h2>The Golden Rules (pin these somewhere visible)<\/h2>\n<ol>\n<li><p><strong>Speak first, correct later.<\/strong> A wrong sentence spoken is more practice than a perfect sentence in your head.<\/p>\n<\/li>\n<li><p><strong>Record yourself once a week.<\/strong> You cannot hear your own improvement without recordings.<\/p>\n<\/li>\n<li><p><strong>Use real work as content.<\/strong> Don't invent fake scenarios. Explain what you actually did today.<\/p>\n<\/li>\n<li><p><strong>Precision over vocabulary size.<\/strong> Knowing 200 precise technical words deeply is more valuable than knowing 2000 words shallowly.<\/p>\n<\/li>\n<li><p><strong>Silence is better than filler.<\/strong> A 2-second pause is professional. &quot;Basically um actually&quot; is not.<\/p>\n<\/li>\n<li><p><strong>The interviewer/manager is not grading your grammar.<\/strong> They're grading your clarity, structure, and confidence. Perfect grammar with clear structure beats perfect grammar with none.<\/p>\n<\/li>\n<li><p><strong>Consistency beats intensity.<\/strong> 30 minutes every day for 90 days beats 5 hours on Sunday.<\/p>\n<\/li>\n<\/ol>\n<hr />\n<h2>Hindi Engineer's Common English Mistakes — Quick Reference<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Mistake<\/th>\n  <th>Wrong<\/th>\n  <th>Right<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>&quot;only&quot; at end<\/td>\n  <td>&quot;it is working only&quot;<\/td>\n  <td>&quot;it is working&quot; / &quot;it works&quot;<\/td>\n<\/tr>\n<tr>\n  <td>wrong &quot;actually&quot;<\/td>\n  <td>&quot;Actually it is fast.&quot; (emphasis)<\/td>\n  <td>&quot;Actually, I expected it to fail.&quot; (surprise/correction)<\/td>\n<\/tr>\n<tr>\n  <td>&quot;do&quot; before main verb<\/td>\n  <td>&quot;I will do the fix tomorrow&quot;<\/td>\n  <td>&quot;I will fix it tomorrow&quot;<\/td>\n<\/tr>\n<tr>\n  <td>double negatives<\/td>\n  <td>&quot;I didn't find no issue&quot;<\/td>\n  <td>&quot;I didn't find any issue&quot; / &quot;I found no issue&quot;<\/td>\n<\/tr>\n<tr>\n  <td>present for future<\/td>\n  <td>&quot;Tomorrow I am going to office&quot;<\/td>\n  <td>&quot;Tomorrow I'm going to the office&quot;<\/td>\n<\/tr>\n<tr>\n  <td>missing articles<\/td>\n  <td>&quot;I will check in database&quot;<\/td>\n  <td>&quot;I will check in the database&quot;<\/td>\n<\/tr>\n<tr>\n  <td>&quot;discuss about&quot;<\/td>\n  <td>&quot;Let's discuss about this&quot;<\/td>\n  <td>&quot;Let's discuss this&quot;<\/td>\n<\/tr>\n<tr>\n  <td>&quot;revert back&quot;<\/td>\n  <td>&quot;Please revert back the change&quot;<\/td>\n  <td>&quot;Please revert the change&quot;<\/td>\n<\/tr>\n<tr>\n  <td>since vs for<\/td>\n  <td>&quot;I have been working since 3 years&quot;<\/td>\n  <td>&quot;I have been working for 3 years&quot;<\/td>\n<\/tr>\n<tr>\n  <td>prepositional errors<\/td>\n  <td>&quot;We are working in this since Monday&quot;<\/td>\n  <td>&quot;We've been working on this since Monday&quot;<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Books (in order of priority)<\/h2>\n<ol>\n<li><strong>&quot;Fluent Forever&quot; — Gabriel Wyner<\/strong> — the science of how to actually build lasting vocabulary<\/li>\n<li><strong>&quot;The Elements of Style&quot; — Strunk &amp; White<\/strong> — short, indispensable guide to clear written English<\/li>\n<li><strong>&quot;Made to Stick&quot; — Chip &amp; Dan Heath<\/strong> — how to make ideas (including technical ones) memorable<\/li>\n<li><strong>&quot;Talk Like TED&quot; — Carmine Gallo<\/strong> — presentation and speaking techniques with analysis of the best speakers<\/li>\n<\/ol>\n<hr />\n<p><em>End of Part 5 — Communication Mastery: 90-Day Course<\/em><\/p>\n<p><em>This part is designed to run in parallel with Parts 1–4 of the handbook. Start Phase 1 in Month 1 alongside the Career Strategy and DSA chapters. Phase 2 aligns with the Backend/PostgreSQL technical depth months. Phase 3 runs during Interview Preparation (Month 12+).<\/em><\/p>\n","text":"# RESOURCES AND REFERENCE\n\n## Daily Practice Summary (one-line version)\n\n| Days | Daily habit (15 min) | Weekly habit (30 min) |\n|---|---|---|\n| 1–7 | Morning journal (English thoughts) | Record 1 technical explanation |\n| 8–14 | Shadowing (1 Fireship video) | Fill in 10 sentence patterns with real work |\n| 15–21 | Precision vocabulary drills | Translate 5 technical things to English |\n| 22–30 | Rubber duck explanations | 30-second answer drills (timed) |\n| 31–37 | Technical vocabulary per domain | Domain deep-dive sentences |\n| 38–44 | Code review language practice | 5 real/practice review comments/day |\n| 45–51 | PEDALS system explanations | Record 2 system walkthroughs |\n| 52–60 | Standup writing + speaking | Mock technical debate |\n| 61–67 | LeetCode narrated out loud | STAR+ story practice |\n| 68–74 | Technical → business translation | Escalation scenario practice |\n| 75–81 | Talk preparation and delivery | Analogy creation |\n| 82–90 | Integration + recording | Full mock interview |\n\n---\n\n## The 10 YouTube Channels for Shadowing\n\n1. **Fireship** — short, fast, natural technical English\n2. **Hussein Nasser** — backend/system design, clear articulation\n3. **ByteByteGo** — system design explanations (excellent vocabulary)\n4. **TechWorld with Nana** — Kubernetes, DevOps, clear teaching style\n5. **Theo (t3.gg)** — opinionated, conversational, fast\n6. **Arpit Bhayani** — Indian engineer, excellent technical English\n7. **The Primeagen** — passionate, natural speech patterns\n8. **AWS Events** (YouTube) — professional presentation English\n9. **GOTO Conferences** — Staff/Principal level technical talks\n10. **Lenny's Podcast** (clips) — product + engineering career conversations\n\n---\n\n## The Golden Rules (pin these somewhere visible)\n\n1. **Speak first, correct later.** A wrong sentence spoken is more practice than a perfect sentence in your head.\n\n2. **Record yourself once a week.** You cannot hear your own improvement without recordings.\n\n3. **Use real work as content.** Don't invent fake scenarios. Explain what you actually did today.\n\n4. **Precision over vocabulary size.** Knowing 200 precise technical words deeply is more valuable than knowing 2000 words shallowly.\n\n5. **Silence is better than filler.** A 2-second pause is professional. \"Basically um actually\" is not.\n\n6. **The interviewer/manager is not grading your grammar.** They're grading your clarity, structure, and confidence. Perfect grammar with clear structure beats perfect grammar with none.\n\n7. **Consistency beats intensity.** 30 minutes every day for 90 days beats 5 hours on Sunday.\n\n---\n\n## Hindi Engineer's Common English Mistakes — Quick Reference\n\n| Mistake | Wrong | Right |\n|---|---|---|\n| \"only\" at end | \"it is working only\" | \"it is working\" / \"it works\" |\n| wrong \"actually\" | \"Actually it is fast.\" (emphasis) | \"Actually, I expected it to fail.\" (surprise/correction) |\n| \"do\" before main verb | \"I will do the fix tomorrow\" | \"I will fix it tomorrow\" |\n| double negatives | \"I didn't find no issue\" | \"I didn't find any issue\" / \"I found no issue\" |\n| present for future | \"Tomorrow I am going to office\" | \"Tomorrow I'm going to the office\" |\n| missing articles | \"I will check in database\" | \"I will check in the database\" |\n| \"discuss about\" | \"Let's discuss about this\" | \"Let's discuss this\" |\n| \"revert back\" | \"Please revert back the change\" | \"Please revert the change\" |\n| since vs for | \"I have been working since 3 years\" | \"I have been working for 3 years\" |\n| prepositional errors | \"We are working in this since Monday\" | \"We've been working on this since Monday\" |\n\n---\n\n## Recommended Books (in order of priority)\n\n1. **\"Fluent Forever\" — Gabriel Wyner** — the science of how to actually build lasting vocabulary\n2. **\"The Elements of Style\" — Strunk & White** — short, indispensable guide to clear written English\n3. **\"Made to Stick\" — Chip & Dan Heath** — how to make ideas (including technical ones) memorable\n4. **\"Talk Like TED\" — Carmine Gallo** — presentation and speaking techniques with analysis of the best speakers\n\n---\n\n*End of Part 5 — Communication Mastery: 90-Day Course*\n\n*This part is designed to run in parallel with Parts 1–4 of the handbook. Start Phase 1 in Month 1 alongside the Career Strategy and DSA chapters. Phase 2 aligns with the Backend/PostgreSQL technical depth months. Phase 3 runs during Interview Preparation (Month 12+).*\n"}],"months":[{"start":1,"end":1,"title":"Foundation Sprint","html":"<h3>Month 1: Foundation Sprint<\/h3>\n<p><strong>Goals:<\/strong> Assess current state, set up learning systems, begin DSA<\/p>\n<p><strong>Topics:<\/strong><\/p>\n<ul>\n<li>DSA: Arrays, Strings, HashMaps, Sliding Window (Problems #1-37)<\/li>\n<li>Career: Write Staff Engineer gap analysis, identify sponsor target<\/li>\n<li>Python: Read <em>Fluent Python<\/em> Chapters 1-6<\/li>\n<\/ul>\n<p><strong>Daily Schedule:<\/strong><\/p>\n<pre><code>Morning (6:00-7:00 AM): DSA practice (2 problems)\nEvening (8:00-9:00 PM): Reading (Fluent Python / DDIA)\nWeekend Saturday (2 hrs): Mock interview or system design study\nWeekend Sunday (1 hr): Write blog post or RFC draft\n<\/code><\/pre>\n<p><strong>Books:<\/strong><\/p>\n<ul>\n<li><em>Fluent Python<\/em> (2nd ed.) — Start this month<\/li>\n<li><em>Cracking the Coding Interview<\/em> — Chapters 1-4<\/li>\n<\/ul>\n<p><strong>Projects:<\/strong><\/p>\n<ul>\n<li>Set up personal blog (Ghost, Hashnode, or Substack)<\/li>\n<li>Write first technical blog post: &quot;What I learned building a distributed AI/ML platform&quot;<\/li>\n<\/ul>\n<p><strong>Deliverables:<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>50 DSA problems solved<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Staff Engineer promotion document drafted<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>First blog post published<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Sponsor relationship initiated<\/li>\n<\/ul>\n<p><strong>Expected Outcome:<\/strong> Foundation established, DSA habit in place, public writing begun.<\/p>\n<hr />\n","tasks":["50 DSA problems solved","Staff Engineer promotion document drafted","First blog post published","Sponsor relationship initiated"]},{"start":2,"end":2,"title":"Deep Dive — Technical Core","html":"<h3>Month 2: Deep Dive — Technical Core<\/h3>\n<p><strong>Goals:<\/strong> Strengthen technical foundations, continue DSA, begin PostgreSQL depth<\/p>\n<p><strong>Topics:<\/strong><\/p>\n<ul>\n<li>DSA: Binary Search, Trees (Problems #38-60)<\/li>\n<li>PostgreSQL: MVCC, WAL, indexing strategy<\/li>\n<li>Python: Async internals, event loop architecture<\/li>\n<\/ul>\n<p><strong>Books:<\/strong><\/p>\n<ul>\n<li><em>Designing Data-Intensive Applications<\/em> — Start Chapter 1-4<\/li>\n<li><em>CPython Internals<\/em> — Start<\/li>\n<\/ul>\n<p><strong>Projects:<\/strong><\/p>\n<ul>\n<li>PostgreSQL Lab 1: Set up streaming replication<\/li>\n<li>Write RFC for a real problem at work<\/li>\n<\/ul>\n<p><strong>Deliverables:<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>50 more DSA problems (total: 100)<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>PostgreSQL streaming replication working locally<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>RFC submitted for team review<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Blog post: &quot;Deep dive into PostgreSQL MVCC&quot;<\/li>\n<\/ul>\n<p><strong>Expected Outcome:<\/strong> First cross-team technical writing artifact. PostgreSQL depth apparent to team.<\/p>\n<hr />\n","tasks":["50 more DSA problems (total: 100)","PostgreSQL streaming replication working locally","RFC submitted for team review","Blog post: \"Deep dive into PostgreSQL MVCC\""]},{"start":3,"end":3,"title":"System Design Focus","html":"<h3>Month 3: System Design Focus<\/h3>\n<p><strong>Goals:<\/strong> Master system design framework, build vocabulary, begin presenting<\/p>\n<p><strong>Topics:<\/strong><\/p>\n<ul>\n<li>System Design: WhatsApp, URL Shortener, Notification Platform<\/li>\n<li>DSA: Graphs, BFS/DFS (Problems #61-77)<\/li>\n<li>Leadership: Implement GROW model for 1:1s<\/li>\n<\/ul>\n<p><strong>Books:<\/strong><\/p>\n<ul>\n<li><em>System Design Interview Vol 1<\/em sks":["Kafka pipeline project complete","OTel instrumentation merged to production","Team presentation on Kafka architecture","Blog post: \"Event-driven architecture with Kafka: lessons learned\""]},{"start":7,"end":7,"title":"Kubernetes Deep Dive","html":"<h3>Month 7: Kubernetes Deep Dive<\/h3>\n<p><strong>Goals:<\/strong> Master Kubernetes internals, begin CKA preparation<\/p>\n<p><strong>Topics:<\/strong><\/p>\n<ul>\n<li>Kubernetes: Scheduler, networking, operators, Karpenter<\/li>\n<li>Service mesh (Istio basics)<\/li>\n<li>AWS: IAM, VPC, EKS networking<\/li>\n<\/ul>\n<p><strong>Courses:<\/strong><\/p>\n<ul>\n<li>Mumshad Mannambeth CKA (Udemy) — Begin<\/li>\n<li>KillerCoda labs: 30 min/day<\/li>\n<\/ul>\n<p><strong>Projects:<\/strong><\/p>\n<ul>\n<li>Build a simple Kubernetes operator using Kopf<\/li>\n<li>Document EKS cluster architecture as a design doc<\/li>\n<\/ul>\n<p><strong>Deliverables:<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Kubernetes operator functional<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>EKS architecture design doc<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>CKA study 50% complete<\/li>\n<\/ul>\n<hr />\n","tasks":["Kubernetes operator functional","EKS architecture design doc","CKA study 50% complete"]},{"start":8,"end":8,"title":"Testing Excellence + Security","html":"<h3>Month 8: Testing Excellence + Security<\/h3>\n<p><strong>Goals:<\/strong> Raise team testing standards, own security posture<\/p>\n<p><strong>Topics:<\/strong><\/p>\n<ul>\n<li>Testing: Contract testing, chaos engineering, load testing<\/li>\n<li>Security: OWASP Top 10, secrets management, JWT depth<\/li>\n<\/ul>\n<p><strong>Projects:<\/strong><\/p>\n<ul>\n<li>Implement Pact contract testing for 2 services<\/li>\n<li>Set up Locust load testing for one API<\/li>\n<li>Implement E
