r WAL flush, data is safe\n- **Replication** — WAL shipped to replicas\n- **PITR** — Replay WAL from a base backup to any point in time\n\n**WAL Configuration for High-Throughput Systems:**\n```\n# postgresql.conf\nwal_level = replica          # or logical for CDC\nmax_wal_size = 4GB           # larger = fewer checkpoints\nmin_wal_size = 1GB\nwal_compression = on         # saves ~50% WAL disk space\nsynchronous_commit = on      # default: safe\n# synchronous_commit = off   # ~30% throughput gain, risk of last-commit loss\ncheckpoint_completion_target = 0.9  # spread I/O\n```\n\n**WAL for PITR (Point-in-Time Recovery):**\n```bash\n# Base backup\npg_basebackup -h localhost -U replication_user \\\n    -D /backup/base -Ft -Xs -P -v\n\n# WAL archiving (postgresql.conf)\narchive_mode = on\narchive_command = 'aws s3 cp %p s3://my-wal-archive/%f'\n\n# Recovery (recovery.conf / postgresql.conf in PG12+)\nrestore_command = 'aws s3 cp s3://my-wal-archive/%f %p'\nrecovery_target_time = '2024-03-15 14:30:00'\nrecovery_target_action = 'promote'\n```\n\n---\n\n"},{"title":"Chapter 5.4 – Indexing Strategy","html":"<h2>Chapter 5.4 – Indexing Strategy<\/h2>\n<h3>Index Types<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Type<\/th>\n  <th>Operator<\/th>\n  <th>Best For<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>B-Tree<\/td>\n  <td>=, &lt;, &gt;, BETWEEN, LIKE 'foo%'<\/td>\n  <td>Most cases<\/td>\n<\/tr>\n<tr>\n  <td>Hash<\/td>\n  <td>= only<\/td>\n  <td>Pure equality, large tables<\/td>\n<\/tr>\n<tr>\n  <td>GIN<\/td>\n  <td>@&gt;, &amp;&amp;, @@ (full text)<\/td>\n  <td>Arrays, JSONB, full-text search<\/td>\n<\/tr>\n<tr>\n  <td>GiST<\/td>\n  <td>&amp;&amp;, @&gt;, &lt;-&gt; (distance)<\/td>\n  <td>Geometric, range, fuzzy<\/td>\n<\/tr>\n<tr>\n  <td>BRIN<\/td>\n  <td>Range scan on naturally ordered<\/td>\n  <td>Huge time-series tables<\/td>\n<\/tr>\n<tr>\n  <td>Partial<\/td>\n  <td>Any<\/td>\n  <td>Filter-specific queries<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Practical Index Decisions:<\/strong><\/p>\n<pre><code class=\"language-sql\">-- Composite index (order matters!)\n-- For WHERE status = 'active' AND created_at &gt; '2024-01-01'\nCREATE INDEX idx_orders_status_created \n    ON orders(status, created_at)\n    WHERE status != 'archived';  -- Partial index!\n\n-- Covering index (avoid heap access entirely)\nCREATE INDEX idx_users_email_covering \n    ON users(email) \n    INCLUDE (id, name, role);  -- include non-search columns\n\n-- Expression index\nCREATE INDEX idx_users_email_lower \n    ON users(lower(email));  -- For case-insensitive searches\n\n-- JSONB GIN index\nCREATE INDEX idx_metadata_gin \n    ON events USING GIN(metadata jsonb_path_ops);\n<\/code><\/pre>\n<p><strong>Index Bloat and Maintenance:<\/strong><\/p>\n<pre><code class=\"language-sql\">-- Find unused indexes (waste of write overhead)\nSELECT \n    schemaname,\n    tablename,\n    indexname,\n    idx_scan,\n    idx_tup_read,\n    idx_tup_fetch,\n    pg_size_pretty(pg_relation_size(indexrelid)) AS index_size\nFROM pg_stat_user_indexes\nWHERE idx_scan = 0\nORDER BY pg_relation_size(indexrelid) DESC;\n\n-- Rebuild index without locking (PG12+)\nREINDEX INDEX CONCURRENTLY idx_users_email;\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 5.4 – Indexing Strategy\n\n### Index Types\n\n| Type | Operator | Best For |\n|---|---|---|\n| B-Tree | =, <, >, BETWEEN, LIKE 'foo%' | Most cases |\n| Hash | = only | Pure equality, large tables |\n| GIN | @>, &&, @@ (full text) | Arrays, JSONB, full-text search |\n| GiST | &&, @>, <-> (distance) | Geometric, range, fuzzy |\n| BRIN | Range scan on naturally ordered | Huge time-series tables |\n| Partial | Any | Filter-specific queries |\n\n**Practical Index Decisions:**\n```sql\n-- Composite index (order matters!)\n-- For WHERE status = 'active' AND created_at > '2024-01-01'\nCREATE INDEX idx_orders_status_created \n    ON orders(status, created_at)\n    WHERE status != 'archived';  -- Partial index!\n\n-- Covering index (avoid heap access entirely)\nCREATE INDEX idx_users_email_covering \n    ON users(email) \n    INCLUDE (id, name, role);  -- include non-search columns\n\n-- Expression index\nCREATE INDEX idx_users_email_lower \n    ON users(lower(email));  -- For case-insensitive searches\n\n-- JSONB GIN index\nCREATE INDEX idx_metadata_gin \n    ON events USING GIN(metadata jsonb_path_ops);\n```\n\n**Index Bloat and Maintenance:**\n```sql\n-- Find unused indexes (waste of write overhead)\nSELECT \n    schemaname,\n    tablename,\n    indexname,\n    idx_scan,\n    idx_tup_read,\n    idx_tup_fetch,\n    pg_size_pretty(pg_relation_size(indexrelid)) AS index_size\nFROM pg_stat_user_indexes\nWHERE idx_scan = 0\nORDER BY pg_relation_size(indexrelid) DESC;\n\n-- Rebuild index without locking (PG12+)\nREINDEX INDEX CONCURRENTLY idx_users_email;\n```\n\n---\n\n"},{"title":"Chapter 5.5 – Query Planner","html":"<h2>Chapter 5.5 – Query Planner<\/h2>\n<h3>Reading EXPLAIN ANALYZE<\/h3>\n<pre><code class=\"language-sql\">EXPLAIN (ANALYZE, BUFFERS, FORMAT TEXT)\nSELECT u.id, u.name, COUNT(o.id) AS order_count\nFROM users u\nLEFT JOIN orders o ON o.user_id = u.id\nWHERE u.tenant_id = 42\nGROUP BY u.id, u.name\nHAVING COUNT(o.id) &gt; 5;\n<\/code><\/pre>\n<p><strong>Reading the output:<\/strong><\/p>\n<pre><code>HashAggregate  (cost=1234.56..1256.78 rows=89 width=20)\n               (actual time=45.234..46.123 rows=67 loops=1)\n  Buffers: shared hit=234 read=567\n  -&gt;  Hash Right Join  (cost=...)\n        Hash Cond: (o.user_id = u.id)\n        -&gt;  Seq Scan on orders o  (cost=...)  ← Problem: full scan!\n        -&gt;  Hash  (cost=...)\n              -&gt;  Index Scan on users  ← Good: using index\n<\/code><\/pre>\n<p>Key metrics to watch:<\/p>\n<ul>\n<li><code>Seq Scan<\/code> on large tables → missing index<\/li>\n<li><code>cost=<\/code> estimate vs <code>actual time=<\/code> large discrepancy → stale statistics<\/li>\n<li><code>Buffers: read=<\/code> high → data not in cache, disk I/O<\/li>\n<li><code>loops=<\/code> &gt; 1 on nested loops → N+1 query potential<\/li>\n<\/ul>\n<p><strong>Forcing query planner decisions (for debugging only):<\/strong><\/p>\n<pre><code class=\"language-sql\">SET enable_seqscan = off;\nSET enable_hashjoin = off;\n-- run EXPLAIN ANALYZE to see alternative plan\nRESET enable_seqscan;\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 5.5 – Query Planner\n\n### Reading EXPLAIN ANALYZE\n\n```sql\nEXPLAIN (ANALYZE, BUFFERS, FORMAT TEXT)\nSELECT u.id, u.name, COUNT(o.id) AS order_count\nFROM users u\nLEFT JOIN orders o ON o.user_id = u.id\nWHERE u.tenant_id = 42\nGROUP BY u.id, u.name\nHAVING COUNT(o.id) > 5;\n```\n\n**Reading the output:**\n\n```\nHashAggregate  (cost=1234.56..1256.78 rows=89 width=20)\n               (actual time=45.234..46.123 rows=67 loops=1)\n  Buffers: shared hit=234 read=567\n  ->  Hash Right Join  (cost=...)\n        Hash Cond: (o.user_id = u.id)\n        ->  Seq Scan on orders o  (cost=...)  ← Problem: full scan!\n        ->  Hash  (cost=...)\n              ->  Index Scan on users  ← Good: using index\n```\n\nKey metrics to watch:\n- `Seq Scan` on large tables → missing index\n- `cost=` estimate vs `actual time=` large discrepancy → stale statistics\n- `Buffers: read=` high → data not in cache, disk I/O\n- `loops=` > 1 on nested loops → N+1 query potential\n\n**Forcing query planner decisions (for debugging only):**\n```sql\nSET enable_seqscan = off;\nSET enable_hashjoin = off;\n-- run EXPLAIN ANALYZE to see alternative plan\nRESET enable_seqscan;\n```\n\n---\n\n"},{"title":"Chapter 5.6 – Locking and Deadlocks","html":"<h2>Chapter 5.6 – Locking and Deadlocks<\/h2>\n<h3>PostgreSQL Lock Modes<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Lock<\/th>\n  <th>Conflicts With<\/th>\n  <th>Acquired By<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>ACCESS SHARE<\/td>\n  <td>ACCESS EXCLUSIVE<\/td>\n  <td>SELECT<\/td>\n<\/tr>\n<tr>\n  <td>ROW SHARE<\/td>\n  <td>EXCLUSIVE, ACCESS EXCLUSIVE<\/td>\n  <td>SELECT FOR UPDATE<\/td>\n<\/tr>\n<tr>\n  <td>ROW EXCLUSIVE<\/td>\n  <td>SHARE and above<\/td>\n  <td>INSERT, UPDATE, DELETE<\/td>\n<\/tr>\n<tr>\n  <td>SHARE UPDATE EXCLUSIVE<\/td>\n  <td>Itself, SHARE, higher<\/td>\n  <td>VACUUM, CREATE INDEX CONCURRENTLY<\/td>\n<\/tr>\n<tr>\n  <td>SHARE<\/td>\n  <td>ROW EXCLUSIVE, higher<\/td>\n  <td>CREATE INDEX<\/td>\n<\/tr>\n<tr>\n  <td>EXCLUSIVE<\/td>\n  <td>All except ACCESS SHARE<\/td>\n  <td>Rarely needed<\/td>\n<\/tr>\n<tr>\n  <td>ACCESS EXCLUSIVE<\/td>\n  <td>All<\/td>\n  <td>ALTER TABLE, DROP, TRUNCATE<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Detecting Lock Contention:<\/strong><\/p>\n<pre><code class=\"language-sql\">-- Current blocking locks\nSELECT \n    blocked.pid AS blocked_pid,\n    blocked.query AS blocked_query,\n    blocking.pid AS blocking_pid,\n    blocking.query AS blocking_query,\n    now() - blocked.query_start AS blocked_for\nFROM pg_catalog.pg_locks blocked_locks\nJOIN pg_catalog.pg_stat_activity blocked \n    ON blocked.pid = blocked_locks.pid\nJOIN pg_catalog.pg_locks blocking_locks \n    ON blocking_locks.locktype = blocked_locks.locktype\n    AND blocking_locks.pid != blocked_locks.pid\n    AND blocking_locks.granted\nJOIN pg_catalog.pg_stat_activity blocking \n    ON blocking.pid = blocking_locks.pid\nWHERE NOT blocked_locks.granted;\n<\/code><\/pre>\n<p><strong>Deadlock Prevention:<\/strong><\/p>\n<pre><code class=\"language-python\"># Always acquire locks in consistent order\n# Bad: Thread A locks user then order; Thread B locks order then user\n# Good: Always lock user before order\n\nasync def transfer_funds(from_account: int, to_account: int, amount: Decimal):\n    # Sort to ensure consistent lock acquisition order\n    first, second = sorted([from_account, to_account])\n    \n    async with db.transaction():\n        # Lock in consistent order to prevent deadlock\n        await db.execute(\n            &quot;SELECT id FROM accounts WHERE id = ANY($1) FOR UPDATE&quot;,\n            [[first, second]]\n        )\n        # Now safe to perform transfers\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 5.6 – Locking and Deadlocks\n\n### PostgreSQL Lock Modes\n\n| Lock | Conflicts With | Acquired By |\n|---|---|---|\n| ACCESS SHARE | ACCESS EXCLUSIVE | SELECT |\n| ROW SHARE | EXCLUSIVE, ACCESS EXCLUSIVE | SELECT FOR UPDATE |\n| ROW EXCLUSIVE | SHARE and above | INSERT, UPDATE, DELETE |\n| SHARE UPDATE EXCLUSIVE | Itself, SHARE, higher | VACUUM, CREATE INDEX CONCURRENTLY |\n| SHARE | ROW EXCLUSIVE, higher | CREATE INDEX |\n| EXCLUSIVE | All except ACCESS SHARE | Rarely needed |\n| ACCESS EXCLUSIVE | All | ALTER TABLE, DROP, TRUNCATE |\n\n**Detecting Lock Contention:**\n```sql\n-- Current blocking locks\nSELECT \n    blocked.pid AS blocked_pid,\n    blocked.query AS blocked_query,\n    blocking.pid AS blocking_pid,\n    blocking.query AS blocking_query,\n    now() - blocked.query_start AS blocked_for\nFROM pg_catalog.pg_locks blocked_locks\nJOIN pg_catalog.pg_stat_activity blocked \n    ON blocked.pid = blocked_locks.pid\nJOIN pg_catalog.pg_locks blocking_locks \n    ON blocking_locks.locktype = blocked_locks.locktype\n    AND blocking_locks.pid != blocked_locks.pid\n    AND blocking_locks.granted\nJOIN pg_catalog.pg_stat_activity blocking \n    ON blocking.pid = blocking_locks.pid\nWHERE NOT blocked_locks.granted;\n```\n\n**Deadlock Prevention:**\n```python\n# Always acquire locks in consistent order\n# Bad: Thread A locks user then order; Thread B locks order then user\n# Good: Always lock user before order\n\nasync def transfer_funds(from_account: int, to_account: int, amount: Decimal):\n    # Sort to ensure consistent lock acquisition order\n    first, second = sorted([from_account, to_account])\n    \n    async with db.transaction():\n        # Lock in consistent order to prevent deadlock\n        await db.execute(\n            \"SELECT id FROM accounts WHERE id = ANY($1) FOR UPDATE\",\n            [[first, second]]\n        )\n        # Now safe to perform transfers\n```\n\n---\n\n"},{"title":"Chapter 5.7 – Replication","html":"<h2>Chapter 5.7 – Replication<\/h2>\n<h3>Streaming Replication Setup<\/h3>\n<pre><code>Primary (writes + reads)\n    ↓ WAL stream\nReplica 1 (read queries)\nReplica 2 (reporting queries)\nReplica 3 (standby for failover)\n<\/code><\/pre>\n<p><strong>postgresql.conf (Primary):<\/strong><\/p>\n<pre><code>wal_level = replica\nmax_wal_senders = 10\nwal_keep_size = 1GB\nsynchronous_standby_names = 'ANY 1 (replica1, replica2)'\n<\/code><\/pre>\n<p><strong>pg_hba.conf (Primary):<\/strong><\/p>\n<pre><code>host replication replication_user replica1_ip/32 md5\nhost replication replication_user replica2_ip/32 md5\n<\/code><\/pre>\n<p><strong>Recovery.conf / postgresql.conf (Replica):<\/strong><\/p>\n<pre><code>primary_conninfo = 'host=primary_ip port=5432 user=replication_user'\nhot_standby = on\n<\/code><\/pre>\n<h3>Logical Replication (for CDC)<\/h3>\n<pre><code class=\"language-sql\">-- On source database\nCREATE PUBLICATION my_pub FOR TABLE users, orders, events;\n\n-- On target database\nCREATE SUBSCRIPTION my_sub\n    CONNECTION 'host=source dbname=mydb user=repl password=secret'\n    PUBLICATION my_pub;\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 5.7 – Replication\n\n### Streaming Replication Setup\n\n```\nPrimary (writes + reads)\n    ↓ WAL stream\nReplica 1 (read queries)\nReplica 2 (reporting queries)\nReplica 3 (standby for failover)\n```\n\n**postgresql.conf (Primary):**\n```\nwal_level = replica\nmax_wal_senders = 10\nwal_keep_size = 1GB\nsynchronous_standby_names = 'ANY 1 (replica1, replica2)'\n```\n\n**pg_hba.conf (Primary):**\n```\nhost replication replication_user replica1_ip/32 md5\nhost replication replication_user replica2_ip/32 md5\n```\n\n**Recovery.conf / postgresql.conf (Replica):**\n```\nprimary_conninfo = 'host=primary_ip port=5432 user=replication_user'\nhot_standby = on\n```\n\n### Logical Replication (for CDC)\n\n```sql\n-- On source database\nCREATE PUBLICATION my_pub FOR TABLE users, orders, events;\n\n-- On target database\nCREATE SUBSCRIPTION my_sub\n    CONNECTION 'host=source dbname=mydb user=repl password=secret'\n    PUBLICATION my_pub;\n```\n\n---\n\n"},{"title":"Chapter 5.8 – Partitioning","html":"<h2>Chapter 5.8 – Partitioning<\/h2>\n<h3>Range Partitioning (Time-Series)<\/h3>\n<pre><code class=\"language-sql\">-- Partition events table by month\nCREATE TABLE events (\n    id BIGSERIAL,\n    tenant_id INT NOT NULL,\n    event_type VARCHAR(100) NOT NULL,\n    payload JSONB,\n    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()\n) PARTITION BY RANGE (created_at);\n\n-- Create monthly partitions\nCREATE TABLE events_2024_01 \n    PARTITION OF events\n    FOR VALUES FROM ('2024-01-01') TO ('2024-02-01');\n\nCREATE TABLE events_2024_02\n    PARTITION OF events\n    FOR VALUES FROM ('2024-02-01') TO ('2024-03-01');\n\n-- Automate with pg_partman\nSELECT partman.create_parent(\n    p_parent_table =&gt; 'public.events',\n    p_control =&gt; 'created_at',\n    p_type =&gt; 'range',\n    p_interval =&gt; 'monthly',\n    p_premake =&gt; 3  -- pre-create 3 future partitions\n);\n<\/code><\/pre>\n<p><strong>Query behavior with partitioning:<\/strong><\/p>\n<pre><code class=\"language-sql\">-- PostgreSQL prunes partitions automatically\nEXPLAIN SELECT * FROM events \nWHERE created_at &gt;= '2024-03-01' \n  AND created_at &lt; '2024-04-01';\n-- Only scans events_2024_03 partition!\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 5.8 – Partitioning\n\n### Range Partitioning (Time-Series)\n\n```sql\n-- Partition events table by month\nCREATE TABLE events (\n    id BIGSERIAL,\n    tenant_id INT NOT NULL,\n    event_type VARCHAR(100) NOT NULL,\n    payload JSONB,\n    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()\n) PARTITION BY RANGE (created_at);\n\n-- Create monthly partitions\nCREATE TABLE events_2024_01 \n    PARTITION OF events\n    FOR VALUES FROM ('2024-01-01') TO ('2024-02-01');\n\nCREATE TABLE events_2024_02\n    PARTITION OF events\n    FOR VALUES FROM ('2024-02-01') TO ('2024-03-01');\n\n-- Automate with pg_partman\nSELECT partman.create_parent(\n    p_parent_table => 'public.events',\n    p_control => 'created_at',\n    p_type => 'range',\n    p_interval => 'monthly',\n    p_premake => 3  -- pre-create 3 future partitions\n);\n```\n\n**Query behavior with partitioning:**\n```sql\n-- PostgreSQL prunes partitions automatically\nEXPLAIN SELECT * FROM events \nWHERE created_at >= '2024-03-01' \n  AND created_at < '2024-04-01';\n-- Only scans events_2024_03 partition!\n```\n\n---\n\n"},{"title":"Chapter 5.9 – Performance Tuning Checklist","html":"<h2>Chapter 5.9 – Performance Tuning Checklist<\/h2>\n<h3>Memory Settings<\/h3>\n<pre><code># For 16GB RAM server:\nshared_buffers = 4GB              # 25% of RAM\neffective_cache_size = 12GB       # 75% of RAM (used by planner)\nwork_mem = 64MB                   # Per sort/hash — watch for parallel queries\nmaintenance_work_mem = 1GB        # For VACUUM, CREATE INDEX\neffective_io_concurrency = 200    # SSDs: 200, HDDs: 2\n<\/code><\/pre>\n<h3>Connection Pooling (PgBouncer)<\/h3>\n<pre><code class=\"language-ini\">[pgbouncer]\nlisten_addr = 0.0.0.0\nlisten_port = 5432\npool_mode = transaction           # Best for most web apps\nmax_client_conn = 5000\ndefault_pool_size = 20\nmin_pool_size = 5\nreserve_pool_size = 5\nreserve_pool_timeout = 5.0\nserver_idle_timeout = 600\n<\/code><\/pre>\n<h3>The PostgreSQL Performance Checklist<\/h3>\n<ul>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/><code>shared_buffers<\/code> = 25% of RAM<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/><code>work_mem<\/code> appropriate for query complexity<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>VACUUM enabled and autovacuum tuned<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>All foreign keys indexed<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>No unused indexes<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Connection pooling (PgBouncer in transaction mode)<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/><code>pg_stat_statements<\/code> enabled for query monitoring<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Partitioning for tables &gt; 100M rows<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>EXPLAIN ANALYZE reviewed for all critical queries<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Streaming replication for HA<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>WAL archiving for PITR<\/li>\n<\/ul>\n<hr />\n","text":"## Chapter 5.9 – Performance Tuning Checklist\n\n### Memory Settings\n\n```\n# For 16GB RAM server:\nshared_buffers = 4GB              # 25% of RAM\neffective_cache_size = 12GB       # 75% of RAM (used by planner)\nwork_mem = 64MB                   # Per sort/hash — watch for parallel queries\nmaintenance_work_mem = 1GB        # For VACUUM, CREATE INDEX\neffective_io_concurrency = 200    # SSDs: 200, HDDs: 2\n```\n\n### Connection Pooling (PgBouncer)\n\n```ini\n[pgbouncer]\nlisten_addr = 0.0.0.0\nlisten_port = 5432\npool_mode = transaction           # Best for most web apps\nmax_client_conn = 5000\ndefault_pool_size = 20\nmin_pool_size = 5\nreserve_pool_size = 5\nreserve_pool_timeout = 5.0\nserver_idle_timeout = 600\n```\n\n### The PostgreSQL Performance Checklist\n\n- [ ] `shared_buffers` = 25% of RAM\n- [ ] `work_mem` appropriate for query complexity\n- [ ] VACUUM enabled and autovacuum tuned\n- [ ] All foreign keys indexed\n- [ ] No unused indexes\n- [ ] Connection pooling (PgBouncer in transaction mode)\n- [ ] `pg_stat_statements` enabled for query monitoring\n- [ ] Partitioning for tables > 100M rows\n- [ ] EXPLAIN ANALYZE reviewed for all critical queries\n- [ ] Streaming replication for HA\n- [ ] WAL archiving for PITR\n\n---\n\n"},{"title":"Chapter 5.10 – Practice Labs","html":"<h2>Chapter 5.10 – Practice Labs<\/h2>\n<p><strong>Lab 1:<\/strong> Set up a PostgreSQL instance with streaming replication and test failover.<\/p>\n<p><strong>Lab 2:<\/strong> Create a time-series table with monthly partitioning using pg_partman. Load 50M rows and compare query performance with/without partitioning.<\/p>\n<p><strong>Lab 3:<\/strong> Take a slow query (&gt;100ms) from a real project, use EXPLAIN ANALYZE to diagnose, create the right index, and verify improvement.<\/p>\n<p><strong>Lab 4:<\/strong> Simulate a deadlock scenario between two concurrent transactions. Fix it by using consistent lock ordering.<\/p>\n<p><strong>Lab 5:<\/strong> Perform a Point-in-Time Recovery from a WAL archive to a specific timestamp.<\/p>\n<hr />\n","text":"## Chapter 5.10 – Practice Labs\n\n**Lab 1:** Set up a PostgreSQL instance with streaming replication and test failover.\n\n**Lab 2:** Create a time-series table with monthly partitioning using pg_partman. Load 50M rows and compare query performance with/without partitioning.\n\n**Lab 3:** Take a slow query (>100ms) from a real project, use EXPLAIN ANALYZE to diagnose, create the right index, and verify improvement.\n\n**Lab 4:** Simulate a deadlock scenario between two concurrent transactions. Fix it by using consistent lock ordering.\n\n**Lab 5:** Perform a Point-in-Time Recovery from a WAL archive to a specific timestamp.\n\n---\n\n"}]},{"id":6,"title":"Distributed Systems","chapters":[{"title":"Introduction","html":"<h1>PART 6 – DISTRIBUTED SYSTEMS<\/h1>\n<hr />\n","text":"# PART 6 – DISTRIBUTED SYSTEMS\n\n---\n\n"},{"title":"Chapter 6.1 – Why Distributed Systems Theory Matters","html":"<h2>Chapter 6.1 – Why Distributed Systems Theory Matters<\/h2>\n<p>You've built distributed systems in practice. This chapter gives you the theoretical vocabulary and formal models that let you:<\/p>\n<ul>\n<li>Reason about correctness guarantees in a precise language<\/li>\n<li>Make principled trade-off decisions rather than intuitive ones<\/li>\n<li>Discuss system design at the depth expected of a Staff/Principal engineer<\/li>\n<li>Understand why some failures are fundamentally unavoidable<\/li>\n<\/ul>\n<hr />\n","text":"## Chapter 6.1 – Why Distributed Systems Theory Matters\n\nYou've built distributed systems in practice. This chapter gives you the theoretical vocabulary and formal models that let you:\n\n- Reason about correctness guarantees in a precise language\n- Make principled trade-off decisions rather than intuitive ones\n- Discuss system design at the depth expected of a Staff/Principal engineer\n- Understand why some failures are fundamentally unavoidable\n\n---\n\n"},{"title":"Chapter 6.2 – The CAP Theorem","html":"<h2>Chapter 6.2 – The CAP Theorem<\/h2>\n<h3>Statement<\/h3>\n<p>In the presence of a <strong>network partition<\/strong>, a distributed system must choose between <strong>Consistency<\/strong> and <strong>Availability<\/strong>.<\/p>\n<pre><code>C — Consistency: every read receives the most recent write (or an error)\nA — Availability: every request receives a response (not an error)\nP — Partition Tolerance: the system continues operating despite network partitions\n<\/code><\/pre>\n<p>Since network partitions are inevitable in real distributed systems (P is not optional), real systems choose between CP and AP.<\/p>\n<h3>In Practice<\/h3>\n<table>\n<thead>\n<tr>\n  <th>System<\/th>\n  <th>Type<\/th>\n  <th>Trade-off<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>PostgreSQL (single node)<\/td>\n  <td>CA<\/td>\n  <td>No partition tolerance<\/td>\n<\/tr>\n<tr>\n  <td>PostgreSQL (with replicas)<\/td>\n  <td>CP<\/td>\n  <td>Replica may be stale<\/td>\n<\/tr>\n<tr>\n  <td>Cassandra<\/td>\n  <td>AP<\/td>\n  <td>Eventually consistent<\/td>\n<\/tr>\n<tr>\n  <td>DynamoDB<\/td>\n  <td>AP (configurable)<\/td>\n  <td>Eventual or strong consistency<\/td>\n<\/tr>\n<tr>\n  <td>ZooKeeper<\/td>\n  <td>CP<\/td>\n  <td>Unavailable during leader election<\/td>\n<\/tr>\n<tr>\n  <td>Redis Cluster<\/td>\n  <td>AP<\/td>\n  <td>Can lose data during partition<\/td>\n<\/tr>\n<tr>\n  <td>Google Spanner<\/td>\n  <td>CP (claims CA)<\/td>\n  <td>External consistency via TrueTime<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Beyond CAP: The PACELC Model<\/h3>\n<p>CAP only addresses partitions. PACELC adds:<\/p>\n<blockquote>\n<p>&quot;Even when the system is running normally (no partition), there's a trade-off between <strong>L<\/strong>atency and <strong>C<\/strong>onsistency.&quot;<\/p>\n<\/blockquote>\n<table>\n<thead>\n<tr>\n  <th>System<\/th>\n  <th>Partition behavior<\/th>\n  <th>Normal behavior<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Cassandra<\/td>\n  <td>AP<\/td>\n  <td>EL (Eventual/Low latency)<\/td>\n<\/tr>\n<tr>\n  <td>DynamoDB<\/td>\n  <td>AP<\/td>\n  <td>EL<\/td>\n<\/tr>\n<tr>\n  <td>Zookeeper<\/td>\n  <td>CP<\/td>\n  <td>EC (Consistent/High latency)<\/td>\n<\/tr>\n<tr>\n  <td>MongoDB<\/td>\n  <td>CP<\/td>\n  <td>EC<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n","text":"## Chapter 6.2 – The CAP Theorem\n\n### Statement\n\nIn the presence of a **network partition**, a distributed system must choose between **Consistency** and **Availability**.\n\n```\nC — Consistency: every read receives the most recent write (or an error)\nA — Availability: every request receives a response (not an error)\nP — Partition Tolerance: the system continues operating despite network partitions\n```\n\nSince network partitions are inevitable in real distributed systems (P is not optional), real systems choose between CP and AP.\n\n### In Practice\n\n| System | Type | Trade-off |\n|---|---|---|\n| PostgreSQL (single node) | CA | No partition tolerance |\n| PostgreSQL (with replicas) | CP | Replica may be stale |\n| Cassandra | AP | Eventually consistent |\n| DynamoDB | AP (configurable) | Eventual or strong consistency |\n| ZooKeeper | CP | Unavailable during leader election |\n| Redis Cluster | AP | Can lose data during partition |\n| Google Spanner | CP (claims CA) | External consistency via TrueTime |\n\n### Beyond CAP: The PACELC Model\n\nCAP only addresses partitions. PACELC adds:\n\n> \"Even when the system is running normally (no partition), there's a trade-off between **L**atency and **C**onsistency.\"\n\n| System | Partition behavior | Normal behavior |\n|---|---|---|\n| Cassandra | AP | EL (Eventual/Low latency) |\n| DynamoDB | AP | EL |\n| Zookeeper | CP | EC (Consistent/High latency) |\n| MongoDB | CP | EC |\n\n---\n\n"},{"title":"Chapter 6.3 – Consistency Models","html":"<h2>Chapter 6.3 – Consistency Models<\/h2>\n<h3>The Consistency Spectrum<\/h3>\n<pre><code>Strongest                                           Weakest\n    │                                                   │\n    ▼                                                   ▼\nLinearizability → Sequential → Causal → Eventual → Read-your-writes\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n  <th>Model<\/th>\n  <th>Guarantee<\/th>\n  <th>Example Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><strong>Linearizability<\/strong><\/td>\n  <td>Reads return most recent write, globally<\/td>\n  <td>Financial transactions<\/td>\n<\/tr>\n<tr>\n  <td><strong>Sequential Consistency<\/strong><\/td>\n  <td>All processes see same order (not real-time)<\/td>\n  <td>Version control<\/td>\n<\/tr>\n<tr>\n  <td><strong>Causal Consistency<\/strong><\/td>\n  <td>Causally related ops seen in order<\/td>\n  <td>Comments/replies<\/td>\n<\/tr>\n<tr>\n  <td><strong>Eventual Consistency<\/strong><\/td>\n  <td>Eventually all replicas converge<\/td>\n  <td>DNS, CDN caches<\/td>\n<\/tr>\n<tr>\n  <td><strong>Read-Your-Writes<\/strong><\/td>\n  <td>You always see your own writes<\/td>\n  <td>User profile updates<\/td>\n<\/tr>\n<tr>\n  <td><strong>Monotonic Reads<\/strong><\/td>\n  <td>Never read older version after newer<\/td>\n  <td>Timeline views<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n","text":"## Chapter 6.3 – Consistency Models\n\n### The Consistency Spectrum\n\n```\nStrongest                                           Weakest\n    │                                                   │\n    ▼                                                   ▼\nLinearizability → Sequential → Causal → Eventual → Read-your-writes\n```\n\n| Model | Guarantee | Example Use |\n|---|---|---|\n| **Linearizability** | Reads return most recent write, globally | Financial transactions |\n| **Sequential Consistency** | All processes see same order (not real-time) | Version control |\n| **Causal Consistency** | Causally related ops seen in order | Comments/replies |\n| **Eventual Consistency** | Eventually all replicas converge | DNS, CDN caches |\n| **Read-Your-Writes** | You always see your own writes | User profile updates |\n| **Monotonic Reads** | Never read older version after newer | Timeline views |\n\n---\n\n"},{"title":"Chapter 6.4 – Consensus: Paxos and Raft","html":"<h2>Chapter 6.4 – Consensus: Paxos and Raft<\/h2>\n<h3>Why Consensus is Hard<\/h3>\n<p>The distributed systems fundamental challenge:<\/p>\n<blockquote>\n<p><strong>FLP Impossibility<\/strong> (Fischer, Lynch, Paterson, 1985): In an asynchronous network where even one process can fail, there is no deterministic algorithm that can guarantee consensus.<\/p>\n<\/blockquote>\n<p>In practice, we add randomization and timeouts to work around FLP.<\/p>\n<h3>Raft (the understandable consensus algorithm)<\/h3>\n<p>Raft solves distributed consensus through:<\/p>\n<p><strong>1. Leader Election:<\/strong><\/p>\n<pre><code>All nodes start as followers\nIf a follower doesn't hear from leader, it becomes a candidate\nCandidate requests votes from all nodes\nIf majority votes received → becomes leader\nLeader sends heartbeats to prevent new elections\n<\/code><\/pre>\n<p><strong>2. Log Replication:<\/strong><\/p>\n<pre><code>Client sends command to leader\nLeader appends to its log\nLeader sends AppendEntries to all followers\nIf majority acknowledge → command is committed\nLeader tells followers command is committed\nAll apply command to state machine\n<\/code><\/pre>\n<p><strong>3. Safety Guarantees:<\/strong><\/p>\n<ul>\n<li>Only one leader per term<\/li>\n<li>Leader has all committed entries from previous terms<\/li>\n<li>Entries are committed only when stored on majority<\/li>\n<\/ul>\n<p><strong>Raft in Practice:<\/strong><\/p>\n<ul>\n<li>etcd (Kubernetes state store) — uses Raft<\/li>\n<li>TiKV (distributed key-value store) — uses Raft<\/li>\n<li>CockroachDB — uses Raft per range<\/li>\n<\/ul>\n<p><strong>Raft Animation Resource:<\/strong> <a href=\"http://thesecretlivesofdata.com/raft/\">http://thesecretlivesofdata.com/raft/<\/a> — Essential visual.<\/p>\n<hr />\n","text":"## Chapter 6.4 – Consensus: Paxos and Raft\n\n### Why Consensus is Hard\n\nThe distributed systems fundamental challenge:\n\n> **FLP Impossibility** (Fischer, Lynch, Paterson, 1985): In an asynchronous network where even one process can fail, there is no deterministic algorithm that can guarantee consensus.\n\nIn practice, we add randomization and timeouts to work around FLP.\n\n### Raft (the understandable consensus algorithm)\n\nRaft solves distributed consensus through:\n\n**1. Leader Election:**\n```\nAll nodes start as followers\nIf a follower doesn't hear from leader, it becomes a candidate\nCandidate requests votes from all nodes\nIf majority votes received → becomes leader\nLeader sends heartbeats to prevent new elections\n```\n\n**2. Log Replication:**\n```\nClient sends command to leader\nLeader appends to its log\nLeader sends AppendEntries to all followers\nIf majority acknowledge → command is committed\nLeader tells followers command is committed\nAll apply command to state machine\n```\n\n**3. Safety Guarantees:**\n- Only one leader per term\n- Leader has all committed entries from previous terms\n- Entries are committed only when stored on majority\n\n**Raft in Practice:**\n- etcd (Kubernetes state store) — uses Raft\n- TiKV (distributed key-value store) — uses Raft\n- CockroachDB — uses Raft per range\n\n**Raft Animation Resource:** http://thesecretlivesofdata.com/raft/ — Essential visual.\n\n---\n\n"},{"title":"Chapter 6.5 – Distributed Transactions","html":"<h2>Chapter 6.5 – Distributed Transactions<\/h2>\n<h3>The Two-Phase Commit (2PC) Protocol<\/h3>\n<pre><code>Phase 1 (Prepare):\n  Coordinator → all participants: &quot;Prepare to commit&quot;\n  Participants: execute transaction, write to log, reply &quot;yes&quot; or &quot;no&quot;\n\nPhase 2 (Commit):\n  If all &quot;yes&quot; → Coordinator sends &quot;commit&quot; to all participants\n  If any &quot;no&quot; → Coordinator sends &quot;abort&quot; to all participants\n<\/code><\/pre>\n<p><strong>2PC Problems:<\/strong><\/p>\n<ul>\n<li>Coordinator failure → participants stuck in prepared state<\/li>\n<li>Slow (requires 2 round trips)<\/li>\n<li>Blocking protocol (participants hold locks)<\/li>\n<\/ul>\n<h3>The Saga Pattern (Modern Alternative)<\/h3>\n<p>For long-running distributed transactions across services:<\/p>\n<pre><code>Saga = sequence of local transactions + compensating transactions\n\nExample: Hotel booking saga\n  1. Reserve hotel room → (compensate: cancel reservation)\n  2. Reserve flight → (compensate: cancel flight)\n  3. Charge credit card → (compensate: issue refund)\n\nIf step 3 fails:\n  → Execute compensation for step 2 (cancel flight)\n  → Execute compensation for step 1 (cancel room)\n<\/code><\/pre>\n<p><strong>Choreography Saga (event-based):<\/strong><\/p>\n<pre><code>Booking Service emits: BookingRequested\nHotel Service listens → reserves room → emits: HotelReserved\nFlight Service listens → books flight → emits: FlightBooked\nPayment Service listens → charges card → emits: PaymentProcessed\nBooking Service: marks booking complete\n<\/code><\/pre>\n<p><strong>Orchestration Saga (central coordinator):<\/strong><\/p>\n<pre><code>Saga Orchestrator:\n  Step 1: Call hotel service → success\n  Step 2: Call flight service → success\n  Step 3: Call payment service → failure!\n  Compensation Step 2: Call flight service (cancel)\n  Compensation Step 1: Call hotel service (cancel)\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 6.5 – Distributed Transactions\n\n### The Two-Phase Commit (2PC) Protocol\n\n```\nPhase 1 (Prepare):\n  Coordinator → all participants: \"Prepare to commit\"\n  Participants: execute transaction, write to log, reply \"yes\" or \"no\"\n\nPhase 2 (Commit):\n  If all \"yes\" → Coordinator sends \"commit\" to all participants\n  If any \"no\" → Coordinator sends \"abort\" to all participants\n```\n\n**2PC Problems:**\n- Coordinator failure → participants stuck in prepared state\n- Slow (requires 2 round trips)\n- Blocking protocol (participants hold locks)\n\n### The Saga Pattern (Modern Alternative)\n\nFor long-running distributed transactions across services:\n\n```\nSaga = sequence of local transactions + compensating transactions\n\nExample: Hotel booking saga\n  1. Reserve hotel room → (compensate: cancel reservation)\n  2. Reserve flight → (compensate: cancel flight)\n  3. Charge credit card → (compensate: issue refund)\n\nIf step 3 fails:\n  → Execute compensation for step 2 (cancel flight)\n  → Execute compensation for step 1 (cancel room)\n```\n\n**Choreography Saga (event-based):**\n```\nBooking Service emits: BookingRequested\nHotel Service listens → reserves room → emits: HotelReserved\nFlight Service listens → books flight → emits: FlightBooked\nPayment Service listens → charges card → emits: PaymentProcessed\nBooking Service: marks booking complete\n```\n\n**Orchestration Saga (central coordinator):**\n```\nSaga Orchestrator:\n  Step 1: Call hotel service → success\n  Step 2: Call flight service → success\n  Step 3: Call payment service → failure!\n  Compensation Step 2: Call flight service (cancel)\n  Compensation Step 1: Call hotel service (cancel)\n```\n\n---\n\n"},{"title":"Chapter 6.6 – Sharding and Replication","html":"<h2>Chapter 6.6 – Sharding and Replication<\/h2>\n<h3>Horizontal Partitioning (Sharding)<\/h3>\n<p><strong>Consistent Hashing:<\/strong><\/p>\n<pre><code class=\"language-python\">import hashlib\nimport bisect\n\nclass ConsistentHashRing:\n    def __init__(self, nodes: list[str], virtual_nodes: int = 150):\n        self.ring = {}\n        self.sorted_keys = []\n        self.virtual_nodes = virtual_nodes\n        \n        for node in nodes:\n            self.add_node(node)\n    \n    def add_node(self, node: str):\n        for i in range(self.virtual_nodes):\n            key = self._hash(f&quot;{node}:{i}&quot;)\n            self.ring[key] = node\n            bisect.insort(self.sorted_keys, key)\n    \n    def remove_node(self, node: str):\n        for i in range(self.virtual_nodes):\n            key = self._hash(f&quot;{node}:{i}&quot;)\n            del self.ring[key]\n            self.sorted_keys.remove(key)\n    \n    def get_node(self, key: str) -&gt; str:\n        hash_key = self._hash(key)\n        idx = bisect.bisect(self.sorted_keys, hash_key) % len(self.sorted_keys)\n        return self.ring[self.sorted_keys[idx]]\n    \n    def _hash(self, key: str) -&gt; int:\n        return int(hashlib.md5(key.encode()).hexdigest(), 16)\n<\/code><\/pre>\n<h3>Shard Distribution Strategies<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Strategy<\/th>\n  <th>Pros<\/th>\n  <th>Cons<\/th>\n  <th>Best For<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Range-based<\/td>\n  <td>Simple, range queries efficient<\/td>\n  <td>Hot spots on sequential data<\/td>\n  <td>User IDs, dates<\/td>\n<\/tr>\n<tr>\n  <td>Hash-based<\/td>\n  <td>Even distribution<\/td>\n  <td>Range queries scatter<\/td>\n  <td>User data, sessions<\/td>\n<\/tr>\n<tr>\n  <td>Directory-based<\/td>\n  <td>Flexible, can rebalance<\/td>\n  <td>Lookup overhead<\/td>\n  <td>Complex rebalancing needs<\/td>\n<\/tr>\n<tr>\n  <td>Geographic<\/td>\n  <td>Low latency for users<\/td>\n  <td>Cross-region queries expensive<\/td>\n  <td>Global user bases<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n","text":"## Chapter 6.6 – Sharding and Replication\n\n### Horizontal Partitioning (Sharding)\n\n**Consistent Hashing:**\n```python\nimport hashlib\nimport bisect\n\nclass ConsistentHashRing:\n    def __init__(self, nodes: list[str], virtual_nodes: int = 150):\n        self.ring = {}\n        self.sorted_keys = []\n        self.virtual_nodes = virtual_nodes\n        \n        for node in nodes:\n            self.add_node(node)\n    \n    def add_node(self, node: str):\n        for i in range(self.virtual_nodes):\n            key = self._hash(f\"{node}:{i}\")\n            self.ring[key] = node\n            bisect.insort(self.sorted_keys, key)\n    \n    def remove_node(self, node: str):\n        for i in range(self.virtual_nodes):\n            key = self._hash(f\"{node}:{i}\")\n            del self.ring[key]\n            self.sorted_keys.remove(key)\n    \n    def get_node(self, key: str) -> str:\n        hash_key = self._hash(key)\n        idx = bisect.bisect(self.sorted_keys, hash_key) % len(self.sorted_keys)\n        return self.ring[self.sorted_keys[idx]]\n    \n    def _hash(self, key: str) -> int:\n        return int(hashlib.md5(key.encode()).hexdigest(), 16)\n```\n\n### Shard Distribution Strategies\n\n| Strategy | Pros | Cons | Best For |\n|---|---|---|---|\n| Range-based | Simple, range queries efficient | Hot spots on sequential data | User IDs, dates |\n| Hash-based | Even distribution | Range queries scatter | User data, sessions |\n| Directory-based | Flexible, can rebalance | Lookup overhead | Complex rebalancing needs |\n| Geographic | Low latency for users | Cross-region queries expensive | Global user bases |\n\n---\n\n"},{"title":"Chapter 6.7 – Idempotency, Retries, and Exactly-Once","html":"<h2>Chapter 6.7 – Idempotency, Retries, and Exactly-Once<\/h2>\n<h3>Making Operations Idempotent<\/h3>\n<pre><code class=\"language-python\"># Payment processing with idempotency\nimport uuid\nfrom datetime import datetime\n\nclass PaymentService:\n    async def process_payment(\n        self,\n        idempotency_key: str,\n        amount: Decimal,\n        currency: str,\n        source: str,\n    ) -&gt; PaymentResult:\n        # Check if we've seen this key before\n        existing = await self.db.get_payment_by_idempotency_key(idempotency_key)\n        if existing:\n            return existing  # Return same response, don't double-charge!\n        \n        # Process the payment\n        result = await self.payment_gateway.charge(amount, currency, source)\n        \n        # Store idempotency key with result\n        await self.db.store_idempotent_result(\n            key=idempotency_key,\n            result=result,\n            expires_at=datetime.utcnow() + timedelta(days=7),\n        )\n        \n        return result\n<\/code><\/pre>\n<h3>The Outbox Pattern (Reliable Event Publishing)<\/h3>\n<p>Solving the dual-write problem — updating the database and publishing an event atomically:<\/p>\n<pre><code class=\"language-python\"># Instead of: update DB then publish to Kafka (can fail between these)\n# Use the outbox pattern:\n\nasync def create_order(order_data: dict, db: AsyncSession):\n    async with db.transaction():\n        # 1. Create the order\n        order = Order(**order_data)\n        db.add(order)\n        await db.flush()\n        \n        # 2. Write outbox event IN THE SAME TRANSACTION\n        outbox_event = OutboxEvent(\n            aggregate_id=order.id,\n            event_type=&quot;OrderCreated&quot;,\n            payload=order.to_dict(),\n            created_at=datetime.utcnow(),\n        )\n        db.add(outbox_event)\n        # Transaction commits: both order and event are persisted\n\n# Separate outbox processor publishes events to Kafka\n# If it fails and retries → uses idempotency key to avoid duplicates\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 6.7 – Idempotency, Retries, and Exactly-Once\n\n### Making Operations Idempotent\n\n```python\n# Payment processing with idempotency\nimport uuid\nfrom datetime import datetime\n\nclass PaymentService:\n    async def process_payment(\n        self,\n        idempotency_key: str,\n        amount: Decimal,\n        currency: str,\n        source: str,\n    ) -> PaymentResult:\n        # Check if we've seen this key before\n        existing = await self.db.get_payment_by_idempotency_key(idempotency_key)\n        if existing:\n            return existing  # Return same response, don't double-charge!\n        \n        # Process the payment\n        result = await self.payment_gateway.charge(amount, currency, source)\n        \n        # Store idempotency key with result\n        await self.db.store_idempotent_result(\n            key=idempotency_key,\n            result=result,\n            expires_at=datetime.utcnow() + timedelta(days=7),\n        )\n        \n        return result\n```\n\n### The Outbox Pattern (Reliable Event Publishing)\n\nSolving the dual-write problem — updating the database and publishing an event atomically:\n\n```python\n# Instead of: update DB then publish to Kafka (can fail between these)\n# Use the outbox pattern:\n\nasync def create_order(order_data: dict, db: AsyncSession):\n    async with db.transaction():\n        # 1. Create the order\n        order = Order(**order_data)\n        db.add(order)\n        await db.flush()\n        \n        # 2. Write outbox event IN THE SAME TRANSACTION\n        outbox_event = OutboxEvent(\n            aggregate_id=order.id,\n            event_type=\"OrderCreated\",\n            payload=order.to_dict(),\n            created_at=datetime.utcnow(),\n        )\n        db.add(outbox_event)\n        # Transaction commits: both order and event are persisted\n\n# Separate outbox processor publishes events to Kafka\n# If it fails and retries → uses idempotency key to avoid duplicates\n```\n\n---\n\n"},{"title":"Chapter 6.8 – Case Studies","html":"<h2>Chapter 6.8 – Case Studies<\/h2>\n<h3>Case Study 1: How Cassandra Trades Consistency for Availability<\/h3>\n<p>Cassandra uses:<\/p>\n<ul>\n<li>Tunable consistency (<code>QUORUM<\/code>, <code>ONE<\/code>, <code>ALL<\/code>)<\/li>\n<li>Last-write-wins conflict resolution<\/li>\n<li>Gossip protocol for cluster state<\/li>\n<li>Token ring for data distribution<\/li>\n<\/ul>\n<p>For your Qdrant/vector database work: similar consistency trade-offs apply in distributed vector search.<\/p>\n<h3>Case Study 2: How Kafka Achieves Fault-Tolerant Message Delivery<\/h3>\n<p>Kafka's durability model:<\/p>\n<ul>\n<li>Messages written to leader, replicated to followers<\/li>\n<li><code>acks=all<\/code> means all in-sync replicas confirm<\/li>\n<li>Consumer offset tracking enables exactly-once processing<\/li>\n<li>Partition leadership election via ZooKeeper/KRaft<\/li>\n<\/ul>\n<h3>Case Study 3: The Dynamo Paper (Amazon DynamoDB Origins)<\/h3>\n<p>Key innovations:<\/p>\n<ul>\n<li>Consistent hashing for horizontal scaling<\/li>\n<li>Vector clocks for conflict detection<\/li>\n<li>Sloppy quorum for high availability<\/li>\n<li>Anti-entropy for eventual convergence<\/li>\n<\/ul>\n<p><strong>Recommended reading:<\/strong> Dynamo: Amazon's Highly Available Key-Value Store (2007 SOSP paper)<\/p>\n<hr />\n","text":"## Chapter 6.8 – Case Studies\n\n### Case Study 1: How Cassandra Trades Consistency for Availability\n\nCassandra uses:\n- Tunable consistency (`QUORUM`, `ONE`, `ALL`)\n- Last-write-wins conflict resolution\n- Gossip protocol for cluster state\n- Token ring for data distribution\n\nFor your Qdrant/vector database work: similar consistency trade-offs apply in distributed vector search.\n\n### Case Study 2: How Kafka Achieves Fault-Tolerant Message Delivery\n\nKafka's durability model:\n- Messages written to leader, replicated to followers\n- `acks=all` means all in-sync replicas confirm\n- Consumer offset tracking enables exactly-once processing\n- Partition leadership election via ZooKeeper/KRaft\n\n### Case Study 3: The Dynamo Paper (Amazon DynamoDB Origins)\n\nKey innovations:\n- Consistent hashing for horizontal scaling\n- Vector clocks for conflict detection\n- Sloppy quorum for high availability\n- Anti-entropy for eventual convergence\n\n**Recommended reading:** Dynamo: Amazon's Highly Available Key-Value Store (2007 SOSP paper)\n\n---\n\n"},{"title":"Chapter 6.9 – Learning Resources","html":"<h2>Chapter 6.9 – Learning Resources<\/h2>\n<h3>Books (University-Level)<\/h3>\n<ol>\n<li><em>Designing Data-Intensive Applications<\/em> — Martin Kleppmann — <strong>Must-read<\/strong><\/li>\n<li><em>Distributed Systems: Principles and Paradigms<\/em> — Tanenbaum &amp; Van Steen<\/li>\n<li><em>Database Internals<\/em> — Alex Petrov (storage engines, distributed protocols)<\/li>\n<li><em>Understanding Distributed Systems<\/em> — Roberto Vitillo (practical focus)<\/li>\n<\/ol>\n<h3>Papers to Read<\/h3>\n<ol>\n<li>Dynamo (Amazon, 2007)<\/li>\n<li>MapReduce (Google, 2004)<\/li>\n<li>Bigtable (Google, 2006)<\/li>\n<li>Spanner (Google, 2012)<\/li>\n<li>Kafka (LinkedIn, 2011)<\/li>\n<li>Raft (Stanford, 2014)<\/li>\n<li>CRDT papers (for conflict-free data types)<\/li>\n<\/ol>\n<h3>YouTube / Courses<\/h3>\n<ul>\n<li><strong>MIT 6.824 Distributed Systems<\/strong> — Free lecture videos, best course available<\/li>\n<li><strong>CMU 15-445<\/strong> — Database internals<\/li>\n<li><strong>Martin Kleppmann's talks<\/strong> — Cambridge lectures on distributed systems<\/li>\n<li><strong>Jordanhasnolife<\/strong> YouTube — Database internals deep dives<\/li>\n<\/ul>\n<hr />\n","text":"## Chapter 6.9 – Learning Resources\n\n### Books (University-Level)\n\n1. *Designing Data-Intensive Applications* — Martin Kleppmann — **Must-read**\n2. *Distributed Systems: Principles and Paradigms* — Tanenbaum & Van Steen\n3. *Database Internals* — Alex Petrov (storage engines, distributed protocols)\n4. *Understanding Distributed Systems* — Roberto Vitillo (practical focus)\n\n### Papers to Read\n\n1. Dynamo (Amazon, 2007)\n2. MapReduce (Google, 2004)\n3. Bigtable (Google, 2006)\n4. Spanner (Google, 2012)\n5. Kafka (LinkedIn, 2011)\n6. Raft (Stanford, 2014)\n7. CRDT papers (for conflict-free data types)\n\n### YouTube / Courses\n\n- **MIT 6.824 Distributed Systems** — Free lecture videos, best course available\n- **CMU 15-445** — Database internals\n- **Martin Kleppmann's talks** — Cambridge lectures on distributed systems\n- **Jordanhasnolife** YouTube — Database internals deep dives\n\n---\n\n"}]},{"id":7,"title":"System Design Mastery","chapters":[{"title":"Introduction","html":"<h1>PART 7 – SYSTEM DESIGN MASTERY<\/h1>\n<hr />\n","text":"# PART 7 – SYSTEM DESIGN MASTERY\n\n---\n\n"},{"title":"Chapter 7.1 – The System Design Interview Framework","html":"<h2>Chapter 7.1 – The System Design Interview Framework<\/h2>\n<h3>The 6-Step Process (For Any System Design Question)<\/h3>\n<p><strong>Step 1: Clarify Requirements (5 min)<\/strong><\/p>\n<ul>\n<li>What are the core features?<\/li>\n<li>Scale: users, data, read/write ratio?<\/li>\n<li>Availability requirements (99.9% vs 99.99%)?<\/li>\n<li>Latency requirements (p99 target)?<\/li>\n<li>Consistency requirements (strong vs eventual)?<\/li>\n<\/ul>\n<p><strong>Step 2: Capacity Estimation (3 min)<\/strong><\/p>\n<ul>\n<li>Daily active users → requests per second<\/li>\n<li>Data size per request → storage requirements<\/li>\n<li>Read/write ratio → infrastructure sizing<\/li>\n<\/ul>\n<p><strong>Step 3: High-Level Design (10 min)<\/strong><\/p>\n<ul>\n<li>Start with the simplest end-to-end solution<\/li>\n<li>Client → Load Balancer → Application → Database<\/li>\n<li>Identify the core APIs<\/li>\n<\/ul>\n<p><strong>Step 4: Deep Dive (20 min)<\/strong><\/p>\n<ul>\n<li>Pick the 2-3 hardest sub-problems<\/li>\n<li>For each: discuss trade-offs, alternatives considered<\/li>\n<li>Show awareness of failure modes<\/li>\n<\/ul>\n<p><strong>Step 5: Bottlenecks and Scaling (5 min)<\/strong><\/p>\n<ul>\n<li>Identify the top bottlenecks<\/li>\n<li>How would you scale to 10x traffic?<\/li>\n<\/ul>\n<p><strong>Step 6: Summary<\/strong><\/p>\n<ul>\n<li>Restate key decisions and trade-offs made<\/li>\n<\/ul>\n<hr />\n","text":"## Chapter 7.1 – The System Design Interview Framework\n\n### The 6-Step Process (For Any System Design Question)\n\n**Step 1: Clarify Requirements (5 min)**\n- What are the core features?\n- Scale: users, data, read/write ratio?\n- Availability requirements (99.9% vs 99.99%)?\n- Latency requirements (p99 target)?\n- Consistency requirements (strong vs eventual)?\n\n**Step 2: Capacity Estimation (3 min)**\n- Daily active users → requests per second\n- Data size per request → storage requirements\n- Read/write ratio → infrastructure sizing\n\n**Step 3: High-Level Design (10 min)**\n- Start with the simplest end-to-end solution\n- Client → Load Balancer → Application → Database\n- Identify the core APIs\n\n**Step 4: Deep Dive (20 min)**\n- Pick the 2-3 hardest sub-problems\n- For each: discuss trade-offs, alternatives considered\n- Show awareness of failure modes\n\n**Step 5: Bottlenecks and Scaling (5 min)**\n- Identify the top bottlenecks\n- How would you scale to 10x traffic?\n\n**Step 6: Summary**\n- Restate key decisions and trade-offs made\n\n---\n\n"},{"title":"Chapter 7.2 – System Design: WhatsApp","html":"<h2>Chapter 7.2 – System Design: WhatsApp<\/h2>\n<h3>Requirements<\/h3>\n<p><strong>Functional:<\/strong><\/p>\n<ul>\n<li>1:1 messaging<\/li>\n<li>Group messaging (up to 256 members)<\/li>\n<li>Message delivery statuses (sent, delivered, read)<\/li>\n<li>Online/last-seen status<\/li>\n<li>Media sharing (images, videos, documents)<\/li>\n<\/ul>\n<p><strong>Non-Functional:<\/strong><\/p>\n<ul>\n<li>2 billion users, 100 billion messages/day<\/li>\n<li>Messages must be delivered eventually (AP system)<\/li>\n<li>End-to-end encryption<\/li>\n<li>Low latency (&lt; 500ms message delivery)<\/li>\n<li>Messages stored on device, not server (after delivery)<\/li>\n<\/ul>\n<h3>Capacity Estimation<\/h3>\n<pre><code>Daily messages: 100 billion / 86,400 seconds ≈ 1.16M messages/second\nAverage message size: 100 bytes text + metadata\nDaily text data: 100B × 100 bytes = 10 TB/day\nActive connections: 500M concurrent WebSocket connections\n<\/code><\/pre>\n<h3>Architecture<\/h3>\n<pre><code>┌──────────────────────────────────────────────────────────────┐\n│                         Clients                              │\n└──────────────────────────────────────────────────────────────┘\n                              │\n                    WebSocket / HTTPS\n                              │\n┌─────────────────────────────▼────────────────────────────────┐\n│                     Load Balancer                            │\n│              (Nginx / AWS ALB + sticky sessions)             │\n└──────────────────────────────────────────────────────────────┘\n         │                    │                    │\n         ▼                    ▼                    ▼\n┌──────────────┐   ┌──────────────┐   ┌──────────────────────┐\n│ Chat Server 1│   │ Chat Server 2│   │ Chat Server N        │\n│ (WebSocket)  │   │ (WebSocket)  │   │ (WebSocket)          │\n└──────┬───────┘   └──────┬───────┘   └──────────────────────┘\n       │                  │\n       └──────────┬───────┘\n                  ▼\n         ┌────────────────┐\n         │ Message Queue  │\n         │   (Kafka)      │\n         └────────┬───────┘\n                  │\n    ┌─────────────┼──────────────┐\n    ▼             ▼              ▼\n┌────────┐  ┌──────────┐  ┌──────────────┐\n│Message │  │Presence  │  │Notification  │\n│Service │  │Service   │  │Service       │\n└────┬───┘  └────┬─────┘  └──────────────┘\n     │            │\n     ▼            ▼\n┌─────────┐  ┌─────────┐\n│Cassandra│  │  Redis  │\n│(messages│  │(online  │\n│ storage)│  │ status) │\n└─────────┘  └─────────┘\n<\/code><\/pre>\n<h3>Key Design Decisions<\/h3>\n<p><strong>Message delivery flow:<\/strong><\/p>\n<ol>\n<li>Sender opens WebSocket to Chat Server A<\/li>\n<li>Recipient may be connected to Chat Server B<\/li>\n<li>Chat Server A looks up recipient's server in Redis<\/li>\n<li>Server A sends message to Server B via Kafka<\/li>\n<li>Server B delivers to recipient via WebSocket<\/li>\n<li>If recipient offline: push notification via APNS/FCM<\/li>\n<\/ol>\n<p><strong>Message storage:<\/strong><\/p>\n<ul>\n<li>Cassandra: <code>(user_id, conversation_id, message_id) → message_body<\/code><\/li>\n<li>Messages deleted from server after delivery (WhatsApp model)<\/li>\n<li>Or retained for backup/history (configurable)<\/li>\n<\/ul>\n<p><strong>Presence detection:<\/strong><\/p>\n<ul>\n<li>Redis sorted set: <code>online_users → {user_id: last_heartbeat_timestamp}<\/code><\/li>\n<li>Clients heartbeat every 30 seconds<\/li>\n<li>&quot;Last seen&quot; updated when heartbeat stops<\/li>\n<\/ul>\n<hr />\n","text":"## Chapter 7.2 – System Design: WhatsApp\n\n### Requirements\n\n**Functional:**\n- 1:1 messaging\n- Group messaging (up to 256 members)\n- Message delivery statuses (sent, delivered, read)\n- Online/last-seen status\n- Media sharing (images, videos, documents)\n\n**Non-Functional:**\n- 2 billion users, 100 billion messages/day\n- Messages must be delivered eventually (AP system)\n- End-to-end encryption\n- Low latency (< 500ms message delivery)\n- Messages stored on device, not server (after delivery)\n\n### Capacity Estimation\n\n```\nDaily messages: 100 billion / 86,400 seconds ≈ 1.16M messages/second\nAverage message size: 100 bytes text + metadata\nDaily text data: 100B × 100 bytes = 10 TB/day\nActive connections: 500M concurrent WebSocket connections\n```\n\n### Architecture\n\n```\n┌──────────────────────────────────────────────────────────────┐\n│                         Clients                              │\n└──────────────────────────────────────────────────────────────┘\n                              │\n                    WebSocket / HTTPS\n                              │\n┌─────────────────────────────▼────────────────────────────────┐\n│                     Load Balancer                            │\n│              (Nginx / AWS ALB + sticky sessions)             │\n└──────────────────────────────────────────────────────────────┘\n         │                    │                    │\n         ▼                    ▼                    ▼\n┌──────────────┐   ┌──────────────┐   ┌──────────────────────┐\n│ Chat Server 1│   │ Chat Server 2│   │ Chat Server N        │\n│ (WebSocket)  │   │ (WebSocket)  │   │ (WebSocket)          │\n└──────┬───────┘   └──────┬───────┘   └──────────────────────┘\n       │                  │\n       └──────────┬───────┘\n                  ▼\n         ┌────────────────┐\n         │ Message Queue  │\n         │   (Kafka)      │\n         └────────┬───────┘\n                  │\n    ┌─────────────┼──────────────┐\n    ▼             ▼              ▼\n┌────────┐  ┌──────────┐  ┌──────────────┐\n│Message │  │Presence  │  │Notification  │\n│Service │  │Service   │  │Service       │\n└────┬───┘  └────┬─────┘  └──────────────┘\n     │            │\n     ▼            ▼\n┌─────────┐  ┌─────────┐\n│Cassandra│  │  Redis  │\n│(messages│  │(online  │\n│ storage)│  │ status) │\n└─────────┘  └─────────┘\n```\n\n### Key Design Decisions\n\n**Message delivery flow:**\n1. Sender opens WebSocket to Chat Server A\n2. Recipient may be connected to Chat Server B\n3. Chat Server A looks up recipient's server in Redis\n4. Server A sends message to Server B via Kafka\n5. Server B delivers to recipient via WebSocket\n6. If recipient offline: push notification via APNS/FCM\n\n**Message storage:**\n- Cassandra: `(user_id, conversation_id, message_id) → message_body`\n- Messages deleted from server after delivery (WhatsApp model)\n- Or retained for backup/history (configurable)\n\n**Presence detection:**\n- Redis sorted set: `online_users → {user_id: last_heartbeat_timestamp}`\n- Clients heartbeat every 30 seconds\n- \"Last seen\" updated when heartbeat stops\n\n---\n\n"},{"title":"Chapter 7.3 – System Design: Uber (Ride Matching)","html":"<h2>Chapter 7.3 – System Design: Uber (Ride Matching)<\/h2>\n<h3>Requirements<\/h3>\n<p><strong>Functional:<\/strong><\/p>\n<ul>\n<li>Rider requests ride<\/li>\n<li>Match to nearest available driver<\/li>\n<li>Real-time location tracking<\/li>\n<li>Pricing (surge pricing)<\/li>\n<li>ETA calculation<\/li>\n<\/ul>\n<p><strong>Non-Functional:<\/strong><\/p>\n<ul>\n<li>14 million trips/day globally<\/li>\n<li>Location updates every 4 seconds from all drivers<\/li>\n<li>Matching latency &lt; 5 seconds<\/li>\n<li>High availability (99.99%)<\/li>\n<\/ul>\n<h3>The Core Problem: Geospatial Matching at Scale<\/h3>\n<pre><code>Naive approach: &quot;Find all drivers within X km&quot;\n  SELECT driver_id FROM drivers\n  WHERE ST_Distance(location, rider_location) &lt; 5000  -- 5km\n  ORDER BY distance LIMIT 10;\n\nProblem: O(N) scan of all drivers. 100K active drivers = disaster.\n\nSolution: Geohash + Redis GEOSEARCH\n<\/code><\/pre>\n<p><strong>Geohash encoding:<\/strong><\/p>\n<pre><code>A geohash divides the earth into a grid.\n&quot;9q8yy&quot; = San Francisco area (5-character = ~4.9km × 4.9km cell)\n\nNearby cells share a prefix:\n  9q8yy, 9q8yz, 9q8yw = adjacent cells\n<\/code><\/pre>\n<p><strong>Redis GEOSEARCH for matching:<\/strong><\/p>\n<pre><code class=\"language-python\">import redis.asyncio as redis\n\nclass DriverLocationService:\n    def __init__(self, redis_client: redis.Redis):\n        self.redis = redis_client\n    \n    async def update_driver_location(\n        self, \n        driver_id: str,\n        lat: float, \n        lon: float\n    ):\n        await self.redis.geoadd(&quot;drivers:available&quot;, lon, lat, driver_id)\n    \n    async def find_nearby_drivers(\n        self, \n        rider_lat: float, \n        rider_lon: float, \n        radius_km: float = 5.0,\n        limit: int = 10,\n    ) -&gt; list[dict]:\n        results = await self.redis.geosearch(\n            &quot;drivers:available&quot;,\n            longitude=rider_lon,\n            latitude=rider_lat,\n            radius=radius_km,\n            unit=&quot;km&quot;,\n            sort=&quot;ASC&quot;,\n            count=limit,\n            withcoord=True,\n            withdist=True,\n        )\n        return [\n            {&quot;driver_id&quot;: r[0], &quot;distance_km&quot;: r[1], &quot;location&quot;: r[2]}\n            for r in results\n        ]\n<\/code><\/pre>\n<h3>Surge Pricing Architecture<\/h3>\n<pre><code>Real-time demand detection:\n  - Count active ride requests by geohash cell (last 5 min)\n  - Count available drivers by geohash cell\n  - Demand/supply ratio &gt; threshold → trigger surge\n\nSurge factor calculation:\n  - ratio 1.5x → 1.2x price\n  - ratio 2.0x → 1.5x price\n  - ratio 3.0x → 2.0x price\n\nImplementation:\n  - Kafka stream of ride requests\n  - Flink / Spark Streaming window aggregation\n  - Redis cache for surge multiplier by geohash\n  - TTL = 60 seconds (recalculate frequently)\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 7.3 – System Design: Uber (Ride Matching)\n\n### Requirements\n\n**Functional:**\n- Rider requests ride\n- Match to nearest available driver\n- Real-time location tracking\n- Pricing (surge pricing)\n- ETA calculation\n\n**Non-Functional:**\n- 14 million trips/day globally\n- Location updates every 4 seconds from all drivers\n- Matching latency < 5 seconds\n- High availability (99.99%)\n\n### The Core Problem: Geospatial Matching at Scale\n\n```\nNaive approach: \"Find all drivers within X km\"\n  SELECT driver_id FROM drivers\n  WHERE ST_Distance(location, rider_location) < 5000  -- 5km\n  ORDER BY distance LIMIT 10;\n\nProblem: O(N) scan of all drivers. 100K active drivers = disaster.\n\nSolution: Geohash + Redis GEOSEARCH\n```\n\n**Geohash encoding:**\n```\nA geohash divides the earth into a grid.\n\"9q8yy\" = San Francisco area (5-character = ~4.9km × 4.9km cell)\n\nNearby cells share a prefix:\n  9q8yy, 9q8yz, 9q8yw = adjacent cells\n```\n\n**Redis GEOSEARCH for matching:**\n```python\nimport redis.asyncio as redis\n\nclass DriverLocationService:\n    def __init__(self, redis_client: redis.Redis):\n        self.redis = redis_client\n    \n    async def update_driver_location(\n        self, \n        driver_id: str,\n        lat: float, \n        lon: float\n    ):\n        await self.redis.geoadd(\"drivers:available\", lon, lat, driver_id)\n    \n    async def find_nearby_drivers(\n        self, \n        rider_lat: float, \n        rider_lon: float, \n        radius_km: float = 5.0,\n        limit: int = 10,\n    ) -> list[dict]:\n        results = await self.redis.geosearch(\n            \"drivers:available\",\n            longitude=rider_lon,\n            latitude=rider_lat,\n            radius=radius_km,\n            unit=\"km\",\n            sort=\"ASC\",\n            count=limit,\n            withcoord=True,\n            withdist=True,\n        )\n        return [\n            {\"driver_id\": r[0], \"distance_km\": r[1], \"location\": r[2]}\n            for r in results\n        ]\n```\n\n### Surge Pricing Architecture\n\n```\nReal-time demand detection:\n  - Count active ride requests by geohash cell (last 5 min)\n  - Count available drivers by geohash cell\n  - Demand/supply ratio > threshold → trigger surge\n\nSurge factor calculation:\n  - ratio 1.5x → 1.2x price\n  - ratio 2.0x → 1.5x price\n  - ratio 3.0x → 2.0x price\n\nImplementation:\n  - Kafka stream of ride requests\n  - Flink / Spark Streaming window aggregation\n  - Redis cache for surge multiplier by geohash\n  - TTL = 60 seconds (recalculate frequently)\n```\n\n---\n\n"},{"title":"Chapter 7.4 – System Design: YouTube","html":"<h2>Chapter 7.4 – System Design: YouTube<\/h2>\n<h3>Scale<\/h3>\n<ul>\n<li>2 billion logged-in users/month<\/li>\n<li>500 hours of video uploaded every minute<\/li>\n<li>1 billion hours watched daily<\/li>\n<li>30,000+ videos watched per second<\/li>\n<\/ul>\n<h3>Architecture<\/h3>\n<pre><code>Upload Flow:\nClient → CDN → Upload Service → Raw Storage (S3)\n                                      ↓\n                            Transcoding Job Queue (SQS)\n                                      ↓\n                         Video Processing Workers\n                         (FFmpeg: 360p, 720p, 1080p, 4K)\n                                      ↓\n                            Processed Storage (S3)\n                                      ↓\n                              CDN Distribution\n                              (CloudFront globally)\n\nWatch Flow:\nClient → CDN → (cache hit: return chunk)\n            → (cache miss) → S3 → CDN → Client\n<\/code><\/pre>\n<h3>The Adaptive Bitrate Streaming (ABR) Algorithm<\/h3>\n<pre><code>Video is split into 10-second segments at multiple qualities:\n  360p, 720p, 1080p, 4K\n\nClient measures current bandwidth:\n  - Good bandwidth + good buffer → request higher quality\n  - Degrading bandwidth → request lower quality\n  - Buffer &lt; 10 seconds → urgent, request any quality\n\nHLS / DASH manifest:\n  #EXTM3U\n  #EXT-X-STREAM-INF:BANDWIDTH=400000,RESOLUTION=640x360\n  360p/segment_%d.ts\n  #EXT-X-STREAM-INF:BANDWIDTH=1500000,RESOLUTION=1280x720\n  720p/segment_%d.ts\n<\/code><\/pre>\n<h3>Video Recommendation Engine<\/h3>\n<pre><code>Candidate Generation:\n  - Collaborative filtering (users who watched X also watched Y)\n  - Content-based (similar tags, creator, category)\n  - Query-based (search history)\n\nRanking:\n  - Click-through rate prediction\n  - Watch time prediction\n  - Satisfaction score (survey data)\n  - Freshness signal\n\nTwo-Tower Neural Network Architecture:\n  User Tower: [user history, demographics] → user embedding\n  Video Tower: [video features, metadata] → video embedding\n  Dot product → relevance score\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 7.4 – System Design: YouTube\n\n### Scale\n\n- 2 billion logged-in users/month\n- 500 hours of video uploaded every minute\n- 1 billion hours watched daily\n- 30,000+ videos watched per second\n\n### Architecture\n\n```\nUpload Flow:\nClient → CDN → Upload Service → Raw Storage (S3)\n                                      ↓\n                            Transcoding Job Queue (SQS)\n                                      ↓\n                         Video Processing Workers\n                         (FFmpeg: 360p, 720p, 1080p, 4K)\n                                      ↓\n                            Processed Storage (S3)\n                                      ↓\n                              CDN Distribution\n                              (CloudFront globally)\n\nWatch Flow:\nClient → CDN → (cache hit: return chunk)\n            → (cache miss) → S3 → CDN → Client\n```\n\n### The Adaptive Bitrate Streaming (ABR) Algorithm\n\n```\nVideo is split into 10-second segments at multiple qualities:\n  360p, 720p, 1080p, 4K\n\nClient measures current bandwidth:\n  - Good bandwidth + good buffer → request higher quality\n  - Degrading bandwidth → request lower quality\n  - Buffer < 10 seconds → urgent, request any quality\n\nHLS / DASH manifest:\n  #EXTM3U\n  #EXT-X-STREAM-INF:BANDWIDTH=400000,RESOLUTION=640x360\n  360p/segment_%d.ts\n  #EXT-X-STREAM-INF:BANDWIDTH=1500000,RESOLUTION=1280x720\n  720p/segment_%d.ts\n```\n\n### Video Recommendation Engine\n\n```\nCandidate Generation:\n  - Collaborative filtering (users who watched X also watched Y)\n  - Content-based (similar tags, creator, category)\n  - Query-based (search history)\n\nRanking:\n  - Click-through rate prediction\n  - Watch time prediction\n  - Satisfaction score (survey data)\n  - Freshness signal\n\nTwo-Tower Neural Network Architecture:\n  User Tower: [user history, demographics] → user embedding\n  Video Tower: [video features, metadata] → video embedding\n  Dot product → relevance score\n```\n\n---\n\n"},{"title":"Chapter 7.5 – System Design: URL Shortener","html":"<h2>Chapter 7.5 – System Design: URL Shortener<\/h2>\n<h3>Requirements<\/h3>\n<ul>\n<li>Shorten any URL to ~8 characters<\/li>\n<li>Redirect in &lt; 10ms (p99)<\/li>\n<li>100M URLs created/day<\/li>\n<li>Read/write ratio: 100:1<\/li>\n<li>URLs expire after 1 year<\/li>\n<li>Analytics (click count)<\/li>\n<\/ul>\n<h3>Capacity Estimation<\/h3>\n<pre><code>Writes: 100M / 86400 ≈ 1157 writes/second\nReads: 100:1 → 115,700 reads/second\nURL storage: 100M × 365 days × 100 bytes = 3.65 TB/year\n<\/code><\/pre>\n<h3>Short URL Generation<\/h3>\n<p><strong>Option 1: Hash-based<\/strong><\/p>\n<pre><code class=\"language-python\">import hashlib\nimport base64\n\ndef generate_short_url(long_url: str, length: int = 7) -&gt; str:\n    hash_bytes = hashlib.sha256(long_url.encode()).digest()\n    short = base64.urlsafe_b64encode(hash_bytes)[:length].decode()\n    return short  # e.g. &quot;aB3xK9p&quot;\n\n# Problem: collisions (two different URLs get same short code)\n# Solution: append counter or check for collision and retry\n<\/code><\/pre>\n<p><strong>Option 2: Counter-based (preferred for uniqueness)<\/strong><\/p>\n<pre><code class=\"language-python\"># Use a distributed counter service (ZooKeeper, Redis, or DB sequence)\n# Convert counter to base62\n\nBASE62_CHARS = &quot;0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ&quot;\n\ndef to_base62(num: int) -&gt; str:\n    result = []\n    while num:\n        result.append(BASE62_CHARS[num % 62])\n        num //= 62\n    return ''.join(reversed(result)) or '0'\n\n# 7 base62 chars = 62^7 = 3.5 trillion unique URLs\n<\/code><\/pre>\n<h3>Storage Schema<\/h3>\n<pre><code class=\"language-sql\">CREATE TABLE shortened_urls (\n    id BIGINT PRIMARY KEY DEFAULT nextval('url_seq'),\n    short_code VARCHAR(10) UNIQUE NOT NULL,\n    long_url TEXT NOT NULL,\n    created_at TIMESTAMPTZ DEFAULT NOW(),\n    expires_at TIMESTAMPTZ,\n    user_id BIGINT,\n    click_count BIGINT DEFAULT 0\n);\n\nCREATE INDEX idx_short_code ON shortened_urls(short_code);\n\n-- Analytics in separate table (don't update main table on every click)\nCREATE TABLE url_clicks (\n    id BIGSERIAL PRIMARY KEY,\n    short_code VARCHAR(10) NOT NULL,\n    clicked_at TIMESTAMPTZ DEFAULT NOW(),\n    country VARCHAR(2),\n    user_agent TEXT,\n    referrer TEXT\n);\n<\/code><\/pre>\n<h3>Redirect Architecture<\/h3>\n<pre><code>Client → Load Balancer → Redirect Service\n\nRedirect Service:\n  1. Parse short_code from URL\n  2. Check Redis cache (hit → 302 redirect, ~1ms)\n  3. Cache miss → query PostgreSQL (hit → cache + redirect, ~5ms)\n  4. Not found → 404\n  \nRedis cache entry:\n  KEY: &quot;url:aB3xK9p&quot;\n  VALUE: &quot;https://www.long-original-url.com/...&quot;\n  TTL: 3600 (1 hour, refreshed on access)\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 7.5 – System Design: URL Shortener\n\n### Requirements\n\n- Shorten any URL to ~8 characters\n- Redirect in < 10ms (p99)\n- 100M URLs created/day\n- Read/write ratio: 100:1\n- URLs expire after 1 year\n- Analytics (click count)\n\n### Capacity Estimation\n\n```\nWrites: 100M / 86400 ≈ 1157 writes/second\nReads: 100:1 → 115,700 reads/second\nURL storage: 100M × 365 days × 100 bytes = 3.65 TB/year\n```\n\n### Short URL Generation\n\n**Option 1: Hash-based**\n```python\nimport hashlib\nimport base64\n\ndef generate_short_url(long_url: str, length: int = 7) -> str:\n    hash_bytes = hashlib.sha256(long_url.encode()).digest()\n    short = base64.urlsafe_b64encode(hash_bytes)[:length].decode()\n    return short  # e.g. \"aB3xK9p\"\n\n# Problem: collisions (two different URLs get same short code)\n# Solution: append counter or check for collision and retry\n```\n\n**Option 2: Counter-based (preferred for uniqueness)**\n```python\n# Use a distributed counter service (ZooKeeper, Redis, or DB sequence)\n# Convert counter to base62\n\nBASE62_CHARS = \"0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ\"\n\ndef to_base62(num: int) -> str:\n    result = []\n    while num:\n        result.append(BASE62_CHARS[num % 62])\n        num //= 62\n    return ''.join(reversed(result)) or '0'\n\n# 7 base62 chars = 62^7 = 3.5 trillion unique URLs\n```\n\n### Storage Schema\n\n```sql\nCREATE TABLE shortened_urls (\n    id BIGINT PRIMARY KEY DEFAULT nextval('url_seq'),\n    short_code VARCHAR(10) UNIQUE NOT NULL,\n    long_url TEXT NOT NULL,\n    created_at TIMESTAMPTZ DEFAULT NOW(),\n    expires_at TIMESTAMPTZ,\n    user_id BIGINT,\n    click_count BIGINT DEFAULT 0\n);\n\nCREATE INDEX idx_short_code ON shortened_urls(short_code);\n\n-- Analytics in separate table (don't update main table on every click)\nCREATE TABLE url_clicks (\n    id BIGSERIAL PRIMARY KEY,\n    short_code VARCHAR(10) NOT NULL,\n    clicked_at TIMESTAMPTZ DEFAULT NOW(),\n    country VARCHAR(2),\n    user_agent TEXT,\n    referrer TEXT\n);\n```\n\n### Redirect Architecture\n\n```\nClient → Load Balancer → Redirect Service\n\nRedirect Service:\n  1. Parse short_code from URL\n  2. Check Redis cache (hit → 302 redirect, ~1ms)\n  3. Cache miss → query PostgreSQL (hit → cache + redirect, ~5ms)\n  4. Not found → 404\n  \nRedis cache entry:\n  KEY: \"url:aB3xK9p\"\n  VALUE: \"https://www.long-original-url.com/...\"\n  TTL: 3600 (1 hour, refreshed on access)\n```\n\n---\n\n"},{"title":"Chapter 7.6 – Learning Resources: System Design","html":"<h2>Chapter 7.6 – Learning Resources: System Design<\/h2>\n<h3>Books<\/h3>\n<ol>\n<li><em>System Design Interview Vol 1 &amp; 2<\/em> — Alex Xu — <strong>Start here for interviews<\/strong><\/li>\n<li><em>Designing Distributed Systems<\/em> — Brendan Burns<\/li>\n<li><em>Software Architecture Patterns<\/em> — Mark Richards<\/li>\n<li><em>Fundamentals of Software Architecture<\/em> — Richards &amp; Ford<\/li>\n<\/ol>\n<h3>Practice Platforms<\/h3>\n<ul>\n<li><strong>DesignGurus.io<\/strong> — Structured system design curriculum<\/li>\n<li><strong>Excalidraw<\/strong> — Diagramming during interviews<\/li>\n<li><strong>System Design Primer<\/strong> (GitHub) — Free, comprehensive reference<\/li>\n<li><strong>ByteByteGo<\/strong> newsletter — Weekly system design breakdowns<\/li>\n<\/ul>\n<h3>YouTube Channels<\/h3>\n<ul>\n<li><strong>ByteByteGo<\/strong> — Alex Xu's channel, excellent animations<\/li>\n<li><strong>Gaurav Sen<\/strong> — Deep algorithm + system design explanations<\/li>\n<li><strong>Tech Dummies Narendra L<\/strong> — Practical system design walkthroughs<\/li>\n<li><strong>Hussein Nasser<\/strong> — Backend engineering and protocols<\/li>\n<\/ul>\n<hr />\n","text":"## Chapter 7.6 – Learning Resources: System Design\n\n### Books\n\n1. *System Design Interview Vol 1 & 2* — Alex Xu — **Start here for interviews**\n2. *Designing Distributed Systems* — Brendan Burns\n3. *Software Architecture Patterns* — Mark Richards\n4. *Fundamentals of Software Architecture* — Richards & Ford\n\n### Practice Platforms\n\n- **DesignGurus.io** — Structured system design curriculum\n- **Excalidraw** — Diagramming during interviews\n- **System Design Primer** (GitHub) — Free, comprehensive reference\n- **ByteByteGo** newsletter — Weekly system design breakdowns\n\n### YouTube Channels\n\n- **ByteByteGo** — Alex Xu's channel, excellent animations\n- **Gaurav Sen** — Deep algorithm + system design explanations\n- **Tech Dummies Narendra L** — Practical system design walkthroughs\n- **Hussein Nasser** — Backend engineering and protocols\n\n---\n\n"}]},{"id":8,"title":"Cloud Engineering (AWS)","chapters":[{"title":"Introduction","html":"<h1>PART 8 – CLOUD ENGINEERING (AWS)<\/h1>\n<hr />\n","text":"# PART 8 – CLOUD ENGINEERING (AWS)\n\n---\n\n"},{"title":"Chapter 8.1 – AWS Roadmap for Staff Backend Engineers","html":"<h2>Chapter 8.1 – AWS Roadmap for Staff Backend Engineers<\/h2>\n<h3>Core Services You Already Use<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Service<\/th>\n  <th>Current Use<\/th>\n  <th>Gap<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>EKS<\/td>\n  <td>✅ Production<\/td>\n  <td>Deeper networking, IRSA<\/td>\n<\/tr>\n<tr>\n  <td>EC2<\/td>\n  <td>✅<\/td>\n  <td>Placement groups, instance types<\/td>\n<\/tr>\n<tr>\n  <td>S3<\/td>\n  <td>✅<\/td>\n  <td>Lifecycle policies, intelligent tiering<\/td>\n<\/tr>\n<tr>\n  <td>RDS<\/td>\n  <td>✅<\/td>\n  <td>Read replicas, Multi-AZ, Aurora<\/td>\n<\/tr>\n<tr>\n  <td>IAM<\/td>\n  <td>✅ Basic<\/td>\n  <td>Cross-account roles, permission boundaries<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Must-Master AWS Services<\/h3>\n<h4>IAM (Identity and Access Management)<\/h4>\n<pre><code class=\"language-json\">// Principle of least privilege - example policy\n{\n    &quot;Version&quot;: &quot;2012-10-17&quot;,\n    &quot;Statement&quot;: [\n        {\n            &quot;Sid&quot;: &quot;AllowS3ReadOnly&quot;,\n            &quot;Effect&quot;: &quot;Allow&quot;,\n            &quot;Action&quot;: [\n                &quot;s3:GetObject&quot;,\n                &quot;s3:ListBucket&quot;\n            ],\n            &quot;Resource&quot;: [\n                &quot;arn:aws:s3:::my-bucket&quot;,\n                &quot;arn:aws:s3:::my-bucket/*&quot;\n            ],\n            &quot;Condition&quot;: {\n                &quot;StringEquals&quot;: {\n                    &quot;s3:prefix&quot;: [&quot;data/&quot;, &quot;config/&quot;]\n                }\n            }\n        }\n    ]\n}\n<\/code><\/pre>\n<p><strong>IRSA (IAM Roles for Service Accounts) for EKS:<\/strong><\/p>\n<pre><code class=\"language-yaml\"># ServiceAccount with IRSA annotation\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: my-service\n  namespace: production\n  annotations:\n    eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/MyServiceRole\n<\/code><\/pre>\n<h4>VPC Networking<\/h4>\n<pre><code>VPC: 10.0.0.0/16\n\nPublic Subnets (one per AZ):\n  10.0.1.0/24 - us-east-1a\n  10.0.2.0/24 - us-east-1b\n  10.0.3.0/24 - us-east-1c\n\nPrivate Subnets (one per AZ):\n  10.0.11.0/24 - us-east-1a\n  10.0.12.0/24 - us-east-1b\n  10.0.13.0/24 - us-east-1c\n\nDatabase Subnets (one per AZ, no internet access):\n  10.0.21.0/24 - us-east-1a\n  10.0.22.0/24 - us-east-1b\n  10.0.23.0/24 - us-east-1c\n\nInternet Gateway: in public subnets\nNAT Gateway: in each AZ's public subnet (HA)\n<\/code><\/pre>\n<h4>Lambda for Event-Driven Processing<\/h4>\n<pre><code class=\"language-python\"># Lambda handler best practices\nimport json\nimport boto3\nfrom aws_lambda_powertools import Logger, Tracer, Metrics\nfrom aws_lambda_powertools.metrics import MetricUnit\n\nlogger = Logger()\ntracer = Tracer()\nmetrics = Metrics()\n\n@metrics.log_metrics\n@tracer.capture_lambda_handler\n@logger.inject_lambda_context\ndef handler(event: dict, context) -&gt; dict:\n    &quot;&quot;&quot;Process S3 events&quot;&quot;&quot;\n    \n    for record in event.get(&quot;Records&quot;, []):\n        bucket = record[&quot;s3&quot;][&quot;bucket&quot;][&quot;name&quot;]\n        key = record[&quot;s3&quot;][&quot;object&quot;][&quot;key&quot;]\n        \n        logger.info(&quot;Processing file&quot;, bucket=bucket, key=key)\n        metrics.add_metric(name=&quot;FilesProcessed&quot;, unit=MetricUnit.Count, value=1)\n        \n        try:\n            process_file(bucket, key)\n        except Exception as e:\n            logger.exception(&quot;Failed to process file&quot;, extra={&quot;key&quot;: key})\n            raise\n    \n    return {&quot;statusCode&quot;: 200, &quot;body&quot;: &quot;OK&quot;}\n<\/code><\/pre>\n<h4>CloudWatch for Observability<\/h4>\n<pre><code class=\"language-python\"># Structured CloudWatch metric publishing\nimport boto3\nfrom datetime import datetime\n\ncloudwatch = boto3.client('cloudwatch')\n\ndef publish_custom_metrics(service_name: str, metrics: dict):\n    metric_data = []\n    \n    for metric_name, value in metrics.items():\n        metric_data.appe
