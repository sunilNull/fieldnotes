terviewing\n\nSaturday (90 min):\n  - 2 mediums timed + 1 hard attempted\n  - Simulate interview conditions\n\nSunday (30 min):\n  - Flashcard review of patterns\n  - Update pattern notes\n```\n\n---\n\n"},{"title":"Chapter 2.4 – Interview Strategy for DSA Rounds","html":"<h2>Chapter 2.4 – Interview Strategy for DSA Rounds<\/h2>\n<h3>The UMPIRE Framework<\/h3>\n<p>When faced with a coding interview problem:<\/p>\n<ol>\n<li><strong>U<\/strong>nderstand — Clarify the problem. Ask about edge cases.<\/li>\n<li><strong>M<\/strong>atch — Match to a known pattern. What does this look like?<\/li>\n<li><strong>P<\/strong>lan — Write pseudocode or explain approach verbally.<\/li>\n<li><strong>I<\/strong>mplement — Write clean, readable code.<\/li>\n<li><strong>R<\/strong>eview — Test with examples, including edge cases.<\/li>\n<li><strong>E<\/strong>valuate — State time and space complexity.<\/li>\n<\/ol>\n<h3>Communication Script<\/h3>\n<p>Before coding, always say:<\/p>\n<blockquote>\n<p>&quot;Let me make sure I understand the problem. Given [restate], I need to return [output]. Edge cases I want to confirm: [list them].&quot;<\/p>\n<\/blockquote>\n<p>Before implementing:<\/p>\n<blockquote>\n<p>&quot;My approach is [pattern]. I'll use a [data structure] because [reason]. Time complexity will be O([?]), space O([?]).&quot;<\/p>\n<\/blockquote>\n<p>While coding:<\/p>\n<blockquote>\n<p>Narrate your choices: &quot;I'm using a min-heap here because we need the k smallest elements in O(log k) time...&quot;<\/p>\n<\/blockquote>\n<h3>Recommended Resources<\/h3>\n<p><strong>Books:<\/strong><\/p>\n<ul>\n<li><em>Cracking the Coding Interview<\/em> — Gayle Laakmann McDowell (start here)<\/li>\n<li><em>Elements of Programming Interviews in Python<\/em> — Aziz, Lee, Prakash<\/li>\n<li><em>Algorithm Design Manual<\/em> — Skiena (deeper theory)<\/li>\n<\/ul>\n<p><strong>Platforms:<\/strong><\/p>\n<ul>\n<li>LeetCode Premium (company-specific problems)<\/li>\n<li>NeetCode.io (curated patterns with video solutions)<\/li>\n<li>Pramp (free mock interviews)<\/li>\n<li>Interviewing.io (paid mock interviews, excellent for Staff-level)<\/li>\n<\/ul>\n<p><strong>YouTube Channels:<\/strong><\/p>\n<ul>\n<li>NeetCode — Best for visual pattern explanations<\/li>\n<li>Back To Back SWE — Deep algorithm theory<\/li>\n<li>Errichto — Competitive programming techniques<\/li>\n<li>Abdul Bari — Algorithm fundamentals<\/li>\n<li>WilliamFiset — Graph algorithms, advanced DS<\/li>\n<\/ul>\n<hr />\n","text":"## Chapter 2.4 – Interview Strategy for DSA Rounds\n\n### The UMPIRE Framework\n\nWhen faced with a coding interview problem:\n\n1. **U**nderstand — Clarify the problem. Ask about edge cases.\n2. **M**atch — Match to a known pattern. What does this look like?\n3. **P**lan — Write pseudocode or explain approach verbally.\n4. **I**mplement — Write clean, readable code.\n5. **R**eview — Test with examples, including edge cases.\n6. **E**valuate — State time and space complexity.\n\n### Communication Script\n\nBefore coding, always say:\n> \"Let me make sure I understand the problem. Given [restate], I need to return [output]. Edge cases I want to confirm: [list them].\"\n\nBefore implementing:\n> \"My approach is [pattern]. I'll use a [data structure] because [reason]. Time complexity will be O([?]), space O([?]).\"\n\nWhile coding:\n> Narrate your choices: \"I'm using a min-heap here because we need the k smallest elements in O(log k) time...\"\n\n### Recommended Resources\n\n**Books:**\n- *Cracking the Coding Interview* — Gayle Laakmann McDowell (start here)\n- *Elements of Programming Interviews in Python* — Aziz, Lee, Prakash\n- *Algorithm Design Manual* — Skiena (deeper theory)\n\n**Platforms:**\n- LeetCode Premium (company-specific problems)\n- NeetCode.io (curated patterns with video solutions)\n- Pramp (free mock interviews)\n- Interviewing.io (paid mock interviews, excellent for Staff-level)\n\n**YouTube Channels:**\n- NeetCode — Best for visual pattern explanations\n- Back To Back SWE — Deep algorithm theory\n- Errichto — Competitive programming techniques\n- Abdul Bari — Algorithm fundamentals\n- WilliamFiset — Graph algorithms, advanced DS\n\n---\n\n"}]},{"id":3,"title":"Advanced Python","chapters":[{"title":"Introduction","html":"<h1>PART 3 – ADVANCED PYTHON<\/h1>\n<hr />\n","text":"# PART 3 – ADVANCED PYTHON\n\n---\n\n"},{"title":"Chapter 3.1 – Why Advanced Python Matters","html":"<h2>Chapter 3.1 – Why Advanced Python Matters<\/h2>\n<p>For a Staff-level Python engineer, the language itself becomes a tool you must master at depth. You need to explain <em>why<\/em> things work, not just <em>how<\/em> to use them. Senior engineers who become architects are often asked:<\/p>\n<ul>\n<li>&quot;Why is our async endpoint slower than the sync one?&quot;<\/li>\n<li>&quot;Why does this multiprocessing code use 4x memory?&quot;<\/li>\n<li>&quot;How does Python's GC interact with our object pool?&quot;<\/li>\n<\/ul>\n<p>Your professional Python background is strong. This chapter fills the remaining gaps: GIL, memory model, async internals, and performance engineering.<\/p>\n<h3>Current Level Assessment<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Area<\/th>\n  <th>Current<\/th>\n  <th>Target<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>AsyncIO / Event Loops<\/td>\n  <td>✅ Production use<\/td>\n  <td>⬆️ Deep internals<\/td>\n<\/tr>\n<tr>\n  <td>GIL &amp; Concurrency<\/td>\n  <td>⚠️ Working knowledge<\/td>\n  <td>⬆️ Bypass strategies<\/td>\n<\/tr>\n<tr>\n  <td>Memory Management<\/td>\n  <td>❌ Shallow<\/td>\n  <td>⬆️ Reference counting + GC<\/td>\n<\/tr>\n<tr>\n  <td>CPython Internals<\/td>\n  <td>❌ Weak<\/td>\n  <td>⬆️ Bytecode, frame objects<\/td>\n<\/tr>\n<tr>\n  <td>Profiling &amp; Optimization<\/td>\n  <td>⚠️ Some tools<\/td>\n  <td>⬆️ Systematic methodology<\/td>\n<\/tr>\n<tr>\n  <td>Type System Depth<\/td>\n  <td>⚠️ Basic types<\/td>\n  <td>⬆️ Protocols, TypeVars, Generics<\/td>\n<\/tr>\n<tr>\n  <td>Design Patterns<\/td>\n  <td>⚠️ Uses some<\/td>\n  <td>⬆️ Knows all, applies correctly<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n","text":"## Chapter 3.1 – Why Advanced Python Matters\n\nFor a Staff-level Python engineer, the language itself becomes a tool you must master at depth. You need to explain *why* things work, not just *how* to use them. Senior engineers who become architects are often asked:\n\n- \"Why is our async endpoint slower than the sync one?\"\n- \"Why does this multiprocessing code use 4x memory?\"\n- \"How does Python's GC interact with our object pool?\"\n\nYour professional Python background is strong. This chapter fills the remaining gaps: GIL, memory model, async internals, and performance engineering.\n\n### Current Level Assessment\n\n| Area | Current | Target |\n|---|---|---|\n| AsyncIO / Event Loops | ✅ Production use | ⬆️ Deep internals |\n| GIL & Concurrency | ⚠️ Working knowledge | ⬆️ Bypass strategies |\n| Memory Management | ❌ Shallow | ⬆️ Reference counting + GC |\n| CPython Internals | ❌ Weak | ⬆️ Bytecode, frame objects |\n| Profiling & Optimization | ⚠️ Some tools | ⬆️ Systematic methodology |\n| Type System Depth | ⚠️ Basic types | ⬆️ Protocols, TypeVars, Generics |\n| Design Patterns | ⚠️ Uses some | ⬆️ Knows all, applies correctly |\n\n---\n\n"},{"title":"Chapter 3.2 – CPython Internals","html":"<h2>Chapter 3.2 – CPython Internals<\/h2>\n<h3>The Python Object Model<\/h3>\n<p>Everything in Python is a PyObject. Understanding this is foundational:<\/p>\n<pre><code class=\"language-c\">/* CPython source — simplified */\ntypedef struct _object {\n    Py_ssize_t ob_refcnt;   /* Reference count */\n    PyTypeObject *ob_type;  /* Type pointer */\n} PyObject;\n<\/code><\/pre>\n<p>Every Python object has:<\/p>\n<ul>\n<li>A reference count<\/li>\n<li>A pointer to its type<\/li>\n<li>Type-specific data follows<\/li>\n<\/ul>\n<p><strong>Why this matters in production:<\/strong><\/p>\n<ul>\n<li>Circular references don't get freed by refcount alone → GC needed<\/li>\n<li>Large object pools can create memory pressure<\/li>\n<li>Sharing objects across threads requires careful ref management<\/li>\n<\/ul>\n<h3>Python Execution Model<\/h3>\n<pre><code>Source Code (.py)\n    ↓ compile()\nAbstract Syntax Tree (AST)\n    ↓ compile()\nBytecode (.pyc)\n    ↓ CPython interpreter\nStack-based VM Execution\n<\/code><\/pre>\n<p><strong>Inspecting bytecode:<\/strong><\/p>\n<pre><code class=\"language-python\">import dis\n\ndef add(a, b):\n    return a + b\n\ndis.dis(add)\n# Output:\n#   2           0 LOAD_FAST                0 (a)\n#               2 LOAD_FAST                1 (b)\n#               4 BINARY_ADD\n#               6 RETURN_VALUE\n<\/code><\/pre>\n<p><strong>Understanding frames:<\/strong><\/p>\n<pre><code class=\"language-python\">import sys\n\ndef inner():\n    frame = sys._getframe()\n    print(f&quot;Function: {frame.f_code.co_name}&quot;)\n    print(f&quot;Locals: {frame.f_locals}&quot;)\n    print(f&quot;Caller: {frame.f_back.f_code.co_name}&quot;)\n\ndef outer():\n    inner()\n\nouter()\n<\/code><\/pre>\n<h3>The Global Interpreter Lock (GIL)<\/h3>\n<p><strong>What it is:<\/strong>\nThe GIL is a mutex that protects CPython's memory management. Only one thread can execute Python bytecode at a time.<\/p>\n<p><strong>What it prevents:<\/strong><\/p>\n<ul>\n<li>True parallelism for CPU-bound Python code on multiple cores<\/li>\n<li>Races in CPython's reference counting<\/li>\n<\/ul>\n<p><strong>What it does NOT prevent:<\/strong><\/p>\n<ul>\n<li>I/O-bound parallelism (I/O releases the GIL)<\/li>\n<li>True parallelism in C extensions (NumPy, OpenCV release GIL)<\/li>\n<\/ul>\n<p><strong>Practical concurrency guide:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n  <th>Workload Type<\/th>\n  <th>Best Tool<\/th>\n  <th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>I/O bound (HTTP, DB, disk)<\/td>\n  <td><code>asyncio<\/code> or <code>threading<\/code><\/td>\n  <td>GIL released during I/O<\/td>\n<\/tr>\n<tr>\n  <td>CPU bound (computation)<\/td>\n  <td><code>multiprocessing<\/code><\/td>\n  <td>Separate processes, no shared GIL<\/td>\n<\/tr>\n<tr>\n  <td>CPU bound + NumPy/SciPy<\/td>\n  <td><code>threading<\/code><\/td>\n  <td>C extensions release GIL<\/td>\n<\/tr>\n<tr>\n  <td>Mixed I/O + CPU<\/td>\n  <td><code>asyncio<\/code> + <code>ProcessPoolExecutor<\/code><\/td>\n  <td>Best of both<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Bypassing the GIL:<\/strong><\/p>\n<pre><code class=\"language-python\">import asyncio\nfrom concurrent.futures import ProcessPoolExecutor\n\ndef cpu_intensive(n):\n    &quot;&quot;&quot;Runs in separate process — no GIL contention&quot;&quot;&quot;\n    return sum(i * i for i in range(n))\n\nasync def main():\n    loop = asyncio.get_event_loop()\n    with ProcessPoolExecutor(max_workers=4) as pool:\n        # These run truly in parallel across CPU cores\n        results = await asyncio.gather(\n            loop.run_in_executor(pool, cpu_intensive, 10_000_000),\n            loop.run_in_executor(pool, cpu_intensive, 10_000_000),\n            loop.run_in_executor(pool, cpu_intensive, 10_000_000),\n        )\n    return results\n<\/code><\/pre>\n<blockquote>\n<p><strong>Note:<\/strong> Python 3.13 introduces a no-GIL experimental build. Worth monitoring for production use by late 2025.<\/p>\n<\/blockquote>\n<hr />\n","text":"## Chapter 3.2 – CPython Internals\n\n### The Python Object Model\n\nEverything in Python is a PyObject. Understanding this is foundational:\n\n```c\n/* CPython source — simplified */\ntypedef struct _object {\n    Py_ssize_t ob_refcnt;   /* Reference count */\n    PyTypeObject *ob_type;  /* Type pointer */\n} PyObject;\n```\n\nEvery Python object has:\n- A reference count\n- A pointer to its type\n- Type-specific data follows\n\n**Why this matters in production:**\n- Circular references don't get freed by refcount alone → GC needed\n- Large object pools can create memory pressure\n- Sharing objects across threads requires careful ref management\n\n### Python Execution Model\n\n```\nSource Code (.py)\n    ↓ compile()\nAbstract Syntax Tree (AST)\n    ↓ compile()\nBytecode (.pyc)\n    ↓ CPython interpreter\nStack-based VM Execution\n```\n\n**Inspecting bytecode:**\n```python\nimport dis\n\ndef add(a, b):\n    return a + b\n\ndis.dis(add)\n# Output:\n#   2           0 LOAD_FAST                0 (a)\n#               2 LOAD_FAST                1 (b)\n#               4 BINARY_ADD\n#               6 RETURN_VALUE\n```\n\n**Understanding frames:**\n```python\nimport sys\n\ndef inner():\n    frame = sys._getframe()\n    print(f\"Function: {frame.f_code.co_name}\")\n    print(f\"Locals: {frame.f_locals}\")\n    print(f\"Caller: {frame.f_back.f_code.co_name}\")\n\ndef outer():\n    inner()\n\nouter()\n```\n\n### The Global Interpreter Lock (GIL)\n\n**What it is:**\nThe GIL is a mutex that protects CPython's memory management. Only one thread can execute Python bytecode at a time.\n\n**What it prevents:**\n- True parallelism for CPU-bound Python code on multiple cores\n- Races in CPython's reference counting\n\n**What it does NOT prevent:**\n- I/O-bound parallelism (I/O releases the GIL)\n- True parallelism in C extensions (NumPy, OpenCV release GIL)\n\n**Practical concurrency guide:**\n\n| Workload Type | Best Tool | Why |\n|---|---|---|\n| I/O bound (HTTP, DB, disk) | `asyncio` or `threading` | GIL released during I/O |\n| CPU bound (computation) | `multiprocessing` | Separate processes, no shared GIL |\n| CPU bound + NumPy/SciPy | `threading` | C extensions release GIL |\n| Mixed I/O + CPU | `asyncio` + `ProcessPoolExecutor` | Best of both |\n\n**Bypassing the GIL:**\n```python\nimport asyncio\nfrom concurrent.futures import ProcessPoolExecutor\n\ndef cpu_intensive(n):\n    \"\"\"Runs in separate process — no GIL contention\"\"\"\n    return sum(i * i for i in range(n))\n\nasync def main():\n    loop = asyncio.get_event_loop()\n    with ProcessPoolExecutor(max_workers=4) as pool:\n        # These run truly in parallel across CPU cores\n        results = await asyncio.gather(\n            loop.run_in_executor(pool, cpu_intensive, 10_000_000),\n            loop.run_in_executor(pool, cpu_intensive, 10_000_000),\n            loop.run_in_executor(pool, cpu_intensive, 10_000_000),\n        )\n    return results\n```\n\n> **Note:** Python 3.13 introduces a no-GIL experimental build. Worth monitoring for production use by late 2025.\n\n---\n\n"},{"title":"Chapter 3.3 – Memory Management","html":"<h2>Chapter 3.3 – Memory Management<\/h2>\n<h3>Reference Counting<\/h3>\n<p>Python uses reference counting as its primary GC mechanism:<\/p>\n<pre><code class=\"language-python\">import sys\n\nx = [1, 2, 3]\nprint(sys.getrefcount(x))  # 2 (x + getrefcount argument)\n\ny = x\nprint(sys.getrefcount(x))  # 3\n\ndel y\nprint(sys.getrefcount(x))  # 2\n<\/code><\/pre>\n<p>When refcount drops to 0, memory is freed immediately. This is predictable but has overhead.<\/p>\n<h3>Cyclic Garbage Collector<\/h3>\n<p>For cycles, Python uses a mark-and-sweep collector:<\/p>\n<pre><code class=\"language-python\">import gc\n\nclass Node:\n    def __init__(self):\n        self.other = None\n\na = Node()\nb = Node()\na.other = b   # a → b\nb.other = a   # b → a (cycle!)\n\ndel a, b   # refcount won't free these\ngc.collect()  # cycle collector frees them\n<\/code><\/pre>\n<p><strong>Production implications:<\/strong><\/p>\n<pre><code class=\"language-python\"># Disable GC in latency-sensitive code (with care!)\ngc.disable()\n# ... critical path code ...\ngc.enable()\n\n# Force collection after creating many objects\ngc.collect(generation=2)\n\n# Monitor GC pressure\nimport gc\ngc.set_debug(gc.DEBUG_STATS)\n<\/code><\/pre>\n<h3>Memory Profiling<\/h3>\n<pre><code class=\"language-python\"># Using tracemalloc (stdlib)\nimport tracemalloc\n\ntracemalloc.start()\n\n# ... your code ...\n\nsnapshot = tracemalloc.take_snapshot()\ntop_stats = snapshot.statistics('lineno')\n\nfor stat in top_stats[:10]:\n    print(stat)\n<\/code><\/pre>\n<pre><code class=\"language-bash\"># Using memory_profiler\npip install memory_profiler\npython -m memory_profiler your_script.py\n\n# Using objgraph for finding leaks\npip install objgraph\nimport objgraph\nobjgraph.show_most_common_types(limit=10)\nobjgraph.show_backrefs(objgraph.by_type('MyClass')[0])\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 3.3 – Memory Management\n\n### Reference Counting\n\nPython uses reference counting as its primary GC mechanism:\n\n```python\nimport sys\n\nx = [1, 2, 3]\nprint(sys.getrefcount(x))  # 2 (x + getrefcount argument)\n\ny = x\nprint(sys.getrefcount(x))  # 3\n\ndel y\nprint(sys.getrefcount(x))  # 2\n```\n\nWhen refcount drops to 0, memory is freed immediately. This is predictable but has overhead.\n\n### Cyclic Garbage Collector\n\nFor cycles, Python uses a mark-and-sweep collector:\n\n```python\nimport gc\n\nclass Node:\n    def __init__(self):\n        self.other = None\n\na = Node()\nb = Node()\na.other = b   # a → b\nb.other = a   # b → a (cycle!)\n\ndel a, b   # refcount won't free these\ngc.collect()  # cycle collector frees them\n```\n\n**Production implications:**\n```python\n# Disable GC in latency-sensitive code (with care!)\ngc.disable()\n# ... critical path code ...\ngc.enable()\n\n# Force collection after creating many objects\ngc.collect(generation=2)\n\n# Monitor GC pressure\nimport gc\ngc.set_debug(gc.DEBUG_STATS)\n```\n\n### Memory Profiling\n\n```python\n# Using tracemalloc (stdlib)\nimport tracemalloc\n\ntracemalloc.start()\n\n# ... your code ...\n\nsnapshot = tracemalloc.take_snapshot()\ntop_stats = snapshot.statistics('lineno')\n\nfor stat in top_stats[:10]:\n    print(stat)\n```\n\n```bash\n# Using memory_profiler\npip install memory_profiler\npython -m memory_profiler your_script.py\n\n# Using objgraph for finding leaks\npip install objgraph\nimport objgraph\nobjgraph.show_most_common_types(limit=10)\nobjgraph.show_backrefs(objgraph.by_type('MyClass')[0])\n```\n\n---\n\n"},{"title":"Chapter 3.4 – AsyncIO Deep Dive","html":"<h2>Chapter 3.4 – AsyncIO Deep Dive<\/h2>\n<h3>Event Loop Architecture<\/h3>\n<pre><code>Event Loop\n    │\n    ├── Ready Queue (callbacks ready to run)\n    │\n    ├── I/O Polling (epoll/kqueue/IOCP)\n    │       ↑\n    │   OS signals when I/O is ready\n    │\n    └── Timer Heap (callbacks scheduled for future)\n<\/code><\/pre>\n<p><strong>How <code>await<\/code> works:<\/strong><\/p>\n<pre><code class=\"language-python\">async def fetch_data(url):\n    # 1. coroutine suspends here\n    # 2. event loop picks up another coroutine\n    # 3. when I/O is ready, event loop resumes this coroutine\n    response = await aiohttp.get(url)\n    return await response.json()\n<\/code><\/pre>\n<p>Under the hood, <code>await<\/code> calls <code>__await__()<\/code> which yields control back to the event loop.<\/p>\n<h3>Common AsyncIO Patterns<\/h3>\n<p><strong>Pattern 1: Concurrent HTTP requests<\/strong><\/p>\n<pre><code class=\"language-python\">import asyncio\nimport aiohttp\nfrom typing import List\n\nasync def fetch(session: aiohttp.ClientSession, url: str) -&gt; dict:\n    async with session.get(url) as response:\n        return await response.json()\n\nasync def fetch_all(urls: List[str]) -&gt; List[dict]:\n    async with aiohttp.ClientSession() as session:\n        tasks = [fetch(session, url) for url in urls]\n        return await asyncio.gather(*tasks, return_exceptions=True)\n<\/code><\/pre>\n<p><strong>Pattern 2: Semaphore for rate limiting<\/strong><\/p>\n<pre><code class=\"language-python\">async def fetch_with_limit(urls: List[str], max_concurrent: int = 10):\n    semaphore = asyncio.Semaphore(max_concurrent)\n    \n    async def bounded_fetch(url):\n        async with semaphore:\n            return await fetch(session, url)\n    \n    async with aiohttp.ClientSession() as session:\n        tasks = [bounded_fetch(url) for url in urls]\n        return await asyncio.gather(*tasks)\n<\/code><\/pre>\n<p><strong>Pattern 3: Producer-consumer with asyncio.Queue<\/strong><\/p>\n<pre><code class=\"language-python\">async def producer(queue: asyncio.Queue, items):\n    for item in items:\n        await queue.put(item)\n        await asyncio.sleep(0)  # yield control\n\nasync def consumer(queue: asyncio.Queue, worker_id: int):\n    while True:\n        item = await queue.get()\n        if item is None:  # sentinel value\n            break\n        await process(item)\n        queue.task_done()\n\nasync def pipeline(items, num_workers=5):\n    queue = asyncio.Queue(maxsize=100)\n    \n    producers = [asyncio.create_task(producer(queue, items))]\n    consumers = [asyncio.create_task(consumer(queue, i)) \n                 for i in range(num_workers)]\n    \n    await asyncio.gather(*producers)\n    \n    # Send sentinel values\n    for _ in range(num_workers):\n        await queue.put(None)\n    \n    await asyncio.gather(*consumers)\n<\/code><\/pre>\n<p><strong>Pattern 4: Timeout and cancellation<\/strong><\/p>\n<pre><code class=\"language-python\">async def fetch_with_timeout(url: str, timeout: float = 5.0):\n    try:\n        async with asyncio.timeout(timeout):  # Python 3.11+\n            return await fetch(url)\n    except asyncio.TimeoutError:\n        logger.warning(f&quot;Timeout fetching {url}&quot;)\n        return None\n    except asyncio.CancelledError:\n        logger.info(&quot;Task cancelled&quot;)\n        raise  # Always re-raise CancelledError\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 3.4 – AsyncIO Deep Dive\n\n### Event Loop Architecture\n\n```\nEvent Loop\n    │\n    ├── Ready Queue (callbacks ready to run)\n    │\n    ├── I/O Polling (epoll/kqueue/IOCP)\n    │       ↑\n    │   OS signals when I/O is ready\n    │\n    └── Timer Heap (callbacks scheduled for future)\n```\n\n**How `await` works:**\n\n```python\nasync def fetch_data(url):\n    # 1. coroutine suspends here\n    # 2. event loop picks up another coroutine\n    # 3. when I/O is ready, event loop resumes this coroutine\n    response = await aiohttp.get(url)\n    return await response.json()\n```\n\nUnder the hood, `await` calls `__await__()` which yields control back to the event loop.\n\n### Common AsyncIO Patterns\n\n**Pattern 1: Concurrent HTTP requests**\n```python\nimport asyncio\nimport aiohttp\nfrom typing import List\n\nasync def fetch(session: aiohttp.ClientSession, url: str) -> dict:\n    async with session.get(url) as response:\n        return await response.json()\n\nasync def fetch_all(urls: List[str]) -> List[dict]:\n    async with aiohttp.ClientSession() as session:\n        tasks = [fetch(session, url) for url in urls]\n        return await asyncio.gather(*tasks, return_exceptions=True)\n```\n\n**Pattern 2: Semaphore for rate limiting**\n```python\nasync def fetch_with_limit(urls: List[str], max_concurrent: int = 10):\n    semaphore = asyncio.Semaphore(max_concurrent)\n    \n    async def bounded_fetch(url):\n        async with semaphore:\n            return await fetch(session, url)\n    \n    async with aiohttp.ClientSession() as session:\n        tasks = [bounded_fetch(url) for url in urls]\n        return await asyncio.gather(*tasks)\n```\n\n**Pattern 3: Producer-consumer with asyncio.Queue**\n```python\nasync def producer(queue: asyncio.Queue, items):\n    for item in items:\n        await queue.put(item)\n        await asyncio.sleep(0)  # yield control\n\nasync def consumer(queue: asyncio.Queue, worker_id: int):\n    while True:\n        item = await queue.get()\n        if item is None:  # sentinel value\n            break\n        await process(item)\n        queue.task_done()\n\nasync def pipeline(items, num_workers=5):\n    queue = asyncio.Queue(maxsize=100)\n    \n    producers = [asyncio.create_task(producer(queue, items))]\n    consumers = [asyncio.create_task(consumer(queue, i)) \n                 for i in range(num_workers)]\n    \n    await asyncio.gather(*producers)\n    \n    # Send sentinel values\n    for _ in range(num_workers):\n        await queue.put(None)\n    \n    await asyncio.gather(*consumers)\n```\n\n**Pattern 4: Timeout and cancellation**\n```python\nasync def fetch_with_timeout(url: str, timeout: float = 5.0):\n    try:\n        async with asyncio.timeout(timeout):  # Python 3.11+\n            return await fetch(url)\n    except asyncio.TimeoutError:\n        logger.warning(f\"Timeout fetching {url}\")\n        return None\n    except asyncio.CancelledError:\n        logger.info(\"Task cancelled\")\n        raise  # Always re-raise CancelledError\n```\n\n---\n\n"},{"title":"Chapter 3.5 – Python Performance Optimization","html":"<h2>Chapter 3.5 – Python Performance Optimization<\/h2>\n<h3>Profiling First — Never Optimize Blindly<\/h3>\n<pre><code class=\"language-bash\"># cProfile (built-in)\npython -m cProfile -s cumtime your_script.py | head -30\n\n# With snakeviz visualization\npip install snakeviz\npython -m cProfile -o profile.stats your_script.py\nsnakeviz profile.stats\n\n# Line-by-line profiling\npip install line_profiler\n@profile  # decorator\ndef your_function():\n    ...\nkernprof -l -v your_script.py\n<\/code><\/pre>\n<h3>Python Performance Patterns<\/h3>\n<p><strong>1. List comprehensions over loops<\/strong><\/p>\n<pre><code class=\"language-python\"># Slow\nresult = []\nfor i in range(1000000):\n    result.append(i * i)\n\n# Fast (30-50% faster due to internal optimization)\nresult = [i * i for i in range(1000000)]\n\n# Fastest for simple transforms\nresult = list(map(lambda x: x * x, range(1000000)))\n<\/code><\/pre>\n<p><strong>2. Generator expressions for memory efficiency<\/strong><\/p>\n<pre><code class=\"language-python\"># Loads all 1M items into memory\ntotal = sum([x * x for x in range(1000000)])\n\n# Generator: O(1) memory\ntotal = sum(x * x for x in range(1000000))\n<\/code><\/pre>\n<p><strong>3. String concatenation<\/strong><\/p>\n<pre><code class=\"language-python\"># Very slow — creates N intermediate strings\ns = &quot;&quot;\nfor word in words:\n    s += word\n\n# Fast — single allocation\ns = &quot;&quot;.join(words)\n<\/code><\/pre>\n<p><strong>4. Local variable access<\/strong><\/p>\n<pre><code class=\"language-python\"># Each global/attribute lookup is slower\nimport math\n\ndef slow():\n    for i in range(1000000):\n        math.sqrt(i)\n\ndef fast():\n    sqrt = math.sqrt  # local reference\n    for i in range(1000000):\n        sqrt(i)\n<\/code><\/pre>\n<p><strong>5. Using __slots__ for memory reduction<\/strong><\/p>\n<pre><code class=\"language-python\">class Point:\n    __slots__ = ('x', 'y')  # Prevents __dict__ creation\n    \n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n# Reduces memory by 40-60% for large numbers of instances\n<\/code><\/pre>\n<p><strong>6. Caching with functools.lru_cache<\/strong><\/p>\n<pre><code class=\"language-python\">from functools import lru_cache, cache\n\n@cache  # Python 3.9+ — unbounded cache\ndef fibonacci(n: int) -&gt; int:\n    if n &lt; 2:\n        return n\n    return fibonacci(n - 1) + fibonacci(n - 2)\n\n@lru_cache(maxsize=1000)  # bounded cache\ndef expensive_computation(x: int, y: int) -&gt; int:\n    ...\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 3.5 – Python Performance Optimization\n\n### Profiling First — Never Optimize Blindly\n\n```bash\n# cProfile (built-in)\npython -m cProfile -s cumtime your_script.py | head -30\n\n# With snakeviz visualization\npip install snakeviz\npython -m cProfile -o profile.stats your_script.py\nsnakeviz profile.stats\n\n# Line-by-line profiling\npip install line_profiler\n@profile  # decorator\ndef your_function():\n    ...\nkernprof -l -v your_script.py\n```\n\n### Python Performance Patterns\n\n**1. List comprehensions over loops**\n```python\n# Slow\nresult = []\nfor i in range(1000000):\n    result.append(i * i)\n\n# Fast (30-50% faster due to internal optimization)\nresult = [i * i for i in range(1000000)]\n\n# Fastest for simple transforms\nresult = list(map(lambda x: x * x, range(1000000)))\n```\n\n**2. Generator expressions for memory efficiency**\n```python\n# Loads all 1M items into memory\ntotal = sum([x * x for x in range(1000000)])\n\n# Generator: O(1) memory\ntotal = sum(x * x for x in range(1000000))\n```\n\n**3. String concatenation**\n```python\n# Very slow — creates N intermediate strings\ns = \"\"\nfor word in words:\n    s += word\n\n# Fast — single allocation\ns = \"\".join(words)\n```\n\n**4. Local variable access**\n```python\n# Each global/attribute lookup is slower\nimport math\n\ndef slow():\n    for i in range(1000000):\n        math.sqrt(i)\n\ndef fast():\n    sqrt = math.sqrt  # local reference\n    for i in range(1000000):\n        sqrt(i)\n```\n\n**5. Using __slots__ for memory reduction**\n```python\nclass Point:\n    __slots__ = ('x', 'y')  # Prevents __dict__ creation\n    \n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n# Reduces memory by 40-60% for large numbers of instances\n```\n\n**6. Caching with functools.lru_cache**\n```python\nfrom functools import lru_cache, cache\n\n@cache  # Python 3.9+ — unbounded cache\ndef fibonacci(n: int) -> int:\n    if n < 2:\n        return n\n    return fibonacci(n - 1) + fibonacci(n - 2)\n\n@lru_cache(maxsize=1000)  # bounded cache\ndef expensive_computation(x: int, y: int) -> int:\n    ...\n```\n\n---\n\n"},{"title":"Chapter 3.6 – Advanced Type Hinting","html":"<h2>Chapter 3.6 – Advanced Type Hinting<\/h2>\n<h3>Generic Types and TypeVar<\/h3>\n<pre><code class=\"language-python\">from typing import TypeVar, Generic, Protocol\n\nT = TypeVar('T')\n\nclass Stack(Generic[T]):\n    def __init__(self) -&gt; None:\n        self._items: list[T] = []\n    \n    def push(self, item: T) -&gt; None:\n        self._items.append(item)\n    \n    def pop(self) -&gt; T:\n        return self._items.pop()\n<\/code><\/pre>\n<h3>Protocols (Structural Subtyping)<\/h3>\n<pre><code class=\"language-python\">from typing import Protocol, runtime_checkable\n\n@runtime_checkable\nclass Closeable(Protocol):\n    def close(self) -&gt; None: ...\n\nclass DatabaseConnection:\n    def close(self) -&gt; None:\n        print(&quot;Closing DB connection&quot;)\n\ndef cleanup(resource: Closeable) -&gt; None:\n    resource.close()\n\n# Works without inheriting from Closeable!\ncleanup(DatabaseConnection())\n<\/code><\/pre>\n<h3>TypedDict and Literal Types<\/h3>\n<pre><code class=\"language-python\">from typing import TypedDict, Literal, NotRequired\n\nclass UserConfig(TypedDict):\n    id: int\n    name: str\n    role: Literal[&quot;admin&quot;, &quot;user&quot;, &quot;viewer&quot;]\n    email: NotRequired[str]  # Optional field\n\ndef create_user(config: UserConfig) -&gt; None:\n    ...\n<\/code><\/pre>\n<h3>ParamSpec and Callable Typing<\/h3>\n<pre><code class=\"language-python\">from typing import ParamSpec, Concatenate, Callable\nimport functools\n\nP = ParamSpec('P')\n\ndef retry(max_attempts: int):\n    def decorator(func: Callable[P, T]) -&gt; Callable[P, T]:\n        @functools.wraps(func)\n        def wrapper(*args: P.args, **kwargs: P.kwargs) -&gt; T:\n            for attempt in range(max_attempts):\n                try:\n                    return func(*args, **kwargs)\n                except Exception as e:\n                    if attempt == max_attempts - 1:\n                        raise\n            raise RuntimeError(&quot;Unreachable&quot;)\n        return wrapper\n    return decorator\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 3.6 – Advanced Type Hinting\n\n### Generic Types and TypeVar\n\n```python\nfrom typing import TypeVar, Generic, Protocol\n\nT = TypeVar('T')\n\nclass Stack(Generic[T]):\n    def __init__(self) -> None:\n        self._items: list[T] = []\n    \n    def push(self, item: T) -> None:\n        self._items.append(item)\n    \n    def pop(self) -> T:\n        return self._items.pop()\n```\n\n### Protocols (Structural Subtyping)\n\n```python\nfrom typing import Protocol, runtime_checkable\n\n@runtime_checkable\nclass Closeable(Protocol):\n    def close(self) -> None: ...\n\nclass DatabaseConnection:\n    def close(self) -> None:\n        print(\"Closing DB connection\")\n\ndef cleanup(resource: Closeable) -> None:\n    resource.close()\n\n# Works without inheriting from Closeable!\ncleanup(DatabaseConnection())\n```\n\n### TypedDict and Literal Types\n\n```python\nfrom typing import TypedDict, Literal, NotRequired\n\nclass UserConfig(TypedDict):\n    id: int\n    name: str\n    role: Literal[\"admin\", \"user\", \"viewer\"]\n    email: NotRequired[str]  # Optional field\n\ndef create_user(config: UserConfig) -> None:\n    ...\n```\n\n### ParamSpec and Callable Typing\n\n```python\nfrom typing import ParamSpec, Concatenate, Callable\nimport functools\n\nP = ParamSpec('P')\n\ndef retry(max_attempts: int):\n    def decorator(func: Callable[P, T]) -> Callable[P, T]:\n        @functools.wraps(func)\n        def wrapper(*args: P.args, **kwargs: P.kwargs) -> T:\n            for attempt in range(max_attempts):\n                try:\n                    return func(*args, **kwargs)\n                except Exception as e:\n                    if attempt == max_attempts - 1:\n                        raise\n            raise RuntimeError(\"Unreachable\")\n        return wrapper\n    return decorator\n```\n\n---\n\n"},{"title":"Chapter 3.7 – Python Design Patterns","html":"<h2>Chapter 3.7 – Python Design Patterns<\/h2>\n<h3>Patterns Most Relevant for Backend Engineers<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Pattern<\/th>\n  <th>Category<\/th>\n  <th>Python Idiom<\/th>\n  <th>Use Case<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Dependency Injection<\/td>\n  <td>Creational<\/td>\n  <td>Constructor injection<\/td>\n  <td>Testability<\/td>\n<\/tr>\n<tr>\n  <td>Factory<\/td>\n  <td>Creational<\/td>\n  <td>Class methods, abstract factory<\/td>\n  <td>Plugin systems<\/td>\n<\/tr>\n<tr>\n  <td>Singleton<\/td>\n  <td>Creational<\/td>\n  <td>Module-level instance<\/td>\n  <td>DB connections<\/td>\n<\/tr>\n<tr>\n  <td>Observer<\/td>\n  <td>Behavioral<\/td>\n  <td>Event systems, callbacks<\/td>\n  <td>Event-driven<\/td>\n<\/tr>\n<tr>\n  <td>Strategy<\/td>\n  <td>Behavioral<\/td>\n  <td>Callables, protocols<\/td>\n  <td>Algorithm swapping<\/td>\n<\/tr>\n<tr>\n  <td>Decorator<\/td>\n  <td>Structural<\/td>\n  <td><code>@decorator<\/code> syntax<\/td>\n  <td>Cross-cutting concerns<\/td>\n<\/tr>\n<tr>\n  <td>Repository<\/td>\n  <td>Architectural<\/td>\n  <td>ABC + implementation<\/td>\n  <td>Data access layer<\/td>\n<\/tr>\n<tr>\n  <td>CQRS<\/td>\n  <td>Architectural<\/td>\n  <td>Separate read/write models<\/td>\n  <td>Scale reads/writes<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Repository Pattern (Production Python):<\/strong><\/p>\n<pre><code class=\"language-python\">from abc import ABC, abstractmethod\nfrom typing import Optional, List\n\nclass UserRepository(ABC):\n    @abstractmethod\n    async def get(self, user_id: int) -&gt; Optional[User]:\n        ...\n    \n    @abstractmethod\n    async def save(self, user: User) -&gt; User:\n        ...\n    \n    @abstractmethod\n    async def list_by_tenant(self, tenant_id: int) -&gt; List[User]:\n        ...\n\nclass PostgresUserRepository(UserRepository):\n    def __init__(self, db: AsyncSession):\n        self.db = db\n    \n    async def get(self, user_id: int) -&gt; Optional[User]:\n        result = await self.db.execute(\n            select(UserModel).where(UserModel.id == user_id)\n        )\n        row = result.scalar_one_or_none()\n        return User.from_orm(row) if row else None\n    \n    async def save(self, user: User) -&gt; User:\n        db_user = UserModel(**user.dict())\n        self.db.add(db_user)\n        await self.db.commit()\n        await self.db.refresh(db_user)\n        return User.from_orm(db_user)\n\nclass CachedUserRepository(UserRepository):\n    &quot;&quot;&quot;Decorator pattern — adds caching to any repository&quot;&quot;&quot;\n    def __init__(self, repo: UserRepository, cache: Redis):\n        self._repo = repo\n        self._cache = cache\n    \n    async def get(self, user_id: int) -&gt; Optional[User]:\n        key = f&quot;user:{user_id}&quot;\n        cached = await self._cache.get(key)\n        if cached:\n            return User.parse_raw(cached)\n        \n        user = await self._repo.get(user_id)\n        if user:\n            await self._cache.setex(key, 300, user.json())\n        return user\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 3.7 – Python Design Patterns\n\n### Patterns Most Relevant for Backend Engineers\n\n| Pattern | Category | Python Idiom | Use Case |\n|---|---|---|---|\n| Dependency Injection | Creational | Constructor injection | Testability |\n| Factory | Creational | Class methods, abstract factory | Plugin systems |\n| Singleton | Creational | Module-level instance | DB connections |\n| Observer | Behavioral | Event systems, callbacks | Event-driven |\n| Strategy | Behavioral | Callables, protocols | Algorithm swapping |\n| Decorator | Structural | `@decorator` syntax | Cross-cutting concerns |\n| Repository | Architectural | ABC + implementation | Data access layer |\n| CQRS | Architectural | Separate read/write models | Scale reads/writes |\n\n**Repository Pattern (Production Python):**\n```python\nfrom abc import ABC, abstractmethod\nfrom typing import Optional, List\n\nclass UserRepository(ABC):\n    @abstractmethod\n    async def get(self, user_id: int) -> Optional[User]:\n        ...\n    \n    @abstractmethod\n    async def save(self, user: User) -> User:\n        ...\n    \n    @abstractmethod\n    async def list_by_tenant(self, tenant_id: int) -> List[User]:\n        ...\n\nclass PostgresUserRepository(UserRepository):\n    def __init__(self, db: AsyncSession):\n        self.db = db\n    \n    async def get(self, user_id: int) -> Optional[User]:\n        result = await self.db.execute(\n            select(UserModel).where(UserModel.id == user_id)\n        )\n        row = result.scalar_one_or_none()\n        return User.from_orm(row) if row else None\n    \n    async def save(self, user: User) -> User:\n        db_user = UserModel(**user.dict())\n        self.db.add(db_user)\n        await self.db.commit()\n        await self.db.refresh(db_user)\n        return User.from_orm(db_user)\n\nclass CachedUserRepository(UserRepository):\n    \"\"\"Decorator pattern — adds caching to any repository\"\"\"\n    def __init__(self, repo: UserRepository, cache: Redis):\n        self._repo = repo\n        self._cache = cache\n    \n    async def get(self, user_id: int) -> Optional[User]:\n        key = f\"user:{user_id}\"\n        cached = await self._cache.get(key)\n        if cached:\n            return User.parse_raw(cached)\n        \n        user = await self._repo.get(user_id)\n        if user:\n            await self._cache.setex(key, 300, user.json())\n        return user\n```\n\n---\n\n"},{"title":"Chapter 3.8 – Learning Roadmap: Advanced Python","html":"<h2>Chapter 3.8 – Learning Roadmap: Advanced Python<\/h2>\n<h3>Books<\/h3>\n<ol>\n<li><em>Fluent Python<\/em> (2nd ed.) — Luciano Ramalho — <strong>Start here<\/strong><\/li>\n<li><em>CPython Internals<\/em> — Anthony Shaw — For bytecode, memory<\/li>\n<li><em>Architecture Patterns with Python<\/em> — Bob Gregory, Harry Percival<\/li>\n<li><em>High Performance Python<\/em> — Micha Gorelick, Ian Ozsvald<\/li>\n<li><em>Robust Python<\/em> — Patrick Viafore — For type system depth<\/li>\n<\/ol>\n<h3>Courses<\/h3>\n<ul>\n<li><em>Python Concurrency with asyncio<\/em> (Manning) — Matthew Fowler<\/li>\n<li><em>Real Python<\/em> — asyncio, decorators, descriptors<\/li>\n<li>Arjan Codes YouTube — Clean architecture in Python<\/li>\n<li>mCoding YouTube — CPython internals deep dives<\/li>\n<\/ul>\n<h3>YouTube Channels<\/h3>\n<ul>\n<li><strong>mCoding<\/strong> — CPython internals, performance<\/li>\n<li><strong>ArjanCodes<\/strong> — Architecture and design patterns<\/li>\n<li><strong>Tech With Tim<\/strong> — Async patterns<\/li>\n<li><strong>Raymond Hettinger<\/strong> — PyCon talks, Pythonic code<\/li>\n<\/ul>\n<h3>Milestones<\/h3>\n<ul>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/><strong>Month 1:<\/strong> Explain GIL, show 3 ways to bypass it<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/><strong>Month 2:<\/strong> Profile a slow Python function and optimize it by 50%+<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/><strong>Month 3:<\/strong> Implement full async pipeline using asyncio + aiohttp<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/><strong>Month 4:<\/strong> Contribute a type-annotated module with Protocols and Generics<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/><strong>Month 6:<\/strong> Build and present an internal talk on Python performance<\/li>\n<\/ul>\n<h3>Interview Questions (Staff Level)<\/h3>\n<ol>\n<li>What is the GIL? When is it a problem, and what are your options?<\/li>\n<li>How does Python's garbage collector interact with reference counting?<\/li>\n<li>Explain the event loop. What happens when you <code>await<\/code> something?<\/li>\n<li>What are descriptors in Python? How does <code>@property<\/code> use them?<\/li>\n<li>When would you use <code>multiprocessing<\/code> vs <code>threading<\/code> vs <code>asyncio<\/code>?<\/li>\n<li>How would you profile and fix a slow FastAPI endpoint?<\/li>\n<li>What is <code>__slots__<\/code> and when would you use it in production?<\/li>\n<li>Explain Python's MRO (Method Resolution Order) and C3 linearization.<\/li>\n<li>What are Protocols and how do they differ from ABC?<\/li>\n<li>How does <code>functools.wraps<\/code> work and why is it important?<\/li>\n<\/ol>\n","text":"## Chapter 3.8 – Learning Roadmap: Advanced Python\n\n### Books\n1. *Fluent Python* (2nd ed.) — Luciano Ramalho — **Start here**\n2. *CPython Internals* — Anthony Shaw — For bytecode, memory\n3. *Architecture Patterns with Python* — Bob Gregory, Harry Percival\n4. *High Performance Python* — Micha Gorelick, Ian Ozsvald\n5. *Robust Python* — Patrick Viafore — For type system depth\n\n### Courses\n- *Python Concurrency with asyncio* (Manning) — Matthew Fowler\n- *Real Python* — asyncio, decorators, descriptors\n- Arjan Codes YouTube — Clean architecture in Python\n- mCoding YouTube — CPython internals deep dives\n\n### YouTube Channels\n- **mCoding** — CPython internals, performance\n- **ArjanCodes** — Architecture and design patterns\n- **Tech With Tim** — Async patterns\n- **Raymond Hettinger** — PyCon talks, Pythonic code\n\n### Milestones\n\n- [ ] **Month 1:** Explain GIL, show 3 ways to bypass it\n- [ ] **Month 2:** Profile a slow Python function and optimize it by 50%+\n- [ ] **Month 3:** Implement full async pipeline using asyncio + aiohttp\n- [ ] **Month 4:** Contribute a type-annotated module with Protocols and Generics\n- [ ] **Month 6:** Build and present an internal talk on Python performance\n\n### Interview Questions (Staff Level)\n\n1. What is the GIL? When is it a problem, and what are your options?\n2. How does Python's garbage collector interact with reference counting?\n3. Explain the event loop. What happens when you `await` something?\n4. What are descriptors in Python? How does `@property` use them?\n5. When would you use `multiprocessing` vs `threading` vs `asyncio`?\n6. How would you profile and fix a slow FastAPI endpoint?\n7. What is `__slots__` and when would you use it in production?\n8. Explain Python's MRO (Method Resolution Order) and C3 linearization.\n9. What are Protocols and how do they differ from ABC?\n10. How does `functools.wraps` work and why is it important?\n\n"}]},{"id":4,"title":"Backend Engineering Excellence","chapters":[{"title":"Introduction","html":"<h1>PART 4 – BACKEND ENGINEERING EXCELLENCE<\/h1>\n<hr />\n","text":"# PART 4 – BACKEND ENGINEERING EXCELLENCE\n\n---\n\n"},{"title":"Chapter 4.1 – Why Backend Excellence Matters at Staff Level","html":"<h2>Chapter 4.1 – Why Backend Excellence Matters at Staff Level<\/h2>\n<p>At Staff level, you're not just writing APIs — you're defining how your organization thinks about API design, service contracts, data consistency, and reliability. You become the person who is consulted when teams are deciding how to structure their services, what protocol to use, and how to version their APIs without breaking clients.<\/p>\n<p>Your background in FastAPI, microservices, and multi-tenant systems gives a strong foundation. The gaps are: formal API design principles, protocol trade-offs (REST vs gRPC vs GraphQL), and reliability engineering as a discipline.<\/p>\n<hr />\n","text":"## Chapter 4.1 – Why Backend Excellence Matters at Staff Level\n\nAt Staff level, you're not just writing APIs — you're defining how your organization thinks about API design, service contracts, data consistency, and reliability. You become the person who is consulted when teams are deciding how to structure their services, what protocol to use, and how to version their APIs without breaking clients.\n\nYour background in FastAPI, microservices, and multi-tenant systems gives a strong foundation. The gaps are: formal API design principles, protocol trade-offs (REST vs gRPC vs GraphQL), and reliability engineering as a discipline.\n\n---\n\n"},{"title":"Chapter 4.2 – API Design Principles","html":"<h2>Chapter 4.2 – API Design Principles<\/h2>\n<h3>REST API Design<\/h3>\n<p><strong>Resource naming:<\/strong><\/p>\n<pre><code># Good — noun-based, hierarchical\nGET    /organizations/{org_id}/users\nPOST   /organizations/{org_id}/users\nGET    /organizations/{org_id}/users/{user_id}\nPUT    /organizations/{org_id}/users/{user_id}\nDELETE /organizations/{org_id}/users/{user_id}\n\n# Bad — verb-based\nGET  /getUser\nPOST /createUser\nPOST /deleteUser\n<\/code><\/pre>\n<p><strong>HTTP Status Codes — Use Precisely:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n  <th>Scenario<\/th>\n  <th>Code<\/th>\n  <th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Success with body<\/td>\n  <td>200 OK<\/td>\n  <td>Default success<\/td>\n<\/tr>\n<tr>\n  <td>Created resource<\/td>\n  <td>201 Created<\/td>\n  <td>Include Location header<\/td>\n<\/tr>\n<tr>\n  <td>Async accepted<\/td>\n  <td>202 Accepted<\/td>\n  <td>Return job ID<\/td>\n<\/tr>\n<tr>\n  <td>No content<\/td>\n  <td>204 No Content<\/td>\n  <td>DELETE success<\/td>\n<\/tr>\n<tr>\n  <td>Bad request<\/td>\n  <td>400 Bad Request<\/td>\n  <td>Validation failure<\/td>\n<\/tr>\n<tr>\n  <td>Unauthenticated<\/td>\n  <td>401 Unauthorized<\/td>\n  <td>Missing/invalid token<\/td>\n<\/tr>\n<tr>\n  <td>Unauthorized<\/td>\n  <td>403 Forbidden<\/td>\n  <td>Valid token, wrong permissions<\/td>\n<\/tr>\n<tr>\n  <td>Not found<\/td>\n  <td>404 Not Found<\/td>\n  <td>Resource doesn't exist<\/td>\n<\/tr>\n<tr>\n  <td>Conflict<\/td>\n  <td>409 Conflict<\/td>\n  <td>Duplicate resource<\/td>\n<\/tr>\n<tr>\n  <td>Unprocessable<\/td>\n  <td>422 Unprocessable Entity<\/td>\n  <td>Semantic validation failure<\/td>\n<\/tr>\n<tr>\n  <td>Rate limited<\/td>\n  <td>429 Too Many Requests<\/td>\n  <td>Include Retry-After header<\/td>\n<\/tr>\n<tr>\n  <td>Server error<\/td>\n  <td>500 Internal Server Error<\/td>\n  <td>Unexpected error<\/td>\n<\/tr>\n<tr>\n  <td>Unavailable<\/td>\n  <td>503 Service Unavailable<\/td>\n  <td>Circuit breaker open<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Pagination Patterns:<\/strong><\/p>\n<pre><code class=\"language-python\"># Cursor-based pagination (preferred for large datasets)\n# Request\nGET /users?cursor=eyJ1c2VyX2lkIjogMTAwfQ==&amp;limit=20\n\n# Response\n{\n    &quot;data&quot;: [...],\n    &quot;pagination&quot;: {\n        &quot;next_cursor&quot;: &quot;eyJ1c2VyX2lkIjogMTIwfQ==&quot;,\n        &quot;has_more&quot;: true,\n        &quot;total&quot;: null  # Omit for large tables (COUNT(*) is expensive)\n    }\n}\n\n# Offset-based pagination (only for admin UIs with known small datasets)\nGET /users?offset=20&amp;limit=20\n<\/code><\/pre>\n<p><strong>FastAPI Best Practices (Production):<\/strong><\/p>\n<pre><code class=\"language-python\">from fastapi import FastAPI, Depends, HTTPException, status, Request\nfrom fastapi.middleware.cors import CORSMiddleware\nfrom fastapi.responses import JSONResponse\nfrom pydantic import BaseModel, Field, validator\nfrom typing import Optional, Annotated\nimport structlog\n\nlogger = structlog.get_logger()\n\nclass CreateUserRequest(BaseModel):\n    name: str = Field(..., min_length=1, max_length=100)\n    email: str = Field(..., regex=r'^[^@]+@[^@]+\\.[^@]+$')\n    role: Literal[&quot;admin&quot;, &quot;user&quot;] = &quot;user&quot;\n    \n    @validator('email')\n    def email_lowercase(cls, v):\n        return v.lower()\n\nclass UserResponse(BaseModel):\n    id: int\n    name: str\n    email: str\n    role: str\n    created_at: datetime\n    \n    class Config:\n        from_attributes = True  # Pydantic v2\n\n@router.post(\n    &quot;/users&quot;,\n    response_model=UserResponse,\n    status_code=status.HTTP_201_CREATED,\n    summary=&quot;Create a new user&quot;,\n    description=&quot;Creates a new user in the organization. Email must be unique.&quot;,\n    responses={\n        409: {&quot;description&quot;: &quot;User with this email already exists&quot;},\n        422: {&quot;description&quot;: &quot;Validation error&quot;},\n    }\n)\nasync def create_user(\n    request: CreateUserRequest,\n    org_id: int = Path(..., description=&quot;Organization ID&quot;),\n    current_user: User = Depends(get_current_user),\n    db: AsyncSession = Depends(get_db),\n    background_tasks: BackgroundTasks = BackgroundTasks(),\n) -&gt; UserResponse:\n    log = logger.bind(org_id=org_id, email=request.email)\n    \n    try:\n        user = await user_service.create(db, org_id, request, created_by=current_user.id)\n        background_tasks.add_task(send_welcome_email, user.email)\n        log.info(&quot;user_created&quot;, user_id=user.id)\n        return user\n    except DuplicateEmailError:\n        raise HTTPException(\n            status_code=status.HTTP_409_CONFLICT,\n            detail=&quot;User with this email already exists&quot;\n        )\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 4.2 – API Design Principles\n\n### REST API Design\n\n**Resource naming:**\n```\n# Good — noun-based, hierarchical\nGET    /organizations/{org_id}/users\nPOST   /organizations/{org_id}/users\nGET    /organizations/{org_id}/users/{user_id}\nPUT    /organizations/{org_id}/users/{user_id}\nDELETE /organizations/{org_id}/users/{user_id}\n\n# Bad — verb-based\nGET  /getUser\nPOST /createUser\nPOST /deleteUser\n```\n\n**HTTP Status Codes — Use Precisely:**\n\n| Scenario | Code | Notes |\n|---|---|---|\n| Success with body | 200 OK | Default success |\n| Created resource | 201 Created | Include Location header |\n| Async accepted | 202 Accepted | Return job ID |\n| No content | 204 No Content | DELETE success |\n| Bad request | 400 Bad Request | Validation failure |\n| Unauthenticated | 401 Unauthorized | Missing/invalid token |\n| Unauthorized | 403 Forbidden | Valid token, wrong permissions |\n| Not found | 404 Not Found | Resource doesn't exist |\n| Conflict | 409 Conflict | Duplicate resource |\n| Unprocessable | 422 Unprocessable Entity | Semantic validation failure |\n| Rate limited | 429 Too Many Requests | Include Retry-After header |\n| Server error | 500 Internal Server Error | Unexpected error |\n| Unavailable | 503 Service Unavailable | Circuit breaker open |\n\n**Pagination Patterns:**\n\n```python\n# Cursor-based pagination (preferred for large datasets)\n# Request\nGET /users?cursor=eyJ1c2VyX2lkIjogMTAwfQ==&limit=20\n\n# Response\n{\n    \"data\": [...],\n    \"pagination\": {\n        \"next_cursor\": \"eyJ1c2VyX2lkIjogMTIwfQ==\",\n        \"has_more\": true,\n        \"total\": null  # Omit for large tables (COUNT(*) is expensive)\n    }\n}\n\n# Offset-based pagination (only for admin UIs with known small datasets)\nGET /users?offset=20&limit=20\n```\n\n**FastAPI Best Practices (Production):**\n```python\nfrom fastapi import FastAPI, Depends, HTTPException, status, Request\nfrom fastapi.middleware.cors import CORSMiddleware\nfrom fastapi.responses import JSONResponse\nfrom pydantic import BaseModel, Field, validator\nfrom typing import Optional, Annotated\nimport structlog\n\nlogger = structlog.get_logger()\n\nclass CreateUserRequest(BaseModel):\n    name: str = Field(..., min_length=1, max_length=100)\n    email: str = Field(..., regex=r'^[^@]+@[^@]+\\.[^@]+$')\n    role: Literal[\"admin\", \"user\"] = \"user\"\n    \n    @validator('email')\n    def email_lowercase(cls, v):\n        return v.lower()\n\nclass UserResponse(BaseModel):\n    id: int\n    name: str\n    email: str\n    role: str\n    created_at: datetime\n    \n    class Config:\n        from_attributes = True  # Pydantic v2\n\n@router.post(\n    \"/users\",\n    response_model=UserResponse,\n    status_code=status.HTTP_201_CREATED,\n    summary=\"Create a new user\",\n    description=\"Creates a new user in the organization. Email must be unique.\",\n    responses={\n        409: {\"description\": \"User with this email already exists\"},\n        422: {\"description\": \"Validation error\"},\n    }\n)\nasync def create_user(\n    request: CreateUserRequest,\n    org_id: int = Path(..., description=\"Organization ID\"),\n    current_user: User = Depends(get_current_user),\n    db: AsyncSession = Depends(get_db),\n    background_tasks: BackgroundTasks = BackgroundTasks(),\n) -> UserResponse:\n    log = logger.bind(org_id=org_id, email=request.email)\n    \n    try:\n        user = await user_service.create(db, org_id, request, created_by=current_user.id)\n        background_tasks.add_task(send_welcome_email, user.email)\n        log.info(\"user_created\", user_id=user.id)\n        return user\n    except DuplicateEmailError:\n        raise HTTPException(\n            status_code=status.HTTP_409_CONFLICT,\n            detail=\"User with this email already exists\"\n        )\n```\n\n---\n\n"},{"title":"Chapter 4.3 – REST vs GraphQL vs gRPC","html":"<h2>Chapter 4.3 – REST vs GraphQL vs gRPC<\/h2>\n<h3>Protocol Comparison<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Dimension<\/th>\n  <th>REST<\/th>\n  <th>GraphQL<\/th>\n  <th>gRPC<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Transport<\/td>\n  <td>HTTP/1.1, HTTP/2<\/td>\n  <td>HTTP/1.1, HTTP/2<\/td>\n  <td>HTTP/2<\/td>\n<\/tr>\n<tr>\n  <td>Payload<\/td>\n  <td>JSON<\/td>\n  <td>JSON<\/td>\n  <td>Protocol Buffers (binary)<\/td>\n<\/tr>\n<tr>\n  <td>Schema<\/td>\n  <td>OpenAPI (optional)<\/td>\n  <td>Schema-first (mandatory)<\/td>\n  <td>.proto files (mandatory)<\/td>\n<\/tr>\n<tr>\n  <td>Versioning<\/td>\n  <td>URL/header-based<\/td>\n  <td>Schema evolution<\/td>\n  <td>Proto evolution<\/td>\n<\/tr>\n<tr>\n  <td>N+1 problem<\/td>\n  <td>Problematic<\/td>\n  <td>Solved with DataLoader<\/td>\n  <td>N/A (strong typing)<\/td>\n<\/tr>\n<tr>\n  <td>Streaming<\/td>\n  <td>SSE, WebSocket<\/td>\n  <td>Subscriptions<\/td>\n  <td>Native bidirectional<\/td>\n<\/tr>\n<tr>\n  <td>Caching<\/td>\n  <td>HTTP caching<\/td>\n  <td>Complex<\/td>\n  <td>Not HTTP-cacheable<\/td>\n<\/tr>\n<tr>\n  <td>Best for<\/td>\n  <td>Public APIs, web clients<\/td>\n  <td>Flexible client queries<\/td>\n  <td>Internal service-to-service<\/td>\n<\/tr>\n<tr>\n  <td>Performance<\/td>\n  <td>Good<\/td>\n  <td>Good<\/td>\n  <td>Excellent (10x REST)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>When to Choose gRPC<\/h3>\n<p>gRPC is ideal for:<\/p>\n<ul>\n<li>Internal microservice communication (same datacenter)<\/li>\n<li>Polyglot services (auto-generated clients in 10+ languages)<\/li>\n<li>High-throughput, low-latency requirements<\/li>\n<li>Streaming data (logs, events, real-time feeds)<\/li>\n<\/ul>\n<p><strong>gRPC in Python:<\/strong><\/p>\n<pre><code class=\"language-protobuf\">// user_service.proto\nsyntax = &quot;proto3&quot;;\n\npackage user.v1;\n\nservice UserService {\n    rpc GetUser(GetUserRequest) returns (GetUserResponse);\n    rpc ListUsers(ListUsersRequest) returns (stream UserResponse);\n    rpc CreateUser(CreateUserRequest) returns (UserResponse);\n}\n\nmessage GetUserRequest {\n    int64 user_id = 1;\n    string tenant_id = 2;\n}\n\nmessage UserResponse {\n    int64 id = 1;\n    string name = 2;\n    string email = 3;\n    string role = 4;\n    int64 created_at = 5;\n}\n<\/code><\/pre>\n<pre><code class=\"language-python\"># Python gRPC service implementation\nimport grpc\nfrom concurrent import futures\nimport user_service_pb2 as pb2\nimport user_service_pb2_grpc as pb2_grpc\n\nclass UserServicer(pb2_grpc.UserServiceServicer):\n    def __init__(self, db_pool, cache):\n        self.db = db_pool\n        self.cache = cache\n    \n    async def GetUser(self, request, context):\n        user = await self.db.get_user(request.user_id, request.tenant_id)\n        if not user:\n            context.set_code(grpc.StatusCode.NOT_FOUND)\n            context.set_details(f&quot;User {request.user_id} not found&quot;)\n            return pb2.UserResponse()\n        return pb2.UserResponse(\n            id=user.id,\n            name=user.name,\n            email=user.email,\n        )\n    \n    async def ListUsers(self, request, context):\n        &quot;&quot;&quot;Server-side streaming&quot;&quot;&quot;\n        async for user in self.db.iter_users(request.tenant_id):\n            yield pb2.UserResponse(id=user.id, name=user.name)\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 4.3 – REST vs GraphQL vs gRPC\n\n### Protocol Comparison\n\n| Dimension | REST | GraphQL | gRPC |\n|---|---|---|---|\n| Transport | HTTP/1.1, HTTP/2 | HTTP/1.1, HTTP/2 | HTTP/2 |\n| Payload | JSON | JSON | Protocol Buffers (binary) |\n| Schema | OpenAPI (optional) | Schema-first (mandatory) | .proto files (mandatory) |\n| Versioning | URL/header-based | Schema evolution | Proto evolution |\n| N+1 problem | Problematic | Solved with DataLoader | N/A (strong typing) |\n| Streaming | SSE, WebSocket | Subscriptions | Native bidirectional |\n| Caching | HTTP caching | Complex | Not HTTP-cacheable |\n| Best for | Public APIs, web clients | Flexible client queries | Internal service-to-service |\n| Performance | Good | Good | Excellent (10x REST) |\n\n### When to Choose gRPC\n\ngRPC is ideal for:\n- Internal microservice communication (same datacenter)\n- Polyglot services (auto-generated clients in 10+ languages)\n- High-throughput, low-latency requirements\n- Streaming data (logs, events, real-time feeds)\n\n**gRPC in Python:**\n```protobuf\n// user_service.proto\nsyntax = \"proto3\";\n\npackage user.v1;\n\nservice UserService {\n    rpc GetUser(GetUserRequest) returns (GetUserResponse);\n    rpc ListUsers(ListUsersRequest) returns (stream UserResponse);\n    rpc CreateUser(CreateUserRequest) returns (UserResponse);\n}\n\nmessage GetUserRequest {\n    int64 user_id = 1;\n    string tenant_id = 2;\n}\n\nmessage UserResponse {\n    int64 id = 1;\n    string name = 2;\n    string email = 3;\n    string role = 4;\n    int64 created_at = 5;\n}\n```\n\n```python\n# Python gRPC service implementation\nimport grpc\nfrom concurrent import futures\nimport user_service_pb2 as pb2\nimport user_service_pb2_grpc as pb2_grpc\n\nclass UserServicer(pb2_grpc.UserServiceServicer):\n    def __init__(self, db_pool, cache):\n        self.db = db_pool\n        self.cache = cache\n    \n    async def GetUser(self, request, context):\n        user = await self.db.get_user(request.user_id, request.tenant_id)\n        if not user:\n            context.set_code(grpc.StatusCode.NOT_FOUND)\n            context.set_details(f\"User {request.user_id} not found\")\n            return pb2.UserResponse()\n        return pb2.UserResponse(\n            id=user.id,\n            name=user.name,\n            email=user.email,\n        )\n    \n    async def ListUsers(self, request, context):\n        \"\"\"Server-side streaming\"\"\"\n        async for user in self.db.iter_users(request.tenant_id):\n            yield pb2.UserResponse(id=user.id, name=user.name)\n```\n\n---\n\n"},{"title":"Chapter 4.4 – Service Design & Boundaries","html":"<h2>Chapter 4.4 – Service Design &amp; Boundaries<\/h2>\n<h3>Identifying Service Boundaries<\/h3>\n<p>The correct boundary for a microservice is a <strong>bounded context<\/strong> from Domain-Driven Design (DDD):<\/p>\n<pre><code>Good service boundaries:\n  ✅ User Identity Service — manages authentication and profiles\n  ✅ Billing Service — handles subscriptions, payments, invoices\n  ✅ Notification Service — handles all outbound communications\n  ✅ Content Service — manages documents, assets, media\n\nBad service boundaries:\n  ❌ &quot;Database Service&quot; — infrastructure, not a domain\n  ❌ &quot;Utils Service&quot; — no coherent domain\n  ❌ &quot;Frontend API Service&quot; — aggregation doesn't define a service\n<\/code><\/pre>\n<h3>Monolith vs Microservices Decision Framework<\/h3>\n<p>Start with a <strong>modular monolith<\/strong> unless you have these signals:<\/p>\n<table>\n<thead>\n<tr>\n  <th>Signal<\/th>\n  <th>Consider Microservices<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Team size &gt; 30 engineers<\/td>\n  <td>Different teams need independent deployments<\/td>\n<\/tr>\n<tr>\n  <td>Scaling requirements differ dramatically<\/td>\n  <td>Payment processing vs content serving<\/td>\n<\/tr>\n<tr>\n  <td>Technology heterogeneity required<\/td>\n  <td>ML inference service needs Python + GPU<\/td>\n<\/tr>\n<tr>\n  <td>Compliance isolation required<\/td>\n  <td>PCI DSS scope reduction<\/td>\n<\/tr>\n<tr>\n  <td>10x difference in reliability requirements<\/td>\n  <td>Payment processing vs recommendations<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>The Strangler Fig Pattern<\/strong> — migrating monolith to microservices safely:<\/p>\n<pre><code>1. Identify high-value, bounded domain\n2. Build new microservice alongside monolith\n3. Route traffic incrementally (10% → 50% → 100%)\n4. Remove monolith code after full cutover\n5. Repeat for next domain\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 4.4 – Service Design & Boundaries\n\n### Identifying Service Boundaries\n\nThe correct boundary for a microservice is a **bounded context** from Domain-Driven Design (DDD):\n\n```\nGood service boundaries:\n  ✅ User Identity Service — manages authentication and profiles\n  ✅ Billing Service — handles subscriptions, payments, invoices\n  ✅ Notification Service — handles all outbound communications\n  ✅ Content Service — manages documents, assets, media\n\nBad service boundaries:\n  ❌ \"Database Service\" — infrastructure, not a domain\n  ❌ \"Utils Service\" — no coherent domain\n  ❌ \"Frontend API Service\" — aggregation doesn't define a service\n```\n\n### Monolith vs Microservices Decision Framework\n\nStart with a **modular monolith** unless you have these signals:\n\n| Signal | Consider Microservices |\n|---|---|\n| Team size > 30 engineers | Different teams need independent deployments |\n| Scaling requirements differ dramatically | Payment processing vs content serving |\n| Technology heterogeneity required | ML inference service needs Python + GPU |\n| Compliance isolation required | PCI DSS scope reduction |\n| 10x difference in reliability requirements | Payment processing vs recommendations |\n\n**The Strangler Fig Pattern** — migrating monolith to microservices safely:\n```\n1. Identify high-value, bounded domain\n2. Build new microservice alongside monolith\n3. Route traffic incrementally (10% → 50% → 100%)\n4. Remove monolith code after full cutover\n5. Repeat for next domain\n```\n\n---\n\n"},{"title":"Chapter 4.5 – API Versioning Strategies","html":"<h2>Chapter 4.5 – API Versioning Strategies<\/h2>\n<h3>Versioning Options Compared<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Strategy<\/th>\n  <th>Example<\/th>\n  <th>Pros<\/th>\n  <th>Cons<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>URL path<\/td>\n  <td><code>/v1/users<\/code><\/td>\n  <td>Simple, explicit<\/td>\n  <td>Breaks REST resource model<\/td>\n<\/tr>\n<tr>\n  <td>Header<\/td>\n  <td><code>Accept: application/vnd.api+json;version=1<\/code><\/td>\n  <td>Clean URLs<\/td>\n  <td>Less visible<\/td>\n<\/tr>\n<tr>\n  <td>Query param<\/td>\n  <td><code>/users?version=1<\/code><\/td>\n  <td>Easy to test<\/td>\n  <td>Pollutes resource URL<\/td>\n<\/tr>\n<tr>\n  <td>Content negotiation<\/td>\n  <td><code>Accept: application/vnd.myapi.v1+json<\/code><\/td>\n  <td>REST-correct<\/td>\n  <td>Complex clients<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Recommendation for your context:<\/strong> URL path versioning for external APIs (simple, widely understood). Header versioning for internal APIs.<\/p>\n<p><strong>Version Lifecycle Policy:<\/strong><\/p>\n<pre><code>v1 Released\n    ↓ (6 months)\nv2 Released → v1 Deprecated (announce, add deprecation headers)\n    ↓ (12 months)\nv3 Released → v1 Sunset (removed)\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 4.5 – API Versioning Strategies\n\n### Versioning Options Compared\n\n| Strategy | Example | Pros | Cons |\n|---|---|---|---|\n| URL path | `/v1/users` | Simple, explicit | Breaks REST resource model |\n| Header | `Accept: application/vnd.api+json;version=1` | Clean URLs | Less visible |\n| Query param | `/users?version=1` | Easy to test | Pollutes resource URL |\n| Content negotiation | `Accept: application/vnd.myapi.v1+json` | REST-correct | Complex clients |\n\n**Recommendation for your context:** URL path versioning for external APIs (simple, widely understood). Header versioning for internal APIs.\n\n**Version Lifecycle Policy:**\n```\nv1 Released\n    ↓ (6 months)\nv2 Released → v1 Deprecated (announce, add deprecation headers)\n    ↓ (12 months)\nv3 Released → v1 Sunset (removed)\n```\n\n---\n\n"},{"title":"Chapter 4.6 – Reliability Engineering","html":"<h2>Chapter 4.6 – Reliability Engineering<\/h2>\n<h3>The Four Golden Signals<\/h3>\n<p>Defined by Google's SRE book:<\/p>\n<table>\n<thead>\n<tr>\n  <th>Signal<\/th>\n  <th>What It Measures<\/th>\n  <th>Example Metric<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><strong>Latency<\/strong><\/td>\n  <td>How long requests take<\/td>\n  <td>p50, p95, p99 response time<\/td>\n<\/tr>\n<tr>\n  <td><strong>Traffic<\/strong><\/td>\n  <td>How much demand<\/td>\n  <td>Requests per second<\/td>\n<\/tr>\n<tr>\n  <td><strong>Errors<\/strong><\/td>\n  <td>Rate of failed requests<\/td>\n  <td>HTTP 5xx rate<\/td>\n<\/tr>\n<tr>\n  <td><strong>Saturation<\/strong><\/td>\n  <td>How &quot;full&quot; your service is<\/td>\n  <td>CPU%, queue depth, connection pool<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Circuit Breaker Pattern<\/h3>\n<pre><code class=\"language-python\">import asyncio\nfrom enum import Enum\nfrom datetime import datetime, timedelta\n\nclass CircuitState(Enum):\n    CLOSED = &quot;closed&quot;      # Normal operation\n    OPEN = &quot;open&quot;          # Failing, reject requests\n    HALF_OPEN = &quot;half_open&quot;  # Testing if service recovered\n\nclass CircuitBreaker:\n    def __init__(\n        self,\n        failure_threshold: int = 5,\n        reset_timeout: float = 60.0,\n        half_open_max_calls: int = 3,\n    ):\n        self.failure_threshold = failure_threshold\n        self.reset_timeout = reset_timeout\n        self.half_open_max_calls = half_open_max_calls\n        self.state = CircuitState.CLOSED\n        self.failure_count = 0\n        self.last_failure_time: datetime | None = None\n        self.half_open_calls = 0\n    \n    async def call(self, func, *args, **kwargs):\n        if self.state == CircuitState.OPEN:\n            if self._should_attempt_reset():\n                self.state = CircuitState.HALF_OPEN\n                self.half_open_calls = 0\n            else:\n                raise CircuitOpenError(&quot;Circuit breaker is OPEN&quot;)\n        \n        try:\n            result = await func(*args, **kwargs)\n            self._on_success()\n            return result\n        except Exception as e:\n            self._on_failure()\n            raise\n    \n    def _on_success(self):\n        self.failure_count = 0\n        if self.state == CircuitState.HALF_OPEN:\n            self.half_open_calls += 1\n            if self.half_open_calls &gt;= self.half_open_max_calls:\n                self.state = CircuitState.CLOSED\n    \n    def _on_failure(self):\n        self.failure_count += 1\n        self.last_failure_time = datetime.utcnow()\n        if self.failure_count &gt;= self.failure_threshold:\n            self.state = CircuitState.OPEN\n    \n    def _should_attempt_reset(self):\n        if self.last_failure_time is None:\n            return True\n        return datetime.utcnow() - self.last_failure_time &gt; timedelta(seconds=self.reset_timeout)\n<\/code><\/pre>\n<h3>Retry with Exponential Backoff + Jitter<\/h3>\n<pre><code class=\"language-python\">import random\nimport asyncio\n\nasync def retry_with_backoff(\n    func,\n    max_retries: int = 3,\n    base_delay: float = 1.0,\n    max_delay: float = 60.0,\n    jitter: bool = True,\n):\n    for attempt in range(max_retries + 1):\n        try:\n            return await func()\n        except (TransientError, ConnectionError) as e:\n            if attempt == max_retries:\n                raise\n            \n            delay = min(base_delay * (2 ** attempt), max_delay)\n            if jitter:\n                delay *= (0.5 + random.random() * 0.5)  # ±50% jitter\n            \n            await asyncio.sleep(delay)\n<\/code><\/pre>\n<h3>Books &amp; Resources<\/h3>\n<p><strong>Books:<\/strong><\/p>\n<ul>\n<li><em>Designing Distributed Systems<\/em> — Brendan Burns (O'Reilly)<\/li>\n<li><em>Building Microservices<\/em> — Sam Newman<\/li>\n<li><em>Release It!<\/em> — Michael Nygard (patterns for production)<\/li>\n<li><em>The Pragmatic Programmer<\/em> — Hunt &amp; Thomas<\/li>\n<\/ul>\n<p><strong>Courses:<\/strong><\/p>\n<ul>\n<li>Backend Master Class (gRPC, REST, microservices) — TechSchool on Udemy<\/li>\n<li>System Design Interview — Alex Xu (course + book)<\/li>\n<\/ul>\n<hr />\n","text":"## Chapter 4.6 – Reliability Engineering\n\n### The Four Golden Signals\n\nDefined by Google's SRE book:\n\n| Signal | What It Measures | Example Metric |\n|---|---|---|\n| **Latency** | How long requests take | p50, p95, p99 response time |\n| **Traffic** | How much demand | Requests per second |\n| **Errors** | Rate of failed requests | HTTP 5xx rate |\n| **Saturation** | How \"full\" your service is | CPU%, queue depth, connection pool |\n\n### Circuit Breaker Pattern\n\n```python\nimport asyncio\nfrom enum import Enum\nfrom datetime import datetime, timedelta\n\nclass CircuitState(Enum):\n    CLOSED = \"closed\"      # Normal operation\n    OPEN = \"open\"          # Failing, reject requests\n    HALF_OPEN = \"half_open\"  # Testing if service recovered\n\nclass CircuitBreaker:\n    def __init__(\n        self,\n        failure_threshold: int = 5,\n        reset_timeout: float = 60.0,\n        half_open_max_calls: int = 3,\n    ):\n        self.failure_threshold = failure_threshold\n        self.reset_timeout = reset_timeout\n        self.half_open_max_calls = half_open_max_calls\n        self.state = CircuitState.CLOSED\n        self.failure_count = 0\n        self.last_failure_time: datetime | None = None\n        self.half_open_calls = 0\n    \n    async def call(self, func, *args, **kwargs):\n        if self.state == CircuitState.OPEN:\n            if self._should_attempt_reset():\n                self.state = CircuitState.HALF_OPEN\n                self.half_open_calls = 0\n            else:\n                raise CircuitOpenError(\"Circuit breaker is OPEN\")\n        \n        try:\n            result = await func(*args, **kwargs)\n            self._on_success()\n            return result\n        except Exception as e:\n            self._on_failure()\n            raise\n    \n    def _on_success(self):\n        self.failure_count = 0\n        if self.state == CircuitState.HALF_OPEN:\n            self.half_open_calls += 1\n            if self.half_open_calls >= self.half_open_max_calls:\n                self.state = CircuitState.CLOSED\n    \n    def _on_failure(self):\n        self.failure_count += 1\n        self.last_failure_time = datetime.utcnow()\n        if self.failure_count >= self.failure_threshold:\n            self.state = CircuitState.OPEN\n    \n    def _should_attempt_reset(self):\n        if self.last_failure_time is None:\n            return True\n        return datetime.utcnow() - self.last_failure_time > timedelta(seconds=self.reset_timeout)\n```\n\n### Retry with Exponential Backoff + Jitter\n\n```python\nimport random\nimport asyncio\n\nasync def retry_with_backoff(\n    func,\n    max_retries: int = 3,\n    base_delay: float = 1.0,\n    max_delay: float = 60.0,\n    jitter: bool = True,\n):\n    for attempt in range(max_retries + 1):\n        try:\n            return await func()\n        except (TransientError, ConnectionError) as e:\n            if attempt == max_retries:\n                raise\n            \n            delay = min(base_delay * (2 ** attempt), max_delay)\n            if jitter:\n                delay *= (0.5 + random.random() * 0.5)  # ±50% jitter\n            \n            await asyncio.sleep(delay)\n```\n\n### Books & Resources\n\n**Books:**\n- *Designing Distributed Systems* — Brendan Burns (O'Reilly)\n- *Building Microservices* — Sam Newman\n- *Release It!* — Michael Nygard (patterns for production)\n- *The Pragmatic Programmer* — Hunt & Thomas\n\n**Courses:**\n- Backend Master Class (gRPC, REST, microservices) — TechSchool on Udemy\n- System Design Interview — Alex Xu (course + book)\n\n---\n\n"}]},{"id":5,"title":"PostgreSQL Mastery","chapters":[{"title":"Introduction","html":"<h1>PART 5 – POSTGRESQL MASTERY<\/h1>\n<hr />\n","text":"# PART 5 – POSTGRESQL MASTERY\n\n---\n\n"},{"title":"Chapter 5.1 – Why PostgreSQL Depth Matters","html":"<h2>Chapter 5.1 – Why PostgreSQL Depth Matters<\/h2>\n<p>Most engineers know SQL. Staff engineers understand <em>why<\/em> a query is slow, <em>how<\/em> the query planner chooses execution paths, <em>what<\/em> happens during a VACUUM, and <em>how<\/em> to design schemas for millions of rows per day. PostgreSQL knowledge at this depth directly affects:<\/p>\n<ul>\n<li>System reliability (avoiding deadlocks, managing bloat)<\/li>\n<li>Performance (index design, query optimization)<\/li>\n<li>Data integrity (MVCC understanding, transaction isolation)<\/li>\n<li>Operations (replication, PITR, partitioning)<\/li>\n<\/ul>\n<p>Given your recent PostgreSQL incident (accidental table destruction + WAL-based PITR), this chapter has additional weight.<\/p>\n<hr />\n","text":"## Chapter 5.1 – Why PostgreSQL Depth Matters\n\nMost engineers know SQL. Staff engineers understand *why* a query is slow, *how* the query planner chooses execution paths, *what* happens during a VACUUM, and *how* to design schemas for millions of rows per day. PostgreSQL knowledge at this depth directly affects:\n\n- System reliability (avoiding deadlocks, managing bloat)\n- Performance (index design, query optimization)\n- Data integrity (MVCC understanding, transaction isolation)\n- Operations (replication, PITR, partitioning)\n\nGiven your recent PostgreSQL incident (accidental table destruction + WAL-based PITR), this chapter has additional weight.\n\n---\n\n"},{"title":"Chapter 5.2 – MVCC: Multi-Version Concurrency Control","html":"<h2>Chapter 5.2 – MVCC: Multi-Version Concurrency Control<\/h2>\n<h3>How MVCC Works<\/h3>\n<p>PostgreSQL never overwrites data. Every row version is stamped with:<\/p>\n<pre><code>xmin — transaction ID that created this row version\nxmax — transaction ID that deleted/updated this row (0 if live)\n<\/code><\/pre>\n<pre><code class=\"language-sql\">-- See row versions directly\nSELECT \n    id,\n    name,\n    xmin,\n    xmax,\n    ctid  -- physical location (page, offset)\nFROM users;\n<\/code><\/pre>\n<p><strong>A transaction sees a row if:<\/strong><\/p>\n<ul>\n<li><code>xmin<\/code> committed before the transaction started<\/li>\n<li><code>xmax<\/code> is 0, or <code>xmax<\/code> is our transaction, or <code>xmax<\/code> didn't commit<\/li>\n<\/ul>\n<p>This means:<\/p>\n<ul>\n<li>Readers never block writers<\/li>\n<li>Writers never block readers<\/li>\n<li>Deadlocks only happen between writers<\/li>\n<\/ul>\n<p><strong>The Cost of MVCC — Table Bloat:<\/strong><\/p>\n<pre><code class=\"language-sql\">-- Find bloated tables\nSELECT \n    relname,\n    n_live_tup,\n    n_dead_tup,\n    round(n_dead_tup::numeric / GREATEST(n_live_tup + n_dead_tup, 1) * 100, 2) AS dead_pct,\n    last_autovacuum,\n    last_vacuum\nFROM pg_stat_user_tables\nORDER BY n_dead_tup DESC\nLIMIT 20;\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 5.2 – MVCC: Multi-Version Concurrency Control\n\n### How MVCC Works\n\nPostgreSQL never overwrites data. Every row version is stamped with:\n\n```\nxmin — transaction ID that created this row version\nxmax — transaction ID that deleted/updated this row (0 if live)\n```\n\n```sql\n-- See row versions directly\nSELECT \n    id,\n    name,\n    xmin,\n    xmax,\n    ctid  -- physical location (page, offset)\nFROM users;\n```\n\n**A transaction sees a row if:**\n- `xmin` committed before the transaction started\n- `xmax` is 0, or `xmax` is our transaction, or `xmax` didn't commit\n\nThis means:\n- Readers never block writers\n- Writers never block readers\n- Deadlocks only happen between writers\n\n**The Cost of MVCC — Table Bloat:**\n```sql\n-- Find bloated tables\nSELECT \n    relname,\n    n_live_tup,\n    n_dead_tup,\n    round(n_dead_tup::numeric / GREATEST(n_live_tup + n_dead_tup, 1) * 100, 2) AS dead_pct,\n    last_autovacuum,\n    last_vacuum\nFROM pg_stat_user_tables\nORDER BY n_dead_tup DESC\nLIMIT 20;\n```\n\n---\n\n"},{"title":"Chapter 5.3 – WAL: Write-Ahead Log","html":"<h2>Chapter 5.3 – WAL: Write-Ahead Log<\/h2>\n<h3>Architecture<\/h3>\n<pre><code>Write Operation\n    ↓\n1. WAL record written to WAL buffer\n2. WAL flushed to disk (fsync on commit)\n3. Data page modified in shared buffers\n4. Eventually flushed to disk\n<\/code><\/pre>\n<p>WAL provides:<\/p>\n<ul>\n<li><strong>Durability<\/strong> — If the system crashes after WAL flush, data is safe<\/li>\n<li><strong>Replication<\/strong> — WAL shipped to replicas<\/li>\n<li><strong>PITR<\/strong> — Replay WAL from a base backup to any point in time<\/li>\n<\/ul>\n<p><strong>WAL Configuration for High-Throughput Systems:<\/strong><\/p>\n<pre><code># postgresql.conf\nwal_level = replica          # or logical for CDC\nmax_wal_size = 4GB           # larger = fewer checkpoints\nmin_wal_size = 1GB\nwal_compression = on         # saves ~50% WAL disk space\nsynchronous_commit = on      # default: safe\n# synchronous_commit = off   # ~30% throughput gain, risk of last-commit loss\ncheckpoint_completion_target = 0.9  # spread I/O\n<\/code><\/pre>\n<p><strong>WAL for PITR (Point-in-Time Recovery):<\/strong><\/p>\n<pre><code class=\"language-bash\"># Base backup\npg_basebackup -h localhost -U replication_user \\\n    -D /backup/base -Ft -Xs -P -v\n\n# WAL archiving (postgresql.conf)\narchive_mode = on\narchive_command = 'aws s3 cp %p s3://my-wal-archive/%f'\n\n# Recovery (recovery.conf / postgresql.conf in PG12+)\nrestore_command = 'aws s3 cp s3://my-wal-archive/%f %p'\nrecovery_target_time = '2024-03-15 14:30:00'\nrecovery_target_action = 'promote'\n<\/code><\/pre>\n<hr />\n","text":"## Chapter 5.3 – WAL: Write-Ahead Log\n\n### Architecture\n\n```\nWrite Operation\n    ↓\n1. WAL record written to WAL buffer\n2. WAL flushed to disk (fsync on commit)\n3. Data page modified in shared buffers\n4. Eventually flushed to disk\n```\n\nWAL provides:\n- **Durability** — If the system crashes afte
