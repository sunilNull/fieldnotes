y. Just English thoughts as-is.\n\nExamples of what to write:\n- What you're planning to work on today\n- Something that annoyed you yesterday\n- An opinion about something you read\n- What you ate for breakfast and what you think about it\n\nThe goal is NOT good English. The goal is *fast* English. You are training speed, not correctness.\n\n**Bad habit to avoid:** Stopping to find the perfect word. Write the approximate word and keep going. \"The thing that connects the database\" is fine. Speed matters more than precision in Week 1.\n\n---\n\n### Day 1: Your Baseline Recording\n\nRecord yourself for 3 minutes answering this question out loud in English:\n\n*\"Tell me about yourself and what you work on as a software engineer.\"*\n\nDon't prepare. Just speak. Save this recording. You will compare it to your Day 90 recording. Most people are shocked at the difference.\n\nObserve (don't judge):\n- How many times did you pause mid-sentence to search for a word?\n- Did you restart sentences?\n- Did your sentences get shorter when you were unsure?\n- Where did you sound most natural?\n\n---\n\n### Day 2: Pronunciation — The 8 Sounds Hindi Doesn't Have\n\nHindi engineers struggle most with these English sounds. Practice each one for 2 minutes:\n\n**Sound 1: \"th\" (as in \"the\", \"this\", \"that\", \"think\")**\n- This sound doesn't exist in Hindi. Most engineers say \"d\" instead.\n- How to make it: tongue tip touches back of upper teeth, air flows around it\n- Practice: *the, this, that, them, those, think, thought, through, three, throw*\n- Sentence: \"The distributed system handles thousands of threads.\"\n\n**Sound 2: \"w\" vs \"v\"**\n- Hindi has \"v\", not \"w\". Many engineers say \"we are vorking\" instead of \"we are working.\"\n- \"w\" is made with rounded lips pushed forward, no teeth contact\n- Practice: *work, write, wait, want, when, where, which, while, why, web*\n- Sentence: \"We will write a wrapper around the web service.\"\n\n**Sound 3: \"v\" (true v sound)**\n- English \"v\" requires upper teeth touching lower lip\n- Practice: *value, valid, version, verbose, variable, virtual, volume, validate*\n- Sentence: \"Validate the value before storing the variable.\"\n\n**Sound 4: Short vowels — \"bit\" vs \"beat\", \"set\" vs \"seat\"**\n- English has many more vowel sounds than Hindi\n- Practice pairs: *bit/beat, set/seat, full/fool, pull/pool, cut/coot*\n\n**Sound 5: Final consonants**\n- Hindi words rarely end in consonants. English relies heavily on them.\n- Practice NOT dropping: *implement, deployment, request, constraint, abstract*\n- Bad: \"implemen\" → Good: \"implement\" (crisp 't' at end)\n\n**Sound 6: Stress patterns**\n- English stresses specific syllables. Wrong stress sounds foreign even with correct words.\n- Practice: *REcord vs reCORD, PROgress vs proGRESS, DEfault vs deFAULT*\n- Technical: *alGOrithm, DEvelopment, rePOSitory, auTHENtication, conFIGuration*\n\n**Sound 7: Reduced vowels (schwa)**\n- The \"uh\" sound in unstressed syllables: *about, system, problem, function*\n- Say: \"uh-BOUT\", \"SIS-tum\", \"PROB-lum\", \"FUNK-shun\"\n\n**Sound 8: \"-tion\" and \"-sion\" endings**\n- Not \"shee-on\" — it's \"shun\"\n- Practice: *authentication, authorization, configuration, implementation, pagination*\n\n---\n\n### Days 3–7: Shadowing Practice (15 min/day)\n\nShadowing is the fastest way to improve spoken English. You listen to a native/fluent speaker and repeat *exactly* what they say, with the same rhythm, stress, and speed — like an echo.\n\n**How to shadow:**\n\n1. Find a 2–3 minute technical video (YouTube)\n2. Play a sentence. Pause.\n3. Repeat it out loud, trying to match the sound and rhythm exactly.\n4. Play it again. Adjust.\n5. Move to the next sentence.\n\n**Best sources for technical shadowing (bookmark these):**\n\n- **Fireship** (YouTube) — short, fast, very natural technical English: https://youtube.com/@Fireship\n- **TechLead** (YouTube) — conversational engineering career talk\n- **Hussein Nasser** (YouTube) — backend/system design, clear speech\n- **AWS re:Invent talks** — professional technical presentation English\n- **Linus Tech Tips** — fast casual English, good for natural pace\n\n**Shadowing rule:** Don't read the transcript first. Listen, shadow, then check transcript if stuck.\n\n**Days 3–7 shadowing target:** One Fireship video per day. They're 3–8 minutes each. Shadow every sentence.\n\n---\n\n"},{"title":"Week 2 (Days 8–14): Sentence Pattern Library","html":"<h2>Week 2 (Days 8–14): Sentence Pattern Library<\/h2>\n<p>The biggest speaking gap for Hindi engineers is not vocabulary — it's <em>sentence patterns<\/em>. In Hindi, sentence structure is very different (Subject-Object-Verb). In English it's Subject-Verb-Object. After years of thinking in Hindi, English sentence patterns feel unnatural.<\/p>\n<p>This week, you memorize and internalize 40 sentence patterns by using them repeatedly.<\/p>\n<h3>The 40 Patterns You Need<\/h3>\n<p><strong>Group 1: Explaining technical decisions (8 patterns)<\/strong><\/p>\n<pre><code>1. &quot;The reason we chose X is that ___.&quot;\n   → &quot;The reason we chose PostgreSQL is that we needed ACID compliance.&quot;\n\n2. &quot;X works by ___.&quot;\n   → &quot;Connection pooling works by reusing existing database connections.&quot;\n\n3. &quot;The tradeoff here is ___ versus ___.&quot;\n   → &quot;The tradeoff here is consistency versus availability.&quot;\n\n4. &quot;One thing to consider is ___.&quot;\n   → &quot;One thing to consider is the cold start latency with Lambda.&quot;\n\n5. &quot;This approach has the advantage of ___.&quot;\n   → &quot;This approach has the advantage of being horizontally scalable.&quot;\n\n6. &quot;The downside is that ___.&quot;\n   → &quot;The downside is that it adds operational complexity.&quot;\n\n7. &quot;What this means in practice is ___.&quot;\n   → &quot;What this means in practice is that we need a retry mechanism.&quot;\n\n8. &quot;Essentially, what we're doing is ___.&quot;\n   → &quot;Essentially, what we're doing is caching at the application layer.&quot;\n<\/code><\/pre>\n<p><strong>Group 2: Asking and clarifying in meetings (8 patterns)<\/strong><\/p>\n<pre><code>9.  &quot;Could you say a bit more about ___?&quot;\n    → &quot;Could you say a bit more about the expected load?&quot;\n\n10. &quot;Just to clarify — are you saying ___?&quot;\n    → &quot;Just to clarify — are you saying we should migrate this month?&quot;\n\n11. &quot;I want to make sure I understand. So ___?&quot;\n    → &quot;I want to make sure I understand. So the deadline is fixed?&quot;\n\n12. &quot;That's interesting. My concern would be ___.&quot;\n    → &quot;That's interesting. My concern would be the migration window.&quot;\n\n13. &quot;Could you give me an example of ___?&quot;\n    → &quot;Could you give me an example of the failure scenario?&quot;\n\n14. &quot;Before we move on, I had a question about ___.&quot;\n    → &quot;Before we move on, I had a question about the rollback plan.&quot;\n\n15. &quot;I see what you mean. What about ___?&quot;\n    → &quot;I see what you mean. What about the edge cases?&quot;\n\n16. &quot;Let me think about that for a second.&quot;\n    → (Buys you time to formulate your answer — use it freely)\n<\/code><\/pre>\n<p><strong>Group 3: Expressing opinions and disagreement (8 patterns)<\/strong><\/p>\n<pre><code>17. &quot;I think there might be a better approach here.&quot;\n18. &quot;I'm not sure that's the right call, because ___.&quot;\n19. &quot;I'd push back on that slightly — ___.&quot;\n20. &quot;From my experience, ___ tends to cause problems.&quot;\n21. &quot;Have we considered ___?&quot;\n22. &quot;My instinct is ___, but I could be wrong.&quot;\n23. &quot;I see the appeal of that, but ___.&quot;\n24. &quot;I'm aligned on the goal, but not on the approach.&quot;\n<\/code><\/pre>\n<p><strong>Group 4: Standup and status update (8 patterns)<\/strong><\/p>\n<pre><code>25. &quot;Yesterday I worked on ___. Today I'm planning to ___.&quot;\n26. &quot;I'm blocked on ___ — waiting for ___.&quot;\n27. &quot;I finished ___ and it's now in review.&quot;\n28. &quot;I ran into an issue with ___ — I'll take it offline after standup.&quot;\n29. &quot;I'm making good progress on ___ — should be done by ___.&quot;\n30. &quot;I need 10 minutes with ___ today to unblock me on ___.&quot;\n31. &quot;Nothing blocking me — I'll focus on ___ today.&quot;\n32. &quot;I'm wrapping up ___ and then picking up ___ from the backlog.&quot;\n<\/code><\/pre>\n<p><strong>Group 5: Code review comments out loud (8 patterns)<\/strong><\/p>\n<pre><code>33. &quot;My concern with this approach is ___.&quot;\n34. &quot;This looks good. One small suggestion: ___.&quot;\n35. &quot;Have you considered what happens when ___?&quot;\n36. &quot;This would break if ___.&quot;\n37. &quot;I'd refactor this to ___ for readability.&quot;\n38. &quot;Nice solution. I didn't think of doing it this way.&quot;\n39. &quot;This needs a test for the case where ___.&quot;\n40. &quot;Can we add a comment explaining why ___?&quot;\n<\/code><\/pre>\n<h3>How to Practice These<\/h3>\n<p><strong>Method: Fill-in-the-Blank Drilling<\/strong><\/p>\n<p>Every day this week, take 10 patterns and fill them in with something from your actual work. Don't use generic examples — use real things from your codebase, your team, your actual week.<\/p>\n<p>Example:<\/p>\n<ul>\n<li>Pattern: &quot;The reason we chose X is that ___.&quot;<\/li>\n<li>Your version: &quot;The reason we chose Redis for session storage is that it has sub-millisecond latency and supports expiry natively.&quot;<\/li>\n<\/ul>\n<p>Say each sentence out loud 3 times. Once slow, once normal speed, once fast. The goal is that by Day 14, you reach for these patterns automatically.<\/p>\n<hr />\n","text":"## Week 2 (Days 8–14): Sentence Pattern Library\n\nThe biggest speaking gap for Hindi engineers is not vocabulary — it's *sentence patterns*. In Hindi, sentence structure is very different (Subject-Object-Verb). In English it's Subject-Verb-Object. After years of thinking in Hindi, English sentence patterns feel unnatural.\n\nThis week, you memorize and internalize 40 sentence patterns by using them repeatedly.\n\n### The 40 Patterns You Need\n\n**Group 1: Explaining technical decisions (8 patterns)**\n\n```\n1. \"The reason we chose X is that ___.\"\n   → \"The reason we chose PostgreSQL is that we needed ACID compliance.\"\n\n2. \"X works by ___.\"\n   → \"Connection pooling works by reusing existing database connections.\"\n\n3. \"The tradeoff here is ___ versus ___.\"\n   → \"The tradeoff here is consistency versus availability.\"\n\n4. \"One thing to consider is ___.\"\n   → \"One thing to consider is the cold start latency with Lambda.\"\n\n5. \"This approach has the advantage of ___.\"\n   → \"This approach has the advantage of being horizontally scalable.\"\n\n6. \"The downside is that ___.\"\n   → \"The downside is that it adds operational complexity.\"\n\n7. \"What this means in practice is ___.\"\n   → \"What this means in practice is that we need a retry mechanism.\"\n\n8. \"Essentially, what we're doing is ___.\"\n   → \"Essentially, what we're doing is caching at the application layer.\"\n```\n\n**Group 2: Asking and clarifying in meetings (8 patterns)**\n\n```\n9.  \"Could you say a bit more about ___?\"\n    → \"Could you say a bit more about the expected load?\"\n\n10. \"Just to clarify — are you saying ___?\"\n    → \"Just to clarify — are you saying we should migrate this month?\"\n\n11. \"I want to make sure I understand. So ___?\"\n    → \"I want to make sure I understand. So the deadline is fixed?\"\n\n12. \"That's interesting. My concern would be ___.\"\n    → \"That's interesting. My concern would be the migration window.\"\n\n13. \"Could you give me an example of ___?\"\n    → \"Could you give me an example of the failure scenario?\"\n\n14. \"Before we move on, I had a question about ___.\"\n    → \"Before we move on, I had a question about the rollback plan.\"\n\n15. \"I see what you mean. What about ___?\"\n    → \"I see what you mean. What about the edge cases?\"\n\n16. \"Let me think about that for a second.\"\n    → (Buys you time to formulate your answer — use it freely)\n```\n\n**Group 3: Expressing opinions and disagreement (8 patterns)**\n\n```\n17. \"I think there might be a better approach here.\"\n18. \"I'm not sure that's the right call, because ___.\"\n19. \"I'd push back on that slightly — ___.\"\n20. \"From my experience, ___ tends to cause problems.\"\n21. \"Have we considered ___?\"\n22. \"My instinct is ___, but I could be wrong.\"\n23. \"I see the appeal of that, but ___.\"\n24. \"I'm aligned on the goal, but not on the approach.\"\n```\n\n**Group 4: Standup and status update (8 patterns)**\n\n```\n25. \"Yesterday I worked on ___. Today I'm planning to ___.\"\n26. \"I'm blocked on ___ — waiting for ___.\"\n27. \"I finished ___ and it's now in review.\"\n28. \"I ran into an issue with ___ — I'll take it offline after standup.\"\n29. \"I'm making good progress on ___ — should be done by ___.\"\n30. \"I need 10 minutes with ___ today to unblock me on ___.\"\n31. \"Nothing blocking me — I'll focus on ___ today.\"\n32. \"I'm wrapping up ___ and then picking up ___ from the backlog.\"\n```\n\n**Group 5: Code review comments out loud (8 patterns)**\n\n```\n33. \"My concern with this approach is ___.\"\n34. \"This looks good. One small suggestion: ___.\"\n35. \"Have you considered what happens when ___?\"\n36. \"This would break if ___.\"\n37. \"I'd refactor this to ___ for readability.\"\n38. \"Nice solution. I didn't think of doing it this way.\"\n39. \"This needs a test for the case where ___.\"\n40. \"Can we add a comment explaining why ___?\"\n```\n\n### How to Practice These\n\n**Method: Fill-in-the-Blank Drilling**\n\nEvery day this week, take 10 patterns and fill them in with something from your actual work. Don't use generic examples — use real things from your codebase, your team, your actual week.\n\nExample:\n- Pattern: \"The reason we chose X is that ___.\"\n- Your version: \"The reason we chose Redis for session storage is that it has sub-millisecond latency and supports expiry natively.\"\n\nSay each sentence out loud 3 times. Once slow, once normal speed, once fast. The goal is that by Day 14, you reach for these patterns automatically.\n\n---\n\n"},{"title":"Week 3 (Days 15–21): Vocabulary — The Right Words for the Right Moments","html":"<h2>Week 3 (Days 15–21): Vocabulary — The Right Words for the Right Moments<\/h2>\n<p>Most vocabulary lists are useless because they're random. You need words for the <em>specific situations you actually face<\/em>. This week focuses on three vocabulary domains: precision words, transition words, and filler word replacement.<\/p>\n<h3>Precision Words (replace vague Hindi-translation defaults)<\/h3>\n<p>Hindi speakers often default to very general words in English because they don't know the precise English term. Here's the upgrade:<\/p>\n<table>\n<thead>\n<tr>\n  <th>Vague word you use<\/th>\n  <th>Precise words to use instead<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>&quot;problem&quot;<\/td>\n  <td>issue, bug, defect, bottleneck, constraint, failure, incident, regression<\/td>\n<\/tr>\n<tr>\n  <td>&quot;fix&quot;<\/td>\n  <td>resolve, patch, remediate, mitigate, address, refactor, optimize<\/td>\n<\/tr>\n<tr>\n  <td>&quot;make&quot;<\/td>\n  <td>implement, build, generate, provision, configure, initialize, scaffold<\/td>\n<\/tr>\n<tr>\n  <td>&quot;use&quot;<\/td>\n  <td>leverage, adopt, integrate, invoke, instantiate, consume (an API)<\/td>\n<\/tr>\n<tr>\n  <td>&quot;check&quot;<\/td>\n  <td>validate, verify, inspect, audit, assert, observe, monitor<\/td>\n<\/tr>\n<tr>\n  <td>&quot;send&quot;<\/td>\n  <td>emit, publish, dispatch, transmit, propagate, broadcast<\/td>\n<\/tr>\n<tr>\n  <td>&quot;get&quot;<\/td>\n  <td>retrieve, fetch, query, pull, extract, derive, consume<\/td>\n<\/tr>\n<tr>\n  <td>&quot;change&quot;<\/td>\n  <td>update, modify, mutate, transform, migrate, refactor, reconfigure<\/td>\n<\/tr>\n<tr>\n  <td>&quot;good&quot;<\/td>\n  <td>robust, reliable, maintainable, performant, idiomatic, elegant<\/td>\n<\/tr>\n<tr>\n  <td>&quot;bad&quot;<\/td>\n  <td>fragile, error-prone, inefficient, brittle, opaque, tightly coupled<\/td>\n<\/tr>\n<tr>\n  <td>&quot;same&quot;<\/td>\n  <td>identical, equivalent, consistent, uniform, idempotent<\/td>\n<\/tr>\n<tr>\n  <td>&quot;different&quot;<\/td>\n  <td>distinct, divergent, inconsistent, incompatible<\/td>\n<\/tr>\n<tr>\n  <td>&quot;fast&quot;<\/td>\n  <td>low-latency, high-throughput, performant, optimized, efficient<\/td>\n<\/tr>\n<tr>\n  <td>&quot;slow&quot;<\/td>\n  <td>high-latency, bottlenecked, resource-constrained, degraded<\/td>\n<\/tr>\n<tr>\n  <td>&quot;big&quot;<\/td>\n  <td>at scale, high-volume, large-scale, distributed<\/td>\n<\/tr>\n<tr>\n  <td>&quot;show&quot;<\/td>\n  <td>surface, expose, visualize, demonstrate, present, render<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Daily practice:<\/strong> Pick 10 words. Write one sentence using each in a work context. Say each sentence out loud.<\/p>\n<hr />\n<h3>Transition Words (how to connect ideas when speaking)<\/h3>\n<p>One reason Hindi speakers sound choppy in English is missing transition words. These are the connective tissue of fluent speech.<\/p>\n<p><strong>Adding information:<\/strong><\/p>\n<ul>\n<li>&quot;Additionally, ...&quot; / &quot;On top of that, ...&quot; / &quot;What's more, ...&quot;<\/li>\n<li>&quot;Not only that, but ...&quot; / &quot;Beyond that, ...&quot;<\/li>\n<\/ul>\n<p><strong>Contrasting:<\/strong><\/p>\n<ul>\n<li>&quot;However, ...&quot; / &quot;That said, ...&quot; / &quot;On the other hand, ...&quot;<\/li>\n<li>&quot;Even so, ...&quot; / &quot;Despite that, ...&quot;<\/li>\n<\/ul>\n<p><strong>Giving reasons:<\/strong><\/p>\n<ul>\n<li>&quot;This is because ...&quot; / &quot;The reason for this is ...&quot;<\/li>\n<li>&quot;As a result, ...&quot; / &quot;Consequently, ...&quot;<\/li>\n<\/ul>\n<p><strong>Sequencing:<\/strong><\/p>\n<ul>\n<li>&quot;First, ... then ... and finally ...&quot;<\/li>\n<li>&quot;Initially, ... once that's done, ... at that point ...&quot;<\/li>\n<\/ul>\n<p><strong>Summarizing:<\/strong><\/p>\n<ul>\n<li>&quot;In short, ...&quot; / &quot;To put it simply, ...&quot; / &quot;Essentially, ...&quot;<\/li>\n<li>&quot;The key point is ...&quot; / &quot;What this comes down to is ...&quot;<\/li>\n<\/ul>\n<p><strong>Practice:<\/strong> Every time you explain something this week, consciously use one transition word per idea. It will feel forced at first. That's correct — that's how habits form.<\/p>\n<hr />\n<h3>Replace Filler Words<\/h3>\n<p>Every speaker has filler words. Hindi engineers in English commonly use:<\/p>\n<ul>\n<li>&quot;basically&quot; (every other sentence)<\/li>\n<li>&quot;like&quot; (as a pause filler)<\/li>\n<li>&quot;you know&quot; (seeking confirmation)<\/li>\n<li>&quot;actually&quot; (used incorrectly — in Hindi &quot;actually&quot; emphasizes truth, in English it implies surprise/correction)<\/li>\n<li>&quot;only&quot; placed at end of sentence (Hindi grammar pattern: &quot;it is like this only&quot;)<\/li>\n<\/ul>\n<p><strong>Track your fillers this week:<\/strong> Record one 2-minute explanation. Count how many times you say &quot;basically.&quot; Your target by Day 90 is under 3 per 5-minute conversation.<\/p>\n<p><strong>Replace with:<\/strong><\/p>\n<ul>\n<li>Pause (silence is better than &quot;basically&quot;)<\/li>\n<li>&quot;What I mean is...&quot; (buys same time, sounds more professional)<\/li>\n<li>&quot;To be more specific...&quot; (adds precision instead of filling)<\/li>\n<\/ul>\n<hr />\n","text":"## Week 3 (Days 15–21): Vocabulary — The Right Words for the Right Moments\n\nMost vocabulary lists are useless because they're random. You need words for the *specific situations you actually face*. This week focuses on three vocabulary domains: precision words, transition words, and filler word replacement.\n\n### Precision Words (replace vague Hindi-translation defaults)\n\nHindi speakers often default to very general words in English because they don't know the precise English term. Here's the upgrade:\n\n| Vague word you use | Precise words to use instead |\n|---|---|\n| \"problem\" | issue, bug, defect, bottleneck, constraint, failure, incident, regression |\n| \"fix\" | resolve, patch, remediate, mitigate, address, refactor, optimize |\n| \"make\" | implement, build, generate, provision, configure, initialize, scaffold |\n| \"use\" | leverage, adopt, integrate, invoke, instantiate, consume (an API) |\n| \"check\" | validate, verify, inspect, audit, assert, observe, monitor |\n| \"send\" | emit, publish, dispatch, transmit, propagate, broadcast |\n| \"get\" | retrieve, fetch, query, pull, extract, derive, consume |\n| \"change\" | update, modify, mutate, transform, migrate, refactor, reconfigure |\n| \"good\" | robust, reliable, maintainable, performant, idiomatic, elegant |\n| \"bad\" | fragile, error-prone, inefficient, brittle, opaque, tightly coupled |\n| \"same\" | identical, equivalent, consistent, uniform, idempotent |\n| \"different\" | distinct, divergent, inconsistent, incompatible |\n| \"fast\" | low-latency, high-throughput, performant, optimized, efficient |\n| \"slow\" | high-latency, bottlenecked, resource-constrained, degraded |\n| \"big\" | at scale, high-volume, large-scale, distributed |\n| \"show\" | surface, expose, visualize, demonstrate, present, render |\n\n**Daily practice:** Pick 10 words. Write one sentence using each in a work context. Say each sentence out loud.\n\n---\n\n### Transition Words (how to connect ideas when speaking)\n\nOne reason Hindi speakers sound choppy in English is missing transition words. These are the connective tissue of fluent speech.\n\n**Adding information:**\n- \"Additionally, ...\" / \"On top of that, ...\" / \"What's more, ...\"\n- \"Not only that, but ...\" / \"Beyond that, ...\"\n\n**Contrasting:**\n- \"However, ...\" / \"That said, ...\" / \"On the other hand, ...\"\n- \"Even so, ...\" / \"Despite that, ...\"\n\n**Giving reasons:**\n- \"This is because ...\" / \"The reason for this is ...\"\n- \"As a result, ...\" / \"Consequently, ...\"\n\n**Sequencing:**\n- \"First, ... then ... and finally ...\"\n- \"Initially, ... once that's done, ... at that point ...\"\n\n**Summarizing:**\n- \"In short, ...\" / \"To put it simply, ...\" / \"Essentially, ...\"\n- \"The key point is ...\" / \"What this comes down to is ...\"\n\n**Practice:** Every time you explain something this week, consciously use one transition word per idea. It will feel forced at first. That's correct — that's how habits form.\n\n---\n\n### Replace Filler Words\n\nEvery speaker has filler words. Hindi engineers in English commonly use:\n- \"basically\" (every other sentence)\n- \"like\" (as a pause filler)\n- \"you know\" (seeking confirmation)\n- \"actually\" (used incorrectly — in Hindi \"actually\" emphasizes truth, in English it implies surprise/correction)\n- \"only\" placed at end of sentence (Hindi grammar pattern: \"it is like this only\")\n\n**Track your fillers this week:** Record one 2-minute explanation. Count how many times you say \"basically.\" Your target by Day 90 is under 3 per 5-minute conversation.\n\n**Replace with:**\n- Pause (silence is better than \"basically\")\n- \"What I mean is...\" (buys same time, sounds more professional)\n- \"To be more specific...\" (adds precision instead of filling)\n\n---\n\n"},{"title":"Week 4 (Days 22–30): Speaking Under Pressure","html":"<h2>Week 4 (Days 22–30): Speaking Under Pressure<\/h2>\n<p>The hardest part isn't knowing English — it's using it when nervous, in meetings, in interviews. This week trains specifically for pressure situations.<\/p>\n<h3>The 30-Second Answer Drill<\/h3>\n<p>Most workplace questions require a 30-second answer, not a 5-minute one. Engineers who ramble lose credibility. This drill trains concise, structured answers.<\/p>\n<p><strong>Format for technical answers:<\/strong><\/p>\n<pre><code>[Conclusion first — 1 sentence]\n[Reason — 1-2 sentences]\n[Example or evidence — 1 sentence]\n[If needed: caveat or next step — 1 sentence]\n<\/code><\/pre>\n<p><strong>Practice questions — answer each in 30 seconds, timed:<\/strong><\/p>\n<p>Technical:<\/p>\n<ol>\n<li>&quot;Why are you using Redis here instead of just storing this in PostgreSQL?&quot;<\/li>\n<li>&quot;What's the risk of this approach?&quot;<\/li>\n<li>&quot;Can you explain what a connection pool is?&quot;<\/li>\n<li>&quot;What would you do differently if you were starting this from scratch?&quot;<\/li>\n<li>&quot;Why does this API return a 429 sometimes?&quot;<\/li>\n<\/ol>\n<p>Career:\n6. &quot;What are you working on right now?&quot;\n7. &quot;What's been your biggest technical challenge recently?&quot;\n8. &quot;What do you want to do next in your career?&quot;<\/p>\n<p>Record your answers. Play them back. Cut anything that doesn't add information.<\/p>\n<hr />\n<h3>The Pressure Pause Technique<\/h3>\n<p>When you're asked a question and your mind goes blank:<\/p>\n<p>❌ Don't say: &quot;Umm... basically... how to say... actually...&quot;\n✅ Do say: <strong>&quot;Let me think about that for a second.&quot;<\/strong> Then pause for 3 seconds. Then answer.<\/p>\n<p>This sounds completely natural to a native speaker. A 3-second deliberate pause followed by a clear answer signals confidence. A 3-second gap filled with &quot;um basically actually&quot; signals panic.<\/p>\n<p>Memorize this phrase: <strong>&quot;Let me think about that for a second.&quot;<\/strong>\nUse it in every practice session until it becomes your automatic response to any question you're not immediately sure of.<\/p>\n<hr />\n<h3>Week 4 Daily Practice: The Rubber Duck Method (English Version)<\/h3>\n<p>Rubber duck debugging is explaining code to a rubber duck to find bugs. This week, explain something from your actual work out loud, in English, every day. Pick from this list:<\/p>\n<ul>\n<li>Day 22: Explain how the authentication in your current project works<\/li>\n<li>Day 23: Explain a bug you fixed recently — what caused it, how you found it, how you fixed it<\/li>\n<li>Day 24: Explain the architecture of your main service (databases, APIs, external dependencies)<\/li>\n<li>Day 25: Explain why you made a specific technical decision in the last month<\/li>\n<li>Day 26: Explain what you'd change about your current codebase and why<\/li>\n<li>Day 27: Explain what you're currently working on to someone who doesn't know your project<\/li>\n<li>Day 28: Re-do Day 22 — compare it to Day 22. Notice the improvement.<\/li>\n<li>Day 29: Record a 3-minute &quot;engineering update&quot; as if presenting to your manager<\/li>\n<li>Day 30: Record your Day 30 &quot;tell me about yourself&quot; answer and compare to Day 1<\/li>\n<\/ul>\n<hr />\n<h3>Phase 1 Checkpoint (End of Day 30)<\/h3>\n<p>Self-assess on these:<\/p>\n<table>\n<thead>\n<tr>\n  <th>Skill<\/th>\n  <th>Not Yet<\/th>\n  <th>Getting There<\/th>\n  <th>Solid<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Can explain a technical concept without pausing to translate<\/td>\n  <td><\/td>\n  <td><\/td>\n  <td><\/td>\n<\/tr>\n<tr>\n  <td>Standup answers are crisp, under 45 seconds<\/td>\n  <td><\/td>\n  <td><\/td>\n  <td><\/td>\n<\/tr>\n<tr>\n  <td>Using precise technical vocabulary instead of vague words<\/td>\n  <td><\/td>\n  <td><\/td>\n  <td><\/td>\n<\/tr>\n<tr>\n  <td>&quot;Basically&quot; count under 5 per 5-minute conversation<\/td>\n  <td><\/td>\n  <td><\/td>\n  <td><\/td>\n<\/tr>\n<tr>\n  <td>Can use &quot;Let me think about that&quot; confidently<\/td>\n  <td><\/td>\n  <td><\/td>\n  <td><\/td>\n<\/tr>\n<tr>\n  <td>Pronunciation of &quot;th&quot;, &quot;w&quot;, &quot;v&quot; improved<\/td>\n  <td><\/td>\n  <td><\/td>\n  <td><\/td>\n<\/tr>\n<tr>\n  <td>Can connect ideas with transition words<\/td>\n  <td><\/td>\n  <td><\/td>\n  <td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n","text":"## Week 4 (Days 22–30): Speaking Under Pressure\n\nThe hardest part isn't knowing English — it's using it when nervous, in meetings, in interviews. This week trains specifically for pressure situations.\n\n### The 30-Second Answer Drill\n\nMost workplace questions require a 30-second answer, not a 5-minute one. Engineers who ramble lose credibility. This drill trains concise, structured answers.\n\n**Format for technical answers:**\n```\n[Conclusion first — 1 sentence]\n[Reason — 1-2 sentences]\n[Example or evidence — 1 sentence]\n[If needed: caveat or next step — 1 sentence]\n```\n\n**Practice questions — answer each in 30 seconds, timed:**\n\nTechnical:\n1. \"Why are you using Redis here instead of just storing this in PostgreSQL?\"\n2. \"What's the risk of this approach?\"\n3. \"Can you explain what a connection pool is?\"\n4. \"What would you do differently if you were starting this from scratch?\"\n5. \"Why does this API return a 429 sometimes?\"\n\nCareer:\n6. \"What are you working on right now?\"\n7. \"What's been your biggest technical challenge recently?\"\n8. \"What do you want to do next in your career?\"\n\nRecord your answers. Play them back. Cut anything that doesn't add information.\n\n---\n\n### The Pressure Pause Technique\n\nWhen you're asked a question and your mind goes blank:\n\n❌ Don't say: \"Umm... basically... how to say... actually...\"\n✅ Do say: **\"Let me think about that for a second.\"** Then pause for 3 seconds. Then answer.\n\nThis sounds completely natural to a native speaker. A 3-second deliberate pause followed by a clear answer signals confidence. A 3-second gap filled with \"um basically actually\" signals panic.\n\nMemorize this phrase: **\"Let me think about that for a second.\"**\nUse it in every practice session until it becomes your automatic response to any question you're not immediately sure of.\n\n---\n\n### Week 4 Daily Practice: The Rubber Duck Method (English Version)\n\nRubber duck debugging is explaining code to a rubber duck to find bugs. This week, explain something from your actual work out loud, in English, every day. Pick from this list:\n\n- Day 22: Explain how the authentication in your current project works\n- Day 23: Explain a bug you fixed recently — what caused it, how you found it, how you fixed it\n- Day 24: Explain the architecture of your main service (databases, APIs, external dependencies)\n- Day 25: Explain why you made a specific technical decision in the last month\n- Day 26: Explain what you'd change about your current codebase and why\n- Day 27: Explain what you're currently working on to someone who doesn't know your project\n- Day 28: Re-do Day 22 — compare it to Day 22. Notice the improvement.\n- Day 29: Record a 3-minute \"engineering update\" as if presenting to your manager\n- Day 30: Record your Day 30 \"tell me about yourself\" answer and compare to Day 1\n\n---\n\n### Phase 1 Checkpoint (End of Day 30)\n\nSelf-assess on these:\n\n| Skill | Not Yet | Getting There | Solid |\n|---|---|---|---|\n| Can explain a technical concept without pausing to translate | | | |\n| Standup answers are crisp, under 45 seconds | | | |\n| Using precise technical vocabulary instead of vague words | | | |\n| \"Basically\" count under 5 per 5-minute conversation | | | |\n| Can use \"Let me think about that\" confidently | | | |\n| Pronunciation of \"th\", \"w\", \"v\" improved | | | |\n| Can connect ideas with transition words | | | |\n\n---\n\n"},{"title":"PHASE 2: TECHNICAL VOICE (Days 31–60)","html":"<h1>PHASE 2: TECHNICAL VOICE (Days 31–60)<\/h1>\n<h2><em>Sound Credible at Work<\/em><\/h2>\n<h3>What This Phase Builds<\/h3>\n<p>You can now speak English more automatically. This phase makes you sound like a <em>senior engineer<\/em> in English, not just a competent speaker. Specifically:<\/p>\n<ul>\n<li>Explaining architecture decisions with confidence<\/li>\n<li>Code review discussions<\/li>\n<li>Technical debates with peers<\/li>\n<li>Writing and speaking about systems (for RFC/ADR work)<\/li>\n<li>Running/participating in technical interviews (practice rounds)<\/li>\n<\/ul>\n<hr />\n","text":"# PHASE 2: TECHNICAL VOICE (Days 31–60)\n## *Sound Credible at Work*\n\n### What This Phase Builds\n\nYou can now speak English more automatically. This phase makes you sound like a *senior engineer* in English, not just a competent speaker. Specifically:\n- Explaining architecture decisions with confidence\n- Code review discussions\n- Technical debates with peers\n- Writing and speaking about systems (for RFC/ADR work)\n- Running/participating in technical interviews (practice rounds)\n\n---\n\n"},{"title":"Week 5 (Days 31–37): Architecture Vocabulary and Explanation Patterns","html":"<h2>Week 5 (Days 31–37): Architecture Vocabulary and Explanation Patterns<\/h2>\n<h3>The Technical Vocabulary Domains You Need<\/h3>\n<p>A Staff-level engineer needs vocabulary across 8 technical domains. Gaps in any domain will show in interviews and design discussions.<\/p>\n<p><strong>Domain 1: Data and Storage<\/strong><\/p>\n<pre><code>Tier 1 (must know cold):\n  durability, consistency, atomicity, isolation, transaction, ACID, BASE\n  replication, sharding, partitioning, indexing, query planner\n  cache invalidation, cache eviction, write-through, write-back, read-through\n  hot path, cold path, write amplification, read amplification\n\nTier 2 (should know):\n  compaction, tombstone, LSM tree, B-tree, bloom filter\n  WAL (write-ahead log), MVCC (multi-version concurrency control)\n  connection pooling, backpressure, slow query, explain plan\n\nPractice sentence:\n&quot;The hot path uses Redis as a write-through cache in front of PostgreSQL,\nwith cache invalidation triggered on write. Cold path queries go directly\nto the read replica.&quot;\n<\/code><\/pre>\n<p><strong>Domain 2: System Reliability<\/strong><\/p>\n<pre><code>Tier 1:\n  latency, throughput, availability, reliability, fault tolerance\n  SLA, SLO, SLI, error budget, uptime, downtime\n  retry, timeout, circuit breaker, fallback, graceful degradation\n  incident, outage, postmortem, MTTR, MTBF, RTO, RPO\n\nTier 2:\n  chaos engineering, load shedding, bulkhead pattern\n  canary deployment, blue-green deployment, feature flag\n  runbook, playbook, alert, threshold, pager duty\n\nPractice sentence:\n&quot;Our SLO is 99.9% availability. We currently have a 43-minute error budget\nremaining this month. The circuit breaker is set to open after 5 consecutive\nfailures with a 30-second cooldown.&quot;\n<\/code><\/pre>\n<p><strong>Domain 3: APIs and Services<\/strong><\/p>\n<pre><code>Tier 1:\n  endpoint, payload, request, response, status code, header\n  REST, gRPC, GraphQL, WebSocket, polling, webhook\n  authentication, authorization, token, session, OAuth\n  rate limiting, pagination, versioning, deprecation\n\nTier 2:\n  idempotency, eventual consistency, at-most-once, at-least-once, exactly-once\n  content negotiation, HATEOAS, OpenAPI spec, contract testing\n  service mesh, sidecar, ingress, egress\n\nPractice sentence:\n&quot;The API is idempotent — clients can safely retry on network failure.\nWe use an idempotency key in the header, and the server deduplicates\nwithin a 24-hour window.&quot;\n<\/code><\/pre>\n<p><strong>Domain 4: Infrastructure and Deployment<\/strong><\/p>\n<pre><code>Tier 1:\n  container, image, pod, node, cluster, deployment, service\n  load balancer, reverse proxy, DNS, CDN, region, availability zone\n  autoscaling, rolling update, rollback, health check\n  environment variable, secret, config map\n\nTier 2:\n  Infrastructure as Code, immutable infrastructure\n  namespace, resource quota, node affinity, taint, toleration\n  horizontal pod autoscaler, vertical pod autoscaler, cluster autoscaler\n  ingress controller, service mesh\n\nPractice sentence:\n&quot;The deployment uses a rolling update strategy with a health check timeout\nof 30 seconds. If more than 2 pods fail their readiness probe, the rollout\npauses automatically.&quot;\n<\/code><\/pre>\n<p><strong>Domain 5: Observability<\/strong><\/p>\n<pre><code>Tier 1:\n  metric, log, trace, span, alert, dashboard\n  latency percentile (p50, p95, p99), error rate, throughput\n  structured logging, log level, correlation ID\n\nTier 2:\n  OpenTelemetry, distributed tracing, sampling, cardinality\n  anomaly detection, baseline, spike, saturation\n\nPractice sentence:\n&quot;We're seeing p99 latency spike to 2 seconds. The traces show the bottleneck\nis in the database query — specifically the missing index on the created_at column.&quot;\n<\/code><\/pre>\n<hr />\n<h2>Week 5 Practice: Daily Vocabulary Drills<\/h2>\n<p>Each day this week, pick one domain. For 15 minutes:<\/p>\n<ol>\n<li>Read each Tier 1 word in the domain<\/li>\n<li>Write a sentence using it in context of your actual work<\/li>\n<li>Say the sentence out loud<\/li>\n<li>Explain what the word means in one sentence, as if to a junior engineer<\/li>\n<\/ol>\n<hr />\n","text":"## Week 5 (Days 31–37): Architecture Vocabulary and Explanation Patterns\n\n### The Technical Vocabulary Domains You Need\n\nA Staff-level engineer needs vocabulary across 8 technical domains. Gaps in any domain will show in interviews and design discussions.\n\n**Domain 1: Data and Storage**\n```\nTier 1 (must know cold):\n  durability, consistency, atomicity, isolation, transaction, ACID, BASE\n  replication, sharding, partitioning, indexing, query planner\n  cache invalidation, cache eviction, write-through, write-back, read-through\n  hot path, cold path, write amplification, read amplification\n\nTier 2 (should know):\n  compaction, tombstone, LSM tree, B-tree, bloom filter\n  WAL (write-ahead log), MVCC (multi-version concurrency control)\n  connection pooling, backpressure, slow query, explain plan\n\nPractice sentence:\n\"The hot path uses Redis as a write-through cache in front of PostgreSQL,\nwith cache invalidation triggered on write. Cold path queries go directly\nto the read replica.\"\n```\n\n**Domain 2: System Reliability**\n```\nTier 1:\n  latency, throughput, availability, reliability, fault tolerance\n  SLA, SLO, SLI, error budget, uptime, downtime\n  retry, timeout, circuit breaker, fallback, graceful degradation\n  incident, outage, postmortem, MTTR, MTBF, RTO, RPO\n\nTier 2:\n  chaos engineering, load shedding, bulkhead pattern\n  canary deployment, blue-green deployment, feature flag\n  runbook, playbook, alert, threshold, pager duty\n\nPractice sentence:\n\"Our SLO is 99.9% availability. We currently have a 43-minute error budget\nremaining this month. The circuit breaker is set to open after 5 consecutive\nfailures with a 30-second cooldown.\"\n```\n\n**Domain 3: APIs and Services**\n```\nTier 1:\n  endpoint, payload, request, response, status code, header\n  REST, gRPC, GraphQL, WebSocket, polling, webhook\n  authentication, authorization, token, session, OAuth\n  rate limiting, pagination, versioning, deprecation\n\nTier 2:\n  idempotency, eventual consistency, at-most-once, at-least-once, exactly-once\n  content negotiation, HATEOAS, OpenAPI spec, contract testing\n  service mesh, sidecar, ingress, egress\n\nPractice sentence:\n\"The API is idempotent — clients can safely retry on network failure.\nWe use an idempotency key in the header, and the server deduplicates\nwithin a 24-hour window.\"\n```\n\n**Domain 4: Infrastructure and Deployment**\n```\nTier 1:\n  container, image, pod, node, cluster, deployment, service\n  load balancer, reverse proxy, DNS, CDN, region, availability zone\n  autoscaling, rolling update, rollback, health check\n  environment variable, secret, config map\n\nTier 2:\n  Infrastructure as Code, immutable infrastructure\n  namespace, resource quota, node affinity, taint, toleration\n  horizontal pod autoscaler, vertical pod autoscaler, cluster autoscaler\n  ingress controller, service mesh\n\nPractice sentence:\n\"The deployment uses a rolling update strategy with a health check timeout\nof 30 seconds. If more than 2 pods fail their readiness probe, the rollout\npauses automatically.\"\n```\n\n**Domain 5: Observability**\n```\nTier 1:\n  metric, log, trace, span, alert, dashboard\n  latency percentile (p50, p95, p99), error rate, throughput\n  structured logging, log level, correlation ID\n\nTier 2:\n  OpenTelemetry, distributed tracing, sampling, cardinality\n  anomaly detection, baseline, spike, saturation\n\nPractice sentence:\n\"We're seeing p99 latency spike to 2 seconds. The traces show the bottleneck\nis in the database query — specifically the missing index on the created_at column.\"\n```\n\n---\n\n## Week 5 Practice: Daily Vocabulary Drills\n\nEach day this week, pick one domain. For 15 minutes:\n1. Read each Tier 1 word in the domain\n2. Write a sentence using it in context of your actual work\n3. Say the sentence out loud\n4. Explain what the word means in one sentence, as if to a junior engineer\n\n---\n\n"},{"title":"Week 6 (Days 38–44): Code Review English","html":"<h2>Week 6 (Days 38–44): Code Review English<\/h2>\n<p>Code reviews are where a lot of technical communication happens — and where Hindi engineers often sound either too blunt or too vague. This week you build the exact language for code review.<\/p>\n<h3>The Code Review Language Spectrum<\/h3>\n<p>Code review comments exist on a spectrum from suggestion to blocker. Use the right register:<\/p>\n<p><strong>Thinking out loud / non-blocking:<\/strong><\/p>\n<pre><code>&quot;Nit: ...&quot; (minor style/preference, take it or leave it)\n&quot;Optional: you could also do this as ...&quot;\n&quot;Just wondering — is there a reason you chose X over Y?&quot;\n&quot;This works. Alternatively, ...&quot;\n&quot;Out of curiosity, how does this handle ...&quot;\n<\/code><\/pre>\n<p><strong>Suggestion (take it seriously):<\/strong><\/p>\n<pre><code>&quot;I'd suggest extracting this into a separate function.&quot;\n&quot;Consider adding error handling for the case where ...&quot;\n&quot;This might be clearer if ...&quot;\n&quot;I'd recommend adding a docstring here because ...&quot;\n&quot;Worth adding a test for the edge case where ...&quot;\n<\/code><\/pre>\n<p><strong>Concern (important, needs discussion):<\/strong><\/p>\n<pre><code>&quot;I have a concern about this approach — if X happens, we'd ...&quot;\n&quot;This could cause a race condition when ...&quot;\n&quot;I'm not sure this handles the case where ...&quot;\n&quot;This will break if the input is ...&quot;\n&quot;My worry here is that ...&quot;\n<\/code><\/pre>\n<p><strong>Blocker (must be resolved):<\/strong><\/p>\n<pre><code>&quot;This needs to be addressed before merge — ...&quot;\n&quot;Blocking: this has a security vulnerability because ...&quot;\n&quot;Can't approve until we have a test for ...&quot;\n&quot;This changes the API contract — needs a migration plan.&quot;\n<\/code><\/pre>\n<p><strong>Positive feedback (use this more than you think you should):<\/strong><\/p>\n<pre><code>&quot;Nice approach — I hadn't thought of doing it this way.&quot;\n&quot;Clean implementation. Good use of ...&quot;\n&quot;This is much more readable than the previous version.&quot;\n&quot;Clever use of X here.&quot;\n&quot;This is the right call.&quot;\n<\/code><\/pre>\n<h3>Code Review Practice (Days 38–44)<\/h3>\n<p>Every day this week:<\/p>\n<ol>\n<li>Open a real PR (yours, a teammate's, or an open-source project)<\/li>\n<li>Write 5 review comments in English using the patterns above<\/li>\n<li>Say each comment out loud as if you're on a call with the author<\/li>\n<li>Read your comments — do they sound specific and constructive?<\/li>\n<\/ol>\n<p>You are not trying to post better code reviews. You are training the language.<\/p>\n<hr />\n","text":"## Week 6 (Days 38–44): Code Review English\n\nCode reviews are where a lot of technical communication happens — and where Hindi engineers often sound either too blunt or too vague. This week you build the exact language for code review.\n\n### The Code Review Language Spectrum\n\nCode review comments exist on a spectrum from suggestion to blocker. Use the right register:\n\n**Thinking out loud / non-blocking:**\n```\n\"Nit: ...\" (minor style/preference, take it or leave it)\n\"Optional: you could also do this as ...\"\n\"Just wondering — is there a reason you chose X over Y?\"\n\"This works. Alternatively, ...\"\n\"Out of curiosity, how does this handle ...\"\n```\n\n**Suggestion (take it seriously):**\n```\n\"I'd suggest extracting this into a separate function.\"\n\"Consider adding error handling for the case where ...\"\n\"This might be clearer if ...\"\n\"I'd recommend adding a docstring here because ...\"\n\"Worth adding a test for the edge case where ...\"\n```\n\n**Concern (important, needs discussion):**\n```\n\"I have a concern about this approach — if X happens, we'd ...\"\n\"This could cause a race condition when ...\"\n\"I'm not sure this handles the case where ...\"\n\"This will break if the input is ...\"\n\"My worry here is that ...\"\n```\n\n**Blocker (must be resolved):**\n```\n\"This needs to be addressed before merge — ...\"\n\"Blocking: this has a security vulnerability because ...\"\n\"Can't approve until we have a test for ...\"\n\"This changes the API contract — needs a migration plan.\"\n```\n\n**Positive feedback (use this more than you think you should):**\n```\n\"Nice approach — I hadn't thought of doing it this way.\"\n\"Clean implementation. Good use of ...\"\n\"This is much more readable than the previous version.\"\n\"Clever use of X here.\"\n\"This is the right call.\"\n```\n\n### Code Review Practice (Days 38–44)\n\nEvery day this week:\n1. Open a real PR (yours, a teammate's, or an open-source project)\n2. Write 5 review comments in English using the patterns above\n3. Say each comment out loud as if you're on a call with the author\n4. Read your comments — do they sound specific and constructive?\n\nYou are not trying to post better code reviews. You are training the language.\n\n---\n\n"},{"title":"Week 7 (Days 45–51): Explaining Systems Out Loud","html":"<h2>Week 7 (Days 45–51): Explaining Systems Out Loud<\/h2>\n<p>This week focuses on system design explanation — the skill tested in every Staff Engineer interview and every architecture meeting.<\/p>\n<h3>The PEDALS Framework for Explaining Systems<\/h3>\n<p>When someone says &quot;walk me through your system&quot; or &quot;how does X work&quot;, use this structure:<\/p>\n<pre><code>P — Problem: &quot;The problem we're solving is...&quot;\nE — Estimate: &quot;At our scale, we're handling roughly...&quot;\nD — Design: &quot;The high-level design is...&quot;\nA — APIs: &quot;The main interfaces are...&quot;\nL — Layout (Data): &quot;For storage, we use... because...&quot;\nS — Scaling: &quot;As load increases, we handle it by...&quot;\n<\/code><\/pre>\n<h3>Practice Systems (pick 2 per day, Days 45–51)<\/h3>\n<p>For each system, explain it out loud for 3 minutes using the PEDALS framework. Your system should be real — from your own experience is even better.<\/p>\n<ol>\n<li>Your current main service / backend system<\/li>\n<li>How authentication works in your project (Keycloak / OAuth flow)<\/li>\n<li>How a Redis cache sits in front of your database<\/li>\n<li>How you'd design a URL shortener<\/li>\n<li>How a message queue (Kafka/RabbitMQ) fits into a backend system<\/li>\n<li>How Docker containers work and why they matter<\/li>\n<li>How database replication works<\/li>\n<li>How an API gateway works<\/li>\n<li>How you'd design a simple rate limiter<\/li>\n<li>How PostgreSQL stores and retrieves data<\/li>\n<\/ol>\n<p><strong>The recording rule:<\/strong> Record yourself at least 3 times this week. Play back and notice:<\/p>\n<ul>\n<li>Did you use PEDALS naturally?<\/li>\n<li>Did your sentences stay complete or did they trail off?<\/li>\n<li>Were there moments of confidence? What were you talking about?<\/li>\n<li>Where did you struggle? Practice those sections.<\/li>\n<\/ul>\n<hr />\n","text":"## Week 7 (Days 45–51): Explaining Systems Out Loud\n\nThis week focuses on system design explanation — the skill tested in every Staff Engineer interview and every architecture meeting.\n\n### The PEDALS Framework for Explaining Systems\n\nWhen someone says \"walk me through your system\" or \"how does X work\", use this structure:\n\n```\nP — Problem: \"The problem we're solving is...\"\nE — Estimate: \"At our scale, we're handling roughly...\"\nD — Design: \"The high-level design is...\"\nA — APIs: \"The main interfaces are...\"\nL — Layout (Data): \"For storage, we use... because...\"\nS — Scaling: \"As load increases, we handle it by...\"\n```\n\n### Practice Systems (pick 2 per day, Days 45–51)\n\nFor each system, explain it out loud for 3 minutes using the PEDALS framework. Your system should be real — from your own experience is even better.\n\n1. Your current main service / backend system\n2. How authentication works in your project (Keycloak / OAuth flow)\n3. How a Redis cache sits in front of your database\n4. How you'd design a URL shortener\n5. How a message queue (Kafka/RabbitMQ) fits into a backend system\n6. How Docker containers work and why they matter\n7. How database replication works\n8. How an API gateway works\n9. How you'd design a simple rate limiter\n10. How PostgreSQL stores and retrieves data\n\n**The recording rule:** Record yourself at least 3 times this week. Play back and notice:\n- Did you use PEDALS naturally?\n- Did your sentences stay complete or did they trail off?\n- Were there moments of confidence? What were you talking about?\n- Where did you struggle? Practice those sections.\n\n---\n\n"},{"title":"Week 8 (Days 52–60): Mock Technical Discussions","html":"<h2>Week 8 (Days 52–60): Mock Technical Discussions<\/h2>\n<p>This week you simulate real work conversations in English.<\/p>\n<h3>Simulate 1: The Standup<\/h3>\n<p>Write your standup update every day this week before the actual standup. Write it in English. Then say it out loud, naturally, as if you're in the meeting.<\/p>\n<p>Template:<\/p>\n<pre><code>&quot;Yesterday, I [specific thing you did].\nToday, I'm planning to [specific thing].\n[Optional: I have a question about X / I'm blocked on Y.]&quot;\n<\/code><\/pre>\n<p>Time yourself. Target: under 45 seconds.<\/p>\n<hr />\n<h3>Simulate 2: The Technical Debate<\/h3>\n<p>Find a technical decision that has two reasonable options (e.g., &quot;should we use Redis or Memcached?&quot;, &quot;should this be async or sync?&quot;). Argue both sides, out loud, in English, for 2 minutes each.<\/p>\n<p>This trains you to:<\/p>\n<ul>\n<li>Express a position clearly: &quot;My preference is X because...&quot;<\/li>\n<li>Acknowledge the other side: &quot;I understand the appeal of Y...&quot;<\/li>\n<li>Defend under challenge: &quot;Even so, the reason I'd stick with X is...&quot;<\/li>\n<\/ul>\n<hr />\n<h3>Simulate 3: The Unexpected Question<\/h3>\n<p>Have someone (or a timer) ask you technical questions you don't expect. Your job is to answer in English, even if partial.<\/p>\n<p>If alone: use this list. Set a timer for 30 seconds. When it beeps, pick a random question, answer it out loud for 60 seconds.<\/p>\n<p>Questions:<\/p>\n<ol>\n<li>&quot;What's the difference between a process and a thread?&quot;<\/li>\n<li>&quot;How would you debug a memory leak in Python?&quot;<\/li>\n<li>&quot;What's your approach to database migrations?&quot;<\/li>\n<li>&quot;What's the most complex system you've built?&quot;<\/li>\n<li>&quot;Explain eventual consistency to me.&quot;<\/li>\n<li>&quot;What are the tradeoffs between microservices and monolith?&quot;<\/li>\n<li>&quot;How would you make a slow API endpoint faster?&quot;<\/li>\n<li>&quot;What's your approach to error handling in async Python?&quot;<\/li>\n<li>&quot;What does 'idempotent' mean and why does it matter?&quot;<\/li>\n<li>&quot;Walk me through how you'd design a logging system.&quot;<\/li>\n<\/ol>\n<hr />\n<h3>Phase 2 Checkpoint (End of Day 60)<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Skill<\/th>\n  <th>Not Yet<\/th>\n  <th>Getting There<\/th>\n  <th>Solid<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Can explain any of my systems for 3 minutes without pausing<\/td>\n  <td><\/td>\n  <td><\/td>\n  <td><\/td>\n<\/tr>\n<tr>\n  <td>Code review comments are specific and appropriately toned<\/td>\n  <td><\/td>\n  <td><\/td>\n  <td><\/td>\n<\/tr>\n<tr>\n  <td>Use precise technical vocabulary naturally<\/td>\n  <td><\/td>\n  <td><\/td>\n  <td><\/td>\n<\/tr>\n<tr>\n  <td>Standup update is under 45 seconds and clear<\/td>\n  <td><\/td>\n  <td><\/td>\n  <td><\/td>\n<\/tr>\n<tr>\n  <td>Can argue both sides of a technical decision<\/td>\n  <td><\/td>\n  <td><\/td>\n  <td><\/td>\n<\/tr>\n<tr>\n  <td>PEDALS framework flows naturally<\/td>\n  <td><\/td>\n  <td><\/td>\n  <td><\/td>\n<\/tr>\n<tr>\n  <td>Unexpected questions don't cause full freeze<\/td>\n  <td><\/td>\n  <td><\/td>\n  <td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n","text":"## Week 8 (Days 52–60): Mock Technical Discussions\n\nThis week you simulate real work conversations in English.\n\n### Simulate 1: The Standup\n\nWrite your standup update every day this week before the actual standup. Write it in English. Then say it out loud, naturally, as if you're in the meeting.\n\nTemplate:\n```\n\"Yesterday, I [specific thing you did].\nToday, I'm planning to [specific thing].\n[Optional: I have a question about X / I'm blocked on Y.]\"\n```\n\nTime yourself. Target: under 45 seconds.\n\n---\n\n### Simulate 2: The Technical Debate\n\nFind a technical decision that has two reasonable options (e.g., \"should we use Redis or Memcached?\", \"should this be async or sync?\"). Argue both sides, out loud, in English, for 2 minutes each.\n\nThis trains you to:\n- Express a position clearly: \"My preference is X because...\"\n- Acknowledge the other side: \"I understand the appeal of Y...\"\n- Defend under challenge: \"Even so, the reason I'd stick with X is...\"\n\n---\n\n### Simulate 3: The Unexpected Question\n\nHave someone (or a timer) ask you technical questions you don't expect. Your job is to answer in English, even if partial.\n\nIf alone: use this list. Set a timer for 30 seconds. When it beeps, pick a random question, answer it out loud for 60 seconds.\n\nQuestions:\n1. \"What's the difference between a process and a thread?\"\n2. \"How would you debug a memory leak in Python?\"\n3. \"What's your approach to database migrations?\"\n4. \"What's the most complex system you've built?\"\n5. \"Explain eventual consistency to me.\"\n6. \"What are the tradeoffs between microservices and monolith?\"\n7. \"How would you make a slow API endpoint faster?\"\n8. \"What's your approach to error handling in async Python?\"\n9. \"What does 'idempotent' mean and why does it matter?\"\n10. \"Walk me through how you'd design a logging system.\"\n\n---\n\n### Phase 2 Checkpoint (End of Day 60)\n\n| Skill | Not Yet | Getting There | Solid |\n|---|---|---|---|\n| Can explain any of my systems for 3 minutes without pausing | | | |\n| Code review comments are specific and appropriately toned | | | |\n| Use precise technical vocabulary naturally | | | |\n| Standup update is under 45 seconds and clear | | | |\n| Can argue both sides of a technical decision | | | |\n| PEDALS framework flows naturally | | | |\n| Unexpected questions don't cause full freeze | | | |\n\n---\n\n"},{"title":"PHASE 3: CAREER VOICE (Days 61–90)","html":"<h1>PHASE 3: CAREER VOICE (Days 61–90)<\/h1>\n<h2><em>Get the Offer. Get the Promotion.<\/em><\/h2>\n<h3>What This Phase Builds<\/h3>\n<p>This phase prepares you for the highest-stakes English situations:<\/p>\n<ul>\n<li><strong>Technical interviews<\/strong> at Tier 1/2 companies (in English)<\/li>\n<li><strong>Stakeholder and executive communication<\/strong> (explaining decisions upward)<\/li>\n<li><strong>Public technical presence<\/strong> (internal talks, blog posts, community)<\/li>\n<li><strong>Salary negotiation<\/strong><\/li>\n<\/ul>\n<hr />\n","text":"# PHASE 3: CAREER VOICE (Days 61–90)\n## *Get the Offer. Get the Promotion.*\n\n### What This Phase Builds\n\nThis phase prepares you for the highest-stakes English situations:\n- **Technical interviews** at Tier 1/2 companies (in English)\n- **Stakeholder and executive communication** (explaining decisions upward)\n- **Public technical presence** (internal talks, blog posts, community)\n- **Salary negotiation**\n\n---\n\n"},{"title":"Week 9 (Days 61–67): Interview English","html":"<h2>Week 9 (Days 61–67): Interview English<\/h2>\n<p>Technical interviews have a specific language register. Companies are partly evaluating communication, not just technical knowledge. This week you learn the interview voice.<\/p>\n<h3>The Interview Communication Model<\/h3>\n<p>There are 4 things interviewers are assessing:<\/p>\n<ol>\n<li><strong>Clarity<\/strong> — do you explain your thinking, or just code?<\/li>\n<li><strong>Structure<\/strong> — do you approach problems systematically?<\/li>\n<li><strong>Collaboration<\/strong> — do you engage with hints and feedback?<\/li>\n<li><strong>Vocabulary<\/strong> — do you use the right terms?<\/li>\n<\/ol>\n<p>Each one requires specific language habits.<\/p>\n<hr />\n<h3>Clarity: Think Out Loud<\/h3>\n<p>The cardinal rule of technical interviews: <strong>never go silent<\/strong>.<\/p>\n<p>Every thought you have, say it. Even uncertain thoughts.<\/p>\n<p>❌ Wrong (silent → solution):\n<em>[2 minutes of silence] &quot;Okay, here's my code.&quot;<\/em><\/p>\n<p>✅ Right (thinking out loud):\n<em>&quot;Let me think about this... so the input is an array of integers. First thought is brute force — for every element, check all pairs. That's O(n²). Can we do better? If I sort first... no wait, that changes indices. What if I use a hash map? I could store what I've seen so far and look up the complement. That's O(n) time, O(n) space. Let me try that.&quot;<\/em><\/p>\n<p><strong>Practice:<\/strong> Solve 1 LeetCode problem per day this week. Say every single thought out loud, start to finish. Record it. Play back: was there any silence? Fill in the gaps.<\/p>\n<hr />\n<h3>Structure: The Problem-Solving Script<\/h3>\n<p>Use this script for every coding problem:<\/p>\n<pre><code>Step 1 — Restate: &quot;So if I understand correctly, we need to...&quot;\nStep 2 — Clarify: &quot;A couple of questions — can input be empty? Can values be negative?&quot;\nStep 3 — Examples: &quot;Let me walk through a simple example...&quot;\nStep 4 — Approach: &quot;My initial thought is [X]. The complexity would be [Y]. \n                    Let me see if there's a better way...&quot;\nStep 5 — Code: &quot;Okay, let me start writing this out...&quot;\n  While coding: narrate. &quot;I'm initializing a hash map here... \n                           iterating over the array... \n                           checking if the complement exists...&quot;\nStep 6 — Review: &quot;Let me trace through with the example to verify...\n                   Edge cases: empty input would... negative values would...&quot;\nStep 7 — Optimize: &quot;This is O(n) time and O(n) space. \n                    Could we reduce space? If we sort first...&quot;\n<\/code><\/pre>\n<p><strong>Practice:<\/strong> For every problem you solve this week, use this script out loud, even for easy problems.<\/p>\n<hr />\n<h3>Vocabulary for Interviews: The Must-Know Phrases<\/h3>\n<p><strong>When you're unsure:<\/strong><\/p>\n<ul>\n<li>&quot;I'm not 100% certain, but my instinct is...&quot;<\/li>\n<li>&quot;Let me think through this more carefully...&quot;<\/li>\n<li>&quot;I want to verify my reasoning before I code this up.&quot;<\/li>\n<li>&quot;I've seen a similar problem before — let me think about whether the same approach applies.&quot;<\/li>\n<\/ul>\n<p><strong>When you're stuck:<\/strong><\/p>\n<ul>\n<li>&quot;I'm going in circles a bit. Could I get a hint on the direction?&quot;<\/li>\n<li>&quot;I have a brute force solution but I feel like there's something more elegant — am I on the right track?&quot;<\/li>\n<li>&quot;Let me try a different angle...&quot;<\/li>\n<\/ul>\n<p><strong>When you make a mistake:<\/strong><\/p>\n<ul>\n<li>&quot;Wait, that's wrong — let me back up.&quot;<\/li>\n<li>&quot;Actually, I see the issue. If [X] happens, this breaks. Let me fix that.&quot;<\/li>\n<li>&quot;Good catch — I missed that edge case.&quot;<\/li>\n<\/ul>\n<p><strong>When you finish:<\/strong><\/p>\n<ul>\n<li>&quot;So this runs in O(n log n) time due to the sort, and O(1) extra space.&quot;<\/li>\n<li>&quot;The main weakness here is [X]. If I had more time, I'd address that by [Y].&quot;<\/li>\n<li>&quot;I'd also want to add error handling for [edge case].&quot;<\/li>\n<\/ul>\n<hr />\n<h3>Behavioral Interview English: The STAR+ Method<\/h3>\n<p>Behavioral questions need structured answers. Use STAR+:<\/p>\n<pre><code>S — Situation (2-3 sentences): Context, who was involved, what the stakes were\nT — Task (1-2 sentences): What specifically you needed to do\nA — Action (3-5 sentences): What you did, step by step, in first person\nR — Result (2-3 sentences): What happened, measurable if possible\n+ — Reflection (1-2 sentences): What you learned or would do differently\n<\/code><\/pre>\n<p><strong>Language tips for STAR:<\/strong><\/p>\n<ul>\n<li>Use &quot;I&quot; not &quot;we&quot; for Actions (they're assessing <em>you<\/em>)<\/li>\n<li>Be specific with numbers: not &quot;faster&quot; but &quot;reduced from 8s to 200ms&quot;<\/li>\n<li>Use past tense for Situation/Task/Action/Result, present tense for Reflection<\/li>\n<li>Avoid jargon in Situation — assume the interviewer doesn't know your company's internal names<\/li>\n<\/ul>\n<p><strong>Practice: The 6 Stories You Must Have Ready<\/strong><\/p>\n<p>Prepare one STAR+ story for each. Practice each one out loud until it flows in under 2 minutes.<\/p>\n<ol>\n<li><strong>Impact story:<\/strong> A technical change you made that had measurable business impact<\/li>\n<li><strong>Conflict story:<\/strong> A technical disagreement with a teammate — how you handled it<\/li>\n<li><strong>Failure story:<\/strong> Something that went wrong and what you learned<\/li>\n<li><strong>Leadership story:<\/strong> A time you led something (project, team, decision) without formal authority<\/li>\n<li><strong>Ambiguity story:<\/strong> A situation where requirements were unclear — how you navigated it<\/li>\n<li><strong>Scale story:<\/strong> The most complex or high-scale system you've worked on<\/li>\n<\/ol>\n<hr />\n","text":"## Week 9 (Days 61–67): Interview English\n\nTechnical interviews have a specific language register. Companies are partly evaluating communication, not just technical knowledge. This week you learn the interview voice.\n\n### The Interview Communication Model\n\nThere are 4 things interviewers are assessing:\n1. **Clarity** — do you explain your thinking, or just code?\n2. **Structure** — do you approach problems systematically?\n3. **Collaboration** — do you engage with hints and feedback?\n4. **Vocabulary** — do you use the right terms?\n\nEach one requires specific language habits.\n\n---\n\n### Clarity: Think Out Loud\n\nThe cardinal rule of technical interviews: **never go silent**.\n\nEvery thought you have, say it. Even uncertain thoughts.\n\n❌ Wrong (silent → solution):\n*[2 minutes of silence] \"Okay, here's my code.\"*\n\n✅ Right (thinking out loud):\n*\"Let me think about this... so the input is an array of integers. First thought is brute force — for every element, check all pairs. That's O(n²). Can we do better? If I sort first... no wait, that changes indices. What if I use a hash map? I could store what I've seen so far and look up the complement. That's O(n) time, O(n) space. Let me try that.\"*\n\n**Practice:** Solve 1 LeetCode problem per day this week. Say every single thought out loud, start to finish. Record it. Play back: was there any silence? Fill in the gaps.\n\n---\n\n### Structure: The Problem-Solving Script\n\nUse this script for every coding problem:\n\n```\nStep 1 — Restate: \"So if I understand correctly, we need to...\"\nStep 2 — Clarify: \"A couple of questions — can input be empty? Can values be negative?\"\nStep 3 — Examples: \"Let me walk through a simple example...\"\nStep 4 — Approach: \"My initial thought is [X]. The complexity would be [Y]. \n                    Let me see if there's a better way...\"\nStep 5 — Code: \"Okay, let me start writing this out...\"\n  While coding: narrate. \"I'm initializing a hash map here... \n                           iterating over the array... \n                           checking if the complement exists...\"\nStep 6 — Review: \"Let me trace through with the example to verify...\n                   Edge cases: empty input would... negative values would...\"\nStep 7 — Optimize: \"This is O(n) time and O(n) space. \n                    Could we reduce space? If we sort first...\"\n```\n\n**Practice:** For every problem you solve this week, use this script out loud, even for easy problems.\n\n---\n\n### Vocabulary for Interviews: The Must-Know Phrases\n\n**When you're unsure:**\n- \"I'm not 100% certain, but my instinct is...\"\n- \"Let me think through this more carefully...\"\n- \"I want to verify my reasoning before I code this up.\"\n- \"I've seen a similar problem before — let me think about whether the same approach applies.\"\n\n**When you're stuck:**\n- \"I'm going in circles a bit. Could I get a hint on the direction?\"\n- \"I have a brute force solution but I feel like there's something more elegant — am I on the right track?\"\n- \"Let me try a different angle...\"\n\n**When you make a mistake:**\n- \"Wait, that's wrong — let me back up.\"\n- \"Actually, I see the issue. If [X] happens, this breaks. Let me fix that.\"\n- \"Good catch — I missed that edge case.\"\n\n**When you finish:**\n- \"So this runs in O(n log n) time due to the sort, and O(1) extra space.\"\n- \"The main weakness here is [X]. If I had more time, I'd address that by [Y].\"\n- \"I'd also want to add error handling for [edge case].\"\n\n---\n\n### Behavioral Interview English: The STAR+ Method\n\nBehavioral questions need structured answers. Use STAR+:\n\n```\nS — Situation (2-3 sentences): Context, who was involved, what the stakes were\nT — Task (1-2 sentences): What specifically you needed to do\nA — Action (3-5 sentences): What you did, step by step, in first person\nR — Result (2-3 sentences): What happened, measurable if possible\n+ — Reflection (1-2 sentences): What you learned or would do differently\n```\n\n**Language tips for STAR:**\n- Use \"I\" not \"we\" for Actions (they're assessing *you*)\n- Be specific with numbers: not \"faster\" but \"reduced from 8s to 200ms\"\n- Use past tense for Situation/Task/Action/Result, present tense for Reflection\n- Avoid jargon in Situation — assume the interviewer doesn't know your company's internal names\n\n**Practice: The 6 Stories You Must Have Ready**\n\nPrepare one STAR+ story for each. Practice each one out loud until it flows in under 2 minutes.\n\n1. **Impact story:** A technical change you made that had measurable business impact\n2. **Conflict story:** A technical disagreement with a teammate — how you handled it\n3. **Failure story:** Something that went wrong and what you learned\n4. **Leadership story:** A time you led something (project, team, decision) without formal authority\n5. **Ambiguity story:** A situation where requirements were unclear — how you navigated it\n6. **Scale story:** The most complex or high-scale system you've worked on\n\n---\n\n"},{"title":"Week 10 (Days 68–74): Stakeholder and Upward Communication","html":"<h2>Week 10 (Days 68–74): Stakeholder and Upward Communication<\/h2>\n<h3>The Audience Map<\/h3>\n<p>At Staff level, you communicate with 4 different audiences, each requiring a different register:<\/p>\n<table>\n<thead>\n<tr>\n  <th>Audience<\/th>\n  <th>What they care about<\/th>\n  <th>Your job<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Junior engineers<\/td>\n  <td>&quot;Is this the right approach? Am I doing this right?&quot;<\/td>\n  <td>Give clarity, not opinion. Be specific.<\/td>\n<\/tr>\n<tr>\n  <td>Peer senior engineers<\/td>\n  <td>&quot;Is this technically sound?&quot;<\/td>\n  <td>Be precise. Show you've thought through tradeoffs.<\/td>\n<\/tr>\n<tr>\n  <td>Engineering manager<\/td>\n  <td>&quot;Will this be done? What's the risk?&quot;<\/td>\n  <td>Be concise. Surface blockers early. Give a clear status.<\/td>\n<\/tr>\n<tr>\n  <td>VP / Director / CTO<\/td>\n  <td>&quot;What's the business impact? What do I need to decide?&quot;<\/td>\n  <td>Lead with conclusion. No technical jargon. Keep it to 3 points.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Translating Up: The Technical-to-Business Translation<\/h3>\n<p>Practice converting technical sentences into business sentences:<\/p>\n<table>\n<thead>\n<tr>\n  <th>Technical<\/th>\n  <th>Business<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>&quot;We're refactoring the authentication module to use OAuth 2.0 with PKCE.&quot;<\/td>\n  <td>&quot;We're upgrading our login security to meet enterprise customer requirements and reduce breach risk.&quot;<\/td>\n<\/tr>\n<tr>\n  <td>&quot;The database is experiencing high read latency due to missing indexes.&quot;<\/td>\n  <td>&quot;Our app is slowing down for users under high load — we have a fix that will take 2 days.&quot;<\/td>\n<\/tr>\n<tr>\n  <td>&quot;We need to migrate from a monolith to microservices.&quot;<\/td>\n  <td>&quot;To scale the team from 4 to 12 engineers without stepping on each other, we need to split the codebase.&quot;<\/td>\n<\/tr>\n<tr>\n  <td>&quot;The p99 latency is 3 seconds during peak traffic.&quot;<\/td>\n  <td>&quot;1 in 100 users waits 3 seconds for the page to load during busy periods.&quot;<\/td>\n<\/tr>\n<tr>\n  <td>&quot;We have 80% test coverage but the integration tests are flaky.&quot;<\/td>\n  <td>&quot;Our automated testing catches most bugs, but occasionally gives false alarms that slow down deployments.&quot;<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Practice (Days 68–74):<\/strong> Every day, pick one technical thing you worked on this week. Write one sentence explaining it technically, then rewrite it as a business sentence. Say the business sentence out loud until it sounds natural.<\/p>\n<hr />\n<h3>The Escalation Framework<\/h3>\n<p>When you need to escalate a problem to your manager or a director, use this structure:<\/p>\n<pre><code>1. Headline: &quot;We have an issue with [X] that I need your input on.&quot;\n2. What's happening: [1-2 sentences, no jargon]\n3. Impact: &quot;If we don't address this by [date], [business consequence].&quot;\n4. Options: &quot;I see three options: [A], [B], or [C].&quot;\n5. Your recommendation: &quot;I'd recommend [X] because [reason].&quot;\n6. What you need: &quot;I need you to [decision/approval/resource].&quot;\n<\/code><\/pre>\n<p>Practice writing and saying this escalation for a real or hypothetical scenario.<\/p>\n<hr />\n","text":"## Week 10 (Days 68–74): Stakeholder and Upward Communication\n\n### The Audience Map\n\nAt Staff level, you communicate with 4 different audiences, each requiring a different register:\n\n| Audience | What they care about | Your job |\n|---|---|---|\n| Junior engineers | \"Is this the right approach? Am I doing this right?\" | Give clarity, not opinion. Be specific. |\n| Peer senior engineers | \"Is this technically sound?\" | Be precise. Show you've thought through tradeoffs. |\n| Engineering manager | \"Will this be done? What's the risk?\" | Be concise. Surface blockers early. Give a clear status. |\n| VP / Director / CTO | \"What's the business impact? What do I need to decide?\" | Lead with conclusion. No technical jargon. Keep it to 3 points. |\n\n### Translating Up: The Technical-to-Business Translation\n\nPractice converting technical sentences into business sentences:\n\n| Technical | Business |\n|---|---|\n| \"We're refactoring the authentication module to use OAuth 2.0 with PKCE.\" | \"We're upgrading our login security to meet enterprise customer requirements and reduce breach risk.\" |\n| \"The database is experiencing high read latency due to missing indexes.\" | \"Our app is slowing down for users under high load — we have a fix that will take 2 days.\" |\n| \"We need to migrate from a monolith to microservices.\" | \"To scale the team from 4 to 12 engineers without stepping on each other, we need to split the codebase.\" |\n| \"The p99 latency is 3 seconds during peak traffic.\" | \"1 in 100 users waits 3 seconds for the page to load during busy periods.\" |\n| \"We have 80% test coverage but the integration tests are flaky.\" | \"Our automated testing catches most bugs, but occasionally gives false alarms that slow down deployments.\" |\n\n**Practice (Days 68–74):** Every day, pick one technical thing you worked on this week. Write one sentence explaining it technically, then rewrite it as a business sentence. Say the business sentence out loud until it sounds natural.\n\n---\n\n### The Escalation Framework\n\nWhen you need to escalate a problem to your manager or a director, use this structure:\n\n```\n1. Headline: \"We have an issue with [X] that I need your input on.\"\n2. What's happening: [1-2 sentences, no jargon]\n3. Impact: \"If we don't address this by [date], [business consequence].\"\n4. Options: \"I see three options: [A], [B], or [C].\"\n5. Your recommendation: \"I'd recommend [X] because [reason].\"\n6. What you need: \"I need you to [decision/approval/resource].\"\n```\n\nPractice writing and saying this escalation for a real or hypothetical scenario.\n\n---\n\n"},{"title":"Week 11 (Days 75–81): Technical Storytelling and Presenting","html":"<h2>Week 11 (Days 75–81): Technical Storytelling and Presenting<\/h2>\n<h3>How to Give a 10-Minute Technical Talk<\/h3>\n<p>Internal lightning talks are one of the fastest ways to build your Staff Engineer reputation. This week you prepare and give one.<\/p>\n<p><strong>Talk structure:<\/strong><\/p>\n<pre><code>0:00 – 0:30  Hook: &quot;Have you ever wondered why our API is slow for 1% of requests?&quot;\n0:30 – 1:00  Why this matters: &quot;This costs us [X]. Today I'll show you why it happens and how to fix it.&quot;\n1:00 – 3:00  The problem, clearly explained\n3:00 – 7:00  The solution / what you learned / what you built\n7:00 – 9:00  Demo or evidence (show, don't tell)\n9:00 – 9:30  Key takeaway: &quot;The one thing to remember is...&quot;\n9:30 – 10:00 Call to action: &quot;I'll share the runbook in Slack. Try this next time you see...&quot;\n<\/code><\/pre>\n<p><strong>Week 11 assignment:<\/strong><\/p>\n<ul>\n<li>Day 75–77: Choose a topic from your recent work. Write the talk structure above.<\/li>\n<li>Day 78–79: Write out the full spoken script (don't just use bullet points)<\/li>\n<li>Day 80: Practice delivering it 3 times — out loud, timed<\/li>\n<li>Day 81: Deliver it. To your team, to your roommate, to nobody — just record it.<\/li>\n<\/ul>\n<p><strong>Topics that work well:<\/strong><\/p>\n<ul>\n<li>A bug you investigated and fixed (the detective story format)<\/li>\n<li>A technical decision you made and why<\/li>\n<li>Something you learned about a technology while building something<\/li>\n<li>A near-miss or incident and what it taught you<\/li>\n<\/ul>\n<hr />\n<h3>Making Technical Points Memorable<\/h3>\n<p>Two techniques for making technical explanations stick:<\/p>\n<p><strong>1. The Analogy<\/strong><\/p>\n<p>Every complex technical concept has an analogy that makes it instantly clear:<\/p>\n<table>\n<thead>\n<tr>\n  <th>Concept<\/th>\n  <th>Analogy<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Connection pool<\/td>\n  <td>A fleet of taxis waiting at the stand — already started, ready to go<\/td>\n<\/tr>\n<tr>\n  <td>Circuit breaker<\/td>\n  <td>A electrical fuse — trips when overloaded, resets after cooldown<\/td>\n<\/tr>\n<tr>\n  <td>Cache<\/td>\n  <td>Post-it notes on your desk — fast access to things you use often<\/td>\n<\/tr>\n<tr>\n  <td>Message queue<\/td>\n  <td>A ticket system — tasks get queued and processed in order<\/td>\n<\/tr>\n<tr>\n  <td>Load balancer<\/td>\n  <td>A restaurant host — distributes arriving guests across available tables<\/td>\n<\/tr>\n<tr>\n  <td>Retry with backoff<\/td>\n  <td>Knocking on a door — if no answer, wait a bit longer each time<\/td>\n<\/tr>\n<tr>\n  <td>Idempotency<\/td>\n  <td>A light switch — pressing it twice doesn't turn it on twice<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Practice creating your own analogies for concepts in your domain.<\/p>\n<p><strong>2. The Before/After<\/strong><\/p>\n<p>Show impact by contrasting before and after:<\/p>\n<pre><code>&quot;Before we added connection pooling, every API request opened a new database\nconnection. That takes 15-30ms and has a hard limit. Under load, we'd run out\nof connections and users would see errors.\n\nAfter connection pooling, we maintain 20 warm connections. Requests grab one\nin under 1ms, use it, and return it. No more connection errors under load,\nand our latency dropped by ~20ms per request.&quot;\n<\/code><\/pre>\n<hr />\n","text":"## Week 11 (Days 75–81): Technical Storytelling and Presenting\n\n### How to Give a 10-Minute Technical Talk\n\nInternal lightning talks are one of the fastest ways to build your Staff Engineer reputation. This week you prepare and give one.\n\n**Talk structure:**\n```\n0:00 – 0:30  Hook: \"Have you ever wondered why our API is slow for 1% of requests?\"\n0:30 – 1:00  Why this matters: \"This costs us [X]. Today I'll show you why it happens and how to fix it.\"\n1:00 – 3:00  The problem, clearly explained\n3:00 – 7:00  The solution / what you learned / what you built\n7:00 – 9:00  Demo or evidence (show, don't tell)\n9:00 – 9:30  Key takeaway: \"The one thing to remember is...\"\n9:30 – 10:00 Call to action: \"I'll share the runbook in Slack. Try this next time you see...\"\n```\n\n**Week 11 assignment:**\n- Day 75–77: Choose a topic from your recent work. Write the talk structure above.\n- Day 78–79: Write out the full spoken script (don't just use bullet points)\n- Day 80: Practice delivering it 3 times — out loud, timed\n- Day 81: Deliver it. To your team, to your roommate, to nobody — just record it.\n\n**Topics that work well:**\n- A bug you investigated and fixed (the detective story format)\n- A technical decision you made and why\n- Something you learned about a technology while building something\n- A near-miss or incident and what it taught you\n\n---\n\n### Making Technical Points Memorable\n\nTwo techniques for making technical explanations stick:\n\n**1. The Analogy**\n\nEvery complex technical concept has an analogy that makes it instantly clear:\n\n| Concept | Analogy |\n|---|---|\n| Connection pool | A fleet of taxis waiting at the stand — already started, ready to go |\n| Circuit breaker | A electrical fuse — trips when overloaded, resets after cooldown |\n| Cache | Post-it notes on your desk — fast access to things you use often |\n| Message queue | A ticket system — tasks get queued and processed in order |\n| Load balancer | A restaurant host — distributes arriving guests across available tables |\n| Retry with backoff | Knocking on a door — if no answer, wait a bit longer each time |\n| Idempotency | A light switch — pressing it twice doesn't turn it on twice |\n\nPractice creating your own analogies for concepts in your domain.\n\n**2. The Before/After**\n\nShow impact by contrasting before and after:\n\n```\n\"Before we added connection pooling, every API request opened a new database\nconnection. That takes 15-30ms and has a hard limit. Under load, we'd run out\nof connections and users would see errors.\n\nAfter connection pooling, we maintain 20 warm co
