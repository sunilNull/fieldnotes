/>Conference talk accepted<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>AWS SAP-C02 (Professional) study begun<\/li>\n<\/ul>\n<hr />\n","tasks":["Platform strategy document","Conference talk accepted","AWS SAP-C02 (Professional) study begun"]},{"start":16,"end":17,"title":"Tier 1 Company Interviews","html":"<h3>Month 16-17: Tier 1 Company Interviews<\/h3>\n<p><strong>Goals:<\/strong> Complete FAANG/Tier 1 interview process<\/p>\n<p><strong>Actions:<\/strong><\/p>\n<ul>\n<li>Intensive FAANG interview prep (additional LeetCode hards)<\/li>\n<li>2+ mock interviews per week<\/li>\n<li>Negotiate competing offers<\/li>\n<\/ul>\n<p><strong>Deliverables:<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>FAANG interviews completed<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Competing offers from Tier 1 and Tier 2<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Final negotiation — target ₹80-100 LPA or $150K+ remote<\/li>\n<\/ul>\n<hr />\n","tasks":["FAANG interviews completed","Competing offers from Tier 1 and Tier 2","Final negotiation — target ₹80-100 LPA or $150K+ remote"]},{"start":18,"end":18,"title":"Decision and Transition","html":"<h3>Month 18: Decision and Transition<\/h3>\n<p><strong>Goals:<\/strong> Accept best offer, begin Staff Engineer role<\/p>\n<p><strong>Actions:<\/strong><\/p>\n<ul>\n<li>Final offer negotiation<\/li>\n<li>Transition current role professionally<\/li>\n<li>Set 90-day goals for new role<\/li>\n<\/ul>\n<p><strong>Deliverables:<\/strong><\/p>\n<ul>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Staff Engineer or equivalent title secured<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Compensation: ₹70 LPA+ or $140K+ remote<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Technical blog with 10+ posts, growing audience<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Conference talk delivered<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>CKA certification earned<\/li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>AWS Solutions Architect Associate earned<\/li>\n<\/ul>\n<hr />\n","tasks":["Staff Engineer or equivalent title secured","Compensation: ₹70 LPA+ or $140K+ remote","Technical blog with 10+ posts, growing audience","Conference talk delivered","CKA certification earned","AWS Solutions Architect Associate earned"]}],"problems":[{"id":1,"name":"Two Sum","difficulty":"Easy","pattern":"HashMap","topic":"Arrays & Two Pointers","lesson":{"description":"Given integers and a target, return indices of two distinct elements adding to the target. Assume exactly one answer.","example":"[2,7,11,15], target=9 → [0,1]","hint":"Look for the complement before inserting the current value.","reason":"The dictionary stores earlier indices; a complement hit guarantees distinct positions. Every valid pair is found when its second element is visited.","complexity":"O(n) time, O(n) space.","code":"def solve(nums, target):\n    seen = {}\n    for i, x in enumerate(nums):\n        if target-x in seen: return [seen[target-x], i]\n        seen[x] = i","tests":"assert solve([2,7,11,15],9)==[0,1]; assert solve([3,3],6)==[0,1]","models":"","full":"def solve(nums, target):\n    seen = {}\n    for i, x in enumerate(nums):\n        if target-x in seen: return [seen[target-x], i]\n        seen[x] = i\n\n# Example and boundary checks\nassert solve([2,7,11,15],9)==[0,1]; assert solve([3,3],6)==[0,1]\nprint(\"Sample checks passed\")\n","canonical":1}},{"id":2,"name":"Best Time to Buy Stock","difficulty":"Easy","pattern":"Single pass","topic":"Arrays & Two Pointers","lesson":{"description":"Given daily stock prices, choose at most one buy followed by one sell; return maximum profit, or zero.","example":"[7,1,5,3,6,4] → 5","hint":"Keep the cheapest earlier price.","reason":"At each day, selling against the minimum price seen so far dominates any other earlier buy. Track the best such profit.","complexity":"O(n) time, O(1) space.","code":"def solve(prices):\n    low, best = float('inf'), 0\n    for p in prices:\n        low = min(low,p)\n        best = max(best,p-low)\n    return best","tests":"assert solve([7,1,5,3,6,4])==5; assert solve([5,4,3])==0","models":"","full":"def solve(prices):\n    low, best = float('inf'), 0\n    for p in prices:\n        low = min(low,p)\n        best = max(best,p-low)\n    return best\n\n# Example and boundary checks\nassert solve([7,1,5,3,6,4])==5; assert solve([5,4,3])==0\nprint(\"Sample checks passed\")\n","canonical":2}},{"id":3,"name":"Contains Duplicate","difficulty":"Easy","pattern":"HashSet","topic":"Arrays & Two Pointers","lesson":{"description":"Return whether an integer array contains any repeated value.","example":"[1,2,3,1] → True","hint":"A set discards duplicates.","reason":"If the set has fewer elements than the input, some value appeared more than once.","complexity":"O(n) expected time, O(n) space.","code":"def solve(nums):\n    return len(set(nums)) != len(nums)","tests":"assert solve([1,2,3,1]); assert not solve([])","models":"","full":"def solve(nums):\n    return len(set(nums)) != len(nums)\n\n# Example and boundary checks\nassert solve([1,2,3,1]); assert not solve([])\nprint(\"Sample checks passed\")\n","canonical":3}},{"id":4,"name":"Product of Array Except Self","difficulty":"Medium","pattern":"Prefix/Suffix","topic":"Arrays & Two Pointers","lesson":{"description":"Return an array where each position contains the product of all other elements, without division.","example":"[1,2,3,4] → [24,12,8,6]","hint":"Combine products to the left and right.","reason":"First store the exclusive prefix product in each output cell. Walking backwards multiplies by the exclusive suffix; zeros require no special case.","complexity":"O(n) time, O(1) auxiliary space excluding output.","code":"def solve(nums):\n    out = [1]*len(nums)\n    p = 1\n    for i,x in enumerate(nums):\n        out[i] = p; p *= x\n    p = 1\n    for i in range(len(nums)-1,-1,-1):\n        out[i] *= p; p *= nums[i]\n    return out","tests":"assert solve([1,2,3,4])==[24,12,8,6]; assert solve([0,2,0])==[0,0,0]","models":"","full":"def solve(nums):\n    out = [1]*len(nums)\n    p = 1\n    for i,x in enumerate(nums):\n        out[i] = p; p *= x\n    p = 1\n    for i in range(len(nums)-1,-1,-1):\n        out[i] *= p; p *= nums[i]\n    return out\n\n# Example and boundary checks\nassert solve([1,2,3,4])==[24,12,8,6]; assert solve([0,2,0])==[0,0,0]\nprint(\"Sample checks passed\")\n","canonical":4}},{"id":5,"name":"Maximum Subarray","difficulty":"Medium","pattern":"Kadane","topic":"Arrays & Two Pointers","lesson":{"description":"Return the largest sum of a nonempty contiguous subarray.","example":"[-2,1,-3,4,-1,2,1,-5,4] → 6","hint":"At each index, extend or restart.","reason":"A maximum subarray ending here either starts here or extends the best ending at the preceding index. Track the global maximum, including all-negative inputs.","complexity":"O(n) time, O(1) space.","code":"def solve(nums):\n    best = cur = nums[0]\n    for x in nums[1:]:\n        cur = max(x,cur+x); best = max(best,cur)\n    return best","tests":"assert solve([-2,1,-3,4,-1,2,1,-5,4])==6; assert solve([-5,-2])==-2","models":"","full":"def solve(nums):\n    best = cur = nums[0]\n    for x in nums[1:]:\n        cur = max(x,cur+x); best = max(best,cur)\n    return best\n\n# Example and boundary checks\nassert solve([-2,1,-3,4,-1,2,1,-5,4])==6; assert solve([-5,-2])==-2\nprint(\"Sample checks passed\")\n","canonical":5}},{"id":6,"name":"Maximum Product Subarray","difficulty":"Medium","pattern":"DP-like","topic":"Arrays & Two Pointers","lesson":{"description":"Find the maximum product of a nonempty contiguous subarray.","example":"[2,3,-2,4] → 6","hint":"A negative number swaps the roles of min and max.","reason":"Maintain both extremes of products ending at each position. Multiplying a negative by the previous minimum may create the new maximum; starting fresh handles zeros.","complexity":"O(n) time, O(1) space.","code":"def solve(nums):\n    lo = hi = best = nums[0]\n    for x in nums[1:]:\n        lo,hi = min(x,x*lo,x*hi),max(x,x*lo,x*hi)\n        best = max(best,hi)\n    return best","tests":"assert solve([2,3,-2,4])==6; assert solve([-2,3,-4])==24","models":"","full":"def solve(nums):\n    lo = hi = best = nums[0]\n    for x in nums[1:]:\n        lo,hi = min(x,x*lo,x*hi),max(x,x*lo,x*hi)\n        best = max(best,hi)\n    return best\n\n# Example and boundary checks\nassert solve([2,3,-2,4])==6; assert solve([-2,3,-4])==24\nprint(\"Sample checks passed\")\n","canonical":6}},{"id":7,"name":"Find Min in Rotated Sorted Array","difficulty":"Medium","pattern":"Binary Search","topic":"Arrays & Two Pointers","lesson":{"description":"Find the minimum in a nonempty rotated ascending array of distinct integers.","example":"[3,4,5,1,2] → 1","hint":"Compare middle with rightmost value.","reason":"If middle exceeds the right endpoint, the rotation minimum is strictly to its right. Otherwise it lies at middle or earlier. The interval always contains the minimum.","complexity":"O(log n) time, O(1) space.","code":"def solve(a):\n    l,r=0,len(a)-1\n    while l<r:\n        m=(l+r)//2\n        if a[m]>a[r]: l=m+1\n        else: r=m\n    return a[l]","tests":"assert solve([3,4,5,1,2])==1; assert solve([1])==1","models":"","full":"def solve(a):\n    l,r=0,len(a)-1\n    while l<r:\n        m=(l+r)//2\n        if a[m]>a[r]: l=m+1\n        else: r=m\n    return a[l]\n\n# Example and boundary checks\nassert solve([3,4,5,1,2])==1; assert solve([1])==1\nprint(\"Sample checks passed\")\n","canonical":7}},{"id":8,"name":"Search in Rotated Sorted Array","difficulty":"Medium","pattern":"Modified BS","topic":"Arrays & Two Pointers","lesson":{"description":"Find a target in a rotated ascending array of distinct values; return its index or -1.","example":"[4,5,6,7,0,1,2], 0 → 4","hint":"One half is always sorted.","reason":"Identify the sorted half and check if the target falls inside its bounds. Discard the other half if it does, otherwise discard the sorted half.","complexity":"O(log n) time, O(1) space.","code":"def solve(a,t):\n    l,r=0,len(a)-1\n    while l<=r:\n        m=(l+r)//2\n        if a[m]==t: return m\n        if a[l]<=a[m]:\n            if a[l]<=t<a[m]: r=m-1\n            else: l=m+1\n        else:\n            if a[m]<t<=a[r]: l=m+1\n            else: r=m-1\n    return -1","tests":"assert solve([4,5,6,7,0,1,2],0)==4; assert solve([],3)==-1","models":"","full":"def solve(a,t):\n    l,r=0,len(a)-1\n    while l<=r:\n        m=(l+r)//2\n        if a[m]==t: return m\n        if a[l]<=a[m]:\n            if a[l]<=t<a[m]: r=m-1\n            else: l=m+1\n        else:\n            if a[m]<t<=a[r]: l=m+1\n            else: r=m-1\n    return -1\n\n# Example and boundary checks\nassert solve([4,5,6,7,0,1,2],0)==4; assert solve([],3)==-1\nprint(\"Sample checks passed\")\n","canonical":8}},{"id":9,"name":"3Sum","difficulty":"Medium","pattern":"Two Pointers","topic":"Arrays & Two Pointers","lesson":{"description":"Return all distinct value triplets in an array whose sum is zero.","example":"[-1,0,1,2,-1,-4] → [[-1,-1,2],[-1,0,1]]","hint":"Sort, fix one value, move two pointers.","reason":"For a fixed first value, increasing the left pointer increases the sum and decreasing the right decreases it. Skip equal choices to avoid duplicate triplets.","complexity":"O(n²) time, O(n) sorting-copy space excluding output.","code":"def solve(nums):\n    a=sorted(nums); out=[]\n    for i in range(len(a)-2):\n        if i and a[i]==a[i-1]: continue\n        l,r=i+1,len(a)-1\n        while l<r:\n            s=a[i]+a[l]+a[r]\n            if s<0: l+=1\n            elif s>0: r-=1\n            else:\n                out.append([a[i],a[l],a[r]]); l+=1; r-=1\n                while l<r and a[l]==a[l-1]: l+=1\n                while l<r and a[r]==a[r+1]: r-=1\n    return out","tests":"assert sorted(solve([-1,0,1,2,-1,-4]))==[[-1,-1,2],[-1,0,1]]; assert solve([0,0,0,0])==[[0,0,0]]","models":"","full":"def solve(nums):\n    a=sorted(nums); out=[]\n    for i in range(len(a)-2):\n        if i and a[i]==a[i-1]: continue\n        l,r=i+1,len(a)-1\n        while l<r:\n            s=a[i]+a[l]+a[r]\n            if s<0: l+=1\n            elif s>0: r-=1\n            else:\n                out.append([a[i],a[l],a[r]]); l+=1; r-=1\n                while l<r and a[l]==a[l-1]: l+=1\n                while l<r and a[r]==a[r+1]: r-=1\n    return out\n\n# Example and boundary checks\nassert sorted(solve([-1,0,1,2,-1,-4]))==[[-1,-1,2],[-1,0,1]]; assert solve([0,0,0,0])==[[0,0,0]]\nprint(\"Sample checks passed\")\n","canonical":9}},{"id":10,"name":"Container With Most Water","difficulty":"Medium","pattern":"Two Pointers","topic":"Arrays & Two Pointers","lesson":{"description":"Choose two vertical lines that hold the greatest water area: width times shorter height.","example":"[1,8,6,2,5,4,8,3,7] → 49","hint":"Move the shorter side.","reason":"Keeping the shorter line while reducing width cannot improve area. Moving that line is the only way to potentially improve the limiting height.","complexity":"O(n) time, O(1) space.","code":"def solve(h):\n    l,r,b=0,len(h)-1,0\n    while l<r:\n        b=max(b,(r-l)*min(h[l],h[r]))\n        if h[l]<h[r]: l+=1\n        else: r-=1\n    return b","tests":"assert solve([1,8,6,2,5,4,8,3,7])==49; assert solve([1,1])==1","models":"","full":"def solve(h):\n    l,r,b=0,len(h)-1,0\n    while l<r:\n        b=max(b,(r-l)*min(h[l],h[r]))\n        if h[l]<h[r]: l+=1\n        else: r-=1\n    return b\n\n# Example and boundary checks\nassert solve([1,8,6,2,5,4,8,3,7])==49; assert solve([1,1])==1\nprint(\"Sample checks passed\")\n","canonical":10}},{"id":11,"name":"Trapping Rain Water","difficulty":"Hard","pattern":"Two Pointers","topic":"Arrays & Two Pointers","lesson":{"description":"Given nonnegative bar heights of width one, calculate how much rainwater is trapped.","example":"[0,1,0,2,1,0,1,3,2,1,2,1] → 6","hint":"The smaller boundary maximum determines the next cell.","reason":"Maintain maxima on both sides. When left maximum is no greater than right maximum, water at the next left cell is limited by the left boundary; the symmetric case holds on the right.","complexity":"O(n) time, O(1) space.","code":"def solve(h):\n    l,r=0,len(h)-1; lm=rm=total=0\n    while l<=r:\n        if lm<=rm:\n            lm=max(lm,h[l]); total+=lm-h[l]; l+=1\n        else:\n            rm=max(rm,h[r]); total+=rm-h[r]; r-=1\n    return total","tests":"assert solve([0,1,0,2,1,0,1,3,2,1,2,1])==6; assert solve([4,2,0,3,2,5])==9","models":"","full":"def solve(h):\n    l,r=0,len(h)-1; lm=rm=total=0\n    while l<=r:\n        if lm<=rm:\n            lm=max(lm,h[l]); total+=lm-h[l]; l+=1\n        else:\n            rm=max(rm,h[r]); total+=rm-h[r]; r-=1\n    return total\n\n# Example and boundary checks\nassert solve([0,1,0,2,1,0,1,3,2,1,2,1])==6; assert solve([4,2,0,3,2,5])==9\nprint(\"Sample checks passed\")\n","canonical":11}},{"id":12,"name":"Merge k Sorted Lists (array variant)","difficulty":"Hard","pattern":"Heap","topic":"Arrays & Two Pointers","lesson":{"description":"Merge k ascending arrays into one ascending array.","example":"[[1,4],[2,3],[]] → [1,2,3,4]","hint":"Keep only each array's next candidate in a heap.","reason":"The smallest remaining element must be one of the current heads. Extract it and add the next element from the same array.","complexity":"O(N log(k+1)) time, O(k) auxiliary space; N total values.","code":"from heapq import merge\ndef solve(arrays):\n    return list(merge(*arrays))","tests":"assert solve([[1,4],[2,3],[]])==[1,2,3,4]; assert solve([])==[]","models":"","full":"from heapq import merge\ndef solve(arrays):\n    return list(merge(*arrays))\n\n# Example and boundary checks\nassert solve([[1,4],[2,3],[]])==[1,2,3,4]; assert solve([])==[]\nprint(\"Sample checks passed\")\n","canonical":12}},{"id":13,"name":"Valid Anagram","difficulty":"Easy","pattern":"Frequency map","topic":"Strings","lesson":{"description":"Determine whether two strings contain identical character multiplicities.","example":"'anagram','nagaram' → True","hint":"Count characters, not just membership.","reason":"Anagrams have the same multiset of characters. Frequency maps compare that multiset directly.","complexity":"O(n+m) time, O(u) space for distinct characters.","code":"from collections import Counter\ndef solve(s,t): return Counter(s)==Counter(t)","tests":"assert solve('anagram','nagaram'); assert not solve('aab','abb')","models":"","full":"from collections import Counter\ndef solve(s,t): return Counter(s)==Counter(t)\n\n# Example and boundary checks\nassert solve('anagram','nagaram'); assert not solve('aab','abb')\nprint(\"Sample checks passed\")\n","canonical":13}},{"id":14,"name":"Valid Palindrome","difficulty":"Easy","pattern":"Two pointers","topic":"Strings","lesson":{"description":"Ignoring non-alphanumeric characters and case, determine whether a string reads the same backwards. Use ASCII input.","example":"'A man, a plan, a canal: Panama' → True","hint":"Skip punctuation with two pointers.","reason":"Only the next meaningful characters at both ends need comparison. A mismatch proves non-palindromic; meeting in the middle proves symmetry.","complexity":"O(n) time, O(1) space.","code":"def solve(s):\n    l,r=0,len(s)-1\n    while l<r:\n        if not s[l].isalnum(): l+=1; continue\n        if not s[r].isalnum(): r-=1; continue\n        if s[l].lower()!=s[r].lower(): return False\n        l+=1; r-=1\n    return True","tests":"assert solve('A man, a plan, a canal: Panama'); assert not solve('race a car')","models":"","full":"def solve(s):\n    l,r=0,len(s)-1\n    while l<r:\n        if not s[l].isalnum(): l+=1; continue\n        if not s[r].isalnum(): r-=1; continue\n        if s[l].lower()!=s[r].lower(): return False\n        l+=1; r-=1\n    return True\n\n# Example and boundary checks\nassert solve('A man, a plan, a canal: Panama'); assert not solve('race a car')\nprint(\"Sample checks passed\")\n","canonical":14}},{"id":15,"name":"Longest Common Prefix","difficulty":"Easy","pattern":"Vertical scanning","topic":"Strings","lesson":{"description":"Return the longest prefix shared by every string; return empty if none or input is empty.","example":"['flower','flow','flight'] → 'fl'","hint":"Compare each column against the first string.","reason":"The first missing or different character is exactly where the common prefix ends.","complexity":"O(kL) time, O(1) auxiliary space, L shortest length, k strings.","code":"def solve(words):\n    if not words: return ''\n    for i,c in enumerate(words[0]):\n        if any(i>=len(w) or w[i]!=c for w in words): return words[0][:i]\n    return words[0]","tests":"assert solve(['flower','flow','flight'])=='fl'; assert solve([])==''","models":"","full":"def solve(words):\n    if not words: return ''\n    for i,c in enumerate(words[0]):\n        if any(i>=len(w) or w[i]!=c for w in words): return words[0][:i]\n    return words[0]\n\n# Example and boundary checks\nassert solve(['flower','flow','flight'])=='fl'; assert solve([])==''\nprint(\"Sample checks passed\")\n","canonical":15}},{"id":16,"name":"Valid Parentheses","difficulty":"Easy","pattern":"Stack","topic":"Strings","lesson":{"description":"Given only bracket characters ()[]{}, return whether nesting and matching are valid.","example":"'([{}])' → True; '([)]' → False","hint":"Most recent unmatched opener must close first.","reason":"A stack holds unmatched openers. A closer must match the top; any leftover opener is invalid.","complexity":"O(n) time, O(n) space.","code":"def solve(s):\n    match={')':'(',']':'[','}':'{'}; stack=[]\n    for c in s:\n        if c in match:\n            if not stack or stack.pop()!=match[c]: return False\n        else: stack.append(c)\n    return not stack","tests":"assert solve('([{}])'); assert not solve('([)]')","models":"","full":"def solve(s):\n    match={')':'(',']':'[','}':'{'}; stack=[]\n    for c in s:\n        if c in match:\n            if not stack or stack.pop()!=match[c]: return False\n        else: stack.append(c)\n    return not stack\n\n# Example and boundary checks\nassert solve('([{}])'); assert not solve('([)]')\nprint(\"Sample checks passed\")\n","canonical":16}},{"id":17,"name":"Longest Substring Without Repeating","difficulty":"Medium","pattern":"Sliding window","topic":"Strings","lesson":{"description":"Return the length of the longest contiguous substring with no repeated character.","example":"'abcabcbb' → 3","hint":"Store last seen positions.","reason":"When a character repeats inside the window, move the left boundary past its previous position. Never move left backwards.","complexity":"O(n) time, O(u) space.","code":"def solve(s):\n    last={}; l=best=0\n    for r,c in enumerate(s):\n        l=max(l,last.get(c,-1)+1); last[c]=r\n        best=max(best,r-l+1)\n    return best","tests":"assert solve('abcabcbb')==3; assert solve('abba')==2","models":"","full":"def solve(s):\n    last={}; l=best=0\n    for r,c in enumerate(s):\n        l=max(l,last.get(c,-1)+1); last[c]=r\n        best=max(best,r-l+1)\n    return best\n\n# Example and boundary checks\nassert solve('abcabcbb')==3; assert solve('abba')==2\nprint(\"Sample checks passed\")\n","canonical":17}},{"id":18,"name":"Longest Repeating Character Replacement","difficulty":"Medium","pattern":"Sliding window","topic":"Strings","lesson":{"description":"For an uppercase string, replace at most k characters to make a contiguous substring all one letter; return max length.","example":"'AABABBA',1 → 4","hint":"Window length minus most common count is replacement cost.","reason":"Track the largest frequency seen; shrinking when the length exceeds this frequency plus k bounds the best possible length. A stale maximum may retain an invalid window but cannot create a new oversized record.","complexity":"O(n) time, O(26) space.","code":"from collections import Counter\ndef solve(s,k):\n    cnt=Counter(); l=mx=best=0\n    for r,c in enumerate(s):\n        cnt[c]+=1; mx=max(mx,cnt[c])\n        if r-l+1-mx>k: cnt[s[l]]-=1; l+=1\n        best=max(best,r-l+1)\n    return best","tests":"assert solve('AABABBA',1)==4; assert solve('ABAB',2)==4","models":"","full":"from collections import Counter\ndef solve(s,k):\n    cnt=Counter(); l=mx=best=0\n    for r,c in enumerate(s):\n        cnt[c]+=1; mx=max(mx,cnt[c])\n        if r-l+1-mx>k: cnt[s[l]]-=1; l+=1\n        best=max(best,r-l+1)\n    return best\n\n# Example and boundary checks\nassert solve('AABABBA',1)==4; assert solve('ABAB',2)==4\nprint(\"Sample checks passed\")\n","canonical":18}},{"id":19,"name":"Minimum Window Substring","difficulty":"Hard","pattern":"Sliding window","topic":"Strings","lesson":{"description":"Find the shortest substring of s containing all characters of t with their multiplicities, or empty if impossible.","example":"'ADOBECODEBANC','ABC' → 'BANC'","hint":"Expand until covered, then shrink while covered.","reason":"Track missing required occurrences. When none remain, shrinking explores every minimal candidate for the current right boundary until a required character is lost.","complexity":"O(n+m) time, O(u) space.","code":"from collections import Counter\ndef solve(s,t):\n    if not t: return ''\n    need=Counter(t); missing=len(t); l=0; best=(0,float('inf'))\n    for r,c in enumerate(s):\n        if need[c]>0: missing-=1\n        need[c]-=1\n        while missing==0:\n            if r-l+1<best[1]: best=(l,r-l+1)\n            need[s[l]]+=1\n            if need[s[l]]>0: missing+=1\n            l+=1\n    return '' if best[1]==float('inf') else s[best[0]:best[0]+best[1]]","tests":"assert solve('ADOBECODEBANC','ABC')=='BANC'; assert solve('a','aa')==''","models":"","full":"from collections import Counter\ndef solve(s,t):\n    if not t: return ''\n    need=Counter(t); missing=len(t); l=0; best=(0,float('inf'))\n    for r,c in enumerate(s):\n        if need[c]>0: missing-=1\n        need[c]-=1\n        while missing==0:\n            if r-l+1<best[1]: best=(l,r-l+1)\n            need[s[l]]+=1\n            if need[s[l]]>0: missing+=1\n            l+=1\n    return '' if best[1]==float('inf') else s[best[0]:best[0]+best[1]]\n\n# Example and boundary checks\nassert solve('ADOBECODEBANC','ABC')=='BANC'; assert solve('a','aa')==''\nprint(\"Sample checks passed\")\n","canonical":19}},{"id":20,"name":"Group Anagrams","difficulty":"Medium","pattern":"HashMap","topic":"Strings","lesson":{"description":"Group strings that are anagrams of each other; group order is irrelevant.","example":"['eat','tea','tan','ate','nat','bat'] → [['eat','tea','ate'],['tan','nat'],['bat']]","hint":"Use a canonical signature.","reason":"Sorting each word yields the same key exactly when the words contain equal character multiplicities. Append each word to its key's group.","complexity":"O(sum L log L) time, O(total characters) space.","code":"from collections import defaultdict\ndef solve(words):\n    groups=defaultdict(list)\n    for w in words: groups[''.join(sorted(w))].append(w)\n    return list(groups.values())","tests":"assert sorted(map(sorted,solve(['eat','tea','tan','ate','nat','bat'])))==[['ate','eat','tea'],['bat'],['nat','tan']]","models":"","full":"from collections import defaultdict\ndef solve(words):\n    groups=defaultdict(list)\n    for w in words: groups[''.join(sorted(w))].append(w)\n    return list(groups.values())\n\n# Example and boundary checks\nassert sorted(map(sorted,solve(['eat','tea','tan','ate','nat','bat'])))==[['ate','eat','tea'],['bat'],['nat','tan']]\nprint(\"Sample checks passed\")\n","canonical":20}},{"id":21,"name":"Encode/Decode Strings","difficulty":"Medium","pattern":"Length prefix","topic":"Strings","lesson":{"description":"Design reversible encoding of a list of arbitrary strings into one string, including empty strings and delimiter characters.","example":"['a#b','','xyz'] → '3#a#b0#3#xyz' → original list","hint":"Length prefix beats delimiter splitting.","reason":"Read digits up to the separator, then exactly that many characters. The payload can contain any separator because its boundary is known.","complexity":"O(N) time and output space for total encoded length.","code":"def encode(words): return ''.join(f'{len(w)}#{w}' for w in words)\ndef decode(s):\n    out=[]; i=0\n    while i<len(s):\n        j=s.index('#',i); n=int(s[i:j]); i=j+1\n        out.append(s[i:i+n]); i+=n\n    return out","tests":"assert decode(encode(['a#b','','xyz']))==['a#b','','xyz']; assert decode(encode([]))==[]","models":"","full":"def encode(words): return ''.join(f'{len(w)}#{w}' for w in words)\ndef decode(s):\n    out=[]; i=0\n    while i<len(s):\n        j=s.index('#',i); n=int(s[i:j]); i=j+1\n        out.append(s[i:i+n]); i+=n\n    return out\n\n# Example and boundary checks\nassert decode(encode(['a#b','','xyz']))==['a#b','','xyz']; assert decode(encode([]))==[]\nprint(\"Sample checks passed\")\n","canonical":21}},{"id":22,"name":"Palindromic Substrings","difficulty":"Medium","pattern":"Expand center","topic":"Strings","lesson":{"description":"Count all palindromic contiguous substrings, counting occurrences separately.","example":"'aaa' → 6","hint":"Every palindrome has an odd or even center.","reason":"Expand from both possible center types at each index. Each successful expansion counts exactly one palindrome with that center.","complexity":"O(n²) time, O(1) space.","code":"def solve(s):\n    ans=0\n    for i in range(len(s)):\n        for l,r in [(i,i),(i,i+1)]:\n            while l>=0 and r<len(s) and s[l]==s[r]:\n                ans+=1; l-=1; r+=1\n    return ans","tests":"assert solve('aaa')==6; assert solve('')==0","models":"","full":"def solve(s):\n    ans=0\n    for i in range(len(s)):\n        for l,r in [(i,i),(i,i+1)]:\n            while l>=0 and r<len(s) and s[l]==s[r]:\n                ans+=1; l-=1; r+=1\n    return ans\n\n# Example and boundary checks\nassert solve('aaa')==6; assert solve('')==0\nprint(\"Sample checks passed\")\n","canonical":22}},{"id":23,"name":"Longest Palindromic Substring","difficulty":"Medium","pattern":"Expand center","topic":"Strings","lesson":{"description":"Return any longest contiguous palindromic substring.","example":"'babad' → 'bab' or 'aba'","hint":"Expand at each center and remember bounds.","reason":"All palindromes arise from odd or even centers. Record the largest successful expansion without repeatedly copying substrings.","complexity":"O(n²) time, O(1) auxiliary space.","code":"def solve(s):\n    start=size=0\n    for i in range(len(s)):\n        for l,r in [(i,i),(i,i+1)]:\n            while l>=0 and r<len(s) and s[l]==s[r]:\n                if r-l+1>size: start,size=l,r-l+1\n                l-=1; r+=1\n    return s[start:start+size]","tests":"assert solve('babad') in ('bab','aba'); assert solve('cbbd')=='bb'","models":"","full":"def solve(s):\n    start=size=0\n    for i in range(len(s)):\n        for l,r in [(i,i),(i,i+1)]:\n            while l>=0 and r<len(s) and s[l]==s[r]:\n                if r-l+1>size: start,size=l,r-l+1\n                l-=1; r+=1\n    return s[start:start+size]\n\n# Example and boundary checks\nassert solve('babad') in ('bab','aba'); assert solve('cbbd')=='bb'\nprint(\"Sample checks passed\")\n","canonical":23}},{"id":24,"name":"Two Sum","difficulty":"Easy","pattern":"HashMap","topic":"Hash Maps & Hash Sets","lesson":{"description":"Given integers and a target, return indices of two distinct elements adding to the target. Assume exactly one answer.","example":"[2,7,11,15], target=9 → [0,1]","hint":"Look for the complement before inserting the current value.","reason":"The dictionary stores earlier indices; a complement hit guarantees distinct positions. Every valid pair is found when its second element is visited.","complexity":"O(n) time, O(n) space.","code":"def solve(nums, target):\n    seen = {}\n    for i, x in enumerate(nums):\n        if target-x in seen: return [seen[target-x], i]\n        seen[x] = i","tests":"assert solve([2,7,11,15],9)==[0,1]; assert solve([3,3],6)==[0,1]","models":"","full":"def solve(nums, target):\n    seen = {}\n    for i, x in enumerate(nums):\n        if target-x in seen: return [seen[target-x], i]\n        seen[x] = i\n\n# Example and boundary checks\nassert solve([2,7,11,15],9)==[0,1]; assert solve([3,3],6)==[0,1]\nprint(\"Sample checks passed\")\n","canonical":1}},{"id":25,"name":"Group Anagrams","difficulty":"Medium","pattern":"HashMap of lists","topic":"Hash Maps & Hash Sets","lesson":{"description":"Group strings that are anagrams of each other; group order is irrelevant.","example":"['eat','tea','tan','ate','nat','bat'] → [['eat','tea','ate'],['tan','nat'],['bat']]","hint":"Use a canonical signature.","reason":"Sorting each word yields the same key exactly when the words contain equal character multiplicities. Append each word to its key's group.","complexity":"O(sum L log L) time, O(total characters) space.","code":"from collections import defaultdict\ndef solve(words):\n    groups=defaultdict(list)\n    for w in words: groups[''.join(sorted(w))].append(w)\n    return list(groups.values())","tests":"assert sorted(map(sorted,solve(['eat','tea','tan','ate','nat','bat'])))==[['ate','eat','tea'],['bat'],['nat','tan']]","models":"","full":"from collections import defaultdict\ndef solve(words):\n    groups=defaultdict(list)\n    for w in words: groups[''.join(sorted(w))].append(w)\n    return list(groups.values())\n\n# Example and boundary checks\nassert sorted(map(sorted,solve(['eat','tea','tan','ate','nat','bat'])))==[['ate','eat','tea'],['bat'],['nat','tan']]\nprint(\"Sample checks passed\")\n","canonical":20}},{"id":26,"name":"Top K Frequent Elements","difficulty":"Medium","pattern":"HashMap + Heap","topic":"Hash Maps & Hash Sets","lesson":{"description":"Return k most frequent values, in any order. Assume 1 ≤ k ≤ distinct count.","example":"[1,1,1,2,2,3],2 → [1,2]","hint":"Count then select top k.","reason":"A bounded heap keeps only the k largest frequencies seen; lower-frequency elements cannot enter the final answer.","complexity":"O(n+u log(k+1)) time, O(u+k) space.","code":"from collections import Counter\nfrom heapq import nlargest\ndef solve(nums,k):\n    counts=Counter(nums)\n    return nlargest(k,counts,key=counts.get)","tests":"assert set(solve([1,1,1,2,2,3],2))=={1,2}","models":"","full":"from collections import Counter\nfrom heapq import nlargest\ndef solve(nums,k):\n    counts=Counter(nums)\n    return nlargest(k,counts,key=counts.get)\n\n# Example and boundary checks\nassert set(solve([1,1,1,2,2,3],2))=={1,2}\nprint(\"Sample checks passed\")\n","canonical":26}},{"id":27,"name":"Encode and Decode","difficulty":"Medium","pattern":"Design","topic":"Hash Maps & Hash Sets","lesson":{"description":"Design reversible encoding of a list of arbitrary strings into one string, including empty strings and delimiter characters.","example":"['a#b','','xyz'] → '3#a#b0#3#xyz' → original list","hint":"Length prefix beats delimiter splitting.","reason":"Read digits up to the separator, then exactly that many characters. The payload can contain any separator because its boundary is known.","complexity":"O(N) time and output space for total encoded length.","code":"def encode(words): return ''.join(f'{len(w)}#{w}' for w in words)\ndef decode(s):\n    out=[]; i=0\n    while i<len(s):\n        j=s.index('#',i); n=int(s[i:j]); i=j+1\n        out.append(s[i:i+n]); i+=n\n    return out","tests":"assert decode(encode(['a#b','','xyz']))==['a#b','','xyz']; assert decode(encode([]))==[]","models":"","full":"def encode(words): return ''.join(f'{len(w)}#{w}' for w in words)\ndef decode(s):\n    out=[]; i=0\n    while i<len(s):\n        j=s.index('#',i); n=int(s[i:j]); i=j+1\n        out.append(s[i:i+n]); i+=n\n    return out\n\n# Example and boundary checks\nassert decode(encode(['a#b','','xyz']))==['a#b','','xyz']; assert decode(encode([]))==[]\nprint(\"Sample checks passed\")\n","canonical":21}},{"id":28,"name":"Product of Array Except Self","difficulty":"Medium","pattern":"No division trick","topic":"Hash Maps & Hash Sets","lesson":{"description":"Return an array where each position contains the product of all other elements, without division.","example":"[1,2,3,4] → [24,12,8,6]","hint":"Combine products to the left and right.","reason":"First store the exclusive prefix product in each output cell. Walking backwards multiplies by the exclusive suffix; zeros require no special case.","complexity":"O(n) time, O(1) auxiliary space excluding output.","code":"def solve(nums):\n    out = [1]*len(nums)\n    p = 1\n    for i,x in enumerate(nums):\n        out[i] = p; p *= x\n    p = 1\n    for i in range(len(nums)-1,-1,-1):\n        out[i] *= p; p *= nums[i]\n    return out","tests":"assert solve([1,2,3,4])==[24,12,8,6]; assert solve([0,2,0])==[0,0,0]","models":"","full":"def solve(nums):\n    out = [1]*len(nums)\n    p = 1\n    for i,x in enumerate(nums):\n        out[i] = p; p *= x\n    p = 1\n    for i in range(len(nums)-1,-1,-1):\n        out[i] *= p; p *= nums[i]\n    return out\n\n# Example and boundary checks\nassert solve([1,2,3,4])==[24,12,8,6]; assert solve([0,2,0])==[0,0,0]\nprint(\"Sample checks passed\")\n","canonical":4}},{"id":29,"name":"Longest Consecutive Sequence","difficulty":"Medium","pattern":"HashSet","topic":"Hash Maps & Hash Sets","lesson":{"description":"Return length of the longest consecutive integer sequence, regardless of input order.","example":"[100,4,200,1,3,2] → 4","hint":"Start only at values without a predecessor.","reason":"Each consecutive run has exactly one start. Scan each run once, rather than restarting from every element.","complexity":"O(n) expected time, O(n) space.","code":"def solve(nums):\n    a=set(nums); best=0\n    for x in a:\n        if x-1 not in a:\n            y=x\n            while y in a: y+=1\n            best=max(best,y-x)\n    return best","tests":"assert solve([100,4,200,1,3,2])==4; assert solve([])==0","models":"","full":"def solve(nums):\n    a=set(nums); best=0\n    for x in a:\n        if x-1 not in a:\n            y=x\n            while y in a: y+=1\n            best=max(best,y-x)\n    return best\n\n# Example and boundary checks\nassert solve([100,4,200,1,3,2])==4; assert solve([])==0\nprint(\"Sample checks passed\")\n","canonical":29}},{"id":30,"name":"Four Sum II","difficulty":"Medium","pattern":"HashMap pairs","topic":"Hash Maps & Hash Sets","lesson":{"description":"Count index quadruples taking one value from each of four arrays with sum zero.","example":"[1,2],[-2,-1],[-1,2],[0,2] → 2","hint":"Split four variables into two pair sums.","reason":"For each sum from the last two arrays, the negative sum must occur in the first two. Frequency counts preserve index multiplicity.","complexity":"O(n²) time and space for equal-length arrays.","code":"from collections import Counter\ndef solve(a,b,c,d):\n    cnt=Counter(x+y for x in a for y in b)\n    return sum(cnt[-x-y] for x in c for y in d)","tests":"assert solve([1,2],[-2,-1],[-1,2],[0,2])==2","models":"","full":"from collections import Counter\ndef solve(a,b,c,d):\n    cnt=Counter(x+y for x in a for y in b)\n    return sum(cnt[-x-y] for x in c for y in d)\n\n# Example and boundary checks\nassert solve([1,2],[-2,-1],[-1,2],[0,2])==2\nprint(\"Sample checks passed\")\n","canonical":30}},{"id":31,"name":"Maximum Average Subarray I","difficulty":"Easy","pattern":"Fixed","topic":"Sliding Window","lesson":{"description":"Find the largest average of any contiguous subarray of exactly k elements, 1 ≤ k ≤ n.","example":"[1,12,-5,-6,50,3],4 → 12.75","hint":"Maintain a fixed-width rolling sum.","reason":"Each shift removes one old element and adds one new element. Maximizing the sum also maximizes the average because k is constant.","complexity":"O(n) time, O(1) auxiliary space.","code":"def solve(a,k):\n    cur=sum(a[i] for i in range(k)); best=cur\n    for i in range(k,len(a)):\n        cur+=a[i]-a[i-k]; best=max(best,cur)\n    return best/k","tests":"assert solve([1,12,-5,-6,50,3],4)==12.75; assert solve([-2],1)==-2","models":"","full":"def solve(a,k):\n    cur=sum(a[i] for i in range(k)); best=cur\n    for i in range(k,len(a)):\n        cur+=a[i]-a[i-k]; best=max(best,cur)\n    return best/k\n\n# Example and boundary checks\nassert solve([1,12,-5,-6,50,3],4)==12.75; assert solve([-2],1)==-2\nprint(\"Sample checks passed\")\n","canonical":31}},{"id":32,"name":"Longest Substring Without Repeat","difficulty":"Medium","pattern":"Variable","topic":"Sliding Window","lesson":{"description":"Return the length of the longest contiguous substring with no repeated character.","example":"'abcabcbb' → 3","hint":"Store last seen positions.","reason":"When a character repeats inside the window, move the left boundary past its previous position. Never move left backwards.","complexity":"O(n) time, O(u) space.","code":"def solve(s):\n    last={}; l=best=0\n    for r,c in enumerate(s):\n        l=max(l,last.get(c,-1)+1); last[c]=r\n        best=max(best,r-l+1)\n    return best","tests":"assert solve('abcabcbb')==3; assert solve('abba')==2","models":"","full":"def solve(s):\n    last={}; l=best=0\n    for r,c in enumerate(s):\n        l=max(l,last.get(c,-1)+1); last[c]=r\n        best=max(best,r-l+1)\n    return best\n\n# Example and boundary checks\nassert solve('abcabcbb')==3; assert solve('abba')==2\nprint(\"Sample checks passed\")\n","canonical":17}},{"id":33,"name":"Longest Repeating Char Replacement","difficulty":"Medium","pattern":"Variable","topic":"Sliding Window","lesson":{"description":"For an uppercase string, replace at most k characters to make a contiguous substring all one letter; return max length.","example":"'AABABBA',1 → 4","hint":"Window length minus most common count is replacement cost.","reason":"Track the largest frequency seen; shrinking when the length exceeds this frequency plus k bounds the best possible length. A stale maximum may retain an invalid window but cannot create a new oversized record.","complexity":"O(n) time, O(26) space.","code":"from collections import Counter\ndef solve(s,k):\n    cnt=Counter(); l=mx=best=0\n    for r,c in enumerate(s):\n        cnt[c]+=1; mx=max(mx,cnt[c])\n        if r-l+1-mx>k: cnt[s[l]]-=1; l+=1\n        best=max(best,r-l+1)\n    return best","tests":"assert solve('AABABBA',1)==4; assert solve('ABAB',2)==4","models":"","full":"from collections import Counter\ndef solve(s,k):\n    cnt=Counter(); l=mx=best=0\n    for r,c in enumerate(s):\n        cnt[c]+=1; mx=max(mx,cnt[c])\n        if r-l+1-mx>k: cnt[s[l]]-=1; l+=1\n        best=max(best,r-l+1)\n    return best\n\n# Example and boundary checks\nassert solve('AABABBA',1)==4; assert solve('ABAB',2)==4\nprint(\"Sample checks passed\")\n","canonical":18}},{"id":34,"name":"Permutation in String","difficulty":"Medium","pattern":"Fixed","topic":"Sliding Window","lesson":{"description":"Determine whether s contains a contiguous permutation of nonempty pattern p. Use lowercase letters.","example":"'ab','eidbaooo' → True (p,s)","hint":"Compare character counts over windows of pattern length.","reason":"A substring is a permutation exactly if its 26 counts equal the pattern counts. Slide the window by adding and removing one character.","complexity":"O(n+m) time for fixed alphabet, O(26) space.","code":"def solve(p,s):\n    if len(p)>len(s): return False\n    a=[0]*26; b=[0]*26\n    for c in p: a[ord(c)-97]+=1\n    for i,c in enumerate(s):\n        b[ord(c)-97]+=1\n        if i>=len(p): b[ord(s[i-len(p)])-97]-=1\n        if i+1>=len(p) and a==b: return True\n    return False","tests":"assert solve('ab','eidbaooo'); assert not solve('ab','eidboaoo')","models":"","full":"def solve(p,s):\n    if len(p)>len(s): return False\n    a=[0]*26; b=[0]*26\n    for c in p: a[ord(c)-97]+=1\n    for i,c in enumerate(s):\n        b[ord(c)-97]+=1\n        if i>=len(p): b[ord(s[i-len(p)])-97]-=1\n        if i+1>=len(p) and a==b: return True\n    return False\n\n# Example and boundary checks\nassert solve('ab','eidbaooo'); assert not solve('ab','eidboaoo')\nprint(\"Sample checks passed\")\n","canonical":34}},{"id":35,"name":"Find All Anagrams in String","difficulty":"Medium","pattern":"Fixed","topic":"Sliding Window","lesson":{"description":"Return starting indices of all substrings in s that are permutations of nonempty lowercase pattern p.","example":"'cbaebabacd','abc' → [0,6]","hint":"Use the same fixed window as permutation inclusion.","reason":"Compare pattern and window count vectors at every full window. Each match identifies one valid starting index.","complexity":"O(n+m) time for fixed alphabet, O(26) auxiliary space.","code":"def solve(s,p):\n    a=[0]*26; b=[0]*26; out=[]\n    for c in p: a[ord(c)-97]+=1\n    for i,c in enumerate(s):\n        b[ord(c)-97]+=1\n        if i>=len(p): b[ord(s[i-len(p)])-97]-=1\n        if i+1>=len(p) and a==b: out.append(i-len(p)+1)\n    return out","tests":"assert solve('cbaebabacd','abc')==[0,6]; assert solve('abab','ab')==[0,1,2]","models":"","full":"def solve(s,p):\n    a=[0]*26; b=[0]*26; out=[]\n    for c in p: a[ord(c)-97]+=1\n    for i,c in enumerate(s):\n        b[ord(c)-97]+=1\n        if i>=len(p): b[ord(s[i-len(p)])-97]-=1\n        if i+1>=len(p) and a==b: out.append(i-len(p)+1)\n    return out\n\n# Example and boundary checks\nassert solve('cbaebabacd','abc')==[0,6]; assert solve('abab','ab')==[0,1,2]\nprint(\"Sample checks passed\")\n","canonical":35}},{"id":36,"name":"Minimum Window Substring","difficulty":"Hard","pattern":"Variable","topic":"Sliding Window","lesson":{"description":"Find the shortest substring of s containing all characters of t with their multiplicities, or empty if impossible.","example":"'ADOBECODEBANC','ABC' → 'BANC'","hint":"Expand until covered, then shrink while covered.","reason":"Track missing required occurrences. When none remain, shrinking explores every minimal candidate for the current right boundary until a required character is lost.","complexity":"O(n+m) time, O(u) space.","code":"from collections import Counter\ndef solve(s,t):\n    if not t: return ''\n    need=Counter(t); missing=len(t); l=0; best=(0,float('inf'))\n    for r,c in enumerate(s):\n        if need[c]>0: missing-=1\n        need[c]-=1\n        while missing==0:\n            if r-l+1<best[1]: best=(l,r-l+1)\n            need[s[l]]+=1\n            if need[s[l]]>0: missing+=1\n            l+=1\n    return '' if best[1]==float('inf') else s[best[0]:best[0]+best[1]]","tests":"assert solve('ADOBECODEBANC','ABC')=='BANC'; assert solve('a','aa')==''","models":"","full":"from collections import Counter\ndef solve(s,t):\n    if not t: return ''\n    need=Counter(t); missing=len(t); l=0; best=(0,float('inf'))\n    for r,c in enumerate(s):\n        if need[c]>0: missing-=1\n        need[c]-=1\n        while missing==0:\n            if r-l+1<best[1]: best=(l,r-l+1)\n            need[s[l]]+=1\n            if need[s[l]]>0: missing+=1\n            l+=1\n    return '' if best[1]==float('inf') else s[best[0]:best[0]+best[1]]\n\n# Example and boundary checks\nassert solve('ADOBECODEBANC','ABC')=='BANC'; assert solve('a','aa')==''\nprint(\"Sample checks passed\")\n","canonical":19}},{"id":37,"name":"Sliding Window Maximum","difficulty":"Hard","pattern":"Deque","topic":"Sliding Window","lesson":{"description":"Return maximum value in each contiguous window of length k, 1 ≤ k ≤ n.","example":"[1,3,-1,-3,5,3,6,7],3 → [3,3,5,5,6,7]","hint":"Keep candidate indices in decreasing value order.","reason":"Remove expired indices from the front and dominated values from the back. The front is always the maximum of the current window.","complexity":"O(n) time, O(k) auxiliary space.","code":"from collections import deque\ndef solve(a,k):\n    q=deque(); out=[]\n    for i,x in enumerate(a):\n        while q and q[0]<=i-k: q.popleft()\n        while q and a[q[-1]]<=x: q.pop()\n        q.append(i)\n        if i>=k-1: out.append(a[q[0]])\n    return out","tests":"assert solve([1,3,-1,-3,5,3,6,7],3)==[3,3,5,5,6,7]; assert solve([2,2],1)==[2,2]","models":"","full":"from collections import deque\ndef solve(a,k):\n    q=deque(); out=[]\n    for i,x in enumerate(a):\n        while q and q[0]<=i-k: q.popleft()\n        while q and a[q[-1]]<=x: q.pop()\n        q.append(i)\n        if i>=k-1: out.append(a[q[0]])\n    return out\n\n# Example and boundary checks\nassert solve([1,3,-1,-3,5,3,6,7],3)==[3,3,5,5,6,7]; assert solve([2,2],1)==[2,2]\nprint(\"Sample checks passed\")\n","canonical":37}},{"id":38,"name":"Binary Search","difficulty":"Easy","pattern":"Classic","topic":"Binary Search","lesson":{"description":"Find target in an ascending sorted array; return its index or -1.","example":"[-1,0,3,5,9,12],9 → 4","hint":"Halve the remaining interval.","reason":"If the midpoint is smaller than target, no earlier element can match; if larger, no later element can match.","complexity":"O(log n) time, O(1) space.","code":"def solve(a,t):\n    l,r=0,len(a)-1\n    while l<=r:\n        m=(l+r)//2\n        if a[m]==t: return m\n        if a[m]<t: l=m+1\n        else: r=m-1\n    return -1","tests":"assert solve([-1,0,3,5,9,12],9)==4; assert solve([],0)==-1","models":"","full":"def solve(a,t):\n    l,r=0,len(a)-1\n    while l<=r:\n        m=(l+r)//2\n        if a[m]==t: return m\n        if a[m]<t: l=m+1\n        else: r=m-1\n    return -1\n\n# Example and boundary checks\nassert solve([-1,0,3,5,9,12],9)==4; assert solve([],0)==-1\nprint(\"Sample checks passed\")\n","canonical":38}},{"id":39,"name":"Search a 2D Matrix","difficulty":"Medium","pattern":"Classic","topic":"Binary Search","lesson":{"description":"Search a rectangular matrix whose rows are sorted and each row starts above the previous row's last value.","example":"[[1,3,5],[7,9,11]],9 → True","hint":"Treat the matrix as a virtual sorted array.","reason":"Convert a flat index into row and column by divmod; binary search needs no actual flattening.","complexity":"O(log(mn)) time, O(1) space.","code":"def solve(a,t):\n    if not a or not a[0]: return False\n    n=len(a[0]); l,r=0,len(a)*n-1\n    while l<=r:\n        m=(l+r)//2; x=a[m//n][m%n]\n        if x==t: return True\n        if x<t: l=m+1\n        else: r=m-1\n    return False","tests":"assert solve([[1,3,5],[7,9,11]],9); assert not solve([[1,3]],2)","models":"","full":"def solve(a,t):\n    if not a or not a[0]: return False\n    n=len(a[0]); l,r=0,len(a)*n-1\n    while l<=r:\n        m=(l+r)//2; x=a[m//n][m%n]\n        if x==t: return True\n        if x<t: l=m+1\n        else: r=m-1\n    return False\n\n# Example and boundary checks\nassert solve([[1,3,5],[7,9,11]],9); assert not solve([[1,3]],2)\nprint(\"Sample checks passed\")\n","canonical":39}},{"id":40,"name":"Koko Eating Bananas","difficulty":"Medium","pattern":"Answer space","topic":"Binary Search","lesson":{"description":"Find the minimum integer eating speed to finish positive banana piles in h hours, one pile per hour, h ≥ pile count.","example":"[3,6,7,11],8 → 4","hint":"Feasibility is monotonic in speed.","reason":"The total hours at speed k is the sum of ceiling divisions. Faster speeds never need more hours, so binary-search the first feasible speed.","complexity":"O(n log M) time, O(1) space, M largest pile.","code":"def solve(piles,h):\n    l,r=1,max(piles)\n    while l<r:\n        m=(l+r)//2\n        if sum((x+m-1)//m for x in piles)<=h: r=m\n        else: l=m+1\n    return l","tests":"assert solve([3,6,7,11],8)==4; assert solve([9],1)==9","models":"","full":"def solve(piles,h):\n    l,r=1,max(piles)\n    while l<r:\n        m=(l+r)//2\n        if sum((x+m-1)//m for x in piles)<=h: r=m\n        else: l=m+1\n    return l\n\n# Example and boundary checks\nassert solve([3,6,7,11],8)==4; assert solve([9],1)==9\nprint(\"Sample checks passed\")\n","canonical":40}},{"id":41,"name":"Find Min in Rotated Array","difficulty":"Medium","pattern":"Rotated","topic":"Binary Search","lesson":{"description":"Find the minimum in a nonempty rotated ascending array of distinct integers.","example":"[3,4,5,1,2] → 1","hint":"Compare middle with rightmost value.","reason":"If middle exceeds the right endpoint, the rotation minimum is strictly to its right. Otherwise it lies at middle or earlier. The interval always contains the minimum.","complexity":"O(log n) time, O(1) space.","code":"def solve(a):\n    l,r=0,len(a)-1\n    while l<r:\n        m=(l+r)//2\n        if a[m]>a[r]: l=m+1\n        else: r=m\n    return a[l]","tests":"assert solve([3,4,5,1,2])==1; assert solve([1])==1","models":"","full":"def solve(a):\n    l,r=0,len(a)-1\n    while l<r:\n        m=(l+r)//2\n        if a[m]>a[r]: l=m+1\n        else: r=m\n    return a[l]\n\n# Example and boundary checks\nassert solve([3,4,5,1,2])==1; assert solve([1])==1\nprint(\"Sample checks passed\")\n","canonical":7}},{"id":42,"name":"Search in Rotated Array","difficulty":"Medium","pattern":"Rotated","topic":"Binary Search","lesson":{"description":"Find a target in a rotated ascending array of distinct values; return its index or -1.","example":"[4,5,6,7,0,1,2], 0 → 4","hint":"One half is always sorted.","reason":"Identify the sorted half and check if the target falls inside its bounds. Discard the other half if it does, otherwise discard the sorted half.","complexity":"O(log n) time, O(1) space.","code":"def solve(a,t):\n    l,r=0,len(a)-1\n    while l<=r:\n        m=(l+r)//2\n        if a[m]==t: return m\n        if a[l]<=a[m]:\n            if a[l]<=t<a[m]: r=m-1\n            else: l=m+1\n        else:\n            if a[m]<t<=a[r]: l=m+1\n            else: r=m-1\n    return -1","tests":"assert solve([4,5,6,7,0,1,2],0)==4; assert solve([],3)==-1","models":"","full":"def solve(a,t):\n    l,r=0,len(a)-1\n    while l<=r:\n        m=(l+r)//2\n        if a[m]==t: return m\n        if a[l]<=a[m]:\n            if a[l]<=t<a[m]: r=m-1\n            else: l=m+1\n        else:\n            if a[m]<t<=a[r]: l=m+1\n            else: r=m-1\n    return -1\n\n# Example and boundary checks\nassert solve([4,5,6,7,0,1,2],0)==4; assert solve([],3)==-1\nprint(\"Sample checks passed\")\n","canonical":8}},{"id":43,"name":"Time Based Key-Value Store","difficulty":"Medium","pattern":"BS on value","topic":"Binary Search","lesson":{"description":"Design a store supporting set(key,value,timestamp) in increasing timestamp order per key and get(key,t) returning latest value at or before t, or empty.","example":"set('a','x',2); get('a',3) → 'x'","hint":"Binary search the history for each key.","reason":"An append-only sorted timestamp list supports upper-bound lookup. The element immediately before the insertion point is the latest eligible version.","complexity":"O(1) amortized set, O(log m) get, O(N) storage.","code":"from collections import defaultdict\nfrom bisect import bisect_right\nclass TimeMap:\n    def __init__(self): self.times=defaultdict(list); self.values=defaultdict(list)\n    def set(self,key,value,t): self.times[key].append(t); self.values[key].append(value)\n    def get(self,key,t):\n        i=bisect_right(self.times.get(key,[]),t)-1\n        return self.values[key][i] if i>=0 else ''","tests":"t=TimeMap(); t.set('a','x',2); t.set('a','y',5); assert t.get('a',3)=='x'; assert t.get('a',1)==''; assert t.get('a',5)=='y'","models":"","full":"from collections import defaultdict\nfrom bisect import bisect_right\nclass TimeMap:\n    def __init__(self): self.times=defaultdict(list); self.values=defaultdict(list)\n    def set(self,key,value,t): self.times[key].append(t); self.values[key].append(value)\n    def get(self,key,t):\n        i=bisect_right(self.times.get(key,[]),t)-1\n        return self.values[key][i] if i>=0 else ''\n\n# Example and boundary checks\nt=TimeMap(); t.set('a','x',2); t.set('a','y',5); assert t.get('a',3)=='x'; assert t.get('a',1)==''; assert t.get('a',5)=='y'\nprint(\"Sample checks passed\")\n","canonical":43}},{"id":44,"name":"Median of Two Sorted Arrays","difficulty":"Hard","pattern":"Partition","topic":"Binary Search","lesson":{"description":"Return the median of two sorted arrays, not both empty, in logarithmic time.","example":"[1,3],[2] → 2","hint":"Partition the shorter array so both left halves contain half the values.","reason":"A valid partition has both left maxima no greater than opposite right minima. Binary search adjusts the shorter partition. Middle values come from the boundary, with sentinels for empty sides.","complexity":"O(log(min(m,n)+1)) time, O(1) space.","code":"def solve(a,b):\n    if len(a)>len(b): a,b=b,a\n    m,n=len(a),len(b); half=(m+n+1)//2; l,r=0,m\n    while l<=r:\n        i=(l+r)//2; j=half-i\n        al=a[i-1] if i else -float('inf'); ar=a[i] if i<m else float('inf')\n        bl=b[j-1] if j else -float('inf'); br=b[j] if j<n else float('inf')\n        if al>br: r=i-1\n        elif bl>ar: l=i+1\n        else: return max(al,bl) if (m+n)%2 else (max(al,bl)+min(ar,br))/2","tests":"assert solve([1,3],[2])==2; assert solve([1,2],[3,4])==2.5; assert solve([],[1])==1","models":"","full":"def solve(a,b):\n    if len(a)>len(b): a,b=b,a\n    m,n=len(a),len(b); half=(m+n+1)//2; l,r=0,m\n    while l<=r:\n        i=(l+r)//2; j=half-i\n        al=a[i-1] if i else -float('inf'); ar=a[i] if i<m else float('inf')\n        bl=b[j-1] if j else -float('inf'); br=b[j] if j<n else float('inf')\n        if al>br: r=i-1\n        elif bl>ar: l=i+1\n        else: return max(al,bl) if (m+n)%2 else (max(al,bl)+min(ar,br))/2\n\n# Example and boundary checks\nassert solve([1,3],[2])==2; assert solve([1,2],[3,4])==2.5; assert solve([],[1])==1\nprint(\"Sample checks passed\")\n","canonical":44}},{"id":45,"name":"Split Array Largest Sum","difficulty":"Hard","pattern":"Answer space","topic":"Binary Search","lesson":{"description":"Split a nonnegative array into exactly k nonempty contiguous parts, minimizing the largest part sum.","example":"[7,2,5,10,8],2 → 18","hint":"Binary-search the maximum allowed part sum.","reason":"Greedily fill a part until the next value would exceed the cap; this minimizes the number of parts for that cap. If at most k parts suffice, splitting further is possible without raising the cap.","complexity":"O(n log(sum(a)-max(a)+1)) time, O(1) space.","code":"def solve(a,k):\n    l,r=max(a),sum(a)\n    while l<r:\n        cap=(l+r)//2; parts=1; cur=0\n        for x in a:\n            if cur+x>cap: parts+=1; cur=0\n            cur+=x\n        if parts<=k: r=cap\n        else: l=cap+1\n    return l","tests":"assert solve([7,2,5,10,8],2)==18; assert solve([1,2,3],3)==3","models":"","full":"def solve(a,k):\n    l,r=max(a),sum(a)\n    while l<r:\n        cap=(l+r)//2; parts=1; cur=0\n        for x in a:\n            if cur+x>cap: parts+=1; cur=0\n            cur+=x\n        if parts<=k: r=cap\n        else: l=cap+1\n    return l\n\n# Example and boundary checks\nassert solve([7,2,5,10,8],2)==18; assert solve([1,2,3],3)==3\nprint(\"Sample checks passed\")\n","canonical":45}},{"id":46,"name":"Invert Binary Tree","difficulty":"Easy","pattern":"DFS","topic":"Trees","lesson":{"description":"Invert a binary tree by swapping left and right children at every node. Return its root.","example":"[4,2,7,1,3,6,9] → [4,7,2,9,6,3,1]","hint":"Invert both subtrees recursively.","reason":"Each recursive call returns an inverted subtree; assigning them to opposite children inverts the current node too.","complexity":"O(n) time, O(h) recursion space.","code":"def solve(root):\n    if root:\n        root.left,root.right=solve(root.right),solve(root.left)\n    return root","tests":"assert level(solve(tree([4,2,7,1,3,6,9])))==[4,7,2,9,6,3,1]","models":"from collections import deque\nclass TreeNode:\n    def __init__(self,val=0,left=None,right=None): self.val=val; self.left=left; self.right=right\nclass ListNode:\n    def __init__(self,val=0,next=None): self.val=val; self.next=next\nclass Node:\n    def __init__(self,val=0,neighbors=None): self.val=val; self.neighbors=neighbors if neighbors is not None else []\ndef tree(values):\n    if not values or values[0] is None: return None\n    root=TreeNode(values[0]); q=deque([root]); it=iter(values[1:])\n    while q:\n        node=q.popleft()\n        for side in ('left','right'):\n            v=next(it,None)\n            if v is not None:\n                child=TreeNode(v); setattr(node,side,child); q.append(child)\n    return root\ndef level(root):\n    q=deque([root]); out=[]\n    while q:\n        node=q.popleft(); out.append(node.val if node else None)\n        if node: q.extend([node.left,node.right])\n    while out and out[-1] is None: out.pop()\n    return out\ndef linked(values):\n    root=None\n    for v in reversed(values): root=ListNode(v,root)\n    return root\ndef unlinked(root):\n    out=[]\n    while root: out.append(root.val); root=root.next\n    return out\n","full":"from collections import deque\nclass TreeNode:\n    def __init__(self,val=0,left=None,right=None): self.val=val; self.left=left; self.right=right\nclass ListNode:\n    def __init__(self,val=0,next=None): self.val=val; self.next=next\nclass Node:\n    def __init__(self,val=0,neighbors=None): self.val=val; self.neighbors=neighbors if neighbors is not None else []\ndef tree(values):\n    if not values or values[0] is None: return None\n    root=TreeNode(values[0]); q=deque([root]); it=iter(values[1:])\n    while q:\n        node=q.popleft()\n        for side in ('left','right'):\n            v=next(it,None)\n            if v is not None:\n                child=TreeNode(v); setattr(node,side,child); q.append(child)\n    return root\ndef level(root):\n    q=deque([root]); out=[]\n    while q:\n        node=q.popleft(); out.append(node.val if node else None)\n        if node: q.extend([node.left,node.right])\n    while out and out[-1] is None: out.pop()\n    return out\ndef linked(values):\n    root=None\n    for v in reversed(values): root=ListNode(v,root)\n    return root\ndef unlinked(root):\n    out=[]\n    while root: out.append(root.val); root=root.next\n    return out\n\ndef solve(root):\n    if root:\n        root.left,root.right=solve(root.right),solve(root.left)\n    return root\n\n# Example and boundary checks\nassert level(solve(tree([4,2,7,1,3,6,9])))==[4,7,2,9,6,3,1]\nprint(\"Sample checks passed\")\n","canonical":46}},{"id":47,"name":"Maximum Depth of Binary Tree","difficulty":"Easy","pattern":"DFS","topic":"Trees","lesson":{"description":"Return maximum root-to-leaf depth in nodes; an empty tree has depth zero.","example":"[3,9,20,null,null,15,7] → 3","hint":"Depth is one plus deeper subtree.","reason":"The longest path must go through one of the two children; recursively compute both depths.","complexity":"O(n) time, O(h) stack.","code":"def solve(root):\n    return 1+max(solve(root.left),solve(root.right)) if root else 0","tests":"assert solve(tree([3,9,20,None,None,15,7]))==3; assert solve(None)==0","models":"from collections import deque\nclass TreeNode:\n    def __init__(self,val=0,left=None,right=None): self.val=val; self.left=left; self.right=right\nclass ListNode:\n    def __init__(self,val=0,next=None): self.val=val; self.next=next\nclass Node:\n    def __init__(self,val=0,neighbors=None): self.val=val; self.neighbors=neighbors if neighbors is not None else []\ndef tree(values):\n    if not values or values[0] is None: return None\n    root=TreeNode(values[0]); q=deque([root]); it=iter(values[1:])\n    while q:\n        node=q.popleft()\n        for side in ('left','right'):\n            v=next(it,None)\n            if v is not None:\n                child=TreeNode lesson":{"description":"Find maximum sum of any nonempty simple path in a nonempty binary tree; path may start and end anywhere.","example":"[-10,9,20,null,null,15,7] → 42","hint":"Distinguish upward gain from a complete path.","reason":"A path through a node can take positive gains from both children, but a path returned to its parent can take only one branch. Update global best for the two-branch case.","complexity":"O(n) time, O(h) stack.","code":"def solve(root):\n    best=-float('inf')\n    def dfs(x):\n        nonlocal best\n        if not x: return 0\n        l=max(0,dfs(x.left)); r=max(0,dfs(x.right))\n        best=max(best,x.val+l+r)\n        return x.val+max(l,r)\n    dfs(root); return best","tests":"assert solve(tree([-10,9,20,None,None,15,7]))==42; assert solve(tree([-3]))==-3","models":"from collections import deque\nclass TreeNode:\n    def __init__(self,val=0,left=None,right=None): self.val=val; self.left=left; self.right=right\nclass ListNode:\n    def __init__(self,val=0,next=None): self.val=val; self.next=next\nclass Node:\n    def __init__(self,val=0,neighbors=None): self.val=val; self.neighbors=neighbors if neighbors is not None else []\ndef tree(values):\n    if not values or values[0] is None: return None\n    root=TreeNode(values[0]); q=deque([root]); it=iter(values[1:])\n    while q:\n        node=q.popleft()\n        for side in ('left','right'):\n            v=next(it,None)\n            if v is not None:\n                child=TreeNode(v); setattr(node,side,child); q.append(child)\n    return root\ndef level(root):\n    q=deque([root]); out=[]\n    while q:\n        node=q.popleft(); out.append(node.val if node else None)\n        if node: q.extend([node.left,node.right])\n    while out and out[-1] is None: out.pop()\n    return out\ndef linked(values):\n    root=None\n    for v in reversed(values): root=ListNode(v,root)\n    return root\ndef unlinked(root):\n    out=[]\n    while root: out.append(root.val); root=root.next\n    return out\n ext preorder value as root. Its index in inorder separates left and right ranges, which recursively consume their preorder segments.","complexity":"O(n) time, O(n) index map plus O(h) stack.","code":"def solve(pre,ino):\n    pos={v:i for i,v in enumerate(ino)}; it=iter(pre)\n    def build(l,r):\n        if l>=r: return None\n        v=next(it); m=pos[v]; x=TreeNode(v)\n        x.left=build(l,m); x.right=build(m+1,r); return x\n    return build(0,len(ino))","tests":"assert level(solve([3,9,20,15,7],[9,3,15,20,7]))==[3,9,20,None,None,15,7]","models":"from collections import deque\nclass TreeNode:\n    def __init__(self,val=0,left=None,right=None): self.val=val; self.left=left; self.right=right\nclass ListNode:\n    def __init__(self,val=0,next=None): self.val=val; self.next=next\nclass Node:\n    def __init__(self,val=0,neighbors=None): self.val=val; self.neighbors=neighbors if neighbors is not None else []\ndef tree(values):\n    if not values or values[0] is None: return None\n    root=TreeNode(values[0]); q=deque([root]); it=iter(values[1:])\n    while q:\n        node=q.popleft()\n        for side in ('left','right'):\n            v=next(it,None)\n            if v is not None:\n                child=TreeNode(v); setattr(node,side,child); q.append(child)\n    return root\ndef level(root):\n    q=deque([root]); out=[]\n    while q:\n        node=q.popleft(); out.append(node.val if node else None)\n        if node: q.extend([node.left,node.right])\n    while out and out[-1] is None: out.pop()\n    return out\ndef linked(values):\n    root=None\n    for v in reversed(values): root=ListNode(v,root)\n    return root\ndef unlinked(root):\n    out=[]\n    while root: out.append(root.val); root=root.next\n    return out\n","full":"from collections import deque\nclass TreeNode:\n    def __init__(self,val=0,left=None,right=None): self.val=val; self.left=left; self.right=right\nclass ListNode:\n    def __init__(self,val=0,next=None): self.val=val; self.next=next\nclass Node:\n    def __init__(self,val=0,neighbors=None): self.val=val; self.neighbors=neighbors if neighbors is not None else []\ndef tree(values):\n    if not values or values[0] is None: return None\n    root=TreeNode(values[0]); q=deque([root]); it=iter(values[1:])\n    while q:\n        node=q.popleft()\n        for side in ('left','right'):\n            v=next(it,None)\n            if v is not None:\n                child=TreeNode(v); setattr(node,side,child); q.append(child)\n    return root\ndef level(root):\n    q=deque([root]); out=[]\n    while q:\n        node=q.popleft(); out.append(node.val if node else None)\n        if node: q.extend([node.left,node.right])\n    while out and out[-1] is None: out.pop()\n    return out\ndef linked(values):\n    root=None\n    for v in reversed(values): root=ListNode(v,root)\n    return root\ndef unlinked(root):\n    out=[]\n    while root: out.append(root.val); root=root.next\n    return out\n\ndef solve(pre,ino):\n    pos={v:i for i,v in enumerate(ino)}; it=iter(pre)\n    def build(l,r):\n        if l>=r: return None\n        v=next(it); m=pos[v]; x=TreeNode(v)\n        x.left=build(l,m); x.right=build(m+1,r); return x\n    return build(0,len(ino))\n\n# Example and boundary checks\nassert level(solve([3,9,20,15,7],[9,3,15,20,7]))==[3,9,20,None,None,15,7]\nprint(\"Sample checks passed\")\n","canonical":59}},{"id":60,"name":"Maximum Width of Binary Tree","difficulty":"Medium","pattern":"BFS with indices","topic":"Trees","lesson":{"description":"Return maximum tree width including missing slots between the outermost non-null nodes of each level.","example":"[1,3,2,5,3,null,9] → 4","hint":"Index nodes as in a complete binary tree.","reason":"The distance between leftmost and rightmost indices plus one counts missing slots. Normalize indices each level to avoid unnecessary growth.","complexity":"O(n) time, O(w) queue space; integer arithmetic depends on index width.","code":"from collections import deque\ndef solve(root):\n    if not root: return 0\n    q=deque([(root,0)]); best=0\n    while q:\n        base=q[0][1]; best=max(best,q[-1][1]-base+1)\n        for _ in range(len(q)):\n            x,i=q.popleft(); i-=base\n            if x.left: q.append((x.left,2*i))\n            if x.right: q.append((x.right,2*i+1))\n    return best","tests":"assert solve(tree([1,3,2,5,3,None,9]))==4","models":"from collections import deque\nclass TreeNode:\n    def __init__(self,val=0,left=None,right=None): self.val=val; self.left=left; self.right=right\nclass ListNode:\n    def __init__(self,val=0,next=None): self.val=val; self.next=next\nclass Node:\n    def __init__(self,val=0,neighbors=None): self.val=val; self.neighbors=neighbors if neighbors is not None else []\ndef tree(values):\n    if not values or values[0] is None: return None\n    root=TreeNode(values[0]); q=deque([root]); it=iter(values[1:])\n    while q:\n        node=q.popleft()\n        for side in ('left','right'):\n            v=next(it,None)\n            if v is not None:\n                child=TreeNode(v); setattr(node,side,child); q.append(child)\n    return root\ndef level(root):\n    q=deque([root]); out=[]\n    while q:\n        node=q.popleft(); out.append(node.val if node else None)\n        if node: q.extend([node.left,node.right])\n    while out and out[-1] is None: out.pop()\n    return out\ndef linked(values):\n    root=None\n    for v in reversed(values): root=ListNode(v,root)\n    return root\ndef unlinked(root):\n    out=[]\n    while root: out.append(root.val); root=root.next\n    return out\n","full":"from collections import deque\nclass TreeNode:\n    def __init__(self,val=0,left=None,right=None): self.val=val; self.left=left; self.right=right\nclass ListNode:\n    def __init__(self,val=0,next=None): self.val=val; self.next=next\nclass Node:\n    def __init__(self,val=0,neighbors=None): self.val=val; self.neighbors=neighbors if neighbors is not None else []\ndef tree(values):\n    if not values or values[0] is None: return None       while st:\n                x,y=st.pop()\n                for a,b in [(x+1,y),(x-1,y),(x,y+1),(x,y-1)]:\n                    if 0<=a<m and 0<=b<n and g[a][b]=='1':\n                        g[a][b]='0'; st.append((a,b))\n    return count","tests":"assert solve([list('110'),list('001')])==2; assert solve([])==0","models":"","full":"def solve(g):\n    if not g: return 0\n    m,n=len(g),len(g[0]); count=0\n    for i in range(m):\n        for j in range(n):\n            if g[i][j]!='1': continue\n            count+=1; g[i][j]='0'; st=[(i,j)]\n            while st:\n                x,y=st.pop()\n                for a,b in [(x+1,y),(x-1,y),(x,y+1),(x,y-1)]:\n                    if 0<=a<m and 0<=b<n and g[a][b]=='1':\n                        g[a][b]='0'; st.append((a,b))\n    return count\n\n# Example and boundary checks\nassert solve([list('110'),list('001')])==2; assert solve([])==0\nprint(\"Sample checks passed\")\n","canonical":61}},{"id":62,"name":"Clone Graph","difficulty":"Medium","pattern":"DFS + HashMap","topic":"Graphs","lesson":{"description":"Deep-copy a connected undirected graph given a starting node; preserve values and neighbor links, including cycles.","example":"Node 1 ↔ node 2 → distinct cloned nodes linked both ways","hint":"Map originals to clones before exploring edges.","reason":"Creating a clone before recursion prevents revisiting cycles; every neighbor reference points to its unique copied counterpart.","complexity":"O(V+E) time, O(V) auxiliary space plus copied graph.","code":"from collections import deque\ndef solve(node):\n    if not node: return None\n    copies={node:Node(node.val)}; q=deque([node])\n    while q:\n        x=q.popleft()\n        for y in x.neighbors:\n            if y not in copies: copies[y]=Node(y.val); q.append(y)\n            copies[x].neighbors.append(copies[y])\n    return copies[node]","tests":"a,b=Node(1),Node(2); a.neighbors=[b]; b.neighbors=[a]; c=solve(a); assert c is not a and c.val==1 and c.neighbors[0] is not b and c.neighbors[0].neighbors[0] is c","models":"from collections import deque\nclass TreeNode:\n    def __init__(self,val=0,left=None,right=None): self.val=val; self.left=left; self.right=right\nclass ListNode:\n    def __init__(self,val=0,next=None): self.val=val; self.next=next\nclass Node:\n    def __init__(self,val=0,neighbors=None): self.val=val; self.neighbors=neighbors if neighbors is not None else []\ndef tree(values):\n    if not values or values[0] is None: return None\n    root=TreeNode(values[0]); q=deque([root]); it=iter(values[1:])\n    while q:\n        node=q.popleft()\n        for side in ('left','right'):\n            v=next(it,None)\n            if v is not None:\n                child=TreeNode(v); setattr(node,side,child); q.append(child)\n    return root\ndef level(root):\n    q=deque([root]); out=[]\n    while q:\n        node=q.popleft(); out.append(node.val if node else None)\n        if node: q.extend([node.left,node.right])\n    while out and out[-1] is None: out.pop()\n    return out\ndef linked(values):\n    root=None\n    for v in reversed(values): root=ListNode(v,root)\n    return root\ndef unlinked(root):\n    out=[]\n    while root: out.append(root.val); root=root.next\n    return out\n","full":"from collections import deque\nclass TreeNode:\n    def __init__(self,val=0,left=None,right=None): self.val=val; self.left=left; self.right=right\nclass ListNode:\n    def __init__(self,val=0,next=None): self.val=val; self.next=next\nclass Node:\n    def __init__(self,val=0,neighbors=None): self.val=val; self.neighbors=neighbors if neighbors is not None else []\ndef tree(values):\n    if not values or values[0] is None: return None\n    root=TreeNode(values[0]); q=deque([root]); it=iter(values[1:])\n    while q:\n        node=q.popleft()\n        for side in ('left','right'):\n            v=next(it,None)\n            if v is not None:\n                child=TreeNode(v); setattr(node,side,child); q.append(child)\n    return root\ndef level(root):\n    q=deque([root]); out=[]\n    while q:\n        node=q.popleft(); out.append(node.val if node else None)\n        if node: q.extend([node.left,node.right])\n    while out and out[-1] is None: out.pop()\n    return out\ndef linked(values):\n    root=None\n    for v in reversed(values): root=ListNode(v,root)\n    return root\ndef unlinked(root):\n    out=[]\n    while root: out.append(root.val); root=root.next\n    return out\n\nfrom collections import deque\ndef solve(node):\n    if not node: return None\n    copies={node:Node(node.val)}; q=deque([node])\n    while q:\n        x=q.popleft()\n        for y in x.neighbors:\n            if y not in copies: copies[y]=Node(y.val); q.append(y)\n            copies[x].neighbors.append(copies[y])\n    return copies[node]\n\n# Example and boundary checks\na,b=Node(1),Node(2); a.neighbors=[b]; b.neighbors=[a]; c=solve(a); assert c is not a and c.val==1 and c.neighbors[0] is not b and c.neighbors[0].neighbors[0] is c\nprint(\"Sample checks passed\")\n","canonical":62}},{"id":63,"name":"Max Area of Island","difficulty":"Medium","pattern":"DFS","topic":"Graphs","lesson":{"description":"Return largest four-connected island area in an integer 0/1 grid, zero if no land.","example":"[[1,1,0],[0,1,0]] → 3","hint":"Count cells during flood-fill.","reason":"Each marked cell belongs to exactly one component; count each flood-fill and retain the largest. Mutates input.","complexity":"O(mn) time and O(mn) worst-case stack.","code":"def solve(g):\n    if not g: return 0\n    m,n=len(g),len(g[0]); best=0\n    for i in range(m):\n        for j in range(n):\n            if not g[i][j]: continue\n            st=[(i,j)]; g[i][j]=0; area=0\n            while st:\n                x,y=st.pop(); area+=1\n                for a,b in [(x+1,y),(x-1,y),(x,y+1),(x,y-1)]:\n                    if 0<=a<m and 0<=b<n and g[a][b]:\n                        g[a][b]=0; st.append((a,b))\n            best=max(best,area)\n    return best","tests":"assert solve([[1,1,0],[0,1,0]])==3; assert solve([[0]])==0","models":"","full":"def solve(g):\n    if not g: return 0\n    m,n=len(g),len(g[0]); best=0\n    for i in range(m):\n        for j in range(n):\n            if not g[i][j]: continue\n            st=[(i,j)]; g[i][j]=0; area=0\n            while st:\n                x,y=st.pop(); area+=1\n                for a,b in [(x+1,y),(x-1,y),(x,y+1),(x,y-1)]:\n                    if 0<=a<m and 0<=b<n and g[a][b]:\n                        g[a][b]=0; st.append((a,b))\n            best=max(best,area)\n    return best\n\n# Example and boundary checks\nassert solve([[1,1,0],[0,1,0]])==3; assert solve([[0]])==0\nprint(\"Sample checks passed\")\n","canonical":63}},{"id":64,"name":"Pacific Atlantic Water Flow","difficulty":"Medium","pattern":"Multi-source BFS","topic":"Graphs","lesson":{"description":"Return cells from which water can reach both the top/left ocean and bottom/right ocean, flowing to equal or lower adjacent heights.","example":"[[1,2],[4,3]] → [[0,1],[1,0],[1,1]]","hint":"Reverse flow from each ocean uphill.","reason":"Forward reachability to an ocean equals reverse reachability from its border. Intersect the two visited sets.","complexity":"O(mn) time and space.","code":"from collections import deque\ndef solve(h):\n    if not h or not h[0]: return []\n    m,n=len(h),len(h[0])\n    def reach(starts):\n        seen=set(starts); q=deque(seen)\n        while q:\n            x,y=q.popleft()\n            for a,b in [(x+1,y),(x-1,y),(x,y+1),(x,y-1)]:\n                if 0<=a<m and 0<=b<n and (a,b) not in seen and h[a][b]>=h[x][y]:\n                    seen.add((a,b)); q.append((a,b))\n        return seen\n    p=reach([(0,j) for j in range(n)]+[(i,0) for i in range(m)])\n    a=reach([(m-1,j) for j in range(n)]+[(i,n-1) for i in range(m)])\n    return [list(x) for x in p&a]","tests":"assert sorted(solve([[1,2],[4,3]]))==[[0,1],[1,0],[1,1]]","models":"","full":"from collections import deque\ndef solve(h):\n    if not h or not h[0]: return []\n    m,n=len(h),len(h[0])\n    def reach(starts):\n        seen=set(starts); q=deque(seen)\n        while q:\n            x,y=q.popleft()\n            for a,b in [(x+1,y),(x-1,y),(x,y+1),(x,y-1)]:\n                if 0<=a<m and 0<=b<n and (a,b) not in seen and h[a][b]>=h[x][y]:\n                    seen.add((a,b)); q.append((a,b))\n        return seen\n    p=reach([(0,j) for j in range(n)]+[(i,0) for i in range(m)])\n    a=reach([(m-1,j) for j in range(n)]+[(i,n-1) for i in range(m)])\n    return [list(x) for x in p&a]\n\n# Example and boundary checks\nassert sorted(solve([[1,2],[4,3]]))==[[0,1],[1,0],[1,1]]\nprint(\"Sample checks passed\")\n","canonical":64}},{"id":65,"name":"Surrounded Regions","difficulty":"Medium","pattern":"BFS from border","topic":"Graphs","lesson":{"description":"Change 'O' cells fully enclosed by 'X' to 'X'; border-connected O cells survive. Mutate board.","example":"[['X','X','X'],['X','O','X'],['X','X','X']] → all X","hint":"Start from the border, not interior.","reason":"Flood-fill all O cells reachable from a border and mark them safe. Every other O is enclosed; restore safe markers after flipping.","complexity":"O(mn) time and space.","code":"from collections import deque\ndef solve(g):\n    if not g or not g[0]: return\n    m,n=len(g),len(g[0]); q=deque()\n    def add(i,j):\n        if 0<=i<m and 0<=j<n and g[i][j]=='O': g[i][j]='#'; q.append((i,j))\n    for i in range(m): add(i,0); add(i,n-1)\n    for j in range(n): add(0,j); add(m-1,j)\n    while q:\n        i,j=q.popleft()\n        for x,y in [(i+1,j),(i-1,j),(i,j+1),(i,j-1)]: add(x,y)\n    for i in range(m):\n        for j in range(n): g[i][j]='O' if g[i][j]=='#' else 'X'","tests":"g=[list('XXX'),list('XOX'),list('XXX')]; solve(g); assert g==[list('XXX')]*3; g=[['O']]; solve(g); assert g==[['O']]","models":"","full":"from collections import deque\ndef solve(g):\n    if not g or not g[0]: return\n    m,n=len(g),len(g[0]); q=deque()\n    def add(i,j):\n        if 0<=i<m
